y to survive in the wild in a state like Florida than they are in a state like Ohio or Montana?\n________","为什么在佛罗里达州这样的地方，异宠比在俄亥俄州或蒙大拿州更容易在野外存活？"],"ans":["because Florida’s climate is warmer, wetter and more tropical","因为佛罗里达州更暖、更湿，更接近热带气候。"]},{"n":6,"ask":["Do you think that abandoned exotic animals will continue to be a problem in Florida? Explain your answer.\n________","你认为被遗弃的异宠会继续给佛罗里达州带来麻烦吗？请说明理由。"],"ans":["Answers will vary.","答案可以不同。"]},{"n":7,"ask":["How would you define the term *invasive species*?\n________","你会怎样定义 invasive species（入侵物种）？"],"ans":["Possible answer: nonnative species that have a negative effect on the local environment","参考答案：对当地环境产生不利影响的外来物种。"]},{"n":8,"ask":["In paragraph 2, *exotic* means\n________","第 2 段的 exotic 是什么意思？"],"ans":["unusual; from another part of the world","少见的，来自世界其他地方的。"]},{"n":9,"ask":["Would you ever purchase an exotic pet? Why or why not?\n________","你会买异宠吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P044","title":["The Everlasting Beauty of the Everglades","大沼泽地不朽的美"],"lead":["Why is the Everglades considered to be such a unique area of the country?","为什么说大沼泽地在美国独具特色？"],"exercise":"P045","genre":"说明文","family":"info","parts":[{"n":1,"t":["The Florida Everglades is one of the most diverse areas of the country. Within the Everglades you can find swamps, marshes, grasslands, and dense forests. Hundreds of species of plants and animals make their homes in the Everglades. Some are found in few other places in the world. About 1.5 million acres of the Everglades are National Park land. Within the park, there are more than 350 species of birds, 40 species of mammals, and 50 species of reptiles!","佛罗里达大沼泽地是美国生态最多样的地区之一。那里有林木沼泽、草本沼泽、草原和茂密的森林。数百种动植物栖居于此，其中有些在世界上其他地方很少见。大沼泽地约有 150 万英亩属于国家公园。园内有 350 多种鸟类、40 种哺乳动物和 50 种爬行动物！"],"type":"paragraph"},{"n":2,"t":["Scientists believe that the Everglades formed about eight to ten thousand years ago at the end of the last ice age. When the glaciers began to melt, they caused the sea level to rise and turned the low-lying area of the Everglades into swampland. When nearby Lake Okeechobee floods after heavy rains, the water level in the Everglades rises as well.","科学家认为，大沼泽地大约形成于八千至一万年前，也就是上一个冰期结束时。冰川开始融化后，海平面上升，把大沼泽地这片低地变成了沼泽。附近的奥基乔比湖在暴雨过后涨水漫出时，大沼泽地的水位也会上升。"],"type":"paragraph"},{"n":3,"t":["The weather is characterized by hot, wet summers and warm but dry winters. The temperature in the Everglades rarely drops below 60 degrees, and the average rainfall is often more than 50 inches per year. This wet, mild weather is the primary reason that plant and animal life is so abundant there.","这里夏季炎热湿润，冬季温暖干燥。气温很少低于华氏 60 度，年平均降雨量通常超过 50 英寸。这里的动植物之所以如此丰富，主要就在于气候温和湿润。"],"type":"paragraph"},{"n":4,"t":["As prevalent as living creatures appear to be in this lush landscape, the ecosystem of the Everglades must maintain its delicate balance. During the 20th century, canals were built which lowered the level of Lake Okeechobee. The lake overflowed much less frequently, which affected the water levels in the Everglades.","这片草木茂盛的土地上，生物看似随处可见，但大沼泽地生态系统必须维持脆弱的平衡。20 世纪，人们修建了运河，使奥基乔比湖水位下降。湖水漫出的次数少多了，影响了大沼泽地的水位。"],"type":"paragraph"},{"n":5,"t":["People also began looking for ways to farm the land surrounding the Everglades. This required using much of the Everglades’ water supply. In addition, the pollution from fertilizers and pesticides used in farming began to run off into the water.","人们也开始想办法耕种大沼泽地周边的土地。这需要消耗大沼泽地不少的水。此外，耕作时使用的化肥和农药形成的污染物，也开始随地表径流流入水中。"],"type":"paragraph"},{"n":6,"t":["New types of flora were introduced, which also affected the balance of the ecosystem. The tiny seeds of the melaleuca tree were sprinkled from salt shakers into the Everglades from low-flying airplanes because melaleuca trees consume a great deal of water. People hoped that the trees would dry up the land and make the Everglades suitable for development. They also planned to use the trees for timber. The wood turned out to be difficult to harvest, so the trees just continued to grow, crowding out other species that are indigenous to the Everglades.","引进新的植物种类，也影响了生态系统的平衡。由于白千层耗水量很大，人们乘飞机低空飞行，用撒盐瓶把它的细小种子撒进大沼泽地。他们希望这些树能把土地吸干，使大沼泽地可以开发，还计划把它们用作木材。后来发现这些树难以采伐，它们便一直长下去，挤占了大沼泽地原生物种的生存空间。"],"type":"paragraph"},{"n":7,"t":["The Everglades National Park was founded in 1947 in an attempt to preserve the land and the plant and animal life. The area was not large enough to make a significant impact, so in 1989, the government expanded the park. In 1996, an act was passed allowing the government to purchase farmland, which could then be returned to natural swampy marshland.","为了保护当地的土地和动植物，人们于 1947 年建立了大沼泽地国家公园。园区太小，保护效果并不显著，因此 1989 年政府扩大了公园范围。1996 年，一项法案获得通过，允许政府收购农田，再把它们恢复为天然沼泽湿地。"],"type":"paragraph"},{"n":8,"t":["These efforts are important because there are so many species to protect within the Everglades. It is the only place in the world where crocodiles and alligators coexist. It is also the home of the endangered Florida panther, as well as many other endangered species. Black bears, otters, pelicans, turtles, bats, deer, and manatees all make their home in the Everglades. Without a doubt, the Everglades are worth saving and preserving. Where else in the world can you find such lush diversity?","这些努力很重要，因为大沼泽地有许多物种需要保护。这里是世界上唯一一处鳄鱼和短吻鳄共存的地方，也是濒危的佛罗里达美洲狮及许多其他濒危物种的家园。黑熊、水獭、鹈鹕、龟、蝙蝠、鹿和海牛都生活在大沼泽地。毫无疑问，大沼泽地值得挽救和保护。世界上还有哪里能找到这样生机勃勃、物种多样的地方呢？"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ The Everglades National Park covers about 1.5 million acres.","大沼泽地国家公园占地约 150 万英亩。"],"ans":["F","F（事实）。"],"dir":["Write **F** before the sentences that are facts. Write **O** before the sentences that are opinions.","在陈述事实的句子前写 F，在表达观点的句子前写 O。"]},{"n":2,"ask":["________ Melaleuca trees consume a great deal of water.","白千层的耗水量很大。"],"ans":["F","F（事实）。"]},{"n":3,"ask":["________ Everyone should visit the Everglades at least once.","每个人都应该至少去一次大沼泽地。"],"ans":["O","O（观点）。"]},{"n":4,"ask":["________ The Everglades are most beautiful in the summer.","夏天的大沼泽地最美。"],"ans":["O","O（观点）。"]},{"n":5,"ask":["________ The Everglades are the only place in the world where crocodiles and alligators coexist.","大沼泽地是世界上唯一一处鳄鱼和短吻鳄共存的地方。"],"ans":["F","F（事实）。"]},{"n":6,"ask":["What is the author trying to persuade the reader of in this passage?\n________","作者想让读者接受什么观点？"],"ans":["that the Everglades are worth protecting","大沼泽地值得保护。"]},{"n":7,"ask":["Think about what you know about rain forests. Name two ways in which rain forests and the Everglades are similar.\n________","想想你所了解的雨林。说出雨林和大沼泽地的两个相似之处。"],"ans":["Answers will vary.","答案可以不同。"]},{"n":8,"ask":["About how many species of birds are there in Everglades National Park?\n________","大沼泽地国家公园约有多少种鸟类？"],"ans":["350","约 350 种。"]},{"n":9,"ask":["Why were melaleuca trees planted in the Everglades?\n________","为什么人们在大沼泽地种白千层？"],"ans":["to consume water","为了让它们吸收水分。"]},{"n":10,"ask":["Many people believe it is important to ________ our nation’s wild places.\n\n- destroy\n- investigate\n- preserve","许多人认为，____我国的荒野十分重要。\nA. destroy（破坏）\nB. investigate（调查）\nC. preserve（保护）"],"ans":["preserve","C. preserve（保护）"],"dir":["Circle the word that best completes each sentence.","圈出最适合补全每个句子的单词。"]},{"n":11,"ask":["It can be difficult to ________ the balance of an ecosystem.\n\n- explain\n- maintain\n- cancel","____生态系统的平衡可能很困难。\nA. explain（解释）\nB. maintain（维持）\nC. cancel（取消）"],"ans":["maintain","B. maintain（维持）"]},{"n":12,"ask":["What would you find most interesting about a trip to the everglades?\n________","如果去一趟大沼泽地，你觉得什么最有趣？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P046","title":["It’s a Bird’s Life","奥杜邦与鸟"],"lead":["What kinds of birds can you identify in your own neighborhood?","你能认出自己住处附近的哪些鸟？"],"exercise":"P047","genre":"人物传记","family":"info","parts":[{"n":1,"t":["Have you ever heard of the National Audubon Society? It is probably the most well-known environmental organization for the protection and conservation of birds and their habitats. It was founded in honor of John James Audubon, who was a naturalist, ornithologist, and painter.","你听说过美国国家奥杜邦协会吗？在保护鸟类及其栖息地的环保组织中，它可能是最知名的一个。协会的成立是为了纪念约翰·詹姆斯·奥杜邦，他是一位博物学家、鸟类学家和画家。"],"type":"paragraph"},{"n":2,"t":["Audubon was born in the Caribbean country of Haiti in 1785. When he was 18 years old, he was sent to live in the United States at a family farm near Philadelphia, Pennsylvania. He showed a great deal of interest in natural history and conducted the first bird-banding experiment in the country. He captured eastern phoebes and tied small pieces of yarn to their legs. By marking the birds in this way, Audubon was able to conclude that the birds nested in the same places every year.","奥杜邦于 1785 年出生在加勒比海国家海地。他 18 岁时被送往美国，住在宾夕法尼亚州费城附近的家庭农场。他对博物学表现出浓厚的兴趣，在美国进行了第一个鸟类环志实验。他捕捉东菲比霸鹟，在它们腿上系上短短的毛线。用这种方式做上标记后，奥杜邦得出结论，这些鸟每年都在同样的地方筑巢。"],"type":"paragraph"},{"n":3,"t":["Over the years, Audubon spent more and more time creating realistic drawings and paintings of birds. He began to catalog the birds he drew, venturing farther and farther to locate new species. Although today’s conservation groups would not approve of his methods, Audubon used the only technique he knew to create his paintings. He shot and stuffed birds to use as models for his artwork. He posed the birds in their natural habitats so that he would have the appropriate settings for his paintings.","多年来，奥杜邦花越来越多的时间素描和绘制栩栩如生的鸟。他开始把画过的鸟编成图录，也走得越来越远，寻找新的鸟类。当今的动物保护团体不会赞同他的做法，但这是奥杜邦当时唯一会用的绘画方式。他开枪打死鸟，再把它们制成标本，作为绘画的模特。他把鸟的标本摆回它们的天然栖息地，这样画里的环境就符合鸟真实的生活场景。"],"type":"paragraph"},{"n":4,"t":["Some of Audubon’s explorations led him on bird-watching excursions down the Mississippi River. He became a talented outdoorsman as he followed his subjects through the South. By the late 1820s, Audubon began looking for a publisher for his catalog of American birds, but American publishers were not interested. Instead, Audubon found an audience in England and Scotland where people were fascinated by the concept of the American wilderness.","有几次考察中，奥杜邦沿密西西比河顺流而下，去观察鸟类。他在美国南部追寻自己的绘画对象，也练就了一身野外活动的本领。到了 19 世纪 20 年代末，奥杜邦开始为自己的美国鸟类图录寻找出版商，但美国的出版商并不感兴趣。他在英格兰和苏格兰找到了读者，那里的人们对美国荒野充满好奇。"],"type":"paragraph"},{"n":5,"t":["There, *Birds of America* was finally printed with great success. It contained 435 hand-colored plates that showed 1,065 life-sized birds. Nothing so detailed had ever been created to document the variety of birds in America. Today, a complete set of the original prints is very valuable. There are thought to be fewer than 200 copies in existence in the world!","《美国鸟类》终于在那里出版，大获成功。书中有 435 幅手工上色的图版，画了 1,065 只与实物等大的鸟。以往从没有这么详尽的作品来记录美国鸟类的多样性。如今，一整套原版图画价值不菲。据估计，世界上现存不到 200 套！"],"type":"paragraph"},{"n":6,"t":["The Audubon Society was founded in 1886, several decades after John James Audubon’s death. It honored a man whose lifework had been to study birds and to begin to educate the public about the importance of protecting them and their environment. The National Audubon Society still exists and continues to grow today. If you are interested in learning more about it or how you can become a junior member, visit www.audubon.org.","约翰·詹姆斯·奥杜邦去世数十年后，奥杜邦协会于 1886 年成立。协会向这位毕生研究鸟类、率先让公众认识到保护鸟类及其生存环境重要性的人致敬。美国国家奥杜邦协会今天依然存在，并继续发展。想多了解协会，或想知道怎样成为青少年会员，可以访问 www.audubon.org。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the line beside the word or words that best describe what type of passage this is.\n\n- ________ biography\n- ________ historical fiction\n- ________ myth","选出最能说明本文体裁的一项。\nA. 人物传记\nB. 历史题材虚构故事\nC. 神话"],"ans":["✓ biography","A. 人物传记"]},{"n":2,"ask":["Check the sentence that best states the main idea of the selection.\n\n- ________ Audubon was born in Haiti but moved to the United States as a teenager.\n- ________ The National Audubon Society was founded to honor John James Audubon.\n- ________ Audubon was a painter and ornithologist who created one of the most compre-hensive catalogs of birds in America.","选出最能概括文章主旨的一句。\nA. 奥杜邦出生于海地，少年时搬到美国。\nB. 美国国家奥杜邦协会是为了纪念约翰·詹姆斯·奥杜邦而成立的。\nC. 奥杜邦是一位画家和鸟类学家，他编制了美国最详尽的鸟类图录之一。"],"ans":["✓ Audubon was a painter and ornithologist who created one of the most compre-hensive catalogs of birds in America.","C. 奥杜邦是一位画家和鸟类学家，他编制了美国最详尽的鸟类图录之一。"]},{"n":3,"ask":["Check the words that best describe John James Audubon.\n\n- ________ intelligent\n- ________ artistic\n- ________ cheerful\n- ________ adventurous\n- ________ unfriendly","勾选最能描述约翰·詹姆斯·奥杜邦的词。\nA. 聪明的\nB. 有艺术才华的\nC. 开朗的\nD. 爱冒险的\nE. 不友好的"],"ans":["- ✓ intelligent\n- ✓ artistic\n- ✓ adventurous","A. 聪明的；B. 有艺术才华的；D. 爱冒险的。"]},{"n":4,"ask":["Explain how Audubon’s bird-banding experiment worked.\n\n________","解释奥杜邦的鸟类环志实验是怎么做的。"],"ans":["By tying yarn to the birds’ legs, he was able to see that they came back to the same nesting place each year.","他在鸟的腿上系毛线以便辨认，从而看出它们每年都会回到同一个地方筑巢。"]},{"n":5,"ask":["Why do you think that today’s conservation groups would not approve of Audubon’s methods?\n\n________","你觉得为什么当今的动物保护团体不会赞同奥杜邦的方法？"],"ans":["because he killed so many birds","因为他杀死了那么多鸟。"]},{"n":6,"ask":["On the lines below, write a summary of paragraph 6.\n\n________","在下面横线上写出第 6 段的摘要。"],"ans":["Answers will vary.","答案可以不同。"]},{"n":7,"ask":["In paragraph 4, *excursions* means\n\n- ________ hunting trips\n- ________ presentations\n- ________ trips or journeys","第 4 段的 excursions 是什么意思？\nA. 打猎之行\nB. 展示或演讲\nC. 出游或旅行"],"ans":["✓ trips or journeys","C. 出游或旅行"]}]},{"id":"P048","title":["A Bird Excursion","一次观鸟之行"],"lead":["What birds can you identify by sight?","哪些鸟是你一眼就能认出来的？"],"exercise":"P049","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["“Are you ready to go, girls?” asked Mr. Vasquez. He stood near the front door wearing a backpack.","“姑娘们，准备好出发了吗？”巴斯克斯先生背着背包站在前门旁问道。"],"type":"paragraph"},{"n":2,"t":["“Ready, Dad,” said Olivia. “Should I grab some bug spray?”","“准备好了，爸。”奥利维娅说，“要拿点驱虫喷雾吗？”"],"type":"paragraph"},{"n":3,"t":["“Good thinking,” said Mr. Vasquez. “We don’t want to be eaten alive out there.” Olivia grabbed the bug spray from the closet. Then, Jaya, Olivia, and Olivia’s dad set out on their first joint bird watching expedition.","“想得周到，”巴斯克斯先生说，“我们可不想在外面被虫子活活吃掉。”奥利维娅从壁橱里拿了驱虫喷雾。接着，贾娅、奥利维娅和奥利维娅的爸爸出门了，这是三人第一次一起去观鸟。"],"type":"paragraph"},{"n":4,"t":["“How long have you been birding, Mr. Vasquez?” asked Jaya.","“巴斯克斯先生，您观鸟多久了？”贾娅问。"],"type":"paragraph"},{"n":5,"t":["“I’ve only been doing it for about a year, Jaya,” replied Mr. Vasquez. “Olivia’s mom gave me a backyard birdfeeder for my birthday a couple of years ago. I found out that I really enjoyed watching the birds and identifying them with the field guide I bought.”","“才一年左右，贾娅。”巴斯克斯先生回答，“几年前我过生日，奥利维娅的妈妈送了我一个可以放在后院的喂鸟器。我发现自己特别喜欢观察鸟，再用买来的野外图鉴一一辨认。”"],"type":"paragraph"},{"n":6,"t":["Jaya, Olivia, and Mr. Vasquez crossed the street to the park’s entrance. They picked up a map of the trails. “We should look for a trail that isn’t too wooded,” said Mr. Vasquez. “If we can find a trail that has an open area, like a field or meadow, and some water, we’ll probably have the best chance of making a number of sightings.”","贾娅、奥利维娅和巴斯克斯先生过了马路，来到公园入口，领了一张步道地图。“咱们得找一条树木不太密的步道，”巴斯克斯先生说，“要是步道旁有田野或草地这样开阔的地方，又有水，我们就很可能看见不少鸟。”"],"type":"paragraph"},{"n":7,"t":["After careful deliberation, the group agreed on a trail and set off. As the sun rose higher in the sky, they grew warm and took off the long-sleeved shirts they wore over their T-shirts. Within the first half-hour, they were able to identify a blue jay, cardinal, chickadee, house sparrow, northern flicker, house finch, northern oriole, and red-winged blackbird.","三人仔细商量后，选了一条步道出发。太阳渐渐升高，他们觉得热了，就脱掉了套在短袖衫外的长袖衬衣。出发还不到半小时，他们就认出了蓝松鸦、北美红雀、山雀、家麻雀、北美扑翅鴷、家朱雀、北美拟黄鹂和红翅黑鹂。"],"type":"paragraph"},{"n":8,"t":["“This is great!” exclaimed Jaya. “Do you usually spot so many birds this quickly?”","“太棒了！”贾娅叫道，“您平常也能这么快看到这么多鸟吗？”"],"type":"paragraph"},{"n":9,"t":["Mr. Vasquez grinned. “It seems like we’re having an especially good day today.”","巴斯克斯先生咧嘴一笑。“看来今天的运气特别好。”"],"type":"paragraph"},{"n":10,"t":["“We haven’t really seen any birds yet that are difficult to identify,” said Olivia thoughtfully. “They can move so quickly, how can you identify them if you need to check the field guide?” she asked.","“我们到现在还没碰到什么难认的鸟。”奥利维娅想了想说，“它们动作那么快，要是得查图鉴，怎么来得及认出来？”"],"type":"paragraph"},{"n":11,"t":["“Well,” began Mr. Vasquez, “the bird’s size is usually a good place to start. Is it bigger or smaller than a sparrow? What about a robin? Color is not always a reliable identifier because it can change in different types of light. Also, male and female birds frequently have different coloring, which can change by season.”","“嗯，”巴斯克斯先生说，“通常可以先看鸟的大小。它比麻雀大还是小？和旅鸫相比呢？颜色不一定可靠，因为不同光线下看起来会不一样。而且雌鸟和雄鸟的颜色往往不同，颜色还可能随季节变化。”"],"type":"paragraph"},{"n":12,"t":["“What about a bird’s shape?” asked Jaya. “It seems like that would remain constant.”","“那鸟的外形呢？”贾娅问，“外形好像不会变吧？”"],"type":"paragraph"},{"n":13,"t":["“You’re right, Jaya,” said Mr. Vasquez. “The shape of a bird’s body, its tail, its wings, and its bill can all be excellent clues. Bird calls can also be helpful. Field guides often describe what a typical bird call sounds like. You can even go online and listen to a sample of most common calls.”","“说得对，贾娅。”巴斯克斯先生说，“鸟的身体、尾巴、翅膀和喙的形状，都能提供很好的线索。叫声也有用。野外图鉴常会描述一种鸟典型的叫声。多数常见鸟的叫声，甚至可以在网上听到样本。”"],"type":"paragraph"},{"n":14,"t":["“That’s where your birding notebook can come in handy, Olivia,” continued Mr. Vasquez. “If the bird flies away before you can identify it, your notes can help you do more research later.”","“这样一来，你的观鸟笔记本就能派上用场了，奥利维娅。”巴斯克斯先生接着说，“如果你还没认出它，鸟就飞走了，回头可以根据笔记再查。”"],"type":"paragraph"},{"n":15,"t":["“Look!” said Olivia, pointing to a pond that was visible in the distance. Several Canada geese took flight, their powerful wings lifting them quickly into the clear blue sky. Jaya, Olivia, and Mr. Vasquez stood quietly watching the geese soar overhead in a perfect V formation. They knew they wouldn’t forget the image of the geese in the clear sky anytime soon.","“快看！”奥利维娅指着远处看得见的一个池塘说。几只加拿大雁腾空而起，扇动有力的翅膀，迅速飞向湛蓝的天空。贾娅、奥利维娅和巴斯克斯先生静静站着，看雁群排成整齐的 V 字从头顶飞过。他们知道，自己短时间内忘不了这一幕。"],"type":"paragraph"}],"original":[{"n":1,"ask":["**Hyperbole** is an exaggerated statement that is used to make a point. For example, the sentence *I am so hungry, I could eat a horse* means that the speaker is extremely hungry, not that she could actually eat a horse. Find the hyperbole in paragraph 3, and write it on the line below. Then, explain what you think it means.\n________","夸张（hyperbole）是用故意说得过头的话来强调某个意思。比如，“我饿得能吃下一匹马”表示说话的人饿极了，并非真能吃掉一匹马。找出第 3 段的夸张句，写在下面的横线上，然后解释你认为它是什么意思。"],"ans":["We don’t want to be eaten alive out there. Answers will vary.","“我们可不想在外面被虫子活活吃掉。”解释可以不同。"]},{"n":2,"ask":["Why do you think Mr. Vasquez says they should look for a trail that isn’t too wooded and that has open areas and some water?\n________","你觉得巴斯克斯先生为什么说要找一条树木不太密、附近有开阔地又有水的步道？"],"ans":["Answers will vary. Possible answer: Mr. Vasquez says this will probably give them the best chance of making a number of sightings.","答案可以不同。参考答案：巴斯克斯先生认为，这样可能最有机会看到不少鸟。"]},{"n":3,"ask":["Find one sentence that shows that Mr. Vasquez is knowledgeable about birding.\n________","找一句话，表明巴斯克斯先生懂得很多观鸟知识。"],"ans":["Answers will vary. Possible answer: Also, male and female birds frequently have differnt coloring, which can change by season.","答案可以不同。参考答案：“而且雌鸟和雄鸟的颜色往往不同，颜色还可能随季节变化。”"]},{"n":4,"ask":["Name two birds that Jaya and the Vasquezes saw on their walk.\n________","说出贾娅和巴斯克斯父女在路上看到的两种鸟。"],"ans":["Answers will vary.","答案可以不同。"]},{"n":5,"ask":["Why is a bird’s shape often a better clue to identifying it than its color?\n________","为什么通常看外形比看颜色更容易辨认一只鸟？"],"ans":["because a bird’s coloring can appear different depending on the light","因为光线不同，鸟的颜色看起来可能也不同。"]},{"n":6,"ask":["Do you think that Olivia and Jaya will want to go birding again? Why or why not?\n________","你觉得奥利维娅和贾娅还会想去观鸟吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":7,"ask":["Check the sentence in which *check* has the same meaning as it does in paragraph 10.\n\n- ________ David wrote a check to pay for the groceries.\n- ________ Did you check the oil level in the car this morning?","勾选 check 的意思与第 10 段相同的一句。\nA. David wrote a check to pay for the groceries.（戴维开了一张支票付买菜的钱。）\nB. Did you check the oil level in the car this morning?（你今天早上检查汽车的机油液位了吗？）"],"ans":["✓ Did you check the oil level in the car this morning?","B. Did you check the oil level in the car this morning?（检查、查阅）"]},{"n":8,"ask":["Check the sentence in which *bill* has the same meaning as it does in paragraph 13.\n\n- ________ The woodpecker’s bill is long and thin.\n- ________ Please ask the waiter for our bill.","勾选 bill 的意思与第 13 段相同的一句。\nA. The woodpecker’s bill is long and thin.（啄木鸟的喙又细又长。）\nB. Please ask the waiter for our bill.（请让服务员把账单拿来。）"],"ans":["✓ The woodpecker’s bill is long and thin.","A. The woodpecker’s bill is long and thin.（鸟喙）"]}]},{"id":"P050","title":["Bird Garden","蜂鸟花园"],"lead":["What other living creatures might be attracted to a garden?","花园还可能吸引哪些生物？"],"exercise":"P051","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Olivia and Jaya sat at a table in the library with books spread out around them. They each had a notebook and a pen for recording interesting information about hummingbirds. Jaya’s mom had allotted a portion of her garden for the girls to use as a hummingbird garden that summer. They couldn’t wait to start planting, but they wanted to make sure they knew as much as possible about the tiny creatures before they began.","奥利维娅和贾娅在图书馆的桌旁坐着，周围摊着一本本书。两人各带了笔记本和笔，准备记下关于蜂鸟的有趣资料。那年夏天，贾娅的妈妈特地从自家花园划出一块地方，让两个女孩布置一座蜂鸟花园。她们迫不及待想种花，却希望动手前尽可能了解这些小家伙。"],"type":"paragraph"},{"n":2,"t":["“Have you found anything yet that says how many species of hummingbirds there are?” asked Jaya.","“你找到什么资料说一共有多少种蜂鸟了吗？”贾娅问。"],"type":"paragraph"},{"n":3,"t":["Olivia nodded. “There are more than 300 species,” she marveled. “The smallest one is the bee hummingbird, which lives in Cuba. It’s just a little over two inches long and weighs only about a tenth of an ounce!”","奥利维娅点点头。“有 300 多种呢。”她惊叹道，“最小的是生活在古巴的吸蜜蜂鸟。它只比两英寸长一点，体重约十分之一盎司！”"],"type":"paragraph"},{"n":4,"t":["“I’d love to see one,” replied Jaya, “but I don’t think there is much chance of us attracting one here in Colorado. How big are the ones that we might see in this area?”","“我真想看看，”贾娅回答，“可我想，在科罗拉多州这儿，咱们不大可能吸引到一只。这附近有可能看到的蜂鸟有多大？”"],"type":"paragraph"},{"n":5,"t":["“They’re actually not too much bigger,” said Olivia, turning the page in her book. “They only measure about four inches long. Their wings beat about 80 times per minute. The beating of their wings makes a humming noise, which is how they got their name. Their hearts beat more than 1,200 times per minute. Do you have any idea how that compares to the human heartbeat?” asked Olivia.","“其实也没大多少。”奥利维娅翻了一页书，“它们只有约四英寸长，翅膀每分钟振动约 80 次。翅膀振动发出嗡嗡声，这就是蜂鸟的英文名 hummingbird 的由来。它们的心脏每分钟跳 1,200 多下。你知道这和人的心跳相比怎么样吗？”奥利维娅问。"],"type":"paragraph"},{"n":6,"t":["“Well, we took our heart rates in gym a few weeks ago. I think mine was about 65 beats per minute,” said Jaya.","“我们几周前刚在体育课上测过心率。我记得我每分钟大概跳 65 下。”贾娅说。"],"type":"paragraph"},{"n":7,"t":["“Unbelievable,” said Olivia shaking her head. “Okay, have we figured out how to attract these little hummers to our garden?”","“太不可思议了。”奥利维娅摇摇头，“好吧，咱们弄明白怎样把这些嗡嗡响的小家伙吸引到花园里了吗？”"],"type":"paragraph"},{"n":8,"t":["It took Jaya a moment to locate the book she was searching for. “This one seems to have the most detailed information,” she said, picking up a colorful paperback book. “It’s called *Planting Your Hummingbird Garden*.”","贾娅找了一会儿，才找到她要找的书。“这本好像讲得最详细。”她拿起一本色彩鲜艳的平装书，“书名叫《种一座蜂鸟花园》。”"],"type":"paragraph"},{"n":9,"t":["“I think I saw somewhere that hummingbirds are attracted to red flowers. Is that right?” asked Olivia.","“我好像在哪儿见过，说红花会吸引蜂鸟。对吗？”奥利维娅问。"],"type":"paragraph"},{"n":10,"t":["Jaya nodded. “That’s why hummingbird feeders are usually red. We should be able to find a simple, inexpensive one at a garden center. We just fill it with a mixture of four parts water to one part sugar. The book says that it’s easiest to dissolve the sugar in hot or boiling water.”","贾娅点点头。“所以蜂鸟喂食器通常都是红色的。我们应该能在园艺中心买到一个简单又不贵的。只要往里装按四份水和一份糖调成的糖水就行。书上说，热水或开水最容易把糖化开。”"],"type":"paragraph"},{"n":11,"t":["“I’m going to start a list of plants that hummingbirds like,” said Olivia. “We know that red flowers appeal to them, and I remember reading that they like long, tube-shaped flowers too,” she added. “I wonder if that’s because of how long and thin their beaks are.”","“我要开始记下蜂鸟喜欢的植物。”奥利维娅说，“我们知道红花能吸引蜂鸟，我记得看过，它们也喜欢细长的管状花。不知道是不是因为它们的喙又细又长。”"],"type":"paragraph"},{"n":12,"t":["“You’re right,” said Jaya. “Other birds can’t reach the sweet nectar in long, thin flowers. Neither can bees. That means that hummingbirds don’t have much competition for the meals they get from those flowers. That’s pretty important because they need to eat about every 10 minutes or so. They use up a lot of energy hovering over flowers, so they need to replenish it often.”","“你说对了。”贾娅说，“别的鸟够不着细长花朵里的甜花蜜，蜜蜂也够不着。这就意味着蜂鸟吸食这些花的花蜜时，没什么对手。这很重要，因为它们大约每隔 10 分钟就得吃一次。它们在花朵上方悬停会消耗许多能量，所以必须经常补充。”"],"type":"paragraph"},{"n":13,"t":["“Do you think we’re ready to ask my dad to take us to the nursery?” asked Olivia, beginning to gather up the books on the table.","“你觉得咱们可以请我爸带我们去苗圃了吗？”奥利维娅问，开始收拾桌上的书。"],"type":"paragraph"},{"n":14,"t":["“I think we’re as ready as we’re going to be,” replied Jaya, her eyes dancing with excitement. “We’ll just have to learn the rest from experience!”","“我觉得能做的准备都做好了，”贾娅说，眼里闪着兴奋的光，“剩下的就得边做边学啦！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to entertain\n- ________ to instruct\n- ________ to persuade","选出最能说明作者写作目的的一项。\nA. 娱乐读者\nB. 指导读者\nC. 说服读者"],"ans":["✓ to entertain","A. 娱乐读者"]},{"n":2,"ask":["Number the events below to show the order in which they happened.\n\n- ________ Jaya says they’ll have to learn the rest from experience.\n- ________ Olivia began to gather up the books on the table.\n- ________ Jaya’s gym class took their heart rates.\n- ________ Olivia tells Jaya that there are more than 300 species of hummingbird.\n- ________ Olivia said she would start a list of plants that hummingbirds like.","给下列事件标上序号，表示发生的先后顺序。\n贾娅说剩下的得靠实际经验来学。\n奥利维娅开始收拾桌上的书。\n贾娅的体育课上测过心率。\n奥利维娅告诉贾娅，蜂鸟有 300 多种。\n奥利维娅说要列一张蜂鸟喜欢的植物清单。"],"ans":["- **5** Jaya says they’ll have to learn the rest from experience.\n- **4** Olivia began to gather up the books on the table.\n- **1** Jaya’s gym class took their heart rates.\n- **2** Olivia tells Jaya that there are more than 300 species of hummingbird.\n- **3** Olivia said she would start a list of plants that hummingbirds like.","按题中所列顺序，分别标 5、4、1、2、3。"]},{"n":3,"ask":["How did hummingbirds get their name?\n\n________","蜂鸟的英文名 hummingbird 是怎么来的？"],"ans":["The beating of their wings makes a humming noise.","它们拍打翅膀时，翅膀会发出嗡嗡声。"]},{"n":4,"ask":["Why were Jaya and Olivia researching hummingbirds?\n\n________\n\n________","贾娅和奥利维娅为什么要查蜂鸟的资料？"],"ans":["They wanted to have plants in their garden that would attract hummingbirds.","她们想在花园里种能吸引蜂鸟的植物。"]},{"n":5,"ask":["Why are hummingbird feeders usually red?\n\n________","为什么蜂鸟喂食器通常是红色的？"],"ans":["because they are attracted to red flowers","因为红花会吸引蜂鸟。"]},{"n":6,"ask":["If you added one-quarter cup of sugar to a hummingbird feeder, how much water would you need to add?\n\n________","如果你在蜂鸟喂食器里加了四分之一杯糖，需要加多少水？"],"ans":["one cup","一杯。"]},{"n":7,"ask":["How often do hummingbirds need to eat?\n\n________","蜂鸟多久需要进食一次？"],"ans":["every ten minutes","每隔 10 分钟一次。"]},{"n":8,"ask":["From whose point of view is this story told?\n\n________","这个故事是从谁的视角讲述的？"],"ans":["the narrator’s point of view","从叙述者的视角讲述。"]},{"n":9,"ask":["What kinds of birds would you most like to attract and observe? Why?\n\n________\n\n________","你最想吸引和观察哪些鸟？为什么？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P052","title":["An Ancient Migration","古老的迁徙"],"lead":["Why do thousands of cranes stop at Nebraska’s Platte River every spring?","为什么每年春天都有成千上万只鹤在内布拉斯加州的普拉特河停留？"],"exercise":"P053","genre":"说明文","family":"info","parts":[{"n":1,"t":["A large flock of birds rising up to fill the sky can be a breathtaking sight, but imagine a place where you might see hundreds of thousands of birds all at once. For six weeks each spring, nearly 500,000 sandhill cranes stop along the Platte River in Nebraska as they make their annual northern migration. This unique, natural occurrence has happened for thousands of years and attracts large crowds of people each year to witness its beauty.","一大群鸟腾空而起，遮满天空，足以让人惊叹。试想一下，有个地方能让你同时看见几十万只鸟。每年春天，在为期六周的一段时间里，有近50万只沙丘鹤在一年一度北迁的途中停留在内布拉斯加州的普拉特河沿岸。这一独特的自然现象已持续几千年，每年都吸引大批游客来欣赏这番美景。"],"type":"paragraph"},{"n":2,"t":["The sandhill crane has been in existence longer than any other crane. Fossil records show that they have been around for ten million years! Sandhill cranes stand nearly four feet tall and are mostly gray except for a bit of red on top of their heads. They also have a long, pointed bill and white feathers on the sides of their faces.","沙丘鹤比任何其他鹤类出现得都早。化石记录表明，它们早在1000万年前就已存在！沙丘鹤身高将近4英尺，除了头顶的一小块红色，身上大多是灰色的。它们还有又长又尖的喙，面部两侧长着白色的羽毛。"],"type":"paragraph"},{"n":3,"t":["The most distinctive features of the sandhill crane can be seen when they fly. With long legs and a long neck extending out from their bodies, cranes create a graceful sight as they glide across the sky.","沙丘鹤最鲜明的特征在飞行时看得最清楚。它们伸展着长腿和长颈，从天空中滑翔而过，姿态十分优雅。"],"type":"paragraph"},{"n":4,"t":["During the winter, sandhill cranes live in the wetter parts of Texas, New Mexico, and northern Mexico. Marshes and bogs provide the perfect habitat because the shallowness allows cranes to stand right in the middle of the water. This way they can easily forage for plants, insects, and fish. Because they eat both plants and animals, cranes are considered omnivorous. When sandhill cranes stop along the Platte River, their main food source is corn that can be found in the surrounding fields. Farmers benefit from the cranes because the birds help clean the fields for the next round of crops.","冬天，沙丘鹤生活在得克萨斯州、新墨西哥州以及墨西哥北部较湿润的地区。沼泽和泥炭沼泽是理想的栖息地，因为水浅，鹤可以直接站在水中央。这样，它们就能轻松地寻找植物、昆虫和鱼类。沙丘鹤既吃植物也吃动物，因此属于杂食动物。在普拉特河沿岸停留时，它们主要以周围田地里的玉米为食。这也给农民带来了好处，因为鹤帮他们清理了田地，为种植下一茬作物做好准备。"],"type":"paragraph"},{"n":5,"t":["With the arrival of spring, cranes begin migrating north to their summer homes in Canada, Alaska, and even Siberia. Their flight pattern takes them across the central plains of the United States. For the most part, these are arid states, but the Platte River provides a large area of shallow water that is perfect for the cranes. In addition, the Platte is located approximately at the midpoint in the cranes’ journey. Thousands and thousands of cranes land to take a break and socialize at this ideal resting place.","春天一到，沙丘鹤就开始向北迁徙，前往加拿大、阿拉斯加，甚至西伯利亚的夏季栖息地。它们的飞行路线穿过美国中部平原。这里各州大多气候干旱，但普拉特河有一大片浅水区，非常适合沙丘鹤。此外，普拉特河大约处在鹤群迁徙路线的中点。成千上万只鹤在这个理想的歇脚处降落，休息之余也和同伴聚在一起。"],"type":"paragraph"},{"n":6,"t":["Originally called *Nebraskier*, an Oto word meaning *flat water*, the Platte was renamed by a French explorer because *platte* means *flat* in French. Its significance is not only for the birds. As Europeans traveled westward across the country, the Platte River was an important landmark. Both the Oregon Trail and the Mormon Trail ran alongside it.","普拉特河原来叫内布拉斯基尔，这个词在奥托语里意为“平坦的水面”。一位法国探险家给这条河改了名，因为 platte 在法语里意为“平坦”。这条河对人也很重要。欧洲人横穿美国向西行进时，普拉特河是一个重要的地标。俄勒冈小径和摩门小径都沿着这条河延伸。"],"type":"paragraph"},{"n":7,"t":["If you are interested in traveling to see the cranes, Rowe Sanctuary in Gibbon, Nebraska, is one of the best places for viewing them. Run by the National Audubon Society, Rowe Sanctuary works for the conservation of the cranes and other migratory birds that stop along the Platte. They also provide blinds so visitors can watch the hundreds of thousands of sandhill cranes that land there without disturbing them.","如果你想去观鹤，内布拉斯加州吉本的罗韦保护区是最好的观赏地点之一。保护区由美国国家奥杜邦协会管理，致力于保护在普拉特河沿岸停留的鹤类和其他候鸟。保护区还设有隐蔽观察点，游客可以观看降落在这里的几十万只沙丘鹤，同时避免惊扰它们。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why are sandhill cranes classified as omnivorous?\n________","为什么沙丘鹤被归为杂食动物？"],"ans":["because they eat both plants and animals","因为它们既吃植物也吃动物。"]},{"n":2,"ask":["The selection says that Rowe Sanctuary provides blinds for visitors. What do you think this means?\n________","文章说罗韦保护区为游客提供 blinds。你认为这里的 blinds 是什么意思？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":3,"ask":["Where do sandhill cranes live during the winter?\n________","沙丘鹤冬天生活在哪里？"],"ans":["Texas, New Mexico, and Northern Mexico","得克萨斯州、新墨西哥州和墨西哥北部。"]},{"n":4,"ask":["What attracts the cranes to Platte River?\n________","普拉特河为什么能吸引鹤群？"],"ans":["Possible answer: It’s a wide, shallow body of water in a dry area.","参考答案：这是一处位于干旱地区的宽阔浅水水域。"]},{"n":5,"ask":["Check the sentence that best states the main idea of the passage.\n\n- ________ Every spring, thousands of sandhill cranes stop at Nebraska’s Platte River during their northern migration.\n- ________ The most distinctive features of sandhill cranes are their long necks and legs.\n- ________ Rowe Sanctuary in Gibbon, Nebraska, is one of the best places for viewing sandhill cranes.","勾选最能概括文章主旨的句子。\nA. 每年春天，成千上万只沙丘鹤在北迁途中停留在内布拉斯加州的普拉特河。\nB. 沙丘鹤最鲜明的特征是长颈和长腿。\nC. 内布拉斯加州吉本的罗韦保护区是观赏沙丘鹤的最佳地点之一。"],"ans":["✓ Every spring, thousands of sandhill cranes stop at Nebraska’s Platte River during their northern migration.","A. 每年春天，成千上万只沙丘鹤在北迁途中停留在内布拉斯加州的普拉特河。"]},{"n":6,"ask":["________ The summer homes of sandhill cranes are in places like Canada and Alaska.","沙丘鹤的夏季栖息地包括加拿大和阿拉斯加等地。"],"ans":["F","事实（F）"],"dir":["Write **F** before the sentences that are facts. Write **O** before the sentences that are opinions.","如果句子陈述的是事实，就在句前写 F。如果表达的是观点，就在句前写 O。"]},{"n":7,"ask":["________ There is nothing as beautiful as a sandhill crane taking flight.","没有什么比沙丘鹤起飞更美。"],"ans":["O","观点（O）"]},{"n":8,"ask":["________ Sandhill cranes like the environment of marshes and bogs.","沙丘鹤喜欢沼泽和泥炭沼泽的环境。"],"ans":["F","事实（F）"]},{"n":9,"ask":["________ The best place to view sandhill cranes is Rowe Sanctuary.","观赏沙丘鹤的最佳地点是罗韦保护区。"],"ans":["O","观点（O）"]},{"n":10,"ask":["________ Large numbers of people come to watch the cranes migrate every spring.","每年春天都有很多人来观看鹤群迁徙。"],"ans":["F","事实（F）"]},{"n":11,"ask":["Which word in paragraph 1 means “occuring once a year”?\n________","第1段中，哪个词的意思是“每年发生一次的”？"],"ans":["annual","annual（一年一度的）"]}]},{"id":"P054","title":["A Trip to the Smithsonian","史密森学会参观之旅"],"lead":["How will Ms. DeJohn’s class decide which museums to visit during a class trip to the Smithsonian?","德约翰老师班上的同学将怎样决定去史密森学会参观哪些博物馆？"],"exercise":"P055","genre":"故事","family":"lit","parts":[{"n":1,"t":["Ms. DeJohn stood at the front of the room. “Okay, everyone,” she began, “as you all know, we’ll be leaving for Washington, D.C. on Monday. We are going to spend some time this morning discussing what you would like to see when we visit the Smithsonian Institution. It will be possible for us to see only a fraction of all the Smithsonian has to offer, so we need to make some decisions about our priorities.","德约翰老师站在教室前面。“好了，同学们，”她开口说，“大家都知道，我们星期一就要出发去华盛顿特区。今天上午我们要花点时间讨论一下，去史密森学会参观时，你们想看些什么。史密森学会能让我们参观的地方很多，我们只能看其中一小部分，所以得决定哪些地方优先。"],"type":"paragraph"},{"n":2,"t":["“We’ve done a little research as a class about the wide array of topics that the Smithsonian addresses in their museums. I know that during your free time many of you have also done some additional research on the Smithsonian’s website.”","“之前我们全班一起查过资料，了解过史密森学会各博物馆涵盖的各种主题。我知道，你们中不少人还利用课余时间到史密森学会的网站上查了更多资料。”"],"type":"paragraph"},{"n":3,"t":["Ty raised his hand. “How many museums are we going to have time to see?” he asked.","泰举起手问：“我们有时间参观几家博物馆？”"],"type":"paragraph"},{"n":4,"t":["“That’s a good question, Ty,” replied Ms. DeJohn. “We’re going to choose four museums. I’d like to hear some of your suggestions. What interests you most at the Smithsonian?”","“问得好，泰，”德约翰老师回答，“我们要选四家博物馆。我想听听你们的建议。在史密森学会，你们对什么最感兴趣？”"],"type":"paragraph"},{"n":5,"t":["“Can we go to the National Museum of Natural History?” asked Emma, consulting her notebook. “I’d like to see the dinosaur skeletons there.”","“我们能去国家自然历史博物馆吗？”艾玛一边翻看笔记本一边问，“我想去看那里的恐龙骨架。”"],"type":"paragraph"},{"n":6,"t":["“I want to see Anita and Arabella,” said Calvin.","“我想看安妮塔和阿拉贝拉，”卡尔文说。"],"type":"paragraph"},{"n":"u1","t":["SMITHSONIAN","史密森学会"],"type":"note"},{"n":7,"t":["“Who?” asked Emma, turning around to look at Calvin.","“谁呀？”艾玛转过身看向卡尔文。"],"type":"paragraph"},{"n":8,"t":["“Anita and Arabella,” he repeated. “They’re the space spiders. A student wanted to know if spiders could spin webs in space, so NASA sent two spiders into space on *Skylab II*. Anita’s and Arabella’s bodies are housed at the National Air and Space Museum.”","“安妮塔和阿拉贝拉，”他又说了一遍，“就是那两只太空蜘蛛。有个学生想知道蜘蛛能不能在太空织网，于是美国国家航空航天局用‘天空实验室二号’把两只蜘蛛送上了太空。现在，安妮塔和阿拉贝拉的遗体保存在国家航空航天博物馆。”"],"type":"paragraph"},{"n":9,"t":["Ms. DeJohn began to list the students’ suggestions on the board.","德约翰老师开始把同学们的建议列在黑板上。"],"type":"paragraph"},{"n":10,"t":["“If we go to the National Zoo,” said Deepak, “we can see the Sumatran tigers. Only a few hundred of these tigers still in exist in the wild, and they all live in Indonesia. Also the giant pandas, Mei Xiang and Tian Tian, are on loan from the China Wildlife Conservation Association. I think that getting to see them in person would be really amazing.”","“如果去国家动物园，”迪帕克说，“我们就能看到苏门答腊虎。这种老虎在野外只剩几百只了，全都生活在印度尼西亚。另外，那里还有中国野生动物保护协会出借的大熊猫美香和添添。我觉得能亲眼看到它们，一定很棒。”"],"type":"paragraph"},{"n":11,"t":["“I’d like to go to the Museum of African Art,” said Imani. “My parents emigrated from Kenya when they were children, but I’ve never been there to visit. My family collects African art, so I’d like to learn more about it.”","“我想去非洲艺术博物馆，”伊曼妮说，“我父母小时候从肯尼亚移民过来，但我从来没去过那里。我们家收藏非洲艺术品，所以我想多了解一些。”"],"type":"paragraph"},{"n":12,"t":["“I think we should go to the National Museum of American History,” said Chris. “They have all kinds of cool computer artifacts. They have examples of really early computers and computer games. You can even see the computer that defeated chess champion Garry Kasparov!”","“我觉得我们该去美国国家历史博物馆，”克里斯说，“那里有各种各样很酷的计算机文物，有很早期的计算机和电脑游戏。你甚至能看到那台击败国际象棋冠军加里·卡斯帕罗夫的计算机！”"],"type":"paragraph"},{"n":13,"t":["“I like the idea of the American History Museum, too,” agreed Emma. “They have these interactive carts around the museum, where you can actually try things out yourself.”","“我也赞成去美国历史博物馆，”艾玛说，“馆里各处都有互动展示推车，你可以自己动手试一试。”"],"type":"paragraph"},{"n":14,"t":["Ms. DeJohn smiled at the class. “I must say that I am extremely impressed by how knowledgeable you all are. You’ve done your research. Now, all we have to do is take a vote, and we’ll be on our way to the Smithsonian!”","德约翰老师微笑着望向全班。“我得说，你们懂得这么多，真让我刮目相看。你们都做足了功课。现在只要投个票，我们就可以出发去史密森学会啦！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the line beside the word or words that best describe what type of selection this is.\n\n- ________ fiction\n- ________ autobiography\n- ________ biography","勾选最符合本文的体裁。\nA. 虚构故事\nB. 自传\nC. 传记"],"ans":["✓ fiction","A. 虚构故事。"]},{"n":2,"ask":["How can you tell that Ms. DeJohn’s class is excited about their trip to the Smithsonian?\n\n________\n\n________\n\n________","你从哪里看出德约翰老师班上的同学很期待去史密森学会参观？"],"ans":["Answers will vary. Possible answer: They have researched various museums in order to share with the class what each one has to offer.","答案可以不同。参考答案：他们查阅了各家博物馆的资料，好向全班介绍每家博物馆有哪些看点。"]},{"n":3,"ask":["Why can’t the class visit all of the Smithsonian’s museums during their trip to Washington, D.C.?\n\n________\n\n________","为什么全班在华盛顿特区旅行期间无法参观史密森学会的所有博物馆？"],"ans":["There are too many different museums.","因为博物馆太多了。"]},{"n":4,"ask":["What does Chris want to see at the National Museum of American History?\n\n________","克里斯想在美国国家历史博物馆看什么？"],"ans":["the computer artifacts","计算机文物。"]},{"n":5,"ask":["What problem does Ms. DeJohn’s class have at the beginning of the story? How do they resolve it?\n\n________\n\n________","故事开头，德约翰老师班上遇到了什么问题？他们是怎么解决的？"],"ans":["deciding which museums to visit; they decide which four sound best","他们需要决定参观哪些博物馆，最后选出听起来最值得去的四家。"]},{"n":6,"ask":["Who are Anita and Arabella and why were they sent into space?\n\n________\n\n________","安妮塔和阿拉贝拉是谁？为什么要把它们送上太空？"],"ans":["They are space spiders; to see if they could spin webs in space.","它们是两只太空蜘蛛。人们想知道它们在太空中能不能织网。"]},{"n":7,"ask":["Why would it be special to see the giant pandas at the National Zoo?\n\n________\n\n________","为什么去国家动物园看大熊猫会是一次特别的体验？"],"ans":["They are only there temporarily on loan from China.","这些大熊猫是中国暂时出借给动物园的。"]},{"n":8,"ask":["In paragraph 2, what does the word array mean?\n\n________","第2段中的 array 是什么意思？"],"ans":["variety","variety，意思是“多种多样的一系列”。"]},{"n":9,"ask":["Which of the Smithsonian museums mentioned in the story would you most like to see?\n\n________","故事中提到的史密森学会所属博物馆里，你最想去哪一家？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P056","title":["The Mega-Museum","超级博物馆"],"lead":["What are some different types of museums you have visited?","你参观过哪些不同类型的博物馆？"],"exercise":"P057","genre":"说明文","family":"info","parts":[{"n":1,"t":["The Smithsonian Institution in Washington, D.C., covers so many subjects and contains so many objects that you would have to call it a super-museum. In fact, its collection of artifacts and memorabilia is so vast—more than 143 million items—the Smithsonian needs 17 separate museums to hold everything! Even more incredible is that the museums are free to the public because the institute is funded and managed by the Unites States government. Even though the Smithsonian is an American institution, it was because of an Englishman’s generosity that it exists today.","华盛顿特区的史密森学会涵盖那么多主题，收藏了那么多物品，称它为超级博物馆一点儿也不夸张。事实上，它收藏的文物和纪念品数量极其庞大，超过1.43亿件，得用17家不同的博物馆才放得下！更令人惊叹的是，这些博物馆由美国政府出资和管理，所以免费向公众开放。史密森学会虽是美国机构，却是因一位英国人的慷慨捐赠而成立的。"],"type":"paragraph"},{"n":2,"t":["In 1829, wealthy British scientist James Smithson died and passed his enormous fortune on to his nephew Henry Hungerford. However, Smithson stated in his will that if Henry died without having any children, all the money would be donated to the U.S. government. He wanted the government to establish an institution “for the increase and diffusion of knowledge.”","1829年，富有的英国科学家詹姆斯·史密森去世，把巨额财产留给了外甥亨利·亨格福德。不过，史密森在遗嘱中写明，如果亨利去世时没有子女，就把财产全部捐给美国政府。他希望政府设立一个机构来“增进和传播知识”。"],"type":"paragraph"},{"n":3,"t":["As it turned out, Hungerford did not have any heirs, so the money—$500,000 in 1835, which would be equal to nearly $9,000,000 today—came overseas to America. Congress debated for many years about how exactly the money should be used, but in 1846, President James Polk signed a bill into law that founded the institution.","后来亨格福德没有留下继承人，这笔钱就越过大洋来到了美国。这笔钱在1835年是50万美元，相当于本文写作时的近900万美元。关于这笔钱究竟怎么用，国会争论了多年。直到1846年，詹姆斯·波尔克总统签署法案，史密森学会正式成立。"],"type":"paragraph"},{"n":4,"t":["Today, almost 24 million people visit the Smithsonian museums each year, including the National Museum of Natural History, the National Portrait Gallery, the National Museum of American Indians, and the Anacostia Museum for African American History and Culture. The Smithsonian also runs the National Zoological Park. Among the zoo’s 3,600 animals are two giant pandas, an endangered species that is rarely exhibited anywhere outside of China.","如今，史密森学会旗下的博物馆每年接待近2400万名参观者，其中包括国家自然历史博物馆、国家肖像馆、美国印第安人国家博物馆，以及介绍非裔美国人历史和文化的阿纳科斯蒂亚博物馆。史密森学会还管理国家动物园。园内的3600只动物中有两只大熊猫。这种濒危动物在中国以外很少公开展出。"],"type":"paragraph"},{"n":5,"t":["Another part of the Smithsonian Institution is the National Museum of American History, which covers all aspects of our history and culture. The museum displays fun artifacts, including sports memorabilia like Michael Jordan’s basketball jersey, Muhammad Ali’s boxing robe, and the goggles Gertrude Ederle wore when she swam across the English Channel.","史密森学会还设有美国国家历史博物馆，展现美国历史和文化的方方面面。馆内展出了有趣的文物，包括迈克尔·乔丹的篮球球衣、穆罕默德·阿里的拳击长袍，以及格特鲁德·埃德尔横渡英吉利海峡时戴的泳镜等体育纪念品。"],"type":"paragraph"},{"n":6,"t":["There are also serious exhibits, like “The Price of Freedom,” which shows objects from the wars in which the United States was involved. Among the many important artifacts you can see at this museum is the original Star Spangled Banner. This unique flag is the one that flew above Fort McHenry and inspired Francis Scott Key to write our national anthem.","馆内也有主题严肃的展览，比如《自由的代价》，展出美国参与的历次战争留下的物品。这座博物馆的重要文物中有一面最初的“星条旗”。这面独特的旗帜曾飘扬在麦克亨利堡上空，启发弗朗西斯·斯科特·基写下美国国歌的歌词。"],"type":"paragraph"},{"n":7,"t":["One of the most popular Smithsonian sites is the National Air and Space Museum. This is where you can see the *Spirit of St. Louis*, the plane Charles Lindbergh flew across the Atlantic Ocean. The museum also houses the Wright brothers’ airplane from 1903, as well as the *Columbia* space module, which landed on the moon carrying Neil Armstrong and Buzz Aldrin. You can even see a rock that was brought back from the moon!","史密森学会最受欢迎的场馆之一是国家航空航天博物馆。你可以在这里看到查尔斯·林德伯格飞越大西洋时驾驶的“圣路易斯精神号”。馆内还收藏着莱特兄弟1903年制造的飞机，以及把尼尔·阿姆斯特朗和巴兹·奥尔德林送到月球的“哥伦比亚号”航天舱。你甚至可以看到一块从月球带回来的岩石！"],"type":"paragraph"}],"original":[{"n":1,"ask":["objects that are worth remembering\n\n________\nPar. 1","值得留作纪念的物品（第1段）"],"ans":["memorabilia\nPar. 1","memorabilia（纪念品）"],"dir":["Write the words from the passage that have the meanings below.","从文章中找出与下列释义相符的词，写在横线上。"]},{"n":2,"ask":["enormous; wide-reaching\n\n________\nPar. 1","极大的、范围广的（第1段）"],"ans":["vast\nPar. 1","vast（庞大的）"]},{"n":3,"ask":["financially supported\n\n________\nPar. 1","获得资金支持的（第1段）"],"ans":["funded\nPar. 1","funded（得到资助的）"]},{"n":4,"ask":["the act of scattering or spreading out\n\n________\nPar. 2","散布或传播的行为（第2段）"],"ans":["diffusion\nPar. 2","diffusion（传播）"]},{"n":5,"ask":["moved to action\n\n________\nPar. 6","受到启发而行动（第6段）"],"ans":["inspired\nPar. 6","inspired（受到启发的）"]},{"n":6,"ask":["Approximately how many items are there in the Smithsonian’s collection?\n\n________","史密森学会的藏品大约有多少件？"],"ans":["143 million","1.43亿件。"]},{"n":7,"ask":["Do you think that the Smithsonian Institution will continue to accumulate more artifacts? Why or why not?\n\n________","你认为史密森学会会继续增加馆藏吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":8,"ask":["How is the Smithsonian’s National Zoological Park different from its other museums?\n\n________","史密森学会的国家动物园与其他博物馆有什么不同？"],"ans":["Possible answer: the exhibits are living animals","参考答案：展出的是活的动物。"]},{"n":9,"ask":["What body of government decided how Smithson’s money would be used?\n\n________","哪个政府机构决定如何使用史密森的钱？"],"ans":["Congress","国会。"]},{"n":10,"ask":["Name two items you could find displayed in the National Museum of American History.\n\n________","说出两件你可以在美国国家历史博物馆看到的展品。"],"ans":["Answers will vary. Possible answer: a basketball jersey and a boxing robe.","答案可以不同。参考答案：一件篮球球衣和一件拳击长袍。"]},{"n":11,"ask":["Does this selection take place in reality, or is it a fantasy? How can you tell?\n\n________","这篇文章写的是现实还是幻想？你怎么判断的？"],"ans":["reality; Answers will vary. There is important information about different museums.","现实。答案可以不同。文章提供了关于各家博物馆的重要信息。"]},{"n":12,"ask":["Check the word or words that best describe what type of passage this is.\n\n- ________ how-to\n- ________ informative\n- ________ biography","勾选最符合本文体裁的一项。\nA. 操作指南\nB. 说明文\nC. 传记"],"ans":["✓ informative","B. 说明文。"]}]},{"id":"P058","title":["Always Have Hope","永远有“希望”"],"lead":["What are some precious stones besides diamonds?","除了钻石，还有哪些珍贵的宝石？"],"exercise":"P059","genre":"说明文","family":"info","parts":[{"n":1,"t":["What do you think is the most valuable piece of jewelry in the world? It depends on what standards the jewelry is judged by, but if you guessed the Hope diamond, there is a good chance you would be right.","你认为世界上最贵重的首饰是哪一件？这取决于用什么标准来衡量。不过，如果你猜的是“希望钻石”，那很可能猜对了。"],"type":"paragraph"},{"n":2,"t":["The Hope diamond is an unusual blue-gray gem that is believed to have been mined in Golconda, India. The French jeweler Jean-Baptiste Tavernier bought a 112-carat stone, which he brought home to France. (A carat is a unit of weight for measuring the size of precious stones. It is equivalent to 200 milligrams.) Historians believe that King Louis XIV purchased the diamond in 1668 as part of the French crown jewels. The diamond was eventually recut, and a large portion of it, called the French Blue, disappeared in a robbery in 1792.","希望钻石是一颗罕见的蓝灰色宝石，据说开采自印度的戈尔康达。法国珠宝商让-巴蒂斯特·塔韦尼耶买下了一颗112克拉的宝石，并把它带回了法国。（克拉是衡量宝石大小的重量单位。1克拉等于200毫克。）历史学家认为，路易十四国王于1668年购入这颗钻石，把它纳入法国王室珠宝。后来钻石被重新切割，切出的一大块被称为“法国蓝钻”，在1792年的一次抢劫中失踪了。"],"type":"paragraph"},{"n":3,"t":["No one knows for certain the path of the diamond after its theft. However, a similar but smaller diamond was recorded as being part of the collection of a man named Henry Philip Hope. No record exists to verify where Hope got the diamond or how much he paid for it.","钻石被盗后的确切去向无人知晓。不过，记载显示，一颗与它相似但较小的钻石曾是亨利·菲利普·霍普的藏品。没有记录能证实霍普从哪里得到它，或买它花了多少钱。"],"type":"paragraph"},{"n":4,"t":["Relatives inherited the diamond after Hope's death. It was passed along through several generations when Lord Francis Hope decided to sell the diamond to pay off his debts. Subsequent owners also were driven to sell the diamond at times when they were in need of the money it would bring.","霍普去世后，亲属继承了钻石。它在家族中传了好几代，直到弗朗西斯·霍普勋爵决定卖掉钻石来偿还债务。后来的几位主人也曾在缺钱时，不得不卖掉钻石来筹钱。"],"type":"paragraph"},{"n":5,"t":["In 1912, the Hope diamond finally found a semi-permanent home with a woman by the name of Evalyn Walsh McLean. She had the stone reset among 16 pear-shaped white diamonds. Then, it was placed on a necklace that was strung with 45 smaller diamonds.","1912年，希望钻石终于在一位名叫伊芙琳·沃尔什·麦克莱恩的女士那里安定了一段时间。她让人重新镶嵌这颗钻石，四周围着16颗梨形白钻。随后，镶好的钻石被安在一条串有45颗小钻石的项链上。"],"type":"paragraph"},{"n":6,"t":["In 1949, after Mrs. McLean's death, the Hope diamond was sold to a well-known jeweler and diamond dealer named Harry Winston, in order to settle Mrs. McLean's debts. Winston exhibited the famous diamond at many events, but he never sold it. Instead, he decided to donate it to the Smithsonian Institution in 1958. How did Winston transport the fine piece of jewelry? By armored truck? Via special delivery, with the assistance of many security officers? No, Winston just chose to send it through the United States Postal Service!","麦克莱恩夫人去世后，为了清偿她的债务，希望钻石于1949年被卖给了著名珠宝商兼钻石经销商哈里·温斯顿。温斯顿在许多活动中展出过这颗名钻，一直没有把它卖掉，最终决定于1958年将它捐给史密森学会。温斯顿是怎样运送这件珍贵首饰的呢？用装甲车？请许多安保人员护送，走专人递送？他只是通过美国邮政寄了过去！"],"type":"paragraph"},{"n":7,"t":["Ever since then, the Hope diamond has been part of the Smithsonian Institution's National Museum of Natural History. Because of its size, 45.52 carats, and its unusual blue coloring, it is breathtaking to see in person. It also contains a phosphorescence that is uncommon in gemstones. When the Hope diamond is exposed to ultraviolet light, it will glow red for a few seconds.","从那以后，希望钻石就一直是史密森学会国家自然历史博物馆的馆藏。它重达45.52克拉，蓝色也很罕见，亲眼见到会令人惊叹。它还有一种宝石中罕见的磷光特性。受到紫外线照射时，它会发出几秒钟的红光。"],"type":"paragraph"},{"n":8,"t":["It is no surprise that the Hope Diamond is the most popular exhibit in the museum. It has been seen by millions of visitors who are intrigued by the stone's mysterious history and the legends that the owners will be the victim of great misfortune. Everyone seems to want to catch a glimpse of this mysterious, sparkling beauty.","希望钻石是馆里最受欢迎的展品，这并不奇怪。数以百万计的参观者看过它。他们被这颗钻石的神秘历史所吸引，也对传说中钻石主人会遭遇大不幸的说法感到好奇。每个人似乎都想看看这件神秘而闪耀的珍宝。"],"type":"paragraph"}],"original":[{"n":1,"ask":["On the lines below, write a summary for paragraph 5.\n________","概括第5段的内容。"],"ans":["Answers will vary.","答案可以不同。"]},{"n":2,"ask":["What happens when the Hope diamond is exposed to ultraviolet light?\n________","希望钻石受到紫外线照射时，会发生什么？"],"ans":["It will glow red for a few seconds.","它会发出几秒钟的红光。"]},{"n":3,"ask":["According to legend, what happens to owners of the Hope diamond?\n________","据传说，希望钻石的主人会遭遇什么？"],"ans":["They will have great misfortune.","他们会遭遇大不幸。"]},{"n":4,"ask":["How did Harry Winston send the Hope diamond to the Smithsonian Institution?\n________","哈里·温斯顿是怎样把希望钻石寄给史密森学会的？"],"ans":["through the U.S. postal service","通过美国邮政。"]},{"n":5,"ask":["Who owned the Hope diamond before Harry Winston?\n________","在哈里·温斯顿之前，希望钻石是谁的？"],"ans":["Evalyn Walsh McLean","伊芙琳·沃尔什·麦克莱恩。"]},{"n":6,"ask":["Number the events below to show the order in which they happened.\n\n- ________ Mrs. McLean had the Hope diamond reset.\n- ________ Lord Francis Hope sold the Hope diamond.\n- ________ Harry Winston donated the Hope diamond to the Smithsonian Institution.\n- ________ Jean-Baptiste Tavernier traveled to India.\n- ________ The French Blue diamond was stolen in a robbery of the French crown jewels.","给下列事件编号，表示它们发生的先后顺序。\n麦克莱恩夫人重新镶嵌希望钻石。\n弗朗西斯·霍普勋爵卖掉希望钻石。\n哈里·温斯顿把希望钻石捐给史密森学会。\n让-巴蒂斯特·塔韦尼耶前往印度。\n法国蓝钻在法国王室珠宝抢劫案中被盗。"],"ans":["- **4** Mrs. McLean had the Hope diamond reset.\n- **3** Lord Francis Hope sold the Hope diamond.\n- **5** Harry Winston donated the Hope diamond to the Smithsonian Institution.\n- **1** Jean-Baptiste Tavernier traveled to India.\n- **2** The French Blue diamond was stolen in a robbery of the French crown jewels.","4. 麦克莱恩夫人重新镶嵌希望钻石。\n3. 弗朗西斯·霍普勋爵卖掉希望钻石。\n5. 哈里·温斯顿把希望钻石捐给史密森学会。\n1. 让-巴蒂斯特·塔韦尼耶前往印度。\n2. 法国蓝钻在法国王室珠宝抢劫案中被盗。"]},{"n":7,"ask":["What is a carat?\n________","什么是克拉？"],"ans":["a unit of weight for measuring the size of a precious stone","衡量宝石大小的重量单位。"]},{"n":8,"ask":["Where did the Hope Diamond get its name?\n________","希望钻石因何得名？"],"ans":["from its owner at one point in time, Henry Philip Hope","名字来自它曾经的主人亨利·菲利普·霍普（Hope）。"]}]},{"id":"P060","title":["Flying into History","飞入史册"],"lead":["Have you ever flown in a plane?","你坐过飞机吗？"],"exercise":"P061","genre":"传记","family":"info","parts":[{"n":1,"t":["When you turn on the television or read a magazine, celebrities are everywhere. Although fame and the media play such major roles in our lives today, it has not always been that way. Eighty years ago, radio and movies were just beginning to have that kind of effect on Americans. Many historians agree that Charles Lindbergh was one of the first major celebrities, or superstars.","打开电视或翻开杂志，随处都能看见名人。如今名气和媒体在我们的生活里举足轻重，但从前并非如此。80年前，广播和电影才刚刚开始对美国人产生这种影响。许多历史学家认为，查尔斯·林德伯格是最早家喻户晓的名人之一，也可以说是最早的一批超级明星。"],"type":"paragraph"},{"n":2,"t":["Lindbergh was born in Detroit, Michigan, in 1902, but he grew up in Little Falls, Minnesota. As a child, he was very interested in how things worked, so when he reached college, he pursued a degree in engineering. At the age of 20, however, the allure of flying captured Lindbergh's imagination. He quit school and moved to Nebraska where he learned to be a pilot. Soon after, Lindbergh bought his own plane and traveled the nation performing aerial stunts.","林德伯格1902年出生在密歇根州底特律，却是在明尼苏达州小瀑布城长大的。他小时候特别想知道各种东西是怎么运转的，所以进了大学便攻读工程学学位。不过，20岁时他被飞行深深吸引。他退了学，搬到内布拉斯加州，在那里学会了驾驶飞机。不久后，他买了自己的飞机，到美国各地表演空中特技。"],"type":"paragraph"},{"n":3,"t":["In 1924, Lindbergh became more serious about flying. He joined the United States military and graduated first in his pilot class. Lindbergh used this additional training to get a job as an airmail pilot, flying out of St. Louis, Missouri.","1924年，林德伯格开始更认真地对待飞行。他加入美国军队，并以飞行员训练班第一名的成绩毕业。凭借这段额外的训练经历，他找到了一份航空邮递飞行员的工作，从密苏里州圣路易斯起飞运送邮件。"],"type":"paragraph"},{"n":4,"t":["During the same time, a wealthy hotel owner named Raymond Orteig was offering a generous award to the first pilot who could fly nonstop from New York City to Paris, France. The Orteig Prize was worth $25,000—a large amount even by today's standards.","就在那段时间，名叫雷蒙·奥泰格的富有旅馆业主给出了丰厚的悬赏，奖给第一位能从纽约市直飞法国巴黎、中途不停的飞行员。奥泰格奖价值25000美元，即便按今天的标准，这也是一大笔钱。"],"type":"paragraph"},{"n":5,"t":["Lindbergh knew he had the skills to complete the flight, but not just any plane was capable of flying that far for that long. Working with an aviation company from San Diego, California, and with financial help from the city of St. Louis, Lindbergh got a customized airplane that could make the journey.","林德伯格知道自己的飞行技术足以完成这次飞行，但能连续飞那么久、飞那么远的飞机并不多。加利福尼亚州圣迭戈的一家航空公司与他合作，圣路易斯市也提供了资金，林德伯格终于有了一架为这段航程量身打造的飞机。"],"type":"paragraph"},{"n":6,"t":["On May 20, 1927, Charles Lindbergh took off from Roosevelt Field in New York City and arrived the next day at an airstrip outside Paris. Named in honor of his sponsor, *The Spirit of St. Louis* carried Lindbergh across the Atlantic Ocean and into the record books. He became a national hero and a huge celebrity.","1927年5月20日，查尔斯·林德伯格从纽约市的罗斯福飞行场起飞，第二天在巴黎城外的一条简易跑道着陆。为向赞助方致意，他把飞机命名为“圣路易斯精神号”。这架飞机载着他飞越大西洋，也让他的名字载入了史册。他成了美国的民族英雄和名声显赫的人物。"],"type":"paragraph"},{"n":7,"t":["When he returned to the United States, Lindbergh rode in a ticker-tape parade held to celebrate his accomplishment. He also received a Medal of Honor, the highest United States military decoration. A very popular dance was even named for Charles Lindbergh—the Lindy Hop. Today, *The Spirit of St. Louis* is kept at the Smithsonian Institute's National Air and Space Museum in Washington, D.C.","林德伯格回到美国后，参加了为庆祝他的成就而举行的彩带游行。他还获得了美国最高军事勋章——荣誉勋章。当时甚至有一种很流行的舞以查尔斯·林德伯格命名，叫作林迪舞。如今，“圣路易斯精神号”保存在华盛顿特区史密森学会的国家航空航天博物馆。"],"type":"paragraph"},{"n":"u1","t":["Spirit of St. Louis","圣路易斯精神号"],"type":"note"}],"original":[{"n":1,"ask":["Check the word or words that best describe what type of passage this is.\n\n- ________ historical fiction\n- ________ historical nonfiction\n- ________ legend","勾选最符合本文的一种体裁。\nA. 历史小说\nB. 历史纪实作品\nC. 传说"],"ans":["✓ historical nonfiction","B. 历史纪实作品。"]},{"n":2,"ask":["Check the words that best describe Charles Lindbergh.\n\n- ________ adventurous\n- ________ quiet\n- ________ determined\n- ________ kind\n- ________ daring","勾选最符合查尔斯·林德伯格特点的词。\n爱冒险\n安静\n有决心\n善良\n勇于尝试"],"ans":["✓ adventurous\n✓ determined\n✓ daring","爱冒险、有决心、勇于尝试。"]},{"n":3,"ask":["What did Lindbergh have to do in order to win the Orteig prize?\n________","林德伯格必须怎么做才能获得奥泰格奖？"],"ans":["fly nonstop from New York City to Paris","从纽约市直飞巴黎，中途不停。"]},{"n":4,"ask":["Why was Lindbergh’s plane named *The Spirit of St. Louis*?\n________","林德伯格的飞机为什么被命名为“圣路易斯精神号”？"],"ans":["because the city of St. Louis financially supported his flight","因为圣路易斯市为他的飞行提供了资金。"]},{"n":5,"ask":["Why do you think Lindbergh was one of America’s first celebrities?\n________","你认为林德伯格为什么成为美国最早的一批名人之一？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":6,"ask":["Where is *The Spirit of St. Louis* kept today?\n________","“圣路易斯精神号”如今保存在什么地方？"],"ans":["the Smithsonian's National Air and Space Museum in Washington, DC","华盛顿特区史密森学会的国家航空航天博物馆。"]},{"n":7,"ask":["Check the sentence that best states the main idea of the passage.\n\n- ________ The dance called the Lindy Hop was named for Charles Lindbergh.\n- ________ Lindbergh graduated first in his military pilot class.\n- ________ Lindbergh, one of America’s first celebrities, flew nonstop from New York City to Paris.","勾选最能概括文章主旨的句子。\nA. 林迪舞是以查尔斯·林德伯格命名的。\nB. 林德伯格以军队飞行员训练班第一名的成绩毕业。\nC. 林德伯格是美国最早的一批名人之一，他曾从纽约市直飞巴黎，中途不停。"],"ans":["✓ Lindbergh, one of America’s first celebrities, flew nonstop from New York City to Paris.","C. 林德伯格是美国最早的一批名人之一，他曾从纽约市直飞巴黎，中途不停。"]},{"n":8,"ask":["In paragraph 5, what does *customized* mean?\n________","第5段中的 customized 是什么意思？"],"ans":["built to meet specific needs or according to specific guidelines","按具体需求或特定要求定制的。"]},{"n":9,"ask":["Why do you think Orteig wanted someone to fly from New York to France?\n________","你认为奥泰格为什么希望有人从纽约飞到法国？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P062","title":["A Move to Safety","搬到安全的地方"],"lead":["Will the Mahaulus have to move to stay out of the path of the Kilauea Volcano?","为了避开基拉韦厄火山的威胁，马哈乌卢一家必须搬家吗？"],"exercise":"P063","genre":"故事","family":"lit","parts":[{"n":1,"t":["The Mahaulus sat at the kitchen table. The curtains fluttered in the gentle, fragrant breeze. The sun was shining and filled the kitchen with a warm, buttery light. It was a perfect day for having a picnic or going surfing. But in the Mahaulus’ kitchen, no one seemed to be paying attention to the weather.","马哈乌卢一家围坐在厨房的餐桌旁。微风带着香气轻轻吹动窗帘。阳光灿烂，厨房里洒满温暖的淡黄色光辉。这是个野餐或冲浪的好日子，可厨房里似乎谁也没留意天气。"],"type":"paragraph"},{"n":2,"t":["Leilani and Kala dejectedly picked at a bowl of pretzels. “Okay, girls,” said Mrs. Mahaulu. “I can tell by the expressions on your faces that you have a pretty good idea of why we needed to have this family meeting.” Leilani and Kala exchanged looks and slowly nodded.","莱拉妮和卡拉没精打采地拨弄着碗里的椒盐脆饼。“好了，姑娘们，”马哈乌卢太太说，“看你们的表情，我就知道你们大概猜到为什么我们要开这次家庭会议了。”莱拉妮和卡拉对视一眼，慢慢点了点头。"],"type":"paragraph"},{"n":3,"t":["“Your mom and I have been having many conversations lately about the possibility of moving,” said Mr. Mahaulu. “We were hoping that it wouldn’t come to this, but we don’t see any alternative.”","“最近你们妈妈跟我谈过好多次，说要不要搬家，”马哈乌卢先生开口了，“我们原本希望不用走到这一步，但眼下也想不出别的办法。”"],"type":"paragraph"},{"n":4,"t":["“But Dad,” protested Kala, “Kilauea has been an active volcano since 1983! Nothing has happened to us or to our house yet. I know we’ll be safe here.”","“可是爸爸，”卡拉反驳道，“基拉韦厄火山从1983年起就一直是座活火山！我们和房子到现在都没出过事。我知道我们住在这儿会很安全。”"],"type":"paragraph"},{"n":5,"t":["“You’re right in saying that Kilauea has been active for a long time, Kala,” said Mrs. Mahaulu. “But your dad and I are concerned about all the recent evacuations. Even though we’ve been safe up to this point, there is no way to guarantee that a larger eruption isn’t imminent.”","“卡拉，你说得对，基拉韦厄火山活跃了很久了，”马哈乌卢太太说，“不过，最近已经有过好几次疏散，你爸爸和我都很担心。到目前为止我们是安全的，可没人能保证近期不会有更大规模的喷发。”"],"type":"paragraph"},{"n":6,"t":["“Mom, you’ve said yourself that the government’s warning systems are efficient and effective. Doesn’t that count for anything?” asked Leilani. “This is our home. I can’t even remember living anywhere else!” she added, fighting back tears.","“妈妈，你自己就说过，政府的预警系统又高效又管用。这难道不重要吗？”莱拉妮问。“这里是我们的家呀。我都不记得自己还在别的地方住过！”她强忍着眼泪补充道。"],"type":"paragraph"},{"n":7,"t":["Leilani’s mom put an arm around her daughter’s shoulder. “This isn’t going to be easy on any of us,” she said. “Dad and I love this house, too. We have so many happy memories here. But we’re tired of living with such uncertainty. The most important thing in the world to us is that our family stays safe.”","妈妈伸手搂住莱拉妮的肩。“这事对我们谁都不容易，”她说，“爸爸和我也喜欢这栋房子。我们在这里留下了那么多快乐的回忆。可我们已经受够了这种提心吊胆的日子。对我们来说，全家平安比什么都重要。”"],"type":"paragraph"},{"n":8,"t":["Mr. Mahaulu nodded. “Volcanoes are a fact of life in Hawaii,” he said. “I’m willing to accept that. I’ve never wanted to live anywhere else. But there are places in Hawaii where we’ll feel safer. We’ll have to give up our house, but you know as well as I do that home is wherever we go as a family. We’ll make new memories, and we’ll find things to love about our new home.”","马哈乌卢先生点了点头。“在夏威夷生活就得面对火山，”他说，“我愿意接受这一点，也从没想过要到夏威夷以外的地方住。但夏威夷也有些地方能让我们住得更安心。我们是得舍下这栋房子，不过你们也明白，只要一家人在一起，走到哪儿都是家。我们会有新的回忆，也会找到新家让我们喜爱的地方。”"],"type":"paragraph"},{"n":9,"t":["The girls were quiet for a moment as they considered what it would mean to move. “There are so many things I’ll miss here,” said Kala quietly.","姐妹俩沉默了一会儿，想着搬家意味着什么。“这里有太多东西我会想念的，”卡拉轻声说。"],"type":"paragraph"},{"n":10,"t":["“We all will,” said Mrs. Mahaulu. “But one of the places that your dad and I have looked at has much more room for a garden than we have here. Another place is only a few minutes walk to the beach.”","“我们都会想念的，”马哈乌卢太太说，“但你爸和我看过的房子中，有一处可以辟出比这里大得多的花园。还有一处，走几分钟就能到海滩。”"],"type":"paragraph"},{"n":11,"t":["Kala and Leilani couldn’t help smiling when they heard that. They both spent every spare minute they had surfing. If their parents told them that they could actually live in the water, they would have been perfectly happy.","卡拉和莱拉妮一听，忍不住笑了。姐妹俩一有空就去冲浪。就算爸妈说她们可以直接住在水里，她们也会高兴极了。"],"type":"paragraph"},{"n":12,"t":["Mr. Mahaulu walked around to the other side of the table. He put one large hand on each of his daughter’s shoulders. “I’m proud of you two,” he said. “Thank you for trying to understand why this is so important to your mom and me.”","马哈乌卢先生绕到桌子的另一边，把两只大手分别搭在两个女儿的肩上。“我为你们俩骄傲，”他说，“谢谢你们愿意试着理解，这件事为什么对我和你们妈妈这么重要。”"],"type":"paragraph"},{"n":13,"t":["Leilani and Kala smiled and leaned back against their dad. He was right; home was wherever the family was.","莱拉妮和卡拉笑着向后靠在爸爸身上。他说得对，只要一家人在一起，哪里都是家。"],"type":"paragraph"}],"original":[{"n":1,"ask":["gloomily; in a depressed way\n\n________","闷闷不乐地、沮丧地"],"ans":["dejectedly","dejectedly（沮丧地）"],"dir":["Write the words from the story that have the meanings below.","从故事中找出与下列释义相符的词，写在横线上。"]},{"n":2,"ask":["certain to happen\n\n________","一定会发生的"],"ans":["imminent","imminent（即将发生的）"]},{"n":3,"ask":["without wasting time or energy\n\n________","运作时不浪费时间或精力的"],"ans":["efficient","efficient（高效的）"]},{"n":4,"ask":["producing the desired effect\n\n________","能产生预期效果的"],"ans":["effective","effective（有效的）"]},{"n":5,"ask":["extra\n\n________","多出来的、空余的"],"ans":["spare","spare（空闲的）"]},{"n":6,"ask":["trying not to cry ________","努力忍住不哭"],"ans":["fighting back tears","fighting back tears（强忍眼泪）"],"dir":["Write the idiom from paragraph 6 on the line next to its meaning.","找出第6段中的习语，写在相应释义旁的横线上。"]},{"n":7,"ask":["Why do Mr. and Mrs. Mahaulu think that the family needs to move?\n\n________\n\n________","为什么马哈乌卢夫妇认为全家需要搬走？"],"ans":["The danger of living next to an active volcano is too great.","住在活火山附近太危险了。"]},{"n":8,"ask":["Mr. Mahaulu says that volcanoes are a fact of life in Hawaii. What does he mean?\n\n________\n\n________","马哈乌卢先生说，在夏威夷生活就得面对火山。他是什么意思？"],"ans":["Answers will vary. Possible answer: They are a normal occurrence in Hawaii.","答案可以不同。参考答案：在夏威夷，火山是很平常的。"]},{"n":9,"ask":["Find a sentence in the story showing that one or both of the girls are not enthusiastic about moving.\n\n________\n\n________\n\n________","从故事中找出一句话，说明姐妹俩中至少有一人不愿意搬家。"],"ans":["Possible answer: “There are so many things I’ll miss here,” said Kala quietly","参考答案：“这里有太多东西我会想念的，”卡拉轻声说。"]},{"n":10,"ask":["What arguments do Leilani and Kala use to try to persuade their parents not to move?\n\n________\n\n________\n\n________","莱拉妮和卡拉用哪些理由劝父母别搬家？"],"ans":["The volcano has not erupted yet; the government has warning systems in place.","火山还没有喷发。政府也有预警系统。"]},{"n":11,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to instruct\n- ________ to persuade\n- ________ to entertain","勾选最符合作者写作目的的一项。\nA. 指导读者\nB. 说服读者\nC. 娱乐读者"],"ans":["✓ to entertain","C. 娱乐读者。"]}]},{"id":"P064","title":["Home, Sweet Home","甜蜜的家"],"lead":["What is the strangest place you can think of to live?","你能想到的最奇特的住处是哪里？"],"exercise":"P065","genre":"人物纪实","family":"info","parts":[{"n":1,"t":["Most people feel a strong attachment to their homes. It is not uncommon for people to do everything they can to protect their belongings and the place they call home from danger. But how far would you be willing to go? Would you choose to live in a place that was in a constant state of danger?","大多数人对自己的家都有深厚的感情。人们往往会竭力保护自己的财物和称为家的地方，使它们免受危险。但你愿意做到什么地步呢？你会选择住在一个一直面临危险的地方吗？"],"type":"paragraph"},{"n":2,"t":["For years, it wasn’t a hard question for Jack Thompson to answer. He lived in one of the most dangerous places on Earth, but it was just home to him. Thompson lived in Hawaii near Kilauea, one of the most active volcanoes in the world. He owned a home in a subdivision called Royal Gardens. It was different than subdivisions that might be familiar to you. Thompson was the only resident. Everyone else evacuated when Kilauea began erupting in 1983.","多年来，这个问题对杰克·汤普森来说不难回答。他住在地球上最危险的地方之一，可对他来说，那里就是家。汤普森家在夏威夷，靠近世界上最活跃的火山之一基拉韦厄。他在一个名叫皇家花园的住宅区有一栋房子。这个住宅区和你熟悉的那些可能不一样。汤普森是这里唯一的居民。1983年基拉韦厄火山开始喷发时，其他人都撤走了。"],"type":"paragraph"},{"n":3,"t":["Thompson became accustomed to living in close quarters with the volcano. The flow of the 2,000-degree lava that eventually consumed many of the homes in Thompson’s neighborhood no longer astonished him. He still had a healthy respect for the power of Kilauea, but he did not live every day in fear. After all, it was Thompson’s choice to stay in his home, even though the environment he was used to changed so drastically.","汤普森已经习惯了紧挨着火山生活。温度高达2000华氏度的熔岩最终吞没了周围许多房子，可熔岩流动的景象已经不再让他惊讶。他依然懂得敬畏基拉韦厄火山的威力，却并非每天都生活在恐惧之中。毕竟，即使熟悉的环境发生了如此剧烈的变化，留在自己家里也是他自己的选择。"],"type":"paragraph"},{"n":4,"t":["Thompson’s home was completely encompassed by the products of lava flow. Portions of it cooled enough to allow Thompson a way out, either on foot or by motorcycle. However, his path was unreliable. Bubbling lava lay just below the surface of rock that Thompson crossed. Sometimes, it was hot enough to melt the rubber on his shoes. At any time, a sudden crack could open up, revealing the red-hot dangerous liquid. Thompson knew that he needed to keep moving because it was unsafe to linger for long on the quickly changing surface.","汤普森的家完全被熔岩流留下的物质包围了。其中一些地方冷却到可以通行，他便能步行或骑摩托车外出。但这条路并不可靠。他踩过的岩石表面下方就是冒着泡的熔岩。有时热得连鞋上的橡胶都能熔化。任何时候都可能突然出现裂缝，露出下面危险的红热液体。汤普森知道自己得一直往前走，因为这种变化很快的地面不宜久留。"],"type":"paragraph"},{"n":5,"t":["It took an hour for Thompson to travel three miles over the unsteady rock. When he left his home to get supplies, he had to be sure to purchase all the essentials because he never knew when he might be trapped for a period of time by a fresh lava flow. Thompson did not have a telephone line or electricity, so he learned how to function using solar power, gas appliances, and rainwater that he collected and stored.","汤普森要在不稳的岩石上走3英里，得花一个小时。他出门采购物资时，必须把生活必需品买齐，因为不知道什么时候又会有新的熔岩流，把他困在家里一段时间。他家没有电话线，也没有电力供应，所以他学会了靠太阳能、燃气用具以及自己收集储存的雨水过日子。"],"type":"paragraph"},{"n":6,"t":["There is no doubt that the life Thompson lead isn’t for everyone. But he loved the natural beauty of his home, and he even liked the isolation that comes with living in such an inaccessible location. Unfortunately, in 2012, the inevitable happened. There had been many close calls over the years. Thompson was used to that. But in 2012, the lava got too close, and Thompson had to evacuate. The lava took over the last remaining house in Royal Gardens. It was time for Jack Thompson to find a new home in Hawaii’s tropical paradise.","毫无疑问，汤普森过的生活并不适合所有人。但他喜欢家园的自然美景，甚至也喜欢住在这样难以到达的地方所带来的与世隔绝。遗憾的是，2012年，不可避免的事发生了。多年来已经有过好多次险情，汤普森对此早已习惯。但在2012年，熔岩逼得太近，他不得不撤离。熔岩吞没了皇家花园最后一栋房子。杰克·汤普森该在夏威夷这片热带乐土另找一个家了。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Jack Thompson became ________ to living in the path of an active volcano.\n\n- related\n- accustomed\n- furious","杰克·汤普森逐渐 _____ 住在活火山熔岩可能流经的地方。\nrelated（有关的）\naccustomed（习惯的）\nfurious（愤怒的）"],"ans":["accustomed","accustomed（习惯的）"],"dir":["Circle the word that best completes each sentence below.","圈出最适合填入下列各句的词。"]},{"n":2,"ask":["Thompson enjoyed living in a beautiful and ________ area.\n\n- terrifying\n- common\n- remote","汤普森喜欢住在一个美丽而 _____ 的地方。\nterrifying（可怕的）\ncommon（普通的）\nremote（偏远的）"],"ans":["remote","remote（偏远的）"]},{"n":3,"ask":["Thompson used several ________ energy sources.\n\n- alternative\n- expensive\n- unrealistic","汤普森使用了几种 _____ 能源。\nalternative（替代的）\nexpensive（昂贵的）\nunrealistic（不切实际的）"],"ans":["alternative","alternative（替代的）"]},{"n":4,"ask":["How was Royal Gardens different than other subdivisions?\n________","皇家花园和其他住宅区有什么不同？"],"ans":["Answers will vary. Possible answer: There was only one resident.","答案可以不同。参考答案：那里只有一位居民。"]},{"n":5,"ask":["What does it mean to live “in close quarters” with the volcano?\n________","与火山“in close quarters”生活是什么意思？"],"ans":["It means living close to, or side-by-side, with the volcano.","意思是住得离火山很近，与火山为邻。"]},{"n":6,"ask":["Why do you think that Thompson refused to move when everyone else sought shelter in safer places?\n________","其他人都去更安全的地方避难了，你认为汤普森为什么不肯搬走？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":7,"ask":["Check the sentence below that is the best summary for paragraph 3.\n\n- ________ The lava that flowed near Thompson’s home averaged about 2,000 degrees.\n- ________ Thompson respected the power of the volcano but had become used to living so close to it.\n- ________ The lava consumed many homes in Thompson’s neighborhood.","勾选最能概括第3段的句子。\nA. 流经汤普森家附近的熔岩平均温度约为2000华氏度。\nB. 汤普森敬畏火山的威力，也已习惯了紧挨着火山生活。\nC. 熔岩吞没了汤普森所在住宅区的许多房子。"],"ans":["Thompson respected the power of the volcano but had become used to living so close to it.","B. 汤普森敬畏火山的威力，也已习惯了紧挨着火山生活。"]},{"n":8,"ask":["How would you feel about living in a dangerous place, the way Jack Thompson did? Explain.\n________","如果你像杰克·汤普森那样住在一个危险的地方，会有什么感受？请说明。"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P066","title":["Moving Mountains","移动的山"],"lead":["Where are most of the world’s volcanoes located?","世界上的火山大多分布在哪里？"],"exercise":"P067","genre":"科普说明文","family":"info","parts":[{"n":1,"t":["Have you ever heard of the Ring of Fire? It might sound like something straight out of science fiction, but it is a real place. The Ring of Fire is the name used by scientists to describe an area where frequent volcanic eruptions and earthquakes take place. In fact, about 75 percent of the world’s 1,900 active and dormant, or inactive, volcanoes are located there.","你听说过“火环”吗？这个名字听起来像出自科幻小说，但它确实存在。科学家用“火环”来称呼一个经常发生火山喷发和地震的地区。事实上，世界上1900座活火山和休眠火山（即处于不活跃状态的火山）中，约有75%位于这里。"],"type":"paragraph"},{"n":2,"t":["In some parts of the world, giant pieces of Earth’s crust, called plates, are constantly in motion. They collide and slowly slide over, under, and past one another. The Ring of Fire is located at the juncture of the Pacific plate with several other plates. The Ring of Fire is an arc-shaped region that runs along the coast of North and South America, along the eastern edge of Asia, across Alaska’s Aleutian Islands, and along the coast of New Zealand in the South Pacific.","在世界的一些地方，地壳上被称为板块的巨大岩块一直在运动。它们相互碰撞，缓慢地从另一块板块的上方、下方或侧面滑过。火环位于太平洋板块和其他几个板块的交界处。这一弧形区域沿着北美洲和南美洲的海岸延伸，经过亚洲东缘和阿拉斯加的阿留申群岛，再沿着南太平洋的新西兰海岸延伸。"],"type":"paragraph"},{"n":3,"t":["Sometimes, plates move past one another without creating much of a disturbance. Other times, when two plates collide, an earthquake occurs. This is exactly what happens at the well-known San Andreas Fault in California, and it is why earthquakes are so common in that part of the country.","有时板块彼此滑过，并没有引起多大动静。另一些时候，两块板块碰撞就会发生地震。加利福尼亚州著名的圣安德烈亚斯断层正是这种情况，这也是美国这一地区常发生地震的原因。"],"type":"paragraph"},{"n":4,"t":["Even though the plates move relatively slowly, at about the same rate that human fingernails grow, the friction they create as they slide into one another produces a great deal of energy. The heat from inside Earth is strong enough to melt rock and turn it into magma, or molten rock. Eventually, the magma rises because it is lighter, or less dense, than the rocky material that surrounds it. When it reaches the surface, it becomes known as lava and forms volcanoes.","板块移动得比较慢，速度大致相当于人的指甲生长速度，但它们相向滑动时产生的摩擦会释放大量能量。地球内部的热量足以熔化岩石，使之变成岩浆，也就是熔融的岩石。岩浆比周围的岩石轻，也就是密度更小，因此最终会向上升。它到达地表后就称为熔岩，并形成火山。"],"type":"paragraph"},{"n":5,"t":["The presence of dissolved gases in the magma determines whether or not the eruption will be explosive. Picture a bottle of soda that has been shaken. When the bottle is opened, the gases cause the liquid to explode from the bottle with force. In the same way, volcanoes that have a high concentration of gases will also explode with greater force.","岩浆中有没有溶解的气体，决定了火山会不会发生爆炸性喷发。想象一瓶摇晃过的汽水。打开瓶子时，气体会把液体猛地从瓶里喷出来。同样，如果火山岩浆中的气体浓度很高，火山喷发的力量也就更大。"],"type":"paragraph"},{"n":6,"t":["Although most people view volcanoes as enormous and potentially dangerous mountains, scientists see them as temporary structures on Earth’s surface. They may not change much over the course of a lifetime, or even several lifetimes. Still, scientists know that over time volcanoes will move and shift, rise and fall with the movement of Earth’s plates.","大多数人觉得火山是高大而可能有危险的山，科学家则把它们看作地球表面的暂时构造。在人的一生，甚至几代人的时间里，火山可能都不会有多大变化。不过，科学家知道，时间一长，火山会随着地球板块的运动而移动、变形、升起或下沉。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What is one difference between the way that scientists view volcanoes and most other people view them?\n\n________","科学家和多数其他人对火山的看法有哪一点不同？"],"ans":["Possible answer: People see volcanoes as erupting mountains, but scientists see them as temporary structures.","参考答案：一般人把火山看作会喷发的山，科学家把它们看作暂时的构造。"]},{"n":2,"ask":["For what reason is the San Andreas Fault well known?\n\n________","圣安德烈亚斯断层因何闻名？"],"ans":["Possible answer: because earthquakes are common there","参考答案：那里常发生地震。"]},{"n":3,"ask":["The author compares the rate at which Earth’s plates move with something that is more familiar. What is the other element in the comparison?\n\n________","作者用一种更常见的现象来比喻地球板块移动的速度。这种现象是什么？"],"ans":["the growth of human fingernails","人的指甲生长。"]},{"n":4,"ask":["Name two continents that border the Ring of Fire.\n\n________","说出两个与火环相邻的大洲。"],"ans":["Possible answers: Asia, North America, South America","参考答案：亚洲、北美洲、南美洲中任选两个。"]},{"n":5,"ask":["What percentage of the world’s volcanoes are located in the Ring of Fire?\n\n________","世界上的火山有百分之多少位于火环？"],"ans":["75 percent","75%。"]},{"n":6,"ask":["Why does magma rise to the surface?\n\n________","岩浆为什么会升到地表？"],"ans":["because it is lighter, or less dense, than the rocky material that surrounds it","因为它比周围的岩石轻，也就是密度较低。"]},{"n":7,"ask":["What purpose would a reader have for reading this passage?\n\n- ________ for pleasure or entertainment\n- ________ for information\n- ________ to learn how to solve a problem","读者出于什么目的会阅读本文？\nA. 消遣或娱乐\nB. 获取信息\nC. 学习如何解决一个问题"],"ans":["✓ for information","B. 获取信息。"]},{"n":8,"ask":["In paragraph 4, which word means “the rubbing together of two objects or surfaces”?\n\n________","第4段中，哪个词意为“两个物体或表面相互擦过”？"],"ans":["friction","friction（摩擦）"]}]},{"id":"P068","title":["Watery Giants","海中的巨浪"],"lead":["What are the oceans’ most destructive waves, and what causes them?","破坏力最强的海浪是什么？它们是怎样形成的？"],"exercise":"P069","genre":"科普说明文","family":"info","parts":[{"n":1,"t":["If you have ever gone swimming in an ocean or in one of the Great Lakes, you may have some idea how powerful waves can be. Waves that are only a few feet tall hold enough energy to knock you off your feet. Now, try to imagine the power of a wave that is 50 feet tall and more than 100 miles wide, traveling at speeds of as much as 500 miles per hour. It’s easy to see how such a wave could devastate an entire town.","如果你曾在海里或五大湖中的某个湖里游过泳，你大概知道浪的力量有多大。几英尺高的浪就能把人掀翻。现在试想一下，一道50英尺高、100多英里宽、时速可达500英里的浪，会有多大的力量。这样一道浪完全可能摧毁整座城镇。"],"type":"paragraph"},{"n":2,"t":["The name for these enormous waves is *tsunami*, which means *harbor wave* in Japanese. Tsunamis are caused by a disturbance in the ocean, such as an earthquake or undersea volcanic eruption. Although underwater disturbances are the most common cause of tsunamis, they can also occur if a large meteorite crashes into the ocean.","这种巨浪叫海啸，tsunami 在日语里意为“港湾的浪”。海洋受到扰动时会产生海啸，比如发生地震或海底火山喷发。海底扰动最常引发海啸，大陨石撞入海中也可能造成海啸。"],"type":"paragraph"},{"n":3,"t":["Tsunamis may be relatively small when they are far out at sea. However, as they draw closer and closer to shore, they gather power. One sign of an approaching tsunami is water that recedes at the shore. This occurs because so much of the ocean water is sucked into the wave as it gathers strength.","海啸在远海时可能相对较小，但越靠近海岸，力量就越大。海水从岸边退去是海啸来临的一个迹象。这是因为浪头积聚力量时，大量海水被卷进了浪里。"],"type":"paragraph"},{"n":4,"t":["Tsunamis do not consist of a single wave. One wave follows another in a series that may last several hours. A *period* is the length of time in between waves. For average wind-powered waves, a period may be about ten seconds long. Because a tsunami is so much larger, its period may be as long as an hour.","海啸由一连串的浪组成，一个接一个，可能持续几小时。两道浪之间的时间间隔叫周期。普通的风浪周期大约是10秒。海啸的浪大得多，周期可能长达一小时。"],"type":"paragraph"},{"n":5,"t":["Tsunamis have destroyed homes, schools, and entire coastal towns in minutes. The force of a wave as it breaks can be strong enough to travel several hundred feet inland. That is exactly what happened to Hilo, a town on the island of Hawaii, in 1946. At that time, there was not yet an accurate warning system in place.","海啸能在几分钟内摧毁住宅、学校，甚至整个沿海城镇。浪头破碎时冲力极大，足以冲进内陆几百英尺。1946年，夏威夷岛的希洛镇就遭遇了这样的灾难。当时还没有准确的预警系统。"],"type":"paragraph"},{"n":6,"t":["An earthquake registering 7.1 on the Richter scale occurred in Alaska’s Aleutian Islands on April 1. About four hours later, Hawaii was struck with the first of seven waves. The waves measured between 24 and 32 feet in height and arrived at 15 to 20 minute intervals. By the time the tsunamis had run their course, 159 lives had been taken.","4月1日，阿拉斯加的阿留申群岛发生里氏7.1级地震。大约4小时后，7道海浪中的第一道袭击了夏威夷。浪高24至32英尺，每隔15至20分钟涌来一道。等海啸全部过去，已有159人丧生。"],"type":"
