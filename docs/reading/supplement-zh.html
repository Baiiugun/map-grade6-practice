<script id="book-data" type="application/json">{"modules":[{"id":"A","title":"整体理解","en":"Meaning & Message","color":"#26686c"},{"id":"B","title":"细节、推断与证据","en":"Details, Inference & Evidence","color":"#365c91"},{"id":"C","title":"词汇与语境","en":"Vocabulary in Context","color":"#966d25"},{"id":"D","title":"结构与功能","en":"Structure & Function","color":"#755d93"},{"id":"E","title":"作者目的与表达","en":"Purpose, Perspective & Effect","color":"#a85840"},{"id":"F","title":"文学要素与手法","en":"Literary Elements & Craft","color":"#386f53"},{"id":"G","title":"图表与实用信息","en":"Visual & Functional Reading","color":"#3f6d8b"},{"id":"H","title":"跨文本比较与整合","en":"Compare & Synthesize","color":"#916078"}],"skills":[{"id":"A1","module":"A","title":"找中心思想","en":"Main Idea / Main Focus","goal":"把全文或多段内容压缩成能覆盖主要信息的一句话。","requirements":["区分话题、核心意思和支持细节；中心思想必须说明“作者围绕这个话题说了什么”。","综合开头、主体和结尾，识别反复出现的意思；不把开头的引子或篇幅最长的例子直接当作主旨。","用全文覆盖范围核对选项，排除只说一个例子、范围过大或加入原文没有的评价的答案。"],"prompts":["What is the main idea of this passage?","What is the article mainly about?"],"trap":"“文章提到了”不等于“能概括全文”；中心思想也不一定逐字出现在某一句中。"},{"id":"A2","module":"A","title":"找核心观点与中心论点","en":"Central Claim / Main Argument","goal":"从议论性文本中找出作者最想让读者接受的判断或主张。","requirements":["区分作者的论点、支持论点的理由、证据与所举例子。","追踪结论句、评价词和论证重心，判断几个理由共同服务于什么主张。","区分作者自己的立场与文章转述的其他人的立场。"],"prompts":["What is the author’s main claim?","What is the main argument in Passage 1?"],"trap":"论点回答“作者主张什么”，支持理由回答“作者为什么这样主张”。"},{"id":"A3","module":"A","title":"概括、拟标题与选标语","en":"Summary / Title / Slogan","goal":"用简洁、准确的表达保留整篇材料的核心信息。","requirements":["把多个具体发现归并为共同结论，保留必要信息而不罗列所有细节。","为文章选择覆盖主题及核心意思的标题，不选只对应一段或一个趣闻的标题。","把实用文本的核心服务、特点或倡议概括成贴切的标语。"],"prompts":["Which slogan best matches the web page?","What would be the best title for this passage?"],"trap":"概括不能添加新结论；最吸引人的标题未必最贴切。"},{"id":"A4","module":"A","title":"提炼文学主题","en":"Theme / Author’s Message","goal":"从人物经历、冲突、意象或结局中提炼超越具体故事的意义。","requirements":["区分故事写了什么与作品借故事表达什么；主题不只是人物、地点或单个情节。","结合标题、反复意象、前后反差和结局，概括作品对生活、关系或人性的看法。","用全篇证据检验主题，避免把某个人物的一句话自动等同于作者的最终表达。"],"prompts":["What is the theme of the poem / play?","What is the main theme of this extract?"],"trap":"主题可以用概念或完整判断表达；关键是揭示作品意义，而不是复述情节。"},{"id":"B1","module":"B","title":"定位细节与匹配改写","en":"Locate Details / Paraphrase","goal":"回到准确位置，核对原文与选项是否表达相同的信息。","requirements":["按题干关键词、人物、时间或条件定位，能识别同义改写。","保留原文的限定：谁、何时、多少、主要还是次要、可能还是一定；区分文中信息与自己的常识。","逐项判断“有依据、与原文矛盾、原文未交代”；遇到 NOT / FALSE / EXCEPT 时按题意选择。"],"prompts":["According to the passage, which statement is TRUE?","Which of the following is NOT mentioned?"],"trap":"“没有写”与“写了相反意思”不同；真实世界中正确的说法，也可能缺少本题文本依据。"},{"id":"B2","module":"B","title":"理清因果、过程与对比","en":"Cause & Effect / Sequence / Compare & Contrast","goal":"在一篇文本内部读出事件、步骤和事物之间的关系。","requirements":["区分原因、结果、前提和目的，利用 because、once、however 等线索。","按过程顺序连接信息，理解“先满足某条件，才有后续结果”。","比较两类事物时使用同一维度，抓住原文真正强调的差别。"],"prompts":["Why did / does …?","What is the primary difference between …?"],"trap":"先后发生不自动构成因果；文中明确的原因应优先于读者补出的解释。"},{"id":"B3","module":"B","title":"做有依据的推断与预测","en":"Inference / Implied Meaning / Prediction","goal":"把文本线索连接起来，读出没有直接说出的信息。","requirements":["综合措辞、对话、行为、场景和结尾线索，推断身份、事件、原因、关系或言外之意。","预测后续发展时，依据已经出现的伏笔和处境，而不是凭常见故事套路猜结局。","区分“可能合理”与“最有文本支持”；运用词语、文化或生活背景时仍回到具体线索。"],"prompts":["It may be inferred from the passage that …","What is most likely to happen next?"],"trap":"推断需要证据链；一个线索可能支持较宽结论，却不足以锁定更具体的身份或动机。"},{"id":"B4","module":"B","title":"选取并检验证据","en":"Text Evidence / Evidence-Based Pair","goal":"选出能直接支持某个答案、推断或解释的最有力文本依据。","requirements":["先明确要证明的结论，再比较每条引文与结论的对应关系。","区分“相关”与“足以支持”，优先选择更直接、更具体、限制更少的证据。","两步配对题中把前一题答案与后一题证据互相检验；证据不足时重新审视结论。"],"prompts":["Which quote is the best evidence for your answer?","Which choice best suggests that …?"],"trap":"不要因为引文出现同一个词就选它；必须说清这句话如何推出目标结论。"},{"id":"B5","module":"B","title":"迁移规则、分类与推理","en":"Apply a Concept / Classification / Reasoning","goal":"把文章中的定义、规则或论证链用于新的例子和情境。","requirements":["把抽象概念转成可检查的条件，再与新例子、表格项目或实际需求逐一对应。","理解类别包含关系与分类层级，避免把“属于某大类”误当成“具有所有子类特征”。","梳理已知信息、推理步骤与结论，识别科学推理或作者论证能支持到什么程度。"],"prompts":["Which item follows this principle?","Which choice is the logical conclusion?"],"trap":"先使用文中给定的定义和条件；不要只凭例子的表面相似性归类。"},{"id":"C1","module":"C","title":"利用上下文确定词义","en":"Context Clues","goal":"从所在句、相邻句和全文情境中推断词语的具体意思。","requirements":["利用解释、举例、同义、反义、对比或目的线索推断词义。","将候选释义代回原句，检查意思、语气及搭配是否合适。","对不熟悉的外语词或专名，利用文中的对应、重复和介绍方式进行推断。"],"prompts":["As it is used in the passage, … most nearly means …","What does the word … most likely mean?"],"trap":"不能只用最熟悉的中文译义；同一个词在不同句子里可能承担不同意思。"},{"id":"C2","module":"C","title":"辨别多义词与词典义项","en":"Multiple-Meaning Words / Dictionary Definitions","goal":"在多个已知释义中选择当前语境真正使用的义项。","requirements":["识别词的词性、句法位置和搭配，排除词性或使用条件不符的释义。","逐个比较词典义项，而不是看见熟悉的释义就停止。","区分词的日常义与特定语境中的其他含义。"],"prompts":["Which definition matches the word as used here?","Look at the definitions of “movement”. Which one matches?"],"trap":"认识这个词不代表选对了本句义项；必须把定义放回句子。"},{"id":"C3","module":"C","title":"辨析近义词与联想意义","en":"Shades of Meaning / Connotation","goal":"在意思相近的词中辨别语义范围、情绪色彩和强弱程度。","requirements":["比较候选词的具体意义、褒贬、情感强度及适用对象。","区分字面义与联想义，理解某个词为什么能暗示身份、情绪、环境或价值判断。","选替换词时检查是否保留原句的准确含义与人物状态。"],"prompts":["Which word could best replace …?","Why did the author choose the word …?"],"trap":"近义词不能无条件互换；house 与 home 等词可能强调不同的情感内涵。"},{"id":"C4","module":"C","title":"运用词根与词缀","en":"Roots / Prefixes / Suffixes","goal":"拆解单词结构，并用构词信息辅助理解或匹配信息。","requirements":["识别词根、前缀和后缀，理解各部分对词义的贡献。","判断去掉词缀后得到的词及其词性，避免假设所有词都按同一种方式构成。","把同源词的共同含义迁移到工作、资格等实用情境。"],"prompts":["What is the root of the word …?","Removing the noun ending of which word results in a verb?"],"trap":"构词线索应与语境结合；去掉名词后缀并不总能得到动词。"},{"id":"C5","module":"C","title":"理解短语与固定搭配","en":"Phrases / Collocations / Phrasal Verbs","goal":"把短语作为意义单位理解，避免逐词直译。","requirements":["识别短语动词、固定搭配和惯用表达的整体含义。","结合前后文判断短语在本句中的作用，能改写成等义表达。","区分字面动作与约定用法，例如 made reality 与 contribute to。"],"prompts":["What does the phrase … mean?","The words “contribute to” could best be replaced by …"],"trap":"分别认识每个单词，也可能误解整个短语；要按整体意思回到句中核对。"},{"id":"D1","module":"D","title":"追踪组织方式与焦点变化","en":"Organization / Shift in Focus","goal":"读出段落、诗节或叙述关注点如何推进和变化。","requirements":["识别时间推进、对比、问题与解决等组织线索，理解各部分的关系。","逐段或逐节概括“现在在写谁、写什么”，定位从被观察者转向观察者等焦点变化。","比较一篇作品内部不同部分的侧重点，解释这种安排怎样改变表达重心。"],"prompts":["In which paragraph does the author’s focus shift?","How does the final stanza differ from the first?"],"trap":"换人称、换段或出现新名词不一定等于焦点转换；要检查关注内容是否真正改变。"},{"id":"D2","module":"D","title":"理解衔接、指代与句子位置","en":"Coherence / Reference / Sentence Placement","goal":"利用前后文的连接关系判断句意、指代及最合适的句子位置。","requirements":["追踪 it、there、this、they 等指代的对象，并检查单复数、地点和语义是否吻合。","利用 however、also 等连接词，以及总起与举例、已知与新信息的顺序安排句子。","句子插入后同时向前、向后读，确保衔接自然且不打断原有逻辑。"],"prompts":["Where is the BEST place for the sentence to go?","To what does this word / expression refer?"],"trap":"插入句不能只和前一句相关；代词也不一定指距离最近的名词。"},{"id":"D3","module":"D","title":"判断相关性与多余信息","en":"Relevance / Redundancy","goal":"判断一句话是否对文章主线有必要的贡献。","requirements":["先概括段落或全文的主线，再检查每句话是否服务于它。","区分补充说明、必要背景、离题信息与重复信息。","尝试删除候选句，检查是否影响主要意思和上下文衔接。"],"prompts":["Which sentence is redundant?","Which sentence is not necessary?"],"trap":"句子本身真实、有趣或使用相同关键词，也可能不服务于本段重点。"},{"id":"D4","module":"D","title":"解释细节与段落的作用","en":"Purpose of a Detail / Example / Section","goal":"把局部写法与段落重点、全文主旨或论证联系起来。","requirements":["回答为什么提到某个人、历史背景、例子、设问或一组数据，而不是只解释它是什么。","判断局部内容是在举例、对比、铺垫、强调、说明过程还是支持论点。","用“这处内容通过……帮助作者说明……”解释作用，并分清局部功能与整篇目的。"],"prompts":["Why does the author mention …?","What is the purpose of this passage / these statistics?"],"trap":"概括局部内容不等于分析功能；图表与正文的对应关系还需要 G2。"},{"id":"E1","module":"E","title":"判断写作目的","en":"Author’s Purpose / Main Purpose","goal":"判断作者写这篇材料希望读者了解、相信或采取什么行动。","requirements":["结合全文内容、篇幅分配、组织方式及结尾，确定主要目的。","区分介绍信息、讲述发展、解释问题、提出解决办法、说服或请求等不同目的。","在通知、网页、广告和信件中找到具体的服务目标或行动请求。"],"prompts":["What is the main purpose of the passage?","What is the aim / purpose of the letter?"],"trap":"Main Idea 问“主要说什么”，Purpose 问“为什么写”；文章中的一个用途不一定代表整体目的。"},{"id":"E2","module":"E","title":"判断作者立场与评价","en":"Author’s Point of View / Attitude","goal":"从作者选词、取舍和评论中识别其支持、反对或保留的立场。","requirements":["区分作者本人、被引用者、叙述者和人物各自的看法。","结合转折、评价词与结尾，判断作者认同什么，以及认同或质疑的程度。","理解作者对报告或其他资料的评价，区分指出局限与全盘否定。"],"prompts":["Which view does the author agree with?","What does the author think of the report?"],"trap":"不要把引用的观点直接算作作者观点；“不完整”不等于“毫无价值”。"},{"id":"E3","module":"E","title":"判断语气","en":"Tone","goal":"判断作者、诗人或说话者表达时呈现出的态度与情绪色彩。","requirements":["从褒贬用词、句式、标点、修辞和结尾寻找相互支持的线索。","辨认并比较 excited、concerned、neutral、critical、satirical 等语气词及强弱。","结合全文判断主要语气，避免只凭一个词或某个局部事件下结论。"],"prompts":["How is the tone best described?","Overall, the author’s tone is …"],"trap":"Tone 关注表达者的态度；人物当时的心情与作品营造的氛围需要分别判断。"},{"id":"E4","module":"E","title":"判断作品氛围","en":"Mood / Atmosphere","goal":"判断场景与表达共同营造的整体情绪感受。","requirements":["从景物、光线、动作、意象和一组用词判断紧张、荒凉、轻松或感伤等氛围。","综合多条描写线索，解释读者为何会产生这种感受。","区分作品氛围、作者语气与某一个人物的即时情绪。"],"prompts":["What mood does the description convey?","Which word sums up the mood of the poem?"],"trap":"题干有 mood 时仍要看指向：mood of the gang 问人物情绪，应按 F3 分析。"},{"id":"E5","module":"E","title":"推断目标读者与文本出处","en":"Intended Audience / Text Source","goal":"利用内容、格式和写法判断材料面向谁、最可能出现在哪里。","requirements":["根据专业词汇、解释深度、栏目样式及行动请求判断目标读者。","区分通知、课程介绍、资料条目、广告和杂志文章等常见来源情境。","把文本中具体线索与候选读者或出处逐一对应，避免只凭话题判断。"],"prompts":["Who is the notice primarily aimed at?","Where would an article like this most likely appear?"],"trap":"同一个话题可出现在不同媒介；应同时看写法、用途和信息形式。"},{"id":"F1","module":"F","title":"推断时间、地点与时代背景","en":"Setting","goal":"从场景描写、物件、行为和舞台说明中还原故事背景。","requirements":["利用季节、天气、环境及人物活动判断故事发生的时间和地点。","识别能限定时代的技术、用语或社会习俗，比较哪条线索最明确。","阅读戏剧的舞台说明，并区分明确交代与合理推断。"],"prompts":["When does the story take place?","What may be inferred from the stage directions?"],"trap":"一般性的星空、爱情或树木难以限定时代；年代判断需要更有区分度的证据。"},{"id":"F2","module":"F","title":"分析人物身份、性格与关系","en":"Characterization / Traits / Relationships","goal":"从言行和叙述中建立人物形象，理解人物之间及其在故事中的关系。","requirements":["综合对话、动作、他人评价和多处细节，判断身份、年龄或性格特征。","区分单次行为与较稳定的性格，不把人物扮演的角色经历当成本人的经历。","判断人物之间的关系、次要人物的作用，以及作者如何通过写法塑造人物。"],"prompts":["Which choice best describes the character?","What is this character’s role / relationship?"],"trap":"人物特征应由多处言行共同支持；角色身份、人物性格与人物作用是不同的问题。"},{"id":"F3","module":"F","title":"理解人物动机与情感","en":"Character Motivation / Feelings","goal":"结合人物处境解释为什么行动，以及当时的真实感受。","requirements":["从情绪词、动作、语气、处境和前后事件推断行为动机。","辨别相近情绪及其程度，如担心、恐惧、敬畏或不安。","区分人物表面说法与心理需要，理解行为背后的归属感、尊严或希望。"],"prompts":["Why does the character do this?","How does the character most likely feel?"],"trap":"不要把读者的感受或作者的态度套给人物；同一动作在不同处境下可能有不同动机。"},{"id":"F4","module":"F","title":"辨认叙述者与叙述视角","en":"Narrator / Point of View","goal":"判断是谁在讲述、从哪里观察，以及叙述者能够知道多少。","requirements":["结合代词、参与程度和获知信息的范围判断第一或第三人称等叙述方式。","区分作者、叙述者与故事人物；叙述者不一定是事件主角。","识别成年后回顾童年等时间距离，并为视角判断找到证据。"],"prompts":["The passage is told from whose perspective?","What is the narrator’s point of view?"],"trap":"不能只凭出现 I 就判断叙述者是谁；也不能自动把第一人称叙述者当成作者本人。"},{"id":"F5","module":"F","title":"识别文类并说明依据","en":"Genre / Literary Form","goal":"根据作品特征判断文本类型及具体文学类别。","requirements":["区分小说、诗歌和戏剧等形式，识别各自的呈现特征。","在具体作品中判断现实题材、科幻、幻想或某类戏剧等类别。","比较证据的区分度，选择最能支持文类判断的设定、叙述或语言线索。"],"prompts":["What genre / type of story is this?","Which quotation best supports this genre?"],"trap":"单个奇怪场景未必足以证明科幻；应结合作品设定与最有力证据。"},{"id":"F6","module":"F","title":"理解比喻、拟人与意象","en":"Figurative Language / Imagery","goal":"把文学性表达还原成具体画面或深层含义，并解释表达效果。","requirements":["识别明喻、隐喻、延伸比喻、拟人及感官意象；区分字面义与非字面义。","找出被比较对象的共同特点，结合全句、全诗和情境解释比喻。","分析作者选某个形象、动词或一组描写词怎样强化画面、人物或感情。"],"prompts":["What does this figurative expression suggest?","What is the effect of the word / image …?"],"trap":"说出手法名称只是起点；还要说明它在本句里具体表达了什么。"},{"id":"F7","module":"F","title":"理解象征、反讽与悖论","en":"Symbolism / Irony / Paradox","goal":"识别表层事件与深层意义之间的特殊关系。","requirements":["结合情境解释物件或动作的象征意义，并把它与人物和主题联系起来。","找出预期与实际结果之间的反差，判断情境反讽。","理解看似矛盾却表达某种道理的悖论，并与普通矛盾或意外区分。"],"prompts":["What is the significance of this action?","Why is the situation ironic?"],"trap":"意外不自动构成反讽；象征也不能脱离作品情境任意联想。"},{"id":"F8","module":"F","title":"分析诗歌声音与戏剧表现","en":"Poetic Devices / Staging / Style","goal":"理解声音、句式和表演安排怎样产生文学效果。","requirements":["按读音判断押韵及押韵格式，区分 rhyme、rhythm、alliteration；头韵看起始音。","结合节奏、重复、词汇和句式分析速度感、强调或情绪效果。","在戏剧中分析舞台提示、聚光灯等表现安排对观众感受和信息呈现的影响。"],"prompts":["What rhyme scheme does the poet use?","What effect does the repetition / spotlight have?"],"trap":"拼写相似不代表押韵；识别一种手法也不等于证明它在本诗里造成了某种效果。"},{"id":"G1","module":"G","title":"读取图表与图示信息","en":"Read Tables / Graphs / Maps / Diagrams","goal":"先准确读懂视觉材料展示的对象、数值和关系。","requirements":["核对标题、图例、横纵轴、单位、时间范围及不同系列，防止读错对象或量级。","在表格、柱状图、折线图和饼图中定位信息、比较大小与变化。","在地图、流向图和树状示意图中理解范围、方向、箭头及分支关系。"],"prompts":["According to the graph, which statement is TRUE?","What does the map / diagram show?"],"trap":"图表没有展示的对象、时间、原因或结果，不能只靠这张图推出。"},{"id":"G2","module":"G","title":"整合文字、图表与插图","en":"Integrate Text & Visuals","goal":"判断文字中的说法与视觉证据是否真正对应。","requirements":["把正文的关键词、类别、时间和范围与图表中的信息匹配。","判断图表最能直接支持、不能支持或与之矛盾的说法；理解插图强调哪条细节。","需要时把文本中的概念、表格中的数据及两处线索合起来完成判断或推断。"],"prompts":["Which statement is best supported by the figure?","What can be inferred from the passage and the table?"],"trap":"文章说过不等于图表能证明；图上有相关数据，也不一定支持选项里的因果或绝对结论。"},{"id":"G3","module":"G","title":"依据条件处理数据","en":"Order / Count / Percentages / Ratios","goal":"在读懂表格或图形后，用必要的基础运算回答阅读问题。","requirements":["按条件筛选、计数和排序，并遵守 not counting 等排除条件。","合并饼图比例，比较两个时间点、类别或系列的数量与倍数。","区分增长百分比、增加的倍数与增长后的总量，保留原有单位及比较基准。"],"prompts":["How many items meet the condition?","Which statement about the percentages is TRUE?"],"trap":"增长 100% 表示总量变为原来的 2 倍；增长 686% 表示总量变为原来的 7.86 倍。"},{"id":"G4","module":"G","title":"根据数据推断趋势与估算","en":"Inference from Data / Trends / Extrapolation","goal":"从图表关系中作有根据的解释，并分清观察值与估计值。","requirements":["综合一张或多张图中的类别和比例，推断合理的情境或总体特征。","比较两组数据的差距及其变化，解释某个预测值的特别意义。","按既有趋势作粗略外推，明确结果依赖趋势延续，并非图中直接给定的事实。"],"prompts":["Taken together, what conclusion can be drawn?","Based on the current trend, how long will it take …?"],"trap":"趋势不能保证未来必然发生；两组数据相关，也不足以单独证明因果关系。"},{"id":"H1","module":"H","title":"整合跨文本内容与主题","en":"Synthesize Texts / Compare Themes","goal":"分别读懂文本，再找共同内容、差异或需要合并的信息。","requirements":["先用一句话概括每篇的中心内容或主题，保留各自的证据。","比较两文或两诗的共同点与差异，选择同时适用于两篇的概括。","将通知与信件等不同文本的信息对接，用一篇提供的条件解释另一篇的情境。"],"prompts":["What idea is shared by both texts?","What do the two passages have in common?"],"trap":"只适用于一篇的选项不能代表共同点；话题相同也不意味着主题相同。"},{"id":"H2","module":"H","title":"比较写法、语气与证据类型","en":"Compare Craft / Tone / Evidence","goal":"用一致的维度比较多篇作品的表达方式。","requirements":["从语气、氛围、叙述视角、背景、诗体、读者或目的等维度逐项比较。","辨别个人经历、看法与研究数据等证据来源的差别。","遇到 i–v 组合选项时逐项验证两边，防止只确认其中一半。"],"prompts":["How do the two texts differ in tone?","What is the primary difference in their evidence?"],"trap":"比较必须使用同一维度；先把两边各自特点说清，再下相同或不同的结论。"},{"id":"H3","module":"H","title":"比较论证关系并跨文取证","en":"Relationship Between Arguments / Cross-Text Support","goal":"读出两篇议论或说明材料在论点和理由上的关系。","requirements":["分别提炼论点、理由和证据，识别支持、反对、补充或问题与解决的关系。","遵守题干指定的比较范围，不以整篇总体态度代替某个具体论点的关系。","用一篇的具体信息支持、解释或质疑另一篇的判断，说明推理连接点。"],"prompts":["What is the relationship between the two passages?","Which point in Passage 2 supports the claim in Passage 1?"],"trap":"同样讨论一个话题不等于论点相同；总体立场不同的两篇也可能在局部互相支持。"}],"methods":[{"id":"A1","name":"找中心思想","en":"Identify the central idea","def":"中心思想是一句能统领全文的判断。先说清作者在谈什么，再说清作者通过几个主要部分，让读者明白了关于这个话题的什么。","use":"适合说明文的全文、独立小节和多段材料。若题干问故事揭示的人生道理，转用文学主题的方法。","steps":[["圈定范围","看题干问的是全文、几段还是单独一节，在原文边上划出范围。","我需要概括哪一块内容？"],["归并细节","给每个主要部分写一个短标签。把反复指向同一关系的事实归在一起。","这些事实分别说明了什么？"],["写成判断","用“谁或什么＋作者说明了什么”写一句完整的话。用一个类别词概括同类例子。","我说出了话题，也说出了作者对它的说明吗？"],["回读查覆盖","挑两个来自不同部分的证据，逐一试着接在“例如”后面。删去原文撑不住的评价或范围词。","开头、中间、结尾都能放回这句话里吗？"]],"model":"话题、主旨与细节怎样区别","cols":["候选回答","怎样辨认","老师接下来怎么问"],"rows":[["话题","通常是一个名词或短语，只点出了对象。","关于这个对象，作者让你明白了什么？"],["主要观点","是完整判断，能组织文中几个重要部分。","不同部分各有哪一条信息能支持它？"],["局部细节","只概括某个例子、数字或做法。","如果删掉这个例子，你的答案仍然成立吗？"],["范围过大","用了“所有、永远、最”等原文撑不起的说法。","把范围缩到文章实际讨论的对象，会怎样写？"]],"errors":[["学生选了原文中一条完全正确的事实。","让他指给你看，这条事实还能概括哪一段。只覆盖一段，就把它放回“支持细节”。"],["学生只给出一个标题式名词。","保留名词作主语，追问“作者告诉了你它的什么特点、变化或作用”。"]],"micro":["教室给西晒的窗户装上百叶帘。下午，后排桌面不再刺眼，投影上的小字也看得清了。用一句话概括。","调节窗边的光线改善了教室里看东西的条件。“百叶帘”只是话题，“投影小字变清楚”只覆盖一个效果。"],"check":"学生能用一句话概括，并从两个不同部分各找一条支持信息。","refs":[["8.6",286,"从话题走向主要观点"],["8.11",291,"把相关细节归在一起"],["8.12",292,"把段意浓缩成一句话"]],"diagram":{"nodes":[{"id":"n1","label":"段落里的主要细节"},{"id":"n2","label":"跨段共同点"},{"id":"n3","label":"一句话主旨"}],"edges":[{"from":"n1","to":"n2","label":"归并"},{"from":"n2","to":"n3","label":"概括"}],"verify":"选另一段回证，查看结论的覆盖范围。","sources":[{"strategy":"8.6","printedPage":286},{"strategy":"8.11","printedPage":291}]}},{"id":"B3","name":"做有依据的推断与预测","en":"Infer and predict from evidence","def":"推断是在原文已经给出的信息之间搭起联系，说出作者没有直接写明的意思。预测把这种判断用到接下来可能发生的事。","use":"先分清题目问现在隐藏的意思，还是将来的可能行动。开放题可以接受多种表述，每种都要解释它与原文的联系。","steps":[["说清待判断的事","把题目改成一个具体问题，圈出人物、时间和要推断的内容。","谁在什么时候，可能想到什么或做什么？"],["找已知线索","先记录实际言行与场景。不同位置的线索可以互相加强。","原文写出了哪些可以指认的事实？"],["补上中间理由","用已有经验解释这两个事实为何指向某种判断。把经验控制在情境允许的范围内。","这个行为在这种处境下，通常意味着什么？"],["控制结论强度","用“可能、很可能”等词表达合适程度。找一条可能推翻预测的信息再检查。","还有哪个合理解释？哪一个得到的支持更多？"]],"model":"一条推断怎样成立","cols":["信息类别","可记录的内容","自检"],"rows":[["文本线索","具体语言、动作、反应或环境变化","别人能在原文中找到同一处吗？"],["连接理由","在当前情境中，这个线索通常意味着什么","理由是否只用了题目允许的信息？"],["推论或预测","与人物、时点和线索一致的可能结论","有没有把“可能”写成“一定”？"]],"errors":[["学生凭自己的喜好猜。","请他暂时遮住答案，先找一个会让别人也想到这个判断的词或动作。"],["学生只抄了一句原文。","接着说“这个细节使我想到……，所以我预测……”，把中间的理由说出来。"]],"micro":["临出门，乐乐看了一眼乌云，把晾在窗边的画收进屋里。你能合理推测她担心什么？","她可能担心雨水打湿画。乌云给出天气线索，收画显示她在保护作品。仅凭这些线索还无法断言一定会下雨。"],"check":"学生能让另一位读者沿着同样的线索和理由，理解自己的推测。","refs":[["6.7",221,"连接文本线索、经验与推断"],["6.9",223,"回读人物言行检验判断"],["5.11",183,"利用已知信息作预测。原策略用于读前"]],"diagram":{"nodes":[{"id":"n1","label":"原文写明的线索"},{"id":"n2","label":"与情境吻合的已知经验"},{"id":"n3","label":"一项可回文检验的推断"}],"edges":[{"from":"n1","to":"n3","label":"提供依据"},{"from":"n2","to":"n3","label":"解释联系"}],"verify":"保留结论的不确定程度，再找可能推翻它的线索。","sources":[{"strategy":"6.7","printedPage":221}]}},{"id":"B4","name":"选取并检验证据","en":"Select and evaluate evidence","def":"证据是能够支持某个特定判断的细节。判断它是否有力，要看它证明了谁的什么、发生在什么时候，以及从细节到结论要跨多远。","use":"适用于找原句、比较两条引文和解释某个答案的依据。先写出要证明什么，再找证据。","steps":[["拆开结论","划出对象、态度或行为、时间等限定。","这道题要我证明哪一件事？"],["找候选细节","把原句或动作记在旁边，标清段号和说话人。","这句话究竟是谁说的、写的是谁？"],["逐条做连接","把候选句放进“这表明……”后解释。有直接反应的细节通常比背景描写更有力。","中间须补多少原文没说的假设？"],["留下能说明的证据","若证据只支持一半，把结论缩小或寻找另一处补足。","引用后，我能说明它为何支持这个判断吗？"]],"model":"证据强弱检查表","cols":["检查项","通过时看见什么","需要重找的情形"],"rows":[["对象","证据写的是目标人物或事物","只提到了同一个地点"],["方向","言行直接体现题干所说的态度或变化","细节只证明相反方向的关系"],["解释","一句话能把引文和判断连起来","需要补出人物未表达的想法"]],"errors":[["找到了相同关键词就作答。","遮住关键词，问这条信息在意思上还能证明什么。"],["整段照抄。","缩到最有辨别力的一句或一个动作，再补一句自己的解释。"]],"micro":["要证明小宁主动照顾新同学，哪条细节更有力？甲：她们坐同一排。乙：午休时小宁特意带新同学找到医务室。","乙。带路是主动帮助的行动。坐同一排只说明位置接近。"],"check":"学生能指出原文，也能说出一条看似相关的细节为何证据较弱。","refs":[["6.9",223,"重读以验证人物判断"],["9.10",318,"用具体细节支撑概括"]],"diagram":{"nodes":[{"id":"n1","label":"要证明的判断"},{"id":"n2","label":"原文中可比较的细节"},{"id":"n3","label":"最直接的证据"}],"edges":[{"from":"n1","to":"n2","label":"确定范围"},{"from":"n2","to":"n3","label":"检验支持力度"}],"verify":"解释每处引文能证明判断中的哪个部分。","sources":[{"strategy":"6.9","printedPage":223},{"strategy":"9.10","printedPage":318}]}},{"id":"C5","name":"理解短语与固定搭配","en":"Interpret phrases and idioms","def":"一串熟悉的英语单词合在一起，可能约定俗成地表达另一个意思。本样课练英语习语，要找到完整短语，用合乎语法的英语释义替换它。","use":"用于英文原版。译文通常已经表达了整句含义，因此学生在这个专项里需要看英语上下文。","steps":[["圈出完整短语","保留影响含义的否定词、物主词和动词变化。","是哪个词组在句中起作用？"],["检查字面读法","把单词逐一按字面理解，看看人物的行为和话题是否仍然合理。","当前场景真的在谈这些具体物品吗？"],["给出英语释义","从前后动作、转折或结果推一个简短释义，换回原句。","换回去，句子的语法、语气和意思还通吗？"],["检验换场景后的意思","自拟一句不同场景、使用同一短语的话，并解释其意思。","是哪部分含义在新语境中仍然保留？"]],"model":"短语的三次核对","cols":["核对对象","需要保留","常见偏差"],"rows":[["词组边界","构成固定表达的词和顺序","只挑一个熟词作答"],["句中含义","褒贬、否定和语法作用","漏掉否定，结论反向"],["情境证据","能解释短语为何在此出现的前后信息","机械地替换成词典中的第一义"]],"errors":[["逐词翻译后硬凑中文。","先用一个熟悉的英语短语替代整组词，再重读下一句。"],["知道习语的基本义，却漏了否定。","分别读肯定句和否定句，让学生说出人物的态度变化。"]],"micro":["The first meeting felt awkward. A short guessing game helped break the ice. What changed?","People began to feel more at ease with one another. The meeting and the opening game give the expression its social meaning."],"check":"学生能圈对整组词，解释它在句中的意思，并用情境验证。","refs":[["11.22",390,"结合上下文解释非字面含义"],["11.23",391,"比较字面画面和实际用意"]],"diagram":{"nodes":[{"id":"n1","label":"完整的英语词组"},{"id":"n2","label":"语境中说得通的释义"},{"id":"n3","label":"替换后的原句"}],"edges":[{"from":"n1","to":"n2","label":"根据情境解释"},{"from":"n2","to":"n3","label":"替回去验证"}],"verify":"再读一遍带否定或转折的部分，检查方向是否改变。","sources":[{"strategy":"11.22","printedPage":390}]}},{"id":"D1","name":"追踪组织方式与焦点变化","en":"Trace organization and shifts","def":"组织方式说明作者如何安排各部分。追踪结构，需要给每一部分标出它在做的事，再找作者从哪一种任务转向了另一种。","use":"适合分析时间顺序、因果、对比、问题与解决，以及同一篇文章中发生的结构变化。","steps":[["划分有意义的区块","在话题、时间或说明目的发生变化处划线。几个段落可以共同承担一个任务。","从哪里起，作者开始回答一个不同的问题？"],["用动词标作用","为每块写“提出问题、解释原因、列举办法、报告结果”等短标签。","这部分在做什么？"],["把相邻区块接起来","用自己的话说明前后关系，再回头找过渡信号。","后一块是在解释、对照，还是推进前一块？"],["复原作者的安排","沿着各块用一句话复述全文结构。必要时指出转折的准确位置。","若调换两块，读者会失去哪一步理解？"]],"model":"不同关系的识别线索","cols":["关系","需要在内容中找到什么","可用的结构句"],"rows":[["因果","一个条件带来另一件事","因为……，于是……"],["问题与解决","明确困难和回应办法","先提出……，接着说明怎样……"],["顺序或过程","时间推进或操作次序","先……，随后……，最终……"],["对比","围绕同一维度列出的差别或相同点","两者都……，在……上不同"]],"errors":[["只找连接词就给全文定结构。","让学生分别标出前半和后半的任务，再判断是否发生转换。"],["只复述内容，没有说出组织方式。","把“写了什么”改成“作者先解释什么，随后用什么方式展开”。"]],"micro":["第一段说走廊雨天易滑，第二段比较两种防滑垫，末段交代学校选用了哪一种。中间如何推进全文？","作者从提出安全问题转向比较解决办法，最后交代选择。第二段自身用对比组织。"],"check":"能准确指出转换位置，并用关系词串起相邻部分。","refs":[["8.13",293,"辨识局部内容之间的关系"],["8.17",297,"追踪各部分的不同结构"]],"diagram":{"nodes":[{"id":"n1","label":"文中的段落区块"},{"id":"n2","label":"区块各自的任务"},{"id":"n3","label":"全文的组织顺序"}],"edges":[{"from":"n1","to":"n2","label":"给作用命名"},{"from":"n2","to":"n3","label":"连接前后"}],"verify":"回到转换处检查，前后任务确实发生了什么变化。","sources":[{"strategy":"8.13","printedPage":293},{"strategy":"8.17","printedPage":297}]}},{"id":"E1","name":"判断写作目的","en":"Determine the author’s purpose","def":"写作目的是作者希望读者读完后知道什么、相信什么、做成什么或体验什么。同一篇文章可以兼有多种作用，判断主要目的时要看贯穿全文的写法。","use":"先确定题目问整篇文章、某个小节还是一个图表。把作者的目的和文中人物想做的事分开。","steps":[["确定读者和范围","圈出相关篇幅，再想作者可能在和谁说话。","谁会在什么情况下使用这段文字？"],["寻找表达选择","留意步骤、祈使句、定义、证据、呼吁、对话或悬念。","哪些写法反复出现？"],["写出预期效果","把答案写成“作者希望读者能……”并补上具体内容。","读者读完是能解释一件事，还是能照着做？"],["检验主要目的","用来自不同部分的写法检验你的判断。","这个目的能解释整篇的安排吗？"]],"model":"读者读完能做什么","cols":["可能的目的","常见安排","最有力的检验"],"rows":[["说明","解释概念、现象及原因","读者能讲清“是什么、为什么”"],["指导","行动步骤、操作建议、注意事项","读者能按文中办法着手做事"],["说服","主张、理由和回应异议","读者被邀请接受某种判断或采取行动"],["讲述或娱乐","人物、冲突、悬念或结局","读者的主要体验来自故事的展开"]],"errors":[["把文章话题当成目的。","为“关于……”加上动词，明确作者希望读者得到什么。"],["看到一个有趣的例子就选娱乐。","去第二个主要部分寻找同类依据，判断这个例子服务于全篇哪项任务。"]],"micro":["一张传单先列图书归还地点，再用三步解释怎样续借，最后给出操作时间。主要目的是什么？","指导读者办理归还与续借。地点和时间支持操作，三个步骤直接显示了作者希望读者能做什么。"],"check":"学生能把目的写具体，并举出至少一种贯穿所问范围的表达方式。","refs":[["8.18",298,"观察作者选了什么信息以及怎样呈现"],["10.27",359,"由呈现方式推测作者意图"]],"diagram":{"nodes":[{"id":"n1","label":"作者选择的表达方式"},{"id":"n2","label":"读者受到的影响"},{"id":"n3","label":"主要写作目的"}],"edges":[{"from":"n1","to":"n2","label":"观察效果"},{"from":"n2","to":"n3","label":"归纳意图"}],"verify":"另找一处写法，检查同一目的能否解释它。","sources":[{"strategy":"8.18","printedPage":298}]}},{"id":"F3","name":"理解人物动机与情感","en":"Explain a character’s motives and feelings","def":"情感是人物此时的感受，动机是推动人物行动的愿望、需要或顾虑。解释时要把人物所处的情境、表现和行动连起来。","use":"题目问“当时感觉如何”时，用可区分的感受词。问“为什么这样做”时，回答人物试图实现或避免什么。","steps":[["锁定时点","在目标行为前停一下，记录人物此时知道什么、面对什么。","人物当下能看到什么？"],["摘出表现","观察用词、语气、身体动作和与平时不同的反应。","人物具体说了什么、做了什么？"],["提出可解释的动机","试着用两个相近的情感词，再看哪一个能解释后续的行动。","这是惊讶、害怕，还是好奇？行动更支持哪一个？"],["用变化复查","看人物有了新信息后怎样行动，检查解释的前后连贯性。","为什么这个举动在这一刻发生？"]],"model":"从处境读到人物内心","cols":["记录项目","写法","检验点"],"rows":[["处境","人物遇见……，此前以为……","只用该时点上人物知道的信息"],["表现","他说……，接着做……","挑带有区分作用的行为"],["感受","当时可能感到……","用贴合程度的词"],["动机","为了……，他才……","能解释这个特定行为"]],"errors":[["把自己的感受安在人物身上。","请学生找出人物自己的反应，再说这种反应支持哪个感受词。"],["用“他很高兴”回答为什么行动。","追问“他这么做，想得到什么结果？”"]],"micro":["队员们已离场，小远又折回去找替补队员，说要给他们也拍一张合影。怎样解释这个行动？","他可能希望替补队员也感到被重视。折返和特意拍照提供了依据。原文没有给出他对比赛成绩的感受。"],"check":"学生能分开说出人物的表现、可能的感受和想达到的结果。","refs":[["6.8",222,"从人物语言和行为推断感受"],["6.12",226,"结合处境理解行动的动机"]],"diagram":{"nodes":[{"id":"n1","label":"人物当时的处境"},{"id":"n2","label":"能观察到的反应"},{"id":"n3","label":"可能的情感与动机"}],"edges":[{"from":"n1","to":"n2","label":"寻找反应"},{"from":"n2","to":"n3","label":"解释行动"}],"verify":"用后续言行检验这个解释符合人物当时知道的信息。","sources":[{"strategy":"6.8","printedPage":222},{"strategy":"6.12","printedPage":226}]}},{"id":"G1","name":"读取图表与图示信息","en":"Read tables and visual information","def":"读表就是沿着正确的行和列找到数值，同时说明数值属于谁、量的是什么、单位是什么。一个数字和它的表头、单位、限定词共同组成答案。","use":"本次用有明示来源的数据表练习直接查读。学生先区分指标，再回答，原文可以用来核对。","steps":[["读标题与单位","找出表格比较的对象和测量项目，圈出单位与范围词。","表中是在量距离、时间还是速度？"],["沿标签找交点","先确定目标行，再水平读到对应列。有多列时要复述列名。","这一个数字与哪一行、哪一列相交？"],["连单位作答","把数值和“约、至少、预计、实际”等词一起读出。","把数字单独拿出来会漏掉什么？"],["回到表中复核","检查是不是问到了相近但不同的一行或另一种单位。","相同单位是否可能对应两个不同的问题？"]],"model":"可复用的读表记录","cols":["字段","学生填写什么","常见误读"],"rows":[["对象或指标","我在查哪一行","把两行相近的名称混淆"],["列和单位","哪一列，采用什么单位","抄数字，漏了单位"],["完整读数","数值、范围、估计或实测","把预计值误读为结果"]],"errors":[["看到数值就回答。","让学生一边指行名一边把整行读成一句话。"],["两个数的单位相同就相互替代。","分别给两个数补上测量起点、终点或对象，再选择。"]],"micro":["一张表写着“预计用时 5–7 天”“实际用时 4 天”。有人回答“用了 5 天”。他应该复查哪里？","复查指标行。题目问实际用时，应读出 4 天，5–7 天是预计范围。"],"check":"答案包含正确指标、数值、单位与必要的限定。","refs":[["10.19",351,"读标题和表头，逐行理解关系"],["10.21",353,"将统计信息读成完整陈述"]],"diagram":{"nodes":[{"id":"n1","label":"目标指标与表头"},{"id":"n2","label":"对应的行列交点"},{"id":"n3","label":"数值、单位与限定"}],"edges":[{"from":"n1","to":"n2","label":"定位"},{"from":"n2","to":"n3","label":"完整读出"}],"verify":"用带单位的一句话复述，再沿原路回到数据格。","sources":[{"strategy":"10.19","printedPage":351}]}},{"id":"H1","name":"整合跨文本内容与主题","en":"Synthesize ideas across texts","def":"跨文本整合需要围绕同一个问题分别读两篇材料，说明各自提供了什么，再写出把两边信息合在一起才说得清的结论。","use":"故事可以提供观察和经历，说明文可以提供机制或概念。比较文学主题时，用同样的方法分别核对两篇各自的情节依据。","steps":[["选共同问题","先在两篇中找到可以用同一把尺子比较的问题。","两篇都能帮助回答的是什么？"],["分别记录","给两边各记一句事实、观察或主张，保留各自出处。","这句话来自甲文还是乙文？"],["说明信息关系","判断两边是相互印证、补充解释，还是各自描述不同角度。","乙文多给了哪一层解释？"],["写有限度的综合句","用一句或两句把两边连起，保留推测、范围与差异。","综合句有没有把某一篇没说的事写成确定事实？"]],"model":"双文本对读表","cols":["位置","记录内容","检验问题"],"rows":[["甲文","与共同问题有关的观察或观点＋段号","读者从甲文能确定什么？"],["乙文","可补充或比较的信息＋段号","乙文解释、扩展或修正了哪一点？"],["综合","两者合起来支持的结论及其范围","少读一篇会缺掉哪部分？"]],"errors":[["只写“两篇都谈同一件事”。","继续追问“每篇各自让我们多知道了什么？”"],["把乙文的一般情况断定为甲文中的事实。","分别圈出“可能”和“已经确认”的信息。"]],"micro":["甲文记下夜读活动中最后一排同学也举手了。乙文说明小组先交流再发言，能给更多人准备说法的时间。两篇可怎样联系？","甲文给出参与的现象，乙文给出一种可能的解释。若甲文未交代活动是否采用小组交流，就不能断言它是唯一原因。"],"check":"学生的答案中能找到两篇各自的贡献，也能区分事实与推测。","refs":[["8.20",300,"比较并整合多个文本中的观点"],["7.26",272,"比较不同作品怎样展开相近的主题"]],"diagram":{"nodes":[{"id":"n1","label":"甲文给出的观察或观点"},{"id":"n2","label":"乙文给出的说明或观点"},{"id":"n3","label":"两篇合起来能支持的结论"}],"edges":[{"from":"n1","to":"n3","label":"提供一侧证据"},{"from":"n2","to":"n3","label":"补充另一侧"}],"verify":"区分两篇已确定的事实与读者补出的可能解释。","sources":[{"strategy":"8.20","printedPage":300}]}}],"chart":{"title":["灯塔搬迁数据表","Lighthouse relocation data"],"caption":["据《迁移灯塔》第 5–6 段整理","Course table based on paragraphs 5–6 of the passage"],"columns":[["指标","文中数据"],["Measure","Reported value"]],"rows":[[["搬运总路程","约 2,900 英尺"],["Distance moved","About 2,900 feet"]],[["从新址到大海的距离","1,600 英尺"],["New site’s distance from the ocean","1,600 feet"]],[["预计工期","四至六周"],["Estimated duration","Four to six weeks"]],[["实际工期","约三周"],["Actual duration","About three weeks"]],[["平均移动速度","约 2 英寸／分钟"],["Average speed","About two inches per minute"]]]},"passages":[{"id":"P002","title":["JBall","日本棒球赛"],"lead":["Have you ever been to a baseball game in another country or watched one on television?","你到别的国家看过棒球赛，或在电视上看过其他国家的棒球比赛吗？"],"exercise":"P003","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Alex and Emily Godfrey had been in Japan with their parents for nearly a week. They were there to visit their mother’s old college roommate, who had moved to Japan after college to teach English. She had planned to come home after a few years, but she had fallen in love with the country and with the man who would eventually be her husband.","亚历克斯和艾米莉·戈弗雷跟父母来日本快一个星期了。他们来探望母亲的大学室友。她大学毕业后搬到日本教英语，本打算过几年就回国，却爱上了这个国家，也爱上了后来成为她丈夫的那个人。"],"type":"paragraph"},{"n":2,"t":["“What’s our plan for the afternoon?” asked Alex after lunch one day.","一天午饭后，亚历克斯问：“我们下午有什么安排？”"],"type":"paragraph"},{"n":3,"t":["“Well,” said Mr. Ito, “we have tickets for a 4:00 baseball game. How does that sound?”","“嗯，”伊藤先生说，“我们有下午四点的棒球赛门票。你们觉得怎么样？”"],"type":"paragraph"},{"n":4,"t":["“I had no idea baseball was popular in Japan,” replied Alex.","“我原来都不知道棒球在日本这么受欢迎。”亚历克斯回答。"],"type":"paragraph"},{"n":5,"t":["“Dad takes us to professional games a few times a year at home,” said Emily. “Alex and I keep a list of cities we’ve visited where we have had a chance to go to a game. I had no idea that Tokyo would ever be on our list!”","“我们在美国的时候，爸爸每年带我们去看几次职业棒球赛。”艾米莉说，“亚历克斯和我有张清单，记下我们去过、又碰巧看过比赛的城市。真没想到东京也会出现在这张清单上！”"],"type":"paragraph"},{"n":6,"t":["The Itos and the Godfreys prepared for the afternoon’s events. Just a few hours later, they found themselves standing inside the stadium among a crowd of excited fans.","伊藤一家和戈弗雷一家为下午的活动做好了准备。才过几个小时，他们就已站在球场里，周围全是兴奋的球迷。"],"type":"paragraph"},{"n":7,"t":["“What are the names of the teams that are playing today?” asked Alex, looking around curiously.","“今天比赛的是哪两支球队？”亚历克斯好奇地四下张望。"],"type":"paragraph"},{"n":8,"t":["“The home team is the Yakult Swallows. They will be playing the Hiroshima Toyo Carp,” said Mrs. Ito. “Baseball isn’t my cup of tea, but this promises to be a good game.”","“主队是养乐多燕子队，对手是广岛东洋鲤鱼队。”伊藤太太说，“棒球不太合我的口味，不过这场比赛应该会很精彩。”"],"type":"paragraph"},{"n":9,"t":["The two families found their seats in the bleachers. Alex and Emily grinned as they listened to all the noisemakers around them. Some people were hitting together plastic bats, and others were yelling through megaphones that looked as though they had been hinged together.","两家人在看台上找到了座位。亚历克斯和艾米莉听见四周各种助威道具发出的响声，咧嘴笑了。有人把塑料球棒互相敲击，有人对着看起来像用铰链连在一起的扩音喇叭呐喊。"],"type":"paragraph"},{"n":10,"t":["“Are those cheerleaders?” asked Emily. She was referring to a group of men on the ball field who led the crowd in chants and cheers.","“那些是啦啦队员吗？”艾米莉指的是场上一群领着观众喊口号、加油助威的男子。"],"type":"paragraph"},{"n":11,"t":["Mrs. Ito nodded. “I forget that Americans don’t have cheerleaders for baseball games. It also probably seems unusual that they’re all men. That’s just one of the differences between American and Japanese baseball culture.”","伊藤太太点点头。“我都忘了，美国的棒球赛没有啦啦队员。看见他们都是男的，你们也许会觉得奇怪。这只是美日棒球文化的差别之一。”"],"type":"paragraph"},{"n":12,"t":["Once the game began, Emily and Alex became quickly engrossed. The game itself didn’t seem much different at all from the American baseball games they had attended. They were surprised, though, to see people waving American flags from time to time.","比赛一开始，艾米莉和亚历克斯很快就看入了迷。比赛本身看起来和他们在美国看过的棒球赛差不多。不过，让他们吃惊的是，时不时就有人挥舞美国国旗。"],"type":"paragraph"},{"n":13,"t":["Mr. Ito explained, “Japanese teams are each allowed to have three foreign players. When American players come up to bat, their fans show support by waving your country’s flag.”","伊藤先生解释说：“日本每支球队可以有三名外籍球员。美国球员上场击球时，球迷就挥舞你们国家的国旗来表示支持。”"],"type":"paragraph"},{"n":14,"t":["In between innings, Mrs. Ito bought Alex and Emily a snack. Some vendors sold pretzels, popcorn, and hot dogs, but Alex and Emily decided to try one of the Japanese alternatives. With Mrs. Ito’s help, they selected yakisoba, noodles flavored with ginger and soy sauce.","局间休息时，伊藤太太给两个孩子买了小吃。有些摊贩卖椒盐卷饼、爆米花和热狗，可两个孩子想试试日式小吃。在伊藤太太的帮助下，他们选了用姜和酱油调味的日式炒面，叫作 yakisoba。"],"type":"paragraph"},{"n":15,"t":["At the end of the game, the Godfreys and the Itos piled back into the car to head home. Alex and Emily were tired, but their minds were racing with all they had seen that day.","比赛结束后，两家人又挤进汽车回家。两个孩子虽然累了，脑海里却还不断闪过那天见到的种种场面。"],"type":"paragraph"},{"n":16,"t":["“Did you have a good day, kids?” asked Mrs. Godfrey, turning to Alex and Emily.","“孩子们，今天玩得开心吗？”戈弗雷太太转向亚历克斯和艾米莉问道。"],"type":"paragraph"},{"n":17,"t":["They nodded. “I wish we could go to JBall games at home, too,” said Emily. “After today, I have a feeling that American baseball may never be quite as interesting again.”","他们点点头。“真希望我们回家后也能看日本棒球赛。”艾米莉说，“过了今天，我总觉得美国棒球赛可能再也没那么有意思了。”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why were the Godfreys in Japan?\n\n________","戈弗雷一家为什么来日本？"],"ans":["to visit Mrs. Godfrey’s college roommate","来探望戈弗雷太太的大学室友。"]},{"n":2,"ask":["What do you think Emily meant when she said, “American baseball may never be quite as interesting again”?\n\n________","艾米莉说“美国棒球赛可能再也没那么有意思了”，你觉得她是什么意思？"],"ans":["In comparison to American baseball, Japanese baseball seems more interesting and exciting to her.","和美国棒球相比，她觉得日本棒球更有趣、更让人兴奋。"]},{"n":3,"ask":["What is one way American and Japanese baseball are similar? What is one way they are different?\n\n________","美国棒球和日本棒球有什么相同之处？又有什么不同之处？各举一例。"],"ans":["Possible answers: Some of the snacks served are the same. Japanese baseball has male cheerleaders.","参考答案：两国球场卖的一些小吃相同。日本棒球赛有男子啦啦队。"]},{"n":4,"ask":["Do you think that Alex and Emily will go to another JBall game if they have a chance? Why or why not?\n\n________","如果有机会，你觉得亚历克斯和艾米莉还会去看日本棒球赛吗？为什么？"],"ans":["Answers will vary. Possible answer: Yes, they seemed to enjoy the game and were interested in the similarities and differences.","答案可以不同。参考答案：会。他们似乎很享受这场比赛，也对两国棒球的异同很感兴趣。"]},{"n":5,"ask":["Alex and Emily decide to try food that they would not be ________ to find at an American game.\n\n- allowed\n- likely\n- impressed","选词填空。亚历克斯和艾米莉决定尝尝在美国球场上不太____找到的食物。\nA. allowed（获准的）\nB. likely（可能的）\nC. impressed（印象深刻的）"],"ans":["likely","B. likely（可能的）"],"dir":["Circle the word that best completes each sentence.","圈出最适合补全每个句子的单词。"]},{"n":6,"ask":["The Godfreys are ________ to learn how American and Japanese baseball are different.\n\n- curious\n- refusing\n- apprehensive","选词填空。戈弗雷一家想了解美日棒球有什么不同，他们对此感到____。\nA. curious（好奇的）\nB. refusing（拒绝）\nC. apprehensive（担忧的）"],"ans":["curious","A. curious（好奇的）"]},{"n":7,"ask":["Noisemakers are a popular ________ at Japanese baseball games.\n\n- explanation\n- resource\n- custom","选词填空。在日本的棒球比赛中，使用发声道具助威是一种流行的____。\nA. explanation（解释）\nB. resource（资源）\nC. custom（习俗）"],"ans":["custom","C. custom（习俗）"]},{"n":8,"ask":["something of interest; something a person enjoys ________","从文中找出与下列释义相符的英语短语。某人感兴趣或喜欢的事物。"],"ans":["cup of tea","cup of tea（合某人口味的事物）"],"dir":["An **idiom** is a group of words that has a special meaning. For example, the idiom *hit the hay* means *to go to bed*. Write the idiom from paragraph 8 on the line next to its meaning.","习语是具有特殊含义的一组词。例如，习语 hit the hay 意思是“上床睡觉”。从第 8 段找出与释义相符的习语，写在释义旁边的横线上。"]},{"n":9,"ask":["Would you enjoy attending a sporting event in another country? Explain why or why not.\n\n________","你会喜欢去别的国家看体育比赛吗？说说理由。"],"ans":["Answers will vary.","答案可以不同。"]}],"alias":"日本棒球赛"},{"id":"P004","title":["Yakyuu","日本的棒球"],"lead":["Who is Sadahara Oh, and why is he so famous in the world of baseball?","王贞治是谁？他为什么在棒球界如此有名？"],"exercise":"P005","genre":"说明文","family":"info","parts":[{"n":1,"t":["What could be more American than baseball? It was one of the earliest sports played in America, created during the mid-1800s. But the Japanese have been playing for nearly as long. In fact, baseball’s popularity in Japan rivals its popularity here in the United States.","还有什么比棒球更能代表美国？棒球诞生于 19 世纪中叶，是美国最早开展的体育运动之一。但日本人打棒球的历史也几乎一样长。事实上，棒球在日本受欢迎的程度足以和美国相比。"],"type":"paragraph"},{"n":2,"t":["In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students. They loved it, calling the game *Yakyuu*, which means *field ball*. It quickly caught on with students all over the country. Japanese leaders also embraced baseball because they thought that it contained elements that were already part of Japanese culture. For instance, baseball’s focus on the mental competition between pitcher and hitter was similar to the one-on-one competitions of martial arts.","19 世纪 70 年代初，居住在东京的美国教授霍勒斯·威尔逊把棒球介绍给了自己的学生。学生们很喜欢这项运动，称它为 yakyuu，也就是“野球”，字面意思是在场地上打的球。棒球很快就在日本各地的学生中流行起来。日本领导人也欢迎棒球，因为他们认为这项运动包含日本文化中原本就有的元素。比如，棒球强调投手与击球手之间的心理较量，这和武术中的一对一比试很相似。"],"type":"paragraph"},{"n":3,"t":["By the early 1900s, amateur baseball leagues had been established in secondary schools and colleges throughout Japan. To this day, the enthusiasm for college baseball in Japan is equivalent to the excitement people have for college football or college basketball’s March Madness in the United States.","到 20 世纪初，日本各地的中学和大学都成立了业余棒球联赛。直到今天，日本人对大学棒球的热情，仍可与美国人对大学美式橄榄球或大学篮球“三月疯狂”锦标赛的热情相比。"],"type":"paragraph"},{"n":4,"t":["To make baseball even more popular, American teams regularly toured Japan in the early 1900s and played exhibition games against the local amateurs. Top American baseball stars like Babe Ruth and Lou Gehrig came to Japan in the 1930s and played against the top Japanese college teams. The Americans won all 17 games they played, but baseball fever swept the whole country. A professional Japanese baseball league was formed in 1936. The Great Tokyo baseball club—known today as the Yomiuri Giants—was the first team, but it was soon joined by six others.","为了让棒球更受欢迎，20 世纪初，美国球队定期到日本巡回比赛，与当地的业余球队进行表演赛。到了 20 世纪 30 年代，贝比·鲁思和卢·格里格等美国棒球巨星来到日本，与日本顶尖的大学球队交手。美国队赢下了参加的全部 17 场比赛，但棒球热潮还是席卷了整个日本。1936 年，日本成立了职业棒球联赛。大东京棒球俱乐部，也就是今天的读卖巨人队，是第一支球队，不久又有六支球队加入。"],"type":"paragraph"},{"n":5,"t":["Like so many other things around the world, World War II interrupted Japanese baseball when almost all of the players became soldiers. Because baseball had become an important part of Japanese culture, professional teams reformed after the war. By 1955, with the help of television, professional baseball in Japan became bigger than ever.","和世界上许多其他活动一样，日本棒球也因第二次世界大战而中断，因为几乎所有球员都参了军。棒球已经成为日本文化的重要一部分，因此战后职业球队又组建起来。到了 1955 年，电视的普及让日本职业棒球比以往任何时候都更红火。"],"type":"paragraph"},{"n":6,"t":["The Yomiuri Giants are not just the oldest pro team in Japan; they may also be the greatest. From 1965 through 1973, the Giants won nine consecutive national championships, partly because of the legendary player Sadahara Oh. The surname *Oh* means *king*, and he certainly was the king of baseball in Japan. Among his many incredible statistics, Oh holds the world record for career home runs—868! That is more than Hank Aaron, Babe Ruth, Mark McGuire, Barry Bonds, and Sammy Sosa.","读卖巨人队是日本历史最悠久的职业棒球队，也可能是最出色的一支。从 1965 年到 1973 年，巨人队连续九次赢得全国冠军，这在一定程度上要归功于传奇球员王贞治。“王”这个姓在日语里有“君王”的意思，他也的确是日本的棒球之王。他创下过许多惊人的数据，其中一项是职业生涯本垒打世界纪录，整整 868 支！汉克·阿伦、贝比·鲁思、马克·麦奎尔、巴里·邦兹和萨米·索萨都打不到这个数。"],"type":"paragraph"},{"n":7,"t":["Japanese professional players have also come to the United States and played in Major League Baseball, setting records here as well. Current players include the New York Yankees’ Ichiro Suzuki. In 2004, Suzuki broke a baseball record for hitting that had stood for more than 80 years! Kazuhiro Sasaki, who played for the Seattle Mariners, was named the American League Rookie of the Year in 2000, and Hideo Nomo of the Los Angeles Dodgers was MLB’s 1995 Rookie of the Year.","日本职业球员也来到美国，参加美国职业棒球大联盟的比赛，在这里同样创下了纪录。当时仍在打球的球员中，就有纽约扬基队的铃木一朗。2004 年，铃木一朗打破了一项保持了 80 多年的安打纪录！曾效力于西雅图水手队的佐佐木主浩获得了 2000 年美国联盟最佳新人奖，洛杉矶道奇队的野茂英雄则当选美国职业棒球大联盟 1995 年的最佳新人。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the sentence that best states the main idea of the passage.\n\n- ________ Although baseball is thought of as an American sport, there are many fans and talented players of Japanese baseball, or *yakyuu*.\n- ________ American teams toured Japan in the early 1900s and played exhibition games against the local amateurs.\n- ________ Horace Wilson brought baseball to Japan in the 1870s.","选出最能概括文章主旨的一句。\nA. 虽然棒球常被认为是一项美国运动，但日本棒球 yakyuu 也有许多球迷和有才华的球员。\nB. 20 世纪初，美国球队到日本巡回比赛，与当地业余球队进行表演赛。\nC. 19 世纪 70 年代，霍勒斯·威尔逊把棒球带到了日本。"],"ans":["✓ Although baseball is thought of as an American sport, there are many fans and talented players of Japanese baseball, or *yakyuu*.","A. 虽然棒球常被认为是一项美国运动，但日本棒球 yakyuu 也有许多球迷和有才华的球员。"]},{"n":2,"ask":["Number the events below to show the order in which they happened.\n\n- ________ Horace Wilson introduced baseball to his students.\n- ________ World War II interrupted Japanese baseball.\n- ________ The Giants won nine consecutive national championships.\n- ________ Babe Ruth and Lou Gehrig played baseball in Japan.","给下列事件标上序号，表示发生的先后顺序。\n霍勒斯·威尔逊向学生介绍棒球。\n第二次世界大战使日本棒球赛事中断。\n巨人队连续九次夺得全国冠军。\n贝比·鲁思和卢·格里格在日本打棒球。"],"ans":["- **1** Horace Wilson introduced baseball to his students.\n- **3** World War II interrupted Japanese baseball.\n- **4** The Giants won nine consecutive national championships.\n- **2** Babe Ruth and Lou Gehrig played baseball in Japan.","按题中所列顺序，分别标 1、3、4、2。"]},{"n":3,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to inform\n- ________ to entertain\n- ________ to persuade","选出最能说明作者写作目的的一项。\nA. 介绍信息\nB. 娱乐读者\nC. 说服读者"],"ans":["✓ to inform","A. 介绍信息"]},{"n":4,"ask":["Why is Sadahara Oh’s last name so appropriate?\n\n________","为什么王贞治的姓氏特别贴切？"],"ans":["It means king, and he is the king of baseball in Japan.","“王”有“君王”的意思，而他是日本的棒球之王。"]},{"n":5,"ask":["Why did Japan’s leaders like baseball?\n\n________","日本领导人为什么喜欢棒球？"],"ans":["It contained elements that were already part of Japanese culture.","棒球包含日本文化中原本就有的一些元素。"]},{"n":6,"ask":["What is the literal meaning of *yakyuu* in Japanese?\n\n________","日语 yakyuu 的字面意思是什么？"],"ans":["field ball","field ball，字面意思是“在场地上打的球”。"]},{"n":7,"ask":["During World War II, many of the players became ________\n\n________","第二次世界大战期间，许多球员成了____。"],"ans":["soldiers","军人。"]}]},{"id":"P006","title":["Experimental Appetites","尝尝新口味"],"lead":["What kinds of foods from other cultures have you tried?","你尝过哪些来自其他文化的食物？"],"exercise":"P007","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Alex and Emily sat at a table with their parents and Mr. and Mrs. Ito. Alex loved to try new foods. Alex had eaten at Asian restaurants at home several times, but he was sure that the meals he’d eat in Japan would be much more authentic.","亚历克斯和艾米莉与父母、伊藤夫妇围坐在一张桌旁。亚历克斯很爱尝新食物。他在美国也去过几次亚洲餐馆，却觉得在日本吃到的饭菜肯定地道得多。"],"type":"paragraph"},{"n":2,"t":["Emily wasn’t as confident as Alex was about trying new foods. Alex would eat practically anything and not think twice about it. Emily liked to be able to identify everything on her plate. She was willing to try new things, but she lacked Alex’s enthusiasm for experimenting with new foods.","说到尝新食物，艾米莉没有亚历克斯那么有把握。亚历克斯几乎什么都吃，一点也不犹豫。艾米莉喜欢弄清盘里的每样东西是什么。她也愿意尝鲜，只是没有亚历克斯那么热衷。"],"type":"paragraph"},{"n":3,"t":["“Have you looked at the menu yet?” asked Alex and Emily’s dad.","“你们看过菜单了吗？”两个孩子的爸爸问。"],"type":"paragraph"},{"n":4,"t":["“Dad, it’s in Japanese,” said Alex.","“爸，菜单是日文的。”亚历克斯说。"],"type":"paragraph"},{"n":5,"t":["Mr. Godfrey grinned. “That shouldn’t stop you from looking at it,” he said. “Maybe Mrs. Ito can give us some suggestions.”","戈弗雷先生咧嘴一笑。“是日文也可以看看嘛，”他说，“也许伊藤太太能给我们提点建议。”"],"type":"paragraph"},{"n":6,"t":["“Of course I can,” she said, scanning the menu. “I thought we could start off with some sushi. Do you like fish?” she asked Alex and Emily.","“当然可以。”她边说边浏览菜单，“我想我们可以先点些寿司。你们喜欢吃鱼吗？”她问亚历克斯和艾米莉。"],"type":"paragraph"},{"n":7,"t":["“I do,” replied Alex promptly.","“我喜欢。”亚历克斯马上回答。"],"type":"paragraph"},{"n":8,"t":["Emily looked uncertainly at her parents. “I like some kinds of fish,” she said.","艾米莉拿不准，抬头看看父母。“有些鱼我喜欢。”她说。"],"type":"paragraph"},{"n":9,"t":["“She likes fish that doesn’t have a strong fishy taste to it,” added her mom helpfully.","妈妈帮着补充说：“她喜欢腥味没那么重的鱼。”"],"type":"paragraph"},{"n":10,"t":["“We’ll order several different kinds,” decided Mrs. Ito. “Then, you’ll have a chance to sample them and decide what you like.” Mrs. Ito gave their order to the waiter. Then, she turned back to Alex and Emily.","“那我们多点几种。”伊藤太太拿定了主意，“这样你们可以都尝尝，看看自己喜欢哪一种。”伊藤太太向服务员点完菜，又转过身来跟两个孩子说话。"],"type":"paragraph"},{"n":11,"t":["“Do you know how sushi is made?” Mrs. Ito asked Alex and Emily. They shook their heads. “Well, the sushi chef begins with a very thin sheet of seaweed.”","“你们知道寿司怎么做吗？”伊藤太太问。两个孩子摇摇头。“做寿司的师傅会先准备一张很薄的海苔。”"],"type":"paragraph"},{"n":12,"t":["“We’re going to eat seaweed?” asked Alex excitedly.","“我们要吃海苔？”亚历克斯兴奋地问。"],"type":"paragraph"},{"n":13,"t":["Mr. Ito smiled. “You wouldn’t even know it was seaweed if we didn’t tell you,” he said.","伊藤先生笑了。“要是我们不告诉你，你连它是海苔都吃不出来呢。”他说。"],"type":"paragraph"},{"n":14,"t":["Mrs. Ito continued, “The chef spreads a layer of sticky rice over the seaweed. Then, they add different vegetables and fish. They roll everything up inside the seaweed and slices it into little disks.”","伊藤太太接着说：“师傅先在海苔上铺一层黏黏的米饭，然后放上不同的蔬菜和鱼，再用海苔把它们全卷起来，切成一片片圆圆的小卷。”"],"type":"paragraph"},{"n":15,"t":["A few minutes later, the waiter returned with a wooden board that held several different types of sushi.","几分钟后，服务员端着一块木托板回来了，上面摆着好几种寿司。"],"type":"paragraph"},{"n":16,"t":["“You might want to try this kind first,” Mr. Ito told Emily. “It has cucumber and avocado in it but no fish.” The Itos showed the Godfreys how to pick up the sushi using chopsticks.","“你可以先试试这种。”伊藤先生对艾米莉说，“里面有黄瓜和牛油果，没有鱼。”伊藤夫妇给戈弗雷一家示范怎样用筷子夹寿司。"],"type":"paragraph"},{"n":17,"t":["“What’s this?” asked Alex, pointing to a small mound of something green.","“这是什么？”亚历克斯指着一小堆绿色的东西问。"],"type":"paragraph"},{"n":18,"t":["“Sushi is often served with pickled ginger and a very spicy condiment called wasabi. The green stuff you were asking about is the wasabi. If you decide to try some, you’ll probably want to use a very small amount at first.”","“寿司常配腌姜和一种叫 wasabi 的山葵酱，味道非常辣。你问的绿色东西就是山葵酱。要是想尝尝，刚开始最好只蘸一点点。”"],"type":"paragraph"},{"n":19,"t":["No one at the table was surprised to learn that Alex loved the sushi. He even found that he liked wasabi, as long as he was careful to use only a small speck of it on each bite.","亚历克斯很喜欢寿司，桌上谁也不觉得意外。他甚至发现自己也喜欢山葵酱，只要每一口都留神，只蘸一点点就行。"],"type":"paragraph"},{"n":20,"t":["“What do you think, Emily?” asked Mrs. Godfrey after a few moments.","过了一会儿，戈弗雷太太问：“艾米莉，你觉得怎么样？”"],"type":"paragraph"},{"n":21,"t":["Emily picked up another piece of sushi with her chopsticks. “I love it,” she said. “I think we’re going to need to find a restaurant at home that serves sushi,” she added.","艾米莉用筷子又夹了一块寿司。“我太喜欢了。”她说，“回家后，我们得找一家卖寿司的餐馆。”"],"type":"paragraph"},{"n":22,"t":["Mr. and Mrs. Godfrey laughed. “Our kids are turning into very well-seasoned eaters!” said Mr. Godrey.","戈弗雷夫妇笑了。“咱们家的两个孩子，尝过这么多口味，快成老练的美食家啦！”戈弗雷先生说。"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ Sushi is delicious.","判断下列说法属于事实（F）还是观点（O）。寿司很好吃。"],"ans":["O","O（观点）。"],"dir":["A fact is something that is known to be true. An opinion is what a person believes. It may or may not be true. Write **F** before the sentences that are facts. Write **O** before the sentences that are opinions.","事实是已知为真的事情。观点是一个人所相信的看法，可能是真的，也可能不是真的。请在陈述事实的句子前写 F，在表达观点的句子前写 O。"]},{"n":2,"ask":["________ The chef spreads a layer of sticky rice over the sheet of seaweed.","事实（F）还是观点（O）？厨师在海苔上铺一层黏黏的米饭。"],"ans":["F","F（事实）。"]},{"n":3,"ask":["________ Wasabi ruins the flavor of sushi.","事实（F）还是观点（O）？山葵酱破坏了寿司的味道。"],"ans":["O","O（观点）。"]},{"n":4,"ask":["________ Mrs. Ito makes some suggestions about what to order.","事实（F）还是观点（O）？伊藤太太就点什么菜提了几个建议。"],"ans":["F","F（事实）。"]},{"n":5,"ask":["Check the line beside the word or words that best describe what type of passage this is.\n\n- ________ informational text\n- ________ fiction\n- ________ tall tale","选出最适合描述本文体裁的词语。\nA. 说明文\nB. 虚构故事\nC. 夸张故事"],"ans":["fiction","B. 虚构故事"]},{"n":6,"ask":["How are Alex and Emily different?\n\n________\n\n________","亚历克斯和艾米莉有什么不同？"],"ans":["Alex is more adventurous than Emily is about trying new foods.","在尝试新食物这件事上，亚历克斯比艾米莉更敢尝试。"]},{"n":7,"ask":["Why isn’t everyone surprised that Alex likes sushi?\n\n________\n\n________","为什么大家对亚历克斯喜欢寿司并不惊讶？"],"ans":["He was looking forward to trying authentic Japanese food.","他一直期待着尝尝地道的日本料理。"]},{"n":8,"ask":["What holds everything together in a roll of sushi?\n\n________","寿司卷里，是什么把各种材料裹在一起？"],"ans":["a thin sheet of seaweed","一张薄薄的海苔。"]},{"n":9,"ask":["What is *wasabi*?\n\n________","wasabi 是什么？"],"ans":["a very spicy condiment","一种很辣的调味酱，即山葵酱。"]},{"n":10,"ask":["Why does Mr. Godfrey say, “Our kids are turning into some very well-seasoned eaters”?\n\n________\n\n________","戈弗雷先生为什么说两个孩子“快成老练的美食家啦”（well-seasoned eaters）？"],"ans":["Alex and Emily both enjoy the sushi and want to find a restaurant at home that serves it.","两个孩子都喜欢寿司，也想回家后找一家卖寿司的餐馆。"]}]},{"id":"P008","title":["Bonsai","盆景"],"lead":["Have you ever seen miniature trees, or bonsai, at a nursery or a botanic garden?","你在苗圃或植物园里见过小小的盆景树吗？"],"exercise":"P009","genre":"说明文","family":"info","parts":[{"n":1,"t":["In Japan, the word *bonsai* means *tray plant*. It refers to the interesting combination of art and cultivation of miniature trees and plants. Bonsai originated in China more than 2,000 years ago. The tradition spread to Japan about 700 years ago, and it is still popular there today.","在日本，bonsai 一词的意思是“盆中植物”。它指的是把艺术与微型树木和植物的培育巧妙结合起来的做法。盆景于两千多年前起源于中国，大约七百年前传入日本，今天在那里依然很受欢迎。"],"type":"paragraph"},{"n":2,"t":["Some people believe that small, or *dwarf*, plants must be used in bonsai, but this is not true. Nearly any type of tree or plant can be used, as long as it is grown from a seed or small cutting. The owner must then prune, trim, and shape the plant as it grows so that it resembles, in miniature, a much larger tree. He or she must do this skillfully, however, because the plant must appear to have grown naturally, untouched by humans. It takes a great deal of care and patience to achieve this balance.","有人以为制作盆景必须用小型或矮生植物，其实并非如此。几乎任何一种树木或其他植物都能用，只要是从种子或一小截插枝培育起来的。随着植物长大，主人要为它修枝、整理、造型，让它成为一株大树的缩小版。这些操作必须很讲究技巧，因为植物得看起来自然长成，仿佛未经人工修整。要做到这一点，需要非常细心，也需要很大的耐心。"],"type":"paragraph"},{"n":3,"t":["A bonsai is more than just a plant. It holds a special and significant place in Japanese culture. According to Japanese tradition, three elements are necessary to create a successful bonsai: truth, goodness, and beauty. When these three elements come together, a bonsai can live for hundreds of years! It may be passed down from one generation of a family to the next as a prized possession.","盆景除了是一株植物，在日本文化中还有特殊而重要的地位。按照日本传统，要做出一盆成功的盆景，需要真、善、美三种要素。三者兼具时，盆景可以活上几百年！一个家庭可以把它当作珍贵的财产，一代代传下去。"],"type":"paragraph"},{"n":4,"t":["In Japan, bonsais are grown in containers outdoors but are brought into the home for special occasions. Inside, they are often placed in the *tokonoma*. This is a small area in traditional Japanese rooms intended for the display of artistic objects. In a Japanese garden, other items may be added to the bonsai. The addition of rocks, small buildings, and miniature people is called *bon-kei*. *Sai-kei* is a related art form in which entire landscapes are reproduced in miniature.","在日本，盆景平时种在室外的容器里，遇到特别的日子才搬进屋内。进屋后，盆景常摆在称为 tokonoma 的壁龛里。这是日式传统房间里专门陈设艺术品的一小块地方。在日式庭园中，人们也会给盆景配上其他物件。添上石块、小建筑和微型人物的做法叫作盆景布置（bon-kei）。与之相近的一种艺术叫作盆栽造景（sai-kei），把一整片景观缩小再现。"],"type":"paragraph"},{"n":5,"t":["There are five basic styles of bonsai: the formal upright, informal upright, slanting, cascade, and semi-cascade. In the formal upright, the trunk of the tree should be perfectly straight, and the branches should be balanced. In the informal upright, the trunk should bend slightly to one side, but never toward the viewer. The trunk of a slanting tree leans to one side and may look similar to the informal upright.","盆景有五种基本造型：直干式、曲干式、斜干式、悬崖式和半悬崖式。直干式的树干应笔直，枝条分布应均衡。曲干式的树干应略向一边弯曲，不能朝观看者的方向弯。斜干式的树干朝一边倾斜，看起来可能与曲干式相似。"],"type":"paragraph"},{"n":6,"t":["Cascade and semi-cascade are similar because in both styles the leaves and the branches cascade down toward the base of the plant. The main difference is that in the cascade style, the leaves actually extend below the bottom of the container.","悬崖式和半悬崖式也很相似，因为这两种造型的枝叶都朝植株根基的方向向下垂。主要区别在于，悬崖式盆景的叶子甚至会垂到容器底部以下。"],"type":"paragraph"},{"n":7,"t":["If you are interested in raising a bonsai of your own, there is no need to go all the way to Japan to find one. Today, bonsais are available in nurseries all over the United States. You will have to do a little research to make sure that you know how to properly care for your plant. You will also need to be prepared to spend time caring for your plant. But as any bonsai owner will tell you, your efforts are well worth the reward of being a part of this *time-honored* Asian tradition.","如果你想养一盆属于自己的盆景，不用千里迢迢跑去日本。如今，美国各地的苗圃都能买到盆景。你需要查一些资料，弄清怎样正确照料自己的植物，也要准备为照料它花些时间。不过，任何一位盆景主人都会告诉你，能参与这项历史悠久、备受尊重的亚洲传统，付出的心力很值得。"],"type":"paragraph"}],"original":[{"n":1,"ask":["the process of growing and caring for something\n________","种植并照料某种东西的过程。"],"ans":["cultivation","cultivation（培育）"],"dir":["Write the words from the passage that have the meanings below.","从文中找出和下列释义相符的词，写下来。"]},{"n":2,"ask":["to trim away the unwanted parts of a tree or bush\n________","修去树木或灌木上不需要的部分。"],"ans":["prune","prune（修剪）"]},{"n":3,"ask":["copied; made again\n________","仿制的，重新制作的。"],"ans":["reproduced","reproduced（再现的）"]},{"n":4,"ask":["________ The tradition of raising bonsais was begun in Europe.","培育盆景的传统始于欧洲。"],"ans":["F","F（错误）。"],"dir":["Write **T** before the sentences that are true. Write **F** before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":5,"ask":["________ Japanese bonsais are usually grown in containers outdoors.","日本盆景通常种在室外的容器里。"],"ans":["T","T（正确）。"]},{"n":6,"ask":["________ The owner of a bonsai must spend some time caring for the plant.","盆景主人必须花一些时间照料植物。"],"ans":["T","T（正确）。"]},{"n":7,"ask":["________ There are three basic styles of bonsai.","盆景有三种基本造型。"],"ans":["F","F（错误）。"]},{"n":8,"ask":["What do you think the phrase *time-honored tradition* means?\n________","你认为 time-honored tradition 这个短语是什么意思？"],"ans":["something that is respected because it has existed for a long period of time","因为长久传承而受到尊重的传统。"]},{"n":9,"ask":["What are the three elements needed to create a successful bonsai?\n________","要做出一盆成功的盆景，需要哪三种要素？"],"ans":["truth, goodness, and beauty","真、善、美。"]},{"n":10,"ask":["How are the cascade and semi-cascade styles of bonsai similar?\n________","悬崖式和半悬崖式盆景有什么相似之处？"],"ans":["The leaves and the branches cascade down toward the base of the plant.","两种盆景的枝叶都朝着植株根基的方向下垂。"]},{"n":11,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ for pleasure or entertainment\n- ________ for information\n- ________ to form an opinion about bonsais","读者阅读本文的目的是什么？\nA. 获得乐趣或娱乐\nB. 获取信息\nC. 对盆景形成自己的看法"],"ans":["✓ for information","B. 获取信息"]}]},{"id":"P010","title":["A Schoolyard Garden","校园菜园"],"lead":["What are your favorite fruits and vegetables?","你最喜欢哪些水果和蔬菜？"],"exercise":"P011","genre":"说明文","family":"info","parts":[{"n":1,"t":["Have you ever eaten something that you grew in your own garden? Many people have not had the pleasure of this experience. Alice Waters, the owner of Chez Panisse Restaurant, set out to change all that for a special group of students at Martin Luther King Junior Middle School in Berkeley, California.","你吃过自己在园子里种的东西吗？很多人还没体会过这种乐趣。加利福尼亚州伯克利市有一所马丁·路德·金初级中学，谢潘尼斯餐厅的老板爱丽丝·沃特斯决定让那里的一群学生有机会获得这样的体验。"],"type":"paragraph"},{"n":2,"t":["Waters worked with the school's principal, Neil Smith, to create a cooking and gardening program at the school. Waters believes in the importance of people knowing where their food comes from. She also believes that there is a strong relationship between food, health, and the environment. Her goal at the middle school was to show children the pleasure in gardening and in preparing the foods that they cultivated. She wanted to teach them that a healthy body and a healthy environment go hand in hand.","沃特斯与校长尼尔·史密斯合作，在学校开设了烹饪与园艺项目。沃特斯认为，人们有必要知道食物从哪里来。她也相信，食物、健康和环境之间有密切的关系。她在这所中学的目标是让孩子们体会种菜和烹制自己种出的食物的乐趣。她希望孩子们明白，身体健康与环境健康密切相关。"],"type":"paragraph"},{"n":3,"t":["The project that Waters began took a lot of time and patience. She relied on the help of teachers, students, and community volunteers to turn an asphalt parking lot into a garden. At the same time, renovation was begun to turn an old, unused cafeteria into a kitchen where students could prepare foods and share meals with their teachers.","沃特斯发起的项目耗费了许多时间和耐心。她靠老师、学生和社区志愿者帮忙，把一块柏油停车场变成菜园。同时，学校也开始改造一间废置的旧食堂，把它变成学生可以做饭并和老师一起吃饭的厨房。"],"type":"paragraph"},{"n":4,"t":["In the 1995–1996 school year, the first usable crops were planted. They included greens such as arugula and mustard, as well as lettuce, kale, bok choy, carrots, turnips, beets, and potatoes. The following year brought the addition of plants such as citrus trees, apples, plums, black currants, hazelnuts, figs, raspberries, runner beans, and hibiscus. Every year since then, new crops are added and old crops are evaluated to make sure that they are best suited for the environment and the needs of the school.","1995 至 1996 学年，学校种下第一批可以食用的作物，包括芝麻菜和芥菜等绿叶菜，还有生菜、羽衣甘蓝、小白菜、胡萝卜、芜菁、甜菜根和土豆。第二年，又增加了柑橘树、苹果、李子、黑加仑、榛子、无花果、覆盆子、红花菜豆和木槿等植物。此后每年都会增加新作物，并评估已有作物，确保所种的作物最适合当地环境和学校的需要。"],"type":"paragraph"},{"n":5,"t":["Students have found that they look forward to the time they spend in the garden each week. They have learned how to weed, prune, and harvest. They have learned about the life cycles of various plants. They also know how to enrich the soil through composting, a process in which leftover scraps of fruits and vegetables are used as fertilizer. Many have discovered that they like fruits and vegetables that they had never before been willing to try.","学生们发现，自己每周都盼着去菜园劳动。他们学会了除草、修剪和收获，也了解了多种植物的生命周期。他们还知道怎样用堆肥来提高土壤肥力，也就是把剩下的果蔬边角料当作肥料。不少学生发现，以前连尝都不肯尝的水果和蔬菜，自己其实很喜欢。"],"type":"paragraph"},{"n":6,"t":["Alice Waters dreams that one day there will be a garden in every school in the United States. She hopes that school lunches can be prepared using the produce from the gardens and other locally-grown organic produce. If you are interested in learning more about Martin Luther King Junior Middle School's Edible Schoolyard, seeing pictures of the students and their garden, and finding out about how to start a garden at your school, visit www.edibleschoolyard.org.","爱丽丝·沃特斯梦想有一天，美国的每所学校都能有一座菜园。她希望学校能用菜园的收成和其他本地种植的有机农产品制作午餐。如果你想进一步了解马丁·路德·金初级中学的“可食校园”项目，看看学生和菜园的照片，了解如何在自己的学校开辟菜园，可以访问 www.edibleschoolyard.org。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What is *composting*?\n________","composting（堆肥）是什么？"],"ans":["a process in which leftover scraps of fruits and vegetables are used as fertilizer","把剩余的果蔬边角料当作肥料的过程。"]},{"n":2,"ask":["Name four fruits or vegetables that are grown in the Edible Schoolyard.\n________","说出“可食校园”菜园里种植的四种水果或蔬菜。"],"ans":["Answers will vary. Possible answer: lettuce, kale, carrots, beets","答案可以不同。参考答案：生菜、羽衣甘蓝、胡萝卜、甜菜根。"]},{"n":3,"ask":["Do you think that other schools will create gardens based on Alice Waters's ideas? Why?\n________","你认为其他学校会根据爱丽丝·沃特斯的想法开辟菜园吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":4,"ask":["Check the sentence that best states the **main idea** of the selection, or tells what the passage is mostly about.\n\n- ________ Alice Waters owns Chez Panisse Restaurant in California.\n- ________ Students look forward to the time they spend gardening each week.\n- ________ Alice Waters founded the Edible Schoolyard, a program in which students learn to grow and prepare their own foods.","选出最能概括本文主旨，也就是说明文章主要写什么的一句。\nA. 爱丽丝·沃特斯在加利福尼亚州开了一家谢潘尼斯餐厅。\nB. 学生们盼着每周去菜园劳动。\nC. 爱丽丝·沃特斯创办了“可食校园”项目，让学生学习自己种植和烹制食物。"],"ans":["✓ Alice Waters founded the Edible Schoolyard, a program in which students learn to grow and prepare their own foods.","C. 爱丽丝·沃特斯创办了“可食校园”项目，让学生学习自己种植和烹制食物。"]},{"n":5,"ask":["Check the words that describe Alice Waters.\n\n- ________ generous\n- ________ unfriendly\n- ________ talented\n- ________ ambitious\n- ________ stingy","勾选能描述爱丽丝·沃特斯的词。\nA. 慷慨的\nB. 不友好的\nC. 有才华的\nD. 有抱负的\nE. 吝啬的"],"ans":["- ✓ generous\n- ✓ talented\n- ✓ ambitious","A. 慷慨的；C. 有才华的；D. 有抱负的。"]},{"n":6,"ask":["goes together ________","紧密联系，相互配合。"],"ans":["hand in hand","hand in hand（密切相关，携手并进）"],"dir":["Write the idiom from paragraph 2 on the line next to its meaning.","从第 2 段找出与释义相符的习语，写在释义旁边的横线上。"]},{"n":7,"ask":["Why does Alice Waters believe that students should know how to cook and garden?\n________","为什么爱丽丝·沃特斯认为学生应该会做饭和做园艺？"],"ans":["Possible answer: She wants to teach students that a healthy body and a healthy environment go together.","参考答案：她想让学生知道，身体健康和环境健康密切相关。"]},{"n":8,"ask":["Do you have a school garden at your school? If so, what do you grow there? If not, what could you do to help start one?\n________","你们学校有菜园吗？有的话，你们在里面种什么？没有的话，你能做些什么来帮忙开辟一座菜园？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P012","title":["A Growing Plan","开辟校园菜园的计划"],"lead":["Does your school have a garden?","你们学校有菜园吗？"],"exercise":"P013","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Drew, Emilio, and Michi sat at a picnic table in the park on a beautiful, crisp fall afternoon. The air around them was filled with the sounds of children playing, dogs barking, and people laughing or calling to one another. But Drew, Emilio, and Michi ignored the sounds around them and focused on the task they had set out to complete.","一个晴朗清爽的秋日下午，德鲁、埃米利奥和美智坐在公园的野餐桌旁。四周都是孩子嬉戏、狗叫、人们说笑或互相招呼的声音。三个孩子却没有理会周围的动静，一门心思做他们打定主意要完成的事。"],"type":"paragraph"},{"n":2,"t":["They wanted to start a school garden at Jefferson Middle School. Initially, it had been Drew’s idea. He had first seen a school garden when he went to visit his cousin P.J. in Washington. He was amazed at the variety of fruits and vegetables the students at P.J.’s school grew. “It’s a lot of work,” P.J. had warned. “But it’s also my favorite part of the week. I love putting on my boots, getting outside, and seeing all the new things that have happened since I was last out there.”","他们想在杰斐逊中学开辟一座校园菜园。一开始，这是德鲁的主意。他到华盛顿看望表亲 P.J. 时，第一次见识到校园菜园。P.J. 学校的学生种了那么多种水果和蔬菜，让德鲁十分惊讶。“可得干不少活儿呢，”P.J. 提醒他说，“不过这也是我一周里最喜欢的事。我喜欢穿上靴子到户外去，看看从我上次来以后，菜园里又有了哪些新的变化。”"],"type":"paragraph"},{"n":3,"t":["When Drew returned from his trip to Washington, he told Emilio and Michi all about what he had seen. Now the three of them were determined to come up with a plan to bring a school garden to Jefferson.","德鲁从华盛顿回来后，把所见所闻全告诉了埃米利奥和美智。现在，他们三人下定决心要想出一个计划，好让杰斐逊中学也有一座菜园。"],"type":"paragraph"},{"n":4,"t":["Drew opened his notebook and prepared to record any ideas they had for convincing Ms. Milano, the school principal, that the garden was a good idea.","德鲁打开笔记本，准备记下大家的点子，想办法说服校长米拉诺女士，让她也觉得建菜园是个好主意。"],"type":"paragraph"},{"n":5,"t":["“We’re going to need an adult to supervise the whole operation,” said Drew thoughtfully. “I know that Mr. Hasselbach gardens at home. Just last week he brought in a whole basket of tomatoes and zucchini from his garden. He might be willing to help.” Drew jotted down Mr. Hasselbach’s name in his notebook.","“我们得请一位大人来监管整个项目。”德鲁想了想说，“我知道哈塞尔巴赫老师在家种菜。就在上星期，他还带来一整篮自己种的番茄和西葫芦。他可能愿意帮忙。”德鲁在笔记本上记下了哈塞尔巴赫老师的名字。"],"type":"paragraph"},{"n":6,"t":["“We might need donations to get this project up and running,” added Michi. “We could tell Ms. Milano that we would be willing to organize a bake sale or yard sale to raise funds.”","“要让这个项目启动并运转起来，我们也许需要一些捐助。”美智补充说，“我们可以告诉米拉诺校长，我们愿意办一次烘焙食品义卖，或者办一场庭院旧货义卖来筹钱。”"],"type":"paragraph"},{"n":7,"t":["“That’s a great idea,” said Emilio. “I think we need to be able to present her with a realistic plan. My aunt is the co-owner of a nursery. She could help us design the garden, select plants, and create a budget. That way, Ms. Milano wouldn’t feel as though she were committing to something unknown.”","“这个主意真好。”埃米利奥说，“我觉得我们得拿出一份切实可行的计划。我姑姑和别人合开了一家苗圃。她能帮我们设计菜园、挑选植物，再订出一份预算表。这样，米拉诺校长就不会觉得自己是在答应一件情况不明的事。”"],"type":"paragraph"},{"n":8,"t":["Drew nodded and made some more notes. “P.J. mentioned that the students at his school cook meals with the produce from their garden. If we do something like that too, think of all the lessons we’d learn. We’d have to measure and weigh things and follow a recipe. Combine that with the science lessons we’d get from working in the garden, and there’s no way Ms. Milano could turn us down!”","德鲁点点头，又记了几笔。“P.J. 提到，他们学校的学生会用菜园里收获的东西做饭。如果我们也这么做，想想能学到多少东西。我们得量一量、称一称，还得照食谱做。再加上在菜园里劳动能学到的科学知识，米拉诺校长肯定不会拒绝！”"],"type":"paragraph"},{"n":9,"t":["Michi and Emilio grinned. “If everything goes as planned, we’ll be digging in the dirt in no time at all!”","美智和埃米利奥咧嘴笑了。“要是一切顺利，我们很快就能在地里挖土啦！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ My cousin P.J. lives in Washington.","我的表亲 P.J. 住在华盛顿。"],"ans":["F","F（第一人称）。"],"dir":["The **point of view** tells the reader whose view of the story he or she is reading. In **first-person point of view**, the reader knows the thoughts and feelings of the person telling the story. In **third-person point of view**, the reader only knows what an outsider knows about a character. Mark each phrase below **F** for first-person and **T** for third-person.","叙述视角告诉读者，故事是从谁的角度讲述的。采用第一人称视角时，读者能了解讲故事的人的想法和感受。采用第三人称视角时，读者只能了解旁观者能知道的关于人物的情况。请给下面各项标上 F 或 T，F 表示第一人称，T 表示第三人称。"]},{"n":2,"ask":["________ Emilio’s aunt is the co-owner of a nursery.","埃米利奥的姑姑和别人合开了一家苗圃。"],"ans":["T","T（第三人称）。"]},{"n":3,"ask":["________ Mr. Hasselbach has a vegetable garden.","哈塞尔巴赫老师有一座菜园。"],"ans":["T","T（第三人称）。"]},{"n":4,"ask":["________ I hope Ms. Milano likes our idea.","我希望米拉诺校长喜欢我们的主意。"],"ans":["F","F（第一人称）。"]},{"n":5,"ask":["What problem do Drew, Emilio, and Michi have at the beginning of the story?\n________","故事开头，德鲁、埃米利奥和美智面临什么问题？"],"ans":["They have to figure out how to convince Ms. Milano that the garden is a good idea.","他们得想办法说服米拉诺校长，让她也觉得开辟菜园是个好主意。"]},{"n":6,"ask":["Where did Drew get the idea to start a school garden at his middle school?\n________","德鲁是从哪里得到在自己学校开辟菜园的灵感的？"],"ans":["from his cousin's school in Washington","从他表亲在华盛顿的学校得到的。"]},{"n":7,"ask":["How do Drew, Emilio, and Michi know that Mr. Hasselbach has a garden at home?\n________","德鲁、埃米利奥和美智怎么知道哈塞尔巴赫老师在家里有菜园？"],"ans":["He brings in vegetables to school that he grew in his garden at home.","他把自己在家里种的蔬菜带到了学校。"]},{"n":8,"ask":["Name two ideas that the students have that they think will make Ms. Milano more likely to approve their plan.\n________","说出学生想出的两个点子，他们觉得这些点子能让米拉诺校长更有可能批准他们的计划。"],"ans":["Answers will vary. Possible answer: They can tell Ms. Milano they will organize a bake sale or yard sale. They can present Ms. Milano with a reasonable plan.","答案可以不同。参考答案：他们可以告诉校长要办烘焙食品义卖或庭院旧货义卖，也可以向她提交一份切实可行的计划。"]},{"n":9,"ask":["to start something________","把某件事启动起来。"],"ans":["up and running","up and running（启动并运转起来）"],"dir":["Write the idiom from paragraph 6 on the line next to its meaning.","从第 6 段找出与释义相符的习语，写在释义旁边的横线上。"]},{"n":10,"ask":["What is the setting for this story?\n________","故事发生在什么地方？"],"ans":["a picnic table at a park","公园里的一张野餐桌旁。"]},{"n":11,"ask":["Would you like to have a garden at your school or at home? Why or why not?\n________","你想在学校或家里拥有一座菜园吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P014","title":["What’s Cooking?","今天做什么菜？"],"lead":["What are some other meals you could make using the fresh vegetables from your garden or from a farmer’s market?","用自家菜园种的或从农贸市场买来的新鲜蔬菜，你还能做些什么菜？"],"exercise":"P015","genre":"食谱","family":"info","parts":[{"n":"u1","t":["Before you begin:","动手之前"],"type":"note"},{"n":"u2","t":["• Never use the stove or a knife without an adult’s supervision.\n• Always remember to keep the handle of the skillet turned in so you cannot accidentally bump into it.","• 没有大人在旁照看时，切勿用炉灶或刀具。\n• 切记把平底锅的把手转向里侧，以免不小心碰到它。"],"type":"list"},{"n":"u3","t":["Garden Lasagna","田园蔬菜千层面"],"type":"note"},{"n":"u4","t":["1 16-ounce package lasagna noodles\n2 teaspoons olive oil\n1 1/2 cups diced red bell pepper\n1 cup diced green bell pepper\n1 small yellow onion, diced\n2 cups diced tomatoes\n1 large zucchini, thinly sliced\n1 16-ounce can tomato sauce\n1/2 cup grated Parmesan cheese\n1 15-ounce container part-skim ricotta cheese\n1 8-ounce package part-skim shredded mozzarella cheese\n2 eggs\n1/4 teaspoon black pepper\n1/4 teaspoon dried oregano","千层面片 1 包（16 盎司）\n橄榄油 2 茶匙\n红甜椒丁 1 又 1/2 杯\n绿甜椒丁 1 杯\n小黄洋葱 1 个，切丁\n番茄丁 2 杯\n大西葫芦 1 根，切薄片\n番茄酱 1 罐（16 盎司）\n磨碎的帕尔马干酪 1/2 杯\n部分脱脂的里科塔奶酪 1 盒（15 盎司）\n部分脱脂的马苏里拉奶酪丝 1 包（8 盎司）\n鸡蛋 2 个\n黑胡椒 1/4 茶匙\n干牛至 1/4 茶匙"],"type":"note"},{"n":1,"t":["Here are some other things you will need: a measuring cup, a teaspoon, a cutting knife, a colander, a wooden spoon, wax paper, a large pot, a bowl, aluminum foil, a saucepan, a spatula, and a 9-inch by 13-inch baking dish.","你还需要准备这些用具：量杯、茶匙、切菜刀、滤水篮、木勺、蜡纸、大锅、碗、铝箔、煮锅、锅铲，以及一个 9 英寸乘 13 英寸的烤盘。"],"type":"paragraph"},{"n":2,"t":["Bring a large pot of lightly salted water to a boil. Cook the noodles in boiling water for 8 to 10 minutes, stirring occasionally. Have an adult pour the noodles into a colander in the sink. Rinse the noodles with cold water and place them in a single layer on wax paper to cool.","在一大锅水中加少许盐，烧开。把面片放在沸水里煮 8 至 10 分钟，偶尔搅拌。请大人把面片倒进水槽里的滤水篮。用冷水冲洗面片，再在蜡纸上平铺一层，放凉。"],"type":"paragraph"},{"n":3,"t":["Cook the diced bell peppers and onion in olive oil in a large saucepan until the onions are translucent. Stir in the tomatoes, zucchini, and tomato sauce. Simmer for 10 minutes.","在一口大煮锅里用橄榄油炒甜椒丁和洋葱丁，直到洋葱变成半透明。加入番茄、西葫芦和番茄酱搅匀，小火煮 10 分钟。"],"type":"paragraph"},{"n":4,"t":["Preheat the oven to 375°F. In a medium bowl, combine 1/4 cup of the Parmesan cheese with the ricotta cheese, mozzarella cheese, eggs, black pepper, and oregano. Remember to wash your hands after handling the eggs.","把烤箱预热至华氏 375 度。在一个中等大小的碗里，把 1/4 杯帕尔马干酪与里科塔奶酪、马苏里拉奶酪、鸡蛋、黑胡椒和牛至拌匀。碰过鸡蛋之后记得洗手。"],"type":"paragraph"},{"n":5,"t":["Reserve 1/2 cup of the mixture. Then, place a small amount of the vegetable mixture in the bottom of the baking dish. Place three lasagna noodles lengthwise in the dish. Layer some of the cheese mixture and the vegetable sauce on top of the noodles. Continue to layer the remaining ingredients, ending with noodles.","留出 1/2 杯奶酪混合料。接着，在烤盘底部铺一小层蔬菜混合料。顺着烤盘的长边放三张面片。在面片上铺一层奶酪混合料和蔬菜酱。继续把剩下的食材一层层铺上去，最上面铺面片。"],"type":"paragraph"},{"n":6,"t":["Spread the reserved cheese mixture on top of the noodles. Sprinkle with the remaining half of the Parmesan cheese.","把先前留出的奶酪混合料抹在面片上，再撒上剩下的一半帕尔马干酪。"],"type":"paragraph"},{"n":7,"t":["Cover the dish with foil, and bake for 20 minutes. Remove the foil, and bake for 10 more minutes so the cheese can brown.","用铝箔盖住烤盘，烤 20 分钟。去掉铝箔，再烤 10 分钟，让奶酪烤成金黄色。"],"type":"paragraph"},{"n":8,"t":["Allow the lasagna to cool for about 10 minutes before serving. Then, invite your friends and family to the table to sample this tasty dish. It serves 8, so there is a good chance that you won’t finish it all. Just freeze the leftovers, and enjoy them on another day.","让千层面冷却约 10 分钟再上桌。然后请亲友入座，尝尝这道美味。这道菜可供 8 人食用，可能吃不完。把剩下的冷冻起来，改天再吃。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the line beside the word or words that best describe what type of nonfiction passage this is.\n\n- ________ how-to\n- ________ biography\n- ________ persuasive text","选出最能说明本文是哪种非虚构文章的一项。\nA. 操作指南\nB. 传记\nC. 说服性文章"],"ans":["✓ how-to","A. 操作指南"]},{"n":2,"ask":["Number the tasks below to show the order in which they should be done.\n\n- ________ Combine the cheeses, eggs, and spices.\n- ________ Ask an adult to drain the lasagna noodles.\n- ________ Boil a pot of water.\n- ________ Simmer the vegetable mixture.\n- ________ Allow the lasagna to cool.","给下列任务标上序号，表示应当怎样依次完成。\n拌匀奶酪、鸡蛋和香料。\n请大人把千层面片沥干。\n烧开一锅水。\n小火煮蔬菜混合料。\n让千层面冷却。"],"ans":["- **4** Combine the cheeses, eggs, and spices.\n- **2** Ask an adult to drain the lasagna noodles.\n- **1** Boil a pot of water.\n- **3** Simmer the vegetable mixture.\n- **5** Allow the lasagna to cool.","按题中所列顺序，分别标 4、2、1、3、5。"]},{"n":3,"ask":["Why do you think you should wash your hands after handling the eggs?\n\n________","你觉得为什么碰过鸡蛋之后要洗手？"],"ans":["Possible answer: You could become sick.","参考答案：否则可能会生病。"]},{"n":4,"ask":["For how long should you boil the lasagna noodles?\n\n________","千层面片要煮多久？"],"ans":["8 to 10 minutes","8 至 10 分钟。"]},{"n":5,"ask":["What is the total amount of time the lasagna will bake?\n\n________","千层面总共要烤多久？"],"ans":["30 minutes","30 分钟。"]},{"n":6,"ask":["What five vegetables are used in this recipe?\n\n________","这份食谱用到了哪五种蔬菜？"],"ans":["red bell pepper, green bell pepper, yellow onion, tomatoes, and zucchini","红甜椒、绿甜椒、黄洋葱、番茄和西葫芦。"]},{"n":7,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to tell a story about a family who makes a lasagna\n- ________ to explain how to make lasagna\n- ________ to persuade the reader to make lasagna for dinner","选出最能说明作者写作目的的一项。\nA. 讲一家人做千层面的故事。\nB. 说明怎样做千层面。\nC. 说服读者晚饭做千层面。"],"ans":["✓ to explain how to make lasagna","B. 说明怎样做千层面。"]},{"n":8,"ask":["How is this recipe similar to and different from other types of lasagna you’ve had?\n\n________","这份食谱做出的千层面跟你吃过的其他千层面有什么相同和不同？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":9,"ask":["Is this a recipe you’d like to try at home? Why or why not?\n\n________","你想在家试做这份食谱吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P016","title":["Garden Gourmet","菜园美食宴"],"lead":["Have you ever helped to prepare a meal for a large group of people?","你帮忙为一大群人准备过一顿饭吗？"],"exercise":"P017","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Emilio and Michi spread the colorful tablecloth on the table. They made room for Drew, who was carrying a covered casserole dish with potholders. Small beads of water had condensed on the inside of the lid. “Watch out,” Drew warned. “This is pretty hot.”","埃米利奥和美智把色彩鲜艳的桌布铺在桌上。他们腾出地方，好让德鲁放下他隔着隔热垫端来的带盖烤盘。盖子内侧凝结着一颗颗小水珠。“小心，”德鲁提醒说，“这盘菜挺烫。”"],"type":"paragraph"},{"n":2,"t":["A moment later, Kent and Alyssa added another steaming dish to the table. “That smells so good!” exclaimed Michi. “Are most of the parents here yet? I’m famished.”","不一会儿，肯特和艾丽莎又端来一盘热气腾腾的菜。“真香啊！”美智叫道，“家长们差不多都到了吗？我饿坏了。”"],"type":"paragraph"},{"n":3,"t":["Kent peeked through the doors that led into the hallway. “I think Ms. Milano and Mr. Hasselbach just finished giving them the garden tour. They should be heading into the cafeteria next.”","肯特透过通往走廊的门朝外瞄了一眼。“我想米拉诺校长和哈塞尔巴赫老师刚领着他们参观完菜园。接下来，他们应该要进食堂了。”"],"type":"paragraph"},{"n":4,"t":["The students of Jefferson Middle School had spent all afternoon preparing for the evening meal. They did their best to transform the lunchroom into an elegant and beautiful dining area for their families. The gray metal tables were hidden beneath brightly-colored cotton tablecloths. Each table held a small glass vase with fresh flowers from the school’s garden.","杰斐逊中学的学生花了整整一个下午准备晚餐。他们想尽办法，把学校食堂变成了一个优雅漂亮的用餐场所，请家人来吃饭。灰色金属餐桌被色彩鲜艳的棉布桌布盖住了。每张桌上都有一只小玻璃花瓶，插着学校菜园里摘来的鲜花。"],"type":"paragraph"},{"n":5,"t":["Only about half of the overhead lights were on. The rest of the lighting was provided by the small white lights that Michi and Alyssa had carefully wrapped around the columns that were scattered throughout the cafeteria. They thought that candles would do an excellent job of creating an elegant mood, but Ms. Milano would not be swayed from her conviction that candles were too risky to use in a school.","天花板上的灯只开了大约一半。其余的光来自白色小灯串，是美智和艾丽莎仔细缠在食堂各处的柱子上的。她们觉得蜡烛特别能营造优雅的气氛，但米拉诺校长坚信，在学校使用蜡烛太危险，怎么劝也没有改变主意。"],"type":"paragraph"},{"n":6,"t":["As the families found their seats, Ms. Milano motioned to Drew, Emilio, and Michi to join her at the front of the room. “Could I have everyone’s attention?” asked Ms. Milano. “I know you can smell all the wonderful foods our students prepared, so I won’t keep you from your dinners for long. I just wanted to take a moment to congratulate Drew, Emilio, and Michi for their wonderful idea.”","当家长们找到座位时，米拉诺校长招手示意德鲁、埃米利奥和美智到大厅前方来。“请大家听我说几句好吗？”她说，“我知道大家已经闻到学生们做的美味饭菜了，所以不会耽误大家太久。我只想花一点时间，表扬德鲁、埃米利奥和美智想出了这么好的主意。”"],"type":"paragraph"},{"n":7,"t":["Mrs. Milano continued, “A year ago, they first came to me with the plan for starting a garden at Jefferson. I was a bit skeptical at first, but they had thought through everything. Anytime I had a question about how we would make this work, they had an answer prepared. As you can see, they were absolutely correct. About three-quarters of the food you’ll be enjoying tonight came from the school garden. The students prepared the entire meal themselves, with some guidance from Mr. Hasselbach.”","米拉诺校长接着说：“一年前，他们第一次来找我，拿出在杰斐逊中学开辟菜园的计划。起初我有点怀疑，但他们把方方面面都想过了。每当我问具体要怎么做，他们都有准备好的答案。大家看，他们完全想对了。各位今晚享用的食物，约有四分之三来自学校的菜园。整顿饭都是学生们自己做的，哈塞尔巴赫老师从旁指导了一下。”"],"type":"paragraph"},{"n":8,"t":["Ms. Milano handed Drew, Michi, and Emilio each a tissue-wrapped package. They unwrapped their packages as Ms. Milano addressed the room. “As a thank-you to these students for their creative idea, hard work, and perseverance, they have each received a stepping stone for the garden. Their names and the date are engraved on the stones.”","米拉诺校长给德鲁、美智和埃米利奥每人递上一个薄纸包。三个孩子打开纸包，校长对在场的人说：“为了感谢这几位学生的创意、努力和坚持，我们给他们每人送上一块菜园铺路石。石头上刻着他们的名字和日期。”"],"type":"paragraph"},{"n":9,"t":["She turned to them. “Students for years to come will be enjoying the garden that you helped create,” she said. “We thought it would be appropriate for them to have a reminder of our garden’s ambitious founders.”","她转向三个孩子。“今后很多年的学生都能享用你们参与建成的菜园，”她说，“我们想，应该给大家留点东西，让他们记得这座菜园里几位有抱负的创办者。”"],"type":"paragraph"},{"n":10,"t":["Drew, Emilio, and Michi held up their stepping stones and grinned as the crowd clapped. “And now,” said Ms. Milano, “please help yourselves to some of the mouthwatering food our young chefs have prepared. Dinner is served!”","德鲁、埃米利奥和美智举起铺路石，在众人的掌声中咧嘴笑了。“现在，”米拉诺校长说，“请大家尽情享用小厨师们做的这些让人流口水的菜吧。晚餐开始！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["The students put a great deal of ________ into the preparation of the meal.\n\n- effort\n- guidance\n- transformation","学生们为准备这顿饭付出了许多____。\nA. effort（努力）\nB. guidance（指导）\nC. transformation（改变）"],"ans":["effort","A. effort（努力）"],"dir":["Circle the word that best completes each sentence below.","圈出最适合补全下面每个句子的单词。"]},{"n":2,"ask":["Ms. Milano ________ Drew, Emilio, and Michi’s contributions.\n\n- regrets\n- appreciates\n- plans","米拉诺校长____德鲁、埃米利奥和美智所作的贡献。\nA. regrets（为……遗憾）\nB. appreciates（感激）\nC. plans（计划）"],"ans":["appreciates","B. appreciates（感激）"]},{"n":3,"ask":["The stepping stones are ________ with their names and the date.\n\n- requested\n- remembered\n- engraved","铺路石上____着他们的名字和日期。\nA. requested（被请求）\nB. remembered（被记住）\nC. engraved（被刻上）"],"ans":["engraved","C. engraved（被刻上）"]},{"n":4,"ask":["Name two things the students did to transform the lunchroom.\n\n________","说出学生们为了改造食堂做的两件事。"],"ans":["Answers will vary. Possible answer: They added tablecloths and flowers.","答案可以不同。参考答案：他们铺上桌布，摆了鲜花。"]},{"n":5,"ask":["Why did Ms. Milano give Drew, Michi, and Emilio stepping stones?\n\n________","为什么米拉诺校长送给德鲁、美智和埃米利奥铺路石？"],"ans":["to thank them for their hard work and to help future students remember their contributions","感谢他们的辛勤劳动，也让以后的学生记住他们的贡献。"]},{"n":6,"ask":["Why do you think Ms. Milano was skeptical when the students first presented her with the idea of starting a school garden?\n\n________","学生们第一次提出开辟学校菜园时，你觉得米拉诺校长为什么有点怀疑？"],"ans":["She knew it would be a lot of work and was not sure if it would be successful.","她知道要花很多功夫，又不确定能否成功。"]},{"n":7,"ask":["About how much of the food the students served did they grow themselves?\n\n________","学生们端上桌的食物里，大约有多少是自己种的？"],"ans":["about three-quarters of the food","大约四分之三。"]},{"n":8,"ask":["In paragraph 8, what does perseverance mean?\n\n________","第 8 段的 perseverance 是什么意思？"],"ans":["continuing to do something even when it gets difficult","即使遇到困难，也继续做下去。"]},{"n":9,"ask":["List three adjectives that describe how you think Drew, Emilio, and Michi feel at the end of the story.\n\n________","列出三个形容词，描述你认为德鲁、埃米利奥和美智在故事结尾的感受。"],"ans":["Possible answers: proud, excited, happy","参考答案：自豪、兴奋、开心。"]}]},{"id":"P018","title":["A Shriek in the Night","夜半尖叫"],"lead":["Have you ever been frightened by a sound in the night?","你半夜听到过什么声音，把你吓了一跳吗？"],"exercise":"P019","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Savannah read under her covers with a flashlight until her eyes were closing. She switched off the flashlight and let her book drop to the rug beside her bed. She turned over and snuggled deeper into the soft flannel sheets.","萨凡娜打着手电筒，在被窝里看书，直到眼睛都快睁不开了。她关掉手电筒，让书落到床边的地毯上，然后翻个身，往柔软的法兰绒床单里又钻了钻。"],"type":"paragraph"},{"n":2,"t":["It felt as though Savannah had been sleeping for only a few minutes when she awoke with a start to a terrible, bloodcurdling scream. She lay stiffly and silently in her bed waiting to see what would happen. Her clenched muscles had just begun to relax when she heard another scream coming from outside her bedroom window. This scream was followed by a series of wails and shrieks.","萨凡娜觉得自己好像才睡了几分钟，就被一声令人毛骨悚然的尖叫惊醒了。她僵着身子，一声不响地躺在床上，等着看接下来会发生什么。她绷紧的
