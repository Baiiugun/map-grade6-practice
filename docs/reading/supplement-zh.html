？当然是橙色！橙色最重要，根本用不着争论。”"],"type":"paragraph"},{"n":4,"t":["“I suppose you have all dismissed the importance of yellow.” Yellow smiled, content with her place in the world. “Can you imagine Earth without the yellow sun? The sun is as responsible for life as blood is,” she reminded the others. “Without the sun, nothing could grow. You would all live in a world of darkness. It is folly to suggest that any color but yellow is most needed and most beloved.”","“我想你们都把黄色的重要性忘了。”黄色微笑着，对自己在世上的位置很满意。“你们能想象地球上没有金黄色的太阳吗？太阳和血一样，都是生命不可缺少的。”她提醒其他颜色：“没有太阳，万物都长不了，你们都得活在黑暗里。说除了黄色以外的某种颜色最不可缺少、最讨人喜爱，实在太傻了。”"],"type":"paragraph"},{"n":5,"t":["“Look around you,” said Green. “Do you see anything at all that has not been touched by my hand? Green is truly the color of life. It is grass and trees, toads and salamanders, beans and spinach. The survival of any living creature on Earth would be brief were it not for me. I see no reason to dispute my importance.”","“看看你们周围吧，”绿色说，“你们找得出任何我没用手碰过的东西吗？绿色才真正是生命的颜色。青草、树木、蟾蜍、蝾螈、豆子和菠菜，哪个不是绿色的呢？地球上任何生物少了我，能活的时间都很短。我看没什么理由质疑我的重要性。”"],"type":"paragraph"},{"n":6,"t":["Then, there came the cry of a high-pitched voice. “If you think that I am not needed, all you must do is point your face to the sky. In any direction you look, you will see a brilliant blue. Turn your gaze to the water, the root of all life, and you will see me. Without my wide-open spaces, you would be lost.” Having said his piece, Blue settled back to listen to the others.","这时传来一声尖细的喊声。“你们要是觉得我不重要，只管抬头望天。无论往哪个方向看，都能看到耀眼的蓝色。再看看水，那是一切生命的根源，你们也会看到我。没有我广阔的天地，你们会不知所措。”蓝色说完了自己的道理，便向后一靠，听其他颜色说话。"],"type":"paragraph"},{"n":7,"t":["Violet stood up, proud and tall. “I am the color of royalty,” he said. “I am the color of power and authority. No one questions my wisdom or superiority.” With confidence he nodded and turned to Indigo, who had remained quiet until it was her turn to speak.","紫色站起身来，骄傲地挺直身子。“我是王室的颜色，”他说，“是权力和权威的颜色。没人质疑我的智慧或优越地位。”他自信地点点头，转向靛蓝色。她直到轮到自己发言才开口。"],"type":"paragraph"},{"n":8,"t":["“Have you forgotten me?” she asked quietly. “Indigo is the color of twilight. It is the color of the mountains at night and of the sky just before a storm. Indigo is the color of peace and of quiet times. You would not want to live in a world without me.”","“你们忘了我吗？”她轻声问，“靛蓝是黄昏的颜色，是夜里群山的颜色，也是风暴来临前天空的颜色。靛蓝是安宁与静谧时光的颜色。你们不会想生活在一个没有我的世界里。”"],"type":"paragraph"},{"n":9,"t":["As the colors argued, a jagged streak of lightning lit the sky. A moment later, there was a giant clap of thunder and a steady rain began to fall. The colors drew closer together, sheltering one another from the storm. They could hear the voice of Rain over the thunder’s rumblings.","颜色们正争吵着，一道锯齿状的闪电照亮了天空。转眼间，响起一声巨雷，雨便持续下了起来。颜色们靠拢在一起，相互抵挡风雨。在隆隆雷声中，他们听到了雨的声音。"],"type":"paragraph"},{"n":10,"t":["“You are all so foolish,” Rain scoffed. “Why would you think that one of you is superior to another? Look around,” she said. “Each one of you is unique and essential. Aside from your quarreling, I would not want to live in a place that even one of you didn’t inhabit.”","“你们真是太傻了，”雨嘲笑道，“为什么会以为你们当中的谁比别人更优秀呢？看看四周。你们每一个都独一无二，不可缺少。撇开你们的争吵不说，只要少了你们当中的任何一个，我就不愿住在那样的地方。”"],"type":"paragraph"},{"n":11,"t":["The colors were silent as they listened to the wise words. “Each time it rains,” added Rain, “I would like you all to come together and stretch across the sky in a giant bow of color. You will be a reminder to us all of how to live with one another in peace—a reminder of how each individual contributes something to the whole.”","颜色们安静下来，听着这一番睿智的话。“往后每次下雨，”雨接着说，“希望你们聚到一起，在天空中拉开一道巨大的彩色弧线。你们会提醒大家怎样和平共处，也会提醒大家，每一个个体都能为整体贡献一点自己的力量。”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why were the colors quarreling?\n________","颜色们为什么争吵？"],"ans":["Each thought that he or she was superior to all other colors.","每种颜色都认为自己比所有其他颜色优越。"]},{"n":2,"ask":["What reason did Yellow give for being the most important color?\n________","黄色凭什么说自己是最重要的颜色？"],"ans":["Yellow is the color of the sun.","黄色是太阳的颜色。"]},{"n":3,"ask":["Do you think that one of the colors makes a better argument than the others? Explain.\n________","你觉得哪种颜色的理由比其他颜色更有说服力？请说明。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":4,"ask":["What did Rain ask the colors to do each time it rained?\n________","雨请各个颜色在每次下雨时做什么？"],"ans":["join together and stretch across the sky in a giant bow of color","聚在一起，在天上组成一道巨大的彩色弧线。"]},{"n":5,"ask":["What do you think the colors in this legend might symbolize, or stand for? Do you\nthink there is a deeper meaning to the story? Explain.\n________","你觉得传说中的颜色可能象征什么，也就是说代表什么？你觉得故事还有更深一层的含义吗？请说明。"],"ans":["Answers will vary. Possible answer: They might symbolize the different people of the world. The story could mean that everyone is unique and valuable in their own way.","答案因人而异。示例：颜色可能象征世界上各不相同的人。故事也许是说，每个人都有自己的独特之处和价值。"]},{"n":6,"ask":["Does this story take place in reality, or is it a fantasy? How can you tell?\n________","这个故事发生在现实中，还是虚构的幻想？你怎么看出来的？"],"ans":["fantasy; Answers will vary.","是幻想。说明因人而异。"]},{"n":7,"ask":["In this legend, the colors are personified. How did the author accomplish this?\n________","在这个传说里，颜色被拟人化了。作者是怎么做到的？"],"ans":["Possible answer: The colors can talk; They have personalities.","示例：颜色会说话，也有各自的性格。"]},{"n":8,"ask":["Pick one color, and write from its point of view. What argument would you make?\n________","挑选一种颜色，从它的视角来写。你会提出什么理由？"],"ans":["Answers will vary.","答案因人而异。"]}]},{"id":"P144","title":["An Arc of Light","一道光弧"],"lead":["What causes rainbows?","彩虹是怎样形成的？"],"exercise":"P145","genre":"科学说明文","family":"info","parts":[{"n":1,"t":["Almost every culture has stories and legends about the large arcs of color that stretch across the sky when weather conditions are right. Irish folklore tells of leprechauns hiding pots of gold at the end of the rainbow. Chinese mythology explains rainbows as openings in the sky that have been sealed by a goddess using stones of seven different colors. In Hindu mythology, a rainbow is viewed as the bow of the god of thunder and lightning. Rainbows even appear in popular modern culture. Remember Dorothy singing “Somewhere Over the Rainbow” in *The Wizard of Oz*?","天气条件合适时，巨大的彩色弧线横跨天空。几乎每种文化都有关于它的故事和传说。爱尔兰民间传说里，小妖精会把一罐罐黄金藏在彩虹的尽头。中国神话说，彩虹是天上出现的裂口，由一位女神用七种颜色的石头补好。在印度教神话里，彩虹被看成掌管雷电的神所用的弓。彩虹甚至出现在现代流行文化中。还记得多萝西在《绿野仙踪》里唱《彩虹彼端》吗？"],"type":"paragraph"},{"n":2,"t":["Rainbows enchant and mystify people because they are beautiful but fleeting. Conditions must be exactly right in order for rainbows to form. They are usually seen at the end of a rain shower, on the opposite side of the sky from the sun.","彩虹美丽，又转瞬即逝，令人着迷，也让人觉得神秘。要形成彩虹，条件必须恰到好处。彩虹通常在一阵雨快结束时出现，位置在天空中与太阳相对的一侧。"],"type":"paragraph"},{"n":3,"t":["Although sunlight appears to be white, it is actually made up of all the colors in the spectrum. When sunlight enters a raindrop, it is bent, or refracted, and the light’s individual strands of color become visible. The wavelengths of different colors vary, which is why each color bends slightly differently to produce the bands of color known as a rainbow.","阳光看起来是白色的，其实是由光谱中所有的颜色组成的。阳光进入雨滴时会发生偏折，也就是折射，原来混在一起的一缕缕色光便显露出来。各种颜色的波长不同，因此各自偏折的程度略有不同，就形成了一条条彩色光带，也就是彩虹。"],"type":"paragraph"},{"n":4,"t":["Rainbows are usually described as comprising seven colors: red, orange, yellow, green, blue, indigo, and violet. An acronym for remembering the order of the colors is the name ROY G. BIV, in which each letter stands for a color in the spectrum.","人们通常说彩虹由七种颜色组成：红、橙、黄、绿、蓝、靛、紫。可以用 ROY G. BIV 这个像人名的首字母缩写来记忆次序，每个字母代表光谱中的一种颜色，分别是 Red、Orange、Yellow、Green、Blue、Indigo、Violet。"],"type":"paragraph"},{"n":5,"t":["Several people may see a rainbow at the same time, but they are not all seeing the same rainbow. Rainbows don’t exist at an exact location in the sky, and the way they appear is dependent upon a specific point. Each of your eyes even perceives a rainbow slightly differently. This means that you’ll never see the exact same rainbow as someone else, unless you are looking at a photograph!","几个人可能同时看到彩虹，不过每个人看到的彩虹并不完全相同。彩虹在天空中没有固定的确切位置，从特定地点观察，才会呈现相应的样子。甚至你的两只眼睛看到的彩虹也略有差别。也就是说，除非看的是一张照片，否则你永远看不到与他人所见完全相同的彩虹！"],"type":"paragraph"},{"n":6,"t":["Rainbows are always seen during the day because they require sunlight to form. However, it is possible to see a moonbow, or a nighttime rainbow, on nights when the moon shines particularly brightly. A moonbow is formed in the same way a rainbow is, but it is not nearly as bright. In fact, it appears to be whitish in color because the human eye cannot discern bright colors in dim light.","彩虹需要阳光才能形成，因此总是在白天出现。不过，月光特别明亮的夜晚，有可能看到月虹，也就是夜间的彩虹。月虹和白天彩虹的形成方式相同，亮度却低得多。实际上，月虹看上去有些发白，因为人眼在昏暗的光线下分辨不出鲜明的颜色。"],"type":"paragraph"},{"n":7,"t":["If weather conditions have not been right for you to spot a rainbow in the sky, you can make your own at home or at school. You’ll just need a large, clear, circular glass or jar of water, a small mirror, and a flashlight. Place the mirror in the water and tilt it slightly upward. Go into a completely dark room that has white walls, and shine the flashlight on the mirror. You’ll be able to see a colorful rainbow you created yourself.","如果天气条件一直不适合在天空中看到彩虹，你可以在家或学校亲手做一个。只需要一个盛水的大号透明圆玻璃杯或玻璃罐、一面小镜子和一支手电筒。把镜子放进水里，让镜面稍稍朝上倾斜。走进一个完全黑暗、墙壁是白色的房间，用手电筒照向镜子。你就能看到自己动手做出来的彩虹了。"],"type":"paragraph"}],"original":[{"n":1,"ask":["The Latin root **spec** means *see*. Find a word in paragraph 3 with the root **spec**.\n\n________","拉丁语词根 spec 意为“看”。从第3段中找一个含有 spec 的词。"],"ans":["spectrum","spectrum（光谱）。"]},{"n":2,"ask":["The Latin root **fract** means *break*. Find a word in paragraph 3 with the root **fract**.\n\n________","拉丁语词根 fract 意为“打破”。从第3段中找一个含有 fract 的词。"],"ans":["refracted","refracted（发生折射的）。"]},{"n":3,"ask":["The Greek root **photo** means *light*. Find a word in paragraph 5 with the root **photo**.\n\n________","希腊语词根 photo 意为“光”。从第5段中找一个含有 photo 的词。"],"ans":["photograph","photograph（照片）。"]},{"n":4,"ask":["Why do each of the colors in a rainbow bend slightly differently?\n\n________\n\n________","为什么彩虹中各种颜色偏折的程度略有不同？"],"ans":["They have different wavelengths.","各色光的波长不同。"]},{"n":5,"ask":["What is one way to remember the order of colors in a rainbow?\n\n________","怎样记住彩虹颜色的顺序？说出一种方法。"],"ans":["by using the acronym ROY G. BIV","用首字母缩写 ROY G. BIV。"]},{"n":6,"ask":["Why does a moonbow appear to be whitish in color?\n\n________\n\n________","为什么月虹看起来发白？"],"ans":["because the human eye cannot discern bright colors in dim light","因为人眼在昏暗光线下分辨不出鲜明的颜色。"]},{"n":7,"ask":["What materials do you need to create your own rainbow?\n\n________","要亲手制作彩虹，需要什么材料？"],"ans":["a glass or jar of water, a small mirror and a flashlight","一个盛水的玻璃杯或玻璃罐、一面小镜子和一支手电筒。"]},{"n":8,"ask":["What is the only way to see exactly the same rainbow someone else sees?\n\n________","怎样才能看到与别人完全相同的彩虹？这种办法只有一种。"],"ans":["look at a photograph","看同一张照片。"]},{"n":9,"ask":["How are a rainbow and a moonbow different? How are they similar?\n\n________\n\n________","彩虹和月虹有什么不同？又有什么相似之处？"],"ans":["Both are the result of light entering drops of water, but the light in a rainbow comes from the sun, while the light in a moonbow comes from the moon.","两者都是光进入水滴形成的，但彩虹的光来自太阳，月虹的光来自月亮。"]},{"n":10,"ask":["________ Leprechauns hide pots of gold at the end of the rainbow in Chinese mythology.","中国神话里，小妖精把一罐罐黄金藏在彩虹尽头。"],"ans":["F","错误（F）。"],"dir":["Write **T** before the sentences that are true. Write **F** before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":11,"ask":["________ Sunlight is made of all the colors in the spectrum.","阳光由光谱中所有颜色的光组成。"],"ans":["T","正确（T）。"]},{"n":12,"ask":["________ Most rainbows are seen on snowy days when the temperature dips below freezing.","大多数彩虹出现在气温低于冰点的下雪天。"],"ans":["F","错误（F）。"]},{"n":13,"ask":["________ Everyone looking at a rainbow will see exactly the same image of a rainbow.","看彩虹的每个人所看到的画面都一模一样。"],"ans":["F","错误（F）。"]},{"n":14,"ask":["________ Dorothy is a character in *The Wizard of Oz*.","多萝西是《绿野仙踪》中的人物。"],"ans":["T","正确（T）。"]}]},{"id":"P146","title":["Island Roots","海岛上的家族根脉"],"lead":["Have you ever traced your family tree?","你查过自己的家谱吗？"],"exercise":"P147","genre":"家庭故事","family":"lit","parts":[{"n":1,"t":["Calvin walked into the dining room carrying his backpack and several books. \"This table is a disaster area,\" he told Will, pushing some papers and books aside to clear a small space.","卡尔文背着背包，抱着几本书走进餐厅。“这张桌子简直是灾区，”他对威尔说，一边把几张纸和几本书推到一旁，腾出一小块地方。"],"type":"paragraph"},{"n":2,"t":["\"Be careful,\" Will cautioned his little brother. \"Everything is in chronological order, and I don't want to have to reorganize it.\"","“小心点，”威尔提醒弟弟，“东西都是按时间顺序放的，我可不想重新整理一遍。”"],"type":"paragraph"},{"n":3,"t":["Calvin raised his eyebrows. As far as he could tell, there was no order at all to the papers on the table, but he decided not to mention it to his brother. \"I'm going to ride my bike to the library,\" said Calvin. \"I was going to ask you if you wanted to come along, but it looks like you have your hands full right now.\"","卡尔文扬了扬眉毛。在他看来，桌上的纸根本没什么顺序，不过他决定不跟哥哥提这事。“我要骑车去图书馆，”卡尔文说，“本来还想问你要不要一起去，不过你现在看来忙得脱不开身。”"],"type":"paragraph"},{"n":4,"t":["Will nodded. \"I have a genealogy project due next week. I think I have most of the information I need, but I have to pull it all into some kind of cohesive story.\"","威尔点点头。“我的家谱研究作业下周就得交。需要的资料我大概找得差不多了，但我还得把这些资料串成一个连贯的故事。”"],"type":"paragraph"},{"n":5,"t":["\"What's genealogy?\" asked Calvin, sliding his backpack onto his shoulders.","“什么是家谱研究？”卡尔文问着，把背包带滑到肩上。"],"type":"paragraph"},{"n":6,"t":["\"It's the study of your family's history and roots,\" explained Will. \"Haven't you noticed how busy I've been for the last couple of weeks? I've been researching this project for days. The Internet has been pretty helpful in finding names, birth records, and obituaries. I've also interviewed a lot of our older relatives over the phone. There are things that they remember that I wouldn't have been able to find anywhere else. That's part of the reason this project is so important,\" he said. \"I don't want our family's history to get lost. If I record it, it will exist for our great-great-grandkids.\"","“就是研究你的家族历史和根源。”威尔解释说，“你没注意过去几个星期我有多忙吗？这个项目我已经查了好几天。网上查名字、出生记录和讣告，还挺有帮助的。我也打电话采访了很多年长的亲戚。他们记得的有些事，换个地方我肯定找不到。这就是为什么我觉得这个项目这么重要，”他说，“我不想让我们家的历史失传。把它记下来，我们的玄孙辈就还能看到它。”"],"type":"paragraph"},{"n":7,"t":["Calvin peered over his brother's shoulder and pointed to the family tree that Will had sketched on an oversized piece of paper. \"Is this mom's side of the family?\" he asked.","卡尔文从哥哥肩头往下看，指着威尔在一张大纸上草草画出的家谱。“这是妈妈那边的家人吗？”他问。"],"type":"paragraph"},{"n":8,"t":["Will nodded. \"I don't have as much information about her side as I do about Dad's. The interesting thing is that I can't read some of the letters I found.\"","威尔点点头。“我找到妈妈那边的资料没有爸爸那边多。有意思的是，我找到的一些信还读不懂。”"],"type":"paragraph"},{"n":9,"t":["Calvin looked confused. \"Is the handwriting really bad, or are they written in another language?\"","卡尔文一脸困惑。“是字写得实在太潦草，还是用别的语言写的？”"],"type":"paragraph"},{"n":10,"t":["\"Mom and I looked at them together, and as far as we can tell, they are written in Gullah. Mom's family was originally from Africa, but for the last 200 years, they have lived on the islands off the coast of South Carolina. Some people there still speak Gullah, which is a mix of English and different African languages. Mom even thinks that a couple of our distant relations might still live there.\"","“妈妈和我一起看过。照我们看，那些信是用古拉语写的。妈妈的家族原来来自非洲，但过去200年一直住在南卡罗来纳州海岸附近的岛上。那里有些人还说古拉语，它融合了英语和多种非洲语言。妈妈还觉得，可能有几个远亲仍住在那里。”"],"type":"paragraph"},{"n":11,"t":["\"Wow,\" said Calvin, pulling up a chair next to his brother. \"How are you going to find out what the letters say?\"","“哇，”卡尔文说着拉了把椅子坐到哥哥身边，“那你怎么弄懂信上写了什么？”"],"type":"paragraph"},{"n":12,"t":["\"I don't think I'll have time to do it before this project is due,\" said Will, \"but I've found a few online Gullah dictionaries that will help me translate them. Mom also said we might be able to take a family trip to South Carolina this summer.\"","“作业交之前，我觉得是来不及了，”威尔说，“不过我找到了几部在线古拉语词典，可以帮助我翻译这些信。妈妈还说，我们一家今年夏天也许能去南卡罗来纳州走一趟。”"],"type":"paragraph"},{"n":13,"t":["\"Genealogy is a lot more interesting than it sounds,\" said Calvin. \"Can I help you with this?\"","“家谱研究可比听起来有意思多了，”卡尔文说，“我能帮你一起做吗？”"],"type":"paragraph"},{"n":14,"t":["Will laughed. \"I thought you'd never ask!\"","威尔笑了。“我还以为你永远都不会开口问呢！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Where did Will get the information for his research?\n\n________","威尔从哪里得到研究所需的资料？"],"ans":["from the internet and from phone interviews with older relatives","从网上查找，也打电话采访了年长的亲戚。"]},{"n":2,"ask":["Why does Will feel that researching his family’s history is important?\n\n________","威尔为什么觉得研究自己家族的历史很重要？"],"ans":["He doesn't want his family's history to be lost.","他不想让家族的历史失传。"]},{"n":3,"ask":["How long has the boys’ extended family lived on the South Carolina Sea Islands?\n\n________","兄弟俩的大家族在南卡罗来纳州的海岸群岛上生活了多久？"],"ans":["for the past 200 years","过去200年。"]},{"n":4,"ask":["Do you think that Will and Calvin will continue to be interested in their family’s history even after Will’s project is complete? Explain.\n\n________\n\n________","你认为威尔的作业完成以后，他和卡尔文还会对家族历史感兴趣吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":5,"ask":["to be busy ________","写出表示“很忙”的习语。"],"ans":["it looks like you have your hands full","It looks like you have your hands full.（你看来忙得脱不开身。）"],"dir":["Write the idiom from paragraph 3 on the line next to its meaning.","把第3段中的习语写在相应释义旁的横线上。"]},{"n":6,"ask":["________","找出第1段的暗喻。"],"ans":["This table is a disaster area.","This table is a disaster area.（这张桌子简直是灾区。）"],"dir":["Find the metaphor in paragraph 1, and write it on the line.","找出第1段的暗喻，把它写在横线上。"]},{"n":7,"ask":["What are the names of Katie and Sam’s parents?\n\n________","凯蒂和山姆的父母叫什么名字？"],"ans":["James and Sara","詹姆斯和萨拉。"],"fig":true,"dir":["Use the family tree below to answer the questions that follow.","根据下面的家谱回答接下来的问题。"]},{"n":8,"ask":["What is Robin’s sister’s name?\n\n________","罗宾的姐妹叫什么名字？"],"ans":["Cicely","西塞莉。"]},{"n":9,"ask":["What is Damon’s grandfather’s name?\n\n________","戴蒙的祖父叫什么名字？"],"ans":["Frank","弗兰克。"]},{"n":10,"ask":["Tell one interesting fact you know about your family tree. If you don’t know any, how could you find out?\n\n________","说出一件你知道的、有关家谱的趣事。如果你一件也不知道，可以怎样查到？"],"ans":["Answers will vary.","答案因人而异。"]}],"fig":{"kind":"family","page":"P147","title":["Family tree","家谱"],"headers":[["Parents","父母"],["Children","子女"]],"rows":[{"n":"f0","cells":[["Frank + Margaret","弗兰克、玛格丽特"],["Cicely, Robin","西塞莉、罗宾"]]},{"n":"f1","cells":[["Arthur + Jean","阿瑟、琼"],["Doug, James","道格、詹姆斯"]]},{"n":"f2","cells":[["Cicely + Tom","西塞莉、汤姆"],["Damon","戴蒙"]]},{"n":"f3","cells":[["Robin + Doug","罗宾、道格"],["Madeline, Campbell","玛德琳、坎贝尔"]]},{"n":"f4","cells":[["James + Sara","詹姆斯、萨拉"],["Katie, Sam","凯蒂、山姆"]]}]}},{"id":"P148","title":["A Slice of Sea Island Life","海岸群岛生活一瞥"],"lead":["Have you ever heard of the Gullah people of the southeastern United States?","你听说过美国东南部的古拉人吗？"],"exercise":"P149","genre":"文化说明文","family":"info","parts":[{"n":1,"t":["If you look at a map of the southeastern United States, you will see a string of islands that runs along the coast of South Carolina, Georgia, and northern Florida. These islands are often called the *Sea Islands*. On the map, they probably appear no different than anywhere else in the country. But if you were to visit the islands, you would discover a unique culture and way of life that have been preserved for more than a century.","看一看美国东南部的地图，你会看到一串岛屿沿南卡罗来纳州、佐治亚州和佛罗里达州北部的海岸延伸。这些岛通常叫海岸群岛。在地图上，它们可能和美国其他地方看不出什么差别。但要是亲自去看看，你会发现那里有一种独特的文化和生活方式，已经延续了一百多年。"],"type":"paragraph"},{"n":2,"t":["The name *Gullah* refers to both a group of people and a language. Many Africans were brought to America against their will to work on southern plantations. They harvested cotton and rice, among many other crops, as well as cared for the families of the plantation owners.","“古拉”既指一群人，也指一种语言。许多非洲人被强行带到美国，在南方种植园劳动。他们收割棉花、稻米等多种作物，还照料种植园主的家人。"],"type":"paragraph"},{"n":3,"t":["When the Civil War ended in 1865, the slaves were freed or abandoned. Many stayed to live and work in the area. Because the islands were accessible only by boat, the people were isolated from mainstream culture. The customs and traditions they brought with them from Africa remained largely unchanged for many years.","1865年美国内战结束后，被奴役的人获得自由，或被种植园主抛弃。许多人留下来，在当地生活和工作。因为这些岛只能坐船抵达，当地人与主流文化隔离。他们从非洲带来的习俗和传统一连多年基本没变。"],"type":"paragraph"},{"n":4,"t":["The Gullah language evolved as a way for people who didn’t speak the same language to communicate with one another. It is a combination of many West African languages mixed with English. An English speaker would be able to pick out familiar words here and there, but you probably would not understand most of what was being said.","古拉语逐渐形成，让说不同语言的人能够相互交流。它把多种西非语言和英语融合到一起。说英语的人可以偶尔听出几个熟悉的词，却可能听不懂别人说的大部分内容。"],"type":"paragraph"},{"n":5,"t":["For many years, it seemed as though the Gullah language was in danger of dying out, as the culture became more influenced by the culture of the rest of the United States. However, historical preservationists have been recently recording people speaking the language, as well as compiling dictionaries of various words and their meanings and pronunciation. They are doing their best to insure that the language is preserved for future generations.","多年来，古拉文化越来越受到美国其他地区文化的影响，古拉语似乎有消失的危险。不过，近来致力于历史文化保护的人一直在录下人们说古拉语，还在编词典，收录不同的古拉语词汇及其含义和读音。他们尽最大努力把这种语言留给后代。"],"type":"paragraph"},{"n":6,"t":["The Gullah language isn’t the only unique aspect of the native Sea Islanders. They have many traditions that are an important part of their culture. For example, the art of basket weaving has been passed down for many generations. A native grass that grows near the ocean, called sweetgrass, is used by the Gullah to create beautiful handmade baskets. The grass is coiled and then sewn together using a needle made from a spoon handle, bone, or nail.","古拉语只是海岸群岛当地居民的独特之处之一。他们还有许多传统，是自身文化的重要组成部分。例如，编篮子的技艺已经传了许多代。古拉人用长在海边的一种本地草，也就是甜草，手工制作漂亮的篮子。他们把草一圈圈盘起来，再用勺柄、骨头或钉子做成的针把它缝在一起。"],"type":"paragraph"},{"n":7,"t":["Fish nets are also traditionally handmade in the Gullah culture. Fishing has been an essential part of life in the Sea Islands for many years. Fishermen knitted their own nets by hand using a needle made of palmetto wood, in a tradition carried over from West Africa. It is less common to see these handmade nets today, but some fishermen preserve the craft so that it remains a part of life on the islands.","古拉文化中，渔网传统上也是手工编织的。多年来，捕鱼一直是海岸群岛生活不可缺少的一部分。渔民用棕榈木做成的针，亲手编织自己的渔网。这项传统是从西非传过来的。今天，手织的渔网没那么常见了，但有些渔民还保留这门手艺，让它继续留在岛上的生活里。"],"type":"paragraph"},{"n":8,"t":["Today, you can still see the influence of the past in the South Carolina Sea Islands. The beauty of the Gullah people’s way of life still exists, and it brings a wonderful local flavor and color to the area. As interest and awareness in this historical culture grows, so does the chance that it will survive for future generations to appreciate.","今天，在南卡罗来纳州的海岸群岛上，仍能看见历史留下的影响。古拉人美好的生活方式依然存在，给这里增添了鲜明的地方风情。随着更多人关注和了解这种传承已久的文化，它也更有可能留存下来，让后代有机会欣赏。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Where are the Sea Islands located?\n________","海岸群岛位于哪里？"],"ans":["Along the coast of South Carolina, Georgia, and northern Florida","在南卡罗来纳州、佐治亚州和佛罗里达州北部的沿海。"]},{"n":2,"ask":["Why did the Gullah language evolve?\n________","古拉语为什么逐渐形成？"],"ans":["so that people who didn’t speak the same language could communicate with one another","为了让说不同语言的人可以相互交流。"]},{"n":3,"ask":["Name two Gullah traditions that are still practiced today.\n________","说出两项今天仍有人实践的古拉传统。"],"ans":["basket weaving and fish net knitting","编篮子和织渔网。"]},{"n":4,"ask":["What is one reason the African customs of the Gullah people remained unchanged for so long?\n________","古拉人的非洲习俗为何能保持那么久、变化很少？说出一个原因。"],"ans":["The islands were isolated from the mainland for many years.","这些岛屿与大陆隔离了许多年。"]},{"n":5,"ask":["Do you think it is important for the Gullah heritage and way of life to be preserved? Explain.\n________","你觉得保存古拉人的文化遗产和生活方式重要吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":6,"ask":["What do you think the author’s purpose was for writing this selection?\n________","你认为作者写这篇文章的目的是什么？"],"ans":["Answers will vary. Possible answer: To inform the reader about the Gullah people.","答案因人而异。示例：向读者介绍古拉人。"]},{"n":7,"ask":["Historically, the Gullah have been ________ craftspeople.\n\n- cultural\n- talented\n- preserving","一直以来，古拉人的手工艺人有什么特点？\ncultural（与文化有关的）\ntalented（有才华的）\npreserving（保存的）"],"ans":["talented","talented（有才华的）。"],"dir":["Circle the word that best completes each sentence below.","圈出最适合填入下列各句的词语。"]},{"n":8,"ask":["In today’s world, the Gullah culture is a(n) ________ snapshot of the past.\n\n- unreasonable\n- temporary\n- unique","在今天的世界，古拉文化是过去的一幅怎样的缩影？\nunreasonable（不合理的）\ntemporary（短暂的）\nunique（独特的）"],"ans":["unique","unique（独特的）。"]},{"n":9,"ask":["On the lines below, write a summary for paragraph 5.\n________","概括第5段的内容。"],"ans":["Possible answer: For a while, the Gullah language seemed to be dying out, but people have been working to preserve it.","示例：古拉语一度似乎快要消失了，但人们一直在努力保护它。"]}]},{"id":"P150","title":["The Art of the Islands","海岛的艺术"],"lead":["What inspires Gullah artist Jonathan Green?","古拉艺术家乔纳森·格林从哪里得到灵感？"],"exercise":"P151","genre":"人物传记","family":"info","parts":[{"n":1,"t":["If you have ever seen the art of Jonathan Green, it is not likely that you will soon forget it. His paintings are bold and colorful, lively and cheerful. Green depicts a way of life that is rapidly disappearing. It is a way of life that he remembers with fondness from his childhood in the South Carolina Sea Islands.","如果你见过乔纳森·格林的画，大概不会很快忘掉。格林的画色彩鲜明大胆，画面充满活力，令人愉快。格林描绘的是一种正在迅速消失的生活方式。他在南卡罗来纳州的海岸群岛度过童年，对那时的生活怀有温暖的回忆。"],"type":"paragraph"},{"n":2,"t":["Jonathan Green was born in 1955 in Gardens Corner, South Carolina, a region of the state known as the Low Country. The second of seven children, Green was raised by his maternal grandmother, Eloise Stewart Johnson. As he grew up, he was immersed in Gullah culture—a culture that placed great value on tradition, family, and community. Although Green had to travel to other parts of the world before he could fully appreciate his rich heritage, the basic elements of his culture eventually found their way into his unique form of artistic expression.","乔纳森·格林1955年出生于南卡罗来纳州的加登斯科纳，那一带在州内被称为低地地区。格林在七个孩子中排行第二，由外祖母埃洛伊丝·斯图尔特·约翰逊抚养。他从小深受古拉文化熏陶，这种文化非常看重传统、家庭和社区。格林走过世界其他地方以后，才充分体会到自己的文化遗产有多丰富。后来，古拉文化的基本元素逐渐进入他独特的艺术创作。"],"type":"paragraph"},{"n":3,"t":["After Green graduated from high school, he joined the military. It seemed like a good opportunity for him to see the world and to receive an education. When he completed his military service, Green attended the Art Institute of Chicago. While he was in school, he worked part-time as a security guard at an art museum. This allowed him to study the work of the masters. He imitated their work at first, learning what made them so well respected. Then, Green found his own style and direction and began painting South Carolina’s Gullah Islands, the world he knew best.","高中毕业后，格林参了军。在他看来，这是见见世面并接受教育的好机会。服完兵役后，格林进入芝加哥艺术学院学习。在校期间，他在一家美术馆兼职做保安，因此可以仔细研究艺术大师们的作品。起初，他临摹这些作品，体会它们为什么如此受人推崇。随后，他找到了自己的风格和方向，开始画南卡罗来纳州的古拉群岛，也就是自己最熟悉的世界。"],"type":"paragraph"},{"n":4,"t":["Jonathan Green’s artwork is filled with everyday images of Gullah life as he remembered it growing up. His paintings show people hanging laundry out to dry, picking oysters, telling stories, and attending weddings and funerals. Water is found in many of his paintings because it plays an important role in the lives of people who live along the coast and on the islands.","乔纳森·格林的画里到处是他成长过程中记得的古拉人日常生活场景。画里的人晾晒衣服、采牡蛎、讲故事、参加婚礼和葬礼。他的许多画里都有水，因为对沿海和岛上的人来说，水在生活中很重要。"],"type":"paragraph"},{"n":5,"t":["Human beings are also found in nearly all of Green’s work, indicating the importance of family and community to the culture. The faces of the people in his paintings are usually without features. This can be interpreted as Green’s way of showing how the everyday lives and experiences of people are universal.","格林几乎每一幅画里也都有人，这说明家庭与社区在古拉文化中的重要性。画中人物的脸上往往没有五官。可以把这理解为格林在用自己的方式表现：不同人的日常生活和经历都有相通之处。"],"type":"paragraph"},{"n":6,"t":["The Gullah way of life is changing as children grow up and move away to larger towns and cities. The Gullah dialect is disappearing with the older generations. Even the landscape of the islands is changing, as condominiums, malls, and fast-food restaurants begin to take over. Jonathan Green knows that his artwork cannot change what is happening to the area where he grew up. But his paintings can raise awareness of what is in danger of being lost and preserve the memories of a rich and colorful way of life.","随着孩子们长大，迁到更大的城镇和城市，古拉人的生活方式正在改变。古拉方言也随着老一辈人逐渐消失。公寓楼、购物中心和快餐店开始向岛上扩张，连岛上的景观也在变化。乔纳森·格林知道，艺术无法改变他成长的地方正在发生的事。然而，他的画可以让更多人意识到什么正在流失，也可以把这种丰富多彩的生活方式留在人们的记忆里。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the words that best describe Jonathan Green.\n\n- ________ athletic\n- ________ artistic\n- ________ talkative\n- ________ creative\n- ________ caring","勾选最能形容乔纳森·格林的词语。\n擅长运动的\n有艺术才华的\n爱说话的\n有创意的\n有爱心的"],"ans":["- ✓ artistic\n- ✓ creative\n- ✓ caring","有艺术才华的、有创意的、有爱心的。"]},{"n":2,"ask":["Check the word that best describes what type of selection this is.\n\n- ________ autobiography\n- ________ fiction\n- ________ biography","勾选最能概括本文体裁的一项。\n自传\n虚构作品\n传记"],"ans":["- ✓ biography","传记。"]},{"n":3,"ask":["Do you think Jonathan Green will continue making paintings of his Gullah heritage? Why or why not?\n\n________\n\n________","你认为乔纳森·格林还会继续画表现古拉文化遗产的画吗？为什么？"],"ans":["Answers will vary.","答案因人而异。"]},{"n":4,"ask":["Name two things that frequently appear in Green’s paintings.\n\n________","说出在格林的画里经常出现的两样东西。"],"ans":["human figures and water","人物和水。"]},{"n":5,"ask":["Which of the following would be the most likely subject of one of Green’s paintings?\n\n- ________ a realistic portrait of a mother and child\n- ________ the skyline of a city at night\n- ________ fishermen hauling in their nets","下列哪一项最可能成为格林的一幅画的题材？\n一对母子的写实肖像\n夜晚城市建筑的轮廓线\n正在收网的渔民"],"ans":["- ✓ fishermen hauling in their nets","正在收网的渔民。"]},{"n":6,"ask":["How many children were there in Green’s family?\n\n________","格林家里有几个孩子？"],"ans":["7","7个。"]},{"n":7,"ask":["Why do you think that Green had to go away in order to be able to appreciate his culture and heritage?\n\n________\n\n________","你认为格林为什么要离开家乡，才能体会自己文化和传统的价值？"],"ans":["Answers will vary.","答案因人而异。"]},{"n":8,"ask":["Do you think that artwork can help preserve a culture? Explain.\n\n________\n\n________","你认为艺术作品能帮助保存一种文化吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]}]}],"questions":[{"id":"R6-P002-A1-01","skill":"A1","pages":["P002"],"src":null,"stem":["What is the main idea of this story?","这个故事主要讲了什么？"],"o":[["Mrs. Ito explains the rule about foreign players in Japan.","伊藤太太解释了日本关于外籍球员的规定。"],["Alex and Emily discover familiar and different parts of Japanese baseball and enjoy the experience.","两个孩子发现日本棒球既有熟悉之处，也有不同之处，而且很享受这次经历。"],["Emily decides to become a professional baseball player in Tokyo.","艾米莉决定在东京做职业棒球运动员。"],["Baseball in Japan is completely different from baseball in the United States.","日本棒球和美国棒球完全不同。"]],"key":1,"why":["The story follows Alex and Emily at their first Japanese baseball game. Its main idea includes what they find familiar, what they find different about the cheering and food, and how much they enjoy the experience.","文章围绕兄妹第一次观看日本棒球比赛展开，介绍熟悉的比赛、不同的助威和食物，以及两人的喜爱。中心思想应同时覆盖经历与感受。"],"ev":[{"p":"P002","n":11,"quote":"That’s just one of the differences between American and Japanese baseball culture."},{"p":"P002","n":12,"quote":"The game itself didn’t seem much different at all from the American baseball games they had attended."},{"p":"P002","n":17,"quote":"I wish we could go to JBall games at home, too,"}]},{"id":"R6-P002-B1-01","skill":"B1","pages":["P002"],"src":1,"stem":["Why were the Godfreys in Japan?","戈弗雷一家为什么来日本？"],"o":[["To compete in a baseball tournament.","参加棒球锦标赛。"],["To work at a Japanese baseball stadium.","到日本的棒球场工作。"],["To buy a professional baseball team.","买下一支职业棒球队。"],["To visit Mrs. Godfrey’s old college roommate.","探望戈弗雷太太以前的大学室友。"]],"key":3,"why":["Paragraph 1 says they were there to visit Mrs. Godfrey’s college roommate. The baseball game was one activity during their trip.","定位第 1 段的 They were there to visit…，college roommate 是到访原因；看棒球是旅行期间的一项活动。"],"ev":[{"p":"P002","n":1,"quote":"They were there to visit their mother’s old college roommate, who had moved to Japan after college to teach English."}]},{"id":"R6-P002-B2-01","skill":"B2","pages":["P002"],"src":3,"stem":["Which statement correctly compares American and Japanese baseball in the story?","哪项准确比较了文中的美国棒球和日本棒球？"],"o":[["The game itself is similar, but Japanese games have male cheerleaders.","比赛本身相似，但日本棒球赛有男子啦啦队。"],["The rules are completely different, but the cheerleaders are the same.","规则完全不同，但啦啦队一样。"],["Only American games allow any foreign players.","只有美国的比赛允许外籍球员上场。"],["Japanese games never sell snacks that Americans know.","日本球场从来不卖美国人熟悉的小吃。"]],"key":0,"why":["The game itself is similar in both countries. One difference is that the Japanese game has male cheerleaders.","比较需要同时核对“相同”和“不同”两边。原文说比赛本身差别不大，而日本球场有男性拉拉队。"],"ev":[{"p":"P002","n":11,"quote":"I forget that Americans don’t have cheerleaders for baseball games."},{"p":"P002","n":11,"quote":"It also probably seems unusual that they’re all men."},{"p":"P002","n":12,"quote":"The game itself didn’t seem much different at all from the American baseball games they had attended."}]},{"id":"R6-P002-C1-01","skill":"C1","pages":["P002"],"src":null,"stem":["As used in paragraph 12, “engrossed” most nearly means:","第 12 段的 engrossed 最接近哪个意思？"],"o":[["deeply interested and absorbed","很感兴趣，完全沉浸其中"],["confused about where they were","不知道自己身在何处"],["angry with the players","在生球员的气"],["too tired to watch the game","太累了，看不了比赛"]],"key":0,"why":["The children become engrossed when the game begins, and the ending confirms their enjoyment. They are absorbed in the action and only feel tired after the game.","把词放回比赛开始后的情境，并联系结尾的喜爱，engrossed 表示注意力被吸引、看得很投入。不要把赛后 tired 当成观看时的状态。"],"ev":[{"p":"P002","n":12,"quote":"Once the game began, Emily and Alex became quickly engrossed."},{"p":"P002","n":17,"quote":"I wish we could go to JBall games at home, too,"}]},{"id":"R6-P004-A1-01","skill":"A1","pages":["P004"],"src":1,"stem":["Which sentence best states the main idea of the passage?","哪句话最能概括文章主旨？"],"o":[["Although baseball is thought of as an American sport, there are many fans and talented players of Japanese baseball, or yakyuu.","虽然棒球常被认为是一项美国运动，但日本棒球 yakyuu 也有许多球迷和有才华的球员。"],["American teams toured Japan in the early 1900s and played exhibition games against local amateurs.","20 世纪初，美国球队到日本巡回比赛，与当地业余球队进行表演赛。"],["Horace Wilson brought baseball to Japan in the 1870s.","19 世纪 70 年代，霍勒斯·威尔逊把棒球带到了日本。"],["Japanese baseball players win every game against American teams.","日本球员赢下了与美国球队交手的每一场比赛。"]],"key":0,"why":["The passage covers how baseball developed in Japan, how popular it became, and what its players achieved. The introduction of baseball and the exhibition tours are individual details.","全文介绍棒球在日本的发展、受欢迎的程度及球员成就。正确概括应覆盖多段，不能只选引入棒球或巡回比赛的一个细节。"],"ev":[{"p":"P004","n":1,"quote":"In fact, baseball’s popularity in Japan rivals its popularity here in the United States."},{"p":"P004","n":6,"quote":"From 1965 through 1973, the Giants won nine consecutive national championships, partly because of the legendary player Sadahara Oh."},{"p":"P004","n":7,"quote":"Japanese professional players have also come to the United States and played in Major League Baseball, setting records here as well."}]},{"id":"R6-P004-E1-01","skill":"E1","pages":["P004"],"src":3,"stem":["What is the author’s main purpose in writing “Yakyuu”?","作者写《日本的棒球》的主要目的是什么？"],"o":[["To entertain readers with an imaginary baseball adventure.","用一段虚构的棒球奇遇娱乐读者。"],["To persuade Americans to stop watching baseball.","说服美国人不再看棒球。"],["To inform readers about the development and popularity of baseball in Japan.","介绍棒球在日本的发展及其受欢迎的程度。"],["To give step-by-step instructions for playing baseball.","分步骤说明棒球怎么打。"]],"key":2,"why":["The author informs readers by tracing the history of Japanese baseball and describing the accomplishments of its teams and players.","作者按历史进程介绍日本棒球，并用球队和球员成就补充说明，主要目的是 inform。注意“介绍发展”不同于“逐步教人怎么玩”。"],"ev":[{"p":"P004","n":2,"quote":"In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students."},{"p":"P004","n":5,"quote":"Because baseball had become an important part of Japanese culture, professional teams reformed after the war."},{"p":"P004","n":7,"quote":"Japanese professional players have also come to the United States and played in Major League Baseball, setting records here as well."}]},{"id":"R6-P004-B2-01","skill":"B2","pages":["P004"],"src":2,"stem":["Which sequence puts these events in the correct order?","哪一项按正确顺序排列了这些事件？"],"o":[["Wilson introduces baseball → World War II interrupts games → Ruth and Gehrig visit → the Giants win nine championships","威尔逊介绍棒球 → 二战使比赛中断 → 鲁思和格里格访日 → 巨人队夺得九次冠军"],["Ruth and Gehrig visit → Wilson introduces baseball → World War II interrupts games → the Giants win nine championships","鲁思和格里格访日 → 威尔逊介绍棒球 → 二战使比赛中断 → 巨人队夺得九次冠军"],["Wilson introduces baseball → Ruth and Gehrig visit → the Giants win nine championships → World War II interrupts games","威尔逊介绍棒球 → 鲁思和格里格访日 → 巨人队夺得九次冠军 → 二战使比赛中断"],["Wilson introduces baseball → Ruth and Gehrig visit → World War II interrupts games → the Giants win nine championships","威尔逊介绍棒球 → 鲁思和格里格访日 → 二战使比赛中断 → 巨人队夺得九次冠军"]],"key":3,"why":["Wilson introduced baseball in the 1870s, Ruth and Gehrig visited in the 1930s, World War II interrupted the game, and the Giants won nine straight championships from 1965 through 1973.","把事件与原文时间对应，再排序：1870s 引入 → 1930s 美国球星来访 → 二战中断 → 1965–1973 年九连冠。"],"ev":[{"p":"P004","n":2,"quote":"In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students."},{"p":"P004","n":4,"quote":"Top American baseball stars like Babe Ruth and Lou Gehrig came to Japan in the 1930s and played against the top Japanese college teams."},{"p":"P004","n":5,"quote":"Like so many other things around the world, World War II interrupted Japanese baseball when almost all of the players became soldiers."},{"p":"P004","n":6,"quote":"From 1965 through 1973, the Giants won nine consecutive national championships, partly because of the legendary player Sadahara Oh."}]},{"id":"R6-P004-B1-01","skill":"B1","pages":["P004"],"src":5,"stem":["Why did Japanese leaders embrace baseball?","日本领导人为什么欢迎棒球？"],"o":[["It required no mental competition.","这项运动完全不需要心理较量。"],["It included elements that were already part of Japanese culture.","这项运动包含日本文化中原本就有的元素。"],["They wanted all students to move to America.","他们想让所有学生都搬到美国。"],["Every Japanese team had already won an international championship.","日本每支球队当时都已获得国际冠军。"]],"key":1,"why":["Paragraph 2 uses because to explain that baseball included familiar elements of Japanese culture. The comparison to martial arts illustrates the connection.","回到第 2 段的 because，作者直接说明棒球包含日本文化中已有的要素；后面的武术比较是在解释这个原因。"],"ev":[{"p":"P004","n":2,"quote":"Japanese leaders also embraced baseball because they thought that it contained elements that were already part of Japanese culture."},{"p":"P004","n":2,"quote":"For instance, baseball’s focus on the mental competition between pitcher and hitter was similar to the one-on-one competitions of martial arts."}]},{"id":"R6-P004-B4-01","skill":"B4","pages":["P004"],"src":null,"stem":["Which sentence most directly supports the statement “Baseball is widely popular in Japan”?","哪一句最直接支持“棒球在日本广受欢迎”这一说法？"],"o":[["In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students.","19 世纪 70 年代初，居住在东京的美国教授霍勒斯·威尔逊把棒球介绍给了自己的学生。"],["The surname Oh means king, and he certainly was the king of baseball in Japan.","“王”这个姓有“君王”的意思，他也的确是日本的棒球之王。"],["In fact, baseball’s popularity in Japan rivals its popularity here in the United States.","事实上，棒球在日本受欢迎的程度足以和美国相比。"],["Like so many other things around the world, World War II interrupted Japanese baseball when almost all of the players became soldiers.","和世界上许多其他活动一样，日本棒球也因第二次世界大战而中断，因为几乎所有球员都参了军。"]],"key":2,"why":["The sentence directly compares baseball’s popularity in Japan with its popularity in the United States, providing the most direct support.","先明确要证明的是“广受欢迎”，再找直接表达 popularity 的句子。相关的历史细节也谈棒球，但与目标结论的连接不如这句直接。"],"ev":[{"p":"P004","n":1,"quote":"In fact, baseball’s popularity in Japan rivals its popularity here in the United States."}]},{"id":"R6-P004-C1-01","skill":"C1","pages":["P004"],"src":null,"stem":["In paragraph 3, “equivalent to” most nearly means:","第 3 段的 equivalent to 最接近哪个意思？"],"o":[["completely unrelated to","与……完全无关"],["always less exciting than","总是没有……那么让人兴奋"],["the opposite of","与……相反"],["similar in degree to","与……程度相近"]],"key":3,"why":["Here equivalent to means comparable in degree. The sentence compares the levels of enthusiasm for college sports in the two countries.","句子把两国大学体育的热情并列比较，equivalent to 表示程度相当。这里比较的是 enthusiasm / excitement，而不是声称两种运动的规则相同。"],"ev":[{"p":"P004","n":3,"quote":"To this day, the enthusiasm for college baseball in Japan is equivalent to the excitement people have for college football or college basketball’s March Madness in the United States."}]},{"id":"R6-P006-A1-01","skill":"A1","pages":["P006"],"src":null,"stem":["What is this story mainly about?","这个故事主要讲了什么？"],"o":[["The family learns every rule of a professional baseball game.","一家人学会了职业棒球比赛的每条规则。"],["Emily teaches the chef a new way to prepare sushi.","艾米莉教厨师一种做寿司的新方法。"],["Alex and Emily try Japanese food, and both discover that they enjoy sushi.","两个孩子尝了日本食物，发现自己都喜欢寿司。"],["Alex refuses to eat anything unfamiliar.","亚历克斯什么陌生食物都不肯吃。"]],"key":2,"why":["The story begins with the children’s different attitudes toward unfamiliar foods and ends with both of them enjoying sushi.","故事以兄妹对新食物的不同态度开始，以两人都喜欢寿司结束。正确主旨需要覆盖人物、主要经历和结果。"],"ev":[{"p":"P006","n":1,"quote":"Alex loved to try new foods."},{"p":"P006","n":2,"quote":"Emily wasn’t as confident as Alex was about trying new foods."},{"p":"P006","n":19,"quote":"No one at the table was surprised to learn that Alex loved the sushi."},{"p":"P006","n":21,"quote":"I love it,"}]},{"id":"R6-P006-F2-01","skill":"F2","pages":["P006"],"src":6,"stem":["How are Alex and Emily different at the beginning of the story?","故事开头，亚历克斯和艾米莉有什么不同？"],"o":[["Alex is eager to try unfamiliar food, while Emily is more cautious.","亚历克斯迫不及待地想尝陌生食物，艾米莉则更谨慎。"],["Emily will eat anything, while Alex refuses all new foods.","艾米莉什么都吃，亚历克斯却拒绝一切新食物。"],["Alex knows Japanese, while Emily does not.","亚历克斯懂日语，艾米莉不懂。"],["Emily has tried every Japanese dish, while Alex has tried none.","艾米莉尝过每一种日本菜，亚历克斯一种也没尝过。"]],"key":0,"why":["Paragraph 1 shows Alex eager to try new foods. In paragraph 2, Emily wants to know what everything on her plate is and approaches unfamiliar food more cautiously.","人物比较要回到同一维度。第 1 段说 Alex 喜欢尝试新食物，第 2 段说 Emily 希望辨认盘中的东西，表现得更谨慎。"],"ev":[{"p":"P006","n":1,"quote":"Alex loved to try new foods."},{"p":"P006","n":2,"quote":"Emily liked to be able to identify everything on her plate."}]},{"id":"R6-P006-B3-01","skill":"B3","pages":["P006"],"src":10,"stem":["What does Mr. Godfrey mean by “very well-seasoned eaters”?","戈弗雷先生说的 very well-seasoned eaters 是什么意思？"],"o":[["His children now need large amounts of salt on every meal.","他的孩子们现在每顿饭都得加大量的盐。"],["His children have become professional sushi chefs.","他的孩子们已经成了专业的寿司师傅。"],["His children refuse to eat food from other cultures.","他的孩子们不愿吃其他文化的食物。"],["His children are gaining experience with food from different cultures.","他的孩子们尝过的异国食物越来越多，品尝经验也越来越丰富。"]],"key":3,"why":["Well-seasoned is a pun on flavoring and experience. Mr. Godfrey is joking that his children are gaining experience trying different foods.","父亲在两人尝试寿司后开玩笑。well-seasoned 既让人想到食物调味，也可表示经验丰富；此处结合全篇，应理解为兄妹越来越有尝试不同食物的经验。"],"ev":[{"p":"P006","n":19,"quote":"No one at the table was surprised to learn that Alex loved the sushi."},{"p":"P006","n":21,"quote":"I think we’re going to need to find a restaurant at home that serves sushi,"},{"p":"P006","n":22,"quote":"Our kids are turning into very well-seasoned eaters!"}]},{"id":"R6-P006-B1-01","skill":"B1","pages":["P006"],"src":8,"stem":["What holds the ingredients together in a roll of sushi?","寿司卷里，是什么把各种材料裹在一起？"],"o":[["A wooden serving board.","一块木托板。"],["A thin sheet of seaweed.","一张薄薄的海苔。"],["A pair of chopsticks.","一双筷子。"],["A mound of wasabi.","一小堆山葵酱。"]],"key":1,"why":["The chef spreads rice and other ingredients across a sheet of seaweed and rolls everything up inside it. The seaweed holds the ingredients together.","定位制作过程。海苔上放米饭和配料，随后把所有东西卷在海苔里面，所以海苔起包裹作用。"],"ev":[{"p":"P006","n":14,"quote":"They roll everything up inside the seaweed and slices it into little disks."}]},{"id":"R6-P006-F3-01","skill":"F3","pages":["P006"],"src":null,"stem":["How do Emily’s feelings about sushi change during the story?","故事中，艾米莉对寿司的感觉有什么变化？"],"o":[["She begins enthusiastic and becomes angry.","她一开始很兴奋，后来生气了。"],["She remains unwilling to taste any sushi.","她始终不愿尝一口寿司。"],["She begins unsure but ends up enjoying it and wanting to eat it again.","她一开始拿不定主意，最后却喜欢上了寿司，还想再吃。"],["She dislikes sushi at first and then becomes the chef.","她起初不喜欢寿司，后来成了厨师。"]],"key":2,"why":["Emily begins unsure about trying sushi. At the end, she takes another piece and wants to find a sushi restaurant back home.","追踪同一个人物前后的表现。开头的 uncertainly 表明拿不准；结尾她再夹寿司，并提出回家找餐厅，说明从不确定转为喜爱。"],"ev":[{"p":"P006","n":8,"quote":"Emily looked uncertainly at her parents."},{"p":"P006","n":21,"quote":"I love it,"},{"p":"P006","n":21,"quote":"I think we’re going to need to find a restaurant at home that serves sushi,"}]},{"id":"R6-P006-F5-01","skill":"F5","pages":["P006"],"src":5,"stem":["Which type of passage is “Experimental Appetites”?","《尝尝新口味》是哪一种文章？"],"o":[["A scientific report presenting experimental data.","一份列出实验数据的科学报告。"],["A tall tale with impossible, exaggerated events.","一个用不可能发生的夸张情节编成的故事。"],["A recipe giving complete, numbered cooking instructions.","一份用序号列出完整烹调步骤的食谱。"],["A realistic fiction story about a family trying unfamiliar food.","一个描写一家人尝试陌生食物的写实虚构故事。"]],"key":3,"why":["The passage is realistic fiction built around what the characters experience at a restaurant. The dialogue helps tell that story.","原书把本篇归为 fiction。整篇的组织中心是人物在餐厅的经历，而不是实验报告或操作指南。人物对话是叙事线索，但“有对话”本身并不能单独证明一篇文章必然是虚构。"],"ev":[{"p":"P006","n":1,"quote":"Alex and Emily sat at a table with their parents and Mr. and Mrs. Ito."},{"p":"P006","n":21,"quote":"Emily picked up another piece of sushi with her chopsticks."},{"p":"P006","n":22,"quote":"Our kids are turning into very well-seasoned eaters!"}]},{"id":"R6-P008-A1-01","skill":"A1","pages":["P008"],"src":null,"stem":["Which sentence best summarizes the main idea of “Bonsai”?","哪一句最能概括《盆景》的主旨？"],"o":[["Bonsai trees must always come from naturally tiny plants.","盆景一定要用天生矮小的植物。"],["Every bonsai must stay indoors throughout the year.","每盆盆景常年都必须放在室内。"],["All bonsai styles have branches that extend below the pot.","所有造型的盆景，枝条都垂到花盆底部以下。"],["Bonsai is a traditional art of growing and shaping miniature trees that requires care and has cultural importance.","盆景是一门栽培并塑造微型树木的传统艺术，需要悉心照料，也有重要的文化意义。"]],"key":3,"why":["The passage explains what bonsai is, how it is cared for, why it matters culturally, and what styles it takes.","文章介绍盆栽是什么、怎样养护、文化意义以及基本样式。中心思想应把这些内容联系起来，不能只抓一个样式或把常见误解当结论。"],"ev":[{"p":"P008","n":1,"quote":"It refers to the interesting combination of art and cultivation of miniature trees and plants."},{"p":"P008","n":2,"quote":"It takes a great deal of care and patience to achieve this balance."},{"p":"P008","n":3,"quote":"It holds a special and significant place in Japanese culture."}]},{"id":"R6-P008-C1-01","skill":"C1","pages":["P008"],"src":1,"stem":["As used in paragraph 1, what does “cultivation” mean?","第 1 段的 cultivation 是什么意思？"],"o":[["The process of making plastic models of trees.","制作树木塑料模型的过程。"],["The process of growing and caring for plants.","种植和照料植物的过程。"],["The process of buying paintings for a room.","为房间买画的过程。"],["The process of moving a family to a new country.","举家搬迁到另一个国家的过程。"]],"key":1,"why":["Paragraph 1 links cultivation with miniature plants, and paragraph 2 describes pruning, shaping, and care. Cultivation means growing and tending plants.","第 1 段把 cultivation 与 miniature trees and plants 联系起来；第 2 段进一步说明主人要修剪、塑形和照料。词义是“栽培、培育”。"],"ev":[{"p":"P008","n":1,"quote":"It refers to the interesting combination of art and cultivation of miniature trees and plants."},{"p":"P008","n":2,"quote":"The owner must then prune, trim, and shape the plant as it grows so that it resembles, in miniature, a much larger tree."}]},{"id":"R6-P008-B2-01","skill":"B2","pages":["P008"],"src":10,"stem":["How are cascade and semi-cascade bonsai styles similar?","悬崖式和半悬崖式盆景有什么相似之处？"],"o":[["Both have leaves and branches that grow downward toward the base of the plant.","两种的枝叶都向下朝植株根基生长。"],["Both must have perfectly straight trunks.","两种都必须有笔直的树干。"],["Both must extend their leaves below the bottom of the container.","两种的叶子都必须伸到容器底部以下。"],["Both are made only by adding tiny buildings around the tree.","两种都是只靠在树木周围添上小建筑做出来的。"]],"key":0,"why":["Paragraph 6 explains that leaves and branches grow downward in both styles. Only in the cascade style do the leaves extend below the bottom of the container.","先读第 6 段的 similar because，提取共同点；再读 main difference，防止把某一类特有的特征当作共有特征。"],"ev":[{"p":"P008","n":6,"quote":"Cascade and semi-cascade are similar because in both styles the leaves and the branches cascade down toward the base of the plant."},{"p":"P008","n":6,"quote":"The main difference is that in the cascade style, the leaves actually extend below the bottom of the container."}]},{"id":"R6-P008-B1-01","skill":"B1","pages":["P008"],"src":9,"stem":["According to Japanese tradition in the passage, which three elements create a successful bonsai?","按文中介绍的日本传统，做出成功的盆景需要哪三种要素？"],"o":[["Speed, size, and price.","速度、大小、价格。"],["Sunlight, buildings, and rocks.","阳光、建筑、岩石。"],["Truth, goodness, and beauty.","真、善、美。"],["Age, height, and color.","年龄、高度、颜色。"]],"key":2,"why":["Paragraph 3 directly lists the three elements in Japanese tradition: truth, goodness, and beauty.","According to… 是定位细节的提示。第 3 段冒号后直接列出 truth, goodness, and beauty，无需用自己的植物常识替换原文。"],"ev":[{"p":"P008","n":3,"quote":"According to Japanese tradition, three elements are necessary to create a successful bonsai: truth, goodness, and beauty."}]},{"id":"R6-P008-E1-01","skill":"E1","pages":["P008"],"src":11,"stem":["What would be a reader’s main purpose for reading this selection?","读者读这篇文章，主要会是出于什么目的？"],"o":[["To learn information about bonsai and its traditions.","了解盆景及其传统。"],["To enjoy a fictional adventure about a talking tree.","欣赏一段关于会说话的树的虚构奇遇。"],["To follow a complete, numbered guide to building a wooden tray.","按编号步骤的完整指南制作木托盘。"],["To decide which Japanese baseball team to support.","决定支持哪一支日本棒球队。"]],"key":0,"why":["Readers mainly learn about bonsai, its care, and its traditions. The invitation to try growing one follows that explanation.","本题沿用原书“读者为什么阅读这篇文章”的问法。文章主要提供关于盆栽的知识，属于获取信息的阅读目的。结尾鼓励有兴趣的人尝试，仍不改变全文的介绍重点。"],"ev":[{"p":"P008","n":1,"quote":"Bonsai originated in China more than 2,000 years ago."},{"p":"P008","n":5,"quote":"There are five basic styles of bonsai: the formal upright, informal upright, slanting, cascade, and semi-cascade."},{"p":"P008","n":7,"quote":"You will have to do a little research to make sure that you know how to properly care for your plant."}]},{"id":"R6-P008-B5-01","skill":"B5","pages":["P008"],"src":null,"stem":["A bonsai has downward-growing branches, and its leaves extend below the bottom of the container. Which style best matches the description?","一盆盆景的枝条向下生长，叶子垂到容器底部以下。哪种造型最符合这个描述？"],"o":[["Formal upright.","直干式。"],["Cascade.","悬崖式。"],["Semi-cascade.","半悬崖式。"],["Bon-kei.","盆景布置（bon-kei）。"]],"key":1,"why":["Downward growth occurs in both styles. The leaves extending below the bottom of the container identify the cascade style.","把文中的分类定义用于新描述。只看“向下生长”还不能在 cascade 和 semi-cascade 中确定；“低于容器底部”才是本题的关键限定。"],"ev":[{"p":"P008","n":6,"quote":"Cascade and semi-cascade are similar because in both styles the leaves and the branches cascade down toward the base of the plant."},{"p":"P008","n":6,"quote":"The main difference is that in the cascade style, the leaves actually extend below the bottom of the container."}]},{"id":"R6-P010-A1-01","skill":"A1","pages":["P010"],"src":4,"stem":["Which sentence best states the main idea of the passage?","哪句话最能概括文章主旨？"],"o":[["Students should replace all classroom lessons with gardening.","学生应该用园艺活动代替所有课堂课程。"],["All school gardens must grow exactly the same crops.","所有学校的菜园都必须种完全一样的作物。"],["Chez Panisse is a restaurant that serves only middle school students.","谢潘尼斯是一家只接待初中生的餐厅。"],["Alice Waters created a school program in which students grow food and learn to prepare it.","爱丽丝·沃特斯创办了一个校园项目，让学生种植食物，并学习烹制这些食物。"]],"key":3,"why":["The main idea combines the program’s gardening, cooking, and educational goals. The restaurant and individual crops are supporting details.","主旨要同时覆盖种植、烹饪和教育目标。作物名单和餐馆只是细节，原文也没有主张取消课堂。"],"ev":[{"p":"P010","n":2,"quote":"Waters worked with the school's principal, Neil Smith, to create a cooking and gardening program at the school."},{"p":"P010","n":5,"quote":"They have learned how to weed, prune, and harvest."}]},{"id":"R6-P010-C5-01","skill":"C5","pages":["P010"],"src":6,"stem":["In paragraph 2, what does “go hand in hand” mean?","第 2 段的 go hand in hand 是什么意思？"],"o":[["Must be carried by hand.","必须用手搬运。"],["Cannot exist at the same time.","不可能同时存在。"],["Have exactly the same meaning.","意思完全一样。"],["Are closely connected and work together.","联系紧密，彼此配合。"]],"key":3,"why":["Hand in hand means closely connected. The sentence applies the expression to a healthy body and a healthy environment.","这句把健康的身体与健康的环境联系起来。hand in hand 表示密切相关，不是在描述手的动作。"],"ev":[{"p":"P010","n":2,"quote":"She wanted to teach them that a healthy body and a healthy environment go hand in hand."}]},{"id":"R6-P010-F2-01","skill":"F2","pages":["P010"],"src":5,"stem":["Which description best fits Alice Waters?","哪一项最符合爱丽丝·沃特斯的特点？"],"o":[["Stingy and interested only in making money.","很吝啬，一心只想着赚钱。"],["Unfriendly, careless, and unwilling to help.","不友好、粗心，也不愿提供帮助。"],["Indifferent to students and their health.","对学生及其健康漠不关心。"],["Generous, talented, and ambitious.","慷慨、有才华、有抱负。"]],"key":3,"why":["Waters gives her time, brings people together to run the program, and hopes every school will have a garden. Those actions support the three traits.","她投入时间、组织各方帮助并希望每所学校都拥有花园，支持慷慨、有能力、有抱负的评价。"],"ev":[{"p":"P010","n":3,"quote":"The project that Waters began took a lot of time and patience."},{"p":"P010","n":6,"quote":"Alice Waters dreams that one day there will be a garden in every school in the United States."}]},{"id":"R6-P012-F1-01","skill":"F1","pages":["P012"],"src":10,"stem":["Where and when are the students planning their garden?","学生在什么时间、什么地方规划他们的菜园？"],"o":[["In a classroom during a winter morning.","冬天的早晨，在一间教室里。"],["In a cafeteria during a spring lunch.","春天的午餐时间，在一间食堂里。"],["At a picnic table in a park on a fall afternoon.","秋天的下午，在公园的一张野餐桌旁。"],["At a nursery on a summer evening.","夏天的傍晚，在一家苗圃里。"]],"key":2,"why":["The first paragraph places the conversation at a picnic table in a park on an autumn afternoon. Jefferson Middle School is where the students hope to build the garden.","第1段直接交代地点、季节和时段。不要把他们希望建花园的学校误当成此刻讨论计划的地点。"],"ev":[{"p":"P012","n":1,"quote":"Drew, Emilio, and Michi sat at a picnic table in the park on a beautiful, crisp fall afternoon."}]},{"id":"R6-P012-F4-01","skill":"F4","pages":["P012"],"src":null,"stem":["Which description identifies the story’s narrator?","哪项说出了故事的叙述者是谁？"],"o":[["The school principal writes a letter about her memories.","校长写信回忆往事。"],["An outside narrator tells what Drew, Emilio, and Michi do.","一个置身故事之外的叙述者讲述德鲁、埃米利奥和美智的行动。"],["Emilio’s aunt describes her own gardening business.","埃米利奥的姑姑介绍自己的园艺生意。"],["Drew tells the whole story using “I.”","德鲁用“我”讲述整个故事。"]],"key":1,"why":["The narrator describes the three students from outside the story, using their names and they. I appears when individual characters speak.","叙述使用人物姓名和 they，从故事外讲述三人的行动；对话中的 I 属于说话人物，不能据此把整篇判为第一人称。"],"ev":[{"p":"P012","n":1,"quote":"Drew, Emilio, and Michi sat at a picnic table in the park on a beautiful, crisp fall afternoon."},{"p":"P012","n":4,"quote":"Drew opened his notebook and prepared to record any ideas they had for convincing Ms."}]},{"id":"R6-P012-C5-01","skill":"C5","pages":["P012"],"src":9,"stem":["What does “get this project up and running” mean?","get this project up and running 是什么意思？"],"o":[["Get the project started and working.","让项目启动并运转起来。"],["Stop the project before it begins.","项目还没开始就叫停。"],["Move the garden onto the roof.","把菜园搬到屋顶上。"],["Make the students compete in a race.","让学生们赛跑。"]],"key":0,"why":["The students are discussing how to raise funds so the garden project can get started and begin operating.","这里讨论筹款启动花园项目，up and running 表示开始运作，不是字面上的跑步。"],"ev":[{"p":"P012","n":6,"quote":"“We might need donations to get this project up and running,” added Michi."}]},{"id":"R6-P014-E1-01","skill":"E1","pages":["P014"],"src":7,"stem":["What is the main purpose of this selection?","本文的主要目的是什么？"],"o":[["To persuade readers never to eat vegetables.","说服读者永远别吃蔬菜。"],["To describe the history of Italian restaurants.","介绍意大利餐厅的历史。"],["To tell a fictional adventure about a chef.","讲一段关于厨师的虚构奇遇。"],["To explain how to prepare garden lasagna.","说明怎样做田园蔬菜千层面。"]],"key":3,"why":["The list of ingredients and utensils and the ordered steps explain how to make garden lasagna.","材料、器具和按顺序排列的操作步骤共同服务于制作一道菜，属于指导性实用文本。"],"ev":[{"p":"P014","n":2,"quote":"Cook the noodles in boiling water for 8 to 10 minutes, stirring occasionally."},{"p":"P014","n":7,"quote":"Cover the dish with foil, and bake for 20 minutes."}]},{"id":"R6-P014-B2-01","skill":"B2","pages":["P014"],"src":2,"stem":["Which sequence follows the recipe?","哪一项符合食谱中的步骤顺序？"],"o":[["Prepare the vegetables → serve the lasagna → boil the noodles → bake it.","备好蔬菜 → 把千层面端上桌 → 煮面片 → 烤千层面。"],["Bake the lasagna → boil the noodles → prepare the vegetables → combine the cheeses.","烤千层面 → 煮面片 → 备好蔬菜 → 拌匀奶酪。"],["Combine the cheeses → bake the lasagna → boil the noodles → prepare the vegetables.","拌匀奶酪 → 烤千层面 → 煮面片 → 备好蔬菜。"],["Boil the noodles → prepare the vegetable mixture → combine cheeses and spices → bake the lasagna.","煮面片 → 做好蔬菜混合料 → 拌匀奶酪和香料 → 烤千层面。"]],"key":3,"why":["Steps 2, 3, 4, and 7 give the order: cook the noodles, prepare the vegetables, mix the cheeses and spices, and bake.","按第2、3、4、7步的先后排序。最后烘烤和冷却不能提前到煮面之前。"],"ev":[{"p":"P014","n":2,"quote":"Cook the noodles in boiling water for 8 to 10 minutes, stirring occasionally."},{"p":"P014","n":3,"quote":"Cook the diced bell peppers and onion in olive oil in a large saucepan until the onions are translucent."},{"p":"P014","n":4,"quote":"In a medium bowl, combine 1/4 cup of the Parmesan cheese with the ricotta cheese, mozzarella cheese, eggs, black pepper, and oregano."},{"p":"P014","n":7,"quote":"Cover the dish with foil, and bake for 20 minutes."}]},{"id":"R6-P014-B1-01","skill":"B1","pages":["P014"],"src":5,"stem":["How long does the lasagna bake in total?","千层面总共要烤多久？"],"o":[["10 minutes.","10 分钟。"],["20 minutes.","20 分钟。"],["30 minutes.","30 分钟。"],["40 minutes.","40 分钟。"]],"key":2,"why":["Step 7 calls for 20 minutes covered and 10 minutes uncovered, for a total of 30 minutes. Cooling comes afterward.","第7步先盖锡纸烤20分钟，再去掉锡纸烤10分钟，总计30分钟；冷却时间不属于烘烤时间。"],"ev":[{"p":"P014","n":7,"quote":"Cover the dish with foil, and bake for 20 minutes."},{"p":"P014","n":7,"quote":"Remove the foil, and bake for 10 more minutes so the cheese can brown."}]},{"id":"R6-P014-E5-01","skill":"E5","pages":["P014"],"src":null,"stem":["Who is the recipe especially suited for, based on its safety instructions?","根据安全说明，这份食谱尤其适合谁？"],"o":[["People who want only the history of farming.","只想了解农业历史的人。"],["Young cooks working with adult supervision.","有成人在旁照看的小厨师。"],["Professional pilots planning a flight.","正在做飞行计划的职业飞行员。"],["Children who must use knives and the stove alone.","必须独自用刀和炉灶的孩子。"]],"key":1,"why":["The safety instructions require adult supervision when using a knife or the stove. An adult also helps drain the noodles.","安全提示明确要求使用炉灶和刀具时有成人监督，步骤中也要求成人帮助倒面条，支持“有成人陪同的年轻厨师”。"],"ev":[{"p":"P014","n":"u2","quote":"- Never use the stove or a knife without an adult’s supervision. - Always remember to keep the handle of the skillet turned in so you cannot accidentally bump into it."},{"p":"P014","n":2,"quote":"Have an adult pour the noodles into a colander in the sink."}]},{"id":"R6-P016-F3-01","skill":"F3","pages":["P016"],"src":9,"stem":["How do Drew, Emilio, and Michi most likely feel at the end?","德鲁、埃米利奥和美智到了故事结尾，最可能有什么感受？"],"o":[["Proud and happy about their successful work.","因为努力有了成果而自豪、开心。"],["Relieved that nobody noticed their efforts.","庆幸没人注意到他们的努力。"],["Ashamed that their garden failed.","因为菜园没办成而羞愧。"],["Angry that their families refused to attend.","因为家人拒绝出席而生气。"]],"key":0,"why":["The students smile and hold up their commemorative stones as the crowd applauds. Their reaction suggests pride and happiness at what they accomplished.","三人展示纪念石并笑着接受掌声，说明他们为成功和认可感到自豪、开心。"],"ev":[{"p":"P016","n":8,"quote":"“As a thank-you to these students for their creative idea, hard work, and perseverance, they have each received a stepping stone for the garden."},{"p":"P016","n":10,"quote":"Drew, Emilio, and Michi held up their stepping stones and grinned as the crowd clapped."}]},{"id":"R6-P016-C1-01","skill":"C1","pages":["P016"],"src":8,"stem":["In paragraph 8, what does “perseverance” mean?","第 8 段的 perseverance 是什么意思？"],"o":[["Doing a task only when nobody is watching.","只有没人看见时才做事。"],["Giving up as soon as a task becomes hard.","任务一难就放弃。"],["Being able to cook without any ingredients.","没有任何食材也能做饭。"],["Continuing to work toward a goal despite difficulty.","遇到困难也继续为达成目标努力。"]],"key":3,"why":["The principal praises the students for staying with the project and completing it. Perseverance means continuing despite difficulty.","筹备花园经历了长期努力，校长表扬的是坚持完成项目的品质。perseverance 不是一次碰巧成功。"],"ev":[{"p":"P016","n":7,"quote":"I was a bit skeptical at first, but they had thought through everything."},{"p":"P016","n":8,"quote":"“As a thank-you to these students for their creative idea, hard work, and perseverance, they have each received a stepping stone for the garden."}]},{"id":"R6-P016-B1-01","skill":"B1","pages":["P016"],"src":7,"stem":["About how much of the food at the meal came from the school garden?","这一餐大约有多少食物来自学校的菜园？"],"o":[["About three-quarters.","约四分之三。"],["All of it, with no exceptions.","无一例外，全都来自菜园。"],["Exactly one-half.","正好一半。"],["About one-quarter.","约四分之一。"]],"key":0,"why":["In paragraph 7, the principal directly says approximately three-quarters of the food came from the garden.","校长在第7段直接给出 about three-quarters。about 表示大约，不能改成全部。"],"ev":[{"p":"P016","n":7,"quote":"About three-quarters of the food you’ll be enjoying tonight came from the school garden."}]},{"id":"R6-P018-B4-01","skill":"B4","pages":["P018"],"src":7,"stem":["Which sentence best shows that Savannah was frightened?","哪句话最能说明萨凡娜受到惊吓？"],"o":[["She lay stiffly and silently in her bed waiting to see what would happen.","她僵着身子，一声不响地躺在床上，等着看接下来会发生什么。"],["Savannah and her mom just laughed.","萨凡娜和妈妈只是笑了起来。"],["Savannah’s dad continued to snore.","萨凡娜的爸爸还在打呼噜。"],["Savannah’s mom finally found her slippers and motioned Savannah toward the bedroom door.","妈妈终于找到拖鞋，示意萨凡娜到卧室门口去。"]],"key":0,"why":["Savannah’s rigid posture and silence show her immediate fear as she waits to see what will happen.","身体僵住并安静等待直接表现恐惧。父亲打鼾、母亲找鞋和后来的笑都不能同样直接证明 Savannah 当时害怕。"],"ev":[{"p":"P018","n":2,"quote":"She lay stiffly and silently in her bed waiting to see what would happen."}]},{"id":"R6-P018-E4-01","skill":"E4","pages":["P018"],"src":null,"stem":["What atmosphere is created near the beginning of the story?","故事开头营造了怎样的气氛？"],"o":[["Festive and cheerful.","喜庆欢乐。"],["Tense and frightening.","紧张吓人。"],["Boring and routine.","平淡乏味。"],["Proud and triumphant.","自豪喜悦。"]],"key":1,"why":["The bloodcurdling scream, Savannah’s tense posture, and the repeated cries make the opening feel tense and frightening.","bloodcurdling scream、stiffly 和反复出现的尖叫共同营造紧张可怕的氛围。这是在分析描写的整体效果。"],"ev":[{"p":"P018","n":2,"quote":"It felt as though Savannah had been sleeping for only a few minutes when she awoke with a start to a terrible, bloodcurdling scream."},{"p":"P018","n":2,"quote":"This scream was followed by a series of wails and shrieks."}]},{"id":"R6-P018-B3-01","skill":"B3","pages":["P018"],"src":8,"stem":["How would Savannah probably react if she heard the same owl again?","如果萨凡娜又听到这只猫头鹰的叫声，她可能会有什么反应？"],"o":[["She would be certain the sound came from a human.","她会确信是人发出的声音。"],["She would know that her father was making the sound.","她会知道是爸爸发出的声音。"],["She would probably be less frightened because she now recognizes the sound.","她现在认得这个声音了，可能不会那么害怕。"],["She would have no way to connect it with an owl.","她完全没法把这个声音和猫头鹰联系起来。"]],"key":2,"why":["Once Savannah learns what made the sound, it already seems less frightening. She would probably be calmer if she heard the same owl again.","辨认声音后，尖叫已经不再那么吓人；这个变化支持以后更镇定的预测，不能扩大为永远不会害怕任何声音。"],"ev":[{"p":"P018","n":9,"quote":"“I feel so much better,” said Savannah with relief in her voice."},{"p":"P018","n":10,"quote":"They heard the owl’s cries one more time before they drifted back to sleep, but it didn’t sound nearly as frightening anymore."},{"p":"P018","n":11,"quote":"In the morning, Savannah and her mom were able to identify the owl from the night before as a barn owl."}]},{"id":"R6-P020-A3-01","skill":"A3","pages":["P020"],"src":7,"stem":["Which sentence best summarizes paragraph 3?","哪句话最能概括第 3 段？"],"o":[["Ancient paintings always show owls hunting.","古代壁画画的总是猫头鹰正在捕猎。"],["All owls have heart-shaped faces.","所有猫头鹰的脸都是心形的。"],["Owls can turn their heads exactly one full circle.","猫头鹰的头正好能转一整圈。"],["Owls have a sharp sense of hearing that helps them hunt at night.","猫头鹰听觉灵敏，这有助于它们在夜间捕猎。"]],"key":3,"why":["The hearing details in paragraph 3 all support the same idea: sharp hearing helps owls hunt at night.","第3段的多个听觉细节共同说明听力怎样帮助夜间捕猎。脸形、转头和古代绘画属于其他段落。"],"ev":[{"p":"P020","n":3,"quote":"One attribute that is common to all owls is their sharp sense of hearing."},{"p":"P020","n":3,"quote":"This is important to the owl’s keen sense of hearing because it allows the owl to more accurately locate the source of the sounds."}]},{"id":"R6-P020-B2-01","skill":"B2","pages":["P020"],"src":2,"stem":["Why is hearing especially important to an owl’s survival?","为什么听觉对猫头鹰的生存尤其重要？"],"o":[["It lets the owl see clearly at every distance.","它能让猫头鹰看清任何距离的东西。"],["It changes the owl’s face from round to heart-shaped.","它能把猫头鹰的脸从圆形变成心形。"],["It prevents the owl from ever needing food.","它让猫头鹰永远不再需要食物。"],["It helps an owl locate prey while hunting at night.","猫头鹰在夜间捕猎时能靠它确定猎物的位置。"]],"key":3,"why":["Owls hunt after dark, when vision alone is limited. Their hearing helps them locate prey.","夜间视觉条件受限，听力让猫头鹰定位猎物；要把“夜间捕食”这个条件和听觉作用连接起来。"],"ev":[{"p":"P020","n":3,"quote":"Because they hunt at night, hearing is especially important to their survival."},{"p":"P020","n":3,"quote":"This is important to the owl’s keen sense of hearing because it allows the owl to more accurately locate the source of the sounds."}]},{"id":"R6-P020-C1-01","skill":"C1","pages":["P020"],"src":9,"stem":["In paragraph 4, “enhances” most nearly means:","第 4 段的 enhances 最接近哪个意思？"],"o":[["Makes impossible.","使不可能。"],["Completely removes.","彻底去除。"],["Makes better or stronger.","使变好或增强。"],["Makes weaker.","使变弱。"]],"key":2,"why":["Seeing well in dim light improves an owl’s ability to hunt. Enhances here means makes better or stronger.","在昏暗光线中看得好，有助于捕猎，所以 enhances 是“提升、加强”，不是削弱。"],"ev":[{"p":"P020","n":4,"quote":"However, they can see well in dim light, which enhances their hunting skills."}]},{"id":"R6-P022-A1-01","skill":"A1","pages":["P022"],"src":9,"stem":["Which sentence best states the main idea?","哪句话最能概括主旨？"],"o":[["Lighthouses have long helped sailors stay safe and remain important parts of coastal history.","灯塔长期帮助水手安全航行，至今仍是海岸历史的重要组成部分。"],["Every lighthouse is built from the same material.","每座灯塔都用同一种材料建造。"],["Lighthouses are useful only as private homes.","灯塔只有作为私人住宅才有用。"],["The only purpose of a lighthouse is to attract photographers.","灯塔唯一的用途是吸引摄影爱好者。"]],"key":0,"why":["The passage describes how lighthouses keep sailors safe, how they developed, and why they are preserved. A main idea should reflect both their function and their historical importance.","全文从航海安全、技术发展讲到历史保护，主旨应覆盖主要功能和历史价值，不能只抓游客或材料等一个细节。"],"ev":[{"p":"P022","n":2,"quote":"They project a strong beam of light that alerts sailors of their location."},{"p":"P022","n":9,"quote":"If you ever have a chance to visit one, getting a glimpse of history is worth the trip."}]},{"id":"R6-P022-C1-01","skill":"C1","pages":["P022"],"src":8,"stem":["In paragraph 3, what does “automated” mean?","第 3 段的 automated 是什么意思？"],"o":[["Abandoned and no longer usable.","已被废弃，无法再用。"],["Able to operate automatically rather than needing a keeper to run it.","能自行运作，无需看守人操作。"],["Made entirely of wood.","完全用木头建成。"],["Moved to a different coastline.","搬到了另一条海岸线上。"]],"key":1,"why":["The words which means introduce the definition in context: automated lighthouses run on their own without a keeper.","which means 后的说明直接解释 automated：不再需要灯塔守护人，是自动运行而不是废弃。"],"ev":[{"p":"P022","n":3,"quote":"Today, almost all lighthouses are automated, which means that there is no longer a need for lighthouse keepers."}]},{"id":"R6-P022-D4-01","skill":"D4","pages":["P022"],"src":null,"stem":["Why does the author mention Homer’s The Iliad?","作者为什么提到荷马的《伊利亚特》？"],"o":[["To teach readers how to write an epic poem.","教读者如何写史诗。"],["To provide evidence that the idea of a lighthouse is very old.","用它作为证据，表明灯塔的构想由来已久。"],["To prove that all early lighthouses used electricity.","证明早期的灯塔都用电。"],["To show that every lighthouse was built by Homer.","说明每座灯塔都是荷马建的。"]],"key":1,"why":["The reference to a lighthouse in an ancient poem provides evidence that the idea has existed for thousands of years.","作者用古代作品中出现灯塔的记载说明其悠久历史。问的是这一资料的作用，不是诗本身写了什么。"],"ev":[{"p":"P022","n":4,"quote":"In the poem, Homer refers to a lighthouse, giving modern scholars an idea of how long lighthouses have been a part of human life."}]},{"id":"R6-P024-F4-01","skill":"F4","pages":["P024"],"src":null,"stem":["How does the point of view change in paragraphs 4–5?","第 4 至 5 段的叙述视角发生了什么变化？"],"o":[["The cat becomes the narrator of the entire passage.","猫成了全文的叙述者。"],["An outside account of Paloma changes to the first-person voice inside the story she is writing.","文章从旁观者讲述帕洛玛，切换到她所写故事中“我”的第一人称叙述。"],["Paloma begins quoting her teacher’s autobiography.","帕洛玛开始引用她老师的自传。"],["The whole passage changes into a letter written by her parents.","全文变成了她父母写的一封信。"]],"key":1,"why":["Paragraph 3 shows Paloma beginning to write. Paragraphs 4 and 5 switch to I in her imagined lighthouse scene, and paragraph 6 returns to Paloma at the computer.","第3段说她开始写故事，第4、5段用 I 进入她创作的灯塔情境，第6段再回到 Paloma。区分外层叙述和内层故事。"],"ev":[{"p":"P024","n":3,"quote":"Without thinking about it any longer, Paloma began to write the story."},{"p":"P024","n":4,"quote":"I sat with Sadie curled on my lap and looked out the window at the crashing waves."},{"p":"P024","n":6,"quote":"Paloma stopped and reread what she had just written."}]},{"id":"R6-P024-F6-01","skill":"F6","pages":["P024"],"src":9,"stem":["In “The heavy rain beat against my lighthouse like a thousand footsteps,” what is compared?","“大雨打在我的灯塔上，仿佛有上千双脚……”这句话把什么作了比较？"],"o":[["The sunlight and a warm blanket.","阳光和温暖的毯子。"],["The cat and a lighthouse keeper.","猫和灯塔看守人。"],["A computer and an island.","电脑和岛屿。"],["The sound of rain and the sound of many running footsteps.","雨声和许多人奔跑的脚步声。"]],"key":3,"why":["The word like compares rain pounding on the lighthouse to the sound of many feet running. The comparison makes the storm feel intense.","like 把雨拍打灯塔的声音比作大量脚步声，突出风雨的强烈和紧张感；不是说真有人在墙上跑。"],"ev":[{"p":"P024","n":4,"quote":"The heavy rain beat against my lighthouse like a thousand footsteps racing up and down the walls."}]},{"id":"R6-P024-D1-01","skill":"D1","pages":["P024"],"src":null,"stem":["What happens to the focus of the passage in paragraph 6?","第 6 段里，文章的焦点是怎样变化的？"],"o":[["It changes from Paloma to the life of a real lighthouse inventor.","从帕洛玛转向一位真实的灯塔发明家的一生。"],["It continues only as the cat’s account of the hurricane.","只继续讲猫眼中的飓风。"],["It begins giving instructions for building a lighthouse.","开始说明怎样建造灯塔。"],["It returns from the imagined lighthouse scene to Paloma writing at the computer.","从想象中的灯塔情景回到电脑前写作的帕洛玛。"]],"key":3,"why":["Paloma stops and rereads her work in paragraph 6. The focus returns from her imagined island to the place where she is writing.","前两段内层故事用 I，到了第6段 Paloma 停下来重读，关注点回到写作现场。焦点变化不只是代词换了。"],"ev":[{"p":"P024","n":5,"quote":"I knew that my lighthouse was sturdily built."},{"p":"P024","n":6,"quote":"Paloma stopped and reread what she had just written."}]},{"id":"R6-P026-B1-01","skill":"B1","pages":["P026"],"src":5,"stem":["Which reason did some people give for opposing the move?","有些人为什么反对搬迁？"],"o":[["They believed the lighthouse had never helped sailors.","他们认为灯塔从来没有帮助过水手。"],["They thought the cost was not justified.","他们觉得花这笔钱不值得。"],["They thought it would move too quickly for anyone to see.","他们觉得灯塔移动得太快，谁也看不见。"],["They wanted the lighthouse to become a professional stadium.","他们想把灯塔变成职业比赛的场馆。"]],"key":1,"why":["Paragraph 4 says some people believed the move was not important enough to justify its $9.8 million cost.","第4段明确说，有人认为搬迁不值得花980万美元；这与是否重要的价值判断有关。"],"ev":[{"p":"P026","n":4,"quote":"Others thought that moving the lighthouse was not important enough to justify spending the 9.8 million dollars the move would cost."}]},{"id":"R6-P026-D2-01","skill":"D2","pages":["P026"],"src":null,"stem":["In paragraph 3, “This is exactly why” points back mainly to what idea?","第 3 段里，This is exactly why（这正是……的原因）主要指前面的哪一点？"],"o":[["The lighthouse had never survived a storm.","灯塔从来没有扛住过风暴。"],["Every visitor preferred a slow journey.","每位游客都更喜欢慢慢走。"],["The lighthouse was already a private house.","灯塔已经变成了私人住宅。"],["The lighthouse had faithfully protected sailors from harm.","灯塔一直忠实地保护水手免遭危险。"]],"key":3,"why":["This points back to the preceding sentence about the lighthouse protecting sailors. That explains why it deserved to be preserved, while erosion explains why it had to be moved.","This 指向紧前一句灯塔保护航海者的作用，用来解释为什么值得保存；侵蚀则是需要搬迁的直接威胁。"],"ev":[{"p":"P026","n":3,"quote":"The Cape Hatteras Lighthouse faithfully did its duty in protecting sailors from harm."},{"p":"P026","n":3,"quote":"This is exactly why it was determined that the lighthouse would have to be preserved."}]},{"id":"R6-P028-F2-01","skill":"F2","pages":["P028"],"src":1,"stem":["Which traits are best supported for Ida Lewis?","哪些品质最符合文中对艾达·刘易斯的描述？"],"o":[["Hardworking, determined, and strong-willed.","勤劳、有决心、意志坚定。"],["Careless about the people near the lighthouse.","不关心灯塔附近的人。"],["Interested only in becoming famous.","只对出名感兴趣。"],["Lazy, unreliable, and afraid to help.","懒惰、不可靠，害怕出手相助。"]],"key":0,"why":["Ida tended the light for decades and rescued people repeatedly. Her work demonstrates determination and commitment.","长期承担守塔职责并多次救人，支持勤劳坚定；她对公众关注不适应，不能说她只追求名气。"],"ev":[{"p":"P028","n":3,"quote":"Captain Lewis lived about 20 years longer, but Ida and her mother performed all the required duties of a keeper."},{"p":"P028","n":4,"quote":"However, during her 39 years keeping the light at Lime Rock, Ida rescued between 18 and 25 people."}]},{"id":"R6-P028-F3-01","skill":"F3","pages":["P028"],"src":7,"stem":["Why did so much attention make Ida uncomfortable?","为什么这么多人关注艾达会让她不自在？"],"o":[["She believed rescuing people was unimportant.","她觉得救人并不重要。"],["She wanted visitors to pay a larger admission fee.","她想让游客多付些门票钱。"],["She had never worked at Lime Rock.","她从未在莱姆罗克工作过。"],["She was used to the quiet solitude of lighthouse life.","她习惯了灯塔里清静独处的生活。"]],"key":3,"why":["Paragraph 5 explains that Ida was used to the peace and solitude of lighthouse life, so the crowds and attention made her uncomfortable.","第5段把原来的安静独处生活与大量来访者对照，直接解释她的不适。"],"ev":[{"p":"P028","n":5,"quote":"Ida was used to the quiet solitude of a lighthouse keeper’s life, and she was uncomfortable with all the attention."}]},{"id":"R6-P028-A3-01","skill":"A3","pages":["P028"],"src":null,"stem":["Which summary best covers the selection?","哪项最能概括本文？"],"o":[["Lighthouse keepers spent their days welcoming crowds of tourists.","灯塔看守人整天接待成群的游客。"],["Ida Lewis designed the first automated lighthouse lens.","艾达·刘易斯设计了第一种自动灯塔透镜。"],["Lime Rock was a famous place to buy boats.","莱姆罗克是有名的买船地点。"],["Women, including Ida Lewis, performed demanding lighthouse work, saved lives, and earned recognition.","艾达·刘易斯等女性胜任了艰苦的灯塔工作，救下不少人，获得了认可。"]],"key":3,"why":["The passage introduces the demanding work of women lighthouse keepers, then illustrates it with Ida’s duties, rescues, and public recognition.","前两段交代女性守塔人的背景，后文用 Ida 的职责、救援和表彰展开；概括要把背景与核心人物连接起来。"],"ev":[{"p":"P028","n":2,"quote":"Women proved themselves to be equally capable of holding this difficult job that was as much a way of life as it was a career."},{"p":"P028","n":4,"quote":"However, during her 39 years keeping the light at Lime Rock, Ida rescued between 18 and 25 people."},{"p":"P028","n":6,"quote":"In 1924, Lime Rock was renamed Ida Lewis Rock in honor of the keeper who had died in 1911."}]},{"id":"R6-P030-F1-01","skill":"F1","pages":["P030"],"src":9,"stem":["When does the scene take place?","这一幕发生在什么时候？"],"o":[["At midnight while everyone is asleep.","半夜，每个人都在睡觉。"],["In the afternoon after a basketball match.","一场篮球赛结束后的下午。"],["During an evening meal in a restaurant.","晚上在餐馆吃饭时。"],["In the morning during the family’s breakfast.","早晨，一家人吃早餐时。"]],"key":3,"why":["Mrs. Carter mentions seven o’clock in the morning, and the family is eating breakfast.","母亲明确说早上七点，家人吃早餐和看报等细节也一致支持这一时段。"],"ev":[{"p":"P030","n":4,"quote":"“I’m just not sure that a picture of me in my pajamas pouring orange juice at 7 o’clock in the morning is the most interesting part of your day.”"},{"p":"P030","n":13,"quote":"Dante laughed as he got up from the breakfast table."}]},{"id":"R6-P030-F2-01","skill":"F2","pages":["P030"],"src":6,"stem":["Who is the protagonist of this story?","这个故事的主人公是谁？"],"o":[["The teacher who invented the camera.","发明相机的老师。"],["A stranger at a photography museum.","摄影博物馆里的一位陌生人。"],["Dante.","但丁。"],["A professional basketball coach.","一位职业篮球教练。"]],"key":2,"why":["The main events follow Dante as he begins his photo-diary assignment. His family takes part in the events he wants to capture.","主要事件围绕 Dante 完成照片日记的作业展开，母亲、弟弟和父亲都参与了他的经历。"],"ev":[{"p":"P030","n":3,"quote":"“For the next two days, I’m going to keep a photo diary of my life.”"}]},{"id":"R6-P030-F3-01","skill":"F3","pages":["P030"],"src":8,"stem":["Why does Wesley joke that his pictures may become valuable?","为什么韦斯利开玩笑说自己的照片以后可能会很值钱？"],"o":[["He wants Dante to stop taking photographs forever.","他想让但丁再也不要拍照。"],["He plans to sell the family’s camera that morning.","他计划当天早上卖掉家里的相机。"],["He knows the photographs are made of gold.","他知道照片是金子做的。"],["He imagines becoming a famous professional basketball player.","他想象自己会成为著名的职业篮球运动员。"]],"key":3,"why":["When Wesley imagines making it into the NBA, he jokes that becoming famous would make his photos worth more.","When I make it into the NBA 表明他在想象未来成名，是开玩笑式的自信，不能当成已经进入 NBA 的事实。"],"ev":[{"p":"P030","n":12,"quote":"“When I make it into the NBA,
