肌肉刚开始放松，卧室窗外又传来一声尖叫，接着就是一连串哀号和尖啸。"],"type":"paragraph"},{"n":3,"t":["Savannah slipped from her bed and ran as quickly as she could to her parents’ bedroom. “Mom,” she whispered urgently. “Did you hear that screaming?”","萨凡娜悄悄溜下床，飞快地跑到父母的卧室。“妈妈，”她急切地低声问，“你听到那尖叫声了吗？”"],"type":"paragraph"},{"n":4,"t":["Savannah’s mom was already awake, sitting up and hunting for her slippers. Savannah’s dad continued to snore. Neither Savannah nor her mother were surprised. Savannah’s dad was notorious for being able to sleep through anything. When he lived alone before he got married, he had to set three alarm clocks every night. He positioned them in various places around his bedroom to make sure that he would get up in time for work.","妈妈早就醒了，已经坐起来在找拖鞋。爸爸还在打呼噜。萨凡娜和妈妈都不觉得奇怪。爸爸睡得沉是出了名的，什么声音都吵不醒他。婚前一个人住的时候，他每天夜里得设三个闹钟，放在卧室不同的地方，好保证自己能按时起床去上班。"],"type":"paragraph"},{"n":5,"t":["Savannah’s mom finally found her slippers and motioned Savannah toward the bedroom door. She shut the door behind them. “What do you think it is, Mom?” asked Savannah.","妈妈终于找到拖鞋，示意萨凡娜到卧室门口去，随后在身后把门关上。“妈妈，你觉得那是什么？”萨凡娜问。"],"type":"paragraph"},{"n":6,"t":["Before Mom could answer, she and Savannah heard the terrible shrieks again. They waited until it was over to speak. “I’m pretty sure it’s an animal,” said Mom. “Let’s see if we can spot anything through the kitchen window.”","妈妈还没来得及回答，她们又听见了那可怕的尖叫声。两人等声音停了才开口。“我猜多半是动物，”妈妈说，“咱们从厨房的窗户看看能不能发现什么。”"],"type":"paragraph"},{"n":7,"t":["Savannah and her mom scanned the dark backyard but couldn’t see anything. They were getting ready to head back to bed when the noises began again. This time they both looked up into the large old oak trees that towered over the backyard. They could see two small eyes gleaming in the moonlight from one of the highest branches.","萨凡娜和妈妈在漆黑的后院里扫视了一圈，什么也没看见。她们正打算回去睡觉，那声音又响起来了。这次两人都抬头看向后院上方那些高耸的老橡树。其中一根最高的枝杈上，两只小眼睛在月光下闪闪发亮。"],"type":"paragraph"},{"n":8,"t":["“I think it’s an owl,” said Mom, craning her neck to get a better look. “All I can see are its eyes, though.”","“我想是只猫头鹰，”妈妈说，伸长脖子想看清些，“不过我只看得见它的眼睛。”"],"type":"paragraph"},{"n":9,"t":["“I feel so much better,” said Savannah with relief in her voice. “Maybe we can look online in the morning and see if we can figure out what kind of owl it is,” she suggested. “My teacher showed us a great website for wild animal identification.”","“这下我放心多了。”萨凡娜的语气轻松了下来。她提议说：“也许明早我们可以上网查查，看能不能弄清是哪一种猫头鹰。老师给我们看过一个很棒的网站，可以用来辨认野生动物。”"],"type":"paragraph"},{"n":10,"t":["Savannah and her mom both returned to bed. They heard the owl’s cries one more time before they drifted back to sleep, but it didn’t sound nearly as frightening anymore.","萨凡娜和妈妈都回到床上。再次入睡前，她们又听到了一次猫头鹰的叫声，这回听着已经没那么吓人了。"],"type":"paragraph"},{"n":11,"t":["In the morning, Savannah and her mom were able to identify the owl from the night before as a barn owl. They used the website that Ms. Petrovic had recommended to listen to sound bytes of different types of animals.","到了早晨，萨凡娜和妈妈辨认出前一夜的猫头鹰是一只仓鸮。她们在彼得罗维奇老师推荐的网站上听了不同动物的叫声片段。"],"type":"paragraph"},{"n":12,"t":["As they were listening, Savannah’s dad came downstairs for breakfast. “What’s all that racket?” he asked cheerfully, pouring himself a glass of orange juice.","她们正听着，爸爸下楼吃早饭。他一边给自己倒橙汁，一边轻快地问：“什么声音这么吵？”"],"type":"paragraph"},{"n":13,"t":["“Doesn’t that sound at all familiar, Dad?” asked Savannah, replaying the barn owl’s call.","“爸，这声音你就一点儿也不觉得熟悉？”萨凡娜又放了一遍仓鸮的叫声。"],"type":"paragraph"},{"n":14,"t":["“Nope,” said Dad. “Should it?”","“不熟悉啊，”爸爸说，“我应该听过吗？”"],"type":"paragraph"},{"n":15,"t":["Savannah and her mom just laughed.","萨凡娜和妈妈只是笑了起来。"],"type":"paragraph"}],"original":[{"n":1,"ask":["causing fear\n________","让人害怕的。"],"ans":["bloodcurdling","bloodcurdling（令人毛骨悚然的）"],"dir":["Write the words from the story that have the meanings below.","从故事中找出与下列释义相符的词，写下来。"]},{"n":2,"ask":["held tightly together\n________","紧紧攥住或绷住的。"],"ans":["clenched","clenched（攥紧的、绷紧的）"]},{"n":3,"ask":["needing immediate attention\n________","急需马上引起注意地。"],"ans":["urgently","urgently（急切地）"]},{"n":4,"ask":["well known for something unpleasant or unfavorable\n________","因为不好的事情而出名的。"],"ans":["notorious","notorious（因不好的事而出名的）"]},{"n":5,"ask":["stretching the neck to see better\n________","伸长脖子以看得更清楚。"],"ans":["craning","craning（伸长脖子）"]},{"n":6,"ask":["Number the events below to show the order in which they happened.\n________ Savannah switched off her flashlight.\n________ Savannah and her mom saw the owl’s eyes gleaming in the moonlight.\n________ Savannah’s dad poured himself a glass of orange juice.\n________ Savannah ran into her parents’ bedroom.\n________ Savannah’s mom looked for her slippers.","给下列事件标上序号，表示发生的先后顺序。\n萨凡娜关掉手电筒。\n萨凡娜和妈妈看见猫头鹰的眼睛在月光下闪闪发亮。\n萨凡娜的爸爸给自己倒了一杯橙汁。\n萨凡娜跑进父母的卧室。\n萨凡娜的妈妈找拖鞋。"],"ans":["- **1** Savannah switched off her flashlight.\n- **4** Savannah and her mom saw the owl’s eyes gleaming in the moonlight.\n- **5** Savannah’s dad poured himself a glass of orange juice.\n- **2** Savannah ran into her parents’ bedroom.\n- **3** Savannah’s mom looked for her slippers.","按题中所列顺序，分别标 1、4、5、2、3。"]},{"n":7,"ask":["Find one sentence that shows Savannah was frightened by the screaming she heard.\n________","找一句话，说明萨凡娜被听到的尖叫声吓到了。"],"ans":["Possible answer: Savannah lay stiffly and silently in her bed waiting to see what would happen.","参考答案：她僵着身子，一声不响地躺在床上，等着看接下来会发生什么。"]},{"n":8,"ask":["If Savannah hears a barn owl again someday, do you think she will be frightened? Why or why not?\n________","如果有一天萨凡娜又听到仓鸮的叫声，你觉得她会害怕吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":9,"ask":["What problem did Savannah have in the story?\n________","萨凡娜在故事中遇到什么问题？"],"ans":["She didn’t know what was making the screaming noises.","她不知道尖叫声是什么发出来的。"]},{"n":10,"ask":["Why weren’t Savannah and her mom surprised when the owl’s cries didn’t wake up Savannah’s dad?\n________","为什么猫头鹰的叫声没吵醒萨凡娜的爸爸，萨凡娜和妈妈也不觉得奇怪？"],"ans":["He is notorious for sleeping through anything and had to set multiple alarms just to wake up in the morning.","他睡得沉是出了名的，什么声音都吵不醒他。早晨光是为了起床，他就得设好几个闹钟。"]},{"n":11,"ask":["How were Savannah and her mom able to identify the owl’s call?\n________","萨凡娜和妈妈是怎么辨认出猫头鹰的叫声的？"],"ans":["They listened to sound bytes from a web site that Ms. Petrovic had recommended.","她们听了彼得罗维奇老师推荐的网站上的声音片段。"]}]},{"id":"P020","title":["Night Flyers","夜间飞行者"],"lead":["What other creatures are associated with the night?","你还知道哪些常在夜间活动的生物？"],"exercise":"P021","genre":"说明文","family":"info","parts":[{"n":1,"t":["Have you ever heard a hooting or screeching sound in the night and wondered if you were hearing an owl? It’s more likely that you have heard an owl in the wild rather than seen one. Owls are nocturnal, which means that they are active mostly at night. Owls feed on live prey, and the darkness makes it harder for them to be seen by the small animals they hunt.","你夜里听到过低鸣或尖叫，心想那是不是猫头鹰的叫声？在野外，你听到猫头鹰的机会比亲眼看见它大。猫头鹰是夜行性动物，也就是说，它们主要在夜间活动。猫头鹰以活的猎物为食，天黑时，它们捕猎的小动物更难发现它们。"],"type":"paragraph"},{"n":2,"t":["There are more than 175 species of owls, but they are generally divided into two categories—common owls and barn owls. Barn owls have a light-colored, heart-shaped face. Common owls are a diverse group with many different patterns and colorings, but all have a round face. The largest owls are as big as eagles. The smallest is the elf owl, which lives in Mexico and the southwestern United States. It measures only five inches and makes its home in the holes woodpeckers create in large cacti.","猫头鹰有 175 种以上，大体可以分为普通猫头鹰和仓鸮两类。仓鸮有一张浅色的心形脸。普通猫头鹰种类多样，羽毛的花纹和颜色各异，却都有一张圆脸。最大的猫头鹰和鹰一样大。最小的是姬鸮，生活在墨西哥和美国西南部。它只有 5 英寸长，住在啄木鸟在大型仙人掌上凿出的洞里。"],"type":"paragraph"},{"n":3,"t":["One attribute that is common to all owls is their sharp sense of hearing. Because they hunt at night, hearing is especially important to their survival. Owls have the ability to hear a rodent’s movements from hundreds of feet away. In many species, the ear openings are positioned asymmetrically, or unevenly, on the owl’s head. This is important to the owl’s keen sense of hearing because it allows the owl to more accurately locate the source of the sounds.","所有猫头鹰都有一个共同特点，就是听觉灵敏。因为它们在夜里捕猎，听觉对它们的生存尤其重要。猫头鹰听得见几百英尺外啮齿动物活动的动静。许多种猫头鹰的耳孔在头上的位置不对称，也就是两边的位置不同。这样的构造使猫头鹰能更准确地判断声音从哪里来，是它们听觉敏锐的重要原因。"],"type":"paragraph"},{"n":4,"t":["Owls are farsighted, meaning they cannot see well at close distances. However, they can see well in dim light, which enhances their hunting skills. Unlike most animals, an owl’s eyes do not move. Instead, the owl must turn its entire head to see anything that is not directly in front of it. For this reason, the owl has an extremely flexible neck. It is able to turn its head about 270 degrees. That is three quarters of a circle!","猫头鹰看近处的东西不太清楚。不过，它们在昏暗的光线下也能看清东西，这使它们更善于捕猎。与大多数动物不同，猫头鹰的眼球不能转动。要看正前方以外的东西，猫头鹰必须转动整个头。为此，它的颈部非常灵活，头能转动约 270 度，也就是一整圈的四分之三！"],"type":"paragraph"},{"n":5,"t":["Another common attribute to all owls is their nearly silent flight. This keeps the owl’s prey from hearing it approach, but it also permits the owl to use its hearing to locate the exact position of the animal. Owls’ wings are a very soft, downy type of feather that muffles the sound in flight. A fringe of feathers along the edges of the wings is also thought to quiet the flapping sound of the owls’ wings.","所有猫头鹰的另一个共同特点是飞起来几乎无声。这样，猎物听不见猫头鹰接近，猫头鹰也能用听觉确定猎物的准确位置。猫头鹰翅膀上的羽毛柔软如绒，能减弱飞行的声音。据认为，翅膀边缘的一排羽毛也能减轻振翅的声响。"],"type":"paragraph"},{"n":6,"t":["Owls are found in the myths, folklore, and legends of many cultures. In France, archaeologists discovered cave paintings between 15,000 and 20,000 years old that contain images of owls. Mummified owls have also been found in Egyptian tombs, which indicates they were respected in ancient Egyptian culture.","很多文化的神话、民间故事和传说里都有猫头鹰。在法国，考古学家发现了距今 15,000 至 20,000 年的洞穴壁画，上面画着猫头鹰。在埃及的墓穴里也发现了猫头鹰木乃伊，这表明古埃及人十分看重猫头鹰。"],"type":"paragraph"},{"n":7,"t":["Owls symbolize wisdom in some cultures. In others, they are feared and thought to bring bad luck. It is likely that the negative associations with owls came about because they are nocturnal creatures. Things associated with night and darkness have often been feared throughout history.","在有些文化中，猫头鹰象征智慧。在另一些文化中，人们惧怕它们，认为它们会带来厄运。人们之所以对猫头鹰有不好的联想，很可能是因为它们是夜行性动物。古往今来，凡是让人联想到夜晚和黑暗的事物，常常会引起恐惧。"],"type":"paragraph"},{"n":8,"t":["The next time you are out at night, listen quietly for the sounds of an owl. You may be lucky enough to catch a glimpse of an owl’s gleaming eyes or watch an owl soar across a field in nearly silent flight.","下次夜晚出门时，静静听一听，看有没有猫头鹰的叫声。运气好的话，你也许能瞥见猫头鹰闪亮的眼睛，或者看见它近乎无声地飞过田野。"],"type":"paragraph"}],"original":[{"n":1,"ask":["How are barn owls different from common owls?\n________","仓鸮和普通猫头鹰有什么不同？"],"ans":["Barn owls have a light colored heart-shaped face. Common owls have different patterns and colors and a round face.","仓鸮有一张浅色的心形脸。普通猫头鹰羽毛的花纹和颜色各异，脸是圆的。"]},{"n":2,"ask":["Why is the owl’s sense of hearing important to its survival?\n________","为什么听觉对猫头鹰的生存很重要？"],"ans":["because they hunt at night","因为猫头鹰在夜间捕猎。"]},{"n":3,"ask":["How do archaeologists know that ancient Egyptians respected owls?\n________","考古学家怎么知道古埃及人看重猫头鹰？"],"ans":["They found mummified owls in Egyptian tombs.","他们在埃及墓穴里发现了猫头鹰木乃伊。"]},{"n":4,"ask":["What is unusual about the owl’s neck and eyes?\n________","猫头鹰的颈部和眼睛有什么特别之处？"],"ans":["The owl’s eyes do not move, but its neck can turn about 270 degrees.","眼球不能转动，但脖子能让头转动约 270 度。"]},{"n":5,"ask":["In what part of the world does the smallest owl live?\n________","世界上最小的猫头鹰生活在哪些地方？"],"ans":["Mexico and the southwestern United States","墨西哥和美国西南部。"]},{"n":6,"ask":["What is one reason that owls have been feared in some cultures?\n________","为什么有些文化里人们害怕猫头鹰？说出一个原因。"],"ans":["They are nocturnal creatures.","猫头鹰是夜行性动物。"]},{"n":7,"ask":["A **summary** is a short sentence that tells the most important facts about a topic. Check the sentence below that is the best summary for paragraph 3.\n\n- ________ Owls hunt at night.\n- ________ Owls have a sharp sense of hearing, which helps them to be strong night hunters.\n- ________ Some owls’ ear openings are positioned asymmetrically.","摘要是用简短的一句话说出某个主题最重要的信息。选出最能概括第 3 段的一句。\nA. 猫头鹰在夜间捕猎。\nB. 猫头鹰听觉灵敏，因此很擅长在夜间捕猎。\nC. 有些猫头鹰的耳孔位置不对称。"],"ans":["✓ Owls have a sharp sense of hearing, which helps them to be strong night hunters.","B. 猫头鹰听觉灵敏，因此很擅长在夜间捕猎。"]},{"n":8,"ask":["What was the author’s purpose in writing this selection?\n________","作者写这篇文章的目的是什么？"],"ans":["to inform the reader about the varieties, habits, and characteristics of owls.","介绍猫头鹰的种类、习性和特点。"]},{"n":9,"ask":["In paragraph 4, enhances means\n\n- ________ makes weaker\n- ________ makes better or stronger\n- ________ changes","第 4 段的 enhances 是什么意思？\nA. 使变弱\nB. 使变好或增强\nC. 改变"],"ans":["✓ makes better or stronger","B. 使变好或增强"]}]},{"id":"P022","title":["A Beacon of Light","指路的灯塔"],"lead":["Have you ever had the opportunity to visit a lighthouse?","你有过参观灯塔的机会吗？"],"exercise":"P023","genre":"说明文","family":"info","parts":[{"n":1,"t":["Lighthouses can symbolize many different things. For tourists, they can be an interesting place to visit, explore, and photograph. For historians, they are a window to the past and a reminder of a different way of life. For sailors and ship captains, they are a sign of safety.","灯塔对不同的人有不同的意义。对游客来说，那是个有趣的地方，可以参观、探索、拍照。对历史学家来说，那是一扇通往过去的窗，让人想起另一种生活方式。对水手和船长来说，灯塔是安全的标志。"],"type":"paragraph"},{"n":2,"t":["Lighthouses are structures located along the shorelines of large bodies of water. They project a strong beam of light that alerts sailors of their location. They can protect a boat from running aground at night or other times when visibility is poor because of fog or a storm. Lighthouses alert sailors that land is near and warn them of potential dangers, such as reefs or rocky harbors.","灯塔是坐落在辽阔水域岸边的建筑。它射出强光，向水手标示自己的位置。夜间，或者有雾、遇到风暴等能见度较差的时候，灯塔可以防止船只搁浅。它提醒水手陆地就在附近，也警示他们注意暗礁或多岩石的港湾等潜在危险。"],"type":"paragraph"},{"n":3,"t":["Originally, lighthouses were constructed with living quarters for the lighthouse keeper. It was the job of the keeper to maintain the lighthouse and make sure that it was always working properly. Although it could be lonely at times, it was an important job. Today, almost all lighthouses are automated, which means that there is no longer a need for lighthouse keepers.","早期建造的灯塔都为看守人备有住处。看守人的工作是维护灯塔，保证它始终正常运转。这份工作有时候会让人感到孤单，却十分重要。如今，几乎所有灯塔都实现了自动运行，已经不再需要看守人了。"],"type":"paragraph"},{"n":4,"t":["No one is certain when lighthouses first came into existence. We do know that the concept of lighthouses is more than 3,000 years old. An epic Greek poem titled *The Iliad* was written by a man named Homer around 1200 B.C. In the poem, Homer refers to a lighthouse, giving modern scholars an idea of how long lighthouses have been a part of human life.","没人能确定最早的灯塔何时出现。但我们知道，灯塔的构想已有三千多年。大约在公元前 1200 年，一位名叫荷马的人写了古希腊史诗《伊利亚特》。他在诗中提到灯塔，让现代学者对灯塔进入人类生活有多久有了大致的了解。"],"type":"paragraph"},{"n":5,"t":["Early versions of lighthouses were quite different from today’s lighthouses. They were usually made of iron baskets that were suspended from long poles. The baskets contained burning coal or wood. In the 1700s, these baskets were replaced with oil or gas lanterns. When electricity was invented, the lanterns were replaced with electric beacons.","早期的灯塔和今天的颇不一样。它们通常是挂在长杆上的铁篮，里面燃烧煤或木柴。到了 18 世纪，铁篮被油灯或煤气灯取代。人们学会利用电之后，这些灯换成了电力航标灯。"],"type":"paragraph"},{"n":6,"t":["In 1822, a French physicist named Augustin Fresnel invented a lens that would prove to be very important in lighthouse technology. The Fresnel lens uses glass prisms to concentrate light and send it through a very powerful magnifying lens. With the invention of the Fresnel lens, it became possible to project a beam of light as far as 28 miles from shore!","1822 年，法国物理学家奥古斯坦·菲涅耳发明了一种透镜，后来对灯塔技术十分重要。菲涅耳透镜用玻璃棱镜把光聚在一起，使光穿过一个放大能力很强的透镜。有了这种发明，光束竟能从岸边射到 28 英里之外！"],"type":"paragraph"},{"n":7,"t":["Lighthouse beams can be used in a variety of ways to help sailors identify the lighthouse and their own location. Different patterns and lengths of flashes are unique to a specific lighthouse. Sailors can observe a sequence and then look it up in a reference book that will tell them which lighthouse they have spotted.","灯塔的光束可以用多种方式帮助水手辨认灯塔，也确定自己身在何处。每座灯塔都有自己特有的闪光规律和持续时间。水手可以观察一组闪光的先后规律，然后查阅参考手册，得知看到的是哪座灯塔。"],"type":"paragraph"},{"n":8,"t":["During the day, sailors can identify lighthouses simply by their appearance. Some are short and fat, while others are tall and thin. They can be constructed of many different materials, such as wood, stone, brick, steel, and aluminum. The patterns also differ greatly. Some lighthouses are painted with stripes or a series of diamond shapes that distinguish them. Others are distinguished by their shape—round, square, rectangular, or conical (shaped like a cone).","白天，水手只看外观就能辨认灯塔。有些又矮又粗，有些又高又细。灯塔的建材多种多样，例如木材、石头、砖、钢和铝。外表的图案也各不相同。有些漆上条纹或一连串菱形，便于辨认。还有些靠外形来区分，有圆形、方形、长方形或圆锥形，也就是形如圆锥。"],"type":"paragraph"},{"n":9,"t":["Many lighthouses along America’s coastlines are no longer functioning. Historical societies, concerned community members, and even the National Park Service have preserved them. They are sometimes converted into museums, inns, educational centers, or even private homes. If you ever have a chance to visit one, getting a glimpse of history is worth the trip.","美国沿海的许多灯塔已经停止运作。历史学会、关心灯塔的社区居民，甚至美国国家公园管理局都曾出力保护它们。它们有时会被改成博物馆、旅店、教育中心，甚至私人住宅。如果有机会参观一座灯塔，去看看这段历史，很值得跑一趟。"],"type":"paragraph"}],"original":[{"n":1,"ask":["How do we know that lighthouses have existed for at least 3,000 years?\n________","我们是怎么知道灯塔至少已有三千年历史的？"],"ans":["In Homer’s *Iliad*, which was written about 1200 B.C., he refers to lighthouses.","大约写于公元前 1200 年的荷马史诗《伊利亚特》提到了灯塔。"]},{"n":2,"ask":["How far can the Fresnel lens project light?\n________","菲涅耳透镜能把光投射到多远？"],"ans":["28 miles","28 英里。"]},{"n":3,"ask":["Why aren’t lighthouse keepers necessary for today’s lighthouses?\n________","为什么如今的灯塔不需要看守人？"],"ans":["Almost all the lighthouses are automated.","几乎所有灯塔都可以自动运行。"]},{"n":4,"ask":["What are two ways in which lighthouses may be different from one another?\n________","灯塔可能在哪两个方面各不相同？"],"ans":["Answers will vary. Possible answers: Lighthouses can have different patterns and lengths of flashes.","答案可以不同。参考答案：灯塔的闪光规律和每次闪光的持续时间可以不同。"]},{"n":5,"ask":["Why do you think that historians think it is important to preserve lighthouses?\n________","你觉得历史学家为什么认为保护灯塔很重要？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":6,"ask":["What did early versions of lighthouses look like?\n________","早期的灯塔是什么样的？"],"ans":["They were made of iron baskets that were suspended from long poles.","是挂在长杆上的铁篮。"]},{"n":7,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to share the history of lighthouses\n- ________ to persuade the reader to visit a lighthouse\n- ________ to explain how lighthouses were built","选出最能说明作者写作目的的一项。\nA. 介绍灯塔的历史\nB. 说服读者到灯塔参观\nC. 解释灯塔是怎样建成的"],"ans":["✓ to share the history of lighthouses","A. 介绍灯塔的历史"]},{"n":8,"ask":["In paragraph 3, what does the word automated mean?\n________","第 3 段的 automated 是什么意思？"],"ans":["works by itself","能够自动运行。"]},{"n":9,"ask":["What is the main idea of this selection?\n________","本文的主旨是什么？"],"ans":["Possible answer: Lighthouses are an interesting and important part of coastal American History.","参考答案：灯塔是美国海岸历史中有趣而重要的一部分。"]}]},{"id":"P024","title":["Lighthouse Life","灯塔里的生活"],"lead":["Where will Paloma’s imagination take her?","想象力会把帕洛玛带到哪里？"],"exercise":"P025","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Paloma sat at a computer in the school library. She stared at the blank screen and the blinking cursor. She rummaged around in her backpack for a rubber band, and then she pulled her hair into a thick ponytail. Paloma looked at the computer screen. It was still blank. She sighed and flipped through her notebook to reread Mr. Molina’s assignment. It was due in just two days, and Paloma knew that she couldn’t procrastinate any longer.","帕洛玛坐在学校图书馆的电脑前，盯着空白的屏幕和闪烁的光标。她在背包里翻出一根橡皮筋，把浓密的头发扎成马尾。她又看向电脑屏幕，还是空白。她叹了口气，翻开笔记本，重读莫利纳老师布置的作业。只剩两天就得交了，她知道自己不能再拖。"],"type":"paragraph"},{"n":2,"t":["*Write a creative short story using an experience that you have had recently, Paloma read. Your story should include two examples of figurative language. The finished story should be three to four pages long. Your first draft is due on Friday. Be prepared to share your story with the class and make notes for a revision, which you will have an additional week to complete.*","帕洛玛读道：根据你最近的一次亲身经历，写一个有创意的短篇故事。故事里应包含两个运用比喻等修辞手法的例子。成稿应有三至四页。星期五交第一稿。请做好准备，在班上分享故事，并记下需要修改的地方。之后还有一周可以完成修改。"],"type":"paragraph"},{"n":3,"t":["Paloma and her family had taken a trip to North Carolina’s Outer Banks just before school began. They had visited four different lighthouses, and Paloma had wondered what it would be like to live in a lighthouse. She knew that before lighthouses were automated, they were run and maintained by a lighthouse keeper who lived on the premises. Paloma thought that would have been an interesting job to have, but she wanted to actually live in a lighthouse. Without thinking about it any longer, Paloma began to write the story.","开学前不久，帕洛玛和家人去过北卡罗来纳州的外滩群岛。他们参观了四座不同的灯塔。帕洛玛曾想，在灯塔里生活会是什么样呢？她知道灯塔实现自动运行前，都是由住在那里的灯塔看守人操作和维护的。她觉得那一定是份有趣的工作，不过她真正想要的是住在灯塔里。没再多想，她开始写故事了。"],"type":"paragraph"},{"n":4,"t":["I sat with Sadie curled on my lap and looked out the window at the crashing waves. The heavy rain beat against my lighthouse like a thousand footsteps racing up and down the walls. I held Sadie closer, and she let out a small meow of displeasure. I knew that the coming storm could not be too dangerous if Sadie was still acting normally. I have read that animals can sense changes in weather and will seek shelter from a tornado or hurricane. I was relying on Sadie’s calmness to get me through my first hurricane on the island.","我坐着，萨迪蜷在我的腿上。我望向窗外，看着海浪猛烈拍打。大雨打在我的灯塔上，仿佛有上千双脚沿着墙壁上下飞奔。我把萨迪搂紧了些，它不满地轻轻喵了一声。只要萨迪的表现还和平常一样，我就知道即将来临的风暴应该不会太危险。我读到过，动物能感觉到天气变化，在龙卷风或飓风来临时会寻找避风处。我就靠着萨迪的镇定，来撑过我在岛上遇到的第一场飓风。"],"type":"paragraph"},{"n":5,"t":["I knew that my lighthouse was sturdily built. It had survived more than one hundred years’ worth of hurricanes and tropical storms. There was no reason to believe that the bricks and wood could not survive another. I looked up at the staircase that spiraled above me and shuddered as I felt the tower sway slightly in a gust of wind.","我知道自己的灯塔造得很结实。一百多年来，它经受住了许多次飓风和热带风暴。没有理由认为这些砖和木头会经不起又一次风暴。我抬头看着在头顶盘旋而上的楼梯，感觉一阵猛风吹得塔身微微摇了摇，不禁打了个寒战。"],"type":"paragraph"},{"n":6,"t":["Paloma stopped and reread what she had just written. She smiled to herself, saved her story, and then settled into her chair to continue writing. She wasn’t sure what was going to happen next, but she knew that if she just kept going, the story would continue to tell itself. Paloma couldn’t wait to find out where it would take her.","帕洛玛停下来，重读刚写好的文字。她独自笑了笑，存好文档，在椅子上坐定，继续写。她还不知道接下来会发生什么，却知道只要一直写下去，故事就会自己往下发展。她迫不及待想知道，故事会把她带到哪里。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What kind of animal is Sadie? How can you tell?\n________","萨迪是什么动物？你怎么看出来的？"],"ans":["Sadie is a cat. She curls up on Paloma’s lap and meows.","萨迪是一只猫。它蜷在帕洛玛腿上，还会喵喵叫。"]},{"n":2,"ask":["What problem does Paloma have at the beginning of the story?\n________","故事开头帕洛玛面临什么问题？"],"ans":["She is having a hard time thinking of a short story to write, and she is running out of time.","她想不出该写一个怎样的短篇故事，交稿时间又快到了。"]},{"n":3,"ask":["Find an example of a sentence or phrase Paloma uses to create tension in her story.\n________","找出一个帕洛玛用来营造紧张气氛的句子或短语。"],"ans":["Answers will vary.","答案可以不同。"]},{"n":4,"ask":["The next time she has to write a story for school, do you think Paloma will put it off again? Why or why not?\n________","下次学校再布置写故事的作业，你觉得帕洛玛还会拖延吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":5,"ask":["Where does Paloma get her story idea?\n________","帕洛玛是从哪里得到故事灵感的？"],"ans":["from a trip her family took to the Outer Banks","从她和家人到外滩群岛的一次旅行中得到的。"]},{"n":6,"ask":["________ I was relying on Sadie’s calmness to get me through the hurricane.","我就靠着萨迪的镇定来撑过这场飓风。"],"ans":["F","F（第一人称）。"],"dir":["Mark each sentence below **F** if it is in first-person point of view and **T** if it is in third-person point of view.","请给下面每个句子标上 F 或 T，F 表示第一人称视角，T 表示第三人称视角。"]},{"n":7,"ask":["________ Paloma reread Mr. Molina’s assignment.","帕洛玛重读了莫利纳老师布置的作业。"],"ans":["T","T（第三人称）。"]},{"n":8,"ask":["________ I looked up at the staircase and shuddered.","我抬头看向楼梯，打了个寒战。"],"ans":["F","F（第一人称）。"]},{"n":9,"ask":["________","找出第 4 段的明喻，把它写下来。"],"ans":["The heavy rain beat against my lighthouse like a thousand footsteps racing up and down the walls.","大雨打在我的灯塔上，仿佛有上千双脚沿着墙壁上下飞奔。"],"dir":["Find the simile in paragraph 4 and write it on the line below.","找出第 4 段中的明喻，把它写在下面的横线上。"]},{"n":10,"ask":["If you were given the same assignment as Paloma, what would you write about?\n________","如果老师布置给你和帕洛玛一样的作业，你会写什么？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P026","title":["Lighthouse on the Move","迁移灯塔"],"lead":["How would you move a building that is 193 feet tall?","一座高 193 英尺的建筑，你会怎么搬？"],"exercise":"P027","genre":"历史纪实","family":"info","parts":[{"n":1,"t":["There are certain things that people just don’t expect to see move. We expect structures like houses, schools, and office buildings to be stationary objects. That is why many people were surprised to learn that the tallest lighthouse in the United States, the Cape Hatteras Lighthouse in Buxton, North Carolina, was going to be moved in June of 1999.","有些东西，人们压根儿没想到它们会移动。房屋、学校、办公楼之类的建筑，我们总以为会固定在原地。因此，很多人听说美国最高的灯塔，也就是北卡罗来纳州巴克斯顿的哈特拉斯角灯塔，将于 1999 年 6 月搬迁时，都吃了一惊。"],"type":"paragraph"},{"n":2,"t":["Why would anyone want to move a lighthouse? The 193-foot-tall lighthouse was built between 1868 and 1870. It weathered countless storms, as well as many hurricanes. It guided sailors away from the Diamond Shoals, a dangerous, shallow area about 14 miles off the coast of Cape Hatteras.","为什么要搬走一座灯塔？这座高 193 英尺的灯塔于 1868 至 1870 年间建造，经受过无数次风暴，也扛住过许多次飓风。它引导水手避开钻石浅滩。那片水域位于哈特拉斯角外约 14 英里处，水浅而危险。"],"type":"paragraph"},{"n":3,"t":["The coastline around the Outer Banks is known as the Graveyard of the Atlantic. It is estimated that more than 230 ships sank there between 1866 and 1945. The Cape Hatteras Lighthouse faithfully did its duty in protecting sailors from harm. This is exactly why it was determined that the lighthouse would have to be preserved. Experts were worried that continued erosion by the pounding waves of the ocean would destroy the lighthouse. They wanted to move it before it collapsed and was swept out to sea.","外滩群岛一带的海岸线被称为“大西洋坟场”。据估计，1866 至 1945 年间，有 230 多艘船在那里沉没。哈特拉斯角灯塔一直忠实地履行职责，保护水手免遭危险。这正是人们决定必须保护这座灯塔的原因。专家担心，海浪不断冲刷海岸，最终会毁掉灯塔。他们想赶在灯塔倒塌、被海浪卷走之前把它搬离原地。"],"type":"paragraph"},{"n":4,"t":["Moving the 4,800-ton lighthouse was no small project. Many people protested the move. They believed that the lighthouse was not strong enough to withstand it. They felt that it should be allowed to remain in the place it had always been. Others thought that moving the lighthouse was not important enough to justify spending the 9.8 million dollars the move would cost. After much debate, it was decided that the project could proceed as planned.","搬动这座重 4,800 吨的灯塔绝不是件小事。许多人反对搬迁。他们认为塔身没有坚固到足以承受搬迁，觉得应该让它留在一直矗立的地方。另一些人认为，搬灯塔这件事没有重要到值得花费 980 万美元。经过长时间争论，人们决定按原计划实施。"],"type":"paragraph"},{"n":5,"t":["The new location for the lighthouse was chosen. It would move a total of about 2,900 feet. In the new location, the Cape Hatteras Lighthouse would stand 1,600 feet from the ocean that threatened to destroy it. The planners estimated that it would take between four and six weeks to move the lighthouse. In reality, it took only about three weeks to complete the job.","人们选定了新址。灯塔总共要移动约 2,900 英尺。搬到新址后，它将离那片可能毁掉它的海水 1,600 英尺。规划人员估计，搬迁需要四至六周。实际完成这项工作只花了约三周。"],"type":"paragraph"},{"n":6,"t":["The lighthouse was moved using the power of seven hydraulic jacks. It sat on pads of rollers that rested on a set of rails, similar to train tracks. After the lighthouse had moved from one set of tracks to the next, the first set of tracks was moved in front of the lighthouse so that it could pass over them again. The process was extremely slow. Many people came to watch what they figured would be a dramatic moment in North Carolina history. But the lighthouse only moved an average of about two inches per minute, which wasn’t all that exciting to watch.","人们用七台液压千斤顶提供动力来移动灯塔。灯塔架在滚轮底座上，滚轮底座放在类似火车轨道的一组轨道上。灯塔从一组轨道移上下一组轨道后，工人就把刚用过的轨道移到灯塔前面，好让它再从上面滚过去。整个过程极慢。许多人赶来，以为能看到北卡罗来纳州历史上激动人心的一幕。可是灯塔平均每分钟只移动约两英寸，看起来就没那么精彩了。"],"type":"paragraph"},{"n":7,"t":["The Cape Hatteras Lighthouse survived the move and has settled into its new home. Some people still look at the vacant spot on the beach where it stood for so many years and feel a sense of sadness. Others are just relieved that the lighthouse was saved so that future generations could appreciate its bold, spiral stripes and proud history.","哈特拉斯角灯塔顺利搬完，已在新址安顿下来。有些人望着海滩上那块空地，想到灯塔曾在那里矗立了这么多年，仍会有些伤感。也有人只是庆幸灯塔保住了，后人还能欣赏它醒目的螺旋条纹，了解它值得骄傲的历史。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Number the events below to show the order in which they happened.\n\n- ________ People were worried that the lighthouse would collapse.\n- ________ The relocation was a success.\n- ________ The Cape Hatteras Lighthouse was completed in 1870.\n- ________ The lighthouse was removed from its existing foundation.\n- ________ Onlookers watched the slow progress of the lighthouse’s move.","给下面的事件标上序号，表示发生的先后顺序。\n人们担心灯塔会倒塌。\n搬迁成功。\n哈特拉斯角灯塔在 1870 年竣工。\n灯塔从原有的地基上移开。\n围观者看着灯塔缓慢移动。"],"ans":["- **2** People were worried that the lighthouse would collapse.\n- **5** The relocation was a success.\n- **1** The Cape Hatteras Lighthouse was completed in 1870.\n- **3** The lighthouse was removed from its existing foundation.\n- **4** Onlookers watched the slow progress of the lighthouse’s move.","按题中所列顺序，分别标 2、5、1、3、4。"]},{"n":2,"ask":["Check the line beside the word or words that best describe what type of passage this is.\n\n- ________ biography\n- ________ fiction\n- ________ historical nonfiction","选出最能说明这篇文章体裁的一项。\nA. 传记\nB. 虚构故事\nC. 历史纪实"],"ans":["✓ historical nonfiction","C. 历史纪实"]},{"n":3,"ask":["Check the sentence that best states the main idea of the passage.\n\n- ________ The Cape Hatteras Lighthouse in Buxton, North Carolina, is the tallest lighthouse in the United States.\n- ________ The process used to move the Cape Hatteras Lighthouse was very slow.\n- ________ In 1999, the Cape Hatteras Lighthouse was moved further inland to prevent its destruction due to erosion.","选出最能概括文章主旨的一句。\nA. 北卡罗来纳州巴克斯顿的哈特拉斯角灯塔是美国最高的灯塔。\nB. 哈特拉斯角灯塔的搬迁过程极为缓慢。\nC. 1999 年，哈特拉斯角灯塔被搬到更靠内陆的地方，以免海岸侵蚀毁掉灯塔。"],"ans":["✓ In 1999, the Cape Hatteras Lighthouse was moved further inland to prevent its destruction due to erosion.","C. 1999 年，哈特拉斯角灯塔被搬到更靠内陆的地方，以免海岸侵蚀毁掉灯塔。"]},{"n":4,"ask":["What are the Diamond Shoals?\n\n________\n\n________","钻石浅滩是什么？"],"ans":["a dangerous, shallow area about 14 miles off the coast of Cape Hatteras","哈特拉斯角近海约 14 英里处一片危险的浅水区。"]},{"n":5,"ask":["What is one reason that some people protested moving the lighthouse?\n\n________\n\n________","有些人反对搬迁灯塔。说出其中一个理由。"],"ans":["Answers will vary. Possible answer: They thought it was too expensive to move it.","答案可以不同。参考答案：他们认为搬迁费用太高。"]},{"n":6,"ask":["What is the Graveyard of the Atlantic?\n\n________\n\n________","什么是“大西洋坟场”？"],"ans":["an area around the Outer Banks, where thousands of ships have sunk","外滩群岛附近的一片海域，已有数千艘船在那里沉没。"]},{"n":7,"ask":["Do you agree with the decision to move to the lighthouse? Explain.\n\n________\n\n________","你同意搬迁灯塔的决定吗？请说明理由。"],"ans":["Answers will vary.","答案可以不同。"]}],"alias":"迁移灯塔"},{"id":"P028","title":["Keeping the Light","守护灯塔"],"lead":["What would it be like to live in a lighthouse?","住在灯塔里是什么感觉？"],"exercise":"P029","genre":"历史纪实","family":"info","parts":[{"n":1,"t":["Imagine living in an isolated place where bad weather was not uncommon and people’s lives depended on you doing your job. This was the life of a lighthouse keeper before lighthouses became automated. Lights that had mirrors and lenses had to be cleaned and polished regularly. The keepers had to be watchful at night to make sure that the lamps stayed lit and there was enough fuel to last the night. When ships wrecked in nearby areas, lighthouse keepers were expected to help with the rescue effort.","想象一下，你住在一个与世隔绝的地方，那里经常天气恶劣，而其他人的性命取决于你能否做好自己的工作。这就是灯塔实现自动运行之前，灯塔看守人的生活。配有反光镜和透镜的灯具必须定期清洁、擦亮。夜里，看守人必须留心，确保灯一直亮着，而且燃料足以用一整晚。如果附近发生船只失事，灯塔看守人也应当参加救援。"],"type":"paragraph"},{"n":2,"t":["Because the work was physically demanding and women rarely worked outside the home, the job of lighthouse keeper was most often given to men. However, the job often fell to the daughters or wives of lighthouse keepers when the men were called to war, became ill, or died. Women proved themselves to be equally capable of holding this difficult job that was as much a way of life as it was a career.","这份工作很耗体力，而且那时妇女很少出门工作，因此灯塔看守人通常由男子担任。然而，当他们应征参战、生病或去世时，工作往往落到他们的女儿或妻子身上。妇女证明了自己同样能胜任这项艰苦的工作。守灯塔既是一份职业，也是一种生活方式。"],"type":"paragraph"},{"n":3,"t":["One of the most famous female lighthouse keepers was Ida Lewis of Newport, Rhode Island. Her father was the keeper of Lime Rock Lighthouse, but after only a few months at the job he had a stroke. Because Hosea Lewis was no longer able to perform his duties as keeper, 15-year-old Ida and her mother took over in 1853. Captain Lewis lived about 20 years longer, but Ida and her mother performed all the required duties of a keeper.","罗得岛州纽波特的艾达·刘易斯是最著名的女灯塔看守人之一。她的父亲原是莱姆罗克灯塔的看守人，可干了才几个月就中风了。由于霍齐亚·刘易斯已无法履行看守人的职责，1853 年，15 岁的艾达和母亲接下了这份工作。刘易斯船长后来又活了约 20 年，但灯塔看守人的全部职责都由艾达和母亲履行。"],"type":"paragraph"},{"n":4,"t":["Ida was known as the best swimmer in Newport. She was also skilled at handling a rowboat, something that was not seen as particularly appropriate for a woman of that time. However, during her 39 years keeping the light at Lime Rock, Ida rescued between 18 and 25 people. That certainly made it seem less important whether or not Ida’s behaviors were appropriate!","艾达被公认为纽波特最会游泳的人。她也擅长划船，这在当时被认为不大适合女人做。不过，在莱姆罗克守灯塔的 39 年间，艾达救过 18 至 25 人。这一下，艾达的行为是否合乎当时的规矩，就显得没那么重要了！"],"type":"paragraph"},{"n":5,"t":["People were intrigued by this woman who appeared to make her own rules for living. Thousands of visitors came to Lime Rock in hope of seeing Ida Lewis in person. Ida was used to the quiet solitude of a lighthouse keeper’s life, and she was uncomfortable with all the attention. Even so, she couldn’t help being honored by the awards she received for her service. President Ulysses S. Grant made a trip to Rhode Island to visit Ida and to commend her on her heroism.","人们对这位似乎按自己的规矩生活的女子很感兴趣。成千上万的游客来到莱姆罗克，希望亲眼见见艾达·刘易斯。艾达早已习惯守塔时清静独处的日子，这么多人关注她，令她很不自在。即便如此，因为自己的功劳而获奖，她仍不由得感到荣幸。尤利西斯·S. 格兰特总统还特地到罗得岛州看望艾达，嘉奖她的英勇行为。"],"type":"paragraph"},{"n":6,"t":["In 1924, Lime Rock was renamed Ida Lewis Rock in honor of the keeper who had died in 1911. The lighthouse service of Rhode Island also renamed Lime Rock Lighthouse the Ida Lewis Lighthouse. It is the only lighthouse to be named for its keeper.","1924 年，为了纪念这位于 1911 年去世的看守人，莱姆罗克改名为艾达·刘易斯岩。罗得岛州灯塔管理部门也把莱姆罗克灯塔改名为艾达·刘易斯灯塔。这是唯一一座以看守人命名的灯塔。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the words that best describe Ida Lewis.\n\n- ________ hardworking\n- ________ strong-willed\n- ________ determined\n- ________ unpredictable\n- ________ nosy","勾选最能描述艾达·刘易斯的词。\nA. 勤劳的\nB. 意志坚定的\nC. 有决心的\nD. 难以预测的\nE. 爱打听别人私事的"],"ans":["- hardworking\n- strong-willed\n- determined","A. 勤劳的；B. 意志坚定的；C. 有决心的。"]},{"n":2,"ask":["________ It was more common for women than for men to be lighthouse keepers.","女性担任灯塔看守人比男性更常见。"],"ans":["F","F（错误）。"],"dir":["Write **T** before the sentences that are true. Write **F** before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":3,"ask":["________ After his stroke, Captain Lewis was able to resume his job as lighthouse keeper.","刘易斯船长中风后能够继续做灯塔看守人。"],"ans":["F","F（错误）。"]},{"n":4,"ask":["________ Ida kept the light at Lime Rock for 39 years.","艾达在莱姆罗克守了 39 年的灯塔。"],"ans":["T","T（正确）。"]},{"n":5,"ask":["________ President Ulysses S. Grant visited Ida in Rhode Island.","尤利西斯·S. 格兰特总统到罗得岛州看望过艾达。"],"ans":["T","T（正确）。"]},{"n":6,"ask":["________ Today, Lime Rock Lighthouse is called Ida Lewis Lighthouse.","如今，莱姆罗克灯塔叫艾达·刘易斯灯塔。"],"ans":["T","T（正确）。"]},{"n":7,"ask":["Why did all the attention make Ida uncomfortable?\n\n________","为什么这么多人关注艾达会让她不自在？"],"ans":["Ida was used to solitude and quiet of a lighthouse keeper’s life.","她习惯了灯塔看守人清静独处的生活。"]},{"n":8,"ask":["Why do you think that we don’t know for sure how many people Ida rescued?\n\n________","你觉得为什么没法确定艾达救了多少人？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":9,"ask":["How old was Ida when she began tending the lighthouse? ________","艾达开始看守灯塔时多大？"],"ans":["15","15 岁。"]},{"n":10,"ask":["What were two jobs of lighthouse keepers before lighthouses became automated?\n\n________","在灯塔实现自动运行之前，看守人要做哪两项工作？"],"ans":["cleaning and polishing the lamps and lenses, keeping the lamps filled with fuel","清洁、擦亮灯具和透镜，并让灯具保持有足够的燃料。"]},{"n":11,"ask":["Do you think you would have enjoyed being a lighthouse keeper? Why or why not?\n\n________","你觉得自己会喜欢做灯塔看守人吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P030","title":["A Picture Perfect Day","用照片记录的一天"],"lead":["Have you ever taken any photographs?","你拍过照片吗？"],"exercise":"P031","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["“Hold that pose!” said Dante, snapping a photo of his mother.","“别动，保持这个姿势！”但丁边说边给妈妈拍了一张照片。"],"type":"paragraph"},{"n":2,"t":["Dante’s mom looked up in surprise and spilled some of the orange juice she was pouring. “Dante, what are you doing?” she asked, setting the carton of juice on the counter.","但丁的妈妈惊讶地抬起头，手里正在倒的橙汁洒出来一些。“但丁，你在干什么？”她一边问，一边把橙汁盒放到台面上。"],"type":"paragraph"},{"n":3,"t":["“It’s a project I’m doing for school,” Dante explained, sitting down at the table. “For the next two days, I’m going to keep a photo diary of my life.”","“这是学校布置的作业，”但丁解释着，在桌旁坐下，“接下来两天，我要用照片记日记，记录自己的生活。”"],"type":"paragraph"},{"n":4,"t":["Mrs. Carter smiled at her son. “It sounds interesting,” she said. “I’m just not sure that a picture of me in my pajamas pouring orange juice at 7 o’clock in the morning is the most interesting part of your day.”","卡特太太笑着看向儿子。“听起来挺有趣，”她说，“不过，早上七点我穿着睡衣倒橙汁，我可不确定这会是你一天里最有趣的事。”"],"type":"paragraph"},{"n":5,"t":["“I’m not supposed to leave anything out,” replied Dante. “It doesn’t really matter if it’s interesting. This diary should be a realistic narrative of my day. You and breakfast are both a part of my day, so I wanted to make sure they were captured on film.”","“作业要求我什么都别漏掉。”但丁回答，“有不有趣其实不重要。这份日记应该如实记录我的一天。你和早餐都是我这一天的一部分，所以我想一定要把这些都拍下来。”"],"type":"paragraph"},{"n":6,"t":["Mrs. Carter nodded and bit into a slice of toast. “What will you do with your photographs when you’re done? Do you have to present them to your class?”","卡特太太点点头，咬了一口烤面包。“你拍完照之后要怎么处理这些照片？要给全班同学展示吗？”"],"type":"paragraph"},{"n":7,"t":["“I’m going to mount the photos on a piece of posterboard in chronological order,” Dante said. “Then, the class will try to write a brief summary of my day based on the pictures I took.”","“我要按时间顺序把照片贴在一张海报纸板上，”但丁说，“然后，同学们会试着根据我拍的照片，简要概括我的一天。”"],"type":"paragraph"},{"n":8,"t":["“Do your dad and brother know about your photo diary project?” asked Mrs. Carter. “You might want to give them a bit of advance warning if they’re going to be part of it.”","“你爸爸和你兄弟知道你要做照片日记吗？”卡特太太问，“要是也想把他们拍进去，你最好提前打个招呼。”"],"type":"paragraph"},{"n":9,"t":["Just then, Wesley came pounding down the stairs into the kitchen. He was carrying a basketball under one arm and grabbed a piece of toast as he sat down at the table.","就在这时，韦斯利噔噔噔地跑下楼梯，进了厨房。他一边用胳膊夹着篮球，一边在桌旁坐下，顺手抓起一片烤面包。"],"type":"paragraph"},{"n":10,"t":["“Wesley,” said Dante, peering through the camera lens at his brother, “I’m doing a photo diary for school.”","“韦斯利，”但丁透过相机镜头看着自己的兄弟说，“学校让我做一份照片日记。”"],"type":"paragraph"},{"n":11,"t":["Wesley grinned directly at the camera as Dante snapped the photo. Mrs. Carter laughed. “I forgot who I was talking about here,” she said, giving Wesley a quick squeeze on the shoulder. “I guess no explanation is necessary for your brother, Dante,” she said.","但丁按下快门时，韦斯利正对镜头咧嘴笑。卡特太太笑了，伸手捏了捏韦斯利的肩膀。“我都忘了咱们说的是谁了，”她说，“但丁，看来你不用跟你兄弟解释什么。”"],"type":"paragraph"},{"n":12,"t":["“I don’t blame him for wanting to get a picture of me,” said Wesley. “When I make it into the NBA, those pictures will probably be pretty valuable,” he joked.","“我完全理解他为什么要拍我。”韦斯利开玩笑说，“等我进了 NBA，这些照片说不定会很值钱呢。”"],"type":"paragraph"},{"n":13,"t":["Dante laughed as he got up from the breakfast table. “There are some things you just can’t capture in pictures,” he said, shaking his head. He took his dishes to the sink and then managed to get a picture of his dad adjusting his tie as he walked into the kitchen with the newspaper tucked under his arm.","但丁笑着从早餐桌旁站起来，摇摇头说：“有些事，照片怎么也拍不出来。”他把自己的餐具拿到水槽边，正好看见爸爸腋下夹着报纸，边走进厨房边整理领带，就给他拍了张照。"],"type":"paragraph"},{"n":14,"t":["He grabbed Mrs. Carter around the waist as she got up to get another cup of coffee. He waltzed her across the kitchen and then dipped her deeply as she laughed. “Isn’t this going to make it into your diary?” he asked Dante.","卡特太太起身想再倒一杯咖啡，卡特先生一把搂住她的腰，带着她跳起华尔兹，穿过厨房，最后扶着哈哈大笑的她深深向后仰去。“这个不打算放进你的日记吗？”他问但丁。"],"type":"paragraph"},{"n":15,"t":["Dante grinned. “I’m just not sure that my class would be able to work it into the narrative of my day. Like I said, there are some things you just can’t capture in pictures.”","但丁咧嘴笑了。“我只是拿不准同学们能不能把这段编进我这一天的叙述里。就像我说的，有些事，照片怎么也拍不出来。”"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ Keeping a photo diary is a difficult assignment.","做照片日记是一项很难的作业。"],"ans":["O","O（观点）。"],"dir":["Write **F** before the sentences that are facts. Write **O** before the sentences that are opinions.","在陈述事实的句子前写 F，在表达观点的句子前写 O。"]},{"n":2,"ask":["________ Dante’s brother’s name is Wesley.","但丁的兄弟叫韦斯利。"],"ans":["F","F（事实）。"]},{"n":3,"ask":["________ Dante’s classmates will find it easy to create a narrative from his photos.","但丁的同学会觉得用他的照片写出一段叙述很容易。"],"ans":["O","O（观点）。"]},{"n":4,"ask":["________ Mrs. Carter spilled some orange juice.","卡特太太洒了一些橙汁。"],"ans":["F","F（事实）。"]},{"n":5,"ask":["________ Mr. Carter has a good sense of humor.","卡特先生很有幽默感。"],"ans":["O","O（观点）。"]},{"n":6,"ask":["The **protagonist** is the main character in a story, or the person the story is mostly about. Who is the protagonist in this story?\n\n________\n\n________","主人公（protagonist）是故事中最主要的人物，也就是故事主要讲的是谁。这个故事的主人公是谁？"],"ans":["Dante","但丁。"]},{"n":7,"ask":["Why doesn’t Dante want to leave out any details of his day?\n\n________\n\n________","为什么但丁不想漏掉他这一天的任何细节？"],"ans":["He wants it to be a realistic narrative.","他想如实记录这一天。"]},{"n":8,"ask":["Why does Wesley joke that photos of him will be valuable one day?\n\n________\n\n________","为什么韦斯利开玩笑说他的照片有一天会很值钱？"],"ans":["because he wants to be a famous basketball player","因为他想成为著名的篮球运动员。"]},{"n":9,"ask":["During what time of day does the story take place? How can you tell?\n\n________\n\n________","故事发生在一天中的什么时间？你是怎么看出来的？"],"ans":["Morning. The Carters are having breakfast and Mrs. Carter says that it is 7 o'clock in the morning.","早晨。卡特一家在吃早餐，卡特太太也说了是早上七点。"]},{"n":10,"ask":["What is the setting for this story?\n\n________","故事发生在哪里？"],"ans":["the kitchen in Dante's house","但丁家的厨房。"]},{"n":11,"ask":["If you were to make a photo diary of an average day in your life, describe four photos you would want to be sure to include.\n\n________\n\n________\n\n________\n\n________","如果要用照片日记记录平常的一天，请描述四张你一定会放进去的照片。"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P032","title":["Point and Click","对准，按快门"],"lead":["Do you know how a camera works?","你知道相机是怎样工作的吗？"],"exercise":"P033","genre":"说明文","family":"info","parts":[{"n":1,"t":["Cameras might seem almost unbelievable if you do not know how they work. Point a camera at something, push a button, and you end up with a realistic image of what you saw. How does that happen? The camera’s ability to reproduce what you see is not actually all that complicated, once you understand a few basic elements. In fact, the camera itself is just a box that controls how much light reaches the film inside. The original Latin term *camera obscura* means *dark chamber*, and it is a perfect description.","如果不知道相机的工作原理，你可能会觉得它简直不可思议。把相机对准一样东西，按下按钮，就能得到一张如实呈现眼前景象的照片。这是怎么做到的？弄明白几个基本部件之后，你会发现，相机再现眼前景象的原理其实并不复杂。事实上，相机就是一个能控制内部胶片受光量的盒子。最初的拉丁语名称 camera obscura 意为“暗室”，这个名称十分贴切。"],"type":"paragraph"},{"n":2,"t":["Traditional film is a plastic strip that has been coated with light-sensitive chemicals. Like the rods and cones in our eyes, these chemicals change according to how much light enters the camera. The image that enters through the camera’s lens creates a unique pattern in the chemicals that will be used when the photograph is developed in a lab. Instead of chemical film, a digital camera contains a light-sensitive electrical device that records the image.","传统胶片是一条涂有感光化学物质的塑料片。像人眼里的视杆细胞和视锥细胞一样，这些化学物质会随进入相机的光量发生变化。影像通过镜头进入相机，使感光化学物质形成独特的图样，之后冲印室会根据这些图样显影。数码相机里没有化学胶片，而是用感光电子元件记录影像。"],"type":"paragraph"},{"n":3,"t":["Having just the right amount of light reach the film is crucial to taking a good picture. The two main devices that control light are the shutter and the aperture. The shutter is a small door inside the camera that opens and closes when you take a picture. It affects how long the film is exposed to light.","要拍出好照片，照到胶片上的光量必须恰到好处。主要由两个部件控制光线，也就是快门和光圈。快门是相机内部的一扇小门，拍照时会开启再关闭。它影响胶片曝光的时长。"],"type":"paragraph"},{"n":4,"t":["On a typical sunny day, the shutter speed might be as fast as 1/125 of a second to keep too much light from getting in. A quick shutter speed is also needed when you want to capture something that is moving. If the film is exposed too long, the moving object will be a blur in the developed photo.","在一般的晴天，快门速度可能快到 1/125 秒，以免进入过多光线。如果想拍下运动中的物体，也需要较快的快门速度。如果胶片曝光太久，冲印出的照片里，移动的物体就会模糊成一团。"],"type":"paragraph"},{"n":5,"t":["Sometimes, slow shutter speeds are needed. For example, if you want to take a picture at night or in low light, you need to leave the shutter open longer so that enough light can reach the film and create an image. To take photographs of stars or the moon, you would need to have the shutter open for a very long time.","有时也需要较慢的快门速度。例如，要是在夜里或光线昏暗的地方拍照，就得让快门多开一会儿，让足够的光到达胶片，形成影像。如果要拍星星或月亮，就得让快门开很长时间。"],"type":"paragraph"},{"n":6,"t":["The aperture is a circular opening behind the lens that can be adjusted to let in more or less light, similar to the iris in an eye. The aperture also determines the depth of field, or how much of the photo will appear to be in focus. When the aperture is open widely, the focus will only be on a narrow range of objects, but when the aperture is small, things both near and faraway will look sharp.","光圈是镜头后面的一个圆形开口，和眼睛的虹膜一样，可以调节开口大小来控制进光量。光圈也决定景深，也就是照片里有多大范围能清晰成像。光圈开得大，只有狭小范围内的物体会清楚。光圈收小以后，近处和远处的东西看起来都很清晰。"],"type":"paragraph"},{"n":7,"t":["The aperture and shutter speed work together to get just the right amount of light to the film. For instance, if you want to photograph a fast moving object, you need a fast shutter speed, but that may not let in enough light. To compensate, you need to open the aperture wider so that the proper amount of light reaches the film. Of course, a camera with an automatic setting will do all of the adjustments for you, so all you have to do is just “point and click.”","光圈和快门速度相互配合，使胶片得到恰到好处的光量。比如，想拍下快速移动的物体，需要较快的快门速度，可这样进来的光线也许不够。为了补足光量，你需要把光圈开大一些，让胶片获得适量的光。当然，有自动模式的相机可以替你做好全部调节，你只需“对准，按快门”。"],"type":"paragraph"}],"original":[{"n":1,"ask":["make a copy of\n\n________\nPar. 1","仿制，做出一份相同的东西。（第 1 段）"],"ans":["reproduce\nPar. 1","reproduce（复制、再现，第 1 段）"],"dir":["Write the words from the passage that have the meanings below.","从文中找出和下列释义相符的词，写下来。"]},{"n":2,"ask":["a piece of equipment used for a specific purpose\n\n________\nPar. 2","为某个特定用途而使用的设备。（第 2 段）"],"ans":["device\nPar. 2","device（装置，第 2 段）"]},{"n":3,"ask":["allowed to be reached by light\n\n________\nPar. 3","得以被光线照到的。（第 3 段）"],"ans":["exposed\nPar. 3","exposed（曝光的，第 3 段）"]},{"n":4,"ask":["to make up for something\n\n________\nPar. 7","弥补某事物。（第 7 段）"],"ans":["compensate\nPar. 7","compensate（补偿，第 7 段）"]},{"n":5,"ask":["How is a camera’s aperture similar to the iris in a human eye?\n\n________","相机的光圈与人眼的虹膜有什么相似之处？"],"ans":["They are both circular openings that can be adjusted to let in more or less light.","两者都能调节圆形开口的大小，让更多或更少的光线进入。"]},{"n":6,"ask":["What is one example of a time you might want to use a slow shutter speed?\n\n________","举一个你可能想用较慢快门速度的例子。"],"ans":["Possible answer: taking a picture in low light","参考答案：在光线昏暗的地方拍照。"]},{"n":7,"ask":["What does the Latin term *camera obscura* mean?\n\n________","拉丁语 camera obscura 是什么意思？"],"ans":["dark chamber","dark chamber，意为“暗室”。"]},{"n":8,"ask":["How are digital cameras different from traditional cameras?\n\n________","数码相机和传统相机有什么不同？"],"ans":["Digital cameras use a light-sensitive electrical device.","数码相机用感光电子元件。"]},{"n":9,"ask":["What are the two main devices that control light in a camera?\n\n________","相机中主要由哪两个部件控制光线？"],"ans":["the shutter and the aperture","快门和光圈。"]},{"n":10,"ask":["Why do you think it is easier to use an automatic camera than a manual camera?\n\n________","你觉得为什么自动相机比手动相机更好用？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":11,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to persuade\n- ________ to entertain\n- ________ to inform","选出最能说明作者写作目的的一项。\nA. 说服读者\nB. 娱乐读者\nC. 介绍信息"],"ans":["- ✓ to inform","C. 介绍信息"]}]},{"id":"P034","title":["Talking Photos","聊聊摄影"],"lead":["What will Dante learn in his interview with Mr. Salinas?","采访萨利纳斯先生时，但丁会了解到什么？"],"exercise":"P035","genre":"访谈故事","family":"lit","parts":[{"n":1,"t":["“Thanks for taking the time to meet with me, Mr. Salinas,” said Dante, reaching out to shake the photographer’s hand.","“谢谢您抽空见我，萨利纳斯先生。”但丁边说边伸手和这位摄影师握手。"],"type":"paragraph"},{"n":2,"t":["“I’m happy to do it,” replied Mr. Salinas. “I love to talk about my work, and as patient as my family is, I’m sure they still get a little tired of hearing about it all of the time.”","“我很乐意。”萨利纳斯先生回答，“我特别喜欢谈自己的工作。我家里的人虽然很有耐心，但老听我说，想必也有点听腻了。”"],"type":"paragraph"},{"n":3,"t":["“I brought a voice recorder with me,” said Dante, holding up the small black box. “Would it be all right with you if I recorded our conversation?” he asked. “That way, I won’t be distracted by taking notes, and I can transcribe it later.”","“我带了录音机。”但丁举起一个黑色的小盒子，“您介意我录下我们的对话吗？这样我就不用一边记笔记一边分心，过后还可以把录音整理成文字。”"],"type":"paragraph"},{"n":4,"t":["“That sounds good to me,” said Mr. Salinas. He settled into his chair and took a sip of bottled water. “I’m ready when you are,” he said.","“可以啊。”萨利纳斯先生在椅子上坐定，喝了口瓶装水。“你准备好了，我们就开始。”"],"type":"paragraph"},{"n":5,"t":["*Dante Carter:* When did you first know that you wanted to be a photographer?","但丁·卡特：您最早是什么时候知道自己想成为摄影师的？"],"type":"paragraph"},{"n":6,"t":["*Edward Salinas:* It wasn’t until I had already graduated from college. I was teaching high school English, and I decided to take a photography class just for fun. The class was at a community arts center in downtown Seattle, Washington. It completely changed my life. I went back to school a year later to begin working on a degree in photography.","爱德华·萨利纳斯：那时我已经大学毕业了。我在高中教英语，出于兴趣想上摄影课。那门课在华盛顿州西雅图市中心一家社区艺术中心开设。它彻底改变了我的人生。一年后，我回到学校，开始攻读摄影专业的学位。"],"type":"paragraph"},{"n":7,"t":["*DC:* Who has been your greatest influence?","但丁：谁对您的影响最大？"],"type":"paragraph"},{"n":8,"t":["*ES:* Well, I have been lucky to have had several wonderful mentors who encouraged and inspired me. After I completed my photography degree, I had a year-long internship with a very talented photographer named Elizabeth Chu. For the most part, she documented people’s lives through photography. She had an amazing ability to capture so much character and personality in a single image.","萨利纳斯：我很幸运，遇到过几位很棒的导师，他们给了我鼓励和启发。拿到摄影学位后，我跟着一位很有才华的摄影师伊丽莎白·朱实习了一年。她的作品大多用照片记录人们的生活。她有一种惊人的本领，一张照片就能把一个人的性格和个性表现得非常充分。"],"type":"paragraph"},{"n":9,"t":["*DC:* What other photographers do you admire?","但丁：您还欣赏哪些摄影师？"],"type":"paragraph"},{"n":10,"t":["*ES:* There are so many, I’m not even sure where to begin. The work of Walker Evans is extraordinary. He is probably best known for his photographs showing the poverty of life in the South during the 1930s. There is a very timeless and human aspect to his work. Alfred Stieglitz was influential in promoting the work of photographers as artists. His images of New York during the first part of the 20th century are stunning.","萨利纳斯：太多了，我甚至不知道从谁说起。沃克·埃文斯的作品很出色。他最出名的可能是展现 20 世纪 30 年代美国南部贫困生活的那些照片。他的作品有一份超越时代的人情味。阿尔弗雷德·斯蒂格利茨在推动人们把摄影师视为艺术家、认可他们的作品方面很有影响力。他拍摄的 20 世纪初纽约影像令人惊叹。"],"type":"paragraph"},{"n":11,"t":["*DC:* What do you find most rewarding about your job?","但丁：这份工作最让您有成就感的是什么？"],"type":"paragraph"},{"n":12,"t":["*ES:* I suppose I’m most grateful that it doesn’t feel like a job to me, even though it can often be hard work. There are plenty of frustrations when photos don’t turn out the way I had anticipated. But documenting life and nature and beauty is very gratifying. I can’t imagine anything else I’d rather do.","萨利纳斯：我想，我最感激的是，尽管它常常很辛苦，我却没觉得这是份差事。照片拍出来没有达到预期时，也难免受挫。但能记录生活、自然和美，我已经很满足了。我想不出还有什么事更愿意做。"],"type":"paragraph"},{"n":13,"t":["*DC:* Mr. Salinas, this has been really helpful. Thank you for meeting with me and sharing so much about your experiences. I’d like to be a photographer one day myself. Your comments were inspiring.","但丁：萨利纳斯先生，这真是太有帮助了。谢谢您见我，也谢谢您分享这么多经历。我有一天也想当摄影师。您说的话让我很受启发。"],"type":"paragraph"},{"n":14,"t":["*ES:* I wish you the best of luck, Dante. From what I’ve seen, you have the motivation and ability to succeed at just about anything you put your mind to.","萨利纳斯：祝你好运，但丁。从我看到的情况来说，只要你下定决心，你就有动力也有能力把几乎任何事做好。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why does Dante want to record his interview with Mr. Salinas?\n\n________","但丁为什么想录下他对萨利纳斯先生的采访？"],"ans":["He does not want to be distracted by having to take notes.","他不想因为记笔记而分心。"]},{"n":2,"ask":["What job did Mr. Salinas have before he became a photographer?\n\n________","成为摄影师之前，萨利纳斯先生做什么工作？"],"ans":["high school English teacher","高中英语老师。"]},{"n":3,"ask":["Name two people who have influenced Mr. Salinas’s work.\n\n________","说出两个影响过萨利纳斯先生摄影工作的人。"],"ans":["Possible answers: Elizabeth Chu, Walker Evans, Alfred Stieglitz","参考答案：伊丽莎白·朱、沃克·埃文斯、阿尔弗雷德·斯蒂格利茨，任选两人。"]},{"n":4,"ask":["What does Mr. Salinas like about his job?\n\n________","萨利纳斯先生喜欢这份工作的什么地方？"],"ans":["Possible answers: It does not feel like a job.","参考答案：这份工作没有让他觉得自己是在做一份差事。"]},{"n":5,"ask":["Mr. Salinas was ________ with the work of Alfred Stieglitz and Walker Evans.\n\n- uninterested\n- impressed\n- disappointed","萨利纳斯先生对阿尔弗雷德·斯蒂格利茨和沃克·埃文斯的作品感到____。\nA. uninterested（不感兴趣的）\nB. impressed（印象深刻的）\nC. disappointed（失望的）"],"ans":["impressed","B. impressed（印象深刻的）"],"dir":["Circle the word that best completes each sentence below.","圈出最适合补全下面每个句子的单词。"]},{"n":6,"ask":["Dante’s questions for Mr. Salinas were ________.\n\n- irritating\n- encouraging\n- thoughtful","但丁问萨利纳斯先生的问题很____。\nA. irritating（惹人烦的）\nB. encouraging（鼓舞人的）\nC. thoughtful（经过认真考虑的）"],"ans":["thoughtful","C. thoughtful（经过认真考虑的）"]},{"n":7,"ask":["Mr. Salinas ________ that his work can be frustrating at times.\n\n- mentioned\n- aspired\n- demanded","萨利纳斯先生____，他的工作有时也会让人受挫。\nA. mentioned（提到）\nB. aspired（渴望）\nC. demanded（要求）"],"ans":["mentioned","A. mentioned（提到）"]},{"n":8,"ask":["After his interview with Mr. Salinas, do you think that Dante will still want to become a photographer? Explain your answer.\n\n________","采访萨利纳斯先生之后，你觉得但丁还会想做摄影师吗？请说明理由。"],"ans":["Answers will vary. Possible answer: Yes, at the end of the interview Dante tells Mr. Salinas what an inspiration he has been.","答案可以不同。参考答案：会。访谈最后，但丁告诉萨利纳斯先生，自己从他那里得到了很大的启发。"]},{"n":9,"ask":["List three adjectives you could use to describe Dante in this story.\n\n________","列出三个可以用来描述故事中的但丁的形容词。"],"ans":["Possible answers: Curious, interested, polite","参考答案：好奇、有兴趣、有礼貌。"]}]},{"id":"P036","title":["The World of Ansel Adams","安塞尔·亚当斯的世界"],"lead":["How did Ansel Adams become one of the most well-known nature photographers?","安塞尔·亚当斯是怎样成为最知名的自然摄影师之一的？"],"exercise":"P037","genre":"人物传记","family":"info","parts":[{"n":1,"t":["The name Ansel Adams may not ring a bell with you, but there is a good chance that you would recognize his photographs. Adams’s work includes some of the most beautiful and famous black-and-white nature photographs ever taken.","你可能没听过安塞尔·亚当斯这个名字，但很可能认得他的照片。他的作品中有一些是有史以来最美、最有名的黑白自然摄影作品。"],"type":"paragraph"},{"n":2,"t":["Ansel Adams was born in 1902 near San Francisco, California. Adams’s interest in photography began on a trip to Yosemite National Park when he was 14 years old. His parents had given him a camera as a gift. Adams found that he was mesmerized by the scenery at Yosemite and fascinated by his ability to capture it on film.","安塞尔·亚当斯于 1902 年出生在加利福尼亚州旧金山附近。他对摄影的兴趣始于 14 岁那年去约塞米蒂国家公园的一次旅行。父母送给他一台相机。他被约塞米蒂的风光深深吸引，也着迷于自己竟能用胶片留住这些景色。"],"type":"paragraph"},{"n":3,"t":["Although Adams had already shown much promise as a pianist, photography became a hobby that was just as fulfilling for him. It turned out that his talent for photography was perhaps even greater than that for music.","虽然亚当斯在钢琴演奏上已经显露出很好的前途，但摄影成了另一项同样让他有成就感的爱好。后来人们发现，他在摄影方面的天赋可能比他的音乐天赋还高。"],"type":"paragraph"},{"n":4,"t":["The photographs for which Adams is best known are those that depict the beauty of wild areas. Many of his photos were taken in Yosemite National Park, the site of his first experience with a camera. Others captured images of wild places in the American West, as well as the California coast, near the area where Adams was raised.","亚当斯最出名的摄影作品展现了荒野的美。许多照片拍摄于约塞米蒂国家公园，也就是他第一次使用相机的地方。他还拍摄过美国西部其他地方的荒野，以及他长大的地方附近的加利福尼亚海岸。"],"type":"paragraph"},{"n":5,"t":["One of the things that makes Adams’s work so distinctive is the contrast that is present in so many of his photographs. Although Adams worked in black and white, there is an amazing amount of variety in tone. The darker shades are deep and rich, while the whites are crisp and bright.","亚当斯的作品之所以独特，其中一个原因是，他的许多照片有很鲜明的明暗对比。虽然他拍的是黑白照片，色调的变化却极为丰富。深色饱满浓厚，白色明亮清晰。"],"type":"paragraph"},{"n":6,"t":["Adams was able to achieve this through a system he developed called *zone exposure*. He divided the light in an image into ten different zones. This allowed him to accurately predict what the different shades of gray would look like in a photograph.","亚当斯之所以能做到这一点，是因为他发明了一种叫作分区曝光的系统。他把影像里的光线按亮度分为十个区。这样，他就能准确预判各种深浅的灰色会在照片上呈现出什么样子。"],"type":"paragraph"},{"n":7,"t":["Through his photographs and the time that he spent in nature, Adams became an avid environmentalist. He became involved with the Sierra Club, a conservation group. The photography he did for them brought publicity to many issues they believed were important. His photographs serve as a record of wild areas of the American West—such as Sequoia, Mount Rainier, and Glacier National Parks—before humans had done much to disturb them.","拍摄和亲近自然的经历，让亚当斯成为热心的环保人士。他参加了一个名叫塞拉俱乐部的自然保护组织。他为组织拍摄的照片，使公众关注到该组织认为重要的许多问题。这些照片记录了美国西部的荒野，例如红杉国家公园、雷尼尔山国家公园和冰川国家公园，让人看到大规模人为干扰之前的景象。"],"type":"paragraph"},{"n":8,"t":["Although his prints were often sold to collectors for large sums of money, Adams wanted to make sure that his photographs were available to everyone. Posters were created of several of his best-loved images. They are still available today, in addition to many books on Adams’s work and even calendars that feature his photography. Ansel Adams died in 1984, but his photographs will continue to bring the joy and wonder of the natural world to people for many years to come.","虽然亚当斯的摄影作品常被收藏家高价买走，但他希望人人都能看到自己的照片。有几张最受喜爱的照片被制成了海报。如今，这些海报仍买得到，还有不少介绍亚当斯作品的书，甚至有用他照片制作的日历。安塞尔·亚当斯于 1984 年去世，但在未来很多年里，他的照片还会继续把大自然带来的喜悦和惊奇传递给人们。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the line beside the word or words that best describe what type of passage this is.\n\n- ________ historical fiction\n- ________ biography\n- ________ persuasive","选出最能说明本文体裁的一项。\nA. 历史题材虚构故事\nB. 人物传记\nC. 说服性文章"],"ans":["✓ biography","B. 人物传记"]},{"n":2,"ask":["Check the sentence below that is the best summary for paragraph 7.\n\n- ________ Adams was an environmentalist who was able to help the cause he believed in through his photographs of natural places.\n- ________ Adams visited Sequoia, Mount Rainier, and Glacier National Parks.\n- ________ The Sierra Club is a conservation group.","选出最能概括第 7 段的一句。\nA. 亚当斯是一位环保人士，他通过拍摄自然风景来支持自己认同的事业。\nB. 亚当斯去过红杉、雷尼尔山和冰川国家公园。\nC. 塞拉俱乐部是一个自然保护组织。"],"ans":["✓ Adams was an environmentalist who was able to help the cause he believed in through his photographs of natural places.","A. 亚当斯是一位环保人士，他通过拍摄自然风景来支持自己认同的事业。"]},{"n":3,"ask":["Check the words that best describe Ansel Adams.\n\n- ________ talented\n- ________ anxious\n- ________ enthusiastic\n- ________ creative\n- ________ suspicious","勾选最能描述安塞尔·亚当斯的词。\nA. 有才华的\nB. 焦虑的\nC. 热情的\nD. 有创造力的\nE. 多疑的"],"ans":["- ✓ talented\n- ✓ enthusiastic\n- ✓ creative","A. 有才华的；C. 热情的；D. 有创造力的。"]},{"n":4,"ask":["________ Adams was born on the East Coast.","亚当斯出生在美国东海岸。"],"ans":["F Adams was born on the East Coast.","F（错误）。"],"dir":["Write **T** before the sentences that are true. Write **F** before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":5,"ask":["________ Adams received his first camera from a teacher.","亚当斯的第一台相机是老师送的。"],"ans":["F Adams received his first camera from a teacher.","F（错误）。"]},{"n":6,"ask":["________ Adams was also a talented musician.","亚当斯也是一位有才华的音乐家。"],"ans":["T Adams was also a talented musician.","T（正确）。"]},{"n":7,"ask":["________ The majority of Adams’s photographs are black and white.","亚当斯的大多数照片是黑白的。"],"ans":["T The majority of Adams’s photographs are black and white.","T（正确）。"]},{"n":8,"ask":["________ Adams is still alive and lives California today.","亚当斯现在还活着，住在加利福尼亚州。"],"ans":["F Adams is still alive and lives California today.","F（错误）。"]},{"n":9,"ask":["to sound familiar ________","听起来耳熟。"],"ans":["ring a bell","ring a bell（唤起印象，听起来耳熟）"],"dir":["Write the idiom from paragraph 1 on the line next to its meaning.","从第 1 段找出与释义相符的习语，写在释义旁边的横线上。"]},{"n":10,"ask":["In paragraph 7, it says that Adams was an “avid environmentalist.” What does this mean?\n\n________\n\n________","第 7 段说亚当斯是一位 avid environmentalist，这是什么意思？"],"ans":["Possible answers: Someone who very strongly\nbelieves in and works for environmental causes","参考答案：一个坚信保护环境的重要性，并积极投身环保事业的人。"]}]},{"id":"P038","title":["Photographing History","用相机记录历史"],"lead":["Who was Margaret Bourke-White, and why is her work still so respected today?","玛格丽特·伯克-怀特是谁？为什么她的作品直到今天仍受到敬重？"],"exercise":"P039","genre":"人物传记","family":"info","parts":[{"n":1,"t":["What do the following people and places have in common—the Indian leader Gandhi, the survivors of the World War II concentration camps, the Great Depression, the steel mills of Cleveland, Ohio, and the Arctic Circle? Margaret Bourke-White photographed them all during her career as a photojournalist. She was present for many monumental events of the 20th century, and she recorded them with courage and sensitivity.","印度领袖甘地、第二次世界大战集中营的幸存者、经济大萧条、俄亥俄州克利夫兰的钢铁厂以及北极圈，这些人、地方和事件有什么共同之处？玛格丽特·伯克-怀特在担任摄影记者期间全都拍摄过。20 世纪许多重大事件发生时，她就在现场，并以勇气和敏锐的观察力把它们记录下来。"],"type":"paragraph"},{"n":2,"t":["Margaret Bourke-White was born in New York in 1904. In college, she studied biology and planned to be a herpetologist, a scientist who studies reptiles and amphibians. Then, she took a class in photography and discovered a new passion.","玛格丽特·伯克-怀特于 1904 年出生在纽约。大学里，她学的是生物学，原本打算成为一名两栖爬行动物学家，也就是研究爬行动物和两栖动物的科学家。后来，她上了一门摄影课，发现自己有了新的热爱。"],"type":"paragraph"},{"n":3,"t":["After graduating from college, Bourke-White headed to Cleveland, where she photographed the steel mills that were so prevalent in that city. In the 1920s, American industry was booming and the country was growing. Bourke-White documented much of this growth and the factories where it was taking place. Although the material she was covering was cold and industrial, Bourke-White managed to make the photographs of machinery and factories both artistic and beautiful.","大学毕业后，伯克-怀特去了克利夫兰，拍摄城里随处可见的钢铁厂。20 世纪 20 年代，美国工业蓬勃发展，整个国家也在成长壮大。伯克-怀特记录下了其中许多发展景象，以及这个过程发生的工厂。她拍的是冰冷的工业题材，却能把机械和工厂拍得既有艺术性又美观。"],"type":"paragraph"},{"n":4,"t":["A publisher named Henry Luce was very impressed with Bourke-White's photographs of American industry and hired her to work at his magazine, *Fortune*. When he began a new magazine called *LIFE* in 1936, Bourke-White was one of Luce's first four photographers. In fact, her picture of a Montana dam was featured on the cover of the magazine's first issue.","出版人亨利·卢斯对伯克-怀特拍摄美国工业的照片印象深刻，聘她到自己创办的《财富》杂志工作。1936 年，他创办新杂志《生活》时，伯克-怀特是首批四名摄影师之一。事实上，第一期杂志的封面就用了她拍摄的一座蒙大拿州水坝的照片。"],"type":"paragraph"},{"n":5,"t":["Bourke-White's work with *LIFE* magazine led her on adventures all across the globe. She was the first foreign photographer to be allowed to take pictures in the Soviet Union in 1930. She took photos of the German siege on Moscow in 1941. As the first female war correspondent of World War II, Bourke-White faced danger on a regular basis. This was at a time when it was still customary for women to work mostly in the home, taking care of a family and a household.","为《生活》杂志工作，让伯克-怀特有机会到世界各地历险。1930 年，她成为第一位获准在苏联拍照的外国摄影师。1941 年，她拍摄了德军围攻莫斯科的情景。作为第二次世界大战期间第一位女性战地记者，伯克-怀特经常面对危险。那个年代，人们仍习惯让妇女主要待在家里，照料家人、料理家务。"],"type":"paragraph"},{"n":6,"t":["One of Bourke-White's closest brushes with danger occurred when she was assigned to cover the U.S. armed forces at the start of the war. On her way to North Africa, the ship she was traveling in was struck by a torpedo and sank. Bourke-White survived the attack and went on to follow and photograph the action of the war. When the concentration camps were liberated several years later at the end of World War II, Bourke-White was there. Wth her camera, she captured some of the most disturbing and moving images ever recorded.","战争刚开始时，伯克-怀特受命报道美国武装部队，一次与危险擦肩而过。前往北非的路上，她乘坐的船被鱼雷击中，沉没了。伯克-怀特在这场袭击中幸存，继续追踪、拍摄战况。几年后，第二次世界大战接近尾声，集中营获解放时，伯克-怀特也在现场。她用相机拍下了一些令人极为不安、也深深触动人心的画面。"],"type":"paragraph"},{"n":7,"t":["As stressful and difficult as her work must have been, Margaret Bourke-White loved what she did. She was the eyes and ears of the world in places most Americans had never visited and never would. Although Bourke-White died at the relatively early age of 67, she had traveled the world and photographed much of what she saw. Her pictures are a permanent record of both her life and the world during the 20th century.","这份工作一定辛苦又充满压力，玛格丽特·伯克-怀特却热爱自己的工作。在那些大多数美国人没去过、也永远不会去的地方，她代全世界的人亲眼看、亲耳听。她年仅 67 岁就去世了，但她已经走遍世界各地，拍下了大量亲眼见到的景象。她的照片成为关于她的一生和 20 世纪世界的永久记录。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the sentence that best states the main idea of the selection.\n\n- ________ Margaret Bourke-White photographed Cleveland's steel mills in the 1920s.\n- ________ Margaret Bourke-White was a talented photojournalist who traveled the world and broke new ground for women.\n- ________ Margaret Bourke-White was one of *LIFE* magazine's first four photogrphers.","选出最能概括文章主旨的一句。\nA. 20 世纪 20 年代，玛格丽特·伯克-怀特拍摄了克利夫兰的钢铁厂。\nB. 玛格丽特·伯克-怀特是一位有才华的摄影记者。她走遍世界各地，也为女性开辟了新的道路。\nC. 玛格丽特·伯克-怀特是《生活》杂志首批四名摄影师之一。"],"ans":["✓ Margaret Bourke-White was a talented photojournalist who traveled the world and broke new ground for women.","B. 玛格丽特·伯克-怀特是一位有才华的摄影记者。她走遍世界各地，也为女性开辟了新的道路。"]},{"n":2,"ask":["Is this selection a fantasy, or does it take place in reality? How can you tell?\n________","文中所写的是虚构的幻想，还是真实发生的事？你是怎么看出来的？"],"ans":["reality; Answers will vary.","是真实发生的事。理由可以不同。"]},{"n":3,"ask":["Why was Bourke-White's job unusual for a woman?\n________","为什么说伯克-怀特的工作对当时的女性来说不同寻常？"],"ans":["At that time it was still customary for women to work mostly in the home.","当时人们仍习惯让女性主要在家里操持家务。"]},{"n":4,"ask":["What did Bourke-White plan to be before she discovered photography?\n________","发现自己喜欢摄影之前，伯克-怀特原本打算做什么？"],"ans":["a herpetologist","两栖爬行动物学家。"]},{"n":5,"ask":["What was unusual about Bourke-White's industrial pictures?\n________","伯克-怀特的工业照片有什么不同寻常之处？"],"ans":["They made photos of machinery and factories artistic and beautiful.","她把机械和工厂拍得既有艺术性又美观。"]},{"n":6,"ask":["Number the events below to show the order in which they happened.\n\n- ________ Bourke-White photographed the liberation of the concentration camps.\n- ________ Bourke-White began working for *LIFE* magazine.\n- ________ Henry Luce hired Bourke-White to work at *Fortune*.\n- ________ Bourke-White graduated from college.","给下列事件标上序号，表示发生的先后顺序。\n伯克-怀特拍摄了集中营获解放的场面。\n伯克-怀特开始为《生活》杂志工作。\n亨利·卢斯聘请伯克-怀特为《财富》杂志工作。\n伯克-怀特大学毕业。"],"ans":["- **4** Bourke-White photographed the liberation of the concentration camps.\n- **3** Bourke-White began working for *LIFE* magazine.\n- **2** Henry Luce hired Bourke-White to work at *Fortune*.\n- **1** Bourke-White graduated from college.","按题中所列顺序，分别标 4、3、2、1。"]},{"n":7,"ask":["What do you find most interesting about Margaret Bourke-White's life?\n________","玛格丽特·伯克-怀特的一生里，你觉得什么最有意思？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P040","title":["Reality Check","了解实情"],"lead":["What will Ari and his mom find out about owning an exotic pet?","阿里和妈妈会发现养异宠有哪些问题？"],"exercise":"P041","genre":"虚构故事","family":"lit","parts":[{"n":1,"t":["Through the kitchen’s glass doors, Ari could see his mom sitting on the back deck. The pale green baby blanket she was knitting was pooled at her side, and she held it up every once in a while to check on her progress.","透过厨房的玻璃门，阿里看见妈妈坐在屋后的露台上。她正在织一条浅绿色的婴儿毯，毯子堆在她身旁。她不时举起来，看看织了多少。"],"type":"paragraph"},{"n":2,"t":["Ari slid open the door and pulled up a chair across from his mom. “Well, hi there,” said Mrs. Stein, smiling at Ari. “What have you been up to this afternoon?”","阿里拉开滑门，拽过一把椅子，在妈妈对面坐下。“哟，你来啦。”斯坦太太朝阿里笑了笑，“今天下午忙什么呢？”"],"type":"paragraph"},{"n":3,"t":["Ari took a sip of his mom’s iced tea. “I was watching this amazing animal show,” he said. “It was about people who have all kinds of exotic pets. Did you know that you can buy Bengal tiger cubs and raise them yourself?” asked Ari excitedly.","阿里喝了一口妈妈的冰茶。“我刚看了个特别精彩的动物节目，”他说，“讲的是养各种异宠的人。你知道有人可以买到孟加拉虎幼崽，自己养大吗？”阿里兴奋地问。"],"type":"paragraph"},{"n":4,"t":["“I’m not sure that’s such a good idea,” said Mrs. Stein, her knitting needles clicking along busily. “Tigers are beautiful, wild creatures,” she added. “I hate to see people trying to domesticate animals that are meant to live in the wild.”","“我觉得这未必是个好主意。”斯坦太太手上的织针忙个不停，咔哒作响。“老虎是美丽的野生动物，”她接着说，“我可不愿意看到人们想把本该生活在野外的动物驯养起来。”"],"type":"paragraph"},{"n":5,"t":["Ari nodded. “A tiger would be a lot of responsibility. It would be almost impossible to give it the space it would need to feel free.","阿里点点头。“养老虎的责任太大了。要给它足够的空间，让它觉得自由，几乎办不到。"],"type":"paragraph"},{"n":6,"t":["“There are other exotic animals that wouldn’t be so dangerous or need a lot of space, though,” said Ari. “I wrote down a few websites where we could find some more information. Could we go look at them?” Ari looked hopefully at his mother.","“不过还有别的异宠，没有那么危险，也用不着那么大的空间。”阿里说，“我记下了几个网站，可以找更多资料。我们能去看看吗？”阿里满怀期待地看着妈妈。"],"type":"paragraph"},{"n":7,"t":["Mrs. Stein sighed and grinned at Ari. “Let me finish this row, and I’ll come inside and take a look at the sites with you. I’m not promising anything, though.”","斯坦太太叹了口气，又朝阿里笑了。“让我织完这一行，就进屋陪你看那几个网站。不过，我可没答应养宠物。”"],"type":"paragraph"},{"n":8,"t":["A few minutes later, Ari and his mom sat side by side in the glow of the computer screen. They saw pictures of miniature foxes with enormous ears, bristly hedgehogs, and boa constrictors. They read advertisements for lion cubs, piranhas, and warthogs.","几分钟后，阿里和妈妈在电脑屏幕的亮光前并排坐着。他们看到了有一双大耳朵的小狐狸、浑身长刺的刺猬和蟒蛇的照片，还读到出售狮子幼崽、食人鱼和疣猪的广告。"],"type":"paragraph"},{"n":9,"t":["Then, they found a website that discussed some of the problems with importing exotic pets. “They didn’t talk about any of this on the show I watched,” said Ari, looking confused. “I had no idea that there were so many abandoned or mistreated exotic pets in this country.”","后来，他们找到一个网站，谈到进口异宠带来的一些问题。“我看的节目可一点也没说这些。”阿里一脸困惑，“我从来不知道，咱们国家有这么多被遗弃或虐待的异宠。”"],"type":"paragraph"},{"n":10,"t":["Ari’s mom shook her head. “I didn’t know either,” she said. “It sounds like the show you saw only presented one side of the story. That’s too bad, isn’t it? I’m sure lots of people see advertisements or shows like the one you saw and don’t really know what they are getting into.”","阿里的妈妈摇摇头。“我也不知道，”她说，“听起来，你看的节目只讲了事情的一面。这很可惜，对不对？我想，许多人看到这类广告或节目时，还真不知道自己要面对些什么。”"],"type":"paragraph"},{"n":11,"t":["Ari looked thoughtful, “Mom, do you think I could write a letter to the show I watched? Now that we’ve done some more research, I’ve changed my mind about owning an exotic pet. They should have explained both sides of the story.”","阿里若有所思。“妈，你觉得我可以给我看的那个节目写封信吗？我们又查了些资料，现在我对养异宠已经改主意了。他们本来应该把两面都说清楚。”"],"type":"paragraph"},{"n":12,"t":["Mrs. Stein patted Ari on the shoulder. “That’s a wonderful idea,” she said. “You’ve made a really mature decision. Someone that responsible could probably handle taking care of a dog or a cat. Do you want to check out a few of the local animal shelters while we’re online?”","斯坦太太拍拍阿里的肩膀。“真是个好主意，”她说，“你作了一个很成熟的决定。像你这样负责任的人，应该能照顾好一只狗或一只猫。既然我们正在上网，你想不想看看附近几家动物收容所？”"],"type":"paragraph"},{"n":13,"t":["Ari couldn’t think of what to say. He hugged his mom hard and turned back to the computer to begin searching for a cat or a dog that needed a good home.","阿里一时不知道说什么。他紧紧抱了抱妈妈，转回电脑前，开始找一只需要有人好好照顾的猫或狗。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What kinds of exotic animals did Ari and his mom see when they were online?\n\n________","阿里和妈妈在网上看到了哪些异宠？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":2,"ask":["Why did Ari decide to write a letter to the television show he watched?\n\n________\n\n________","阿里为什么决定给自己看过的电视节目写信？"],"ans":["Ari thought the show was irresponsible for not explaining both sides of the story.","他觉得节目只说了事情的一面，这种做法不负责任。"]},{"n":3,"ask":["Why did Mrs. Stein say that Ari was mature and responsible?\n\n________\n\n________","斯坦太太为什么说阿里成熟、负责任？"],"ans":["because he made a mature decision about owning an exotic pet","因为他在是否养异宠的问题上作出了成熟的决定。"]},{"n":4,"ask":["Do you think that Ari will be a good pet owner? Why or why not?\n\n________\n\n________","你认为阿里会是个好宠物主人吗？为什么？"],"ans":["Answers will vary. Possible answer: Yes, he cares about the well being of animals.","答案可以不同。参考答案：会，因为他关心动物过得好不好。"]},{"n":5,"ask":["________ I can’t believe we’re going to get a dog or cat!","真不敢相信，我们要养一只狗或猫了！"],"ans":["F","F（第一人称）。"],"dir":["Mark each sentence below **F** if it is in first-person point of view and **T** if it is in third-person point of view.","请给下面每个句子标上 F 或 T，F 表示第一人称视角，T 表示第三人称视角。"]},{"n":6,"ask":["________ Mrs. Stein put down her knitting.","斯坦太太放下了手中的织物。"],"ans":["T","T（第三人称）。"]},{"n":7,"ask":["________ Ari turned on the computer.","阿里打开了电脑。"],"ans":["T","T（第三人称）。"]},{"n":8,"ask":["________ I think that writing a letter is an excellent idea.","我觉得写信是个好主意。"],"ans":["F","F（第一人称）。"]},{"n":9,"ask":["Tell about a time when you read something or watched something that presented only one point of view. How did you feel about it? Did you want to learn more about the other point of view?\n\n________\n\n________\n\n________\n\n________","说说你有一次读到或看到的内容只呈现了一种观点。当时你怎么想？你想多了解一点另一种观点吗？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P042","title":["An Exotic Dilemma","异宠带来的难题"],"lead":["Learn how exotic pets are turning up in unexpected places in Florida.","了解异宠是怎么出现在佛罗里达州一些意想不到的地方的。"],"exercise":"P043","genre":"说明文","family":"info","parts":[{"n":1,"t":["Would you know what to do if you saw a python slithering across your backyard? What about an anteater looking for dinner in your bushes or a seven-foot-long African monitor lizard running across your patio? People who live in most areas of the United States do not have encounters like these. But if you happen to live in southern Florida, there is a chance that you could run into a number of nonnative species that have settled in your hometown.","如果看见一条蟒蛇从自家后院爬过，你知道该怎么办吗？要是有只食蚁兽在灌木丛里找晚饭，或者有条长 7 英尺的非洲巨蜥从露台跑过呢？美国大多数地方的居民不会遇见这样的事。可要是你碰巧住在佛罗里达州南部，就有可能在家乡遇到几种已经在当地定居的外来物种。"],"type":"paragraph"},{"n":2,"t":["Exotic pets have become more and more popular in recent years. People often purchase an animal as a baby without realizing how difficult it may be to care for that animal when it is fully-grown.","近些年来，异宠越来越受欢迎。人们常在动物还是幼崽时把它买回家，却没想到它长大以后会多么难照顾。"],"type":"paragraph"},{"n":3,"t":["For example, Burmese pythons are easy to buy at exotic pet stores or online. When the snake is young, it does not require much more work than any other pet reptile. But Burmese pythons can grow to be more than 20 feet long and can weigh about 250 pounds. There is not much space in the average American home or yard to care for such a creature! When the snake outgrows its cage and its owner tires of caring for and feeding such a large animal, the snake may be abandoned in a wild area.","比如说，在异宠店或网上很容易买到缅甸蟒。年幼时，照顾它并不比照顾别的爬行动物宠物费劲多少。但缅甸蟒能长到 20 多英尺，体重可达约 250 磅。普通美国家庭的屋子和院子哪有那么多地方养这种动物！等到蟒蛇长得笼子都装不下，主人也厌倦了照顾和喂养这么大的一条蛇，就可能把它丢在野外。"],"type":"paragraph"},{"n":4,"t":["In other parts of the country, it is likely that many of these exotic creatures would not be able to survive long in the wild. But the climate in southern Florida is wet and warm—not unlike the tropical areas where many of the animals are naturally found. Not only can many exotic pets adjust to living in Florida’s natural areas, but if enough of them are released, they can start breeding.","在美国其他地方，这些外来动物到了野外，许多可能活不了多久。佛罗里达州南部的气候却温暖湿润，和许多这类动物原本生活的热带地区相似。不少异宠能适应佛罗里达州的野外环境。放生的数量足够多时，它们甚至会开始繁殖。"],"type":"paragraph"},{"n":5,"t":["The problem with invasive species is that scientists don’t always know in advance which ones will alter the environment or harm native populations. In the last few years, people visiting Florida’s Everglades National Park have watched fights between alligators and pythons.","入侵物种带来的难题是，科学家并不总能事先知道哪些物种会改变环境，或损害本地种群。近几年来，去佛罗里达州大沼泽地国家公园的游客曾目睹短吻鳄和蟒蛇打斗。"],"type":"paragraph"},{"n":6,"t":["It is not hard to imagine the impact of aggressive creatures. But even animals like vervet monkeys or Cuban tree frogs, which seem harmless, can change the delicate balance of the environment. They may compete with other animals that eat the same plants or insects. If their presence or behavior causes a change in the habits of other animals, the overall changes could be far-reaching.","有攻击性的动物可能带来什么影响，不难想象。可即便是看似无害的绿猴或古巴树蛙，也可能改变环境脆弱的平衡。它们可能会和吃同一种植物或昆虫的动物争夺食物。如果它们的存在或行为使其他动物改变习性，总体影响就可能很深远。"],"type":"paragraph"},{"n":7,"t":["Think about dominos lined up next to one another. None of them may be touching, but as soon as you tip one over, the whole row will tumble. This is not unlike the way plants and animals in the environment react to one another. One small change can set off a whole series of changes that not even scientists can predict.","想象一排挨个摆好的多米诺骨牌。牌与牌也许彼此并不接触，可只要推倒一块，整排就会倒下。环境中的植物和动物彼此影响，和这很像。一点小变化就能引发一连串变化，连科学家也无法预料。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to entertain\n- ________ to instruct\n- ________ to inform","选出最能说明作者写作目的的一项。\nA. 娱乐读者\nB. 指导操作\nC. 介绍信息"],"ans":["✓ to inform","C. 介绍信息"]},{"n":2,"ask":["An **analogy** is a comparison between two things that may seem to be unalike but that have at least one similarity. An analogy is used to compare two things in paragraph 7. What are they?\n________","类比（analogy）是把看起来不同、却至少有一点相似的两样事物拿来比较。第 7 段用了类比，把哪两样事物进行比较？"],"ans":["dominoes and the environment","多米诺骨牌和自然环境。"]},{"n":3,"ask":["Name two animals that are nonnative species in southern Florida.\n________","说出在佛罗里达州南部属于外来物种的两种动物。"],"ans":["Answers will vary. Possible answer: anteater and African water monitor lizard.","答案可以不同。参考答案：食蚁兽和非洲水巨蜥。"]},{"n":4,"ask":["Why is it hard to care for a full-grown Burmese python?\n________","为什么长大的缅甸蟒很难照顾？"],"ans":["because it is so large","因为它体型太大。"]},{"n":5,"ask":["Why are exotic pets more likel
