"id":"R6-P146-B4-01","skill":"B4","pages":["P146"],"src":1,"stem":["Why are interviews with older relatives useful alongside Internet research?","除了上网查资料，采访年长的亲戚为什么有用？"],"o":[["They can preserve memories that may not appear in online records.","采访可以保留网上记录里可能找不到的记忆。"],["Relatives always know every official date without error.","亲戚永远记得每个官方日期，绝不会记错。"],["Online records contain no names or birth information.","网上的记录没有名字或出生资料。"],["Interviews make it unnecessary to record any sources.","有了采访，就完全不必记录资料来源。"]],"key":0,"why":["Will finds names, birth records, and obituaries online. Older relatives remember stories and details he cannot find anywhere else, so the interviews complement the documentary records.","Will 区分网上的姓名、生卒资料与长辈记忆，并说有些事在别处找不到。这体现根据目的结合不同信息来源，而非认定一种来源绝对可靠。"],"ev":[{"p":"P146","n":6,"quote":"The Internet has been pretty helpful in finding names, birth records, and obituaries."},{"p":"P146","n":6,"quote":"There are things that they remember that I wouldn't have been able to find anywhere else."}]},{"id":"R6-P148-A1-01","skill":"A1","pages":["P148"],"src":null,"stem":["Which statement best states the main idea?","哪句话最能表达本文的中心思想？"],"o":[["The Sea Islands are important only because of new shopping malls.","海岸群岛只因为新开的购物中心才重要。"],["The passage is mainly instructions for building a fishing boat.","本文主要介绍怎样造一艘渔船。"],["Gullah refers only to the name of one island.","古拉只是某一座岛的名字。"],["The Sea Islands preserve distinctive Gullah language and traditions, with efforts to pass them on.","海岸群岛保存着独特的古拉语和传统，人们努力把它们传承下去。"]],"key":3,"why":["The passage traces the development of Gullah culture and language, describes traditions such as basket weaving and net making, and explains efforts to preserve them.","全文从文化和语言的形成写到篮编、渔网等传统，再谈保存与传承，中心思想应覆盖这些方面。"],"ev":[{"p":"P148","n":1,"quote":"But if you were to visit the islands, you would discover a unique culture and way of life that have been preserved for more than a century."},{"p":"P148","n":5,"quote":"They are doing their best to insure that the language is preserved for future generations."},{"p":"P148","n":6,"quote":"They have many traditions that are an important part of their culture."}]},{"id":"R6-P148-B2-01","skill":"B2","pages":["P148"],"src":4,"stem":["Why did many African customs remain relatively unchanged on the Sea Islands?","为什么许多非洲习俗在海岸群岛上几乎没有变化？"],"o":[["The islands’ isolation limited contact with mainstream culture.","岛屿相对孤立，人们很少接触主流文化。"],["Every family was required to speak only one European language.","每户人家都只能说同一种欧洲语言。"],["The islands were located far inside a desert.","这些岛位于遥远的沙漠深处。"],["No one on the islands ever worked or traveled.","岛上从来没有人工作或出远门。"]],"key":0,"why":["Paragraph 3 says the islands could be reached only by boat. Limited contact with mainstream culture helped the islanders preserve many customs.","第3段明确写只能坐船到达，使居民相对隔离，因此保留了许多传统。"],"ev":[{"p":"P148","n":3,"quote":"Because the islands were accessible only by boat, the people were isolated from mainstream culture."},{"p":"P148","n":3,"quote":"Because the islands were accessible only by boat, the people were isolated from mainstream culture."}]},{"id":"R6-P148-A3-01","skill":"A3","pages":["P148"],"src":9,"stem":["Which sentence best summarizes paragraph 5?","哪句话最能概括第5段？"],"o":[["The Gullah language has never faced any pressure to change.","古拉语从未面临过任何迫使其变化的压力。"],["The paragraph describes how to weave a basket from sweetgrass.","这一段介绍怎样用甜草编篮子。"],["Dictionaries were created to replace every living speaker.","人们编词典是为了取代所有在世的古拉语使用者。"],["Although Gullah seemed at risk of disappearing, people are recording and documenting it to preserve it.","古拉语一度似乎有消失的危险，人们正为保护它而录音并记录词汇。"]],"key":3,"why":["Paragraph 5 describes the risk of the language dying out and the response: recording speakers and compiling dictionaries to preserve Gullah.","该段由语言可能消失转到录音、编词典等保护行动；概括应包括威胁与应对，而不只说“语言很特别”。"],"ev":[{"p":"P148","n":5,"quote":"For many years, it seemed as though the Gullah language was in danger of dying out, as the culture became more influenced by the culture of the rest of the United States."},{"p":"P148","n":5,"quote":"However, historical preservationists have been recently recording people speaking the language, as well as compiling dictionaries of various words and their meanings and pronunciation."},{"p":"P148","n":5,"quote":"However, historical preservationists have been recently recording people speaking the language, as well as compiling dictionaries of various words and their meanings and pronunciation."}]},{"id":"R6-P150-B5-01","skill":"B5","pages":["P150"],"src":5,"stem":["Which subject would most likely appear in a painting like those described?","哪种题材最可能出现在文中所描写的这类画作中？"],"o":[["A diagram of an airplane engine","飞机发动机的示意图。"],["A product chart for factory machinery.","工厂机器的产品图表。"],["Sea Island fishermen bringing in their nets","海岸群岛上正在收网的渔民。"],["An invented city on another planet","另一颗星球上一座虚构的城市。"]],"key":2,"why":["Paragraph 4 describes paintings of everyday Gullah life in the Sea Islands. Fishermen hauling in their nets fit this coastal setting and focus on daily activity.","根据第4段“日常 Gullah 生活”和海岛环境判断新例子，渔民收网最符合这一题材范围。"],"ev":[{"p":"P150","n":4,"quote":"Jonathan Green’s artwork is filled with everyday images of Gullah life as he remembered it growing up."},{"p":"P150","n":4,"quote":"Water is found in many of his paintings because it plays an important role in the lives of people who live along the coast and on the islands."}]},{"id":"R6-P150-E3-01","skill":"E3","pages":["P150"],"src":null,"stem":["Which description best matches the author’s tone?","哪一项最符合作者的语气？"],"o":[["Uninterested in both the paintings and the islands","对画作和群岛都毫无兴趣。"],["Appreciative of the art and concerned about cultural loss","欣赏画作，也担忧文化流失。"],["Mocking the artist and dismissing his memories","嘲笑这位艺术家，不在乎他的回忆。"],["Celebrating the complete disappearance of local traditions.","庆祝当地传统完全消失。"]],"key":1,"why":["Paragraph 1 praises the bold, lively paintings. Paragraph 6 shows concern for a way of life that is disappearing and values Green’s efforts to preserve its memory.","第1段赞美画作鲜活明亮，第6段关注文化流失及绘画保留记忆的价值，因此同时有赞赏与关切。"],"ev":[{"p":"P150","n":1,"quote":"His paintings are bold and colorful, lively and cheerful."},{"p":"P150","n":6,"quote":"But his paintings can raise awareness of what is in danger of being lost and preserve the memories of a rich and colorful way of life."}]},{"id":"R6-P150-F5-01","skill":"F5","pages":["P150"],"src":2,"stem":["What type of passage is this?","这篇文章属于什么体裁？"],"o":[["A step-by-step painting manual.","逐步指导绘画的手册。"],["A fictional legend about talking colors","关于会说话的颜色的虚构传说。"],["A biography focused on an artist’s background and work","着重介绍一位艺术家的背景和作品的传记。"],["An autobiography written in Green’s own voice","用格林本人的口吻写的自传。"]],"key":2,"why":["The passage uses the third person to describe Green’s upbringing, education, subject matter, and impact. It is a biography.","文章用第三人称介绍 Green 的成长、教育、创作题材和影响，符合传记；并非艺术家本人第一人称讲述。"],"ev":[{"p":"P150","n":2,"quote":"Jonathan Green was born in 1955 in Gardens Corner, South Carolina, a region of the state known as the Low Country."},{"p":"P150","n":3,"quote":"When he completed his military service, Green attended the Art Institute of Chicago."}]},{"id":"L26-3","skill":"A1","pages":["P026"],"src":3,"stem":["Which sentence best states the main idea of the passage?","哪句话最能概括整篇文章的主旨？"],"o":[["The Cape Hatteras Lighthouse in Buxton, North Carolina, is the tallest lighthouse in the United States.","北卡罗来纳州巴克斯顿的哈特拉斯角灯塔是美国最高的灯塔。"],["The process used to move the Cape Hatteras Lighthouse was very slow.","哈特拉斯角灯塔的搬迁过程极为缓慢。"],["In 1999, the Cape Hatteras Lighthouse was moved further inland to prevent its destruction due to erosion.","1999 年，为避免海岸侵蚀毁坏灯塔，人们把哈特拉斯角灯塔搬到更靠内陆的地方。"],["Sailors navigating the Outer Banks in the past faced dangers from storms and shoals.","过去在外滩群岛附近航行的水手面临风暴和浅滩的危险。"]],"key":2,"why":["The reason, the engineering work, and the outcome all support the relocation idea. Height and speed each account for only one detail.","第 3 段交代要搬迁灯塔的原因，第 5、6 段说明搬迁过程，第 7 段写搬迁结果。这些内容都围绕人们如何靠搬迁保住灯塔展开。"],"ev":[{"p":"P026","n":3},{"p":"P026","n":5},{"p":"P026","n":6},{"p":"P026","n":7}]},{"id":"LL90-1","skill":"A1","pages":["P090"],"src":1,"stem":["Which sentence best states the central idea of “Living Lights”?","哪句话最能概括《会发光的生物》的主旨？"],"o":[["Disturbed dinoflagellates can produce light that people sometimes see near the surface.","甲藻受到扰动后会发光，人们有时能在海面附近看到这种光。"],["Many ocean organisms make their own light and use it to hide, attract mates, or catch prey.","许多海洋生物能自己发光，并利用这种光来隐藏自己、吸引配偶或捕食。"],["Scientists study the cool light made by living things in hopes of improving artificial lighting.","科学家研究生物发出的冷光，希望改进人造光源。"],["Some squid release glowing material and escape while a predator is distracted.","有些乌贼会释放发光物质，趁捕食者分心时逃走。"]],"key":1,"why":["The book’s sample identifies the shared ability to produce light. A fuller answer also covers its uses in paragraphs 3–6. One species alone is too narrow.","原书参考答案概括了许多海洋动物能自行发光这一共同特点。第3至6段还介绍了光的多种用途。把这两层意思合起来，才能概括全文。"],"ev":[{"p":"P090","n":1},{"p":"P090","n":2},{"p":"P090","n":3},{"p":"P090","n":4},{"p":"P090","n":5},{"p":"P090","n":6},{"p":"P090","n":7}]},{"id":"W120-A","skill":"A1","pages":["P120"],"src":null,"stem":["Which statement best brings together the six pieces of advice for aspiring writers?","哪句话最能概括作者给有志于写作的读者的六条建议？"],"o":[["Noticing everyday events and keeping notes gives writers material for their next piece.","留意日常生活中的见闻，并随手记下来，就能为下一篇作品积累素材。"],["Trading feedback with a writing group can help authors improve their work.","在写作小组里互相提意见，可以帮助写作者改进作品。"],["Researching publications and following guidelines helps writers find an audience for their work.","了解准备投稿的刊物，并遵守它的投稿要求，有助于让作品找到合适的读者。"],["Writers develop by reading, practicing, learning from feedback, and persisting as they seek publication.","写作者可以通过阅读、练笔、听取反馈，以及在争取发表的过程中坚持不懈，逐步提高写作水平。"]],"key":3,"why":["The last choice covers daily practice, improvement through others, and working toward publication. Each other choice focuses on just part of the advice.","D 涵盖第1条的阅读、第3条的每日练笔、第4条的寻求反馈，以及第5、6条的投稿准备和坚持。A、B、C 分别偏重积累素材、反馈和投稿准备，覆盖的范围较窄。"],"ev":[{"p":"P120","n":1},{"p":"P120","n":2},{"p":"P120","n":3},{"p":"P120","n":4},{"p":"P120","n":5},{"p":"P120","n":6}]},{"id":"J2-2","skill":"B3","pages":["P002"],"src":2,"stem":["What does Emily most likely mean when she says American games may not be as interesting anymore?","艾米莉说，美国棒球赛以后也许再也没那么有意思了。她最可能想表达什么？"],"o":[["The cheering and celebrations made this game an especially exciting experience for her.","现场的助威和庆祝方式让她觉得这场比赛格外精彩。"],["She prefers watching players in Japan because the rules of the game are more complex.","日本棒球的比赛规则更复杂，所以她更喜欢看日本球员比赛。"],["Adding Tokyo to her list means she has now seen all the ballparks she hoped to visit.","把东京加进清单，意味着她已经看遍了自己想去的球场。"],["Seeing American players welcomed abroad makes her want to follow a touring American team.","看到美国球员在国外受到欢迎，她更想去看美国球队的海外巡回赛。"]],"key":0,"why":["The game itself felt familiar, but the crowd and customs stood out. Her last line compares experiences and gives no reason to conclude that she dislikes baseball.","第 12 段说比赛本身与美国棒球赛相似。现场的助威、国旗等细节给艾米莉留下了深刻印象，她觉得这次在日本看球格外有意思。"],"ev":[{"p":"P002","n":9},{"p":"P002","n":11},{"p":"P002","n":12},{"p":"P002","n":17}]},{"id":"J2-4","skill":"B3","pages":["P002"],"src":4,"stem":["Which prediction about another opportunity to attend a Japanese baseball game has the strongest support?","如果还有机会看日本棒球赛，哪项预测最有依据？"],"o":[["Probably not. Both children were tired afterward, suggesting they had lost interest in the game.","不太可能去。两个孩子赛后都累了，可见他们对比赛失去了兴趣。"],["Only Alex would go. He asked about the teams, while Emily was more concerned with going home.","只有亚历克斯会去。他问了球队的名字，艾米莉却更关心什么时候回家。"],["Probably so. Both became absorbed, and Emily wished they could see a game like it back home.","很可能会去。两人都看入了迷，艾米莉还希望回家后也能看这样的比赛。"],["They would wait for a change in rules. They found the game itself too similar to games back home.","他们会等到规则改变再去。他们觉得比赛本身跟在美国看的太相似。"]],"key":2,"why":["Paragraph 12 describes both children’s reaction and paragraph 17 adds Emily’s wish. Feeling tired or recognizing the rules gives little support for declining another outing.","第 12 段写两个孩子都看入了迷，第 17 段写艾米莉希望回家后也能看这种比赛。这两处都支持他们愿意再去看。"],"ev":[{"p":"P002","n":12},{"p":"P002","n":15},{"p":"P002","n":17}]},{"id":"G88-4","skill":"B3","pages":["P088"],"src":4,"stem":["Which inference best explains why the Taylors did not immediately notice the glow in the water?","根据故事推断，泰勒一家为什么没有马上注意到水在发光？"],"o":[["They mistook the glow for the flashlight and waited for Sophie to turn it off.","他们误以为那是手电筒的光，便等索菲关掉手电筒再看。"],["They went out to look at the stars, so their attention was on the sky at first.","他们出门是为了看星星，所以起初把注意力放在了夜空上。"],["They were waiting for the sand to cool, so they stood well back from the shore.","他们在等沙子凉下来，一直站在离水边很远的地方。"],["Their parents had already spotted the glow and planned to point it out once they caught up.","父母已经看见了亮光，打算追上孩子后再指给他们看。"]],"key":1,"why":["The invitation to see the stars, the children looking for constellations, and the father’s final remark all point to their attention being on the sky.","第2段里，妈妈说海上的星星值得一看。第7段里，两个孩子试着辨认星座。第12段里，爸爸回想起大家一直在看天上的星星。这些线索都表明，他们起初把注意力放在了夜空上。"],"ev":[{"p":"P088","n":2},{"p":"P088","n":7},{"p":"P088","n":12}]},{"id":"G88-5","skill":"B3","pages":["P088"],"src":5,"stem":["Which prediction about the children after the trip is best supported by the story?","旅行结束后，孩子们最可能做什么？选出最有文本依据的预测。"],"o":[["They may avoid beaches at night because the glowing water made them afraid to touch it.","他们可能避开夜里的海滩，因为发光的水让他们不敢再碰。"],["They may study only constellations because they went back to stargazing after seeing the glow.","他们可能只研究星座，因为看到水发光后，他们又专心看起了星星。"],["They may buy a new flashlight because they thought it caused the green patterns.","他们可能去买一支新手电筒，因为他们以为水里的绿色光纹是手电筒照出来的。"],["They may learn more about bioluminescence because they kept testing the water and Sophie asked what caused the light.","他们可能进一步了解生物发光，因为他们反复拨水观察，索菲还主动问为什么会发光。"]],"key":3,"why":["Repeatedly testing the water and asking about it show curiosity. The story ends on the beach, so continued learning is a prediction.","第7、8段写两人用脚和手拨动海水，第10、11段写索菲追问发光原因、妈妈作出解释。这些行动表明他们很好奇，支持回家后可能继续了解的预测。"],"ev":[{"p":"P088","n":7},{"p":"P088","n":8},{"p":"P088","n":10},{"p":"P088","n":11}]},{"id":"G88-1","skill":"B4","pages":["P088"],"src":1,"stem":["Which detail most directly supports the idea that Mrs. Taylor was amazed by what she saw?","哪项细节最直接表现出泰勒太太为亲眼看到的现象感到惊奇？"],"o":[["She suggested taking a walk to see the stars over the ocean.","她提议去海滩散步，看看海面上空的星星。"],["She crouched beside her daughter to see what the children had found.","她在女儿身旁蹲下，想看看孩子们发现了什么。"],["She gasped and exclaimed in wonder as she swirled her hand through the water.","她惊得倒吸一口气，一边用手拨动海水，一边惊叹。"],["She told Sophie that tiny organisms in the water could make light.","她告诉索菲，水里的微小生物能发光。"]],"key":2,"why":["Paragraph 9 combines her gasp, movement, and exclamation. Suggesting a walk, crouching, and explaining the glow provide less direct evidence of amazement.","第9段里，泰勒太太惊得吸了口气，拨动水面时还说“太不可思议了！”这两个反应直接表现出她的惊奇。"],"ev":[{"p":"P088","n":9},{"p":"P088","n":10}]},{"id":"J2-B4","skill":"B4","pages":["P002"],"src":null,"stem":["Which detail most directly shows that both children were absorbed in the game?","哪个细节最直接说明两个孩子都被比赛吸引了？"],"o":[["Mrs. Ito said it promised to be a good game.","伊藤太太说这场比赛应该会很精彩。"],["Once the game began, Emily and Alex quickly became engrossed.","比赛一开始，艾米莉和亚历克斯很快就看入了迷。"],["Some vendors sold popcorn and hot dogs.","有些摊贩卖爆米花和热狗。"],["Emily said that she and Alex kept track of cities where they had seen games.","艾米莉说，她和亚历克斯记下了看过棒球赛的城市。"]],"key":1,"why":["The evidence must concern both children and their engagement. Mrs. Ito’s expectation and the food sold at the park satisfy neither condition.","第 12 段的“很快就看入了迷”直接写出两个孩子在看比赛时都十分投入。"],"ev":[{"p":"P002","n":8},{"p":"P002","n":12},{"p":"P002","n":14}]},{"id":"J2-8","skill":"C5","pages":["P002"],"src":8,"stem":["In paragraph 8, what does Mrs. Ito mean when she says baseball isn’t her “cup of tea”?","第 8 段里，伊藤太太说“Baseball isn’t my cup of tea”（棒球不太合我的口味）。她是什么意思？"],"o":[["Baseball is not something she particularly enjoys.","她个人对棒球兴趣不大。"],["She usually watches baseball only when she has tea.","她通常只在喝茶的时候看棒球。"],["She is unsure which team will win today’s game.","她拿不准今天哪支球队会赢。"],["She wants to change seats to see the game better.","她想换个座位，以便看清比赛。"]],"key":0,"why":["The negative idiom expresses personal preference. She can have little interest in baseball herself yet still expect a good game.","cup of tea 是习语，指一个人喜欢的事物。伊藤太太平时对棒球兴趣不大，但她觉得这场比赛应该会很精彩。"],"ev":[{"p":"P002","n":8}]},{"id":"G88-11","skill":"C5","pages":["P088"],"src":11,"stem":["In paragraph 1, what does “caught their second wind” mean?","第1段中的“caught their second wind”是什么意思？"],"o":[["They felt another breeze coming off the sea.","他们感觉海上又吹来一阵风。"],["They decided to stop and catch their breath.","他们决定停下来喘一口气。"],["They regained energy and felt ready to do more.","他们重新有了精神，愿意继续活动了。"],["They began to feel sleepy as the sun went down.","太阳落山后，他们开始犯困。"]],"key":2,"why":["Dinner and board games are followed by a willingness to take a walk. That sequence supports renewed energy, rather than a change in the weather.","第1段写一家人吃过晚饭、玩过桌游，第2段接着写妈妈提议去海滩散步。这时大家又有了精神，能接着活动。"],"ev":[{"p":"P088","n":1},{"p":"P088","n":2}]},{"id":"W120-3","skill":"C5","pages":["P120"],"src":3,"stem":["In the advice about sending out writing, what does “Do your homework” mean?","在第5条投稿建议中，“Do your homework”（先做足功课）指什么？"],"o":[["Finish a school writing assignment before contacting a publisher.","先完成学校布置的写作作业，再联系出版社。"],["Research whether the publication is a good fit and check its submission guidelines.","先了解刊物是否适合自己的作品，再核对对方的投稿要求。"],["Ask a writing group to select a piece and write it for submission.","请写作小组帮忙选一篇作品，并代写投稿稿件。"],["Take each day’s writing home and wait until a holiday to think about publishing.","把每天写的东西带回家，等到放假再考虑发表。"]],"key":1,"why":["The actions listed below the heading define the expression in a publishing context. It calls for preparation and research.","第5条举例说，向杂志投稿前要翻阅往期刊物，向出版社投稿前要了解它出版的其他书。紧接着的一段提醒读者按要求提交作品。因此，“先做足功课”指投稿前查资料并核对要求。"],"ev":[{"p":"P120","n":5}]},{"id":"L26-D","skill":"D1","pages":["P026"],"src":null,"stem":["How does the focus shift from paragraphs 3–4 to paragraphs 5–6?","从第 3、4 段到第 5、6 段，作者的说明重点怎样变化？"],"o":[["From marine life near the lighthouse to the sailors’ daily lives.","从灯塔附近的海洋生物转向水手的日常生活。"],["From the machinery used in the move to the date the tower was built.","从搬迁所用的设备转向灯塔建造的年代。"],["From reasons for saving the tower and objections to the move to the plan and how the move was carried out.","从保护灯塔的理由和反对搬迁的意见，转向搬迁计划和实施过程。"],["From comparing the histories of two lighthouses to deciding which one to preserve.","从比较两座灯塔的历史转向决定保留哪一座。"]],"key":2,"why":["Erosion and objections dominate paragraphs 3–4. Measurements and machinery take over in paragraphs 5–6. The shift is from justification to execution.","第 3 段写海岸侵蚀带来的威胁，第 4 段写反对搬迁的意见。第 5、6 段接着写新址、工期和搬迁设备。"],"ev":[{"p":"P026","n":3},{"p":"P026","n":4},{"p":"P026","n":5},{"p":"P026","n":6}]},{"id":"W120-D","skill":"D1","pages":["P120"],"src":null,"stem":["Which sequence accurately describes how the six pieces of advice are organized?","哪一项准确说明了这六条建议的编排顺序？"],"o":[["Coping with rejection comes first, followed by reading and practicing, then submitting work.","先讲怎样应对退稿，再讲阅读和练笔，最后介绍如何投稿。"],["Publishing rules come first, followed by gathering ideas, then joining a writing group.","先介绍投稿规则，再建议寻找素材，最后说明怎样加入写作小组。"],["Reading magazines comes first, followed by how writers become famous, then comparing publishers.","先说怎样阅读杂志，再讲作家怎样成名，最后比较不同的出版商。"],["Building habits and getting feedback come first, followed by preparing submissions, then persisting.","先讲培养写作习惯和获得反馈，再讲怎样准备投稿，最后提醒读者坚持不懈。"]],"key":3,"why":["The first four sections deal with writing practice, the fifth with submitting work, and the sixth with persistence. The correct sequence accounts for all three stages.","第1至4条讲多读、积累素材、每天练笔和借助写作小组获得反馈。第5条转到投稿前的准备，第6条提醒写作者面对困难和退稿时保持乐观、坚持下去。"],"ev":[{"p":"P120","n":1},{"p":"P120","n":2},{"p":"P120","n":3},{"p":"P120","n":4},{"p":"P120","n":5},{"p":"P120","n":6}]},{"id":"W120-1","skill":"E1","pages":["P120"],"src":1,"stem":["Which phrase best describes the author’s purpose?","这篇文章最主要的写作目的是什么？"],"o":[["To instruct.","给出指导。"],["To entertain.","娱乐读者。"],["To inform.","给读者提供有关作家的信息。"],["To persuade readers to buy a particular writer’s book.","说服读者购买某位作家的书。"]],"key":0,"why":["Each heading asks the reader to do something. Facts and examples make the advice usable, which points most specifically to instruction.","六个小标题都提出了可以付诸行动的建议，例如“尽量多读”“每天都写”，各节再具体说明该怎样做。因此，作者的主要目的是指导有志于写作的读者。"],"ev":[{"p":"P120","n":1},{"p":"P120","n":2},{"p":"P120","n":3},{"p":"P120","n":4},{"p":"P120","n":5},{"p":"P120","n":6}]},{"id":"LL90-E","skill":"E1","pages":["P090"],"src":null,"stem":["Why does the author include separate examples of squid, fireworms, and anglerfish?","作者为什么分别举出乌贼、火虫和鮟鱇鱼等例子？"],"o":[["To show through different examples the uses of bioluminescence in nature.","通过不同的例子，说明生物发光在自然界有哪些用途。"],["To establish which marine animal produces the brightest light.","确定哪一种海洋动物发出的光最亮。"],["To teach readers how to identify each species from light patterns at the shore.","教读者根据海边的光纹辨认不同的物种。"],["To compare how easily the animals can be observed from land and from a boat.","比较从陆地和船上观察这些动物的难易程度。"]],"key":0,"why":["The examples explain uses such as camouflage, communication, defense, and attracting prey. They build understanding through information and examples.","第3至6段用不同动物说明光如何帮助它们伪装、吸引配偶、迷惑捕食者或引诱猎物。每个例子都让一种用途更容易理解。"],"ev":[{"p":"P090","n":3},{"p":"P090","n":4},{"p":"P090","n":5},{"p":"P090","n":6}]},{"id":"G88-F","skill":"F3","pages":["P088"],"src":null,"stem":["Which explanation best connects Mrs. Taylor’s gasp with her decision to swirl the water?","哪项最能解释泰勒太太为什么惊叹，又伸手拨动水面？"],"o":[["She worries the children might slip, so she warns them and reaches out to help.","她担心孩子滑倒，所以先提醒他们，再伸手去扶。"],["She thinks the flashlight is broken, so she searches the water for a missing part.","她以为手电筒坏了，就伸手寻找掉进水里的零件。"],["She is amazed to see something she has only read about and wants to observe it herself.","她惊喜地看见以前只在书上读到过的现象，想亲自观察。"],["She wants to get back to the cottage quickly and is trying to call the children away.","她急着回小屋，想把孩子们从水边叫走。"]],"key":2,"why":["She says she has read about the light but has never seen it herself. Reaching into the water fits amazement and curiosity. The other choices add events the story does not describe.","第9段里，泰勒太太说自己读到过这种现象，这次才亲眼见到。她伸手拨水，想亲自看看亮光是怎么出现的。第11段里，她还说出了这种现象的名称。"],"ev":[{"p":"P088","n":9},{"p":"P088","n":11}]},{"id":"J2-F","skill":"F3","pages":["P002"],"src":null,"stem":["What most likely motivates the children to choose yakisoba at the game?","什么最可能促使两个孩子在球场选择日式炒面？"],"o":[["They think the popcorn and hot dogs have sold out, leaving only noodles.","他们以为爆米花和热狗已经卖完，只剩面条可选。"],["They are curious about the local baseball experience and want to try a local snack.","他们对日本的观赛体验感到好奇，也想尝尝当地小吃。"],["They want to compare the teams’ eating habits and start with the home players’ favorite.","他们想比较两队的饮食习惯，于是先尝主队球员最喜欢的食物。"],["They planned to skip the game and are buying noodles to pass the time.","他们本来就打算不看比赛，买面条是为了消磨时间。"]],"key":1,"why":["Familiar snacks were available, but both children chose a Japanese snack. Looking around the stadium and asking about the cheerleaders also show curiosity about the local experience.","第 14 段写到，尽管球场也卖他们熟悉的小吃，两个孩子还是主动选了日式炒面。先前他们四下张望、询问啦啦队，也表现出对当地观赛体验的好奇。"],"ev":[{"p":"P002","n":5},{"p":"P002","n":7},{"p":"P002","n":10},{"p":"P002","n":14}]},{"id":"L26-Ga","skill":"G1","pages":["P026"],"src":null,"stem":["According to the table, how far from the ocean did the lighthouse stand at its new location?","根据表格，搬到新址后，灯塔离大海多远？"],"o":[["About 2,900 feet","约 2,900 英尺"],["1,600 feet","1,600 英尺"],["About 2 inches","约 2 英寸"],["193 feet","193 英尺"]],"key":1,"why":["The 2,900-foot figure measures the journey. The 1,600-foot figure measures the distance from the new site to the ocean.","约 2,900 英尺是灯塔从原址到新址的搬迁距离，1,600 英尺是灯塔新址到大海的距离。"],"ev":[{"p":"P026","n":5}],"chart":true},{"id":"L26-Gb","skill":"G1","pages":["P026"],"src":null,"stem":["Which option correctly lists the estimated time first and the actual time second?","哪项先写对了预计工期，再写对了实际工期？"],"o":[["Four to six weeks, about three weeks","四至六周，约三周"],["About three weeks, four to six weeks","约三周，四至六周"],["Four weeks, six weeks","四周，六周"],["About three weeks, about three weeks","约三周，约三周"]],"key":0,"why":["The estimate is a range. The actual duration is a separate approximate value. Four and six weeks are the endpoints of the same estimate.","预计工期是四至六周，实际用时约三周。四周和六周是同一预计范围的两个端点。"],"ev":[{"p":"P026","n":5}],"chart":true},{"id":"PAIR-Ha","skill":"H1","pages":["P088","P090"],"src":null,"stem":["Which choice most accurately connects an observation in Text A with a scientific explanation in Text B?","哪项最准确地把甲文中的观察和乙文中的科学解释联系起来？"],"o":[["The children see light when they kick the water in A. B explains that disturbed dinoflagellates glow, a possible cause of what they saw.","甲文里，孩子踢水时看到亮光。乙文解释，甲藻受到扰动时会发光，这可能是他们看到亮光的原因。"],["The children notice the sand cooling in A. B explains that glowing dinoflagellates can cool the sand.","甲文里，孩子注意到沙子凉了。乙文解释，甲藻发光会让沙子降温。"],["The father mentions stars in the sea in A. B confirms that the lights are reflections of stars in the sky.","甲文里，爸爸说海里有星星。乙文证实，水里的光点是夜空中星星的倒影。"],["The children stir the water in A. B proves that anglerfish hunting prey must have caused the glow that night.","甲文里，孩子们拨动海水。乙文证明，当晚的亮光一定来自正在引诱猎物的鮟鱇鱼。"]],"key":0,"why":["A useful synthesis includes the observed movement and the explanation involving organisms. Text A identifies tiny organisms in general, not their exact species.","甲文第7、8段写踢水和拨水时出现亮光，第11段说光来自水中的微小生物。乙文第7段说明海面附近的甲藻受到扰动就会发光。甲藻是一个可能的解释，甲文并未鉴定具体物种。"],"ev":[{"p":"P088","n":7},{"p":"P088","n":8},{"p":"P088","n":11},{"p":"P090","n":7}]},{"id":"PAIR-Hb","skill":"H1","pages":["P088","P090"],"src":null,"stem":["Which statement best synthesizes both texts?","哪一句最准确地综合了两篇文章的内容？"],"o":[["The children proved that all glowing sea animals light up when disturbed.","两个孩子证实，所有会发光的海洋动物一受惊动就会发光。"],["Text A describes a family’s discovery, while Text B explains uses of bioluminescence and a common source of the glow near the surface.","甲文讲一家人在海边的发现。乙文解释生物发光的多种用途，以及海面附近亮光的一种常见来源。"],["Both texts say the glow is starlight reflected on the water.","两篇文章都说，海面上的亮光来自星星在水中的倒影。"],["Both texts focus on how deep-sea animals use light to attract prey.","两篇文章都着重解释深海动物怎样用光引诱猎物。"]],"key":1,"why":["Text A describes a family’s observation. Text B explains uses of bioluminescence and a source of light at the surface. The family did not identify every species, and the father’s stars are a figure of speech.","甲文第7、11、12段写泰勒一家看到亮光、听到解释的经过。乙文第3至6段说明生物发光的用途，第7段介绍海面附近会发光的甲藻。爸爸说海里也有星星，是用星光形容水中的亮光。"],"ev":[{"p":"P088","n":7},{"p":"P088","n":11},{"p":"P088","n":12},{"p":"P090","n":3},{"p":"P090","n":4},{"p":"P090","n":5},{"p":"P090","n":6},{"p":"P090","n":7}]}]}</script>

<script>
'use strict';
const BOOK=JSON.parse(document.querySelector('#book-data').textContent);
const pages=BOOK.passages, items=BOOK.questions, skills=BOOK.skills;
const by=(arr)=>new Map(arr.map(x=>[x.id,x]));
const P=by(pages), Q=by(items), S=by(skills), M=by(BOOK.methods);
const app=document.querySelector('#content'), topbar=document.querySelector('#top');
const edition=document.documentElement.dataset.edition, NS='map-g6/supplement.reading.1/';
const e=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function braille(run){return '<span class="braille-word" role="img" aria-label="'+e([...run].map(ch=>'Braille '+[1,2,3,4,5,6].filter(i=>(ch.charCodeAt(0)-0x2800)&(1<<(i-1))).join('-')).join(', '))+'">'+[...run].map(ch=>'<span class="braille-cell" aria-hidden="true">'+[1,4,2,5,3,6].map(i=>'<i class="braille-dot '+((ch.charCodeAt(0)-0x2800)&(1<<(i-1))?'on':'')+'"></i>').join('')+'</span>').join('')+'</span>'}
const fmt=t=>e(t).replace(/[\u2801-\u283f]+/g,braille).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
const $=(sel,root=document)=>root.querySelector(sel);
const letters='ABCD';
const memory=new Map();
function get(k,d=null){try{const v=localStorage.getItem(NS+k);return v==null?(memory.get(k)??d):JSON.parse(v)}catch{return memory.get(k)??d}}
function put(k,v){memory.set(k,v);try{localStorage.setItem(NS+k,JSON.stringify(v))}catch{}}
function allKeys(){const keys=new Set(memory.keys());try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(NS))keys.add(k.slice(NS.length))}}catch{}return [...keys]}
let tabStudent=get('alias','本机学生');
try {
 tabStudent=sessionStorage.getItem(NS+'alias')||tabStudent;
 if(tabStudent!=='本机学生')sessionStorage.setItem(NS+'alias',tabStudent);
} catch {}
const alias=()=>tabStudent;
const prefix=(lang,person=alias())=>'p/'+encodeURIComponent(person)+'/'+lang+'/';
const recordProgress=startSupplementSync({"url": "https://br-cute-tahr-8eff7472.supabase.aidap-global.cn-beijing.volces.com", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1wbGF0Zm9ybSIsInJvbGUiOiJhbm9uIiwiZXhwIjozNjg2OTI1NzYzfQ.y45vSsbxFjV9k-psYujSR2YMtDOeZW_IDZS6eBlbRFc"},BOOK,get,prefix);
const dateKey=(ms=Date.now())=>{const d=new Date(ms);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function parse(){
 const [path='',query='']=location.hash.slice(1).split('?');
 const [language,view,x='',y='all']=path.split('/');
 const l=['en','zh'].includes(language)?language:edition;
 const params=new URLSearchParams(query);
 const known=['skills','library','read','practice','result','teacher','sources','report'];
 // Bookmarks from the previous edition opened a separate skill setup page.
 if(view==='skills'&&S.has(x)&&(l==='en'||!x.startsWith('C'))&&items.some(q=>q.skill===x)){
  const scope=params.get('type')||y;
  return {l,v:'practice',x,y:['info','lit'].includes(scope)?scope:'all',yq:params};
 }
 return {l,v:known.includes(view)?view:'skills',x,y,yq:params};
}
let rt=parse(), draftFilter='',libraryFamily='all',libraryPage=0,presentedPage='',both=false,mobile='question',highlight='';
let lastRoute='';
const tr=(zh,en)=>rt.l==='en'?en:zh;
const word=(pair,l=rt.l)=>pair?.[l==='en'?0:1]??'';
const langTag=l=>l==='en'?'en':'zh-CN';
const skName=(k,l=rt.l)=>l==='en'?S.get(k)?.en:S.get(k)?.title;
const genre=(p,l=rt.l)=>l==='en'?(p.family==='lit'?'Literary Text':'Informational Text'):p.genre;
const currentPage=()=>P.get(rt.x)||pages[0];
const url=(view='skills',x='',y='',query={},lang=rt.l)=>'#'+[lang,view,x,y].filter(Boolean).map(encodeURIComponent).join('/')+(Object.keys(query).length?'?'+new URLSearchParams(query):'');
const a=(href,text,cls='btn',more='')=>'<a class="'+cls+'" href="'+e(href)+'" '+more+'>'+e(text)+'</a>';
const btn=(id,text,cls='quiet',attrs='')=>'<button type="button" class="'+cls+'" data-act="'+id+'" '+attrs+'>'+e(text)+'</button>';
const dataAttr=(name,val)=>'data-'+name+'="'+e(val)+'"';
const choose=(value,label,sel)=>'<option value="'+e(value)+'" '+(value===sel?'selected':'')+'>'+e(label)+'</option>';
function linkText(text,l){return '<span lang="'+langTag(l)+'">'+fmt(text)+'</span>'}
function chipLink(href,label,on){return a(href,label,'chip','aria-current="'+(!on?'false':'true')+'"')}
function skillsURL(family=rt.v==='skills'?rt.yq.get('type'):rt.y,lang=rt.l){
 return url('skills','','',family==='lit'?{type:'lit'}:{},lang);
}
function nextLang(l){
 const q=Object.fromEntries(rt.yq);
 if(l==='zh'&&q.skill?.startsWith('C'))delete q.skill;
 if(l==='zh'&&['practice','skills','result','teacher'].includes(rt.v)&&rt.x.startsWith('C'))return rt.v==='teacher'?url('teacher','','',{},l):skillsURL(rt.y,l);
 return url(rt.v,rt.x,rt.y==='all'?'':rt.y,q,l)
}
function shell(){
 document.documentElement.lang=langTag(rt.l);document.title='补充阅读材料';
 const active=rt.v==='read'||rt.v==='library'?'library':['skills','practice','result'].includes(rt.v)?'skills':'teacher';
 const nav=(v,txt)=>a(v==='skills'?skillsURL():url(v),txt,'navlink','aria-current="'+(v===active?'page':'false')+'"');
 topbar.innerHTML='<div class="wrap"><a class="brand" href="'+skillsURL()+'" lang="zh-CN">补充阅读材料</a><nav class="topnav" aria-label="'+tr('主导航','Main navigation')+'">'+nav('skills',tr('专项练习','Skill practice'))+nav('library',tr('篇目目录','Contents'))+nav('teacher',tr('老师版','Teacher edition'))+'</nav><div class="toolbar"><div class="langbar" aria-label="'+tr('版本','Edition')+'">'+a(nextLang('en'),'English','tablink','lang="en" aria-current="'+(rt.l==='en'?'page':'false')+'"')+a(nextLang('zh'),'中文','tablink','lang="zh-CN" aria-current="'+(rt.l==='zh'?'page':'false')+'"')+'</div>'+btn('alias',alias()==='本机学生'?tr('本机学生','Local student'):alias(),'idbtn','title="'+tr('切换学生代号','Switch student')+'"')+'</div></div>';
 $('#skip').textContent=tr('跳到正文','Skip to content');
 $('#foot').innerHTML='<div class="wrap"><span lang="zh-CN">补充阅读材料</span><span>'+tr('中文翻译版','English edition')+'</span></div>';
}
function crumbs(entries){return '<nav class="crumb" aria-label="'+tr('当前位置','Breadcrumb')+'">'+entries.map(([txt,href])=>href?a(href,txt,''):e(txt)).join('<span aria-hidden="true">›</span>')+'</nav>'}
function hero(eye,title,sub='',actions=''){return '<header class="hero">'+(eye?'<div class="eyebrow">'+e(eye)+'</div>':'')+'<h1>'+e(title)+'</h1>'+(sub?'<p class="meta">'+e(sub)+'</p>':'')+(actions?'<div class="actions">'+actions+'</div>':'')+'</header>'}
function famText(f){return f==='info'?tr('信息类','Informational'):f==='lit'?tr('文学类','Literary'):tr('全部文类','All text types')}
function familySelect(id,sel){return '<select id="'+id+'">'+['all','info','lit'].map(k=>choose(k,famText(k),sel)).join('')+'</select>'}
const available=(k)=>rt.l==='en'||!k.startsWith('C');
function pool(k,f='all'){
 return items.filter(q=>q.skill===k&&available(q.skill)&&(f==='all'||q.pages.some(id=>P.get(id).family===f)))
}
function forPage(p,l=rt.l){return items.filter(q=>(l==='en'||!q.skill.startsWith('C'))&&q.pages.includes(p.id))}
function titles(q,l=rt.l){return q.pages.map(id=>word(P.get(id).title,l)).join(' / ')}
function entry(p,href=url('read',p.id),tail=genre(p)){
 return '<a class="entry" href="'+e(href)+'"><span class="pageno">'+e(p.id)+'</span><strong>'+e(word(p.title))+'</strong><span class="kind">'+e(tail)+'</span></a>'
}
function listPart(){
 const key=draftFilter.trim().toLocaleLowerCase();
 const found=pages.filter(p=>(libraryFamily==='all'||p.family===libraryFamily)&&(!key||[p.id,p.title[0],p.title[1],p.alias||'',p.genre].some(s=>s.toLocaleLowerCase().includes(key))));
 const batch=16,total=Math.ceil(found.length/batch);libraryPage=Math.max(0,Math.min(libraryPage,total-1));const start=libraryPage*batch;
 const pager=total>1?'<div class="actions pager">'+btn('list-prev',tr('上一页','Previous page'),'quiet',libraryPage===0?'disabled':'')+'<span class="meta">'+(libraryPage+1)+' / '+total+'</span>'+btn('list-next',tr('下一页','Next page'),'quiet',libraryPage+1===total?'disabled':'')+'</div>':'';
 return '<p class="meta" aria-live="polite">'+(found.length?tr('显示第 ','Showing ')+(start+1)+'–'+Math.min(start+batch,found.length)+tr(' 篇，共 ',' of ')+found.length+tr(' 篇',' readings'):tr('没有找到对应篇目。','No matching readings.'))+'</p><div class="directory">'+found.slice(start,start+batch).map(p=>entry(p)).join('')+'</div>'+pager;
}
function resumeLink(style){
 const last=get(prefix(rt.l)+'active');
 if(!last||!Q.has(last.qid)||!S.has(last.skill)||!available(last.skill))return '';
 const label=tr('继续上次练习','Resume practice')+' · '+last.skill+' '+skName(last.skill);
 return a(url('practice',last.skill,last.f||'all',{q:last.qid}),label,style);
}
function library(){
 const last=P.get(get(prefix(rt.l)+'last-read',''));
 const links=a(url('read',last?.id||pages[0].id),last?tr('继续阅读 · ','Continue reading · ')+word(last.title):tr('从第一篇开始','Start with the first reading'),'btn primary')+a(skillsURL(),tr('按能力选题','Practice by skill'))+resumeLink('btn');
 return hero(tr('中文翻译版','English edition'),'补充阅读材料',pages.length+tr(' 篇 · 按教材原顺序排列',' readings · In book order'),links)+'<section class="card pad"><div class="filters"><label for="find-reading">'+tr('查找篇目','Find a reading')+' <input type="search" id="find-reading" value="'+e(draftFilter)+'" placeholder="'+tr('篇名或书内页码','Title or printed page')+'"></label><label>'+tr('文类','Text type')+' '+familySelect('library-family',libraryFamily)+'</label></div><div id="book-list">'+listPart()+'</div></section>';
}
function table(title,headers,rows,ids=[]){
 return '<div class="tablewrap"><table><caption>'+e(title)+'</caption><thead><tr>'+headers.map(h=>'<th scope="col">'+e(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr '+(ids[i]?dataAttr('evidence',ids[i]):'')+'>'+r.map((c,j)=>j===0?'<th scope="row">'+e(c)+'</th>':'<td>'+e(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function figure(p,l=rt.l){
 const f=p.fig;if(!f)return '';
 if(f.kind==='braille')return '<section class="standalone"><h3>'+e(word(f.title,l))+'</h3><div class="braille-chart">'+f.rows.map(r=>'<div class="braille-tile">'+braille(r.cells[1][0])+'<span>'+e(r.cells[0][0])+'</span></div>').join('')+'</div><p class="visnote">'+f.page+'</p></section>';
 const result=table(word(f.title,l),f.headers.map(h=>word(h,l)),f.rows.map(r=>r.cells.map(c=>word(c,l))),f.rows.map(r=>p.id+'-'+r.n));
 return '<div class="standalone">'+result+'<p class="visnote">'+(l==='en'?'Source · ':'出处 · ')+e(f.page)+'</p></div>';
}
function lighthouseTable(l=rt.l){const c=BOOK.chart,i=l==='en'?1:0;return table(c.title[i],c.columns[i],c.rows.map(r=>r[i]))+'<div class="visnote">'+e(c.caption[i])+'</div>'}
function article(p,paired=false,l=rt.l,extraTable=false){
 const other=l==='en'?'zh':'en';
 const rows=p.parts.filter(b=>!String(b.n).startsWith('t')).map(b=>{
  const tag=p.id+'-'+b.n;
  return '<div class="para '+(typeof b.n==='number'?'':e(b.type||'note'))+(tag===highlight?' match':'')+'" data-evidence="'+e(tag)+'"><span class="num">'+(typeof b.n==='number'?String(b.n).padStart(2,'0'):'')+'</span><div><div class="words" lang="'+langTag(l)+'">'+fmt(word(b.t,l))+'</div>'+(paired?'<div class="words secondary-text" lang="'+langTag(other)+'">'+fmt(word(b.t,other))+'</div>':'')+'</div></div>'
 }).join('');
 return '<article class="article" lang="'+langTag(l)+'"><p class="meta">'+p.id+' · '+e(genre(p,l))+'</p><h2>'+e(word(p.title,l))+'</h2>'+(paired?'<div class="meta" lang="'+langTag(other)+'">'+e(word(p.title,other))+'</div>':'')+'<p class="prelude">'+fmt(word(p.lead,l))+(paired?'<span class="secondary-text" style="display:block" lang="'+langTag(other)+'">'+fmt(word(p.lead,other))+'</span>':'')+'</p>'+rows+figure(p,l)+(paired&&p.fig?figure(p,other):'')+(extraTable?lighthouseTable(l)+(paired?lighthouseTable(other):''):'')+'</article>';
}
function togglePair(){return btn('pair',both?tr('单语阅读','Single-language text'):tr('逐段中英对照','Compare English and Chinese'),'quiet','aria-pressed="'+both+'"')}
function read(){
 const p=currentPage(),i=pages.indexOf(p),qs=forPage(p);put(prefix(rt.l)+'last-read',p.id);recordProgress(alias(),rt.l,{page:p.id,status:'reading',at:Date.now()});
 const links=skills.map(k=>{const list=qs.filter(q=>q.skill===k.id);return list.length?a(url('practice',k.id,p.family,{q:list[0].id}),k.id+' · '+skName(k.id)+' ('+list.length+')','chip'):''}).join('');
 const neighbor=(neighbor,back)=>neighbor?'<a href="'+url('read',neighbor.id)+'"><small>'+tr(back?'上一篇':'下一篇',back?'Previous reading':'Next reading')+' · '+neighbor.id+'</small>'+e(word(neighbor.title))+'</a>':'<span></span>';
 return crumbs([[tr('篇目目录','Contents'),url('library')],[p.id]])+'<div class="reader-tools toolbar"><span class="meta">'+(i+1)+' / '+pages.length+'</span>'+togglePair()+'</div><div class="split readsplit"><section class="card pad">'+article(p,both)+'</section><aside class="card pad flow"><h3>'+tr('用本篇练习','Practice with this reading')+'</h3><div class="tabs">'+links+'</div>'+a(url('sources',p.id),tr('老师版 · 原题与解析','Teacher edition · Questions and answers'),'quiet-link')+'</aside></div><nav class="bookend">'+neighbor(pages[i-1],true)+neighbor(pages[i+1],false)+'</nav>';
}
function skillPage(){
 const family=rt.yq.get('type')==='lit'?'lit':'info';
 const buttons=['info','lit'].map(f=>{
  const number=pages.filter(p=>p.family===f).length;

function bankKey(skill=rt.x,f=rt.y){return prefix(rt.l)+'bank/'+skill+'/'+f}
function clampGoal(n,count){return Math.max(1,Math.min(count||1,Math.round(Number(n)||1)))}
function qkey(q){return prefix(rt.l)+'q/'+q.id}
function answer(q){return get(qkey(q),{choice:null,tries:[],retry:false})}
const locked=s=>s.tries.length>0&&!s.retry;
const outcome=s=>!s.tries.length?'open':!s.tries.at(-1).ok?'wrong':s.tries.some(t=>!t.ok)?'fixed':'right';
function currentRun(){
 const k=rt.x, f=['all','info','lit'].includes(rt.y)?rt.y:'all', list=pool(k,f);
 if(!list.length)return null;
 const b=get(bankKey(k,f),{}), asked=rt.yq.get('q'), q=list.find(x=>x.id===asked)||list.find(x=>x.id===b.qid)||list[0];
 return {k,f,list,q,b,idx:list.indexOf(q),goal:clampGoal(b.goal||Math.min(10,list.length),list.length)}
}
function counts(run){
 const stats={done:0,first:0,wrong:0,fixed:0,today:0};
 for(const q of run.list){const s=answer(q);if(!s.tries.length)continue;stats.done++;if(s.tries[0].ok)stats.first++;if(s.tries.some(t=>dateKey(t.at)===dateKey()))stats.today++;const status=outcome(s);if(status==='wrong'||status==='fixed')stats[status]++}
 return stats;
}
function markActive(run,status){

 recordProgress(alias(),rt.l,get(prefix(rt.l)+'active'));

function keepRun(run,status='working'){

}

function navGrid(run){

  const status=outcome(answer(q)),label=status==='wrong'?' ×':status==='right'?' ✓':status==='fixed'?' ✓':'';
  const hint=status==='wrong'?tr('错题，点击重练','Incorrect, select to retry'):status==='fixed'?tr('已订正','Corrected'):status==='right'?tr('答对','Correct'):tr('未答','Unanswered');
  return btn('question',String(i+1)+label,'quiet '+(status==='fixed'?'right':status),dataAttr('id',q.id)+' aria-label="'+e((i+1)+' · '+hint)+'" aria-current="'+(run.q.id===q.id?'step':'false')+'"');
 }).join('')+'</div>'

function quiz(run){
 const q=run.q,s=answer(q),graded=locked(s),last=s.tries.at(-1),picked=graded?last.i:s.choice;
 const ops=q.o.map((pair,k)=>{
  if(graded&&!last.ok&&k!==picked&&k!==q.key)return '';
  let cl='',flag='';
  if(graded&&k===q.key){cl='correct';flag=last.ok?tr('你的选择 · 正确','Your answer · correct'):tr('正确答案','Correct answer')}
  else if(graded&&k===picked){cl='wrong';flag=tr('你的选择 · 错误','Your answer · incorrect')}
  return '<label class="opt '+cl+'"><input data-choice value="'+k+'" type="radio" name="selection" '+(picked===k?'checked ':'')+(graded?'disabled':'')+'><span class="letter">'+letters[k]+'</span><span>'+fmt(word(pair))+(flag?'<small>'+flag+'</small>':'')+'</span></label>'
 }).join('');
 let feedback='',actions='';
 if(graded){
  feedback='<div class="feedback '+(last.ok?'success':'error')+'" role="status">'+(last.ok?'<strong>'+tr('答对了','Correct')+'</strong>':'<strong>'+tr('正确答案是 ','The correct answer is ')+letters[q.key]+'</strong><p>'+fmt(word(q.why))+'</p>')+'</div>';
  if(!last.ok)actions+=btn('retry',tr('重练本题','Retry this question'));
  actions+=run.list.some(x=>!answer(x).tries.length)?btn('next',tr('下一题 →','Next question →'),'primary'):a(url('result',run.k,run.f),tr('查看练习结果','View results'),'btn primary');
 }else actions=btn('submit',tr('提交本题','Submit answer'),'primary');
 return '<div class="pad"><div class="eyebrow">'+tr('第 ','Question ')+(run.idx+1)+(s.retry?tr(' · 重练',' · Retry'):'')+'</div><fieldset class="opts" data-question="'+e(q.id)+'"><legend class="question">'+fmt(word(q.stem))+'</legend>'+ops+'</fieldset>'+feedback+'<div class="actions">'+actions+'</div><span id="answer-status" class="notice" role="status"></span><hr class="rule"><h3>'+tr('题号导航','Questions')+'</h3>'+navGrid(run)+'</div>';

  shell();app.replaceChildren();if(!$('#alias-box').open)showAlias();return;

 if(!keep&&location.hash!==lastRoute){
  const sameRead=old.v===rt.v&&old.x===rt.x;
  both=rt.v==='sources'?(lastRoute&&sameRead?both:true):(sameRead&&old.l!==rt.l?both:false);
  if(!sameRead||rt.v==='practice'){presentedPage='';highlight=''}
  if(rt.v==='practice')mobile='question';
 }
 lastRoute=location.hash;shell();
 const render={library,read,skills:skillPage,practice,result,teacher,sources};
 app.innerHTML=render[rt.v]();
 if(keep){for(const [id,n] of Object.entries(pos))if($(id))$(id).scrollTop=n}else window.scrollTo(0,0);
}
function retry(q){
 const s=answer(q);if(outcome(s)!=='wrong')return;
 s.choice=null;s.retry=true;put(qkey(q),s);
}
function submit(run){
 const q=run.q,s=answer(q);
 if(locked(s))return;
 if(!Number.isInteger(s.choice)||!q.o[s.choice]){
  $('#answer-status').textContent=tr('请先选择一项。','Choose an option first.');$('input[data-choice]')?.focus();return;
 }
 const at=Date.now();s.tries.push({i:s.choice,ok:s.choice===q.key,at,id:globalThis.crypto?.randomUUID?.()||at+'-'+Math.random()});
 s.retry=false;put(qkey(q),s);keepRun(run,counts(run).done===run.list.length?'finished':'working');paint(true);
}

  const f=target.dataset.family;
  if(rt.v!=='skills'||!['info','lit'].includes(f)||target.getAttribute('aria-pressed')==='true')return;
  history.replaceState(null,'',skillsURL(f));paint(true);
  $('.family-button[data-family="'+f+'"]')?.focus({preventScroll:true});

 }

 if(act==='text'){presentedPage=target.dataset.id;mobile='read';paint(true);if($('#reading-col'))$('#reading-col').scrollTop=0;return}
 if(act==='mobile'){mobile=target.dataset.which;paint(true);return}
 if(act==='evidence'){
  presentedPage=target.dataset.page;highlight=target.dataset.key;
  const left=$('#reading-col');
  if(left){
   left.innerHTML=article(P.get(presentedPage),both,rt.l,presentedPage==='P026');

 }

 const run=currentRun();if(!run)return;
 if(act==='submit'){submit(run);return}
 if(act==='retry'){retry(run.q);both=false;paint(true);$('input[data-choice]')?.focus({preventScroll:true});return}
 if(act==='question'){
  const q=run.list.find(x=>x.id===target.dataset.id);if(!q)return;if(outcome(answer(q))==='wrong')retry(q);
  both=false;presentedPage='';go(navQuestion(run,q));return
 }
 if(act==='next'){
  for(let i=1;i<=run.list.length;i++){const q=run.list[(run.idx+i)%run.list.length];if(!answer(q).tries.length){go(navQuestion(run,q));return}}
  go(url('result',run.k,run.f));return
 }
 if(act==='pause'){keepRun(run,'paused');go(url('result',run.k,run.f,{paused:'1'}))}
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='alias-input')ev.target.setCustomValidity('');
 if(ev.target.id==='find-reading'){draftFilter=ev.target.value;libraryPage=0;$('#book-list').innerHTML=listPart()}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.hasAttribute('data-choice')){
  const run=currentRun();if(!run)return;const s=answer(run.q);if(locked(s))return;
  s.choice=Number(t.value);put(qkey(run.q),s);const notice=$('#answer-status');if(notice)notice.textContent='';return
 }
 if(t.id==='library-family'){libraryFamily=t.value;libraryPage=0;$('#book-list').innerHTML=listPart()}
 if(t.id==='practice-reading'){
  const run=currentRun(),q=run?.list.find(q=>q.id===t.value);
  if(q)go(navQuestion(run,q));
 }
 if(t.id==='goal'){
  const run=currentRun();if(!run)return;
  const goal=clampGoal(t.value,run.list.length);
  t.value=goal;put(bankKey(run.k,run.f),{...run.b,goal});
  $('#goal-caption').textContent=goalCaption(counts(run).today,goal);
 }
 if(t.id==='teacher-skill')go(url('teacher',t.value));
 if(t.id==='source-select')go(url('sources',t.value,'',{mode:rt.yq.get('mode')==='practice'?'practice':'original'}));
});
$('#skip').addEventListener('click',ev=>{ev.preventDefault();app.focus();app.scrollIntoView({block:'start'})});
$('#alias-box').addEventListener('submit',ev=>{ev.preventDefault();saveAlias()});
window.addEventListener('hashchange',()=>paint());
$('#alias-box').addEventListener('close',()=>{
 if(alias()==='本机学生'&&!['teacher','sources'].includes(rt.v))location.assign('../');
});
paint();
 setInterval(()=>{
  if(document.visibilityState!=='visible')return;
  if(rt.v==='practice'){const r=currentRun();if(r)markActive(r,counts(r).done===r.list.length?'finished':'working')}
 },30000);


</script>
</body>
</html>
