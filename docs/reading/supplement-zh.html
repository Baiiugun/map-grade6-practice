yside School* books. The kids in the books are even named after students that Sachar worked with in real life!","萨奇尔上大学时当过一段时间的教师助理，因为他原以为这样很容易挣到课程学分。工作没有想象的轻松，但他发现自己真的很喜欢和孩子们相处。事实上，后来成了他畅销的《歪歪路小学》系列灵感来源的，正是他当过教师助理的希尔赛德小学。就连书中孩子们的名字，都取自萨奇尔在现实中带过的学生！"],"type":"paragraph"},{"n":4,"t":["Even after his experiences teaching and working with children, Sachar still hadn’t made a decision about what career path to follow. After college, he decided to go to law school. He graduated several years later with a law degree. By this time, Sachar had published his first children’s book, but he didn’t feel confident about making a living as a writer.","即使有过教书和与孩子们相处的经历，萨奇尔还是没有想好要从事什么职业。大学毕业后，他决定去读法学院。几年后毕业，拿到了法学学位。那时，萨奇尔已经出版了自己的第一本童书，却还没有信心靠写作为生。"],"type":"paragraph"},{"n":5,"t":["About ten years later, after the publication of several more books, Sachar finally felt that his books were successful enough for him to devote himself to writing full time. In 1989, Sachar quit his job as an attorney and became a writer.","又过了大约十年，陆续出版了几本书后，萨奇尔终于觉得自己的书已经足够成功，他可以全身心投入写作了。1989年，萨奇尔辞去律师的工作，成为一名专职作家。"],"type":"paragraph"},{"n":6,"t":["Sachar spends about two hours writing each morning, when he feels most fresh and sharp. He likes to be alone when he writes, except for the company of his two dogs, Tippy and Lucky. Some writers base their stories closely around the people and events in their lives, and others create characters and places that are entirely fictional. Sachar uses a combination of the two. He tries to remember what it was like to be a child and to use those memories and feelings in his novels. He also uses his teaching experiences, as well as moments from his daughter’s life.","萨奇尔每天早上写作约两小时，因为那时他头脑最清醒，思维也最敏捷。写作时他喜欢独处，只让自己的两条狗蒂皮和拉基陪着。有些作家创作的故事紧扣自己生活中的人物和事件，也有作家笔下的人物和地点完全是虚构的。萨奇尔两种办法都用。他努力回想当小孩的感觉，把那些记忆和感受写进小说。他还会运用自己的教学经历，以及女儿生活中的一些片段。"],"type":"paragraph"},{"n":7,"t":["Sachar doesn’t sit down with an organized plan or outline when he starts a new book. Instead, he begins with just a seed of an idea—maybe a character trait or a funny event. He starts writing and finds that the act of writing produces more ideas. Those ideas branch out into other ideas, and before he knows it, a new book is well on its way.","萨奇尔着手写一本新书时，并不会先坐下来列出周密的计划或提纲。他起步时只有一颗想法的种子，或许是人物的一个特点，也可能是一件好笑的事。他动手写起来，发现一边写，一边便会冒出更多想法。这些想法又像树枝一样生出新的枝条，不知不觉间，新书已经写出不少了。"],"type":"paragraph"},{"n":8,"t":["Sachar doesn’t worry too much about perfecting his story, plot, characters, and setting the first time around. In fact, he may rewrite his story five or six times before he even sends it to his publisher. That might seem like a lot of work, but one thing is for sure—Louis Sachar seems to have hit on a winning formula for writing!","萨奇尔不太在意第一稿能不能把故事、情节、人物和背景都写得尽善尽美。事实上，他在把稿子寄给出版社之前，可能会把整个故事重写五六遍。这听起来也许工作量很大，但有一点可以肯定，路易斯·萨奇尔似乎找到了行之有效的写作方法！"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the words that best describe Louis Sachar.\n\n- ________ creative\n- ________ intelligent\n- ________ humorous\n- ________ nosy\n- ________ unpredictable","勾选最能形容路易斯·萨奇尔的词语。\n有创意的\n聪明的\n幽默的\n爱打听别人私事的\n难以预测的"],"ans":["✓ creative\n✓ intelligent\n✓ humorous","有创意的、聪明的、幽默的。"]},{"n":2,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ for information about the life and work of Louis Sachar\n- ________ to learn how to solve a problem\n- ________ to form an opinion about the work of Louis Sachar","读者可能出于什么目的阅读这篇文章？\n了解路易斯·萨奇尔的生平与作品\n学习怎样解决一个问题\n形成对路易斯·萨奇尔作品的看法"],"ans":["✓ for information about the life and work of Louis Sachar","了解路易斯·萨奇尔的生平与作品。"]},{"n":3,"ask":["Check the line beside the word or words that best describe what type of selection this is.\n\n- ________ autobiography\n- ________ historical nonfiction\n- ________ biography","在最能概括本文体裁的一项旁打勾。\n自传\n历史纪实作品\n传记"],"ans":["✓ biography","传记。"]},{"n":4,"ask":["Name two series of books that Louis Sachar has written.\n\n________","说出路易斯·萨奇尔写过的两个系列。"],"ans":["Marvin Redpost and Wayside School","《马文·雷德波斯特》系列和《歪歪路小学》系列。"]},{"n":5,"ask":["Why didn’t Sachar become a full-time writer as soon as his first book was published?\n\n________","萨奇尔为什么没有在第一本书出版后马上成为全职作家？"],"ans":["He didn’t feel confident he could make a living as a writer.","他没有信心靠写作为生。"]},{"n":6,"ask":["What happens after Sachar has completed the first draft of a book?\n\n________","萨奇尔完成一本书的初稿后会做什么？"],"ans":["He rewrites it five or six times before he sends it to his publisher.","在把书稿寄给出版社之前，他会重写五六遍。"]},{"n":7,"ask":["Name two sources of ideas for Sachar’s stories and characters.\n\n________","说出萨奇尔创作故事和人物时的两个灵感来源。"],"ans":["Possible answers: his memories of childhood; his experience teaching; his daughter’s life","示例：他对童年的回忆、他的教学经历、他女儿的生活。"]},{"n":8,"ask":["If you were to write a short story or a novel, what sources of ideas could you use? Be specific.\n\n________","如果要写短篇小说或长篇小说，你可以从哪里找灵感？请具体说明。"],"ans":["Answers will vary.","答案因人而异。"]}]},{"id":"P120","title":["So, You Want to Be a Writer?","你想成为作家吗？"],"lead":["What are some tips on becoming a writer?","想成为作家，有哪些建议可以参考？"],"exercise":"P121","genre":"写作指导","family":"info","parts":[{"n":1,"t":["**Read everything you can.** Most writers are voracious readers. They read because they love to lose themselves in books. They like the sounds of language and the way that reading a good description can feel as satisfying as winning a baseball game or eating a banana split.","尽量多读。大多数作家都如饥似渴地读书。他们读书，是因为喜欢沉浸在书里。他们喜欢语言的声音，也喜欢那种读到一段精彩描写时的满足感，就像赢了一场棒球赛，或者吃了一客香蕉船冰淇淋。"],"type":"paragraph"},{"n":"u1","t":["As you read, pay attention to what speaks to you. Do you like stories that are fast-paced and full of unexpected twists? Do you prefer to read books with characters who seem like someone you might know? Do you like tales that take you on faraway adventures, or ones that explain the mysteries of the natural world? Do you like to feel scared when you read under the covers, or do you like a story that makes you laugh until you cry? Think about the types of writing you like best, and try to identify the qualities that appeal to you.","阅读时，留意什么最能打动你。你喜欢节奏紧凑、处处有意外转折的故事吗？你是不是更爱读那些书中人物仿佛是自己认识的人的书？你喜欢带你去远方探险的故事，还是喜欢解释大自然奥秘的故事？你喜欢躲在被子里读得心惊胆战，还是喜欢能让你笑出眼泪的故事？想想你最爱读哪类作品，试着说出其中吸引你的特点。"],"type":"note"},{"n":2,"t":["**Keep a notebook.** It’s easy to forget a good idea if you do not record it immediately. If you get in the habit of carrying a notebook or journal with you everywhere you go, you can write down anything you want to remember. When you are talking to friends in the cafeteria or waiting for the bus, something might spark an idea for a character or a scene in a story. You might have a dream you don’t want to forget, or you might just write down the lyrics of a song you love. These everyday thoughts and observations can be material for a story, poem, or essay that you write one day.","随身带个笔记本。想到好点子却不马上记下来，很容易就忘了。如果你养成无论走到哪儿都带着笔记本或日记本的习惯，就可以记下任何想记住的东西。在食堂跟朋友聊天或等公交车时，某件事也许会给你灵感，让你想到故事里的某个人物或某个场景。你可能做了一个不想忘记的梦，也可能只是抄下自己喜欢的一首歌的歌词。这些日常想法和观察，将来都能成为故事、诗或文章的素材。"],"type":"paragraph"},{"n":3,"t":["**Write every day.** One piece of advice that nearly all writers agree on is that writers must write. It doesn’t matter if you feel like you have nothing to say; the important thing is that you write every single day. Sometimes, you need to give yourself permission to write things you know won’t be your best work. Once you start writing, you’ll see that this is a good way to clear your mind and make room for more of the “good stuff.”","每天都写。几乎所有作家都认同一条建议：想当作家就得写。觉得没有话可说也没关系，重要的是一天不落地写。有时候，你得允许自己写出明知算不上最好的东西。等真的动笔，就会发现这样能清理思绪，给更多“好东西”腾出地方。"],"type":"paragraph"},{"n":4,"t":["**Join or start a writing group.** Do you have any friends who enjoy writing? Think about starting a writing group with other people who have similar interests. It helps to have the support of other writers. You will also receive valuable feedback, or suggestions, about how to make your work better.","加入或组建一个写作小组。你有喜欢写作的朋友吗？可以考虑和兴趣相近的人组建一个写作小组。其他写作者的支持会帮到你。你也会得到宝贵的反馈，也就是关于怎样改进作品的建议。"],"type":"paragraph"},{"n":5,"t":["**Do your homework.** If you decide that you would like to submit your work for publication, make sure to do your research. If you are sending your writing to a magazine, look through old issues. Does it seem like your writing fits in with the other stories or articles? If you are submitting to a book publisher, explore their website to make sure your material is similar to (but not exactly the same as) other books they publish.","先做足功课。如果你决定投稿，希望自己的作品得到发表，一定要先查资料。如果是向杂志投稿，就翻一翻往期刊物。你的作品和里面的故事或文章风格相合吗？如果是向图书出版社投稿，就浏览出版社的网站，确认你的作品和他们出版的书有相似之处，同时又有自己的特色。"],"type":"paragraph"},{"n":"u2","t":["Also make sure that you pay attention to the guidelines. Present your work to them exactly the way they have requested it. If your work doesn’t conform to their guidelines, the publisher may not even look at it.","还要留意投稿要求，严格按照对方要求的方式提交作品。如果不符合要求，出版方可能连看都不会看。"],"type":"note"},{"n":6,"t":["**Stay positive.** A writer’s life can be frustrating. Sometimes it’s hard to sit down and write. You may get many rejections before you receive a single acceptance. This is why perseverance is an important quality for a writer to have.","保持乐观。作家的生活有时会令人沮丧。有时，光是坐下来开始写就很难。你也许会收到许多次退稿，才换来一次录用。因此，坚持不懈是作家应当具备的重要品质。"],"type":"paragraph"},{"n":"u3","t":["Writing can also be one of the most satisfying jobs in the world. Most writers feel lucky to do what they do and wouldn’t trade their career for any other. You could be one of them someday.","写作也可以是世界上最让人满足的工作之一。大多数作家都觉得能做这一行很幸运，给他们换什么职业都不愿意。将来你也可能成为他们中的一员。"],"type":"note"}],"original":[{"n":1,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to instruct\n- ________ to entertain\n- ________ to inform","勾选最能概括作者写作目的的一项。\n给出指导\n娱乐读者\n提供信息"],"ans":["✓ to instruct","给出指导。"]},{"n":2,"ask":["Name three things you might record in a writer’s notebook.\n\n________","说出三种你可能记在写作笔记本里的内容。"],"ans":["Possible answers: dreams, song lyrics, everyday thoughts and observations","示例：梦、歌词、日常想法和观察。"]},{"n":3,"ask":["What does the author mean by “Do your homework”?\n\n________","作者所说的“先做足功课”是什么意思？"],"ans":["Carefully research publishers and magazines, and follow their guidelines.","认真了解出版社和杂志，并遵循它们的投稿要求。"]},{"n":4,"ask":["Why is perseverance an important quality for a writer to have?\n\n________","为什么坚持不懈是作家应具备的重要品质？"],"ans":["You may receive many rejections before you are published.","作品发表前，你也许会收到许多次退稿。"]},{"n":5,"ask":["Why do you think that most writers like to read?\n\n________","你觉得为什么大多数作家喜欢阅读？"],"ans":["Answers will vary.","答案因人而异。"]},{"n":6,"ask":["On the lines below, write a summary of Step 3.\n\n________","概括第3条建议。"],"ans":["It is important that you write every day so that you can get into the habit and so that you can clear your mind of things that are less important or uninteresting.","每天写很重要。这样既能养成写作习惯，也能让头脑清除不太重要或没什么意思的念头。"]},{"n":7,"ask":["Why do you need to write every day?\n\n________","为什么你需要每天写？"],"ans":["It’s a good way to clear your mind, stay in practice, and make room for the “good stuff.”","这样既能清理思绪、保持练习，又能给“好东西”腾出空间。"]},{"n":8,"ask":["What do you think the author’s feelings about writing as a professional are? Why?\n\n________","你认为作者对把写作当成职业有什么感受？为什么？"],"ans":["Answers will vary.","答案因人而异。"]}],"alias":"你想成为一名作家吗？"},{"id":"P122","title":["A Lone Adventure","独自历险"],"lead":["Will Tyler be able to survive all alone on a faraway island?","泰勒能独自在遥远的岛上活下来吗？"],"exercise":"P123","genre":"冒险故事","family":"lit","parts":[{"n":1,"t":["*When I woke up, my mouth was full of sand and the sun was glaring angrily at me from high in the cloudless sky. I sat up and spit the sand from my mouth. I could feel every sore muscle as I walked the few feet to the water. The salt stung my dry, cracked lips, but the water helped remove the last bits of sand that lay gritty and unpleasant below my tongue and in my teeth.*","醒来时，我满嘴都是沙子。万里无云，太阳高高挂在空中，怒气冲冲地瞪着我。我坐起来，把嘴里的沙子吐掉。才走几英尺到水边，我就感觉全身的肌肉都在酸痛。海水里的盐刺得我干裂的嘴唇生疼，不过海水倒是冲掉了留在舌头底下和牙缝里的最后一点沙粒，少了那种磨人的难受劲。"],"type":"paragraph"},{"n":2,"t":["*As I stood in the water to soothe my sunburned skin, I tried to piece together the events of the past few days. Try as I might, I could remember very little. I knew that my ship had capsized because I could see its remains lying not far down the beach. I knew that the crew had escaped in the lifeboats when they became sure the ship was sinking. They had begged me to come with them, but I insisted that a captain must always remain with his ship.*","我站在水里，好让晒伤的皮肤舒服些，同时试着把过去几天发生的事拼凑起来。我怎么想也记不起来多少。我知道船翻了，因为船的残骸就搁在不远处的沙滩上。我知道船员们一确定船要沉了，就坐救生艇逃走了。他们求我一起走，我却坚持认为船长无论如何都必须与自己的船待在一起。"],"type":"paragraph"},{"n":3,"t":["*A few minutes later, I decided to walk down the beach and see what remained of my beloved vessel. My stomach was an animal, growling and rumbling hungrily. As bright as the day was, I knew that night would fall quickly. I needed to build a shelter for myself before dark, and I would need a source of fresh water and food.*","几分钟后，我决定沿着海滩走走，看看我心爱的船还剩下什么。我的肚子是一头饿兽，低吼着，咕噜直响。虽然眼下天色很亮，我知道天黑得会很快。我得在天黑前给自己搭个遮风挡雨的地方，还得找到淡水和食物的来源。"],"type":"paragraph"},{"n":4,"t":["*It would be hard to call the bits of wood that were strewn about the beach a boat. Luckily, I found a canvas bag that was tied to a large, flat piece of wood that I must have used as a makeshift raft. I worked at the knot for a few minutes before I was able to loosen it enough to untie the bag.*","沙滩上四处散落的碎木头，已经很难说是一艘船了。幸好，我发现一个帆布袋绑在一大块平平的木板上，我准是拿那木板当了临时木筏。我摆弄了几分钟，才把绳结松开，解下帆布袋。"],"type":"paragraph"},{"n":5,"t":["*Inside, I was pleased to find a knife, a wool blanket, a small bottle of water, and four cans of food—fish, beans, corn, and stewed tomatoes. There was also a box of matches, but my heart sank when I saw how soggy they were. I would place them on the beach to dry in the sun, but I was skeptical that they would be of much help in producing fire.*","我高兴地发现，袋里有一把刀、一条羊毛毯、一小瓶水和四罐食物，分别是鱼、豆子、玉米和炖番茄。还有一盒火柴，可一看火柴都湿透了，我的心一下子沉了下去。我会把火柴放在海滩上晒干，不过，它们还能不能点起火来，我可没多少把握。"],"type":"paragraph"},{"n":6,"t":["*I chose a spot just off the beach to make my shelter. The sandy ground would provide a bit more comfort than the land farther up in the wooded area, which was knotted with the roots of trees and covered with twigs and branches. I used my knife to split pieces of bamboo that I planned to use as the walls and roof of my hut.*","我在离海滩不远的地方选了个地点搭棚。沙地会比地势更高的林地舒服一点，因为林地上树根盘结，到处是树枝和细枝。我用刀把竹子劈开，打算拿来做棚屋的墙和屋顶。"],"type":"paragraph"},{"n":7,"t":["*I was sweating with the effort of my work when I felt a cool breeze that chilled my damp skin. I stood quietly, enjoying a moment of relief from the sun’s glare, when I noticed dark clouds gathering in the sky. I quickly resumed my task, hoping that the storm would not move in too rapidly. Another gust of wind caught the edge of my blanket and carried it down the beach. I raced after it as the first sounds of thunder rumbled around me.*","我干得满身是汗，这时一阵凉风吹来，湿漉漉的皮肤上顿时一阵寒意。我静静地站着，享受这片刻躲开烈日的清凉，忽然发现天上乌云正在聚拢。我赶紧接着干活，希望暴风雨别来得太快。又一阵风卷起毯子的一角，把它一路刮向海滩另一头。我飞跑去追毯子，第一阵雷已在我四周隆隆响起。"],"type":"paragraph"},{"n":8,"t":["*The garbage truck growled and rumbled as it chugged down the street. Tyler lay on his bed with his eyes open for a moment before he could identify the sound. He sat up quickly, and the book that had been resting on his covers dropped to the floor with a thud. The bearded face of Robinson Crusoe stared up at Tyler from the cover of the book as he fumbled for his glasses. He glanced at his bedside clock. Eight o’clock! He had overslept again. Tyler jumped out of bed and headed for the bathroom.*","垃圾车轰隆隆地沿街开过去。泰勒睁着眼在床上躺了一会儿，才认出这是什么声音。他猛地坐起来，原来搁在被子上的那本书咚的一声掉到了地上。泰勒摸索着找眼镜，封面上满脸胡子的鲁滨逊·克鲁索正仰脸瞪着他。他瞥了一眼床头的钟。八点了！他又睡过头了。泰勒跳下床，直奔洗手间。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why didn’t the narrator escape from the sinking ship on one of the lifeboats?\n________","叙述者为什么没有坐救生艇逃离正在沉没的船？"],"ans":["He believed that a captain should never leave his ship.","他认为船长绝不能抛下自己的船。"]},{"n":2,"ask":["Name three items the narrator found in the canvas bag.\n________","说出叙述者在帆布袋里找到的三样东西。"],"ans":["Possible answers: a knife, a blanket, a bottle of water, four cans of food, and a box of matches.","示例：一把刀、一条毯子、一瓶水、四罐食物、一盒火柴。"]},{"n":3,"ask":["**Personification** is a literary device in which human characteristics are given to inanimate objects. In the sentence *Sam’s bed beckoned to him invitingly*, Sam’s bed is personified. Find an example of personification in the story, and write it on the line below.\n________","拟人是一种把人的特征赋予无生命事物的写作手法。在“山姆的床向他招手，仿佛在邀请他过去”这句话中，山姆的床被拟人化了。在故事中找一个拟人的例子，写下来。"],"ans":["the sun was glaring angrily at me","The sun was glaring angrily at me.（太阳怒气冲冲地瞪着我。）"]},{"n":4,"ask":["What do you think the book Tyler was reading when he fell asleep was about?\n________","你觉得泰勒睡着时正在读的书是讲什么的？"],"ans":["a shipwreck; a castaway","海难，或一个流落荒岛的人的故事。"]},{"n":5,"ask":["From what point of view are the first seven paragraphs of the story told?\n________","故事的前七段是用什么视角来讲述的？"],"ans":["first-person point of view","第一人称视角。"]},{"n":6,"ask":["From what point of view is the last paragraph told?\n________","最后一段是用什么视角来讲述的？"],"ans":["third-person point of view","第三人称视角。"]},{"n":7,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ for information\n- ________ to answer a specific question\n- ________ for entertainment","读者可能出于什么目的阅读这篇文章？\n获取信息\n回答一个具体问题\n消遣娱乐"],"ans":["✓ for entertainment","消遣娱乐。"]},{"n":8,"ask":["________","找出第3段的暗喻。"],"ans":["My stomach was an animal.","My stomach was an animal.（我的肚子是一头饿兽。）"],"dir":["Find the metaphor in paragraph 3, and write it on the line.","找出第3段的暗喻，把它写在横线上。"]},{"n":9,"ask":["Why is most of this selection in italics?\n________","这篇文章的大部分内容为什么用了斜体？"],"ans":["It is a dream.","因为这部分写的是一场梦。"]}]},{"id":"P124","title":["The Real Crusoe","现实中的鲁滨逊"],"lead":["How long do you think you could go without human company?","你觉得自己能在没有其他人作伴的情况下生活多久？"],"exercise":"P125","genre":"人物纪实","family":"info","parts":[{"n":1,"t":["*Robinson Crusoe* by Daniel Defoe is one of the most well-known and widely-read books ever written. It was published in 1719, and by the end of the next century, more than 700 versions, translations, sequels, and imitations had been published.","丹尼尔·笛福的《鲁滨逊漂流记》是有史以来最著名、流传最广的书之一。这本书于1719年出版，到下一个世纪末，它的各种版本、译本、续集和仿作已经出版了700多种。"],"type":"paragraph"},{"n":2,"t":["*Robinson Crusoe* is a fascinating adventure tale of a man who is shipwrecked on an island and survives until his rescue 28 years later. There is no doubt that Defoe was an imaginative and gifted storyteller, but the idea for the fictional character of Crusoe didn’t come solely from Defoe’s imagination. That is why it is believed that the story of Robinson Crusoe was actually based on the real life adventures of Alexander Selkirk.","《鲁滨逊漂流记》是个引人入胜的冒险故事。一个人因为船失事流落到一座岛上，在那里生存了28年，最后获救。笛福无疑是个富有想象力、才华出众的故事家，而塑造鲁滨逊这个虚构人物的灵感还有别的来源。正因如此，人们认为《鲁滨逊漂流记》取材于亚历山大·塞尔柯克真实的历险经历。"],"type":"paragraph"},{"n":3,"t":["Selkirk was a Scottish sailor on a ship called the *Cinque Ports*. He had had frequent disagreements with the ship’s captain, William Dampier, about the safety of the craft and the decisions the captain had made during the expedition. Selkirk demanded to be left ashore at the Juan Fernández Islands (about 400 miles off the coast of Chile) when he became convinced that the *Cinque Ports* was no longer seaworthy.","塞尔柯克是“五港号”上的一名苏格兰水手。他经常和船长威廉·丹皮尔发生争执，争论船是否安全，也争论船长在远航中作出的决定。塞尔柯克认定“五港号”已经不再适合航行，便要求在胡安·费尔南德斯群岛上岸。那里距离智利海岸约400英里。"],"type":"paragraph"},{"n":4,"t":["Captain Dampier was not sorry to see Selkirk go and happily left him on one of the islands. Selkirk seemed to have had a moment of regret as the ship left, but it was too late; no one heard his cries for the ship to return.","丹皮尔船长对于塞尔柯克离开并不觉得遗憾，欣然把他留在其中一座岛上。船开走时，塞尔柯克似乎又有一瞬间后悔了，但为时已晚，他大声喊着让船回来，却没人听见。"],"type":"paragraph"},{"n":5,"t":["Selkirk quickly learned what he needed to do to survive on the uninhabited island. He had brought several items with him from the ship, including a musket, gunpowder, a knife, carpenter’s tools, clothing, and a few books.","塞尔柯克很快学会了怎样在这座无人岛上生存。他从船上带了几样东西，包括一把滑膛枪、火药、一把刀、木工工具、衣服以及几本书。"],"type":"paragraph"},{"n":6,"t":["Selkirk used native trees and his tools to construct two huts for shelter, which he then covered with long grasses. There were plenty of goats on the island, so he was assured a steady supply of milk and meat. There were even vegetables that had been planted by Spanish sailors who had stopped at the island in years past.","塞尔柯克用岛上的树木和自己的工具搭了两座棚屋栖身，又在屋顶铺了长草。岛上的山羊很多，因此羊奶和羊肉总有供应。岛上甚至还有蔬菜，是多年前在岛上停留的西班牙水手种的。"],"type":"paragraph"},{"n":7,"t":["At first, Selkirk had a serious problem with the island’s rats, which gnawed at him at night while he slept. However, sailors had also left cats on the island. Selkirk found that he could easily control the rat population by using meat to entice the cats to remain nearby.","起初，岛上的老鼠是个大麻烦，晚上他睡着后，老鼠会来咬他。不过，水手们也曾在岛上留下过猫。塞尔柯克发现，只要用肉把猫引来并留在附近，就能轻松控制老鼠的数量。"],"type":"paragraph"},{"n":8,"t":["Selkirk managed to survive on the island for four years. Loneliness and depression were as much a problem for him as food and shelter. Eventually, though, Selkirk came to enjoy living alone with only his books, cats, and goats for company.","塞尔柯克设法在岛上活了四年。孤独和消沉对他来说是和食物、住所同样难以应付的问题。不过，渐渐地，他喜欢上了这种只有书、猫和山羊相伴的独居生活。"],"type":"paragraph"},{"n":9,"t":["When he was finally rescued by a ship called the *Duke*, Selkirk found that it was difficult to adjust to being around people again and that he had lost some of his language skills. He became accustomed to living in society again, but a part of him always missed the peace of the island.","最后，一艘名为“公爵号”的船救了塞尔柯克。他发现，自己很难重新适应与人相处，也已经忘记了一些怎么和人说话的本事。后来他重新适应了社会生活，心里却始终怀念岛上的宁静。"],"type":"paragraph"},{"n":10,"t":["In 1712, Woodes Rogers, captain of the *Duke*, published *A Cruising Voyage Round the World*, which included an account of Alexander Selkirk’s experiences in the Juan Fernández Islands. This book, as well as Defoe’s *Robinson Crusoe*, has given readers a chance to experience the life and adventures of an island castaway—adventures they could otherwise only imagine.","1712年，“公爵号”船长伍兹·罗杰斯出版了《环球巡航记》，书中记述了亚历山大·塞尔柯克在胡安·费尔南德斯群岛的经历。这本书和笛福的《鲁滨逊漂流记》，让读者有机会体会一个流落荒岛的人的生活和历险。否则，这些经历只能靠想象。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What nationality was Selkirk?\n\n________","塞尔柯克是哪国人？"],"ans":["Scottish","苏格兰人。"]},{"n":2,"ask":["Why do you think Selkirk called out to the *Cinque Ports* as it sailed away from the island?\n\n________\n\n________","“五港号”驶离岛屿时，塞尔柯克为什么冲船大喊？"],"ans":["He was having second thoughts about his decision.","他开始怀疑自己的决定是否正确。"]},{"n":3,"ask":["How do we know so many details about Selkirk’s experiences on the island?\n\n________\n\n________","我们为什么知道塞尔柯克岛上经历的这么多细节？"],"ans":["Woodes Rogers, the captain of the Duke, wrote a book that included Selkirk’s experiences.","“公爵号”船长伍兹·罗杰斯写了一本书，里面记载了塞尔柯克的经历。"]},{"n":5,"ask":["What is one difference between Robinson Crusoe and Alexander Selkirk?\n\n________\n\n________\n\n________","说出鲁滨逊·克鲁索和亚历山大·塞尔柯克的一点不同。"],"ans":["Possible answer: Selkirk asked to be left on his island and Crusoe was shipwrecked.","示例：塞尔柯克主动要求留在岛上，克鲁索是因为船失事而流落荒岛的。"]},{"n":6,"ask":["Is *Robinson Crusoe* fantasy, or does it take place in reality?\n\n________","《鲁滨逊漂流记》是虚构故事，还是真实记述？"],"ans":["fantasy","虚构故事。"]},{"n":7,"ask":["Is *A Cruising Voyage Round the World* fantasy, or does it take place in reality?\n\n________","《环球巡航记》是虚构故事，还是真实记述？"],"ans":["It takes place in reality.","真实记述。"]},{"n":8,"ask":["Selkirk’s use of ________ thinking allowed him to survive on the island.\n\n- optimistic\n- creative\n- frequent","塞尔柯克凭借哪一种思维在岛上活了下来？\noptimistic（乐观的）\ncreative（有创意的）\nfrequent（频繁的）"],"ans":["creative","creative（有创意的）。"],"dir":["Circle the word that best completes each sentence below.","圈出最适合填入下列各句的词语。"]},{"n":9,"ask":["It was difficult for Selkirk to ________ to life in society.\n\n- readjust\n- communicate\n- accustom","选词填空：塞尔柯克很难___社会生活。It was difficult for Selkirk to ___ to life in society.\nreadjust（重新适应）\ncommunicate（交流）\naccustom（使习惯）"],"ans":["readjust","readjust，即他很难重新适应社会生活。"]},{"n":10,"ask":["Woodes Rogers’s book ________ Selkirk’s experiences.\n\n- neglected\n- ridiculed\n- detailed","伍兹·罗杰斯的书如何处理塞尔柯克的经历？\nneglected（忽略）\nridiculed（嘲笑）\ndetailed（详述）"],"ans":["detailed","detailed（详述）。"]},{"n":11,"ask":["After reading this article, would you be interested in reading Robinson Crusoe? Why or why not?\n\n________\n\n________","读完这篇文章，你有兴趣读《鲁滨逊漂流记》吗？为什么？"],"ans":["Answers will vary.","答案因人而异。"]}],"note":"原书练习题由第 3 题跳到第 5 题，沿用印刷题号。"},{"id":"P126","title":["A Desert in Bloom","沙漠里开花了"],"lead":["Will Chiara and her mom be able to make themselves feel at home in their new house?","基娅拉和妈妈能在新居找到家的感觉吗？"],"exercise":"P127","genre":"家庭故事","family":"lit","parts":[{"n":1,"t":["Chiara made her way down the hallway, past the neatly stacked cardboard boxes, and into the kitchen, where the early morning sunlight streamed through the windows. She stepped over another stack of boxes and slid open the glass door that led to a small deck. Chiara’s mom was sipping a cup of coffee, wisps of steam drifting into the air.","基娅拉沿走廊穿过一摞摞堆得整整齐齐的纸箱，来到厨房，清晨的阳光透过窗户洒进来。她跨过另一堆纸箱，拉开通往小露台的玻璃门。妈妈正小口喝着咖啡，一缕缕热气飘散在空中。"],"type":"paragraph"},{"n":2,"t":["“What are you doing, Mom?” asked Chiara, staring out at the turquoise sky and clumps of plants that dotted the backyard.","“妈妈，你在做什么？”基娅拉问。她望着碧蓝的天空和后院里零零星星的几丛植物。"],"type":"paragraph"},{"n":3,"t":["“Well,” began Mrs. Giardini, “I was just noticing how strange and unfamiliar the landscape is here. Arizona and Massachusetts could be different planets, as far as the landscape is concerned. I was missing all the greenery in our backyard at home, but I was also appreciating how blue the sky is here. It really contrasts with the red earth, doesn’t it?” she asked, taking a sip of coffee.","“嗯，”贾尔迪尼夫人开口说，“我刚才在想，这里的景色实在太陌生了。单说风景，亚利桑那州和马萨诸塞州简直像在两个星球上。我想念以前家里后院那一片绿色，可也觉得这里的天蓝得真好看。蓝天衬着红土，反差很鲜明，对不对？”她边说边喝了一口咖啡。"],"type":"paragraph"},{"n":4,"t":["Chiara nodded. “I see what you mean,” she said. “It doesn’t look like we could grow much here, does it?” she said gesturing to the few dusty looking plants in the yard.","基娅拉点了点头。“我懂你的意思，”她边说边指着院里几株看着灰扑扑的植物，“这里好像种不出多少东西，对吧？”"],"type":"paragraph"},{"n":5,"t":["“I have an idea,” said Mrs. Giardini suddenly. “Have you had your breakfast yet?” she asked. Chiara shook her head. “Grab a muffin and some fruit, and come with me.”","“我想到一个办法了，”贾尔迪尼夫人忽然说，“你吃过早饭了吗？”基娅拉摇摇头。“拿个玛芬，再拿点水果，跟我来。”"],"type":"paragraph"},{"n":6,"t":["Half an hour later, Chiara and her mom pulled into a nursery on the outskirts of town. As they entered the greenhouse, both Chiara and her mother took a deep breath, inhaling the familiar green, damp scent of growing plants. “Can I help you?” asked a man wearing a tag with the nursery’s logo and the name Joseph printed on it.","半小时后，基娅拉和妈妈开车到了城郊的一家苗圃。一进温室，两人都深深吸了一口气，闻到了植物生长时那股熟悉的、湿润的青草气息。“有什么可以帮你们的吗？”一位男子问。他佩戴的胸牌印着苗圃标志和他的名字约瑟夫。"],"type":"paragraph"},{"n":7,"t":["Mrs. Giardini smiled. “We’ve just moved here from Massachusetts,” she began. “We need some help starting a desert garden.”","贾尔迪尼夫人微笑着说：“我们刚从马萨诸塞州搬过来，想请人指点一下，怎么在沙漠里开辟一座花园。”"],"type":"paragraph"},{"n":8,"t":["“Welcome to Arizona!” said Joseph. “The weather and the landscape here might take a little getting used to, but once you fall in love with it, you won’t want to live anywhere else.","“欢迎来到亚利桑那州！”约瑟夫说，“这里的天气和景色可能得花一点时间适应，可你一旦爱上这里，就哪里都不想去了。"],"type":"paragraph"},{"n":9,"t":["“My first recommendation is that you primarily plant native plants. They thrive in this climate for a reason, and you won’t have to spend all your time watering plants that were meant to live somewhere else.”","“我的第一条建议是，主要种本地植物。它们能在这种气候下长得好，是有原因的。这样你们也不用把时间都花在给原本适合长在别处的植物浇水上。”"],"type":"paragraph"},{"n":10,"t":["“That makes sense,” said Mrs. Giardini. “I’ve never grown cacti or other succulents before, but I think that it could be fun to experiment with them.”","“这倒有道理，”贾尔迪尼夫人说，“我从没种过仙人掌或其他多肉植物，不过试着种种看，应该挺有意思。”"],"type":"paragraph"},{"n":11,"t":["Joseph nodded in agreement. “You can create some beautiful cacti gardens, but you aren’t limited to planting only succulents in the desert.” He pointed to several nearby pots. “I’ll show you a few of my favorites. The desert willow has beautiful blooms that some people think resemble orchids. Indian paintbrush can provide bright bursts of color in your garden.”","约瑟夫点头表示赞同。“用仙人掌就能布置出很漂亮的花园，沙漠里也可以种多肉之外的植物。”他指着旁边的几盆花草。“我给你们看看我最喜欢的几种。沙漠柳的花很漂亮，有的人觉得像兰花。印第安画笔花能给花园添上几抹鲜亮的颜色。”"],"type":"paragraph"},{"n":12,"t":["Chiara and her mom grinned at each other. “I don’t think we had any idea what a lush, colorful garden we could have in the desert!” exclaimed Mrs. Giardini. “I’m not even going to worry about our stacks of boxes until we get a good start on the garden.”","基娅拉和妈妈相视一笑。“我们根本没想到，在沙漠里也能有一座这么繁茂、这么多彩的花园！”贾尔迪尼夫人感叹，“花园没好好开个头之前，我才不去管那一堆堆纸箱呢。”"],"type":"paragraph"},{"n":13,"t":["“I can’t wait to begin,” said Chiara, already loading plants into the cart.","“我已经等不及要开始了，”基娅拉说着，已经动手把植物往购物推车里放了。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Number the events below to show the order in which they happened.\n\n________ Joseph showed Chiara and her mom several of his favorite desert plants.\n________ Chiara ate her breakfast in the car.\n________ The Giardinis moved to Arizona from Massachusetts.\n________ Mrs. Giardini said she missed the greenery in her old backyard.\n________ Chiara found her mother sitting on the deck sipping coffee.","给下列事件编上序号，标出发生的先后顺序。\n约瑟夫给基娅拉和妈妈看了几种他最喜欢的沙漠植物。\n基娅拉在车上吃早饭。\n贾尔迪尼一家从马萨诸塞州搬到亚利桑那州。\n贾尔迪尼夫人说她想念原来后院的那片绿色。\n基娅拉发现妈妈坐在露台上喝咖啡。"],"ans":["- **5** Joseph showed Chiara and her mom several of his favorite desert plants.\n- **4** Chiara ate her breakfast in the car.\n- **1** The Giardinis moved to Arizona from Massachusetts.\n- **3** Mrs. Giardini said she missed the greenery in her old backyard.\n- **2** Chiara found her mother sitting on the deck sipping coffee.","5 约瑟夫给基娅拉和妈妈看了几种他最喜欢的沙漠植物。\n4 基娅拉在车上吃早饭。\n1 贾尔迪尼一家从马萨诸塞州搬到亚利桑那州。\n3 贾尔迪尼夫人说她想念原来后院的那片绿色。\n2 基娅拉发现妈妈坐在露台上喝咖啡。"]},{"n":2,"ask":["What problem do Chiara and her mom have at the beginning of the story?\n\n________","故事开头，基娅拉和妈妈遇到了什么问题？"],"ans":["They miss the garden and the greenery at their old home in Massachusetts.","她们想念马萨诸塞州旧家里的花园和那片绿色。"]},{"n":3,"ask":["Do you think that planting a garden will help the Giardinis feel more at home in Arizona? Why or why not?\n\n________","你认为种一座花园能让贾尔迪尼一家在亚利桑那州更有家的感觉吗？为什么？"],"ans":["Answers will vary. Possible answer: Yes, they said they were missing the greenery in their yard back home.","答案因人而异。示例：能，因为她们说自己想念原来家里院子里的那片绿色。"]},{"n":4,"ask":["What is one way in which Massachusetts and Arizona are different?\n\n________","马萨诸塞州和亚利桑那州有什么不同？说出一点。"],"ans":["Possible answers: the temperature; the landscape","示例：气温或景色不同。"]},{"n":5,"ask":["What does Mrs. Giardini mean when she says, “Arizona and Massachusetts could be different planets”?\n\n________","贾尔迪尼夫人说“亚利桑那州和马萨诸塞州简直像在两个星球上”，是什么意思？"],"ans":["The two states seem very different to her.","在她看来，这两个州的差别非常大。"]},{"n":6,"ask":["Name the two different settings in this story.\n\n________","说出故事发生的两个地点。"],"ans":["the Giardini’s house; the nursery","贾尔迪尼家的房子；苗圃。"]},{"n":7,"ask":["Why were Chiara and her mom surprised to hear that they could plant colorful, blooming plants?\n\n________","为什么基娅拉和妈妈听说自己能种出色彩艳丽的开花植物时很惊讶？"],"ans":["Possible answer: They weren’t expecting those kinds of plants to do well in the desert.","示例：她们原来没想到这类植物在沙漠里也能长得好。"]},{"n":8,"ask":["Why does Joseph recommend that Chiara and her mom plant native plants?\n\n________","为什么约瑟夫建议基娅拉和妈妈种本地植物？"],"ans":["They do well in that climate, and they won’t need a lot of water.","本地植物适合这里的气候，浇水也不用太多。"]}]},{"id":"P128","title":["A Dry, Hot Land","干燥炎热的地方"],"lead":["Where is the world’s largest desert?","世界上最大的沙漠在哪里？"],"exercise":"P129","genre":"地理说明文","family":"info","parts":[{"n":1,"t":["Unless you live in the western part of the United States, you may consider deserts to be exotic, rare places. Actually, deserts are very common, covering nearly one-third of Earth’s land surface. Although lack of precipitation is the most obvious characteristic of desert regions—they receive less than ten inches per year—deserts also have high rates of evaporation. What little precipitation does fall is quickly absorbed back into the atmosphere.","如果你不住在美国西部，也许会以为沙漠是罕见、陌生的地方。其实，沙漠很常见，覆盖了地球陆地表面近三分之一的面积。降水少是沙漠地区最明显的特征，每年的降水不到10英寸。此外，沙漠的蒸发速度也很快。仅有的一点降水，很快就又回到大气里去了。"],"type":"paragraph"},{"n":2,"t":["Because of this lack of moisture, deserts can be very hot during the day. Water has a natural cooling effect, but without it, the sun cooks the land. In some deserts, temperatures are regularly as high as 130 degrees Fahrenheit. However, after the sun goes down, all that heat escapes from the desert ground and the temperatures drop quickly, sometimes all the way to freezing!","由于缺少水分，沙漠白天可能非常热。水天然就有降温的作用，但在缺水时，太阳把大地烤得滚烫。在有些沙漠，气温经常高达华氏130度。然而，太阳下山后，热量从沙漠地面散去，气温迅速下降，有时竟一直降到冰点！"],"type":"paragraph"},{"n":3,"t":["Some deserts are not hot, even during the day. Areas with low precipitation and high evaporation rates located in the extreme Northern Hemisphere are called *tundras*, a type of frozen desert. Because of the tundra’s extremely low temperature, any moisture that is present remains frozen.","有些沙漠即使在白天也不热。北半球最北部有些降水量低、蒸发速率高的地区，叫作苔原，是一种冰冻沙漠。由于苔原温度极低，那里只要有水分，就一直处于冻结状态。"],"type":"paragraph"},{"n":4,"t":["Sandy deserts are the most familiar, probably because they are filmed and photographed so often for their natural beauty. Looking like giant, frozen ocean waves, sand dunes reach up to meet the brilliant blue sky. In fact, the dunes are not frozen at all. They are constantly moving and act more like the ocean than you might think.","人们最熟悉的是沙质沙漠，大概是因为它们风景优美，常被拍进影片或照片里。沙丘像凝固了的巨大海浪，高高隆起，仿佛碰到了湛蓝的天空。其实，沙丘一点儿也没有凝固。它们一直在移动，运动方式比你想象的更像海洋。"],"type":"paragraph"},{"n":5,"t":["Winds in the desert are very powerful because there is so little in the landscape to slow them down. The sand gets pushed around, just like water in the sea, and shifted and shaped into constantly changing wave-like forms. However, only about 20 percent of Earth’s deserts are made of sand. Most deserts consist of larger rocks like pebbles and stones.","沙漠里的风十分强劲，因为地面上几乎没有什么能阻挡风。沙子像海水一样被风推着移动，不断形成变化着的波浪形。不过，地球上的沙漠只有大约20%由沙子构成。大部分沙漠的地面是较大的颗粒，如卵石和石块。"],"type":"paragraph"},{"n":6,"t":["The largest desert on Earth is the Sahara in northern Africa. Covering more than three-and-a-half million square miles, the whole United States could fit within this arid region. The Sahara is one of the driest places on Earth. It receives almost no rainfall during the year and has basically no surface water. However, there is water flowing underground that occasionally reaches the desert surface. An area of moisture and plant life within a dry desert is called an oasis. Although there are some natural oases, most of them are artificially created by irrigation or wells.","地球上最大的沙漠是非洲北部的撒哈拉沙漠。它占地350多万平方英里，整片干旱地区足以容纳整个美国。撒哈拉沙漠是地球上最干燥的地方之一，一年里几乎不下雨，地表也基本没有水。不过，地下有水流，有时会到达沙漠地表。干燥沙漠中有水分、能长植物的地方，叫作绿洲。虽然有些绿洲是天然形成的，大多数是通过灌溉或打井人工形成的。"],"type":"paragraph"},{"n":7,"t":["The Gobi is a major desert found in Asia. It sits on a plateau that stretches between two higher mountains. Even though part of the Gobi is as harsh as any desert, most of it is covered in a thin layer of bushes and grass that allows people to live there. The famous Venetian (və′nēSHən) traveler Marco Polo made his way across the Gobi in 1275, becoming the first explorer to describe this arid region to Europeans.","戈壁是亚洲的一片大沙漠，位于两座更高的山之间延伸的高原上。虽然戈壁的一部分和任何沙漠一样环境严酷，大部分地方还是零星长着一些灌木和草，使人能够在那里生活。著名的威尼斯旅行家马可·波罗于1275年穿过戈壁，成为首位向欧洲人描述这片干旱地区的探险家。Venetian 指“威尼斯的”，教材注音为 vē′nē′shən。"],"type":"paragraph"},{"n":8,"t":["The largest desert in the United States is the Mojave Desert, which covers parts of California, Utah, Nevada, and Arizona. An area of the Mojave, called *Death Valley*, is the lowest and hottest point in North America. Despite its reputation for hot temperatures, the Mojave does get quite cold during the winter, regularly dropping to 20 to 30 degrees Fahrenheit, and it sometimes even snows there.","美国最大的沙漠是莫哈韦沙漠，它延伸到加利福尼亚州、犹他州、内华达州和亚利桑那州的部分地区。莫哈韦沙漠中有个叫死亡谷的地方，是北美洲海拔最低、温度最高的地方。莫哈韦沙漠以炎热闻名，但冬天也会变得很冷，气温常降到华氏20至30度，有时那里甚至还会下雪。"],"type":"paragraph"}],"original":[{"n":1,"ask":["the process by which liquid changes into vapor or gas\n\n________","液体变成蒸气或气体的过程。"],"ans":["evaporation","evaporation（蒸发）。"],"dir":["Write the words from the passage that have the meanings below.","从课文中找出符合下列释义的词，写下来。"]},{"n":2,"ask":["water that falls to Earth in the form of rain or snow\n\n________","以雨或雪的形式落到地面的水。"],"ans":["precipitation","precipitation（降水）。"]},{"n":3,"ask":["hills of sand that are pushed into shape by the wind\n\n________","被风吹成形的沙堆。"],"ans":["dunes","dunes（沙丘）。"]},{"n":4,"ask":["dry; having little rainfall\n\n________","干燥，降雨少。"],"ans":["arid","arid（干旱的）。"]},{"n":5,"ask":["an area of flat land that is higher than the surrounding land\n\n________","比周围地势高的一片平坦的土地。"],"ans":["plateau","plateau（高原）。"]},{"n":6,"ask":["How much of Earth’s land surface do deserts cover?\n\n________","沙漠覆盖了地球陆地表面多大的面积？"],"ans":["about one-third","大约三分之一。"]},{"n":7,"ask":["Who was Marco Polo?\n\n________","马可·波罗是什么人？"],"ans":["a Venetian traveler and explorer","威尼斯旅行家和探险家。"]},{"n":8,"ask":["Why do some people compare sand dunes to ocean waves?\n\n________\n\n________","为什么有人把沙丘比作海浪？"],"ans":["They resemble giant, frozen waves.","它们像凝固了的巨大海浪。"]},{"n":9,"ask":["What is an oasis? What is the plural form of oasis?\n\n________\n\n________","什么是 oasis？这个英文词的复数是什么？"],"ans":["an area of moisture and plant life in the desert; oases.","oasis（绿洲）是沙漠中有水分和植物的地方，复数是 oases。"]},{"n":10,"ask":["________ Most of Earth’s deserts are made of sand.","地球上大部分沙漠都由沙子构成。"],"ans":["F","错误（F）。"],"dir":["Write T before the sentences that are true. Write F before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":11,"ask":["________ The Sahara receives almost no rainfall.","撒哈拉沙漠几乎不下雨。"],"ans":["T","正确（T）。"]},{"n":12,"ask":["________ The Mojave Desert is the largest American desert.","莫哈韦沙漠是美国最大的沙漠。"],"ans":["T","正确（T）。"]},{"n":13,"ask":["________ The Gobi is located in northern Africa.","戈壁位于非洲北部。"],"ans":["F","错误（F）。"]}]},{"id":"P130","title":["Calling Nowhere","打往荒漠的电话"],"lead":["Why would there be a phone booth in the middle of the desert?","为什么沙漠深处会有一个电话亭？"],"exercise":"P131","genre":"纪实故事","family":"info","parts":[{"n":1,"t":["At some point following World War II, a phone booth was installed in the Mojave Desert, 12 miles from the nearest interstate. It seems like an odd location for a phone booth, but there are two mines in the area, and the phone was originally installed for use by the miners and their families.","第二次世界大战后的一段时间里，有人在莫哈韦沙漠装了个电话亭，距最近的州际公路12英里。在这种地方装电话亭好像挺奇怪，不过附近有两座矿，这部电话原本是给矿工和他们的家人用的。"],"type":"paragraph"},{"n":2,"t":["Godfrey Daniels, a computer programmer from Arizona, heard about the phone from a friend. He had the number and decided to call it one day, just to see if anyone might answer. He didn't really expect a response, and sure enough, there was no answer when he called.","来自亚利桑那州的计算机程序员戈弗雷·丹尼尔斯从朋友那里听说了这部电话。他手里有号码，有一天便决定打过去，看看有没有人接。他并不真的指望有人回应，果然，他打过去时没人接。"],"type":"paragraph"},{"n":3,"t":["After dialing the number periodically, he was shocked to hear a busy signal one day. He assumed that there was a problem with the line, but he kept calling anyway. After several tries, someone actually answered the phone. Daniels spoke with a woman who worked at one of the mines. She lived in a remote area without phone service and used the phone for making calls.","他隔一阵子就拨一次这个号码。有一天，他竟然听到了占线的提示音，吃了一惊。他以为线路出了故障，还是接着打。试了几次之后，竟然真的有人接了电话。接电话的是一位在其中一座矿山工作的女子。她住在一个没有电话服务的偏远地方，就用这部电话给别人打电话。"],"type":"paragraph"},{"n":4,"t":["Daniels loved the idea of a phone in the middle of nowhere. He was even more fascinated with the idea that someone might actually be available to answer the phone in such a remote place. He posted the phone's number on the Internet, and people began calling it. Just as Daniels was intrigued by the idea of the phone booth in the middle of the desert, so were the callers who had visited his website.","丹尼尔斯很喜欢在荒无人烟的地方有部电话这个想法。更令他着迷的是，在这么偏僻的地方，竟然真可能有人接电话。他把号码发到了网上，于是人们也开始往那里打电话。丹尼尔斯对沙漠深处的电话亭如此着迷，访问过他网站的来电者也一样。"],"type":"paragraph"},{"n":5,"t":["Daniels eventually traveled to Southern California to visit the booth himself. Evidently, he wasn't the only person to have that idea. As more people heard about the Mojave Desert phone booth, tourists decided to visit the secluded location. People who called the phone began to frequently hear a busy signal. When someone answered the phone, he or she had the opportunity to speak with callers from all around the United States, as well as Germany, England, Italy, France, Australia, and South Africa.","后来，丹尼尔斯亲自去了南加州，想看看这个电话亭。显然，有这个想法的人并不只有他一个。越来越多人听说莫哈韦沙漠电话亭，游客也决定要去这个偏僻的地方看看。往那里打电话的人开始常常听到占线音。有人接电话时，就有机会和美国各地的人聊天，也会接到来自德国、英国、意大利、法国、澳大利亚和南非的来电。"],"type":"paragraph"},{"n":6,"t":["What did strangers find to talk about during these unusual calls? They usually identified themselves and discussed where they were calling from and how they had heard about the phone booth. One thing people love about the Internet is how it seems to make the world feel smaller. Maybe in some small way, the Mojave Desert phone booth accomplished the same thing.","彼此陌生的人在这些不寻常的通话中都聊些什么呢？他们通常会先介绍自己，再聊自己从哪里打来，又是怎么听说这个电话亭的。人们喜欢互联网的一个原因，是它似乎能让世界变小。莫哈韦沙漠的电话亭，说不定也在某种程度上起了同样的作用。"],"type":"paragraph"},{"n":7,"t":["In May of 2000, the National Park Service and Pacific-Bell, the owner of the phone booth, made the decision to remove the booth. The National Park Service felt that the area was receiving too much traffic as a result of all the publicity surrounding the booth. They were worried that it might somehow damage the environment, and they felt that it was their responsibility to protect the land of the Mojave Desert National Preserve.","2000年5月，美国国家公园管理局与电话亭的所有者太平洋贝尔公司决定拆除电话亭。国家公园管理局认为，围绕电话亭的大量宣传让过多的人来到这个地区。他们担心这可能损害当地环境，认为自己有责任保护莫哈韦国家保护区。"],"type":"paragraph"},{"n":8,"t":["Today, the place where the booth once stood is marked by a simple tombstone. People who don't know that it was removed still call the number. There is no disconnect message on the line. The number just rings and rings, as the caller waits patiently for someone to answer.","如今，电话亭曾经矗立的地方立着一块简朴的墓碑。不知道电话亭已被拆走的人，仍会拨打那个号码。线路上没有停机提示，拨号的人只听见铃声一遍又一遍地响，仍耐心地等着有人接听。"],"type":"paragraph"}],"original":[{"n":1,"ask":["How did Godfrey Daniels publicize the Mojave Desert phone booth?\n\n________","戈弗雷·丹尼尔斯怎样让莫哈韦沙漠电话亭广为人知？"],"ans":["He wrote about it on the Internet and posted its number there.","他在网上写了这个电话亭的事，还公布了电话号码。"]},{"n":2,"ask":["Do you think the National Parks Service and Pacific-Bell made the right decision to remove the phone booth? Explain.\n\n________","你认为国家公园管理局和太平洋贝尔公司拆掉电话亭的决定正确吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":3,"ask":["What happens if someone calls the phone booth today?\n\n________","如果今天有人打电话到那个电话亭，会发生什么？"],"ans":["The phone will ring only on the caller's end.","只有拨电话的人能听到铃声。"]},{"n":4,"ask":["Why was the phone booth originally installed?\n\n________","这个电话亭最初为什么要安装？"],"ans":["for use by miners and their families","给矿工和他们的家人使用。"]},{"n":5,"ask":["On the lines below, write the main idea of paragraph 6.\n\n________","写下第6段的中心意思。"],"ans":["People liked making a connection with strangers because it made the world seem smaller.","人们喜欢与陌生人建立联系，因为这让世界仿佛变小了。"]},{"n":6,"ask":["________ The phone booth was originally intended to be used by miners.","电话亭原本是给矿工用的。"],"ans":["T","正确（T）。"],"dir":["Write T before the sentences that are true. Write F before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":7,"ask":["________ The phone booth is still in working order today.","电话亭今天仍可正常使用。"],"ans":["F","错误（F）。"]},{"n":8,"ask":["________ Godfrey Daniels posted the number of the booth on the Internet.","戈弗雷·丹尼尔斯把电话亭的号码发到了网上。"],"ans":["T","正确（T）。"]},{"n":9,"ask":["________ The phone booth was located in Arizona.","电话亭在亚利桑那州。"],"ans":["F","错误（F）。"]},{"n":10,"ask":["________ People seemed to like the idea of connecting with others in faraway places.","人们似乎喜欢和远方的人取得联系这个想法。"],"ans":["T","正确（T）。"]},{"n":11,"ask":["If the phone booth was still in place today, would you want to call the number? Explain.\n\n________","如果这个电话亭今天还在，你会想打那个号码吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]}]},{"id":"P132","title":["A Paper Surprise","折纸带来的惊喜"],"lead":["Keep reading to learn more about Aunt Suki’s interesting hobby.","接着读，了解苏琪姨妈这项有趣的爱好。"],"exercise":"P133","genre":"家庭故事","family":"lit","parts":[{"n":1,"t":["Emi and Ken were sitting on the floor of the guest bedroom talking to their aunt. Their parents had gone out for the evening, and they were trying to decide if they should rent a movie, play a game, or make Aunt Suki’s special chocolate-chunk oatmeal cookies.","惠美和健坐在客房的地板上，和姨妈聊天。爸爸妈妈晚上出门了，他们正在商量，是租部电影、玩个游戏，还是做苏琪姨妈拿手的巧克力块燕麦曲奇。"],"type":"paragraph"},{"n":2,"t":["“What are those, Aunt Suki?” asked Emi, pointing to two brightly-colored paper animals sitting on top of the dresser.","“那些是什么呀，苏琪姨妈？”惠美指着梳妆柜上两只颜色鲜艳的纸动物问。"],"type":"paragraph"},{"n":3,"t":["“Last night, I couldn’t sleep, probably because I was still adjusting to the time difference between California and New Jersey,” replied Aunt Suki. “I was rummaging through my suitcase, looking for a book or a crossword puzzle, when I found my origami papers.”","“昨晚我睡不着，大概是还没适应加利福尼亚州和新泽西州之间的时差，”苏琪姨妈回答，“我在行李箱里翻来翻去，想找本书或者一份填字游戏，结果找到了我的折纸用纸。”"],"type":"paragraph"},{"n":4,"t":["“Origami is paper folding, right?” asked Ken.","“Origami 就是折纸，对吧？”健问。"],"type":"paragraph"},{"n":5,"t":["Aunt Suki nodded. “There is more to it than that, though. The nature of origami appeals to many people. You must concentrate when you do origami, but it doesn’t require a great deal of thought.","苏琪姨妈点点头。“它还有别的讲究呢。折纸本身就很吸引人。折的时候必须集中注意力，可不用费很多脑筋。"],"type":"paragraph"},{"n":6,"t":["“In a way, it reminds me of counting. Once you know your numbers, counting is a simple task. But when you are counting a large number of things, you must concentrate or you will lose your place. Counting isn’t as productive, or nearly as enjoyable, as origami, though,” Aunt Suki added, smiling and showing the dimple in her right cheek.","“从某种意义上说，它让我想到数数。一旦认得数字，数数就很简单。不过，要是数的东西很多，就得集中注意力，否则就会忘记数到哪儿了。不过，数数既没有折纸那么有成果，也远没有那么好玩。”苏琪姨妈补充道，笑着露出了右脸颊上的酒窝。"],"type":"paragraph"},{"n":7,"t":["Emi reached up and touched the small indentation on her aunt’s face. “Mom has one just like it,” she said.","惠美抬起手，摸了摸姨妈脸上的小凹窝。“妈妈也有一模一样的酒窝，”她说。"],"type":"paragraph"},{"n":8,"t":["“I know,” said Aunt Suki. “Your mother’s dimple is in her left cheek, and mine is in my right cheek. When we were little, we used to pretend it meant that we were twins.”","“我知道，”苏琪姨妈说，“你妈妈的酒窝在左脸颊，我的在右脸颊。我们小时候还假装这说明我们是双胞胎呢。”"],"type":"paragraph"},{"n":9,"t":["Emi and Ken grinned. They liked the idea of their mother and Aunt Suki as little girls, pretending to be twins. “Does Mom know how to do origami?” asked Ken.","惠美和健咧嘴笑了。他们觉得，想象妈妈和苏琪姨妈小时候装成双胞胎，还真有意思。“妈妈会折纸吗？”健问。"],"type":"paragraph"},{"n":10,"t":["Aunt Suki shook her head. “Even though we grew up in Japan, I didn’t learn origami until I moved to the United States. Your mother has mentioned that it is a tradition she would like to learn one day, so I thought I might give her a few lessons while I’m here.”","苏琪姨妈摇摇头。“虽然我们在日本长大，可我搬到美国后才学会折纸。你妈妈说过，希望有一天能学学这门传统手艺。所以我想，趁这次来，就教她几课。”"],"type":"paragraph"},{"n":11,"t":["“Can you give us a few lessons, too?” asked Emi. She cupped the delicate origami bird gently in her hand. “I can’t believe you made this just by folding paper.”","“那你也教教我们行吗？”惠美问。她把精巧的折纸小鸟轻轻捧在手心。“真不敢相信，你只靠折纸就能做出这个。”"],"type":"paragraph"},{"n":12,"t":["“Of course,” said Aunt Suki. “I’d love to.” She gestured to the bird in Emi’s hands. “Pull his tail gently.” When Emi did, the bird’s wings flapped up and down. Emi looked amazed.","“当然行，”苏琪姨妈说，“我很乐意。”她示意惠美看看手里的鸟。“轻轻拉一下它的尾巴。”惠美一拉，小鸟的翅膀就上下扇动起来。惠美一脸惊奇。"],"type":"paragraph"},{"n":13,"t":["“When can we start?” asked Ken, pulling the origami frog from the dresser to examine it more closely.","“我们什么时候可以开始？”健问。他从梳妆柜上拿起纸青蛙，想凑近看看。"],"type":"paragraph"},{"n":14,"t":["Aunt Suki shrugged. “Whenever you’d like.”","苏琪姨妈耸耸肩。“你们想什么时候开始都行。”"],"type":"paragraph"},{"n":15,"t":["“You can teach us first,” suggested Emi, “and we’ll help you teach Mom. We’ll be passing the tradition up instead of down.”","“你可以先教我们，”惠美提议，“我们再帮你教妈妈。这回，这门手艺就从小辈传给长辈啦。”"],"type":"paragraph"},{"n":16,"t":["Aunt Suki smiled again, showing her dimple. “I think your mom will love the surprise,” she said.","苏琪姨妈又笑了，露出了酒窝。“我想你妈妈一定会喜欢这份惊喜。”"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ Can we rent a movie tonight?","我们今晚能租部电影看吗？"],"ans":["F","第一人称视角（F）。"],"dir":["Mark each sentence below **F** if it is in first-person point of view and **T** if it is in third-person point of view.","下列各句采用第一人称视角的标 F，采用第三人称视角的标 T。"]},{"n":2,"ask":["________ I moved to the United States when I was 19 years old.","我19岁时搬到了美国。"],"ans":["F","第一人称视角（F）。"]},{"n":3,"ask":["________ Ken examined the origami frog.","健仔细看了看那只纸青蛙。"],"ans":["T","第三人称视角（T）。"]},{"n":4,"ask":["________ I find origami to be a relaxing hobby.","我觉得折纸是一项能让人放松的爱好。"],"ans":["F","第一人称视角（F）。"]},{"n":5,"ask":["________ Emi and Ken liked hearing stories about their mother as a little girl.","惠美和健喜欢听妈妈小时候的故事。"],"ans":["T","第三人称视角（T）。"]},{"n":6,"ask":["How is Aunt Suki related to Emi and Ken’s mother?\n________","苏琪姨妈和惠美、健的妈妈是什么关系？"],"ans":["She is their mother’s sister.","苏琪是他们妈妈的姐妹。"]},{"n":7,"ask":["Where did Aunt Suki grow up?\n________","苏琪姨妈在哪里长大？"],"ans":["in Japan","在日本。"]},{"n":8,"ask":["What does Emi mean when she says they’ll pass the tradition “up instead of down”?\n________","惠美说要把传统“传给长辈，而不是传给小辈”，是什么意思？"],"ans":["She is making a joke because traditions are usually passed “down” to the next generation.","她在开玩笑，因为传统通常是由长辈往下传给下一代的。"]},{"n":9,"ask":["What does Aunt Suki do when she can’t sleep?\n________","苏琪姨妈睡不着时做什么？"],"ans":["She does oragami.","她做折纸。"]},{"n":10,"ask":["What feature do Aunt Suki and her sister share?\n________","苏琪姨妈和她的姐妹有什么共同的外貌特征？"],"ans":["They each have a dimple.","两人各有一个酒窝。"]},{"n":11,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ to learn\n- ________ to form an opinion\n- ________ for entertainment","读者可能出于什么目的阅读这篇文章？\n学习知识\n形成某种看法\n消遣娱乐"],"ans":["✓ for entertainment","消遣娱乐。"]},{"n":12,"ask":["What word in paragraph 7 means “a dent”?\n________","第7段中，哪个词的意思是“凹痕”？"],"ans":["indentation","indentation（凹痕、凹陷）。"]},{"n":13,"ask":["How are counting and origami similar?\n________","数数和折纸有什么相似之处？"],"ans":["Possible answer: They are both simple, but you have to concentrate.","示例：两件事都很简单，但都需要集中注意力。"]}]},{"id":"P134","title":["Fascinating Folders","让人着迷的折纸艺术"],"lead":["Have you ever tried folding paper into interesting shapes?","你试过把纸折成有趣的形状吗？"],"exercise":"P135","genre":"手工艺术说明文","family":"info","parts":[{"n":1,"t":["What can you do with a simple sheet of paper? You could write a note to a friend, type a story, or make a paper airplane. But if you learn a few basic folding techniques, you could be making a variety of interesting objects, such as a grasshopper, a stegosaurus, a giraffe, a pick-up truck, or even the White House. There's a good chance that an expert folder somewhere in the world has made an origami version of almost anything you can imagine.","一张普普通通的纸能做什么？你可以给朋友写张便条、打字写个故事，或者折一架纸飞机。如果再学会几种基本折法，你就能折出各种有意思的东西，比如蚱蜢、剑龙、长颈鹿、皮卡车，甚至白宫。你能想到的东西，几乎都很可能已经被世界某处的一位折纸高手折出来了。"],"type":"paragraph"},{"n":2,"t":["Origami is the art of folding paper into three-dimensional figures of people, animals, and objects. The word *origami* is Japanese. It comes from the word *oru*, meaning *to fold*, and *kami*, meaning *paper*. The origin of origami itself, however, is unclear. Some historians believe that it was first practiced in China around the second century A.D. Others think that there is not enough evidence to support this theory and that the practice of origami was begun in Japan several hundred years later. What we do know is that origami was clearly developed in Japan, where it is considered a part of the culture and lifestyle of the people.","折纸是将纸张折成立体的人物、动物和物件的艺术。origami 是一个日语词，由意为“折叠”的 oru 和意为“纸”的 kami 构成。至于这门艺术起源于哪里，还不清楚。有的历史学家认为，大约公元2世纪，中国就有人开始折纸。还有人认为，没有足够的证据支持这种说法，折纸是几百年后才在日本开始的。我们确实知道，折纸在日本得到了发展，当地人把它视为自己文化与生活方式的一部分。"],"type":"paragraph"},{"n":3,"t":["One of the most fascinating aspects of origami is the way in which something as simple as a sheet of paper can be transformed into something beautiful and complex. Origami begins with sheets of special paper that are usually six inches on each side. The paper is generally white on one side and colored or marked with a decorative pattern on the other side. It is thin, which allows it to be folded many times, and creases easily.","折纸最引人入胜的地方之一，就是一张如此普通的纸竟能变成精美而复杂的作品。折纸通常从一张边长6英寸的专用纸开始。这种纸一般一面是白色的，另一面有颜色或装饰图案。纸很薄，可以反复折叠，也容易留下折痕。"],"type":"paragraph"},{"n":4,"t":["Although origami paper is traditionally used in this ancient craft, modern-day folders have experimented with many other materials, such as tissue paper, silk, foil, and even bubblegum wrappers. Folders usually avoid scissors and glue, two taboos in the world of paper folding.","传统上，这门古老的手艺用的是折纸专用纸，今天的折纸爱好者已经试用了许多其他材料，比如薄棉纸、丝绸、金属箔，甚至泡泡糖包装纸。不过，折纸的人通常避免用剪刀和胶水，这两样东西在折纸界是禁忌。"],"type":"paragraph"},{"n":5,"t":["Beginners are often taught several folds and bases which are the starting shapes for other, more complicated figures. Some basic folds are the valley fold, mountain fold, petal fold, rabbit ear, squash fold, and reverse fold. These folds are used to create bases, such as the kite, fish, bird, and frog. Once a folder has learned these basic elements, he or she can progress to more elaborate figures.","初学者通常先学几种折法和基本形。基本形就是用来折出其他复杂造型的起始形状。基本折法有谷折、山折、花瓣折、兔耳折、压折和反折。用这些折法可以做出风筝、鱼、鸟和青蛙等基本形。掌握了基本折法和基本形之后，就能继续学习更精细的造型。"],"type":"paragraph"},{"n":6,"t":["Diagrams are important to people who take origami seriously because they show the folds needed to make a particular figure. In the early 1950s, Akira Yoshizawa, a Japanese origami master, began publishing books that provided illustrations showing others how to re-create the designs he had invented. He also created a set of diagram symbols that could be used when someone wanted to share with others a figure he or she had created.","对认真钻研折纸的人来说，图解十分重要，因为它们标出了折出某种造型所需的折法。20世纪50年代初，日本折纸大师吉泽章开始出版带图解的书，向别人展示怎样折出他原创的设计。他还创制了一套图解符号，供大家分享自己的原创折纸造型。"],"type":"paragraph"},{"n":7,"t":["For some people, origami is a hobby. Others view it as an art form and a means of creative expression. It is not uncommon for people to spend a great deal of time creating original pieces of origami in designs they have invented themselves. For example, one man created an origami model of the *Starship Enterprise* from the popular television show *Star Trek*. It took him a month to design the piece. If someone else wishes to duplicate it, they can use the 72 diagrams and 11 pages of directions the designer created to explain the process.","对一些人来说，折纸是一项爱好。还有人把它看作一种艺术形式，用来发挥创意、表达自己。许多人舍得花大量时间，按自己的设计做原创折纸作品。例如，有人用纸折出了热门电视剧《星际迷航》里的“进取号”星舰模型。他花了整整一个月设计这件作品。如果还有人也想照着折，可以参考设计者为解释整个过程而绘制的72张图和写下的11页说明。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What does the word *origami* mean in Japanese?\n\n________","origami 在日语里是什么意思？"],"ans":["paper folding","折纸。"]},{"n":2,"ask":["Name two materials other than origami paper that have been used in modern origami.\n\n________","除了专用折纸纸张，还可用哪些材料做现代折纸？说出两种。"],"ans":["Possible answers: tissue paper, silk, foil, bubble gum wrappers","示例：薄棉纸、丝绸、金属箔、泡泡糖包装纸。"]},{"n":3,"ask":["Why do you think that serious origamists do not use scissors or glue?\n\n________","你认为认真钻研折纸的人为什么不用剪刀或胶水？"],"ans":["Possible answer: because it would alter the types of things they could make","示例：因为这会改变他们能做出的作品种类。"]},{"n":4,"ask":["How many diagrams would you have to follow to create an origami model of the *Starship Enterprise*?\n\n________","折出“进取号”星舰模型，需要参考多少张图解？"],"ans":["72","72张。"]},{"n":5,"ask":["________ Origami paper tends to be thicker than regular paper.","折纸专用纸通常比普通纸厚。"],"ans":["F","错误（F）。"],"dir":["Write **T** before the sentences that are true. Write **F** before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":6,"ask":["________ People have experimented with using materials other than paper to create origami figures.","人们尝试过用纸以外的材料制作折纸作品。"],"ans":["T","正确（T）。"]},{"n":7,"ask":["________ Akira Yoshizawa was the first person to practice origami in Japan.","吉泽章是日本第一个做折纸的人。"],"ans":["F","错误（F）。"]},{"n":8,"ask":["________ The kite, fish, bird, and frog are four origami bases.","风筝、鱼、鸟和青蛙是四种折纸基本形。"],"ans":["T","正确（T）。"]},{"n":9,"ask":["________ Some historians believe origami has its origins in China.","有的历史学家认为折纸起源于中国。"],"ans":["T","正确（T）。"]},{"n":10,"ask":["Check the sentence below that is the best summary for paragraph 6.\n\n- ________ Yoshizawa published origami books during the 1950s.\n- ________ Origami diagrams are important because they allow people to share their designs for particular figures.\n- ________ Diagrams show the folds needed to make origami figures.","勾选最能概括第6段的一句。\n吉泽章在20世纪50年代出版了折纸书。\n折纸图解很重要，因为人们可以用它们分享自己设计的造型。\n图解展示了折出各种造型所需的折法。"],"ans":["✓ Origami diagrams are important because they allow people to share their designs for particular figures.","折纸图解很重要，因为人们可以用它们分享自己设计的造型。"]},{"n":11,"ask":["Is oragami a hobby you would be interestd in trying? Explain.\n\n________","你有兴趣尝试折纸这项爱好吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":12,"ask":["The latin root **form** means *shape*. Find a word in paragraph 3 with the root **form**.\n\n________","拉丁语词根 form 意为“形状”。在第3段中找一个含有 form 的词。"],"ans":["transformed","transformed（转变成）。"]}]},{"id":"P136","title":["Seeing Differently","换一种方式看世界"],"lead":["Do you think you would have a hard time coping with losing your eyesight?","如果失去视力，你觉得自己会很难适应吗？"],"exercise":"P137","genre":"家庭故事","family":"lit","parts":[{"n":1,"t":["\"Hi, Grandpa,\" said Carson, taking a seat across from his grandfather at the breakfast table. Carson knew that his grandfather's eyesight had been going downhill for the past year. Still, it was a shock to realize that his grandfather could now see only occasional shadows and changes in light.","“嗨，爷爷。”卡森说着，在早餐桌旁、爷爷对面坐下。卡森知道，过去一年爷爷的视力一直在下降。可是，一想到爷爷现在只能偶尔看见一些影子和光线变化，他还是很震惊。"],"type":"paragraph"},{"n":2,"t":["\"Morning, Carson,\" said Grandpa, with the same old grin he had always had. \"Here, try a bite of this.\" Grandpa neatly scooped up a piece of omelet from his plate and offered it to Carson.","“早，卡森，”爷爷说，脸上还是一贯的笑容，“来，尝一口这个。”他利落地从自己盘子里舀起一块煎蛋卷，递给卡森。"],"type":"paragraph"},{"n":3,"t":["Carson ate the piece of omelet and made a face. \"The eggs aren't too bad, Grandpa,\" he said, \"but I don't know how you can eat all that hot sauce for breakfast.\"","卡森吃了那块煎蛋卷，扮了个苦脸。“爷爷，蛋倒还行，”他说，“我就是不知道你怎么能一大早吃那么多辣酱。”"],"type":"paragraph"},{"n":4,"t":["Grandpa laughed. \"It keeps me young!\" he said.","爷爷笑了。“这样我才能保持年轻！”他说。"],"type":"paragraph"},{"n":5,"t":["Carson was surprised to see Grandpa walk over to the computer a few minutes later and flip it on. \"Do you need some help, Grandpa?\" asked Carson.","几分钟后，卡森看到爷爷走到电脑前，打开了电脑，觉得很意外。“爷爷，你需要帮忙吗？”他问。"],"type":"paragraph"},{"n":6,"t":["\"I don't think so,\" replied Grandpa. \"I just wanted to get a little dose of morning news,\" he said.","“我想不用，”爷爷回答，“我只是想听一小段早间新闻。”"],"type":"paragraph"},{"n":7,"t":["\"How will you do that?\" asked Carson curiously, pulling up a chair next to his grandfather.","“你打算怎么听？”卡森好奇地问，拉了把椅子坐到爷爷身边。"],"type":"paragraph"},{"n":8,"t":["\"Well, I'm going to go to a special website where I can hear an audio clip of the news. I listen to the headlines and then choose a story I want to hear more about.\" Carson's grandfather began typing at the keyboard.","“嗯，我这就去一个专门的网站，在上面能听到新闻录音。我会先听标题，再选一条想多了解一些的新闻。”卡森的爷爷开始敲键盘。"],"type":"paragraph"},{"n":9,"t":["\"How do you know where all the letters are?\" asked Carson.","“你怎么知道每个字母在哪儿？”卡森问。"],"type":"paragraph"},{"n":10,"t":["\"I've been typing for a long time,\" answered Grandpa. \"After 60 years of typing, I think I have the location of the keys committed to memory. But if I didn't, I could use a Braille keyboard to guide me.\"","“我打字已经很多年了，”爷爷回答，“打了60年字，我想我早把每个按键的位置记牢了。要是没记住，也可以用盲文键盘来帮我找。”"],"type":"paragraph"},{"n":11,"t":["\"Do you use Braille to read books?\" asked Carson.","“你用盲文读书吗？”卡森问。"],"type":"paragraph"},{"n":12,"t":["\"Sometimes,\" replied Grandpa. \"Usually, I just do it to stay in practice though. Books in Braille can be very large and awkward to use because spelling out words in Braille takes up more space than using the Roman alphabet. That's why a type of Braille called Grade 2 Braille is used in almost all books. In Grade 2 Braille, contractions are used to represent frequently used words. For example, *b* stands for but, *c* stands for can, and *d* stands for do. Using contractions makes a Braille book easier to read and hold.\"","“有时候，”爷爷答道，“不过通常只是为了保持熟练。盲文逐字母拼写单词时，比用罗马字母占的空间更大，所以盲文书可能很大，拿着不方便。几乎所有的盲文书因此都用一种叫二级盲文的写法。二级盲文用缩写表示常见的词。例如，b 代表 but（但是），c 代表 can（能够），d 代表 do（做）。用上缩写，盲文书就更容易读，拿起来也更方便。”"],"type":"paragraph"},{"n":13,"t":["\"I prefer listening to audio recordings of books. There are some marvelous readers. The range of voices a single reader can do is quite impressive.\" Grandpa paused to adjust the volume on the computer's speakers. He looked surprised when Carson grabbed him in a bear hug.","“我更喜欢听书的录音。有些朗读者棒极了，一个人能用那么多种声音来读，真叫人佩服。”爷爷停下来调节电脑音箱的音量。卡森忽然张开双臂，把爷爷紧紧抱住，爷爷显得有些意外。"],"type":"paragraph"},{"n":14,"t":["\"I'm glad you're here, Grandpa,\" said Carson. \"And I'm glad that you've adjusted to the changes in your eyesight so well.\"","“爷爷，我真高兴你在这儿，”卡森说，“看到你这么好地适应了视力的变化，我也很高兴。”"],"type":"paragraph"},{"n":15,"t":["\"Losing my eyesight just made all my other senses sharper,\" said Grandpa. \"It sounds like a cliché, but it's true.\" He smiled at his grandson. \"I'm happy to be here, too,\" he added. \"I can never get enough time with my grandkids.\"","“失去视力以后，我其他的感官反倒更敏锐了。”爷爷说，“听起来像句老话，不过是真的。”他冲孙子笑了笑，又说：“我也很高兴能来。跟孙子孙女待在一起，多久都嫌不够。”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why does Carson make a face after he tries his grandpa's omelet?\n________","为什么卡森尝了爷爷的煎蛋卷后扮了个苦脸？"],"ans":["He thinks it is too spicy.","他觉得太辣了。"]},{"n":2,"ask":["How are the Braille contractions that Grandpa talks about different from the contractions you are familiar with?\n________","爷爷说的盲文缩写和你熟悉的英文缩写有什么不同？"],"ans":["They are single letters that represent a word instead of one word that is a combination of two words.","这种盲文缩写用一个字母表示一个词。普通英语缩写常把两个词缩合成一个词。"]},{"n":3,"ask":["How can Grandpa type without seeing the keyboard?\n________","爷爷看不见键盘，为什么还能打字？"],"ans":["He has been typing for a long time and has the position of the keys memorized.","他打字很多年了，已经记住了每个按键的位置。"]},{"n":4,"ask":["Name two reasons that Grandpa prefers audio books to Braille books.\n________","说出爷爷更喜欢听有声书而不是读盲文书的两个原因。"],"ans":["Braille books can be large and awkward. He liked the different voices that the readers use on audio books.","盲文书可能过大、拿着不方便。爷爷也喜欢有声书朗读者变换的各种声音。"]},{"n":5,"ask":["Number the events below to show the order in which they happened.\n________ Grandpa explained Grade 2 Braille to Carson.\n________ Carson hugged his grandpa.\n________ Carson sat down at the breakfast table.\n________ Grandpa turned on the computer.","给下列事件编上序号，标出发生的先后顺序。\n爷爷给卡森解释二级盲文。\n卡森抱住了爷爷。\n卡森在早餐桌旁坐下。\n爷爷打开电脑。"],"ans":["- **3** Grandpa explained Grade 2 Braille to Carson.\n- **4** Carson hugged his grandpa.\n- **1** Carson sat down at the breakfast table.\n- **2** Grandpa turned on the computer.","3 爷爷给卡森解释二级盲文。\n4 卡森抱住了爷爷。\n1 卡森在早餐桌旁坐下。\n2 爷爷打开电脑。"]},{"n":6,"ask":["⠃⠗⠁⠊⠇⠇⠑\n________","⠃⠗⠁⠊⠇⠇⠑"],"ans":["Braille","Braille（盲文）。"],"fig":true,"dir":["Use the letters of the Braille alphabet to decode the words below.","利用下列盲文字母表，解读下面的单词。"]},{"n":7,"ask":["⠕⠍⠑⠇⠑⠞\n________","⠕⠍⠑⠇⠑⠞"],"ans":["omelet","omelet（煎蛋卷）。"]}],"fig":{"kind":"braille","page":"P137","title":["Braille alphabet key","盲文字母对照"],"headers":[["Letter","字母"],["Braille","盲文"]],"rows":[{"n":"bA","cells":[["A","A"],["⠁","⠁"]]},{"n":"bB","cells":[["B","B"],["⠃","⠃"]]},{"n":"bE","cells":[["E","E"],["⠑","⠑"]]},{"n":"bI","cells":[["I","I"],["⠊","⠊"]]},{"n":"bL","cells":[["L","L"],["⠇","⠇"]]},{"n":"bM","cells":[["M","M"],["⠍","⠍"]]},{"n":"bO","cells":[["O","O"],["⠕","⠕"]]},{"n":"bP","cells":[["P","P"],["⠏","⠏"]]},{"n":"bR","cells":[["R","R"],["⠗","⠗"]]},{"n":"bT","cells":[["T","T"],["⠞","⠞"]]}]}},{"id":"P138","title":["Looking Into the Eye","看看眼睛的内部"],"lead":["Do you know how the human eye functions?","你知道人的眼睛是怎样工作的吗？"],"exercise":"P139","genre":"人体科普","family":"info","parts":[{"n":1,"t":["As you begin reading this, you probably aren’t thinking about how your eyes allow you to see the letters, the book, and everything else in the room. But your eyes are the complex organs that perform this very specific function, and without them you would not see. Your eyes change the light patterns surrounding you into information the brain can use to form a visual image.","开始读这篇文章时，你大概没想过，是眼睛让你看到了这些字母、这本书和房间里的其他一切。眼睛是一对结构复杂的器官，负责完成这个专门的功能。少了眼睛，你就看不见东西。眼睛把周围不同的光线分布转化成信息，大脑利用这些信息形成视觉图像。"],"type":"paragraph"},{"n":2,"t":["Light is the key to vision. Light waves coming from the sun or a lightbulb bounce off objects and surfaces, creating unique patterns and colors for your eyes to detect. Light enters the eye first through the cornea, the tough, clear outer layer of your eyeball. The cornea protects the fragile parts located inside the eyeball. It is also the first place where light is refracted so that the image you see is in focus. When someone has laser eye-surgery, it is a defective cornea that is cut and reshaped so that the person can see clearly without glasses.","光是视觉的关键。来自太阳或灯泡的光波从物体和各种表面反射回来，形成各不相同的光线分布和颜色，供眼睛辨认。光先穿过角膜进入眼内。角膜是眼球表面坚韧、透明的一层，保护着眼球内部较脆弱的部位。光最先在这里折射，使我们看到的图像能清晰地聚焦。做眼部激光手术时，医生会切削和重塑形态有问题的角膜，让人不戴眼镜也能看清楚。"],"type":"paragraph"},{"n":3,"t":["Directly behind the cornea is a watery fluid, called the *aqueous humor*, that keeps the moving parts of the eye flexible and hydrated. The iris, the colored part of your eye, is the first of these moving parts. The black dot in the middle of your iris is an opening called the *pupil*, and it controls the amount of light entering the eye. Muscles in the iris contract and relax to change the size of the pupil. When you walk indoors on a sunny day and notice that it takes time for your eyes to adjust, it is because you are waiting for your pupils to open wide enough to make up for the reduced light.","紧贴在角膜后方的是一种像水一样的液体，叫作房水。它让眼睛里能活动的部分保持灵活和湿润。最靠前的这个部分是虹膜，也就是眼睛有颜色的那一圈。虹膜中心的黑点是一个开口，叫作瞳孔，它控制进入眼睛的光量。虹膜里的肌肉收缩或放松，能改变瞳孔的大小。大晴天从室外走进屋内时，你可能会发现眼睛需要一会儿才能适应。这是因为瞳孔得张得够大，才能弥补光线的减少。"],"type":"paragraph"},{"n":4,"t":["Human beings have round pupils, but many animals have pupils of different shapes. Cats and snakes, for instance, have slit-shaped openings in their irises, allowing them to see in a wider range of light and dark circumstances. No matter what their shape, pupils appear black because they are the hole leading into the dark interior of the eyeball where light is absorbed.","人的瞳孔是圆形的，不过许多动物的瞳孔是别的形状。例如，猫和蛇的虹膜上都有裂缝状的开口，使它们在更广泛的明暗条件下都能看见东西。不管是什么形状，瞳孔看起来都是黑的，因为它通向眼球暗处，光在那里被吸收了。"],"type":"paragraph"},{"n":5,"t":["Sitting right inside the pupil’s opening is the lens, the other moving part of the eye. The lens is a flattened, transparent disc that works with the cornea to focus images onto the back of your eyeball. Although the shape of the cornea is fixed, the lens is attached to muscles that make it rounder or flatter, depending on what is needed for focusing.","就在瞳孔开口内侧，有眼睛另一个能活动的部件，叫晶状体。晶状体呈扁平透明的圆盘状，和角膜一起把图像聚焦到眼球后部。角膜形状固定，晶状体却和肌肉相连。为满足聚焦的需要，肌肉会使晶状体变得更圆或更扁。"],"type":"paragraph"},{"n":6,"t":["Inside the eyeball is a clear, jelly-like substance that keeps it round, like air filling a balloon. The back wall of the eyeball contains a very important area called the retina. The retina is covered with two kinds of light-sensitive nerve cells. Six million of them are cones, the cells that read color. Cone-shaped cells are divided into three types that detect only specific colors—yellow, green, or blue—but combine to let you see an incredible array of different colors. Color blindness is caused by a lack of one or more of these specific cone cells.","眼球里有一种透明的、像果冻一样的物质，使眼球保持圆形，就像空气把气球撑圆一样。眼球后壁有一个非常重要的部位，叫视网膜。视网膜上分布着两种对光敏感的神经细胞。其中约600万个是视锥细胞，负责辨别颜色。视锥细胞分为三类，每一类只感知一种特定颜色，分别为黄、绿、蓝。三类细胞共同作用，让人能看到种类多得惊人的颜色。缺少一种或几种这样的视锥细胞，就会发生色盲。"],"type":"paragraph"},{"n":7,"t":["The most abundant cells in the retina, nearly 120 million of them, are the *rods*. These rod-shaped cells are much more sensitive to light than the cones, but they only produce black and white imagery. Most of the cones are located in the center of the retina, where you have the sharpest focus and sight. The edges of the retina, however, contain more rods that can detect very subtle amounts of light.","视网膜上数量最多的是视杆细胞，有近1.2亿个。这些杆状细胞比视锥细胞对光敏感得多，却只能产生黑白图像。大多数视锥细胞位于视网膜中心，在那里聚焦最准确，视觉最清晰。视网膜边缘的视杆细胞却更多，能够感知非常微弱的光。"],"type":"paragraph"},{"n":8,"t":["If you go out on a clear night, you might notice that the faintest stars are very hard to see when you look directly at them. Try looking slightly to the side of the star. The light-sensitive rods on the edges of your retinas will allow you to see the star more clearly!","晴朗的夜晚走到屋外时，你可能发现，越是微弱的星光，越难直接看清。试着把视线稍微移到那颗星的旁边。视网膜边缘对光敏感的视杆细胞，会帮你把那颗星看得更清楚！"],"type":"paragraph"}],"original":[{"n":1,"ask":["What do pupils control?\n\n________","瞳孔控制什么？"],"ans":["the amount of light entering the eye","进入眼睛的光量。"]},{"n":2,"ask":["What is the colored part of the eye called?\n\n________","眼睛带有颜色的那个部分叫什么？"],"ans":["the iris","虹膜。"]},{"n":3,"ask":["If you walked from a dark room into a brightly-lit room, how would the size of your pupils change?\n\n________","如果从一个昏暗的房间走进光线明亮的房间，你的瞳孔大小会怎样变化？"],"ans":["They would become smaller.","瞳孔会缩小。"]},{"n":4,"ask":["What colors do the cone-shaped cells in your eyes detect?\n\n________","眼睛里的视锥细胞能感知哪些颜色？"],"ans":["yellow, green, and blue","黄色、绿色和蓝色。"]},{"n":5,"ask":["What kind of cells are missing from the eyes of a person who is colorblind?\n\n________","有色盲的人眼中缺少什么细胞？"],"ans":["one or more types of cone-shaped cells","一种或几种视锥细胞。"]},{"n":6,"ask":["Name two ways in which cone-shaped cells and rod-shaped cells are different from one another.\n\n________\n\n________","说出视锥细胞和视杆细胞的两个不同点。"],"ans":["Possible answers: Rods are more sensitive to light than cones. Cones allow you to see color images while rods produce only black and white images.","示例：视杆细胞比视锥细胞对光更敏感。视锥细胞让人看到彩色图像，视杆细胞只能产生黑白图像。"]},{"n":7,"ask":["What is the purpose of the cornea?\n\n________\n\n________","角膜有什么作用？"],"ans":["Possible answer: to protect the more fragile parts of the eyeball","示例：保护眼球里较脆弱的部位。"]},{"n":8,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ to form an opinion\n- ________ to learn\n- ________ for entertainment","读者可能出于什么目的阅读这篇文章？\n形成某种看法\n学习知识\n消遣娱乐"],"ans":["- ✓ to learn","学习知识。"]},{"n":9,"ask":["Check the sentence in which *pupil* has the same meaning as it does in paragraph 3.\n\n- ________ The pupil determines how much light is allowed into the eye.\n- ________ The best pupil in the class received a perfect grade on her spelling test.","勾选 pupil 一词与第3段含义相同的句子。\nThe pupil determines how much light is allowed into the eye.（瞳孔决定进入眼睛的光量。）\nThe best pupil in the class received a perfect grade on her spelling test.（班上最优秀的学生在拼写测试中得了满分。）"],"ans":["- ✓ The pupil determines how much light is allowed into the eye.","The pupil determines how much light is allowed into the eye. 这里的 pupil 指“瞳孔”。"]},{"n":10,"ask":["Check the sentence in which *cells* has the same meaning as it does in paragraph 6.\n\n- ________ Bees’ honeycombs contain hundreds of cells.\n- ________ The cells reproduced at a rapid rate.","勾选 cells 一词与第6段含义相同的句子。\nBees’ honeycombs contain hundreds of cells.（蜜蜂的蜂巢里有数百个小巢室。）\nThe cells reproduced at a rapid rate.（这些细胞繁殖得很快。）"],"ans":["- ✓ The cells reproduced at a rapid rate.","The cells reproduced at a rapid rate. 这里的 cells 指“细胞”。"]}]},{"id":"P140","title":["Eyes on the Ends of Your Fingers","指尖上的眼睛"],"lead":["Have you ever seen anything written in Braille?","你见过用盲文写的东西吗？"],"exercise":"P141","genre":"历史纪实","family":"info","parts":[{"n":1,"t":["Think about how many things you read every day. Even when you are not in school, doing homework, or reading a book for fun, you read almost constantly. You read the writing on a cereal box to decide what to have for breakfast. You read the label on a bottle of shampoo, the newspaper headlines, billboards, street signs, and the sides of buses. You read menus, e-mails, and the weather report. Everywhere you go, words surround you.","想想你每天会读多少东西。即使没有在学校上课、做作业或为了消遣读书，你也几乎一直在读。你会看麦片盒上的字，决定早餐吃什么。你会读洗发水瓶上的标签、报纸头条、广告牌、路牌和公交车车身上的字。你会读菜单、电子邮件和天气预报。无论走到哪里，你身边都是文字。"],"type":"paragraph"},{"n":2,"t":["Going about the tasks of daily life would be much more difficult for some people if it weren’t for the creative thinking of a man named Louis Braille. Even though Braille translations are not provided everywhere, the availability of the Braille system in many public places opens up a new world for people who cannot see.","如果没有一位名叫路易·布拉耶的人动脑筋想出新办法，日常生活中的许多事对有些人来说会困难得多。虽然并非到处都提供盲文，但许多公共场所有了这套文字，就为看不见的人打开了一个新世界。"],"type":"paragraph"},{"n":3,"t":["Louis Braille was born in France in 1809 and became blind in an accident when he was three years old. When Braille was ten, he was sent to a school for the blind in Paris. At that time, the only material that was available for blind students to read was carved in wood, cut in cardboard, or made from lead, a heavy metal. This severely limited what students could read. In addition, there was no way for them to write using this system.","路易·布拉耶1809年生于法国，3岁时在一次事故中失明。10岁时，布拉耶被送到巴黎一所盲人学校。当时，盲人学生能接触到的阅读材料只有刻在木头上、裁刻在硬纸板上或用沉重的金属铅做成的材料。这极大地限制了学生能读到的内容。此外，他们也无法用这种系统写字。"],"type":"paragraph"},{"n":4,"t":["Braille became aware of a system of military communication that was invented by Charles Barbier, a French cavalry officer. Barbier had devised a system based on the arrangement of dots in groups of 12. He wanted military personnel to be able to communicate with one another at night when vision was limited. In Barbier’s system, the dots were punched into cardboard, which could be read by touch.","布拉耶了解到，法国骑兵军官夏尔·巴比耶发明了一套军用通信系统。巴比耶的系统以12个点为一组，用不同方式来排列。他希望军人在视线不佳的夜间也能相互传递消息。按照巴比耶的办法，把点压在硬纸板上，人用手摸就能读出来。"],"type":"paragraph"},{"n":5,"t":["Braille modified this system for use by the blind when he was only 15 years old. Instead of 12 dots, Braille’s system used only six dots, arranged in three rows of two dots each. The presence or absence of dots, and the way in which they were arranged, was used to symbolize specific letters and numbers.","布拉耶年仅15岁时，就改造了这套系统，让盲人能够使用。他把12个点减到6个，分成三排，每排两个点。哪些位置有点、哪些位置没点，以及这些点如何排列，都用来表示特定的字母和数字。"],"type":"paragraph"},{"n":6,"t":["During the next 20 years, similar systems of reading, using dots arranged in different patterns, were developed in the United States. In 1916, Louis Braille’s system was officially accepted in the United States. Sixteen years later, English Braille became the universal system for the English-speaking world.","接下来的20年里，美国也研制出一些类似的阅读系统，用不同的点阵来表示文字。1916年，路易·布拉耶的系统在美国得到正式认可。16年后，英语盲文成为英语世界的通用系统。"],"type":"paragraph"},{"n":7,"t":["Even as the Braille system gained acceptance around the world, the development of a good printing process was slow and often tedious. The first books in Braille were printed using a sharp instrument that punched holes in thick paper to form the patterns of dots. Over time, progress was made with the presses that printed Braille materials. The process became quicker and more efficient. Today, computer programs translate written words into Braille code, which is then sent to machines that electronically make the printing plates that are used to produce the books.","即使布拉耶盲文已逐渐得到世界各地的认可，开发一套好用的印刷工艺进展仍很慢，过程也常常繁琐。最初的盲文书是用尖锐工具在厚纸上打孔压出点阵来印制的。后来，印制盲文材料的印刷机得到改进，流程变得更快、更高效。今天，计算机程序会把文字转换成盲文编码，传给能以电子方式制版的机器，再用这种印刷版生产盲文书。"],"type":"paragraph"},{"n":8,"t":["Once you start paying attention, you’ll notice Braille in places you’ve never seen it before—in elevators, on doors to public restrooms, on keypads of automated banking machines. It’s impressive to see how far the idea of a 15-year-old boy from France has spread since 1824.","一旦开始留意，你就会在以前从未注意到的地方发现盲文，比如电梯里、公共卫生间门上、自动取款机的键盘上。自1824年以来，一个15岁法国男孩的点子竟然传播得这么广，真令人赞叹。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What was the problem with materials intended for blind people before the creation of the Braille system?\n________","布拉耶盲文发明之前，供盲人使用的材料有什么问题？"],"ans":["They were carved in wood, cut in cardboard, or made from lead, so there was a limited amount of materials available.","材料得刻在木头上、裁刻在硬纸板上或用铅做，所以能读的东西很有限。"]},{"n":2,"ask":["How was Braille’s system different from Barbier’s?\n________","布拉耶的系统和巴比耶的系统有什么不同？"],"ans":["It used a system of 6 dots instead of 12.","布拉耶用6个点，巴比耶用12个点。"]},{"n":3,"ask":["How old was Braille when he invented his dot-reading system?\n________","布拉耶发明这套点字阅读系统时多大？"],"ans":["15","15岁。"]},{"n":4,"ask":["How are Braille books produced today?\n________","今天怎样制作盲文书？"],"ans":["Computer programs translate written words into Braille code, which is sent to machines that electronically make the printing plates.","计算机程序把书面文字转换成盲文编码，发送给机器，机器以电子方式制作印刷版。"]},{"n":5,"ask":["Check the line beside the word or words that best describe what type of selection this is.\n\n- ________ historical fiction\n- ________ historical nonfiction\n- ________ fiction","在最能概括本文体裁的一项旁打勾。\n历史小说\n历史纪实作品\n虚构作品"],"ans":["- ✓ historical nonfiction","历史纪实作品。"]},{"n":6,"ask":["Check the words that best describe Louis Braille.\n\n- ________ cheerful\n- ________ outgoing\n- ________ inventive\n- ________ determined\n- ________ original","勾选最能形容路易·布拉耶的词语。\n开朗的\n外向的\n善于发明的\n意志坚定的\n富有创见的"],"ans":["- ✓ inventive\n- ✓ determined\n- ✓ original","善于发明的、意志坚定的、富有创见的。"]},{"n":7,"ask":["Check the word below that best describes the theme of “Eyes on the Ends of Your Fingers.”\n\n- ________ disability\n- ________ creative thinking\n- ________ friendship\n- ________ honor","勾选最能概括《指尖上的眼睛》主题的一项。\n残障\n创造性思维\n友谊\n荣誉"],"ans":["- ✓ creative thinking","创造性思维。"]},{"n":8,"ask":["Give three examples of public places where you might notice Braille.\n________","请举出三个可能看到盲文的公共场所或设施。"],"ans":["Possible answers: ATMs, public restrooms, elevators","示例：自动取款机、公共卫生间、电梯。"]},{"n":9,"ask":["In paragraph 7, what does the word *tedious* mean?\n________","第7段中的 tedious 是什么意思？"],"ans":["long and boring; time-consuming","耗时而枯燥的，冗长乏味的。"]}]},{"id":"P142","title":["The Quarreling Colors","争吵的颜色"],"lead":["Do you have a favorite color? Why do you like that color?","你有最喜欢的颜色吗？为什么喜欢它？"],"exercise":"P143","genre":"传说","family":"lit","parts":[{"n":1,"t":["Long, long ago, when Earth was young, there was a terrible quarrel among the colors. Each believed he or she was superior to all other colors, and no color was willing to admit defeat.","很久很久以前，地球还很年轻，颜色之间发生了一场激烈的争吵。每种颜色都认为自己比其他颜色优越，谁也不肯认输。"],"type":"paragraph"},{"n":2,"t":["Red claimed to be the most important of all because she was the color of life. “Red is the color of blood,” she proclaimed, “and what life is possible without blood? Red is the color of love, of anger, and of heat. What would life be without me?” She did not believe that any other color could make so strong an argument.","红色声称她是最重要的，因为她是生命的颜色。“红色是血的颜色，”她宣称，“没有血，哪来的生命？红色还是爱、愤怒与热量的颜色。没了我，生活会是什么样子？”她不相信还有哪种颜色能提出如此有说服力的理由。"],"type":"paragraph"},{"n":3,"t":["Orange stood up. “It is thoughtless to state that red is the most important color. Have you never tasted the juice of an orange or the flesh of a pumpkin? And what color are the most breathtaking sunrises and sunsets? They are orange, of course! There is no question that orange is the most important color.”","橙色站了起来。“说红色最重要，真是没动脑筋。你们没喝过橙汁、吃过南瓜肉吗？最让人惊叹的日出和日落，又是什么颜色
