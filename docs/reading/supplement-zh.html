 catch a fish.\n- ________ The lifeguard cleaned the sting with alcohol.\n- ________ Sophie pointed to the sand-covered jellyfish.\n- ________ The lifeguard smeared meat tenderizer on Miles’ foot.","给下列事件编号，表示它们发生的先后顺序。\n泰勒先生与救生员握手。\n泰勒一家看着海鸥捉鱼。\n救生员用酒精清洗被蜇处。\n索菲指向被沙子盖住的水母。\n救生员把嫩肉粉调成的糊涂在迈尔斯的脚上。"],"ans":["- **5** Mr. Taylor shook the lifeguard’s hand.\n- **1** The Taylors watched a seagull catch a fish.\n- **3** The lifeguard cleaned the sting with alcohol.\n- **2** Sophie pointed to the sand-covered jellyfish.\n- **4** The lifeguard smeared meat tenderizer on Miles’ foot.","5. 泰勒先生与救生员握手。\n1. 泰勒一家看着海鸥捉鱼。\n3. 救生员用酒精清洗被蜇处。\n2. 索菲指向被沙子盖住的水母。\n4. 救生员把嫩肉粉调成的糊涂在迈尔斯的脚上。"]},{"n":2,"ask":["If you don’t have alcohol and meat tenderizer at home, what else can you use to treat a jellyfish sting?\n________","根据故事，如果家里没有酒精和嫩肉粉，还可以用什么来处理水母蜇伤？"],"ans":["vinegar, baking soda, and water","醋、小苏打和水。"]},{"n":3,"ask":["Under what circumstances does the lifeguard recommend that Miles see a doctor?\n________","在什么情况下，救生员建议迈尔斯去看医生？"],"ans":["if the area becomes any more irritated in the next couple of hours","如果被蜇处在接下来几个小时里出现更明显的不适。"]},{"n":4,"ask":["Why does meat tenderizer soothe a jellyfish sting?\n________","故事里，嫩肉粉为什么能缓解水母蜇伤的不适？"],"ans":["It is an enzyme which breaks down the protein of jellyfish poison.","它含有能分解水母毒液中蛋白质的酶。"]},{"n":5,"ask":["What were the Taylors looking at when Miles was stung?\n________","迈尔斯被蜇时，泰勒一家正在看什么？"],"ans":["They were watching a seagull catch a fish.","他们正在看海鸥捉鱼。"]},{"n":6,"ask":["How did the Taylors determine what Miles had stepped on?\n________","泰勒一家怎么确定迈尔斯踩到了什么？"],"ans":["Sophie saw a sand-covered jellyfish on the beach.","索菲看到海滩上有一只被沙子盖住的水母。"]},{"n":7,"ask":["The **climax** of a story is the point of highest excitement. What is the climax in “A Stinging Surprise”?\n________","高潮是故事最紧张、最扣人心弦的部分。《意外的一蜇》的高潮是什么？"],"ans":["when Miles gets stung by a jellyfish","迈尔斯被水母蜇了。"]},{"n":8,"ask":["________","写出第1段中的明喻。"],"ans":["The late afternoon sun reflected off the water and made it sparkle like a sea of diamonds.","The late afternoon sun reflected off the water and made it sparkle like a sea of diamonds.（傍晚的阳光映在水面上，让海水像一片钻石的海洋那样闪闪发亮。）"],"dir":["Find the simile in paragraph 1, and write it on the line below.","找出第1段中的明喻，把它写在下面的横线上。"]},{"n":9,"ask":["Have you ever been stung by something, like a bee or some fire ants? How did you react? How did you treat it?\n________","你被蜜蜂、火蚁之类的动物蜇过吗？当时你有什么反应？你是怎么处理的？"],"ans":["Answers will vary.","答案可以不同。"]}],"note":"本文写的是故事人物当时的处理方式，阅读题依照文中情节作答。"},{"id":"P094","title":["Curious Creatures","奇特的生物"],"lead":["Have you ever seen a jellyfish in the wild or at a zoo or an aquarium?","你在野外、动物园或水族馆见过水母吗？"],"exercise":"P095","genre":"科普说明文","family":"info","parts":[{"n":1,"t":["What kind of animal has no brain, no bones, and no circulatory system? This might sound like a riddle, but it isn’t. The jellyfish is one of the ocean’s most unusual creatures. Instead of having all the organs that are typical of most animals, jellyfish have specialized tissues that carry out the various functions they need to survive.","什么动物没有大脑、骨骼和循环系统？这听起来像个谜语，其实真有这样的动物。水母是海洋中最奇特的生物之一。大多数动物都有一些典型的器官，水母却靠专门的组织完成维持生存所需的各种功能。"],"type":"paragraph"},{"n":2,"t":["The term *jellyfish* is inaccurate because these animals are neither fish nor made of jelly. They are invertebrates, which means that they do not have backbones. They are also relatives of corals and sea anemones. Scientists believe that there may be as many as 2,000 types of jellyfish in the world’s oceans. Most species are found in saltwater, though a few freshwater varieties do exist.","英文 jellyfish 这个名字并不准确，因为水母既不是鱼，也不是果冻做成的。它们是无脊椎动物，也就是没有脊椎的动物。它们还和珊瑚、海葵有亲缘关系。科学家认为，世界各地的海洋里可能有多达2000种水母。大多数水母生活在咸水中，不过也有少数淡水品种。"],"type":"paragraph"},{"n":3,"t":["Because there are so many different species of jellyfish, it is not surprising that there is such variety in their appearance. The smallest jellyfish are less than an inch in length, while the largest may grow to be 200 feet long! Shape and color are two more ways in which jellyfish differ. Typically, jellyfish have little color because their bodies are composed of 95 to 99 percent water. Some species are more colorful and may be brown, pink, white, or blue.","水母种类很多，所以外表千差万别也就不足为奇了。最小的水母还不到1英寸长，最大的却能长到200英尺！水母的形状和颜色也各不相同。一般来说，水母几乎没有颜色，因为它们身体的95%至99%是水。有些品种的颜色更鲜明，可能呈棕色、粉红色、白色或蓝色。"],"type":"paragraph"},{"n":4,"t":["Most jellyfish have the same basic shape. From the top, they look similar to an umbrella or a mushroom, with long thin tentacles that extend below their “heads.” The tentacles are lined with stinging cells called *nematocysts* that the jellyfish uses to capture food such as small fish, plankton, and other small sea creatures.","大多数水母的基本形状相同。从上面看，它们像一把伞或一朵蘑菇，细长的触手从“头”下方伸出。触手上布满了叫作刺丝囊的蜇刺结构，水母用它们捕捉小鱼、浮游生物和其他海洋小生物。"],"type":"paragraph"},{"n":5,"t":["These same stinging cells are what cause people such pain if they accidentally step on a jellyfish that has washed up on shore or brush against a tentacle as they swim in the ocean. The sting from most species of jellyfish is relatively harmless, though it can be painful. However, there are several species of jellyfish whose sting can be fatal.","人们不小心踩到被冲上岸的水母，或在海里游泳时碰到一根触手，就是这些蜇刺结构让人感觉疼痛。大多数水母蜇人虽疼，却相对无害。不过，有几种水母的蜇伤可能致命。"],"type":"paragraph"},{"n":6,"t":["For the most part, jellyfish are transported by ocean currents and the wind. They have some ability to move through the water by contracting muscles in the main part of the body. These contractions can push the jellyfish vertically through the water at a slow pace. For the most part, though, jellyfish are content to float through the waves, waiting for the next potential food source to become tangled in their tentacles.","水母主要靠洋流和风移动。它们也有一定的自主移动能力，可以收缩身体主要部分的肌肉。这些收缩能够让水母在水中缓慢地上下移动。不过，大多数时候水母只是随波漂浮，等着下一份可能成为食物的猎物缠进触手。"],"type":"paragraph"},{"n":7,"t":["The next time you go to the beach, keep your eyes open for a colorless blob gently floating on the water’s surface. If you’re lucky, you’ll get a close-up view of one of the ocean’s strangest creatures.","下次去海滩，留意一下水面上有没有轻轻漂浮的一团无色物体。如果你运气好，就能近距离看到海洋里最奇特的生物之一。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why does the author say that the description of a jellyfish might sound like a riddle?\n________","作者为什么说对水母的描述可能听起来像个谜语？"],"ans":["The description is worded like a riddle. The question sounds as though it does not have a real answer.","这段描述的措辞像谜语，提问听起来仿佛没有真实的答案。"]},{"n":2,"ask":["How much of a jellyfish’s body is composed of water?\n________","水母身体有百分之多少是水？"],"ans":["95%-99%","95%至99%。"]},{"n":3,"ask":["What are nematocysts?\n________","nematocysts 是什么？"],"ans":["stinging cells","刺丝囊，指蜇刺用的结构。"]},{"n":4,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to entertain\n- ________ to inform\n- ________ to persuade","勾选最能描述作者写作目的的一项。\nA. 娱乐读者\nB. 提供信息\nC. 说服读者"],"ans":["✓ to inform","B. 提供信息。"]},{"n":5,"ask":["________ All species of jellyfish are totally harmless to humans.","所有种类的水母对人类都完全无害。"],"ans":["F","错误（F）"],"dir":["Write **T** before the sentences that are true. Write **F** before the sentences that are false.","正确的句子在句前写 T，错误的句子在句前写 F。"]},{"n":6,"ask":["________ Jellyfish do not have most of the organs that are common in other animals.","水母没有其他动物常见的大部分器官。"],"ans":["T","正确（T）"]},{"n":7,"ask":["________ Jellyfish can move only where the wind and the tides take them.","水母只能随风和潮汐移动。"],"ans":["F","错误（F）"]},{"n":8,"ask":["________ Only about one-third of a jellyfish’s body is water.","水母的身体只有大约三分之一是水。"],"ans":["F","错误（F）"]},{"n":9,"ask":["________ A few freshwater species of jellyfish do exist.","确实存在少数生活在淡水中的水母。"],"ans":["T","正确（T）"]},{"n":10,"ask":["What three things is a jellyfish lacking that most animals have?\n________","大多数动物具有哪三样东西，而水母没有？"],"ans":["brains, bones, circulatory system","大脑、骨骼和循环系统。"]},{"n":11,"ask":["An invertebrate has no ________.","无脊椎动物没有 _____。"],"ans":["backbone","脊椎。"]},{"n":12,"ask":["How do jellyfish move?\n________","水母怎样移动？"],"ans":["The wind and ocean currents push them along, but they can also move slowly by contracting muscles.","风和洋流会推动它们，它们也能通过收缩肌肉缓慢移动。"]}]},{"id":"P096","title":["Catching a Wave","追浪"],"lead":["What kind of surfing tips will Kerry and Dylan give their cousins?","凯丽和迪伦会教表弟表妹哪些冲浪诀窍？"],"exercise":"P097","genre":"故事","family":"lit","parts":[{"n":1,"t":["Sophie and Miles sat on the shore and let the waves wash over their toes. They were watching their cousins surf. Dylan and Kerry were a few years older than Sophie and Miles, and they had started surfing almost before they were able to walk.","索菲和迈尔斯坐在岸边，让海浪漫过脚趾。他们正在看表哥表姐冲浪。迪伦和凯丽比他们大几岁，几乎还没学会走路就开始冲浪了。"],"type":"paragraph"},{"n":2,"t":["Kerry rode a wave into shore, and then hopped off her board and jogged over to where Sophie and Miles were sitting. Her dark hair, which was as sleek and glossy as an otter’s fur, was plastered against her head. “Are you two ready to give it a try?” she asked, squinting through the sun at her cousins.","凯丽乘着一道浪冲到岸边，然后跳下冲浪板，慢跑到索菲和迈尔斯坐的地方。她乌黑的头发又顺又亮，像水獭的皮毛，紧紧贴在头上。她迎着阳光眯起眼，看着两个小家伙问：“你们俩准备试一试了吗？”"],"type":"paragraph"},{"n":3,"t":["Miles took a deep breath and nodded. He was worried about looking silly in front of his cousins, but he had a feeling he was going to love surfing. He expected it to feel like flying through the water or riding his bike down a steep hill without using the brakes.","迈尔斯深吸一口气，点了点头。他担心在表哥表姐面前出丑，不过他有种预感，自己一定会爱上冲浪。他想，那感觉就像在水中飞翔，或者骑着自行车冲下一个陡坡，中途不用刹车。"],"type":"paragraph"},{"n":4,"t":["“Don’t go out too far!” shouted Mrs. Taylor into the wind, and Sophie cheerfully waved back to her parents. Sophie was usually good at the things she tried. She learned quickly and wasn’t afraid to plunge right in, even if she had never done something before. Miles admired these characteristics in his sister, but knew he just wasn’t as adventurous as she was.","“别游太远！”泰勒太太迎着风喊道。索菲愉快地向父母挥手。索菲通常做什么都能做得不错。她学得快，就算从没做过，也不怕一头扎进去。迈尔斯很欣赏姐姐的这些特点，但他知道自己没有姐姐那么爱冒险。"],"type":"paragraph"},{"n":5,"t":["“Okay,” Kerry began, “we’re going to start you two out on longboards. They are easier to paddle, and they catch waves more easily, which is good when you are a beginner because it gives you more time to stand up.","“好，”凯丽开始说，“我们先让你们俩用长板。长板更容易划水，也更容易追到浪。刚入门时，这样比较好，因为你们会有更多时间站起来。"],"type":"paragraph"},{"n":6,"t":["“There are a few surfing fundamentals that are pretty important. First, never paddle your surfboard out farther than you can swim back in without it. Know the beach you’re surfing, and know what weather conditions to expect. Never surf alone, and always remember your limitations. Don’t forget that as much fun as you have surfing, the ocean isn’t something to take lightly.” Kerry paused for a moment and looked at the serious expressions on her cousins’ faces.","“冲浪有几条很重要的基本原则。第一，如果不靠冲浪板你游不回来，就别划那么远。要了解你冲浪的那片海滩，也要知道可能遇到什么天气。千万别一个人冲浪，永远要量力而行。记住，冲浪再好玩，也不能把大海的危险当儿戏。”凯丽停了一下，看着表弟表妹一脸认真的样子。"],"type":"paragraph"},{"n":7,"t":["“Now for the fun part,” Kerry said. She waved her arms at Dylan, who waved back and began to paddle into shore. “You need to position yourself in the center of your board, between the nose and the tail. When you’re positioned the right way, the nose should be a couple of inches above the water’s surface. When a wave catches the tail of the board, start paddling. Try to remember the sweet spot on your board, because you’ll want to position yourself the same way each time you go out, no matter what kind of wave you’re trying to catch.”","“接下来就是好玩的部分了。”凯丽一边说，一边向迪伦挥手。迪伦挥手回应，开始向岸边划来。“你们要待在板头和板尾之间的中央。位置正确时，板头应该高出水面大约两英寸。当浪推到板尾，就开始划水。试着记住板上这个最合适的位置，以后每次下水，不管想追哪种浪，身体都要放在同一个位置。”"],"type":"paragraph"},{"n":8,"t":["Sophie grinned at Kerry. “I had no idea that surfing was so technical. I thought you just catch a big wave and try to ride it without falling off.”","索菲冲凯丽咧嘴一笑。“我可不知道冲浪有这么多技术讲究。我还以为只要追上一道大浪，乘着浪别掉下来就行了。”"],"type":"paragraph"},{"n":9,"t":["Just then, Dylan walked up, shaking himself the same way the Taylors’ dog did after she had had a bath. “Is she still explaining things?” he asked Sophie and Miles, winking at Kerry.","就在这时，迪伦走了过来，抖掉身上的水，活像泰勒家的狗刚洗完澡那样。“她还在给你们讲啊？”他一边问索菲和迈尔斯，一边朝凯丽眨了眨眼。"],"type":"paragraph"},{"n":10,"t":["Kerry swatted at her brother. “They’re almost ready to get started,” she said, turning back to Sophie and Miles. “We’re just going to practice standing up a few times on the sand where the board will be on a stable surface. Then, you can try to paddle out and catch a wave.”","凯丽伸手轻拍了一下迪伦，又转向索菲和迈尔斯。“他们快准备好了。我们先在沙滩上练几次在板上站起来，沙地上板放得稳。之后你们就可以试着划出去追浪了。”"],"type":"paragraph"},{"n":11,"t":["“Who wants to go first?” she asked.","“谁想先来？”她问。"],"type":"paragraph"},{"n":12,"t":["Miles put up one hand. “This is the easy part,” he said. “Sand surfing doesn’t worry me a bit. Besides, I think I’m going to need all the practice I can get!”","迈尔斯举起一只手。“这部分容易，”他说，“在沙地上冲浪，我一点也不担心。再说，我觉得能多练一次是一次！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why does Kerry think that Sophie and Miles should start out using longboards?\n________","凯丽为什么认为索菲和迈尔斯应该先用长板？"],"ans":["They are easier to paddle, and they catch waves more easily.","长板更容易划水，也更容易追到浪。"]},{"n":2,"ask":["What do you think Kerry means when she refers to the “sweet spot” on a surfboard?\n________","凯丽说的冲浪板上的“sweet spot”是什么意思？"],"ans":["the center of the board","冲浪板的中央，也就是最合适的位置。"]},{"n":3,"ask":["What is one way in which Miles and Sophie are different?\n________","迈尔斯和索菲有什么不同？"],"ans":["Sophie is more eager to try new things than Miles is.","索菲比迈尔斯更愿意尝试新事物。"]},{"n":4,"ask":["What does Miles think surfing will feel like?\n________","迈尔斯觉得冲浪会是什么感觉？"],"ans":["He thinks it will feel like flying through the water or riding a bike down a steep hill without using the brakes.","他觉得会像在水里飞翔，或像骑自行车冲下陡坡而不用刹车。"]},{"n":5,"ask":["What are the surfing terms for the front and back ends of a surfboard?\n________","用冲浪术语来说，冲浪板的前后两端叫什么？"],"ans":["nose and tail","nose（板头）和 tail（板尾）。"]},{"n":6,"ask":["Check the line beside the word or words that best describe what type of selection this is.\n\n- ________ poetry\n- ________ fiction\n- ________ science fiction","勾选最符合本文体裁的一项。\nA. 诗歌\nB. 虚构故事\nC. 科幻小说"],"ans":["✓ fiction","B. 虚构故事。"]},{"n":7,"ask":["________ I wish I was as adventurous as my sister.","我要是能和姐姐一样爱冒险就好了。"],"ans":["F","第一人称（F）"],"dir":["Mark each sentence below **F** if it is in first-person point of view and **T** if it is in third-person point of view.","判断下列句子采用的人称。第一人称标 F，第三人称标 T。"]},{"n":8,"ask":["________ Sophie waved to her parents.","索菲朝父母挥了挥手。"],"ans":["T","第三人称（T）"]},{"n":9,"ask":["________ I’ve been surfing since I was only five years old.","我五岁时就开始冲浪了。"],"ans":["F","第一人称（F）"]},{"n":10,"ask":["________ Dylan shook himself off when he got out of the water.","迪伦出水后抖掉了身上的水。"],"ans":["T","第三人称（T）"]},{"n":11,"ask":["Find the simile in paragraph 2, and write it on the line below.\n________","找出第2段中的明喻，把它写在下面的横线上。"],"ans":["her dark hair, which was as sleek and glossy as an otter’s fur","her dark hair, which was as sleek and glossy as an otter’s fur（她乌黑的头发又顺又亮，像水獭的皮毛）"]},{"n":12,"ask":["What two things were compared to one another in question 11?\n________","第11题的明喻把哪两样事物作了比较？"],"ans":["dark hair and otter’s fur","乌黑的头发和水獭的皮毛。"]},{"n":13,"ask":["Choose one of the answers to number 12, and use it to create your own simile on the lines below.\n________","从第12题的答案中任选一样事物，用它造一个自己的明喻，写在下面的横线上。"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P098","title":["Wave-Sliding","在浪上滑行"],"lead":["How did surfing become the popular sport it is today?","冲浪是怎样发展成今天这样受欢迎的运动的？"],"exercise":"P099","genre":"说明文","family":"info","parts":[{"n":1,"t":["Who first had the idea of shaping a piece of wood into a long narrow board and using it to ride ocean waves? No one knows for sure, but we do know that Hawaiians have been surfing since the 1400s. The Hawaiian word for *surfing* translates to *wave-sliding*, a fairly accurate description of this sport in which a surfer stands on a board and gets propelled across the water by the energy of the waves.","最早是谁想到把一块木头削成长长窄窄的板子，用它来乘风破浪？没人确切知道，但我们知道，夏威夷人从15世纪就开始冲浪了。夏威夷语里的“冲浪”可译为“在浪上滑行”，这相当准确地描绘了这项运动。冲浪者站在板上，借海浪的力量在水面上滑行。"],"type":"paragraph"},{"n":2,"t":["Surfers are fond of saying that surfing isn’t a sport, it’s a lifestyle. This was true for the relatively small numbers of surfers who participated in the sport before the 1950s. Then, new types of surfboards became available. They were made of fiberglass and foam instead of wood. This made them less expensive, as well as much easier to use and maneuver. Suddenly, surfing became enormously popular in the United States, and surfing culture was born.","冲浪者爱说，冲浪是一种生活方式，并非只是一项运动。这话很适用于20世纪50年代前为数不多的冲浪者。后来，新型冲浪板上市了，改用玻璃纤维和泡沫材料制造，取代了木头。这些板更便宜，用起来也更轻便灵活。一时间，冲浪风靡美国，冲浪文化也随之诞生。"],"type":"paragraph"},{"n":3,"t":["Movies and magazines that featured surfing became trendy, as did beach music and surfing fashion. But nothing changed what was most important to serious surfers—enjoying the beach and the ocean as they went on a quest for the perfect wave.","以冲浪为题材的电影和杂志流行起来，海滩音乐和冲浪服饰也成了时尚。可对真正热爱冲浪的人来说，最重要的始终是在寻找完美浪头的过程中，享受海滩和大海。"],"type":"paragraph"},{"n":4,"t":["Surfing appeals to people for several reasons. Surfers have an inherent love and respect for the ocean. They like participating in a sport in which the challenges constantly change and the environment is somewhat unpredictable. Surfers also seek the adrenaline rush that comes with riding the waves. It is the same feeling that draws people to other high-speed activities, like downhill skiing, hang-gliding, or car racing.","冲浪吸引人有好几个原因。冲浪者打心底热爱、敬重大海。他们喜欢这项运动，因为要面对的挑战时时都在变，环境也有些难以预测。冲浪者还追求乘浪时肾上腺素飙升的刺激感。吸引人们去尝试高山滑雪、悬挂式滑翔或赛车之类高速活动的，也是这种感觉。"],"type":"paragraph"},{"n":5,"t":["In 1953, the Waikiki Surf Club hosted the first international surfing championships. This competition led surfing to be regarded as a sport. Judges based their decisions on elements such as the length of ride, the number of waves a surfer caught, skill, sportsmanship, and grace. Today, the Association of Surfing Professionals, or ASP, holds annual world championship series at different beaches around the country. Some surfers participate happily in such competitions, but others feel that this goes against the true nature and “soul” of surfing.","1953年，威基基冲浪俱乐部主办了首届国际冲浪锦标赛。这项比赛让冲浪开始被视为一项体育运动。裁判根据每次乘浪的时长、选手抓到的浪数、技巧、体育精神和动作是否优美等因素来评分。如今，职业冲浪协会（ASP）每年都在全国各地的不同海滩举行世界锦标系列赛。有些冲浪者乐意参加这类比赛，也有人觉得这样有违冲浪的本质和“灵魂”。"],"type":"paragraph"},{"n":6,"t":["Other than Duke Kahanamoku, the Hawaiian surfer who is thought to have introduced the sport to the rest of the world, Laird Hamilton is probably the most well known and respected surfer today. Large waves are his specialty, and Hamilton has been known to surf 70-foot-tall waves at speeds of approximately 50 miles per hour.","除了被认为将冲浪介绍给世界各地的夏威夷冲浪者杜克·卡哈纳莫库，莱尔德·汉密尔顿可能是当今最著名、最受敬重的冲浪者。他擅长冲大浪，据说曾以约50英里的时速冲上70英尺高的浪头。"],"type":"paragraph"},{"n":7,"t":["Hamilton also popularized a form of the sport called *tow-in surfing*. He wanted to have access to some of the oceans’ largest waves, but he knew surfers could not reach those waves just by paddling their boards. The solution was to use jet skis to tow surfers to areas that were farther from shore, where they could wait for enormous waves to crest nearby.","汉密尔顿还推广了一种叫牵引冲浪的方式。他想冲海上最大的一些浪，却知道光靠手划冲浪板到不了那些浪头。解决办法是用水上摩托把冲浪者拖到离岸较远的海域，让他们在那里等着附近的大浪涌起。"],"type":"paragraph"},{"n":8,"t":["The tow-in method is controversial among serious surfers, but most people couldn’t help being impressed when Hamilton used it to surf a well-known Tahitian surf spot called *Teahupoo*. Wipeouts at Teahupoo are likely to be fatal, but Hamilton took the challenge and survived.","热衷冲浪的人对牵引法争论不休。可汉密尔顿用它在塔希提岛著名的特胡波冲浪点冲浪时，大多数人还是为他的表现折服。在特胡波落水摔板很可能致命，但汉密尔顿接受了挑战，活了下来。"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ Laird Hamilton is the most talented surfer alive today.","莱尔德·汉密尔顿是今天在世最有天赋的冲浪者。"],"ans":["O","观点（O）"],"dir":["Write **F** before the sentences that are facts. Write **O** before the sentences that are opinions.","如果句子陈述的是事实，就在句前写 F。如果表达的是观点，就在句前写 O。"]},{"n":2,"ask":["________ Surfing became very popular in the 1950s and 1960s.","冲浪在20世纪50年代和60年代变得非常流行。"],"ans":["F","事实类陈述（F）"]},{"n":3,"ask":["________ The surfing spot Teahupoo is located near Hawaii.","冲浪胜地特胡波位于夏威夷附近。"],"ans":["F","事实类陈述（F，可查证，实际地点在塔希提岛）。"]},{"n":4,"ask":["________ No one can appreciate the power of the ocean the way a surfer does.","没有人能像冲浪者那样体会大海的力量。"],"ans":["O","观点（O）"]},{"n":5,"ask":["________ Laird Hamilton has surfed at speeds of up to 50 miles per hour.","莱尔德·汉密尔顿冲浪的时速曾高达50英里。"],"ans":["F","事实（F）"]},{"n":6,"ask":["Why did the new fiberglass and foam surfboards cause a rise in surfing’s popularity?\n________","新型玻璃纤维泡沫板为什么让冲浪变得更流行？"],"ans":["They were less expensive and easier to use.","因为这种板更便宜，也更容易使用。"]},{"n":7,"ask":["What draws people to high-speed activities?\n________","什么吸引人参加高速运动？"],"ans":["the adrenaline rush they feel","肾上腺素飙升带来的刺激感。"]},{"n":8,"ask":["What is tow-in surfing?\n________","什么是牵引冲浪？"],"ans":["the use of jet skis to tow surfers to areas that are farther from shore","使用水上摩托把冲浪者拖到离岸较远的海域。"]},{"n":9,"ask":["What do you think the surfing term *wipeout* means?\n________","你觉得冲浪术语 wipeout 是什么意思？"],"ans":["Answers will vary. Possible answers: fall, crash, tumble","答案可以不同。参考答案：跌落、摔倒或翻滚。"]},{"n":10,"ask":["Write a summary sentence for paragraph 4.\n________","用一句话概括第4段。"],"ans":["Possible answer: Surfers tend to enjoy surfing because they love the ocean and adrenaline rush they get from riding big waves.","参考答案：冲浪者通常喜欢冲浪，是因为他们热爱大海，也喜欢乘大浪时肾上腺素飙升的感觉。"]},{"n":11,"ask":["Have you ever tried surfing? If you have, describe your experience. If not, explain why you would or would not like to try it.\n________","你试过冲浪吗？如果试过，请描述经历。如果没有，请说说你想不想尝试，以及原因。"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P100","title":["The Father of Modern Surfing","现代冲浪之父"],"lead":["Who was Duke Kahanamoku, and how did he change the world of surfing?","杜克·卡哈纳莫库是谁？他如何改变了冲浪运动？"],"exercise":"P101","genre":"传记","family":"info","parts":[{"n":1,"t":["The word Duke brings to mind royalty. Duke Kahanamoku was not royalty, but he might as well have been a king in Hawaii. He was a talented swimmer, an actor, and even the mayor of Honolulu, Hawaii, for nearly 30 years. But what Duke Paoa Kahinu Makoe Hulikohoa Kahanamoku will be most remembered for is bringing surfing to the world outside of Hawaii.","Duke 这个词（意为“公爵”）让人联想到王室。杜克·卡哈纳莫库并非王室成员，但他在夏威夷的地位足以比肩国王。他是天才游泳选手、演员，甚至担任了夏威夷檀香山市市长近30年。不过，杜克·帕奥阿·卡希努·马科埃·胡利科霍阿·卡哈纳莫库最受世人铭记的事，是把冲浪带到了夏威夷之外的世界。"],"type":"paragraph"},{"n":2,"t":["Kahanamoku was a native Hawaiian, born in 1890 in Honolulu. From an early age, he felt most at home at the beach and in the ocean. He attended school but rushed home every afternoon, knowing that the ocean was patiently waiting for him.","卡哈纳莫库是夏威夷原住民，1890年出生在檀香山。从小时候起，海滩和大海就是最让他自在的地方。他每天都上学，可一到下午就急着跑回家，因为他知道大海在耐心等他。"],"type":"paragraph"},{"n":3,"t":["Kahanamoku went to the Olympics as a swimmer in 1912 and 1920, where he won a total of three gold medals for the United States. He also traveled around the world as a water safety instructor for the Red Cross in between Olympics.","卡哈纳莫库以游泳运动员的身份参加了1912年和1920年的奥运会，一共为美国赢得三枚金牌。在两届奥运会之间，他还以红十字会水上安全教练的身份周游世界。"],"type":"paragraph"},{"n":4,"t":["Kahanamoku was so enthusiastic about the water that he was able to successfully encourage others to take an interest in water sports. As he traveled, Kahanamoku spoke about surfing and demonstrated the sport to audiences around the globe. Surfing, which had had little publicity outside of Hawaii, started gaining in popularity.","卡哈纳莫库对水上活动热情十足，成功带动了别人对水上运动的兴趣。他一路旅行，一路介绍冲浪，并向世界各地的观众示范这项运动。此前，冲浪在夏威夷之外鲜有人知，如今逐渐流行起来。"],"type":"paragraph"},{"n":5,"t":["Kahanamoku’s favorite type of board was made from a koa tree. It was quite long by today’s standards—16 feet in length—and it weighed 114 pounds. As a point of comparison, boards today are only 6 to 9 feet long and weigh between 6 and 15 pounds. Kahanamoku’s preferred board was fashioned after the ancient Hawaiian olo boards. Kahanamoku was convinced that it was the best because he believed that big boards were for big waves. One of Kahanamoku’s early boards can be viewed today in Honolulu’s Bishop Museum.","卡哈纳莫库最喜欢用夏威夷相思树做的冲浪板。以今天的标准，它非常长，长达16英尺，重114磅。相比之下，如今的板只有6至9英尺长，重6至15磅。他喜欢的板以古代夏威夷的奥洛板为原型。他认定这种板最好，因为他认为大板就是给大浪用的。现在，人们可以在檀香山的毕晓普博物馆看到他早期使用的一块板。"],"type":"paragraph"},{"n":6,"t":["Duke Kahanamoku was the first person to be inducted into both the Swimming Hall of Fame and the Surfing Hall of Fame. Yet all the celebrity surrounding his achievements seemed to have little effect on Kahanamoku’s personality. The ocean remained his first love, and he stayed true to the roots of his Hawaiian culture, speaking the language, following the customs, and eating the foods as often as possible.","杜克·卡哈纳莫库是第一位同时入选游泳名人堂和冲浪名人堂的人。不过，他的成就带来的名声，似乎并没有改变他的为人。他最爱的依然是大海，也始终忠于夏威夷的文化根脉，尽可能多地说夏威夷语、遵循传统习俗、吃当地传统食物。"],"type":"paragraph"},{"n":7,"t":["Kahanamoku died in 1968 at the age of 77. He had a burial at sea, accompanied by a 30-person police escort. Kahanamoku’s ashes were scattered in the water off Waikiki Beach, the place he had felt most at home in the world, while a group of beach boys sang traditional Hawaiian songs. The world would never forget the man who shared his love of the ocean and surfing with people all around the globe.","1968年，卡哈纳莫库去世，享年77岁。他的葬礼在海上举行，有30名警察护送。人们把他的骨灰撒在威基基海滩外的海水中。那里是世界上他最有归属感的地方。当时，一群海滩青年唱起了夏威夷传统歌曲。世界永远不会忘记这个把自己对大海和冲浪的热爱分享给全世界的人。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What are two jobs that Kahanamoku held that were unrelated to swimming or surfing?\n\n________","卡哈纳莫库从事过哪两种与游泳或冲浪无关的工作？"],"ans":["actor and mayor","演员和市长。"]},{"n":2,"ask":["Do you think that surfing would have spread to other areas of the world without Duke Kahanamoku’s encouragement and enthusiasm? Why or why not?\n\n________\n\n________","你觉得如果没有杜克·卡哈纳莫库的鼓励和热情，冲浪也会传到世界其他地方吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":3,"ask":["Find a sentence in the selection showing that Kahanamoku was a talented and successful swimmer, and write it on the lines below.\n\n________\n\n________\n\n________","从文中找出一句话，说明卡哈纳莫库是位有天赋、成绩出色的游泳运动员，把它写在下面的横线上。"],"ans":["Answers will vary. Possible answer: He also traveled around the world as a water saftey instructor for the Red Cross in between Olympics.","答案可以不同。参考答案：在两届奥运会之间，他还以红十字会水上安全教练的身份周游世界。"]},{"n":4,"ask":["Check the sentence that best states the main idea of the selection.\n\n- ________ Duke Kahanamoku’s full name was Duke Paoa Kahinu Makoe Hulikohoa Kahanamoku.\n- ________ Duke Kahanamoku was the first person to be inducted into both the Swimming Hall of Fame and the Surfing Hall of Fame.\n- ________ Duke Kahanamoku was known as the “father of modern surfing” because he helped bring the sport to areas of the world outside of Hawaii.","勾选最能概括文章主旨的句子。\nA. 杜克·卡哈纳莫库的全名是杜克·帕奥阿·卡希努·马科埃·胡利科霍阿·卡哈纳莫库。\nB. 杜克·卡哈纳莫库是第一位同时入选游泳名人堂和冲浪名人堂的人。\nC. 杜克·卡哈纳莫库帮助把冲浪传到夏威夷以外的地方，被称为“现代冲浪之父”。"],"ans":["✓ Duke Kahanamoku was known as the “father of modern surfing” because he helped bring the sport to areas of the world outside of Hawaii.","C. 杜克·卡哈纳莫库帮助把冲浪传到夏威夷以外的地方，被称为“现代冲浪之父”。"]},{"n":5,"ask":["In what year were the Olympics held in Antwerp, Belgium?\n\n________","比利时安特卫普奥运会是哪一年举办的？"],"ans":["1920","1920年。"],"fig":true,"dir":["Use the timeline of Duke Kahanamoku’s life to answer the questions that follow.","根据杜克·卡哈纳莫库生平时间线回答接下来的问题。"]},{"n":6,"ask":["Was Kahanamoku inducted into the U. S. Olympic Hall of Fame before or after his death?\n\n________","卡哈纳莫库是在去世前还是去世后入选美国奥林匹克名人堂的？"],"ans":["after","去世后。"]},{"n":7,"ask":["In what year did Kahanamoku marry?\n\n________","卡哈纳莫库是哪一年结婚的？"],"ans":["1940","1940年。"]}],"note":"教材正文称卡哈纳莫库曾任市长，练习页的年表将 1932 年的职务列为警长。两处均按原文呈现。","fig":{"kind":"timeline","page":"P101","title":["Duke Kahanamoku","杜克·卡哈纳莫库年表"],"headers":[["Year","年份"],["Event","事件"]],"rows":[{"n":"y1890","cells":[["1890","1890"],["Duke Kahanamoku born","杜克·卡哈纳莫库出生"]]},{"n":"y1912","cells":[["1912","1912"],["attends the Olympics in Stockholm, Sweden","参加瑞典斯德哥尔摩奥运会"]]},{"n":"y1920","cells":[["1920","1920"],["attends the Olympics in Antwerp, Belgium","参加比利时安特卫普奥运会"]]},{"n":"y1932","cells":[["1932","1932"],["becomes sheriff of Honolulu","出任檀香山警长"]]},{"n":"y1940","cells":[["1940","1940"],["marries Nadine Alexander","与纳丁·亚历山大结婚"]]},{"n":"y1968","cells":[["1968","1968"],["Duke Kahanamoku dies","杜克·卡哈纳莫库去世"]]},{"n":"y1984","cells":[["1984","1984"],["inducted into U.S. Olympic Hall of Fame","入选美国奥林匹克名人堂"]]}]}},{"id":"P102","title":["It’s All Academic","知识竞赛"],"lead":["Keep reading to find out more about the experiences of the Schuyler Middle School students who appear on an academic quiz show.","接着读，看看斯凯勒中学的学生参加电视知识竞赛节目时都经历了什么。"],"exercise":"P103","genre":"校园故事","family":"lit","parts":[{"n":1,"t":["The bus was filled with energy and excitement. Students were talking and laughing, but there was also a bit of nervous energy in the air. As the bus rounded the corner and pulled into the parking lot at the television studio, Mr. Ishikawa cleared his throat.","巴士里热闹极了，学生们有说有笑，兴奋中又透着一点紧张。巴士转过街角，驶进电视演播室的停车场，石川老师清了清嗓子。"],"type":"paragraph"},{"n":2,"t":["“I want to thank each one of you for your hard work. I know that many of you have had to put other activities on hold for the intensive training we’ve done in the past weeks.","“我要感谢你们每一个人的努力。为了参加这几个星期的集训，你们中有不少人暂时搁下了其他活动，这我都知道。"],"type":"paragraph"},{"n":3,"t":["“Whether or not Schuyler Middle School wins today’s competition, I’m proud of you all,” Mr. Ishikawa continued. “It’s a great honor just to have qualified to be on *Quiz Power*. Schuyler is proud to have you represent our school. Just do your best, and enjoy yourselves today.”","“今天的比赛，无论斯凯勒中学能不能赢，我都为你们骄傲。”石川老师接着说，“能取得《知识力量》的参赛资格，本身就是很大的荣誉。学校为有你们代表我们参赛而自豪。今天尽力就好，也要好好享受比赛。”"],"type":"paragraph"},{"n":4,"t":["The members of the team cheered as Mr. Ishikawa finished his speech. The students knew they were ready for almost any question the quizmaster might pose. They couldn’t wait to get started.","石川老师讲完，队员们欢呼起来。学生们知道，主持人可能提出的问题，他们几乎都有把握应对。他们已经等不及要开始了。"],"type":"paragraph"},{"n":5,"t":["Inside the studio, the students were met by Annette Cane, the show’s executive producer. Ms. Cane was a tall, friendly woman with thick auburn hair and an infectious laugh. Within a few minutes, she had put all the contestants at ease. When the competing team from Brighton Park arrived, Ms. Cane made quick introductions and passed out drinks.","在演播室里，节目执行制片人安妮特·凯恩接待了学生们。凯恩女士个子高高的，待人亲切，一头浓密的赤褐色头发，笑起来很有感染力。没过几分钟，她就让所有参赛选手放松下来。布莱顿公园学校的对手队伍到了之后，她简短介绍了双方，给大家分发了饮料。"],"type":"paragraph"},{"n":6,"t":["“I’m sure you’ve already heard this a hundred times today,” she told the room of expectant students, “but the most important thing you can do during the competition is to relax and have fun. Do your best to ignore the cameras and the microphones. Once the announcer has finished asking a question, you will want to ring your buzzer as soon as you think you have the answer.","“我猜你们今天已经听过一百遍了，”她对满屋子满怀期待的学生说，“可比赛中最重要的就是放松，玩得开心。尽量别去在意摄像机和麦克风。主持人问完一道题，只要觉得自己知道答案，就马上按抢答器。"],"type":"paragraph"},{"n":7,"t":["“People tend to speak more quickly when they are nervous, so just try to answer slowly and calmly when it’s your turn.” She smiled sympathetically at the students who were beginning to look tense. “Do you have any questions before we begin taping?”","“人一紧张，说话就容易变快，所以轮到你回答时，尽量放慢速度，沉着一点。”见学生们又开始显得紧张，她体谅地朝他们笑了笑。“开始录制前，你们还有什么问题吗？”"],"type":"paragraph"},{"n":8,"t":["Gabriel, a seventh-grader from Schuyler, waved his hand. “Will the winning team come back to compete for the championship?” he asked.","斯凯勒中学七年级的加布里埃尔挥着手问：“获胜的队伍会回来争夺总冠军吗？”"],"type":"paragraph"},{"n":9,"t":["Ms. Cane nodded. “The championships are held in the spring. The winning teams from the rest of the year will participate in playoffs to determine the final four teams. Each member of the winning team will receive a $1,000 college savings bond. The winning school will also receive two brand-new, fully-equipped computers.”","凯恩女士点点头。“总决赛在春天举行。一年中其他时候获胜的队伍会参加淘汰赛，决出最后四支队伍。冠军队的每位队员都会获得一张面值一千美元、供上大学用的储蓄债券。获胜学校还会得到两台配置齐全的全新电脑。”"],"type":"paragraph"},{"n":10,"t":["“Who chooses the questions that are used during the show?” asked Monique, an eighth-grader from Brighton Park.","“节目里的问题是谁选的？”布莱顿公园学校八年级的莫妮克问。"],"type":"paragraph"},{"n":11,"t":["“We have a panel of researchers who compile a list of questions. They come together to narrow down the list of questions and determine which ones will actually be used in the show. Each question is given a rating to ensure that the level of difficulty progresses as the game goes on.” Ms. Cane glanced at the platform where there were places for each team and a podium for the announcer.","“我们有一个研究小组，负责拟定一份题目清单。他们会一起筛选，决定哪些题真正用于节目。每道题都会评定难度，确保比赛越往后，题目越难。”凯恩女士朝台上瞥了一眼。台上有各队的位置，还有主持人的讲台。"],"type":"paragraph"},{"n":12,"t":["“Any more questions?” she asked. The students were silent, focused on the task ahead of them. “Then, let the game begin!”","“还有问题吗？”她问。学生们没有作声，心思都放在眼前的比赛上。“那么，比赛开始吧！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["What prize will the team that wins the championship receive?\n\n________","赢得总冠军的队伍将获得什么奖品？"],"ans":["Each winner will receive a $1,000 college savings bond. The winning schools will receive new computers.","每位获胜队员将得到一张面值一千美元、供上大学用的储蓄债券。获胜学校将获得新电脑。"]},{"n":2,"ask":["Do you think that Mr. Ishikawa is a good coach? Why or why not?\n\n________\n\n________","你认为石川老师是一位好教练吗？为什么？"],"ans":["Answers will vary.","答案因人而异。"]},{"n":3,"ask":["In paragraph 5, the author describes Ms. Cane as having “an infectious laugh.” What do you think this means?\n\n________\n\n________","第5段用“an infectious laugh”（很有感染力的笑声）来形容凯恩女士。你觉得这个说法是什么意思？"],"ans":["Possible answer: Her laugh makes other people want to laugh too.","示例：她一笑，别人也会想跟着笑。"]},{"n":4,"ask":["What are three words you could use to describe Ms. Cane’s personality?\n\n________","你会用哪三个词形容凯恩女士的性格？"],"ans":["Possible answers: friendly, helpful, knowledgeable","示例：友善、乐于助人、见多识广。"]},{"n":5,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ for pleasure or entertainment\n- ________ for information\n- ________ to learn how to be on an academic game show","读者可能出于什么目的阅读这篇文章？\n获得乐趣或消遣\n获取信息\n了解如何参加电视知识竞赛节目"],"ans":["✓ for pleasure or entertainment","获得乐趣或消遣。"]},{"n":6,"ask":["Why does Ms. Cane say that the questions are rated?\n\n________\n\n________","凯恩女士说为什么要给题目评定难度？"],"ans":["It helps to make sure that the difficulty level progresses as the game goes on.","这样有助于确保比赛进行到后面时，题目越来越难。"]},{"n":7,"ask":["The student contestants are nervous before the quiz show starts. How do you calm yourself when you’re nervous before a big event?\n\n________\n\n________\n\n________","节目开始前，参赛的学生很紧张。你在重要活动前感到紧张时，会怎样让自己平静下来？"],"ans":["Answers will vary.","答案因人而异。"]}]},{"id":"P104","title":["Tune in to History","调到历史频道"],"lead":["Do you know who invented television?","你知道电视是谁发明的吗？"],"exercise":"P105","genre":"科技史说明文","family":"info","parts":[{"n":1,"t":["Television is such a familiar part of our daily lives that you probably never think about its history or the fact that as recently as 70 years ago many people had never even heard of it. The word *television* comes from the Greek word *tele*, which means *far*, and the Latin word *visio*, which means *sight*. It’s the perfect description for this electronic device that receives images and sound transmitted from another place.","电视是我们日常生活中再熟悉不过的一部分，你大概从没想过它的历史，也没想到就在约70年前，还有不少人连电视都没听说过。television 这个词来自希腊语 tele 和拉丁语 visio，分别意为“远”和“视觉”。这种电子设备可以接收从别处传来的图像和声音，这个名字用来形容它再贴切不过了。"],"type":"paragraph"},{"n":2,"t":["Early in the 20th century, many experiments were attempted to transmit moving images from one place to another. Because there were so many contributors, it is hard to pinpoint exactly who gets credit as the inventor of TV. However, television as we know it today was developed in the 1920s by two men working separately.","20世纪初，人们做了许多实验，试图把活动影像从一个地方传到另一个地方。作出贡献的人太多，很难断定究竟该把发明电视的功劳归给谁。不过，今天我们所说的电视是两个人在20世纪20年代各自独立研制出来的。"],"type":"paragraph"},{"n":3,"t":["Philo Taylor Farnsworth, a farm boy from Idaho, demonstrated the first electronic television in 1927. It was a prototype of the TVs we use today. During the late 1920s, a Russian-born scientist named Vladimir Zworykin worked with the electronics company RCA to develop the first marketable televisions. Because of this pivotal role in bringing TV to the public, he was regarded for many years as the “inventor” of television. Historians disagree about which man deserves more credit, but today, Farnsworth’s contribution is seen as the crucial first step in the technological developments made by Zworykin.","1927年，来自爱达荷州农村的年轻人菲洛·泰勒·法恩斯沃思演示了第一台电子电视机。这就是我们今天使用的电视机的原型。20世纪20年代末，出生在俄罗斯的科学家弗拉基米尔·兹沃雷金与美国无线电公司（RCA）合作，研制出第一批可供销售的电视机。他在推动电视走入公众生活方面发挥了关键作用，多年来一直被视为电视的“发明者”。历史学家对于两人中谁的功劳更大意见不一，不过如今，人们认为法恩斯沃思的贡献是至关重要的第一步，兹沃雷金在此基础上推动了电视技术的发展。"],"type":"paragraph"},{"n":4,"t":["The first TVs were not too impressive by our standards. In fact, they were actually radios with an extremely small television device attached. The screen was lit by a reddish neon light, and the image was only the size of a postage stamp.","按今天的标准来看，最初的电视机没什么了不起。说到底，那是一台装着极小电视装置的收音机。屏幕靠泛红的霓虹灯照亮，画面只有一张邮票那么大。"],"type":"paragraph"},{"n":5,"t":["By the 1930s, TVs became available to the public, but they were very expensive—about $7,000 each in today’s money. After World War II, however, the price dropped significantly and televisions became a much more common sight. By the late 1950s, color televisions became available, and the Western series *Bonanza* became the first TV show to be regularly shown in color.","到了20世纪30年代，普通人已经可以买到电视机，但价格很贵，按今天的币值算，每台约7000美元。第二次世界大战后，价格大幅下降，电视机也常见了许多。到20世纪50年代末，彩色电视机开始上市，西部剧《博南扎》成为第一部定期以彩色播出的电视节目。"],"type":"paragraph"},{"n":6,"t":["Television is similar to radio in the way that it uses an antenna to pick up signals sent over the airwaves. Local TV stations still send signals that can be picked up by your TV’s antenna, but increasing numbers of people use cable to receive their television broadcasts.","电视和收音机相似，都用天线接收通过无线电波传送的信号。地方电视台现在仍会发送电视天线能接收到的信号，不过，越来越多的人通过有线服务收看电视节目。"],"type":"paragraph"},{"n":7,"t":["In 1949, John Watson, a television salesman in rural Pennsylvania, was having a hard time selling his TVs. Television signals were weak by the time they reached his town, and people did not think it was worthwhile to buy a TV. Watson put up a giant antenna to get better reception and offered his customers a free connection to the stronger signal. Eventually, he started to charge for the service, and cable TV was born.","1949年，宾夕法尼亚州乡村的电视机销售员约翰·沃森发现电视很难卖出去。电视信号传到他所在的镇上时已经很微弱，大家觉得买台电视不划算。沃森架起一根巨大的天线以改善接收效果，并让顾客免费接入更强的信号。后来，他开始为这项服务收费，有线电视就这样诞生了。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What was the first TV show to be regularly shown in color?\n\n________","第一部定期以彩色播出的电视节目是什么？"],"ans":["Bonanza","《博南扎》（Bonanza）。"]},{"n":2,"ask":["Who are the two people that are often given credit for inventing television?\n\n________","哪两个人常被认为是电视的发明者？"],"ans":["Philo Taylor Farnsworth and Vladimir Zworykin","菲洛·泰勒·法恩斯沃思和弗拉基米尔·兹沃雷金。"]},{"n":3,"ask":["What Latin and Greek roots are found in the word *television*? What do they mean?\n\n________","television 一词包含什么拉丁语和希腊语词根？它们分别是什么意思？"],"ans":["tele and visio; far and sight","tele 是希腊语词根，意为“远”。visio 是拉丁语词根，意为“视觉”。"]},{"n":4,"ask":["About how much would a 1930s television have cost in today’s dollars?\n\n________","按今天的币值计算，20世纪30年代的一台电视机大约多少钱？"],"ans":["$7,000","7000美元。"]},{"n":5,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to entertain\n- ________ to inform\n- ________ to persuade","勾选最能概括作者写作目的的一项。\n娱乐读者\n提供信息\n说服读者"],"ans":["✓ to inform","提供信息。"]},{"n":6,"ask":["Televisions became ________ priced after World War II.\n\n- significantly\n- reasonably\n- highly","第二次世界大战后，电视机的定价变得怎样？\nsignificantly（显著地）\nreasonably（合理地）\nhighly（很高地）"],"ans":["reasonably","reasonably，即定价合理。"],"dir":["Circle the word that best completes each sentence below.","圈出最适合填入下列各句的词语。"]},{"n":7,"ask":["John Watson’s ________ thinking led to the invention of cable TV.\n\n- creative\n- unimaginative\n- selfish","约翰·沃森的哪种思维促成了有线电视的发明？\ncreative（有创意的）\nunimaginative（缺乏想象力的）\nselfish（自私的）"],"ans":["creative","creative，有创意的。"]},{"n":8,"ask":["Farnsworth and Zworykin both ________ the invention of the modern television.\n\n- developed\n- requested\n- contributed to","法恩斯沃思和兹沃雷金都对现代电视的发明做了什么？\ndeveloped（研制）\nrequested（请求）\ncontributed to（作出贡献）"],"ans":["contributed to","contributed to，两人都对这项发明作出了贡献。"]},{"n":9,"ask":["In paragraph 3, which word means “an original model”?\n\n________","第3段中，哪个词的意思是“最初的模型”？"],"ans":["prototype","prototype（原型）。"]},{"n":10,"ask":["When did televisions first start becoming more common?\n\n________","电视机从什么时候开始变得较为常见？"],"ans":["after WWII","第二次世界大战后。"]}]},{"id":"P106","title":["Moving Images","电视画面的力量"],"lead":["What is the most important event you have seen on TV?","你在电视上看过的最重要的事件是什么？"],"exercise":"P107","genre":"历史说明文","family":"info","parts":[{"n":1,"t":["With at least one television in nearly every home in the United States, TV has become the major source for news. In recent memory, September 11, 2001, and the days that followed kept people glued to their television sets for information and comfort. During the more recent war in Iraq, Americans turned on their TVs for similar reasons. Many historical events from the past 50 years would not be remembered the same way without the televised images. Some events were even shaped by the powerful influence these images have on the public.","美国几乎家家都有至少一台电视机，电视已经成为人们获取新闻的主要渠道。说起记忆犹新的事情，2001年9月11日当天及其后的几天，人们一直守在电视机前，想知道发生了什么，也想寻求一点安慰。后来伊拉克战争期间，美国人打开电视，原因也差不多。过去50年间的许多历史事件，如果没有电视画面，人们今天回想起它们时，感受会大不一样。有些事件的发展甚至受到了电视画面对公众的巨大影响。"],"type":"paragraph"},{"n":2,"t":["The “Checker’s Speech” by vice-presidential candidate Richard Nixon was an early example of how television can change the public’s perception of someone. Nixon had been accused of accepting gifts for his campaign and was viewed negatively by the public.","副总统候选人理查德·尼克松的“小狗切克斯演说”，是电视如何改变公众对一个人印象的早期例子。当时，尼克松受到指责，说他在竞选活动中收受了礼物，公众对他的看法很负面。"],"type":"paragraph"},{"n":3,"t":["On September 9, 1952, Nixon went on TV to defend himself. He claimed that the only questionable gift he had received was the family dog, Checkers, and he was not about to give the pet back. The public was moved to tears by Nixon’s speech, and he redeemed himself. However, television would not be so kind to Nixon in the future.","1952年9月9日，尼克松上电视为自己辩护。他说，自己唯一收到的可能引起争议的礼物是家里的小狗切克斯，而他可不打算把这只宠物还回去。公众被这番讲话感动得落泪，尼克松也挽回了自己的形象。然而，之后电视对尼克松就没那么友好了。"],"type":"paragraph"},{"n":4,"t":["In 1959, television played an important role in the presidential debate between Richard Nixon and John F. Kennedy. Viewers saw a younger, smiling Kennedy trading viewpoints with Nixon, who was scowling and looked uncomfortable. Radio listeners, who had heard only the words and ideas, thought that Nixon had won the debate. However, television viewers declared Kennedy the winner. The power of televised images in politics was never underestimated again.","1959年，电视在理查德·尼克松与约翰·F. 肯尼迪的总统候选人辩论中发挥了重要作用。观众看到，较年轻的肯尼迪面带笑容，与眉头紧锁、神情不自在的尼克松交锋。只听到两人的措辞和观点的广播听众认为尼克松赢了辩论，然而，电视观众却认定肯尼迪获胜。自此，再没人低估电视画面在政治上的影响力。"],"type":"paragraph"},{"n":5,"t":["During the tragedy of JFK’s assassination, television allowed the citizens of our nation to grieve together. People across the country saw Kennedy’s coffin as it was loaded onto *Air Force One* while Jackie Kennedy, the First Lady, stood by watching. Millions who were still in shock over these unbelievable events viewed JFK’s funeral procession. Many citizens were also reassured about the power of our democracy as they watched Vice-President Lyndon Johnson quickly sworn in as the new president.","肯尼迪遇刺这一悲剧发生时，电视让全国人民一起哀悼。全国各地的人们都看到，肯尼迪的灵柩被抬上“空军一号”专机，第一夫人杰姬·肯尼迪站在一旁注视着。数百万人仍未从这场难以置信的变故中缓过神来，他们收看了肯尼迪的送葬队伍经过的画面。人们看到副总统林登·约翰逊迅速宣誓就任新总统，许多人也因此对美国民主制度的运作恢复了信心。"],"type":"paragraph"},{"n":6,"t":["Not all historical moments on television involve politics. For instance, the Beatles’ appearance on the *Ed Sullivan Show* on February 9, 1964, changed American pop culture. Viewers across the nation saw their goofy grins and goofier haircuts, as well as the crowd’s frenzied cheering, and “Beatlemania” was born.","电视上的历史性时刻也有与政治无关的。例如，1964年2月9日，披头士乐队登上《埃德·沙利文秀》，改变了美国流行文化。全国观众看见他们傻呵呵的笑容和更逗趣的发型，还听见现场观众狂热的欢呼声，“披头士狂热”就此诞生。"],"type":"paragraph"},{"n":7,"t":["In July of 1969, 94 percent of Americans who owned televisions watched a live broadcast and saw Neil Armstrong and Buzz Aldrin become the first humans on the moon. Around the world, nearly one billion people watched this event on TV.","1969年7月，在拥有电视机的美国人当中，94%收看了直播，见证尼尔·阿姆斯特朗与巴兹·奥尔德林成为首批登上月球的人。全世界有近十亿人通过电视观看了这件大事。"],"type":"paragraph"}],"original":[{"n":1,"ask":["the way in which one is viewed or perceived\n\n________","在文中找出符合释义的英文词：别人看待或认识某人的方式。"],"ans":["perception","perception（看法、印象）。"],"dir":["Write the words from the passage that have the meanings below.","从课文中找出符合下列释义的词，写下来。"]},{"n":2,"ask":["changed for the better; reformed\n\n________","在文中找出符合释义的英文词：发生好的转变，重新赢得认可。"],"ans":["redeemed","redeemed（挽回了形象）。"]},{"n":3,"ask":["felt comforted and less anxious\n\n________","在文中找出符合释义的英文词：得到安慰，不那么担心了。"],"ans":["reassured","reassured（得到安慰，恢复了信心）。"]},{"n":4,"ask":["________ Nixon stated that he did not receive any questionable gifts.","判断正误：尼克松说自己从未收过任何可能引起争议的礼物。"],"ans":["F","错误（F）。"],"dir":["Write T before the sentences that are true. Write F before the sentences that are false.","在正确的句子前写 T，在错误的句子前写 F。"]},{"n":5,"ask":["________ About 75 percent of Americans who owned televisions watched Armstrong and Aldrin walk on the moon.","判断正误：在拥有电视机的美国人中，大约75%观看了阿姆斯特朗和奥尔德林在月球上行走。"],"ans":["F","错误（F）。"]},{"n":6,"ask":["________ The Beatles appeared on the *Ed Sullivan Show* in 1964.","判断正误：披头士乐队于1964年登上了《埃德·沙利文秀》。"],"ans":["T","正确（T）。"]},{"n":7,"ask":["________ Lyndon Johnson became president after Kennedy’s assassination.","判断正误：肯尼迪遇刺后，林登·约翰逊成为总统。"],"ans":["T","正确（T）。"]},{"n":8,"ask":["Do you think that television as a source of news will be as important in the future as it has been in the past? Explain.\n\n________\n\n________","你认为电视作为新闻来源，在未来还会像过去一样重要吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":9,"ask":["How did the “Checker’s Speech” change the way people thought of Richard Nixon?\n\n________\n\n________","“小狗切克斯演说”改变了人们对理查德·尼克松怎样的看法？"],"ans":["People liked Nixon better. They saw a side of him they had not seen before.","人们更喜欢尼克松了。他们看到了此前未曾见过的他的一面。"]},{"n":10,"ask":["Do you think it is fair for people to base their opinions on what they see as well as what they hear? Explain.\n\n________\n\n________","人们根据听到的和看到的来形成看法，你觉得这样公平吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":11,"ask":["What kind of effect did television have on the popularity of the Beatles?\n\n________","电视对披头士乐队受欢迎的程度产生了什么影响？"],"ans":["It caused a sharp rise in their popularity.","乐队的人气迅速上升。"]},{"n":12,"ask":["How did Kennedy and Nixon appear to be different from one another during their televised debate?\n\n________\n\n________","在电视转播的辩论中，肯尼迪和尼克松看起来有什么不同？"],"ans":["Nixon was scowling and uncomfortable, and Kennedy was smiling and looked confident.","尼克松眉头紧锁，显得不自在；肯尼迪面带微笑，显得很自信。"]}]},{"id":"P108","title":["A Reservoir of Memories","一座装满回忆的水库"],"lead":["Have you ever gone canoeing?","你划过独木舟吗？"],"exercise":"P109","genre":"家庭故事","family":"lit","parts":[{"n":1,"t":["Meghan sat in the canoe, patiently waiting for her sister and grandma to join her. She watched Becca cautiously step into the canoe as her grandma coached her.","梅根坐在独木舟里，耐心地等妹妹和奶奶上船。她看着贝卡在奶奶指点下，小心翼翼地迈进船里。"],"type":"paragraph"},{"n":2,"t":["“Remember not to stand up all the way or make any abrupt movements,” said Grandma, holding the canoe steady.","“记住，别完全站直，动作也别太突然，”奶奶一边说，一边扶稳独木舟。"],"type":"paragraph"},{"n":3,"t":["Once Becca was safely in the canoe, Grandma passed the girls the camera, which was sealed in a waterproof bag. She confirmed that both paddles were in the canoe, and then she deftly climbed in and settled herself at the head of the small craft.","贝卡安全上船后，奶奶把装在密封防水袋里的相机递给姐妹俩。她确认两支桨都在船里，随即利落地上了船，在船头坐好。"],"type":"paragraph"},{"n":4,"t":["“How did you learn to canoe, Grandma?” asked Becca, once Meghan and their grandmother had established a rhythm for paddling.","等梅根和奶奶划出了稳定的节奏，贝卡问：“奶奶，你是怎么学会划独木舟的？”"],"type":"paragraph"},{"n":5,"t":["“It was such a long time ago,” she said thoughtfully, “in a reservoir much like this one. When I was 18 years old, I worked as a camp counselor at a girls’ summer camp in Vermont. I learned how to canoe that summer, but I also learned how to build a fire, treat snake bites, and survive in the woods for a week on my own. At least in theory,” she chuckled.","“那是很久以前的事了，”奶奶回想着，“就是在一座和这儿很像的水库。我18岁时在佛蒙特州一个女生夏令营当辅导员。那个夏天，我学会了划独木舟，还学会了生火、处理蛇咬伤，以及怎样独自在树林里生活一星期。至少理论上会。”她轻声笑了。"],"type":"paragraph"},{"n":6,"t":["“There was a boys’ camp nearby, and we scheduled activities or events with them several times during the summer. That’s actually how I met your grandfather,” she said, smiling fondly.","“附近还有个男生夏令营。那年夏天，我们和他们一起安排过几次活动。我就是那时候认识你们爷爷的。”说到这里，她露出温柔的笑容。"],"type":"paragraph"},{"n":7,"t":["“I love him dearly, but your grandpa is one of the most uncoordinated people I’ve ever known.” Grandma continued. “The day we met, he was paddling a canoe across the reservoir, and he kept overturning it. He’d reach for something in the canoe, or stand up when he got excited and lose his balance. He asked me to give him canoeing lessons, but I think it was just because he wanted to get to know me.” Grandma smiled at the memory.","“我很爱他，不过你们爷爷是我认识的人里手脚最不协调的几个之一。”奶奶接着说，“我们认识那天，他正划独木舟穿过水库，结果老把船弄翻。他有时伸手去够船里的东西，有时一激动就站起来，结果失去平衡。他请我教他划船，可我觉得，他只是想找机会认识我。”想起当时的情景，奶奶笑了。"],"type":"paragraph"},{"n":8,"t":["“How is a reservoir different than a lake?” asked Meghan.","“水库和湖有什么不一样？”梅根问。"],"type":"paragraph"},{"n":9,"t":["“It is a type of lake,” said Grandma, resting her paddle across her knees. “Most lakes are naturally formed, but reservoirs are made by humans. I’ve brought you to see Dillon Dam before, haven’t I?” she asked. The girls nodded. “Dillon Dam was built about 30 years ago to control the flooding in this area. When a dam is built, an artificial lake is created by flooding the land behind the dam.”","“水库也是一种湖，”奶奶把桨横放在膝上，“大部分的湖是自然形成的，水库是人造的。我以前带你们去看过迪伦大坝，对吧？”姐妹俩点点头。“迪伦大坝是大约30年前修的，用来防治这一带的洪水。筑坝后，坝后的土地被水淹没，就形成了一座人工湖。”"],"type":"paragraph"},{"n":10,"t":["Becca furrowed her eyebrows. “I still don’t understand how that controls flooding,” she said.","贝卡皱起眉头。“我还是不明白这样怎么能防洪，”她说。"],"type":"paragraph"},{"n":11,"t":["“The dam can be emptied when flooding is expected,” said Grandma. “Making space for flood waters helps, because the water can be held in the reservoir and gradually released later. The reservoir is also hundreds of times wider than the river, so water that would flood the banks of a river only causes the water level in the reservoir to rise a small amount.” Grandma picked up her paddle, and she and Meghan began paddling again.","“预计会发洪水时，可以先把坝后的水放掉，”奶奶说，“这样就腾出了空间，可以把洪水先蓄在水库里，以后慢慢放出去。水库也比河宽几百倍，同样多的水能漫过河岸，在水库里却只会让水位稍微升高。”奶奶拿起桨，和梅根再次划了起来。"],"type":"paragraph"},{"n":12,"t":["Becca looked around at the high valley walls surrounding the reservoir and the serene water that stretched as far as she could see. “I’m glad that reservoirs aren’t only used for controlling floods,” she said.","贝卡环顾水库两侧高高的谷壁，又望了望眼前一望无际的平静水面。“我真高兴，水库还有防洪以外的用处。”她说。"],"type":"paragraph"},{"n":13,"t":["Grandma laughed. “Me, too,” she said. “I might never have met your grandpa otherwise!”","奶奶笑了。“我也这么想，”她说，“不然，我也许永远都遇不到你们爷爷呢！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["What do you think Grandma means when she says she learned to survive in the woods, “at least in theory”?\n________","奶奶说，她学会了在树林里生存，“至少理论上会”。你觉得她是什么意思？"],"ans":["Possible answer: that she knows how to survive in the woods, but she never actually put her knowledge to use","示例：她知道该怎么在树林里生存，但从来没有实际用过这些知识。"]},{"n":2,"ask":["Who do you think is older, Becca or Meghan? Why?\n________","你认为贝卡和梅根谁年纪大？为什么？"],"ans":["Meghan. Possible answer: she helps grandma paddle.","梅根。示例：她帮奶奶划船。"]},{"n":3,"ask":["How did Grandma learn to canoe?\n________","奶奶是怎么学会划独木舟的？"],"ans":["She learned when she was a summer camp counselor.","她当夏令营辅导员的时候学会的。"]},{"n":4,"ask":["What advice does Grandma give Becca when Becca is climbing into the canoe?\n________","贝卡上独木舟时，奶奶给了她什么建议？"],"ans":["to not stand up all the way and not make any abrupt movements","别完全站直，动作也别太突然。"]},{"n":5,"ask":["What is one difference between a natural lake and a reservoir?\n________","天然湖和水库有什么不同？说出一点。"],"ans":["Possible answer: Reservoirs are created by humans, and lakes are naturally formed.","示例：水库是人工修建的，天然湖是自然形成的。"]},{"n":6,"ask":["Why does Grandma think that Grandpa wanted canoeing lessons?\n________","奶奶认为爷爷为什么想上独木舟课？"],"ans":["so he could get to know her better","因为他想多了解她。"]},{"n":7,"ask":["What is the setting for this story?\n________","故事发生在哪里？"],"ans":["a reservoir","一座水库。"]},{"n":8,"ask":["In paragraph 2, what does *abrupt* mean?\n________","第2段的 abrupt 是什么意思？"],"ans":["Possible answer: sudden","示例：突然的。"]},{"n":9,"ask":["Why does Grandma say that Grandpa is very uncoordinated?\n________","奶奶为什么说爷爷手脚很不协调？"],"ans":["When he was canoeing, he would overturn the canoe or stand up and lose his balance.","他划船时会把船弄翻，或者一站起来就失去平衡。"]}]},{"id":"P110","title":["Blocking Water","把水拦下来"],"lead":["Is there a dam located near you?","你住的地方附近有水坝吗？"],"exercise":"P111","genre":"科普说明文","family":"info","parts":[{"n":1,"t":["If you are hiking through the woods and notice a pile of timber, mud, and stone blocking a stream, you just might have stumbled upon a beaver dam. Beavers build dams so they can construct their lodges in the middle of the pond that forms as a result of the blocked water. The entrance to the lodge is located under the surface of the water, allowing the pond to function as a natural defense against predators. The pond also allows the beavers to live right on top of water lilies, their favorite meal.","如果你徒步穿过树林，发现一堆木头、泥巴和石块拦住了溪水，那你可能碰巧发现了一座河狸坝。河狸筑坝拦水，在形成的池塘中央筑巢。巢穴的入口在水面下，池塘于是成了一道抵御捕食者的天然屏障。池塘还让河狸就住在睡莲上方，而睡莲正是它们最爱吃的食物。"],"type":"paragraph"},{"n":2,"t":["However, the biggest builders of dams are humans, and they have been doing it for a long time. Some of the earliest structures built by humans are dams dating back nearly 5,000 years. At the beginning of civilization, dams were built in the Middle East so that people could stay in one place and farm. The water captured by dams enabled the first farmers to irrigate crops in areas that were otherwise too dry. The Ma’rib Dam in Yemen, originally built 2,700 years ago, is still in use today, although many parts of it have been rebuilt during that time.","不过，规模最大的筑坝者是人类，而且人类筑坝已有很长的历史。人类修建的最早的一些建筑就是水坝，可以追溯到将近5000年前。文明初期，中东地区的人们筑坝，好定居下来耕种。水坝蓄下的水，使最早的农民能在缺水、原本无法耕种的地方灌溉农作物。也门的马里卜坝最初建于2700年前，其间不少部分经过重建，至今还在使用。"],"type":"paragraph"},{"n":3,"t":["Irrigation is just one reason people build dams. Water that pools behind these structures can also supply drinking water to cities and towns. Dams allow large populations to live in places where water is scarce. Lake Mead is a reservoir, or artificial lake, created by Hoover Dam. It provides water for more than 16 million people in Nevada, Arizona, and California. The Colorado River feeds Lake Mead, which holds enough water to cover the entire state of Pennsylvania!","灌溉只是人们筑坝的一个原因。坝后蓄积的水还可以为城镇提供饮用水。水坝让水源稀缺的地方也能容纳大量人口。米德湖就是胡佛大坝筑成后形成的水库，也就是人工湖。它为内华达州、亚利桑那州和加利福尼亚州超过1600万人供水。米德湖由科罗拉多河注水，蓄的水足以淹没整个宾夕法尼亚州！"],"type":"paragraph"},{"n":4,"t":["Dams are also used to help ships and barges navigate rivers that would otherwise be too shallow. Canals are built alongside the dam so that boats can travel around it. In addition, the canals usually contain locks because the area around the dam is higher than the river, meaning the boat needs to travel up and over the surrounding area.","如果河水太浅，船舶和驳船无法通行，水坝也能帮助它们航行。人们在大坝旁开凿运河，让船只绕过水坝。运河通常还配有船闸，因为水坝周围的地势比河道高，船得先升高，才能越过这一带。"],"type":"paragraph"},{"n":5,"t":["A lock is part of the canal that can be blocked off and filled with water. Each lock is flooded or drained, depending on whether the boat needs to be raised or lowered. The front of the lock is then opened, allowing the boat to float into the next lock. The process is repeated until the boat has traveled up or down the area needed to pass the dam.","船闸是运河中可以封闭起来并注水的一段。需要升高船只时就往闸室注水，需要降低船只时就排水。随后打开船闸前方的闸门，船便可以驶入下一级船闸。如此反复，直到船升高或降低到足以绕过大坝的位置。"],"type":"paragraph"},{"n":6,"t":["Many modern dams harness the power of flowing water, transforming its energy into electricity. These dams are hydroelectric dams. The largest hydroelectric dam in the world is under construction right now in China. It is expected to have a reservoir 370 miles long. The Three Gorges Dam on the Yangtze River is designed to control flooding but will also produce enough energy to fill a good deal of China’s electrical needs.","许多现代水坝会利用水流的力量，把水流的能量转化为电能。这类水坝叫作水力发电坝。世界上最大的水力发电坝目前正在中国修建，预计会形成一个长370英里的水库。这座建在长江上的三峡大坝主要用于防洪，同时也会发电，满足中国相当一部分的用电需求。"],"type":"paragraph"},{"n":7,"t":["Three Gorges Dam has created controversy, for many of the same reasons that other large dams have. Land that has always been dry will now be underwater, altering the environment drastically. Dams especially affect migratory fish, like salmon and trout, because they need to move upstream and downstream for feeding and reproduction. Three Gorges Dam has also displaced millions of people because their homes have been destroyed to make space for the dam.","和许多其他大型水坝一样，三峡大坝也引发了争议，争议的原因有不少相同之处。一向是陆地的区域将被水淹没，环境随之发生剧变。水坝尤其会影响鲑鱼、鳟鱼等洄游鱼类，因为它们需要在上游和下游之间往来觅食和繁殖。为给修坝腾出空间，数百万人的家园被毁，他们因此被迫迁离。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What is one benefit to beavers of having the entrance to a lodge located underwater?\n________","河狸把巢穴入口设在水下，有什么好处？说出一点。"],"ans":["The pond serves as a natural defense against predators.","池塘可以作为天然屏障，抵御捕食者。"]},{"n":2,"ask":["How old is the Ma’rib Dam?\n________","马里卜坝有多久的历史？"],"ans":["about 2,700 years old","约2700年。"]},{"n":3,"ask":["Why do dams cause problems for migrating fish?\n________","水坝为什么会给洄游鱼类造成麻烦？"],"ans":["The fish are kept from moving up and down stream for feeding and reproduction.","鱼类无法在上下游之间往来觅食、繁殖。"]},{"n":4,"ask":["Why do canals often contain locks?\n________","为什么运河常设船闸？"],"ans":["so that boats can travel on rivers that are blocked by dams","这样船就能在被水坝拦住的河道上通行。"]},{"n":5,"ask":["What are two reasons the Three Gorges Dam is being constructed in China?\n________","中国为什么修建三峡大坝？说出两个原因。"],"ans":["to control flooding and to fill some of China’s electrical needs.","防洪，并满足中国一部分用电需求。"]},{"n":6,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ for pleasure or entertainment\n- ________ for information\n- ________ to learn how to build a dam","读者可能出于什么目的阅读这篇文章？\n获得乐趣或消遣\n获取信息\n学习如何修建一座水坝"],"ans":["✓ for information","获取信息。"]},{"n":7,"ask":["On the lines below, write a summary for paragraph 2.\n________","概括第2段的内容。"],"ans":["Possible answer: Humans have been building dams since the beginning of civilization","示例：从文明初期起，人类就开始筑坝了。"]},{"n":8,"ask":["Name one benefit and one drawback of the construction of Three Gorges Dam.\n________","三峡大坝的修建有什么好处和坏处？各说一点。"],"ans":["Possible answer: benefit: It will control flooding. drawback: It will affect migrating fish.","示例：好处是能防洪，坏处是会影响洄游鱼类。"]}]},{"id":"P112","title":["The Eighth Wonder of the World","世界第八大奇迹"],"lead":["Why is Washington’s Grand Coulee Dam considered to be such an impressive structure?","为什么华盛顿州的大古力水坝被认为是如此了不起的建筑？"],"exercise":"P113","genre":"工程说明文","family":"info","parts":[{"n":1,"t":["The Grand Coulee Dam, on the Columbia River in Washington State, is one of humankind’s most amazing structures. There is enough concrete in the dam to build a four-lane highway between Los Angeles and New York City. The dam is more than a mile long, and at 550 feet tall, it is about twice as tall as the Statue of Liberty or Niagara Falls!","大古力水坝横跨华盛顿州的哥伦比亚河，是人类建造的最惊人的建筑之一。建造这座水坝所用的混凝土，足够修一条从洛杉矶到纽约市的四车道公路。大坝全长超过一英里，高550英尺，约有自由女神像或尼亚加拉瀑布的两倍高！"],"type":"paragraph"},{"n":2,"t":["If you are thinking that it must have been a time-consuming project to build the dam, you are correct. Work on the Grand Coulee Dam was begun in 1933 during Franklin D. Roosevelt’s administration. When the dam was finally completed in 1942, nine years after it was begun, it was the largest dam in the world.","如果你觉得筑坝一定耗时很久，那你猜对了。大古力水坝于1933年动工，当时富兰克林·D. 罗斯福执政。开工9年后，大坝终于在1942年建成，成为当时世界上最大的水坝。"],"type":"paragraph"},{"n":3,"t":["Initially, the Grand Coulee Dam was built as part of an irrigation system for desert areas in the Pacific Northwest. However, World War II was beginning just as the dam was completed, and it became necessary to use the energy created by the flow of water.","建造大古力水坝，原本是为了给美国太平洋西北地区的沙漠地带建设一套灌溉系统。然而，水坝刚建成时第二次世界大战正打响，人们有必要利用水流产生的能量。"],"type":"paragraph"},{"n":4,"t":["Hydroelectric power uses the energy created by falling water to produce electricity. The type of energy produced by falling water is called *mechanical energy*. It is converted into electrical energy by a generator and a water turbine. As the country’s need for electricity increased during the war, the Grand Coulee Dam was able to fill some of that need with the massive amounts of energy it produced.","水力发电利用水从高处落下时产生的能量来发电。这种能量叫作机械能，由水轮机和发电机把它转化成电能。战争期间，美国对电力的需求不断增长，大古力水坝发出了大量电力，满足了其中一部分需求。"],"type":"paragraph"},{"n":5,"t":["Although the dam proved to be beneficial to the area and to the nation, there were also drawbacks to its existence. The land of Native American tribes who lived along the Columbia River was flooded after the construction of the dam, and they were forced to move to new areas. In addition, the dam disrupted the migration of salmon, a staple of their diet.","大坝给当地和全国带来了实际利益，也带来一些坏处。大坝建成后，哥伦比亚河沿岸美洲原住民部落的土地被淹没，他们只得迁往别处。此外，大坝还阻断了鲑鱼的洄游路线，而鲑鱼是他们的主要食物之一。"],"type":"paragraph"},{"n":6,"t":["In the 1990s, the government was required to offer a large sum of money to the Colville tribe in payment for the disturbances and suffering the dam had caused. Although the tribe received millions of dollars, the money could not buy back what its members and their relatives had lost.","20世纪90年代，政府被要求向科尔维尔部落支付一大笔钱，赔偿水坝给他们带来的生活扰乱和痛苦。虽然部落得到了数百万美元，但钱买不回部落成员及其亲人失去的一切。"],"type":"paragraph"},{"n":7,"t":["Today, the dam is a popular tourist attraction. It continues to function as a source of irrigation and as a powerful electrical generator. Franklin Delano Roosevelt Lake, the reservoir created by the dam, has more than 500 miles of shoreline. Residents and visitors enjoy a variety of recreational activities there, including fishing, swimming, hiking, and boating. The public can tour the inside of the dam. During the summer months, they can watch a laser light show on the dam’s wall.","现在，大坝是一处热门旅游景点。它仍为灌溉供水，也继续大量发电。水坝形成的水库名为富兰克林·德拉诺·罗斯福湖，湖岸线长达500多英里。当地居民和游客可以在这里钓鱼、游泳、徒步和划船，休闲活动多种多样。公众可以参观大坝内部。在夏季，人们还能观看投映在坝墙上的激光秀。"],"type":"paragraph"},{"n":8,"t":["If you ever happen to visit Washington, put the Grand Coulee Dam on your list of places to see. With its enormous size and incredible power, no wonder it is often considered to be the Eighth Wonder of the World.","要是有机会去华盛顿州，记得把大古力水坝列入参观清单。它如此巨大，又有惊人的发电能力，难怪常被称为世界第八大奇迹。"],"type":"paragraph"}],"original":[{"n":1,"ask":["On the line below, write a sentence that describes the main idea of the selection.\n________","写一句话概括本文的中心思想。"],"ans":["Answers will vary. Possible answer: The Grand Coulee Dam serves as a source of irrigation, an electrical generator, and a tourist attraction.","答案因人而异。示例：大古力水坝能供水灌溉、发电，也是一处旅游景点。"]},{"n":2,"ask":["Why does the author say that the money the government paid could not buy back what the Colville tribe had lost?\n________","为什么作者说政府支付的钱买不回科尔维尔部落失去的一切？"],"ans":["The Colville tribe could never regain the land that they lost, and the money could not make up for their loss.","科尔维尔部落永远无法拿回失去的土地，钱也无法弥补这些损失。"]},{"n":3,"ask":["How long did it take to complete construction on the Grand Coulee Dam?\n________","大古力水坝用了多长时间建成？"],"ans":["nine years","9年。"]},{"n":4,"ask":["Is Franklin Delano Roosevelt Lake a natural or human-made lake? How do you know?\n________","富兰克林·德拉诺·罗斯福湖是天然湖还是人工湖？你怎么知道？"],"ans":["It was made by humans. It is a reservoir that was produced by the creation of the dam.","是人工湖。它是筑坝后形成的水库。"]},{"n":5,"ask":["In paragraph 1, the author compares the height of the dam to the height of two well-known landmarks. What are they?\n________","第1段中，作者用两个著名地标来比较大坝的高度。是哪两个？"],"ans":["the Statue of Liberty and Niagara Falls","自由女神像和尼亚加拉瀑布。"]},{"n":6,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to share information about the Grand Coulee Dam\n- ________ to persuade the reader to visit the Grand Coulee Dam\n- ________ to entertain","勾选最能概括作者写作目的的一项。\n介绍大古力水坝\n说服读者去参观大古力水坝\n娱乐读者"],"ans":["✓ to share information about the Grand Coulee Dam","介绍大古力水坝。"]},{"n":7,"ask":["Based on the selection, what is the author’s opinion of the Grand Coulee Dam? How do you know?\n________","根据本文，作者对大古力水坝有什么看法？你怎么知道？"],"ans":["Possible answer: The author admires and thinks it is interesting. He/She advises the reader to visit it, if possible.","示例：作者很赞叹这座大坝，也觉得它很有意思。作者建议读者有机会就去参观。"]},{"n":8,"ask":["Do you think the government was right to pay the Colville tribe as a reimbursement for the suffering and disturbances they experienced? Explain.\n________","你认为政府应该向科尔维尔部落赔偿他们承受的痛苦和生活上的扰乱吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]}]},{"id":"P114","title":["Book Fair Brainstorming","为书展出主意"],"lead":["Does your school hold an annual book fair?","你的学校每年都会举办书展吗？"],"exercise":"P115","genre":"校园故事","family":"lit","parts":[{"n":1,"t":["“This is a lot of responsibility, Caleb,” said Tanika, twirling her pen. “I don’t have much experience planning an event like this. I’m glad Mr. Rutledge trusted us to work out all the details, but I’m still worried that we’ll forget something important.”","“这担子可不轻啊，凯莱布，”塔妮卡转着笔说，“我没什么策划这种活动的经验。我很高兴拉特利奇老师信任我们，把所有细节交给我们安排，可我还是担心会漏掉什么重要的事。”"],"type":"paragraph"},{"n":2,"t":["Caleb leaned back in his chair. “I’m not worried, Tanika,” he said. “We just have to be organized. I have no doubt that this will be the best annual book fair George Washington Middle School has ever seen. We’ll raise so much money for the library that they’ll have to build a new room to accommodate all the books they’ll be able to buy,” he joked.","凯莱布往椅背上一靠。“我倒不担心，塔妮卡。咱们只要安排得井井有条就行。用不着怀疑，这肯定是乔治·华盛顿中学办过的最棒的一届年度书展。我们会给图书馆筹到好多钱，他们买的书多得都要再建个房间才放得下。”他开玩笑说道。"],"type":"paragraph"},{"n":3,"t":["Tanika grinned at Caleb. “You might be just a bit too optimistic, but I agree with you that somehow we’ll manage to make this book fair a success.”","塔妮卡朝凯莱布咧嘴一笑。“你可能是有那么一点太乐观了，不过我也同意，我们总能想出办法把书展办好。”"],"type":"paragraph"},{"n":4,"t":["Caleb took out a pad of paper. “Do we have the list of books the librarians ordered?” he asked.","凯莱布拿出一本便笺。“图书管理员订购的书，我们有清单吗？”他问。"],"type":"paragraph"},{"n":5,"t":["Tanika handed Caleb some papers that he quickly leafed through. “We should think of some interesting display ideas,” he said thoughtfully. “The book fairs that we’ve had in the last few years have been kind of dull. I want this one to make everyone feel excited about reading.”","塔妮卡递给凯莱布几张纸，他很快翻了一遍。“我们得想些有意思的布展点子，”他思索着说，“过去几年办的书展都有点无聊，我想让这次书展点燃大家的阅读热情。”"],"type":"paragraph"},{"n":6,"t":["“What if we set up areas with different themes?” suggested Tanika. “We can borrow different kinds of sports equipment from Ms. Spisak and make a display near the sports books.”","“要不我们划分几个区，每个区安排不同的主题？”塔妮卡提议，“我们可以向斯皮萨克老师借几样体育器材，在体育类图书旁边布置一个展台。”"],"type":"paragraph"},{"n":7,"t":["Caleb was sitting up in his chair writing furiously. “That is a fantastic idea, Tanika!” he said excitedly. “We can have a different exhibit for each area. My class has a turtle and some fish that we could display in the area with books about animals.”","凯莱布在椅子上坐直了，飞快地写起来。“这个主意太棒了，塔妮卡！”他兴奋地说，“每个区都可以有不同的展品。我们班养了一只乌龟和几条鱼，可以放在动物图书区展出。”"],"type":"paragraph"},{"n":8,"t":["“The librarians ordered quite a few winter and holiday books, as well,” said Tanika, consulting the list again. “We could make a festive winter scene in one area. I know where there are some little white lights from the school play. I can bring in my ice skates and a few pairs of mittens for the display.”","“图书管理员还订了不少讲冬天和节日的书呢，”塔妮卡又看了一眼清单，“我们可以在一个区布置出热闹的节日冬景。我知道学校演出用过的小白灯放在哪儿。我可以带来我的冰鞋，再拿几副连指手套来布展。”"],"type":"paragraph"},{"n":9,"t":["“What about trying to see if we could get a few writers to come in on the day of the book fair? They could sell autographed copies of their books and answer questions students have about being a writer.”","“要不要试着邀请几位作家在书展那天过来？他们可以卖亲笔签名的书，也可以回答同学们有关当作家的问题。”"],"type":"paragraph"},{"n":10,"t":["“Rachael Weinstock’s mom wrote a picture book a few years ago,” said Tanika. “She’s done several author events around town, and there’s a good chance she’d be willing to help us.”","“蕾切尔·温斯托克的妈妈几年前写过一本绘本，”塔妮卡说，“她在镇上参加过几场作家活动，很可能愿意帮我们。”"],"type":"paragraph"},{"n":11,"t":["“And Carson Davies’s dad used to be an editor for a children’s book publisher. He might know some local authors, too,” added Caleb. He made a few more notes on his pad of paper. “Are you still worried about being able to pull off this book fair, Tanika?” he asked.","“还有，卡森·戴维斯的爸爸以前在一家童书出版社当编辑。他可能也认识一些本地作家，”凯莱布补充道。他在便笺上又记了几笔。“塔妮卡，你现在还担心办不好书展吗？”他问。"],"type":"paragraph"},{"n":12,"t":["Tanika shook her head. “Now I just can’t wait for it to get here,” she said. “I think a little of your optimism has started to rub off on me!”","塔妮卡摇了摇头。“我现在盼着书展快点到呢，”她说，“看来你的乐观已经有一点儿传给我了！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["The Latin root **ann** means year. Find a word in paragraph 2 with the root **ann**.\n________","拉丁语词根 ann 意为“年”。在第2段中找一个含有 ann 的词。"],"ans":["annual","annual（每年的）。"]},{"n":2,"ask":["The Greek root **graph** means *write*. Find a word in paragraph 9 with the root **graph**.\n________","希腊语词根 graph 意为“写”。在第9段中找一个含有 graph 的词。"],"ans":["autographed","autographed（亲笔签名的）。"]},{"n":3,"ask":["The Latin root **loc** means *place*. Find a word in paragraph 11 with the root **loc**.\n________","拉丁语词根 loc 意为“地方”。在第11段中找一个含有 loc 的词。"],"ans":["local","local（本地的）。"]},{"n":4,"ask":["________ Tanika worries too much.","塔妮卡太爱担心了。"],"ans":["O","观点（O）。"],"dir":["Write **F** before the sentences that are facts. Write **O** before the sentences that are opinions.","在陈述事实的句子前写 F，在表达观点的句子前写 O。"]},{"n":5,"ask":["________ This year’s book fair will be better than previous fairs.","今年的书展会比往年的都好。"],"ans":["O","观点（O）。"]},{"n":6,"ask":["________ Rachael Weinstock’s mom is the author of a picture book.","蕾切尔·温斯托克的妈妈是一本绘本的作者。"],"ans":["F","事实（F）。"]},{"n":7,"ask":["________ Caleb’s class has a turtle and some fish.","凯莱布班上有一只乌龟和几条鱼。"],"ans":["F","事实（F）。"]},{"n":8,"ask":["________ I think this book fair will be a success.","我觉得这次书展会成功。"],"ans":["F","第一人称视角（F）。"],"dir":["Mark each sentence below **F** if it is in first-person point of view and **T** if it is in third-person point of view.","下列各句采用第一人称视角的标 F，采用第三人称视角的标 T。"]},{"n":9,"ask":["________ Caleb looked through the list books the librarians ordered.","凯莱布翻看了图书管理员订购的图书清单。"],"ans":["T","第三人称视角（T）。"]},{"n":10,"ask":["________ My sister might have some sports equipment we could use.","我姐姐或妹妹或许有些体育器材可以给我们用。"],"ans":["F","第一人称视角（F）。"]},{"n":11,"ask":["What are two ideas that Tanika and Caleb have to make this year’s book fair more exciting?\n________","塔妮卡和凯莱布想到了哪些点子来让今年的书展更精彩？说出两条。"],"ans":["They want to set up areas with different themes and have authors come to sign their books.","他们想布置不同主题的区域，并请作家来为自己的书签名。"]},{"n":12,"ask":["Why does Caleb think that Mr. Davies might be able to help?\n________","凯莱布为什么觉得戴维斯先生或许能帮上忙？"],"ans":["He used to be an editor for a children’s book publisher, so he might know some local authors they can invite.","他曾在童书出版社当编辑，可能认识一些可以邀请来参加书展的本地作家。"]},{"n":13,"ask":["________ feels calm and confident about the success of the book fair","心里很踏实，相信书展能顺利办好。"],"ans":["C","凯莱布（C）。"],"dir":["Read the descriptions below. Write **C** next to the phrase if it describes Caleb. Write **T** if it describes Tanika.","阅读下列描述。形容凯莱布的在短语旁写 C，形容塔妮卡的写 T。"]},{"n":14,"ask":["________ suggests setting up areas with different themes","提议划分不同主题的展区。"],"ans":["T","塔妮卡（T）。"]},{"n":15,"ask":["________ offers to bring in ice skates and mittens for the winter display","主动提出带冰鞋和连指手套来布置冬季主题展区。"],"ans":["T","塔妮卡（T）。"]}]},{"id":"P116","title":["Book Fair Funds","书展筹到的钱怎么花"],"lead":["How will Tanika and Caleb decide to spend the proceeds from the book fair?","塔妮卡和凯莱布会怎样决定书展筹款的用途？"],"exercise":"P117","genre":"写实小说","family":"lit","parts":[{"n":1,"t":["Tanika and Caleb sat at a large round table in the library with their teacher, Mr. Rutledge, and one of the school librarians, Mrs. Angley. The adults were grinning widely at Tanika and Caleb, who smiled back uncertainly.","塔妮卡和凯莱布坐在图书馆的一张大圆桌旁，和他们一起坐着的是老师拉特利奇先生和学校图书管理员之一安格利女士。两位大人朝他们笑得合不拢嘴，塔妮卡和凯莱布也回以微笑，心里却有些摸不着头脑。"],"type":"paragraph"},{"n":2,"t":["“You are probably wondering why we asked you both to stay a few minutes after school today,” began Mr. Rutledge. “We have the totals from last weekend’s book fair, and we wanted to share them with you,” he continued. “Mrs. Angley, will you do the honors?” he asked, turning to the librarian.","“你们大概在想，今天放学后我们为什么要请你俩多留几分钟，”拉特利奇老师开口说，“上周末书展的收入总额已经算出来了，我们想告诉你们。”他转向图书管理员问：“安格利女士，能请你来宣布吗？”"],"type":"paragraph"},{"n":3,"t":["Mrs. Angley nodded. “This has been the most successful book fair in the nine years that Washington has held book fairs,” she said, passing out a sheet of paper that showed the results of previous book fairs. “Much of the credit goes to you two,” she added, gesturing to Tanika and Caleb, who still had expressions of awe on their faces. “Mr. Rutledge is also deserving of some credit since it was his idea to involve such creative and motivated students in planning the fair.”","安格利女士点点头。“乔治·华盛顿中学办了九年书展，这一届最成功。”她一边说，一边分发了一张列有往年书展业绩的表。“这主要是你们俩的功劳。”她朝塔妮卡和凯莱布示意，两人脸上还带着惊讶的表情。“拉特利奇老师也有功劳，因为是他想到让这么有创意、这么积极的学生来参与策划书展的。”"],"type":"paragraph"},{"n":4,"t":["“This is great news,” said Caleb. “We could see that people were enjoying themselves at the fair, but we had no idea how that would translate into profits.”","“这消息太棒了，”凯莱布说，“我们看得出大家在书展上很开心，可真不知道最后能赚到多少钱。”"],"type":"paragraph"},{"n":5,"t":["“The planning required a lot of work,” added Tanika, “but we had so much help. It really was a team effort.”","“策划确实花了不少工夫，”塔妮卡补充道，“不过我们得到了很多帮助。书展能办成，真是大家一起努力的结果。”"],"type":"paragraph"},{"n":6,"t":["“Because you both put so much energy and enthusiasm into this event,” said Mr. Rutledge, “we’ve decided that we could use your help in allocating the money we raised. The principal and the library staff have already set aside funds for items that are necessities. However, it has not yet been decided how the remaining money will be used. Do you have any ideas?”","“你们俩为这次活动投入了这么多精力和热情，”拉特利奇老师说，“所以我们想请你们也帮忙分配筹到的钱。校长和图书馆的工作人员已经留出一笔钱，用来购置必需品。剩下的钱还没决定怎么用。你们有什么点子吗？”"],"type":"paragraph"},{"n":7,"t":["Caleb and Tanika were quiet for a moment as they thought about the possibilities. Then, Caleb spoke up. “I agree with what Tanika said about the fair being a team effort. Students from every class contributed, and it would be nice if there was a way we could show our appreciation. Could they help decide which books will be added to the library’s collection?” he asked.","凯莱布和塔妮卡安静了一会儿，想了想可以怎么做。接着，凯莱布开口说：“我同意塔妮卡说的，书展靠的是大家一起努力。每个班都有同学出了力，要是能想个办法谢谢大家就好了。能不能请他们参与决定图书馆要添置哪些书？”"],"type":"paragraph"},{"n":8,"t":["“That’s an excellent idea,” agreed Mr. Rutledge.","“这个主意很好，”拉特利奇老师表示赞同。"],"type":"paragraph"},{"n":9,"t":["“If there’s any money leftover,” said Tanika, “do you think we could use it to bring authors and illustrators to the school more often? Everyone I talked to seemed to think that was the best part of the fair.”","“如果还有剩下的钱，”塔妮卡说，“能不能用来更经常地邀请作家和插画家到学校来？我聊过的每个人似乎都觉得，这是书展最精彩的部分。”"],"type":"paragraph"},{"n":10,"t":["Mrs. Angley nodded. “We’ve already put some money aside for that,” she said. “The school received several donations from parents during the fair, and the principal thinks that the money would be well spent just as you’ve suggested.”","安格利女士点点头。“我们已经为这件事留了一笔钱，”她说，“书展期间学校收到了几笔家长捐款，校长也觉得照你说的用，这些钱就花得值。”"],"type":"paragraph"},{"n":11,"t":["“There’s just one more thing,” said Mr. Rutledge, turning to Tanika and Caleb. “Would you consider helping to plan next year’s book fair? We could use your expertise.”","“还有最后一件事，”拉特利奇老师转向塔妮卡和凯莱布，“你们愿不愿意帮忙策划明年的书展？我们很需要你们的经验。”"],"type":"paragraph"},{"n":12,"t":["Tanika and Caleb exchanged glances. “With an invitation like that, how could we resist?” said Caleb.","塔妮卡和凯莱布互相看了一眼。“收到这样的邀请，我们怎么舍得拒绝呢？”凯莱布说。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Why do Caleb and Tanika think that the students should be able to vote on the books that will be added to the library?\n________","为什么凯莱布和塔妮卡认为应该让学生投票决定图书馆添置哪些书？"],"ans":["The fair was a team effort. Students from every class contributed.","书展是大家共同努力的成果，每个班都有同学出了力。"]},{"n":2,"ask":["Do you think that Caleb and Tanika work well together as a team? Why or why not?\n________","你认为凯莱布和塔妮卡合作得好吗？为什么？"],"ans":["Answers will vary.","答案因人而异。"]},{"n":3,"ask":["Why did Mr. Rutledge and Mrs. Angley decide to ask for Caleb and Tanika’s help?\n________","拉特利奇老师和安格利女士为什么决定请凯莱布和塔妮卡帮忙？"],"ans":["The book fair was the most successful fair the school had held. Tanika and Caleb deserved a lot of the credit.","这次书展是学校办过的最成功的一次，很大程度上要归功于塔妮卡和凯莱布。"]},{"n":4,"ask":["What is the setting for this story?\n________","故事发生在哪里？"],"ans":["the school library","学校图书馆。"]},{"n":5,"ask":["Do you think that Caleb and Tanika will choose to work together on future projects? Explain.\n________","你认为凯莱布和塔妮卡以后还会选择一起做项目吗？请说明理由。"],"ans":["Answers will vary.","答案因人而异。"]},{"n":6,"ask":["Check the line beside the word or words that best describe what type of selection this is.\n\n- ________ a tall tale\n- ________ realistic fiction\n- ________ historical fiction","在最能概括本文体裁的一项旁打勾。\n夸张故事\n写实小说\n历史小说"],"ans":["✓ realistic fiction","写实小说。"]},{"n":7,"ask":["In paragraph 6, what does *allocating* mean?\n________","第6段的 allocating 是什么意思？"],"ans":["distributing; dividing up","分配、划分。"]},{"n":8,"ask":["If you were in Caleb or Tanika’s place, how would you choose to spend the money?\n________","如果你是凯莱布或塔妮卡，你会选择怎样花这笔钱？"],"ans":["Answers will vary.","答案因人而异。"]}]},{"id":"P118","title":["A Writer’s Life","一位作家的写作生涯"],"lead":["Who are your favorite authors? Do you know how they became writers?","你最喜欢哪些作家？你知道他们是怎样成为作家的吗？"],"exercise":"P119","genre":"人物传记","family":"info","parts":[{"n":1,"t":["Louis Sachar is one of the most well-known writers of children’s books today. He is the author of more than 20 books that are loved by children, parents, teachers, and critics alike. You might recognize Sachar’s name from the series of *Wayside School* books or *Marvin Redpost* books. You might also know him as the author of the Newbery Award-winning book *Holes*.","路易斯·萨奇尔是当今最知名的童书作家之一。他创作了20多部作品，深受孩子、家长、老师和评论家的喜爱。你可能从《歪歪路小学》系列或《马文·雷德波斯特》系列知道他的名字。你也可能知道，他是纽伯瑞奖获奖作品《洞》的作者。"],"type":"paragraph"},{"n":2,"t":["As successful as Louis Sachar is at writing funny, touching books that kids can relate to, he didn’t always know he wanted to be a writer. Sachar remembers enjoying his writing assignments in school, but writing wasn’t something he did on his own. When he was in college, he studied economics, and even briefly studied Russian language and literature.","路易斯·萨奇尔如今擅长写幽默、感人又能引起孩子共鸣的书，却并非一直都知道自己想当作家。他记得上学时很喜欢完成学校布置的写作作业，但平时并不会主动写东西。上大学时，他学的是经济学，还短暂学过俄语和俄国文学。"],"type":"paragraph"},{"n":3,"t":["Sachar spent time as a teacher’s aide when he was in college because he thought it would be an easy way to earn class credit. Although the work was not as easy as he thought it would be, Sachar found that he really enjoyed working with young people. In fact, Hillside Elementary, where Sachar worked as an aide, eventually became the inspiration for his popular *Wa
