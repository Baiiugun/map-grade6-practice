 those pictures will probably be pretty valuable,” he joked."}]},{"id":"R6-P032-B5-01","skill":"B5","pages":["P032"],"src":null,"stem":["To photograph a fast-running animal when a fast shutter lets in too little light, what adjustment follows the passage?","要拍一只飞奔的动物，快门速度快、进光却太少。根据本文，该怎么调节？"],"o":[["Leave the shutter open for a very long time and narrow the aperture.","让快门长时间开启，把光圈收小。"],["Close the aperture completely.","把光圈完全关闭。"],["Remove all light-sensitive parts of the camera.","取出相机里所有感光部件。"],["Keep the shutter fast and open the aperture wider.","保持快门速度，把光圈开大。"]],"key":3,"why":["A fast shutter keeps the running animal from blurring. A wider aperture makes up for the reduced light.","先用快门速度避免运动模糊，再加大光圈补足光线。两项设置需要配合，不能只看其中一个条件。"],"ev":[{"p":"P032","n":4,"quote":"A quick shutter speed is also needed when you want to capture something that is moving."},{"p":"P032","n":7,"quote":"To compensate, you need to open the aperture wider so that the proper amount of light reaches the film."}]},{"id":"R6-P032-C1-01","skill":"C1","pages":["P032"],"src":4,"stem":["In paragraph 7, “compensate” most nearly means:","第 7 段的 compensate 最接近哪个意思？"],"o":[["Cause the subject to move faster.","让拍摄对象动得更快。"],["Make a copy of a photograph.","复制一张照片。"],["Make up for a shortage or disadvantage.","弥补不足或不利之处。"],["Ignore a problem completely.","完全忽视一个问题。"]],"key":2,"why":["The fast shutter lets in too little light, so opening the aperture wider makes up for the shortage. That is what compensate means here.","快门快导致进光不足，开大光圈是弥补不足。compensate 在这里不是复制或加速。"],"ev":[{"p":"P032","n":7,"quote":"For instance, if you want to photograph a fast moving object, you need a fast shutter speed, but that may not let in enough light."},{"p":"P032","n":7,"quote":"To compensate, you need to open the aperture wider so that the proper amount of light reaches the film."}]},{"id":"R6-P032-B2-01","skill":"B2","pages":["P032"],"src":8,"stem":["How is a digital camera different from a traditional film camera in the passage?","按照文中的说法，数码相机跟传统胶片相机有什么不同？"],"o":[["It must keep its shutter permanently open.","它的快门必须一直开着。"],["It uses a light-sensitive electrical device instead of chemical film.","它用感光电子元件代替化学胶片。"],["It never uses light to form an image.","它成像时从不需要光。"],["It works only when a photograph is printed first.","只有先把照片打印出来，它才能工作。"]],"key":1,"why":["Paragraph 2 contrasts the light-sensitive electronic device of a digital camera with the chemical film of a traditional camera. Both use light to form an image.","第2段用 Instead of 对比记录图像的介质；两者都仍然需要光。"],"ev":[{"p":"P032","n":2,"quote":"Instead of chemical film, a digital camera contains a light-sensitive electrical device that records the image."}]},{"id":"R6-P034-F2-01","skill":"F2","pages":["P034"],"src":9,"stem":["Which description best fits Dante during the interview?","哪项最适合描述采访中的但丁？"],"o":[["Careless about the photographer’s work.","对摄影师的工作漫不经心。"],["Certain that he already knows every answer.","确信自己已经知道所有答案。"],["Curious, prepared, and polite.","好奇、准备充分、有礼貌。"],["Hostile and unwilling to listen.","态度不友好，也不愿倾听。"]],"key":2,"why":["Dante thanks Salinas, asks permission to record, and arrives with specific questions. His actions show courtesy, preparation, and curiosity.","Dante 先致谢、征求录音同意并提出具体问题，支持有礼貌、认真准备和好奇的判断。"],"ev":[{"p":"P034","n":1,"quote":"“Thanks for taking the time to meet with me, Mr."},{"p":"P034","n":3,"quote":"“Would it be all right with you if I recorded our conversation?”"}]},{"id":"R6-P034-B3-01","skill":"B3","pages":["P034"],"src":8,"stem":["What is most likely after Dante’s interview?","但丁采访之后最可能怎样？"],"o":[["He will become Mr. Salinas’s college teacher.","他会成为萨利纳斯先生的大学老师。"],["He will refuse to learn anything more about photography.","他会拒绝再学任何有关摄影的知识。"],["He will decide photography has no value.","他会认为摄影毫无价值。"],["He will remain interested in becoming a photographer.","他仍会有兴趣成为摄影师。"]],"key":3,"why":["At the end, Dante says the interview inspired him and that he wants to become a photographer. It is reasonable to expect him to stay interested.","结尾 Dante 直接说想成为摄影师并受到鼓舞，支持继续追求这一兴趣，不能推出他已经成为专业人士。"],"ev":[{"p":"P034","n":13,"quote":"I’d like to be a photographer one day myself."},{"p":"P034","n":13,"quote":"Your comments were inspiring."}]},{"id":"R6-P034-D1-01","skill":"D1","pages":["P034"],"src":null,"stem":["How is most of “Talking Photos” organized?","《聊聊摄影》的大部分内容是怎样组织的？"],"o":[["As a recipe with numbered cooking steps.","按编号步骤写成一份食谱。"],["As a debate between two authors who never meet.","两位从未见面的作者之间进行辩论。"],["As an interview in which Dante’s questions are followed by Salinas’s answers.","以访谈呈现，但丁提出问题，萨利纳斯作答。"],["As a chronological list of camera parts.","按时间顺序列出相机部件。"]],"key":2,"why":["The initials DC and ES alternate as Dante asks questions and Salinas answers them about his career, influences, and rewards.","DC 和 ES 的交替发言围绕职业经历、影响和收获展开。识别问答结构可以追踪每段在回答哪个问题。"],"ev":[{"p":"P034","n":5,"quote":"Dante Carter: When did you first know that you wanted to be a photographer?"},{"p":"P034","n":6,"quote":"Edward Salinas: It wasn’t until I had already graduated from college."},{"p":"P034","n":11,"quote":"DC: What do you find most rewarding about your job?"}]},{"id":"R6-P036-A3-01","skill":"A3","pages":["P036"],"src":2,"stem":["Which sentence best summarizes paragraph 7?","哪句话最能概括第 7 段？"],"o":[["Adams photographed only musical performances.","亚当斯只拍音乐表演。"],["Adams believed wild places should never be recorded.","亚当斯认为绝不该拍摄荒野。"],["Adams stopped taking nature photographs when he joined the Sierra Club.","亚当斯加入塞拉俱乐部后就不再拍自然风光。"],["Adams used photography to support conservation and record wild places.","亚当斯用摄影支持自然保护，也记录了荒野。"]],"key":3,"why":["Paragraph 7 links Adams’s environmental work to his photographs, which publicized conservation issues and recorded wild areas.","段落把环保行动、宣传以及保存自然影像联系起来。具体公园名称是支持细节，不是完整概括。"],"ev":[{"p":"P036","n":7,"quote":"Through his photographs and the time that he spent in nature, Adams became an avid environmentalist."},{"p":"P036","n":7,"quote":"His photographs serve as a record of wild areas of the American West—such as Sequoia, Mount Rainier, and Glacier National Parks—before humans had done much to disturb them."}]},{"id":"R6-P036-C5-01","skill":"C5","pages":["P036"],"src":9,"stem":["What does “may not ring a bell with you” mean?","may not ring a bell with you 是什么意思？"],"o":[["May not ask you to answer a telephone.","可能不会请你接电话。"],["May not make a loud musical noise.","可能不会发出很响的乐音。"],["May not allow you to take a photograph.","可能不让你拍照。"],["May not sound familiar to you.","你听起来可能不觉得耳熟。"]],"key":3,"why":["The opening contrasts a name the reader might not recognize with photographs the reader might know. Ring a bell means sound familiar.","这里把名字是否熟悉与照片是否认得作对照，ring a bell 是“听起来熟悉”的习语。"],"ev":[{"p":"P036","n":1,"quote":"The name Ansel Adams may not ring a bell with you, but there is a good chance that you would recognize his photographs."},{"p":"P036","n":1,"quote":"The name Ansel Adams may not ring a bell with you, but there is a good chance that you would recognize his photographs."}]},{"id":"R6-P036-E3-01","skill":"E3","pages":["P036"],"src":null,"stem":["Which word best describes the author’s tone toward Adams’s work?","哪个词最能描述作者谈论亚当斯作品时的语气？"],"o":[["Admiring.","赞赏的。"],["Angry.","愤怒的。"],["Dismissive.","轻视的。"],["Mocking.","嘲弄的。"]],"key":0,"why":["Words such as beautiful, famous, and amazing, along with the reference to joy and wonder, show the author’s admiration.","beautiful、famous、amazing 以及 joy and wonder 等词构成持续赞赏的语气，不是冷漠或嘲笑。"],"ev":[{"p":"P036","n":1,"quote":"Adams’s work includes some of the most beautiful and famous black-and-white nature photographs ever taken."},{"p":"P036","n":5,"quote":"Although Adams worked in black and white, there is an amazing amount of variety in tone."},{"p":"P036","n":8,"quote":"Ansel Adams died in 1984, but his photographs will continue to bring the joy and wonder of the natural world to people for many years to come."}]},{"id":"R6-P038-A1-01","skill":"A1","pages":["P038"],"src":1,"stem":["What is the main idea of this selection?","本文的主旨是什么？"],"o":[["Margaret Bourke-White documented major events around the world and broke new ground for women.","玛格丽特·伯克-怀特记录了世界各地的重大事件，也为女性开辟了新道路。"],["Bourke-White photographed only one steel mill.","伯克-怀特只拍过一家钢铁厂。"],["Bourke-White avoided traveling and photographing danger.","伯克-怀特尽量不出远门，也不去拍摄危险场面。"],["Bourke-White spent her entire career studying reptiles.","伯克-怀特一辈子都在研究爬行动物。"]],"key":0,"why":["The mills, wars, travels, and professional firsts illustrate Bourke-White’s larger contribution as a photojournalist.","全文的钢厂、战争、国际旅行和职业突破都服务于这位摄影记者的贡献；只说一个地点或原先专业太窄。"],"ev":[{"p":"P038","n":1,"quote":"She was present for many monumental events of the 20th century, and she recorded them with courage and sensitivity."},{"p":"P038","n":5,"quote":"As the first female war correspondent of World War II, Bourke-White faced danger on a regular basis."},{"p":"P038","n":7,"quote":"Her pictures are a permanent record of both her life and the world during the 20th century."}]},{"id":"R6-P038-F1-01","skill":"F1","pages":["P038"],"src":3,"stem":["Why was her job unusual for a woman in the period described?","在文中所说的年代，她的工作为什么对女性来说不同寻常？"],"o":[["No women were allowed to live in cities.","当时女性一律不准在城市居住。"],["The story takes place before cameras were invented.","事情发生在相机发明之前。"],["Women were commonly expected to work in the home rather than as war correspondents.","人们通常希望女性在家操持家务，而很少想到她们会当战地记者。"],["Women had not yet learned to read photographs.","女性那时还没学会看照片。"]],"key":2,"why":["Paragraph 5 contrasts Bourke-White’s work as a war correspondent with the expectation that women would mainly work at home.","第5段交代当时的社会背景，对照她进入战地工作的突破。这是时代习俗，不是说所有女性都绝对不能工作。"],"ev":[{"p":"P038","n":5,"quote":"This was at a time when it was still customary for women to work mostly in the home, taking care of a family and a household."}]},{"id":"R6-P038-F6-01","skill":"F6","pages":["P038"],"src":null,"stem":["What does calling Bourke-White “the eyes and ears of the world” suggest?","称伯克-怀特是“全世界的眼睛和耳朵”，是什么意思？"],"o":[["She literally had more eyes and ears than other people.","她真的比别人长了更多眼睛和耳朵。"],["She photographed only people’s faces.","她只拍人的脸。"],["She stopped recording world events.","她不再记录世界上的事件。"],["Her reporting helped people learn about places and events they could not experience themselves.","她的报道让人们了解自己无法亲身接触的地方和事件。"]],"key":3,"why":["The metaphor suggests that she observed and recorded events on behalf of people who could not be there themselves.","这个比喻强调记者替读者观察和记录世界。紧接着的 most Americans had never visited 说明这种传递信息的作用。"],"ev":[{"p":"P038","n":7,"quote":"She was the eyes and ears of the world in places most Americans had never visited and never would."}]},{"id":"R6-P040-E2-01","skill":"E2","pages":["P040"],"src":2,"stem":["What problem do Ari and his mother find with the television show?","阿里和妈妈发现那个电视节目有什么问题？"],"o":[["It presented only the appealing side of owning exotic pets.","只讲了养异宠吸引人的一面。"],["It explained too many opposing views in equal detail.","同样详细地解释了太多相反的观点。"],["It proved that all exotic animals are easy to care for.","证明所有外来动物都容易照料。"],["It showed only ordinary dogs and cats.","只展示了普通的狗和猫。"]],"key":0,"why":["Ari and his mother learn that exotic pets may be abandoned or mistreated. The show had only presented the appealing side.","他们通过其他资料发现遗弃和虐待问题，认为节目只呈现一面。评价的是信息是否完整，而非证明所有电视节目都不可靠。"],"ev":[{"p":"P040","n":9,"quote":"“They didn’t talk about any of this on the show I watched,” said Ari, looking confused."},{"p":"P040","n":10,"quote":"“It sounds like the show you saw only presented one side of the story."}]},{"id":"R6-P040-F2-01","skill":"F2","pages":["P040"],"src":3,"stem":["Why does Mrs. Stein call Ari mature and responsible?","斯坦太太为什么说阿里成熟、负责任？"],"o":[["He insists on buying a tiger without doing research.","他没查资料，坚持要买老虎。"],["He wants a pet only because it is dangerous.","他只是因为宠物危险才想养它。"],["He refuses to listen to any concerns.","他拒绝听任何担忧。"],["He changes his decision after considering the animals’ welfare and more information.","了解更多情况并考虑动物的福祉后，他改变了决定。"]],"key":3,"why":["After learning more, Ari changes his mind and wants the show to present both sides. He is thinking about the consequences for the animals.","Ari 补充研究后改变主意，还希望节目说明两面，表现出考虑后果和动物福祉的责任感。"],"ev":[{"p":"P040","n":11,"quote":"Now that we’ve done some more research, I’ve changed my mind about owning an exotic pet."},{"p":"P040","n":12,"quote":"“You’ve made a really mature decision."}]},{"id":"R6-P040-A4-01","skill":"A4","pages":["P040"],"src":null,"stem":["Which theme is best supported by the story?","哪项主题最符合故事？"],"o":[["Research is unnecessary when a television program is exciting.","电视节目只要精彩，就不用再查资料。"],["Responsible decisions require considering more than an attractive first impression.","负责任的决定需要考虑诱人的第一印象之外的信息。"],["Parents should never discuss decisions with children.","家长绝不该和孩子商量决定。"],["The most unusual choice is always the best choice.","最与众不同的选择总是最好的。"]],"key":1,"why":["Ari looks beyond the program’s attractive portrayal, checks other sources, and makes a more informed decision.","Ari 从节目吸引转向查证问题，最后作出更成熟的选择，体现全面了解信息再决定的主题。"],"ev":[{"p":"P040","n":3,"quote":"“I was watching this amazing animal show,” he said."},{"p":"P040","n":11,"quote":"They should have explained both sides of the story.”"}]},{"id":"R6-P042-F6-01","skill":"F6","pages":["P042"],"src":2,"stem":["Why does the author compare environmental changes to falling dominoes?","作者为什么拿倒下的多米诺骨牌来比喻环境变化？"],"o":[["Every animal lives inside a wooden game piece.","每只动物都住在一块木制的骨牌里。"],["Scientists can always predict every environmental result.","科学家总能预测环境变化的一切后果。"],["The environment remains unchanged when one species is added.","加入一种物种时，环境仍保持原样。"],["A small change can trigger a connected series of effects.","一个小变化就能引发一连串相互关联的变化。"]],"key":3,"why":["The dominoes show how one change can trigger another. The last sentence applies that chain reaction to the environment.","多米诺强调连锁影响。最后一句点明，一个变化会引发难以完全预测的一系列变化。"],"ev":[{"p":"P042","n":7,"quote":"One small change can set off a whole series of changes that not even scientists can predict."}]},{"id":"R6-P042-C1-01","skill":"C1","pages":["P042"],"src":8,"stem":["In this passage, “exotic” most nearly means:","文中的 exotic 最接近哪个意思？"],"o":[["Native to every local environment.","在每个当地环境中都是原生的。"],["Unusual and coming from another part of the world.","少见的，来自世界其他地方的。"],["Artificial rather than alive.","人工制作的，没有生命。"],["Always domesticated and harmless.","总是经过驯养且无害的。"]],"key":1,"why":["The passage connects exotic pets with nonnative species and their original tropical habitats. Here exotic describes something unusual that comes from another part of the world.","文中把外来宠物与 nonnative species、原生热带地区联系起来，说明来自其他地区而非本地常见。"],"ev":[{"p":"P042","n":1,"quote":"But if you happen to live in southern Florida, there is a chance that you could run into a number of nonnative species that have settled in your hometown."},{"p":"P042","n":4,"quote":"But the climate in southern Florida is wet and warm—not unlike the tropical areas where many of the animals are naturally found."}]},{"id":"R6-P042-B2-01","skill":"B2","pages":["P042"],"src":5,"stem":["Why can many released exotic pets survive in southern Florida?","为什么许多被放到野外的异宠能在佛罗里达州南部存活？"],"o":[["Its warm, wet climate resembles their natural tropical habitats.","当地温暖湿润的气候和它们原有的热带栖息地相似。"],["Every released pet receives food from a keeper.","每只被放生的宠物都有人饲喂。"],["Its climate is permanently frozen.","那里的气候终年冰冻。"],["There are no other animals living in Florida.","佛罗里达州没有别的动物。"]],"key":0,"why":["Paragraph 4 explains that southern Florida’s warm, wet climate resembles the animals’ original tropical habitats.","第4段用 wet and warm 与原生热带环境相似建立原因；不能自行补出总有人喂食。"],"ev":[{"p":"P042","n":4,"quote":"But the climate in southern Florida is wet and warm—not unlike the tropical areas where many of the animals are naturally found."}]},{"id":"R6-P042-H3-01","skill":"H3","pages":["P042","P044"],"src":null,"stem":["Which detail from P044 best supports the idea in P042 that nonnative species can upset an ecosystem’s balance?","《大沼泽地不朽的美》（P044）的哪个细节最能支持本文中的观点，即外来物种可能打破生态系统的平衡？"],"o":[["Introduced melaleuca trees kept growing and crowded out native species.","引入的白千层不断生长，挤占了本地物种的生存空间。"],["The Everglades contains forests and grasslands.","大沼泽地有森林和草原。"],["Crocodiles and alligators can coexist there.","鳄鱼和短吻鳄可以在那里共存。"],["The park was founded in 1947.","公园于 1947 年建立。"]],"key":0,"why":["In paragraph 6 of P044, introduced melaleuca trees crowd out native species. That is a concrete example of the ecological disruption described in P042.","P042 讨论外来物种对环境连锁关系的影响；P044 第6段的白千层挤占原生物种，是另一篇中可验证这一机制的实例。"],"ev":[{"p":"P042","n":6,"quote":"But even animals like vervet monkeys or Cuban tree frogs, which seem harmless, can change the delicate balance of the environment."},{"p":"P044","n":6,"quote":"The wood turned out to be difficult to harvest, so the trees just continued to grow, crowding out other species that are indigenous to the Everglades."}]},{"id":"R6-P044-A2-01","skill":"A2","pages":["P044"],"src":6,"stem":["Which claim does the author most want readers to accept?","作者最想让读者接受哪项主张？"],"o":[["The Everglades should be drained for more development.","应该把大沼泽地的水排掉，多开发些土地。"],["Protecting only one species makes the ecosystem unimportant.","只保护一种生物，就会让生态系统变得不重要。"],["The Everglades are worth saving and preserving.","大沼泽地值得挽救和保护。"],["All species in the Everglades should be replaced with foreign trees.","应该用外来的树木替换大沼泽地的全部物种。"]],"key":2,"why":["The author explicitly calls for protecting the Everglades in the last paragraph. Its diversity, the threats it faces, and the efforts to preserve it support that position.","结尾明确表态，前文的多样性、威胁和保护措施都是支持理由。中心论点应是作者希望读者接受的判断。"],"ev":[{"p":"P044","n":8,"quote":"Without a doubt, the Everglades are worth saving and preserving."}]},{"id":"R6-P044-B2-01","skill":"B2","pages":["P044"],"src":9,"stem":["Why were melaleuca trees originally planted in the Everglades?","当初为什么在大沼泽地种白千层？"],"o":[["To make the area colder and wetter.","让当地变得更冷、更湿。"],["To consume water and help dry land for development.","让树吸水，帮助土地变干以便开发。"],["To stop every human activity in the region.","让当地所有人类活动停止。"],["To feed alligators during the winter.","在冬季给短吻鳄提供食物。"]],"key":1,"why":["The trees were planted to absorb water and dry the land for development. Crowding out native species was a consequence that came later.","第6段交代引入树木的原先目的；后来挤占本地物种是结果，不能与最初意图混淆。"],"ev":[{"p":"P044","n":6,"quote":"The tiny seeds of the melaleuca tree were sprinkled from salt shakers into the Everglades from low-flying airplanes because melaleuca trees consume a great deal of water."},{"p":"P044","n":6,"quote":"People hoped that the trees would dry up the land and make the Everglades suitable for development."}]},{"id":"R6-P044-B5-01","skill":"B5","pages":["P044"],"src":null,"stem":["Which action best follows the conservation approach described in paragraph 7?","哪项做法最符合第 7 段描述的保护方法？"],"o":[["Plant more water-consuming nonnative trees.","多栽一些耗水的外来树木。"],["Restore unused farmland to natural wetland.","把闲置农田恢复为天然湿地。"],["Increase fertilizer runoff into the park.","让更多含化肥的径流流入公园。"],["Drain more marshland with canals.","开挖运河，排干更多沼泽地。"]],"key":1,"why":["Paragraph 7 describes buying farmland and returning it to its natural wetland state. Restoring unused farmland follows that same approach.","文中的保护方案包括购买农地并恢复自然湿地。把这一方案应用到新情境，要选择有利于恢复生态的行动。"],"ev":[{"p":"P044","n":7,"quote":"In 1996, an act was passed allowing the government to purchase farmland, which could then be returned to natural swampy marshland."}]},{"id":"R6-P046-A1-01","skill":"A1","pages":["P046"],"src":2,"stem":["Which statement best expresses the main idea?","哪项最能概括文章主旨？"],"o":[["Audubon spent his whole life farming near Philadelphia.","奥杜邦一辈子都在费城附近种地。"],["The Audubon Society mainly teaches people to hunt birds.","奥杜邦协会主要教人猎鸟。"],["American publishers immediately accepted every painting Audubon made.","美国的出版商马上接受了奥杜邦的每一幅画。"],["Audubon studied and painted birds, creating a remarkable catalog of American species.","奥杜邦研究并描绘鸟类，编成了一部出色的美国鸟类图录。"]],"key":3,"why":["The passage focuses on Audubon’s study and paintings of birds, the catalog he created, and its lasting influence.","全文围绕 Audubon 研究鸟类、绘制鸟类图谱及其影响展开。出生地和出版地点是细节，不能概括整篇。"],"ev":[{"p":"P046","n":3,"quote":"Over the years, Audubon spent more and more time creating realistic drawings and paintings of birds."},{"p":"P046","n":5,"quote":"It contained 435 hand-colored plates that showed 1,065 life-sized birds."}]},{"id":"R6-P046-F5-01","skill":"F5","pages":["P046"],"src":1,"stem":["What type of text is this selection?","这是一篇什么样的文章？"],"o":[["A biography of a naturalist and artist","一位博物学家兼艺术家的传记"],["A fictional diary written by a bird","一只鸟写的虚构日记"],["A myth explaining how birds first appeared","解释鸟最早是怎样出现的神话"],["A set of instructions for building a birdhouse","一套搭建鸟屋的操作说明"]],"key":0,"why":["The passage is a biography, tracing Audubon’s life, research, artwork, and influence.","文章按人物经历介绍 Audubon 的出生、研究、作品和影响，属于传记。"],"ev":[{"p":"P046","n":2,"quote":"Audubon was born in the Caribbean country of Haiti in 1785."},{"p":"P046","n":6,"quote":"It honored a man whose lifework had been to study birds and to begin to educate the public about the importance of protecting them and their environment."}]},{"id":"R6-P046-B2-01","skill":"B2","pages":["P046"],"src":4,"stem":["Why did Audubon tie yarn to the birds’ legs?","奥杜邦为什么把毛线系在鸟腿上？"],"o":[["To teach the birds to build different nests","教鸟建造各不相同的巢"],["To keep every bird from flying away","让每只鸟都飞不走"],["To recognize them and find out whether they returned to the same nesting places","辨认这些鸟，弄清它们是否回到同样的地方筑巢"],["To measure the colors in their feathers","测量鸟的羽毛颜色"]],"key":2,"why":["The yarn let Audubon identify birds he had seen before. That allowed him to tell whether the same birds had returned to their nesting sites.","给鸟腿系线是做标记；再次认出同一只鸟，才能判断它是否返回原来的筑巢地。"],"ev":[{"p":"P046","n":2,"quote":"By marking the birds in this way, Audubon was able to conclude that the birds nested in the same places every year."}]},{"id":"R6-P048-F6-01","skill":"F6","pages":["P048"],"src":1,"stem":["What does “We don’t want to be eaten alive out there” suggest?","“我们可不想在外面被虫子活活吃掉”这句话是什么意思？"],"o":[["They expect large animals to eat them.","他们以为会被大型动物吃掉。"],["They plan to feed insects during the walk.","他们打算在路上喂昆虫。"],["They want to avoid getting many insect bites.","他们想避免被虫子叮很多下。"],["They think the birds will steal their food.","他们认为鸟会把他们的食物偷走。"]],"key":2,"why":["The remark is an exaggeration. The bug spray tells us they want to avoid getting bitten by insects.","这是夸张表达。前文提到 bug spray，说明他们担心的是蚊虫叮咬，而不是被真的吃掉。"],"ev":[{"p":"P048","n":2,"quote":"“Should I grab some bug spray?”"},{"p":"P048","n":3,"quote":"“We don’t want to be eaten alive out there.”"}]},{"id":"R6-P048-C2-01","skill":"C2","pages":["P048"],"src":8,"stem":["Which sentence uses “bill” with the same meaning as in paragraph 13?","哪句话中 bill 的意思与第 13 段相同？"],"o":[["Please pay the restaurant bill.","Please pay the restaurant bill.（请付餐费。）"],["The duck’s bill helped it scoop food from the water.","The duck’s bill helped it scoop food from the water.（鸭子用喙从水中舀起食物。）"],["He put a dollar bill in his pocket.","He put a dollar bill in his pocket.（他把一张一美元纸币放进口袋。）"],["The lawmaker proposed a new bill.","The lawmaker proposed a new bill.（那位议员提出了一项新法案。）"]],"key":1,"why":["Paragraph 13 lists a bird’s bill with its body, tail, and wings. Bill there means beak, the same meaning as in the sentence about the duck.","第13段把 bill 与鸟的身体、尾巴、翅膀并列，因此这里是“鸟喙”。其他选项分别是账单、法案、纸币。"],"ev":[{"p":"P048","n":13,"quote":"“The shape of a bird’s body, its tail, its wings, and its bill can all be excellent clues."}]},{"id":"R6-P048-B2-01","skill":"B2","pages":["P048"],"src":5,"stem":["Why may a bird’s shape be more useful than its color for identification?","为什么鸟的外形可能比颜色更有助于辨认？"],"o":[["A bird changes its bill shape every season.","鸟的喙每个季节都会变形。"],["All birds have exactly the same shape.","所有鸟的外形都完全一样。"],["Color is visible only in field guides.","只有在野外图鉴上才能看见颜色。"],["Its shape stays more constant, while its apparent color can change.","外形更稳定，而眼睛看到的颜色可能会变。"]],"key":3,"why":["Light, sex, and season can affect the color a birder sees. A bird’s shape is more consistent and can be a better clue.","第11段说明光线、性别和季节都会影响颜色；第12—13段转向较稳定的身体形状，因此形状有时更可靠。"],"ev":[{"p":"P048","n":11,"quote":"Color is not always a reliable identifier because it can change in different types of light."},{"p":"P048","n":12,"quote":"“It seems like that would remain constant.”"}]},{"id":"R6-P050-B5-01","skill":"B5","pages":["P050"],"src":6,"stem":["Using the recipe in the passage, how much water goes with one-quarter cup of sugar?","按文中的配方，四分之一杯糖要配多少水？"],"o":[["One-quarter cup","四分之一杯"],["One cup","一杯"],["Four cups","四杯"],["One-half cup","半杯"]],"key":1,"why":["The mixture uses four parts water to one part sugar. Four times one-quarter cup is one cup of water.","原文比例为四份水配一份糖。糖是1/4杯，水就是4×1/4＝1杯。"],"ev":[{"p":"P050","n":10,"quote":"We just fill it with a mixture of four parts water to one part sugar."}]},{"id":"R6-P050-F3-01","skill":"F3","pages":["P050"],"src":4,"stem":["Why do Olivia and Jaya research hummingbirds before planting?","奥利维娅和贾娅为什么在种花前研究蜂鸟？"],"o":[["They want to choose plants that will attract hummingbirds.","她们想挑选能吸引蜂鸟的植物。"],["They must write a report about ocean animals.","她们必须写一篇关于海洋动物的报告。"],["They want to keep every bird away from the garden.","她们想让所有的鸟都离花园远远的。"],["They need to train birds for a race.","她们得训练鸟参加比赛。"]],"key":0,"why":["The girls want to know which flowers and food will attract hummingbirds before they begin planting the garden.","开头交代她们有一块蜂鸟花园，想先充分了解蜂鸟；后文查花色、花形和食物，都服务于吸引蜂鸟这个目标。"],"ev":[{"p":"P050","n":1,"quote":"Jaya’s mom had allotted a portion of her garden for the girls to use as a hummingbird garden that summer."},{"p":"P050","n":11,"quote":"“I’m going to start a list of plants that hummingbirds like,” said Olivia."}]},{"id":"R6-P050-F4-01","skill":"F4","pages":["P050"],"src":8,"stem":["Who tells the story?","是谁在讲这个故事？"],"o":[["Olivia speaking about herself throughout","一直在讲自己故事的奥利维娅"],["A third-person narrator who describes the girls and their conversation","描写两个女孩和她们对话的第三人称叙述者"],["Jaya writing a first-person diary","以第一人称写日记的贾娅"],["A hummingbird explaining its own thoughts","讲述自己想法的一只蜂鸟"]],"key":1,"why":["The narrator refers to the girls by name or as they. First-person pronouns appear only when characters speak.","叙述部分用 Olivia、Jaya、they 描写人物；人物说话时的 I 不代表整篇改为第一人称。"],"ev":[{"p":"P050","n":1,"quote":"Olivia and Jaya sat at a table in the library with books spread out around them."}]},{"id":"R6-P052-A1-01","skill":"A1","pages":["P052"],"src":5,"stem":["Which statement best states the main idea?","哪项最能概括文章主旨？"],"o":[["Each spring, huge numbers of sandhill cranes stop along the Platte River during migration.","每年春天，大批沙丘鹤在迁徙途中停留在普拉特河沿岸。"],["The Platte River was created by migrating birds.","普拉特河是迁徙的鸟群造出来的。"],["All cranes spend the entire year in Nebraska.","所有鹤都全年生活在内布拉斯加州。"],["The passage mainly explains how to grow corn.","本文主要说明如何种植玉米。"]],"key":0,"why":["The opening describes the large spring stopover, and the rest explains the cranes' features, route, and reasons for stopping at the river. An isolated detail about the birds cannot capture the whole passage.","首段提出每年春季的大规模停歇，后面介绍鹤的特征、迁徙路线及河流适用条件。出生或单个外形细节不能概括全文。"],"ev":[{"p":"P052","n":1,"quote":"For six weeks each spring, nearly 500,000 sandhill cranes stop along the Platte River in Nebraska as they make their annual northern migration."}]},{"id":"R6-P052-E2-01","skill":"E2","pages":["P052"],"src":7,"stem":["Which statement expresses an opinion rather than a checkable fact?","哪项表达的是观点，而非可查证的事实？"],"o":[["Sandhill cranes stop along the Platte River.","沙丘鹤在普拉特河沿岸停留。"],["Some sandhill cranes spend the summer in Canada.","有些沙丘鹤在加拿大度过夏季。"],["There is nothing as beautiful as a sandhill crane taking flight.","没有什么比沙丘鹤起飞更美。"],["Sandhill cranes eat plants and animals.","沙丘鹤吃植物和动物。"]],"key":2,"why":["The claim that nothing is more beautiful expresses a personal judgment. Diet, location, and migration routes can be checked.","“没有什么比它更美”是审美判断，读者可能不同意；食物、地点和迁徙路线则可以查证。原书此题为事实与观点判断，这里改为单选。"],"ev":[{"p":"P052","n":3,"quote":"With long legs and a long neck extending out from their bodies, cranes create a graceful sight as they glide across the sky."}]},{"id":"R6-P052-B1-01","skill":"B1","pages":["P052"],"src":1,"stem":["Why are sandhill cranes classified as omnivorous?","为什么沙丘鹤被归为杂食动物？"],"o":[["They eat both plants and animals.","它们既吃植物也吃动物。"],["They have red feathers on their heads.","它们头上有红色的羽毛。"],["They live only in deep water.","它们只生活在深水中。"],["They migrate only in winter.","它们只在冬天迁徙。"]],"key":0,"why":["Paragraph 4 uses 'because' to explain why the cranes are omnivorous: they eat both plants and animals.","第4段直接用 because 解释杂食的分类依据：同时吃植物和动物。"],"ev":[{"p":"P052","n":4,"quote":"Because they eat both plants and animals, cranes are considered omnivorous."}]},{"id":"R6-P054-B4-01","skill":"B4","pages":["P054"],"src":2,"stem":["Which detail best supports the idea that the students have prepared enthusiastically for the trip?","哪个细节最能说明同学们热情地为这次参观做了准备？"],"o":[["Ty asks how many museums they can visit.","泰问他们能参观多少家博物馆。"],["Emma turns around to look at Calvin.","艾玛转过身看卡尔文。"],["The teacher stands at the front of the room.","老师站在教室前面。"],["Students researched museums and can explain specific exhibits they want to see.","同学们查了博物馆的资料，还能具体说明自己想看的展品。"]],"key":3,"why":["Several students describe specific exhibits, and their teacher praises them for doing their research. These details show that they prepared eagerly for the trip.","多个学生能说出具体展品，老师也明确说 You’ve done your research，这些证据最能支持“认真准备、期待参观”的推断。"],"ev":[{"p":"P054","n":2,"quote":"I know that during your free time many of you have also done some additional research on the Smithsonian’s website.”"},{"p":"P054","n":14,"quote":"You’ve done your research."}]},{"id":"R6-P054-F3-01","skill":"F3","pages":["P054"],"src":null,"stem":["Why does Imani especially want to visit the Museum of African Art?","为什么伊曼妮特别想去非洲艺术博物馆？"],"o":[["She has already visited Kenya many times.","她已经多次去过肯尼亚。"],["She expects to find early computer games there.","她希望在那里找到早期的电脑游戏。"],["Her family’s Kenyan background and art collection make her want to learn more.","家人来自肯尼亚，家里又收藏艺术品，这让她想多了解非洲艺术。"],["She wants to see the space spiders there.","她想在那里看那两只太空蜘蛛。"]],"key":2,"why":["Imani connects her interest to her parents' Kenyan background, her own lack of a visit there, and her family's collection of African art.","Imani 把父母来自肯尼亚、自己还没去过以及家中收藏非洲艺术联系起来，说明她的兴趣来自家庭文化背景。"],"ev":[{"p":"P054","n":11,"quote":"“My parents emigrated from Kenya when they were children, but I’ve never been there to visit."}]},{"id":"R6-P054-C1-01","skill":"C1","pages":["P054"],"src":8,"stem":["What does “array” mean in “the wide array of topics”?","“the wide array of topics”里的 array 是什么意思？"],"o":[["A loud argument","一场大声的争吵"],["A variety or range","各种各样的一系列事物"],["An empty room","一个空房间"],["A single rule","一条规则"]],"key":1,"why":["The museums cover topics ranging from nature and space to animals, art, and history. This variety shows what 'array' means.","后文列出自然、航天、动物、艺术、历史等不同主题，支持 array 表示“多种多样的一系列”。"],"ev":[{"p":"P054","n":2,"quote":"“We’ve done a little research as a class about the wide array of topics that the Smithsonian addresses in their museums."}]},{"id":"R6-P056-F5-01","skill":"F5","pages":["P056"],"src":12,"stem":["Which description best identifies this selection?","哪项最准确地描述了本文？"],"o":[["A fantasy about a magical museum","关于一座神奇博物馆的幻想故事"],["A recipe for making museum exhibits","制作博物馆展品的步骤"],["A first-person autobiography by James Smithson","詹姆斯·史密森的第一人称自传"],["An informational text about the Smithsonian’s history and collections","介绍史密森学会历史和馆藏的说明文"]],"key":3,"why":["The passage explains how the institution began, how it is funded, and what it collects. Smithson appears as part of the institution's history.","文章介绍机构的由来、资金和各类馆藏，以说明信息为主；虽然写到 Smithson，但并非只讲他的完整生平。"],"ev":[{"p":"P056","n":1,"quote":"The Smithsonian Institution in Washington, D.C., covers so many subjects and contains so many objects that you would have to call it a super-museum."},{"p":"P056","n":3,"quote":"Congress debated for many years about how exactly the money should be used, but in 1846, President James Polk signed a bill into law that founded the institution."},{"p":"P056","n":7,"quote":"One of the most popular Smithsonian sites is the National Air and Space Museum."}]},{"id":"R6-P056-D4-01","skill":"D4","pages":["P056"],"src":null,"stem":["Why does the author include paragraphs 2 and 3?","作者为什么写第2段和第3段？"],"o":[["To explain how Smithson’s gift led to the founding of the institution","说明史密森的捐赠如何促成学会建立"],["To explain how to pilot the Spirit of St. Louis","说明如何驾驶“圣路易斯精神号”"],["To describe every animal in the National Zoo","描述国家动物园里的每种动物"],["To argue that museums should charge higher prices","主张博物馆应提高门票价格"]],"key":0,"why":["Paragraphs 2 and 3 explain how the Englishman's generosity led to the institution's founding through his will and the eventual donation.","首段提到英国人的慷慨，接着第2—3段交代遗嘱、捐款和建馆过程，为这一说法提供背景解释。"],"ev":[{"p":"P056","n":2,"quote":"However, Smithson stated in his will that if Henry died without having any children, all the money would be donated to the U.S. government."},{"p":"P056","n":3,"quote":"Congress debated for many years about how exactly the money should be used, but in 1846, President James Polk signed a bill into law that founded the institution."}]},{"id":"R6-P056-C4-01","skill":"C4","pages":["P056"],"src":null,"stem":["The title calls the Smithsonian a “Mega-Museum.” What does “mega-” suggest here?","标题用“Mega-Museum”来形容史密森学会。这里的 mega- 表达了什么？"],"o":[["Only for children","只供儿童参观"],["Very large","规模非常大"],["Recently closed","最近关闭了"],["Under the ground","位于地下"]],"key":1,"why":["The opening describes a 'super-museum' with 143 million items across 17 museums. These details show that 'mega-' suggests a very large scale.","标题的 mega- 与首段 super-museum、143 million items、17 separate museums 相互照应，表示规模很大。"],"ev":[{"p":"P056","n":1,"quote":"The Smithsonian Institution in Washington, D.C., covers so many subjects and contains so many objects that you would have to call it a super-museum."},{"p":"P056","n":1,"quote":"In fact, its collection of artifacts and memorabilia is so vast—more than 143 million items—the Smithsonian needs 17 separate museums to hold everything!"}]},{"id":"R6-P058-B1-01","skill":"B1","pages":["P058"],"src":2,"stem":["What happens when the Hope diamond is exposed to ultraviolet light?","希望钻石受到紫外线照射时，会发生什么？"],"o":[["It permanently turns into a white diamond.","它会永久变成一颗白钻。"],["It glows red for a few seconds.","它会发出几秒钟的红光。"],["It stops reflecting all light.","它不再反射任何光线。"],["It doubles in weight.","它的重量会翻倍。"]],"key":1,"why":["Paragraph 7 directly states that ultraviolet light makes the normally blue diamond glow red for a few seconds.","第7段直接说明短暂红色发光的现象；不要把它原本的蓝色与紫外线下的表现混淆。"],"ev":[{"p":"P058","n":7,"quote":"When the Hope diamond is exposed to ultraviolet light, it will glow red for a few seconds."}]},{"id":"R6-P058-D1-01","skill":"D1","pages":["P058"],"src":null,"stem":["How is most of the diamond’s history organized?","文中记述钻石历史的内容，大部分是怎样安排的？"],"o":[["In time order, following changes in ownership","按时间顺序，讲述它如何几经易主"],["By comparing diamonds from largest to smallest","按钻石从大到小的顺序作比较"],["As instructions for cutting a diamond","按切割钻石的步骤来介绍"],["As an argument against all museum collections","通过论证反对所有博物馆收藏"]],"key":0,"why":["Paragraphs 2 through 6 follow the diamond from its early purchase through the theft, successive owners, and eventual donation.","第2—6段依次介绍早期购买、失窃、后来的持有人和捐赠，日期与所有权变化构成时间线。"],"ev":[{"p":"P058","n":2,"quote":"Historians believe that King Louis XIV purchased the diamond in 1668 as part of the French crown jewels."},{"p":"P058","n":5,"quote":"In 1912, the Hope diamond finally found a semi-permanent home with a woman by the name of Evalyn Walsh McLean."},{"p":"P058","n":6,"quote":"In 1949, after Mrs."}]},{"id":"R6-P058-E2-01","skill":"E2","pages":["P058"],"src":null,"stem":["Which detail does the author present as uncertain rather than as an established record?","作者认为哪个细节仍有待查证？"],"o":[["The path the diamond took after the robbery","钻石被抢后的去向"],["Mrs. McLean had the stone reset.","麦克莱恩夫人重新镶嵌了这颗钻石。"],["The diamond is part of a Smithsonian collection.","钻石是史密森学会的馆藏。"],["Winston donated the diamond in 1958.","温斯顿于1958年捐出了钻石。"]],"key":0,"why":["The phrases 'No one knows for certain' and 'No record exists' in paragraph 3 mark gaps in the evidence.","第3段用 No one knows for certain 和 No record exists 明确标示证据缺口。不能把推测与有记录的事件放在同一确定程度上。"],"ev":[{"p":"P058","n":3,"quote":"No one knows for certain the path of the diamond after its theft."},{"p":"P058","n":3,"quote":"No record exists to verify where Hope got the diamond or how much he paid for it."}]},{"id":"R6-P060-A1-01","skill":"A1","pages":["P060"],"src":7,"stem":["Which statement best expresses the main idea?","哪项最能概括文章主旨？"],"o":[["The Smithsonian was built to house one airplane.","史密森学会是为了存放一架飞机而建立的。"],["Lindbergh became a major celebrity after flying nonstop from New York to Paris.","林德伯格从纽约直飞巴黎后成了赫赫有名的人物。"],["The Lindy Hop was the only reason Lindbergh became famous.","林迪舞是林德伯格出名的唯一原因。"],["Lindbergh spent his whole career designing cars.","林德伯格的整个职业生涯都在设计汽车。"]],"key":1,"why":["The passage follows Lindbergh's preparations, his 1927 flight across the Atlantic, and his rise to fame. The dance and the plane's display location are later details.","文章围绕他的飞行准备、1927年的跨洋飞行及成名展开。舞蹈和收藏地点是成就带来的后续细节。"],"ev":[{"p":"P060","n":1,"quote":"Many historians agree that Charles Lindbergh was one of the first major celebrities, or superstars."},{"p":"P060","n":6,"quote":"He became a national hero and a huge celebrity."}]},{"id":"R6-P060-C1-01","skill":"C1","pages":["P060"],"src":8,"stem":["What does “customized” mean in paragraph 5?","第5段中的 customized 是什么意思？"],"o":[["Built or changed to meet a particular need","因特定需求而制造或改装的"],["Damaged during a training flight","在训练飞行中损坏的"],["Borrowed only for a public display","借来仅供公开展出的"],["Chosen without considering the journey","选择时没有考虑航程的"]],"key":0,"why":["An ordinary plane could not fly that far for that long. The new plane was built to meet the particular demands of the trip.","前一句说普通飞机无法飞那么远、那么久，后一句说新飞机能完成旅程，因此是为特定需求定制。"],"ev":[{"p":"P060","n":5,"quote":"Lindbergh knew he had the skills to complete the flight, but not just any plane was capable of flying that far for that long."},{"p":"P060","n":5,"quote":"Louis, Lindbergh got a customized airplane that could make the journey."}]},{"id":"R6-P060-F2-01","skill":"F2","pages":["P060"],"src":2,"stem":["Which pair of traits is best supported by Lindbergh’s actions?","林德伯格的行动最能体现哪一组性格特征？"],"o":[["Careless about flying and opposed to learning","对飞行马虎、拒绝学习"],["Uninterested and easily discouraged","缺乏兴趣、容易灰心"],["Adventurous and determined","爱冒险、有决心"],["Fearful of all travel and unwilling to train","害怕一切出行、不愿接受训练"]],"key":2,"why":["Learning to fly, performing stunts, taking further training, and arranging for a special plane all show that Lindbergh was adventurous and determined.","他学习飞行、表演特技、接受训练并为远程飞行筹备专用飞机，支持“敢于冒险且有决心”。"],"ev":[{"p":"P060","n":2,"quote":"Soon after, Lindbergh bought his own plane and traveled the nation performing aerial stunts."},{"p":"P060","n":5,"quote":"Lindbergh knew he had the skills to complete the flight, but not just any plane was capable of flying that far for that long."}]},{"id":"R6-P062-A4-01","skill":"A4","pages":["P062"],"src":null,"stem":["Which theme is most strongly developed by the ending?","故事结尾最鲜明地表达了什么主题？"],"o":[["Children should never express worries to their parents.","孩子永远不该向父母说出自己的担忧。"],["Past safety guarantees that future danger is impossible.","过去安全，就能保证将来也不会有危险。"],["A house matters more than the people who live in it.","房子比住在里面的人更重要。"],["A family can create a sense of home together even when its address changes.","即使换了住址，一家人也能一起营造家的感觉。"]],"key":3,"why":["The father says home is wherever they go together, and the girls come to accept his idea. The ending emphasizes how a family can make a home wherever it lives.","结尾由父亲的 home is wherever we go as a family，到姐妹接受这一想法，突出家人的关系比固定房子更能定义“家”。"],"ev":[{"p":"P062","n":8,"quote":"We’ll have to give up our house, but you know as well as I do that home is wherever we go as a family."},{"p":"P062","n":13,"quote":"He was right; home was wherever the family was."}]},{"id":"R6-P062-F3-01","skill":"F3","pages":["P062"],"src":7,"stem":["Why do the parents want to move?","父母为什么想搬家？"],"o":[["They have forgotten all their happy memories.","他们忘了所有愉快的回忆。"],["They dislike every place in Hawaii.","他们不喜欢夏威夷的任何地方。"],["They want the girls to stop surfing permanently.","他们想让女儿以后都别再冲浪。"],["They place the family’s safety above keeping the familiar house.","他们认为一家人的安全比留在熟悉的房子里更重要。"]],"key":3,"why":["The parents treasure the house and their memories, but paragraph 7 makes clear that safety comes first. Moving is their response to the risk of an eruption.","父母也珍惜房子和回忆，但第7段明确说家人安全最重要；搬家是面对火山不确定风险的选择。"],"ev":[{"p":"P062","n":5,"quote":"“But your dad and I are concerned about all the recent evacuations."},{"p":"P062","n":7,"quote":"The most important thing in the world to us is that our family stays safe.”"}]},{"id":"R6-P062-C3-01","skill":"C3","pages":["P062"],"src":null,"stem":["What does “dejectedly” add to “picked at a bowl of pretzels”?","dejectedly 为“picked at a bowl of pretzels（拨弄碗里的椒盐脆饼）”增添了什么含义？"],"o":[["It only tells the reader the food is salty.","只说明食物是咸的。"],["It suggests that the girls are laughing excitedly.","说明姐妹俩正兴奋地大笑。"],["It suggests that the girls are proudly celebrating.","说明姐妹俩正自豪地庆祝。"],["It emphasizes that the girls feel discouraged and unhappy.","强调姐妹俩感到沮丧和不快。"]],"key":3,"why":["'Dejectedly' conveys the girls' discouragement and unhappiness as they pick at the food, reflecting how they feel about moving.","dejectedly 带有明显的沮丧意味，比单纯描述动作多了一层负面情绪，也呼应她们不愿搬家的反应。"],"ev":[{"p":"P062","n":2,"quote":"Leilani and Kala dejectedly picked at a bowl of pretzels."},{"p":"P062","n":6,"quote":"she added, fighting back tears."}]},{"id":"R6-P064-A3-01","skill":"A3","pages":["P064"],"src":7,"stem":["Which sentence best summarizes paragraph 3?","哪句话最能概括第3段？"],"o":[["Thompson respected the volcano’s power but had grown used to living near it.","汤普森敬畏火山的威力，也已习惯了住在火山附近。"],["Thompson spent each day terrified and unable to leave his house.","汤普森每天都惊恐万分，无法离开家。"],["Thompson moved away as soon as the volcano became active.","火山一进入活跃期，汤普森就搬走了。"],["Thompson believed lava could never damage a house.","汤普森相信熔岩永远不会损坏房屋。"]],"key":0,"why":["Paragraph 3 says that Thompson respects the volcano's power and has grown used to living nearby without constant fear. A summary needs both ideas.","该段同时写“尊重火山威力”和“已习惯、不天天害怕”。概括需保留这两面，不能只截取温度细节。"],"ev":[{"p":"P064","n":3,"quote":"He still had a healthy respect for the power of Kilauea, but he did not live every day in fear."},{"p":"P064","n":3,"quote":"He still had a healthy respect for the power of Kilauea, but he did not live every day in fear."}]},{"id":"R6-P064-B3-01","skill":"B3","pages":["P064"],"src":null,"stem":["Why would Thompson probably plan supply trips especially carefully?","为什么汤普森可能会特别仔细地计划每次外出采购？"],"o":[["His neighborhood had many residents to shop for.","他的住宅区有许多居民需要他帮忙采购。"],["A fresh lava flow could prevent him from leaving again soon.","新的熔岩流可能让他在短时间内不能再外出。"],["The nearest shop required all customers to buy furniture.","最近的商店要求所有顾客都买家具。"],["He wanted to stop collecting rainwater.","他不想再收集雨水。"]],"key":1,"why":["Paragraph 5 says that a new lava flow could trap Thompson at home. He therefore needs to plan trips carefully and buy all the essentials while he is out.","第5段说他必须买齐必需品，因为新的熔岩流可能把他困住。由此可推断他需要预先规划，而不只是临时买少量东西。"],"ev":[{"p":"P064","n":5,"quote":"When he left his home to get supplies, he had to be sure to purchase all the essentials because he never knew when he might be trapped for a period of time by a fresh lava flow."},{"p":"P064","n":5,"quote":"When he left his home to get supplies, he had to be sure to purchase all the essentials because he never knew when he might be trapped for a period of time by a fresh lava flow."}]},{"id":"R6-P064-B4-01","skill":"B4","pages":["P064"],"src":null,"stem":["Which detail best supports the claim that Thompson’s route out was dangerous?","哪个细节最能说明汤普森外出的路很危险？"],"o":[["The subdivision was named Royal Gardens.","住宅区叫皇家花园。"],["He loved the natural beauty of his home.","他喜欢家园的自然美景。"],["He sometimes bought supplies away from home.","他有时出门采购物资。"],["A crack could suddenly open and expose hot lava beneath the rock.","地面可能突然出现裂缝，露出岩石下面滚烫的熔岩。"]],"key":3,"why":["A sudden crack could expose hot lava directly beneath his path. That detail shows exactly what made his route dangerous.","要支持“路线危险”，应找直接描写路面风险的细节。突然裂开的岩面与下面的熔岩比住处名称、个人偏好更有证明力。"],"ev":[{"p":"P064","n":4,"quote":"At any time, a sudden crack could open up, revealing the red-hot dangerous liquid."}]},{"id":"R6-P066-D4-01","skill":"D4","pages":["P066"],"src":null,"stem":["Why does the author describe opening a shaken bottle of soda?","作者为什么介绍打开摇晃过的汽水瓶的情景？"],"o":[["To show that all volcanoes contain soda","说明所有火山都含有汽水"],["To give instructions for measuring plate movement","提供测量板块移动的方法"],["To help readers understand how trapped gases can make an eruption explosive","帮助读者理解被困住的气体如何使火山发生爆炸性喷发"],["To explain why people drink soda near volcanoes","解释人们为什么在火山附近喝汽水"]],"key":2,"why":["The familiar example of soda spraying from a shaken bottle illustrates how trapped gases can make an eruption more explosive.","熟悉的汽水喷出类比不熟悉的火山喷发，突出气体在其中产生的作用。两者在机制的这一点上相似，不表示物质相同。"],"ev":[{"p":"P066","n":5,"quote":"Picture a bottle of soda that has been shaken."},{"p":"P066","n":5,"quote":"In the same way, volcanoes that have a high concentration of gases will also explode with greater force."}]},{"id":"R6-P066-B2-01","skill":"B2","pages":["P066"],"src":6,"stem":["Why does magma rise toward the surface?","岩浆为什么向地表上升？"],"o":[["It becomes colder than all surrounding material.","它变得比周围的一切物质都冷。"],["Earth’s plates stop moving whenever magma forms.","每当岩浆形成时，地球板块就停止运动。"],["It is pulled upward by growing fingernails.","它被生长中的指甲向上拉。"],["It is less dense than the surrounding rock.","它的密度比周围的岩石小。"]],"key":3,"why":["Paragraph 4 explains that magma rises because it is less dense than the rock around it.","第4段直接用 because 说明岩浆上升的原因：相对周围岩石密度较小。"],"ev":[{"p":"P066","n":4,"quote":"Eventually, the magma rises because it is lighter, or less dense, than the rocky material that surrounds it."}]},{"id":"R6-P066-C1-01","skill":"C1","pages":["P066"],"src":null,"stem":["What does “dormant” mean in paragraph 1?","第1段中的 dormant 是什么意思？"],"o":[["Inactive","处于不活跃状态"],["Extremely tall","极其高大"],["Underwater only","只位于水下"],["Extinct forever","永远不会再活动"]],"key":0,"why":["The words 'or inactive' directly define 'dormant' in paragraph 1.","作者紧跟在 dormant 后用 or inactive 作同义解释，这是直接的上下文定义线索。"],"ev":[{"p":"P066","n":1,"quote":"In fact, about 75 percent of the world’s 1,900 active and dormant, or inactive, volcanoes are located there."}]},{"id":"R6-P068-A1-01","skill":"A1","pages":["P068"],"src":null,"stem":["Which statement best captures the passage as a whole?","哪项最能概括全文？"],"o":[["Tsunamis are powerful ocean waves, and warning systems can reduce the harm they cause.","海啸是破坏力极强的海浪，预警系统可以减少海啸造成的伤害。"],["Every tsunami consists of exactly one wave.","每次海啸都只有一道浪。"],["Tsunamis are ordinary small waves caused only by wind.","海啸是完全由风引起的普通小浪。"],["The passage is mainly a travel guide to Hawaiian beaches.","本文主要是夏威夷海滩的旅游指南。"]],"key":0,"why":["The passage explains how tsunamis form, how destructive they can be, and how warning systems can help reduce harm.","全文先解释海啸的成因和特征，再用灾害实例引出预警系统；中心思想应覆盖自然现象和防护这两部分。"],"ev":[{"p":"P068","n":2,"quote":"Tsunamis are caused by a disturbance in the ocean, such as an earthquake or undersea volcanic eruption."},{"p":"P068","n":7,"quote":"The devastation of the 1946 tsunamis led a team of scientists and government officials to create the Pacific Tsunami Warning System."}]},{"id":"R6-P068-B2-01","skill":"B2","pages":["P068"],"src":5,"stem":["What positive development followed the 1946 disaster?","1946年的灾难过后，出现了什么积极的变化？"],"o":[["The ocean permanently stopped producing waves.","海洋永远不再产生海浪。"],["All earthquakes around the world ended.","世界各地的地震全都停止了。"],["Scientists and officials created the Pacific Tsunami Warning System.","科学家和政府官员建立了太平洋海啸预警系统。"],["Hawaii no longer needed evacuation plans.","夏威夷从此不再需要疏散计划。"]],"key":2,"why":["In paragraph 7, 'led ... to create' shows that the 1946 disaster prompted the creation of the Pacific Tsunami Warning System.","第7段用 led...to create 清楚建立因果关系：1946年的灾害推动了太平洋海啸预警系统的建立。"],"ev":[{"p":"P068","n":7,"quote":"The devastation of the 1946 tsunamis led a team of scientists and government officials to create the Pacific Tsunami Warning System."}]},{"id":"R6-P068-D2-01","skill":"D2","pages":["P068"],"src":null,"stem":["In paragraph 7, who does “They” refer to in “They hoped”?","第7段中，“They hoped”里的 They 指谁？"],"o":[["The meteorites that entered the ocean.","落入海里的陨石"],["The towns destroyed by the tsunami","被海啸摧毁的城镇"],["The team of scientists and government officials","那组科学家和政府官员"],["The waves that reached Hawaii","抵达夏威夷的海浪"]],"key":2,"why":["'They' refers to the team of scientists and government officials, who hoped to protect people, set up the system, and worked out how to predict arrival times.","代词应与前句中能执行 hoped、set up、determined 的复数主体对应，即科学家和政府官员组成的团队。"],"ev":[{"p":"P068","n":7,"quote":"The devastation of the 1946 tsunamis led a team of scientists and government officials to create the Pacific Tsunami Warning System."},{"p":"P068","n":7,"quote":"They hoped that people would never again suffer such great losses because they were unaware of a tsunami’s approach."}]},{"id":"R6-P070-B4-01","skill":"B4","pages":["P070"],"src":11,"stem":["Which detail best shows that Mattie enjoys the camping experience?","哪个细节最能说明马蒂喜欢露营？"],"o":[["Mrs. Rosen once visited a classmate in Texas.","罗森太太曾去得克萨斯州看望一位同学。"],["She asks how much wood is needed.","她问还需要多少柴。"],["She loves the wood smoke and the taste of melted marshmallows and chocolate.","她爱闻柴火烟的气味，也爱吃融化的棉花糖和巧克力。"],["Charley rinses the dishes.","查利冲洗餐具。"]],"key":2,"why":["The first paragraph directly states that Mattie loves the smell of wood smoke and the taste of the campfire treats. That detail shows how she feels about camping.","“喜欢露营”需要由 Mattie 自己的感受来支持。第1段明确写她喜欢气味和食物，比其他人的活动更直接。"],"ev":[{"p":"P070","n":1,"quote":"Mattie loved the smell of wood smoke and the taste of gooey marshmallows melting the chocolate between crisp graham crackers."}]},{"id":"R6-P070-C5-01","skill":"C5","pages":["P070"],"src":13,"stem":["What does “kept an eye on the sky” mean?","“kept an eye on the sky”是什么意思？"],"o":[["Put a drawing of an eye in the sky","把一幅眼睛的画放到天上"],["Closed their eyes to avoid looking up","闭上眼睛，避免抬头看"],["Continued watching the sky","继续注视天空"],["Forgot what was happening above them","忘了头顶上正在发生的事"]],"key":2,"why":["'Kept an eye on' means continued to watch. The children listen to the story while still watching the sky.","keep an eye on 是“留意、持续观察”。两人仍担心蝙蝠，所以一边听故事，一边观察天空。"],"ev":[{"p":"P070","n":10,"quote":"Mattie and Charley shook their heads, but they kept an eye on the sky."}]},{"id":"R6-P070-F3-01","skill":"F3","pages":["P070"],"src":null,"stem":["How do the children’s reactions change by the end?","到故事结尾，孩子们的反应发生了什么变化？"],"o":[["They stop noticing the bats and refuse to listen.","他们不再留意蝙蝠，也不愿继续听。"],["They move from worry toward interested observation.","他们从担忧转向饶有兴趣地观察。"],["They become determined to chase all the bats away.","他们下定决心把蝙蝠全都赶走。"],["They remain so frightened that they leave immediately.","他们还是很害怕，立刻离开了。"]],"key":1,"why":["Charley initially wants to retreat to the tent, but by the end the family waits to see the bats again. This change shows that worry has given way to curiosity.","前面 Charley 紧张地想进帐篷，后面全家耐心等着再看蝙蝠。行为变化支持从担忧转向好奇的判断。"],"ev":[{"p":"P070","n":6,"quote":"asked Charley nervously."},{"p":"P070","n":14,"quote":"The fire gave off a gentle glow as they patiently waited, hoping to catch another glimpse of the bats as they set out on their evening’s activities."}]},{"id":"R6-P072-A2-01","skill":"A2","pages":["P072"],"src":2,"stem":["Which claim does the author mainly support?","作者主要支持哪项观点？"],"o":[["Bats do no work that benefits plants.","蝙蝠对植物毫无帮助。"],["Every animal has exactly the same reputation.","每种动物的名声都一模一样。"],["All bats feed on human blood.","所有蝙蝠都以人血为食。"],["Bats are useful animals that deserve more appreciation.","蝙蝠是有用的动物，值得人们多加欣赏。"]],"key":3,"why":["The author addresses common misconceptions and describes how bats eat insects, pollinate plants, and spread seeds. These examples show why bats are worth appreciating.","作者先指出负面误解，再用吃昆虫、传粉和传播种子的事实支持蝙蝠有益的主张。"],"ev":[{"p":"P072","n":1,"quote":"All of this makes it difficult for educators to get out the word that bats are actually wonderful, useful, and amazing creatures."},{"p":"P072","n":3,"quote":"Bats are useful creatures."},{"p":"P072","n":4,"quote":"In addition, some bats pollinate plants and flowers."}]},{"id":"R6-P072-B2-01","skill":"B2","pages":["P072"],"src":1,"stem":["How does echolocation help bats find objects in the dark?","回声定位如何帮助蝙蝠在黑暗中找到物体？"],"o":[["They smell the color of nearby objects.","它们闻得出周围物体的颜色。"],["They ask other animals to draw maps for them.","它们请其他动物帮忙绘制地图。"],["They use returning echoes of their sounds to form a mental picture.","它们利用自身发出的声音传回的回声来形成脑中的图像。"],["They wait for sunlight to reflect from objects.","它们等待阳光被物体反射。"]],"key":2,"why":["Bats make sounds that bounce off nearby objects. The echoes give them information they use to picture where things are.","该过程为发声→声音遇物反射→利用回声判断位置。重点是声音返回的信息，而不是视觉光线。"],"ev":[{"p":"P072","n":5,"quote":"Bats emit very high-pitched sounds that bounce off objects, no matter how small they are."},{"p":"P072","n":5,"quote":"Bats use the reflected sounds to form pictures in their brains of where things are located."}]},{"id":"R6-P072-E3-01","skill":"E3","pages":["P072"],"src":null,"stem":["Which phrase best describes the author’s tone toward bats?","哪项最能描述作者谈到蝙蝠时的语气？"],"o":[["Appreciative and reassuring","怀着欣赏，也让人安心"],["Indifferent and bored","漠不关心、感到厌烦"],["Angry at anyone who studies animals","对研究动物的人生气"],["Mocking and disgusted","带着嘲笑和厌恶"]],"key":0,"why":["Words such as 'wonderful' and 'amazing' express appreciation. The author also reassures readers that there is no need to run for cover.","wonderful、amazing、good deeds 等词表达赞赏，结尾 no need to run for cover 则安抚读者。语气判断要结合用词和态度。"],"ev":[{"p":"P072","n":1,"quote":"All of this makes it difficult for educators to get out the word that bats are actually wonderful, useful, and amazing creatures."},{"p":"P072","n":6,"quote":"The next time you see the flutter of wings in the sky at dusk, there is no need to run for cover."}]},{"id":"R6-P074-F1-01","skill":"F1","pages":["P074"],"src":5,"stem":["Where does most of the story take place?","故事主要发生在哪里？"],"o":[["On an airplane crossing the ocean","一架飞越大洋的飞机上"],["Inside a city museum and a library","城里的博物馆和图书馆里"],["At a campsite and on a hiking trail leading to hot springs","露营地和通往温泉的徒步小径上"],["In a classroom during a science test","正在举行科学考试的教室里"]],"key":2,"why":["The family starts with breakfast at the campsite, drives to the trailhead, and hikes to the hot springs.","前半段在营地吃早饭，随后开车到登山口、沿步道行走，最后来到温泉。"],"ev":[{"p":"P074","n":1,"quote":"There was something about camping that made them feel wide-awake and excited to start the day as soon as their eyes were open."},{"p":"P074","n":6,"quote":"They drove a short distance to the trailhead, gathered their hiking gear, and set out for the day."},{"p":"P074","n":10,"quote":"“They’re hot springs,” explained Mrs."}]},{"id":"R6-P074-F6-01","skill":"F6","pages":["P074"],"src":2,"stem":["What does “I never would have guessed in a million years” mean?","“I never would have guessed in a million years（我猜一百万年也猜不到）”是什么意思？"],"o":[["Mattie has actually been guessing for a million years.","马蒂真的已经猜了一百万年。"],["Mattie finds the surprise completely unexpected.","马蒂完全没想到会有这个惊喜。"],["The family plans to camp for a million years.","一家人打算露营一百万年。"],["The hot spring appeared exactly one million years ago.","温泉出现于整整一百万年前。"]],"key":1,"why":["'A million years' is an exaggeration that underscores how completely unexpected the surprise was.","a million years 在这里是夸张，强调“怎么也没想到”，不是实际时间或温泉年龄。"],"ev":[{"p":"P074","n":14,"quote":"“I never would have guessed in a million years!”"}]},{"id":"R6-P074-B2-01","skill":"B2","pages":["P074"],"src":1,"stem":["Which sequence matches the events?","哪项符合事件的先后顺序？"],"o":[["Breakfast → discover the springs → drive to the trailhead → hike","吃早餐 → 发现温泉 → 开车到小径入口 → 徒步"],["Breakfast → drive to the trailhead → hike → discover the hot springs","吃早餐 → 开车到小径入口 → 徒步 → 发现温泉"],["Discover the springs → breakfast → hike → drive to the trailhead","发现温泉 → 吃早餐 → 徒步 → 开车到小径入口"],["Hike → drive to the trailhead → breakfast → discover the springs","徒步 → 开车到小径入口 → 吃早餐 → 发现温泉"]],"key":1,"why":["Paragraph 2 describes breakfast, paragraph 6 covers the drive and start of the hike, and paragraphs 7 through 10 follow the hike to the discovery of the springs.","第2段吃早饭，第6段到登山口并出发，第7—8段继续徒步，第10段揭晓温泉。按文本事件发生顺序排列。"],"ev":[{"p":"P074","n":2,"quote":"They made breakfast over the propane stove."},{"p":"P074","n":6,"quote":"They drove a short distance to the trailhead, gathered their hiking gear, and set out for the day."},{"p":"P074","n":10,"quote":"“They’re hot springs,” explained Mrs."}]},{"id":"R6-P074-G1-01","skill":"G1","pages":["P074"],"src":6,"stem":["According to the table, which spring has the hottest water?","根据表格，哪一处泉水最热？"],"o":[["Healing Spring","疗愈泉"],["Scenic Hot Springs","风景温泉"],["Morning Mist Springs","晨雾泉"],["Baker Hot Spring","贝克温泉"]],"key":2,"why":["The largest value in the temperature column is 205°F, which is listed for Morning Mist Springs.","比较温度列的86、122、108、95和205；最大值205°F对应 Morning Mist Springs。表中温度与文章中的情节需分别定位。"],"ev":[{"p":"P074","n":"t5","quote":"Morning Mist Springs | 205 | Ashton | Wyoming"}]},{"id":"R6-P074-G1-02","skill":"G1","pages":["P074"],"src":7,"stem":["Which spring is listed near Seattle, Washington?","表中列出的哪一处泉在华盛顿州西雅图附近？"],"o":[["Caddo Gap Springs","卡多峡谷泉"],["Scenic Hot Springs","风景温泉"],["Morning Mist Springs","晨雾泉"],["Healing Spring","疗愈泉"]],"key":1,"why":["Find Seattle in the Area column, then read the name in the Spring column on the same row: Scenic Hot Springs.","先在 Area 列定位 Seattle，再沿同一行读取 Spring 名称，得到 Scenic Hot Springs。"],"ev":[{"p":"P074","n":"t2","quote":"Scenic Hot Springs | 122 | Seattle | Washington"}]},{"id":"R6-P074-G2-01","skill":"G2","pages":["P074"],"src":null,"stem":["Which statement correctly combines the story’s explanation with the table’s hottest spring?","哪项正确结合了故事对温泉的解释和表格中水温最高的泉？"],"o":[["Heat from inside Earth warms the water; Morning Mist Springs in Wyoming has the highest listed temperature.","地球内部的热量给水加热。怀俄明州的晨雾泉水温在表中最高。"],["Ice heats the pools; Baker Hot Spring is listed in Virginia.","冰使池里的水变热。贝克温泉在表中列为弗吉尼亚州。"],["Ocean currents heat the water; Scenic Hot Springs is listed in Wyoming.","洋流给水加热。风景温泉在表中列为怀俄明州。"],["The Sun heats the pools; Healing Spring in Virginia has the highest listed temperature.","太阳使池里的水变热。弗吉尼亚州的疗愈泉水温在表中最高。"]],"key":0,"why":["Paragraph 10 says the water is warmed by heat from inside Earth. The table identifies Morning Mist Springs in Wyoming as the hottest spring listed, at 205°F.","正文第10段解释 geothermal heat 来自地球内部；表格再给出最高温205°F及其州 Wyoming。正确选项必须同时符合文字与表格。"],"ev":[{"p":"P074","n":10,"quote":"“The water is heated by geothermal heat, which means that the heat is produced from inside Earth.”"},{"p":"P074","n":"t5","quote":"Morning Mist Springs | 205 | Ashton | Wyoming"}]},{"id":"R6-P074-G3-01","skill":"G3","pages":["P074"],"src":null,"stem":["How much higher is Morning Mist Springs’ listed temperature than Healing Spring’s?","表中晨雾泉的水温比疗愈泉高多少？"],"o":[["291°F","291°F"],["36°F","36°F"],["119°F","119°F"],["83°F","83°F"]],"key":2,"why":["Subtract Healing Spring's 86°F from Morning Mist Springs' 205°F to get a difference of 119°F.","从表格读取205°F和86°F，做差205−86＝119°F。不要相加，也不要误用另一行的122°F。"],"ev":[{"p":"P074","n":"t5","quote":"Morning Mist Springs | 205 | Ashton | Wyoming"},{"p":"P074","n":"t1","quote":"Healing Spring | 86 | Roanoke | Virginia"}]},{"id":"R6-P076-E2-01","skill":"E2","pages":["P076"],"src":null,"stem":["How does the author treat claims that the spring water heals people?","作者如何看待温泉水能治病的说法？"],"o":[["As a claim that nobody has ever believed","这是一种从来没人相信的说法。"],["As a long-held belief whose medical benefit is not established in the passage","人们长期相信这一点，但文中没有证实其医疗作用。"],["As a reason to stop all scientific study","这一说法可以作为停止所有科学研究的理由。"],["As a proven cure for every illness","事实证明，温泉水能治疗一切疾病。"]],"key":1,"why":["Paragraph 3 describes a long-held belief in the waters' healing powers, while paragraph 4 says that actual health benefits remain unknown.","第3段写 people have long believed；第4段转为 it is not known whether。作者区分人们的相信和文中证实的程度。"],"ev":[{"p":"P076","n":3,"quote":"People have long believed in the healing, therapeutic effects of hot springs."},{"p":"P076","n":4,"quote":"Today, it is not known whether the water can truly improve health."}]},{"id":"R6-P076-B2-01","skill":"B2","pages":["P076"],"src":6,"stem":["Which event happened first?","哪件事最早发生？"],"o":[["Native Americans used the hot springs.","美洲原住民使用温泉。"],["The reservation became Hot Springs National Park.","保护区成为温泉国家公园。"],["Congress established Hot Springs Reservation.","国会设立温泉保护区。"],["The United States purchased the area from France.","美国从法国购买这片地区。"]],"key":0,"why":["The opening says Native Americans used the springs before Europeans arrived. The events dated 1803, 1832, and 1921 all happened later.","首段明确说欧洲人到来之前当地原住民已使用温泉；1803、1832、1921年的事件都更晚。"],"ev":[{"p":"P076","n":1,"quote":"Many years before the arrival of Europeans, Native Americans used the clean, fresh, hot water that burbled to the surface of Earth."},{"p":"P076","n":2,"quote":"In 1803, the United States purchased the Hot Springs area from France as part of the Louisiana Territory."}]},{"id":"R6-P076-C1-01","skill":"C1","pages":["P076"],"src":8,"stem":["What does “therapeutic” mean in paragraph 3?","第3段中的 therapeutic 是什么意思？"],"o":[["Unable to hold any water","一点水也存不住的"],["Related to treatment or healing","与治疗或康复有关的"],["Designed only for decoration","只供装饰的"],["Extremely difficult to reach","极难到达的"]],"key":1,"why":["Nearby words such as 'healing' and 'heal their ailments' show that 'therapeutic' relates to treatment or healing.","healing、heal their ailments 等邻近表达提供线索，因此 therapeutic 与治疗、疗愈有关。"],"ev":[{"p":"P076","n":3,"quote":"People have long believed in the healing, therapeutic effects of hot springs."},{"p":"P076","n":3,"quote":"They even drank the water, hoping that it would heal their ailments."}]},{"id":"R6-P078-C5-01","skill":"C5","pages":["P078"],"src":null,"stem":["What does putting college “on the back burner” mean?","把上大学这件事放到“on the back burner”是什么意思？"],"o":[["Giving college a lower priority for a time","暂时把上大学这件事放在次要位置"],["Moving a college building behind a stove","把大学的一栋楼搬到炉子后面"],["Studying only how to cook","只学如何烹饪"],["Deciding never to learn anything again","决定再也不学任何东西"]],"key":0,"why":["Yao becomes a professional player first and gets a chance to go to university later. He sets aside his university plans for a time.","前文写进入职业篮球，后文写终于有机会读大学，说明是暂时把大学计划放后，而非永远放弃。"],"ev":[{"p":"P078","n":6,"quote":"It turned out that Yao showed so much promise as a basketball player that he began to play professionally and put college on the back burner for awhile."},{"p":"P078","n":8,"quote":"He finally has the chance to go to college, where he is studying economics and management."}]},{"id":"R6-P078-F3-01","skill":"F3","pages":["P078"],"src":8,"stem":["Why did Yao’s parents let him attend junior sports school?","姚明的父母为什么让他上少年体校？"],"o":[["They expected him to become an actor immediately.","他们希望他立刻成为演员。"],["They believed he had already graduated from college.","他们以为他已经大学毕业了。"],["They thought it would improve his chances of entering a good university.","他们认为这能让他更有机会进入好大学。"],["They wanted him to abandon education forever.","他们希望他永远放弃学业。"]],"key":2,"why":["Paragraph 5 directly states that his parents thought the school would improve his chances of getting into a good university.","第5段直接说明父母同意的动机是提高未来进入好大学的机会，不应把后来成为职业球员倒推为父母最初的目的。"],"ev":[{"p":"P078","n":5,"quote":"Yao’s parents allowed him to go because they knew his chances of eventually being accepted by a good university would increase."}]},{"id":"R6-P078-F2-01","skill":"F2","pages":["P078"],"src":6,"stem":["Which description best matches Yao as presented in the passage?","哪项最符合文中姚明的形象？"],"o":[["Levelheaded, hardworking, and humble","沉着理智、勤奋而谦逊"],["Rude and unwilling to adapt","粗鲁、不愿适应新环境"],["Interested only in fame and nothing else","一心只想着出名"],["Unfriendly toward his teammates and fans","对队友和球迷很不友好"]],"key":0,"why":["Paragraph 2 describes his levelheaded attitude, paragraph 7 shows his achievements, and paragraph 8 stresses his humility and his hopes of contributing off the court.","第2段强调沉着的态度，第7段展示专业成就，第8段强调谦逊和希望在球场外有所贡献。"],"ev":[{"p":"P078","n":2,"quote":"The stress and pressure might have proven to be too much for many young athletes, but Yao Ming’s good nature and levelheaded attitude allowed him to quickly become one of the most popular and well-respected young basketball players today."},{"p":"P078","n":8,"quote":"Although his basketball career was cut short, Yao is still the same generous, humble, and likable person he was before his basketball career took off and placed him in the spotlight."}]},{"id":"R6-P080-E1-01","skill":"E1","pages":["P080"],"src":8,"stem":["What is the main purpose of this passage?","本文的主要写作目的是什么？"],"o":[["To persuade readers to buy a particular wheelchair","说服读者购买某种轮椅"],["To explain the origins and some rules of wheelchair basketball","介绍轮椅篮球的起源和部分规则"],["To narrate one imaginary player’s dream","讲述一个虚构球员的梦想"],["To teach the steps for treating an injury","教授处理伤势的步骤"]],"key":1,"why":["The first four paragraphs describe the sport's origins, and the remaining paragraphs explain how it is played.","前四段追溯这项运动的起源，后四段介绍规则，整体目的是说明。"],"ev":[{"p":"P080","n":1,"quote":"It was this desire for activity that gave birth to wheelchair basketball."},{"p":"P080","n":5,"quote":"So, what makes wheelchair basketball different than the game you usually see on television or at the school gym?"}]},{"id":"R6-P080-C4-01","skill":"C4","pages":["P080"],"src":9,"stem":["The Latin root “mob” means “move.” Which word in paragraph 1 contains this root?","拉丁语词根 mob 意为“移动”。第1段中的哪个词含有这个词根？"],"o":[["Hospitals","hospitals（医院）"],["Veterans","veterans（退伍军人）"],["Mobility","mobility（行动能力）"],["Energy","energy（精力）"]],"key":2,"why":["'Mobility' contains the root 'mob'. In context, veterans used wheelchairs to move around.","mobility 含有与 move 有关的词根 mob，句中 needing wheelchairs for mobility 指依靠轮椅移动。"],"ev":[{"p":"P080","n":1,"quote":"After World War II, many injured veterans returned home needing wheelchairs for mobility."}]},{"id":"R6-P080-B5-01","skill":"B5","pages":["P080"],"src":4,"stem":["Under the rule described, which action would cause a physical advantage foul?","根据文中所述规则，哪个动作会被判为身体优势犯规？"],"o":[["Using the legs to lift the body out of the seated position","用腿撑起身体，离开座位"],["Rolling the wheelchair while remaining seated","坐在座位上推动轮椅"],["Keeping the body firmly seated while passing","传球时稳稳地坐在座位上"],["Catching a pass without lifting out of the seat","身体不离开座位，接住传球"]],"key":0,"why":["The rule requires players to remain fully seated. Using the legs to lift the body from the seat would therefore be a physical advantage foul.","将规则应用到新情境：原文要求保持坐姿，禁止利用身体优势将自己抬起，因此用腿撑起身体属于犯规。"],"ev":[{"p":"P080","n":7,"quote":"This foul rule states that all players must remain firmly seated and may not use a physical advantage to raise themselves up in the wheelchair."},{"p":"P080","n":7,"quote":"This foul rule states that all players must remain firmly seated and may not use a physical advantage to raise themselves up in the wheelchair."}]},{"id":"R6-P082-F6-01","skill":"F6","pages":["P082"],"src":1,"stem":["What does the running-shoes-and-loafers comparison explain?","拿跑鞋和便鞋作比较，说明了什么？"],"o":[["Both kinds of tires are made from shoes.","两种轮胎都是用鞋做成的。"],["Wheelchair racing does not require any equipment.","轮椅竞速不需要任何装备。"],["Racing tires and everyday tires are suited to different purposes.","竞速轮胎和日常轮胎适合不同用途。"],["Everyday tires are always faster than racing tires.","日常轮胎总是比竞速轮胎快。"]],"key":2,"why":["Running shoes and loafers are suited to different uses. The comparison explains why racing tires differ from tires used for everyday travel.","跑鞋适合运动、便鞋适合日常穿着；这个类比帮助说明比赛轮胎和日常轮胎的用途差异。"],"ev":[{"p":"P082","n":9,"quote":"“It’s kind of like the difference between wearing running shoes and loafers.”"}]},{"id":"R6-P082-F2-01","skill":"F2","pages":["P082"],"src":8,"stem":["Which traits best describe Uncle Jorge?","哪些特点最符合豪尔赫叔叔？"],"o":[["Competitive, determined, and enthusiastic","好胜、有决心、热情"],["Lonely, uninterested, and unwilling to train","孤独、没兴趣、不愿训练"],["Careless about preparation and opposed to competition","不认真准备、反对比赛"],["Impatient with every visitor and afraid of races","对每个来访者都不耐烦、害怕比赛"]],"key":0,"why":["He sticks to his training, competes with a friend, and looks forward to having his family cheer. His actions show determination, competitiveness, and enthusiasm.","他坚持训练、与朋友友好竞争，还期待亲友助威，支持这些特点。不能仅因坐轮椅就推断性格或能力。"],"ev":[{"p":"P082","n":7,"quote":"We have a friendly competition going, so that’s given me incentive to stick to my training schedule.”"},{"p":"P082","n":13,"quote":"“I’m going to need the biggest cheering section I can get!”"}]},{"id":"R6-P082-B2-01","skill":"B2","pages":["P082"],"src":2,"stem":["How is the racing chair different from Uncle Jorge’s everyday chair?","竞速轮椅和豪尔赫叔叔平时使用的轮椅有什么不同？"],"o":[["It is described as identical in every way.","两辆轮椅完全一样。"],["It must be carried rather than rolled.","得搬着走，不能用轮子移动。"],["It has no large wheels at all.","它完全没有大轮子。"],["It has an additional smaller wheel in front.","它前面多一个小轮子。"]],"key":3,"why":["Paragraph 9 says that both chairs have two large wheels and that the racing chair also has a smaller front wheel.","第9段先说两种椅子都有两个大轮子，再用 but 引出比赛轮椅前面多一个小轮子。"],"ev":[{"p":"P082","n":9,"quote":"“It has two large wheels like this chair does,” he said, gesturing to his wheelchair, “but it also has a third, smaller wheel in front."}]},{"id":"R6-P084-A4-01","skill":"A4","pages":["P084"],"src":7,"stem":["Which theme is best supported by the story?","故事最能支持哪个主题？"],"o":[["Preparation cannot affect how a person feels.","做好准备无法影响人的感受。"],["Winning matters more than helping other people.","获胜比帮助别人更重要。"],["It is always better to avoid asking for help.","最好永远避免向别人求助。"],["Friends can help one another gain confidence and face challenges.","朋友可以帮彼此增强信心、面对挑战。"]],"key":3,"why":["Julio listens to Tasha, reminds her how well she has trained, and suggests whom to ask for donations. His support helps her gain confidence.","Julio 听取 Tasha 的担忧，提醒她的训练成果并提出募款建议，最终她更有信心；主题需概括这一发展。"],"ev":[{"p":"P084","n":7,"quote":"I can help you with that part."},{"p":"P084","n":10,"quote":"“I definitely feel like I can do this now.”"}]},{"id":"R6-P084-F3-01","skill":"F3","pages":["P084"],"src":1,"stem":["What is Tasha’s main concern at the beginning?","故事开头，塔莎最担心什么？"],"o":[["Asking people to sponsor her and possibly disappointing them","开口请人赞助，以及可能让赞助人失望"],["Finding someone to bake pretzels","找人烤椒盐卷饼"],["Choosing a new pair of roller blades","挑一双新直排轮滑鞋"],["Traveling to another country for the race","为参加比赛去另一个国家"]],"key":0,"why":["In paragraph 4, Tasha worries about asking for sponsors. In paragraph 6, she adds that people might decline or that she might fail to finish after they pledge support.","第4段明确说她害怕开口找赞助，第6段补充担心没人参加或自己完不成比赛。"],"ev":[{"p":"P084","n":4,"quote":"“I’m really nervous about asking other people to sponsor me for this race,” she confessed."},{"p":"P084","n":6,"quote":"“It shouldn’t be a big deal, but I’m just afraid that no one will want to participate, or that they’ll pledge to support me and I won’t be able to finish the race for some reason.”"}]},{"id":"R6-P084-C5-01","skill":"C5","pages":["P084"],"src":10,"stem":["What does Julio mean by “a piece of cake”?","胡利奥说比赛是“a piece of cake”，是什么意思？"],"o":[["The race should be manageable for Tasha after her preparation.","塔莎已经做了准备，应该能轻松应付比赛。"],["The race will require carrying a dessert.","比赛要求带一份甜点。"],["The course has been replaced by a bakery.","赛道被面包店取代了。"],["Tasha must eat cake before she can run.","塔莎得先吃蛋糕才能跑。"]],"key":0,"why":["'A piece of cake' means something easy to do. Julio says this because Tasha has already managed to run the full three miles in training.","这个习语表示“轻而易举的事”。Julio 根据她已能跑完三英里的训练情况鼓励她。"],"ev":[{"p":"P084","n":7,"quote":"We’ve both been able to run the entire three miles for the last month."},{"p":"P084","n":7,"quote":"This race is going to be a piece of cake for you.”"}]},{"id":"R6-P086-E5-01","skill":"E5","pages":["P086"],"src":null,"stem":["Who is the most likely intended audience?","本文最可能写给谁看？"],"o":[["Experienced airplane engineers","经验丰富的飞机工程师"],["People beginning a running routine","刚开始养成跑步习惯的人"],["Readers looking only for fictional ghost stories","只想读虚构鬼故事的读者"],["Museum staff cataloging diamonds","负责给钻石编目的博物馆工作人员"]],"key":1,"why":["The preparation tips and gradual walk-run plan are designed for people starting a running routine.","标题、训练前准备、跑走交替和循序渐进的建议都面向初学跑步的人。"],"ev":[{"p":"P086","n":1,"quote":"The best way to begin training is by alternately walking and running."},{"p":"P086","n":"u1","quote":"Before you begin training:"}]},{"id":"R6-P086-B5-01","skill":"B5","pages":["P086"],"src":null,"stem":["According to the passage, what should a beginner do if the first week’s sequence still feels challenging?","根据本文，如果初学者觉得第一周的训练安排仍然吃力，应该怎么做？"],"o":[["Immediately run continuously for thirty minutes.","立刻连续跑30分钟。"],["Increase the running time every day regardless of comfort.","不管跑得舒不舒服，都每天延长跑步时间。"],["Stop taking rest days.","取消休息日。"],["Repeat that sequence for another week.","按原来的安排再练一周。"]],"key":3,"why":["Paragraph 2 says that if the routine still feels challenging, the runner should repeat it for another week.","把第2段的条件建议应用到具体情况：仍有挑战时继续原方案一周，而非强行升级。此题考查对本文建议的理解。"],"ev":[{"p":"P086","n":2,"quote":"If it still feels challenging, continue with it for another week."}]},{"id":"R6-P086-A3-01","skill":"A3","pages":["P086"],"src":5,"stem":["Which sentence best summarizes paragraph 5?","哪句话最能概括第5段？"],"o":[["Running is the only useful kind of exercise.","跑步是唯一有用的运动。"],["Rest days should always be avoided.","永远不该安排休息日。"],["Keep a journal only about the weather.","只在日志里记录天气。"],["Vary exercise activities and include regular rest to support recovery.","多做几种运动，也要定期休息，让身体恢复。"]],"key":3,"why":["Paragraph 5 recommends cross-training with different activities and taking at least one rest day each week. A good summary includes both ideas.","第5段主要有两项建议：用其他活动进行交叉训练，以及每周至少休息一天。总结应同时覆盖两点。"],"ev":[{"p":"P086","n":5,"quote":"The days of the week that you don’t run, try some different kinds of fitness activities, like hiking, ice skating, jumping rope, or playing basketball."},{"p":"P086","n":5,"quote":"Don’t forget to schedule at least one day of rest every week."}]},{"id":"R6-P088-F6-01","skill":"F6","pages":["P088"],"src":12,"stem":["What effect does describing the sun as “a ball of fire” create?","把太阳形容成“a ball of fire（一团火球）”产生了什么效果？"],"o":[["It gives a vivid image of the sun’s bright, warm appearance at sunset.","让人仿佛看见夕阳明亮而温暖的样子。"],["It proves the sun has fallen into the ocean.","证明太阳掉进了海里。"],["It explains the chemical cause of bioluminescence.","解释了生物发光的化学成因。"],["It shows that the family is standing beside an actual fireball.","说明一家人正站在一个真实的火球旁边。"]],"key":0,"why":["Calling the sun a ball of fire creates a vivid image of the brightness and warm color of the sunset.","直接把太阳写成火球是比喻，突出了日落的明亮与色彩；不是说明海面发光成因的科学解释。"],"ev":[{"p":"P088","n":1,"quote":"The sun was a ball of fire as it slipped into the ocean and left a peach-colored glow in the sky."}]},{"id":"R6-P088-E4-01","skill":"E4","pages":["P088"],"src":null,"stem":["Which mood is created by the discovery of the glowing water?","发现水在发光的情节营造了怎样的氛围？"],"o":[["Wonder and excitement","惊奇、兴奋"],["Bitterness and resentment","苦涩、怨愤"],["Despair about an unavoidable disaster","面对无法避免的灾难感到绝望"],["Boredom and indifference","无聊、冷淡"]],"key":0,"why":["The burst of green light and the characters' amazement create a mood of wonder and excitement.","爆发的绿光、惊叹 incredible 和 amazement 等描写营造了惊奇与兴奋的氛围。"],"ev":[{"p":"P088","n":7,"quote":"There was an explosion of milky-green light where Sophie kicked."},{"p":"P088","n":9,"quote":"“This is incredible,” she said swirling her hands in the water."},{"p":"P088","n":10,"quote":"He nodded, and even in the dim light Sophie and Miles could see the look of amazement on their dad’s face."}]},{"id":"R6-P088-H2-01","skill":"H2","pages":["P088","P090"],"src":null,"stem":["How does P088 present bioluminescence differently from P090?","第88页和第90页介绍生物发光的方式有什么不同？"],"o":[["P088 follows a family’s discovery through dialogue; P090 explains the phenomenon and its uses.","第88页用对话讲述一家人的发现过程。第90页解释这种现象及其用途。"],["Both are first-person diaries written by the same child.","两篇都是同一个孩子写的第一人称日记。"],["P088 lists only definitions; P090 is told entirely as a family conversation.","第88页只列了定义。第90页全篇都是家人的对话。"],["P088 is a poem, while P090 gives only a shopping list.","第88页是一首诗。第90页只有一份购物清单。"]],"key":0,"why":["Page 88 introduces bioluminescence through a family's discovery and dialogue. Page 90 defines it and organizes the explanation around different uses.","P088 通过海边情节、人物惊叹和对话引出知识；P090 按定义及不同用途展开说明，比较的是呈现方式与组织。"],"ev":[{"p":"P088","n":7,"quote":"“Miles,” said Sophie after a few minutes, “do you notice anything weird about the water?"},{"p":"P090","n":2,"quote":"It refers to organisms that produce light as a result of a chemical reaction."},{"p":"P090","n":3,"quote":"Ocean animals use bioluminescence in various ways."}]},{"id":"R6-P090-B4-01","skill":"B4","pages":["P090"],"src":4,"stem":["Which detail explains how the bobtail squid uses light as camouflage?","哪个细节说明耳乌贼怎样利用光来伪装？"],"o":[["It grows wings so it can leave the water.","它长出翅膀，这样就能离开水。"],["It imitates the sound of a much larger animal.","它模仿一种体型大得多的动物的声音。"],["Its glowing underside can blend with the stars when viewed from below.","从下方看，它发光的腹面能融入星光。"],["It always hides inside a discarded lightbulb.","它总是躲在被扔掉的灯泡里。"]],"key":2,"why":["Paragraph 3 explains how the light on the bobtail squid's underside blends with starlight when viewed from below. Paragraph 5 describes a different squid's escape strategy.","第3段专门解释 bobtail squid 的隐蔽方式：从下方看，腹部光与星光混合。第5段的发光化学云属于另一种鱿鱼的脱逃方式，不能混为一谈。"],"ev":[{"p":"P090","n":3,"quote":"However, if you were a predator hunting a bobtail squid and you looked up at the squid’s belly, its bioluminescence would allow it to blend with the stars of the night sky."}]},{"id":"R6-P090-C4-01","skill":"C4","pages":["P090"],"src":null,"stem":["The passage explains “bios” as “living” and “lumen” as “light.” What does “bioluminescence” refer to?","文中说 bios 意为“有生命的”，lumen 意为“光”。bioluminescence 指什么？"],"o":[["Any sound made by a sea animal","海洋动物发出的任何声音"],["Light produced by living organisms","生物发出的光"],["A measurement of ocean depth","衡量海洋深度的一种方法"],["Heat made only by electric lamps","只有电灯才会产生的热量"]],"key":1,"why":["The roots mean 'living' and 'light'. Together they point to the definition: light produced by living organisms.","将两个词源含义组合为“生命＋光”，再与后面的定义核对，即生物体产生的光。"],"ev":[{"p":"P090","n":2,"quote":"The word bioluminescence (bahy-oh-loo-muh-nes-uhns) comes from the Greek word bios, which means living, and the Latin word lumen, which means light."},{"p":"P090","n":2,"quote":"It refers to organisms that produce light as a result of a chemical reaction."}]},{"id":"R6-P092-D1-01","skill":"D1","pages":["P092"],"src":7,"stem":["Which event is the story’s main turning point or climax?","哪件事是故事的主要转折点或高潮？"],"o":[["The family begins walking along the beach.","一家人开始沿着海滩散步。"],["Mile
