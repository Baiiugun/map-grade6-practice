paragraph"},{"n":7,"t":["The devastation of the 1946 tsunamis led a team of scientists and government officials to create the Pacific Tsunami Warning System. They hoped that people would never again suffer such great losses because they were unaware of a tsunami’s approach. They set up a system to monitor earthquakes that could cause tsunami. They also determined ways to predict the time of arrival of tsunamis so that people would have a chance to evacuate.","1946年海啸造成的巨大破坏，促使一组科学家和政府官员建立了太平洋海啸预警系统。他们希望人们再也不要因为不知道海啸正在逼近而遭受如此惨重的损失。他们建立系统来监测可能引起海啸的地震，还制定了预测海啸抵达时间的方法，让人们有机会撤离。"],"type":"paragraph"},{"n":8,"t":["Unfortunately, there was no such warning system covering the Indian Ocean on December 26, 2004. An enormous earthquake took place and triggered the deadliest tsunami in history. Countries like Thailand, India, and Indonesia were especially hard hit. The loss of life was devastating, and people all around the world reached out to help the victims.","遗憾的是，2004年12月26日，印度洋还没有这样的预警系统。一场强烈的地震引发了历史上最致命的海啸。泰国、印度和印度尼西亚等国受灾尤为严重。人员伤亡惨重，世界各地的人都向受灾者伸出了援手。"],"type":"paragraph"},{"n":9,"t":["Plans are being made to create a global tsunami monitoring system. No system is perfect, but as technology advances, humans will learn better ways to protect themselves against some of the most incredible and powerful forces of nature.","人们正在规划建立全球海啸监测系统。任何系统都有局限，不过随着技术进步，人类会找到更好的办法保护自己，以应对大自然中一些最惊人、最强大的力量。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Check the line beside the word that best describes what type of passage this is.\n\n- ________ biography\n- ________ informational\n- ________ fiction","勾选最符合本文体裁的一项。\nA. 传记\nB. 说明文\nC. 虚构故事"],"ans":["✓ informational","B. 说明文。"]},{"n":2,"ask":["What does the word *tsunami* mean in Japanese?\n\n________","tsunami 在日语里是什么意思？"],"ans":["harbor wave","港湾的浪。"]},{"n":3,"ask":["What are two possible causes of tsunamis?\n\n________","海啸可能由哪两个原因引起？"],"ans":["earthquake or underwater volcanic eruption","地震或海底火山喷发。"]},{"n":4,"ask":["What is one way in which tsunamis are different than other waves?\n\n________","海啸和其他海浪有哪一点不同？"],"ans":["Answers will vary. Possible answer: They are larger and last longer.","答案可以不同。参考答案：海啸的浪更大，持续的时间更长。"]},{"n":5,"ask":["What is one positive effect of the 1946 tsunamis?\n\n________","1946年的海啸带来了什么积极的变化？"],"ans":["creation of the Pacific Tsunami Warning System","建立了太平洋海啸预警系统。"]},{"n":6,"ask":["Name three countries that were affected by the tsunami of 2004.\n\n________","说出三个受到2004年海啸影响的国家。"],"ans":["Thailand, India, Indonesia","泰国、印度、印度尼西亚。"]},{"n":7,"ask":["Why didn’t the Pacific Tsunami Warning System alert people of the 2004 tsunami?\n\n________","太平洋海啸预警系统为什么没能就2004年的海啸向人们发出警报？"],"ans":["There was no warning system for the Indian Ocean.","当时印度洋没有预警系统。"]},{"n":8,"ask":["Tsunamis can cause great ________.\n\n- accuracy\n- destruction\n- earthquakes","海啸可能造成极大的 _____。\naccuracy（准确性）\ndestruction（破坏）\nearthquakes（地震）"],"ans":["○ destruction","destruction（破坏）"],"dir":["Circle the word that best completes each sentence below.","圈出最适合填入下列各句的词。"]},{"n":9,"ask":["Scientists are looking for ways to be able to better ________ the arrival of tsunamis.\n\n- explain\n- control\n- predict","科学家正在研究怎样更好地 _____ 海啸的到来。\nexplain（解释）\ncontrol（控制）\npredict（预测）"],"ans":["○ predict","predict（预测）"]},{"n":10,"ask":["Tsunamis are not ________ caused by meteorites.\n\n- frequently\n- oddly\n- powerfully","陨石引发海啸的情况并不 _____。\nfrequently（经常）\noddly（奇怪地）\npowerfully（强有力地）"],"ans":["○ frequently","frequently（经常），与原句中的 not 连用。"]}]},{"id":"P070","title":["Creatures of the Night","夜行生灵"],"lead":["Do you have bats in your neighborhood? If you do, at what times of day have you seen them?","你家附近有蝙蝠吗？如果有，你在一天中的什么时间见过它们？"],"exercise":"P071","genre":"故事","family":"lit","parts":[{"n":1,"t":["Charley and Mattie Rosen helped their parents clean up after dinner. Charley rinsed the dishes in a tub of clean water and then handed them to his mom to be dried. Mattie gathered firewood so that they could make s’mores and tell scary stories. Mattie loved the smell of wood smoke and the taste of gooey marshmallows melting the chocolate between crisp graham crackers.","吃过晚饭，查利和马蒂·罗森帮父母收拾。查利用一盆清水冲洗餐具，再递给妈妈擦干。马蒂去捡柴，好生火烤棉花糖夹心饼干，再讲些吓人的故事。马蒂最喜欢柴火烟的气味，也爱吃两片酥脆全麦饼干夹着黏软的烤棉花糖和被棉花糖烫化的巧克力。"],"type":"paragraph"},{"n":2,"t":["“How much more wood do we need, Dad?” asked Mattie, setting a small stack beside her father.","“爸爸，还要多少柴？”马蒂一边问，一边在父亲身旁放下一小堆柴。"],"type":"paragraph"},{"n":3,"t":["“I think that should last us for a while, Mattie,” replied Mr. Rosen. Mattie brushed her hands on her jeans and crouched beside her dad to watch as the fire grew larger and hotter.","“马蒂，我想这些够我们烧一阵子了。”罗森先生答道。马蒂把手在牛仔裤上擦了擦，蹲在爸爸身边，看着火越烧越旺。"],"type":"paragraph"},{"n":4,"t":["“Look at those birds!” exclaimed Charley, pointing a soapy finger at the sky. His parents and Mattie followed his finger and saw what appeared to be a flock of birds swooping out of a tree into the deep blue sky of twilight.","“快看那些鸟！”查利大声叫道，伸出沾着肥皂泡的手指，指向天空。父母和马蒂顺着他手指的方向看去，只见一群像鸟一样的东西从树上俯冲而出，飞进暮色中深蓝的天空。"],"type":"paragraph"},{"n":5,"t":["“I don’t think those are birds, Charley,” said Mrs. Rosen, drying her hands on a dishtowel. “I’m pretty sure they’re bats. You can tell by the way they fly. See how jerky their movements are? Birds seem to fly more gracefully than bats do.”","“查利，我看那些不是鸟。”罗森太太用擦碗布擦着手说，“我敢肯定是蝙蝠。从它们飞行的样子就能看出来。你看，它们的动作是不是一顿一顿的？鸟飞起来好像比蝙蝠更优雅。”"],"type":"paragraph"},{"n":6,"t":["“Shouldn’t we get into the tent?” asked Charley nervously. “Vampire bats can suck your blood, can’t they?”","“我们是不是该进帐篷？”查利紧张地问，“吸血蝙蝠会吸人的血，对吧？”"],"type":"paragraph"},{"n":7,"t":["Mr. Rosen chuckled. “I don’t think we have to worry too much about that. There are only a few species of vampire bats in the world, and none of them live in North America. Besides, even vampire bats don’t feed on human blood.”","罗森先生笑了。“我想不用太担心。世界上只有几种吸血蝙蝠，北美洲一种也没有。再说，就连吸血蝙蝠也不靠喝人血为生。”"],"type":"paragraph"},{"n":8,"t":["“What about rabies?” asked Mattie, leaning in closer to her dad.","“那狂犬病呢？”马蒂一边问，一边往爸爸身边靠了靠。"],"type":"paragraph"},{"n":9,"t":["“Bats can carry rabies, but it’s quite unusual,” said Mrs. Rosen. “We’re not going to have close contact with the bats, so it’s not anything we need to worry about.”","“蝙蝠有可能携带狂犬病病毒，不过这不太常见，”罗森太太说，“我们不会跟蝙蝠有近距离接触，用不着担心。”"],"type":"paragraph"},{"n":10,"t":["“Didn’t I ever tell you kids about my trip to Bracken Cave when I was in college?” Mrs. Rosen asked. Mattie and Charley shook their heads, but they kept an eye on the sky.","“我没跟你们说过我上大学时去布拉肯洞的事吗？”罗森太太问。马蒂和查利摇了摇头，眼睛却还盯着天空。"],"type":"paragraph"},{"n":11,"t":["“Well,” said Mrs. Rosen, “I was visiting a classmate from school who lived in San Antonio, Texas. She had told me all about a place called Bracken Cave. About 20 million Mexican free-tailed bats go there every year to give birth and raise their young.”","“是这么回事，”罗森太太说，“我当时去得克萨斯州圣安东尼奥看一位住在那里的同学。她给我讲了不少关于布拉肯洞的事。每年有大约2000万只墨西哥犬吻蝠到那里产仔，养育幼崽。”"],"type":"paragraph"},{"n":12,"t":["“Twenty million bats?” said Mattie and Charley incredulously.","“2000万只蝙蝠？”马蒂和查利简直不敢相信。"],"type":"paragraph"},{"n":13,"t":["Mrs. Rosen nodded. “Watching them come out of the cave at night was one of the most remarkable things I have ever seen. The entire sky seemed to fill with them. Conservationists say that the bats from Bracken Cave eat about 200 tons of insects each summer evening.”","罗森太太点了点头。“晚上看它们飞出洞穴，那是我见过的最惊人的景象之一。整个天空好像都布满了蝙蝠。自然保护工作者说，夏天每到傍晚，布拉肯洞的蝙蝠会吃掉大约200吨昆虫。”"],"type":"paragraph"},{"n":14,"t":["The Rosens sat quietly, looking up at the sky as it darkened. The fire gave off a gentle glow as they patiently waited, hoping to catch another glimpse of the bats as they set out on their evening’s activities.","罗森一家静静坐着，仰望逐渐变暗的天空。篝火发出柔和的光，他们耐心地等着，希望能再看一眼出发去进行夜间活动的蝙蝠。"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ I love making s’mores!","我爱做烤棉花糖夹心饼干！"],"ans":["F","第一人称（F）"],"dir":["Mark each sentence below **F** if it is in first-person point of view and **T** if it is in third-person point of view.","判断下列句子采用的人称。第一人称标 F，第三人称标 T。"]},{"n":2,"ask":["________ Charley rinsed the dishes in a tub of clean water.","查利用一盆清水冲洗餐具。"],"ans":["T","第三人称（T）"]},{"n":3,"ask":["________ I went to San Antonio to visit a friend from college.","我去圣安东尼奥看一位大学同学。"],"ans":["F","第一人称（F）"]},{"n":4,"ask":["________ Mr. Rosen said that vampire bats don’t live in North America.","罗森先生说吸血蝙蝠不生活在北美洲。"],"ans":["T","第三人称（T）"]},{"n":5,"ask":["________ Mattie gathered wood for the fire.","马蒂去捡了些柴来生火。"],"ans":["F","事实（F）"],"dir":["Write **F** before the sentences that are facts. Write **O** before the sentences that are opinions.","如果句子陈述的是事实，就在句前写 F。如果表达的是观点，就在句前写 O。"]},{"n":6,"ask":["________ Everything is more enjoyable when you are camping.","露营的时候，做什么都更有意思。"],"ans":["O","观点（O）"]},{"n":7,"ask":["________ Mexican free-tailed bats come to Bracken Cave to give birth and raise their young.","墨西哥犬吻蝠来到布拉肯洞产仔并养育幼崽。"],"ans":["F","事实（F）"]},{"n":8,"ask":["________ The sky is most beautiful at dusk.","黄昏时的天空最美。"],"ans":["O","观点（O）"]},{"n":9,"ask":["How do you think Mattie and Charley will feel the next time they see a bat? Why?\n________","你觉得下次见到蝙蝠时，马蒂和查利会有什么感受？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":10,"ask":["What ingredients are used to make s’mores?\n________","做烤棉花糖夹心饼干需要哪些材料？"],"ans":["graham crackers, chocolate, and marshmallows","全麦饼干、巧克力和棉花糖。"]},{"n":11,"ask":["Find one sentence that shows that Mattie enjoys camping. Write it on the lines below.\n________","找出一句能说明马蒂喜欢露营的话，把它写在横线上。"],"ans":["Answers will vary. Possible answer: Mattie loved the smell of wood smoke and taste of gooey marshmallows melting the chocolate between crisp graham crackers.","答案可以不同。参考答案：马蒂最喜欢柴火烟的气味，也爱吃两片酥脆全麦饼干夹着黏软的烤棉花糖和被棉花糖烫化的巧克力。"]},{"n":12,"ask":["Where is Bracken Cave located?\n________","布拉肯洞在哪儿？"],"ans":["Texas","得克萨斯州。"]},{"n":13,"ask":["watched or observed  ________","注视或观察"],"ans":["Kept an eye on","kept an eye on（一直留意）"],"dir":["Write the idiom from paragraph 10 on the line next to its meaning.","找出第10段中的习语，写在相应释义旁的横线上。"]}]},{"id":"P072","title":["Going Batty","认识蝙蝠"],"lead":["Keep reading to learn why many people try to attract bats to their yards and neighborhoods.","继续读下去，看看为什么许多人想把蝙蝠吸引到自己的院子和社区里。"],"exercise":"P073","genre":"科普说明文","family":"info","parts":[{"n":1,"t":["Some animals have good reputations. Most people think of dogs as being friendly and reliable. Kittens are sweet and cuddly. Everyone loves dolphins, seals, and chimpanzees. Other animals, such as bats, do not have nearly as positive a reputation. Many people are frightened of bats and believe that the small flying creatures will become tangled in their hair or give them rabies. There are many myths and superstitions surrounding bats. All of this makes it difficult for educators to get out the word that bats are actually wonderful, useful, and amazing creatures.","有些动物名声很好。大多数人觉得狗友善可靠。小猫可爱，让人想抱一抱。海豚、海豹和黑猩猩也惹人喜欢。另一些动物，比如蝙蝠，名声就差多了。许多人怕蝙蝠，以为这些会飞的小家伙会缠进头发，或把狂犬病传给人。关于蝙蝠的传言和迷信很多，这都让科普工作者很难向大家说明，蝙蝠其实是一种既奇妙又有用的动物。"],"type":"paragraph"},{"n":2,"t":["More than 1,100 species of bats can be found in almost every region of the world, except for the extreme polar and desert regions. Bats, the only flying mammals in the world, vary in size, coloring, and habits. The smallest bat in the world has a wingspan of only two inches and weighs less than a penny. The largest bat has a wingspan of about six feet. Most bats eat insects, but some species feed on fruit, pollen, and nectar, and others eat small animals like fish, frogs, and rodents. Although many scary stories tell of vampire bats, in reality, only three species out of more than one thousand survive on the blood of other animals.","除了条件极端的极地和沙漠，世界上几乎到处都有蝙蝠，种类超过1100种。蝙蝠是世界上唯一会飞的哺乳动物，体型、颜色和习性各不相同。世界上最小的蝙蝠翼展只有2英寸，还没有一枚一美分硬币重。最大的蝙蝠翼展约6英尺。大多数蝙蝠吃昆虫，也有一些以水果、花粉和花蜜为食，还有一些吃鱼、青蛙和啮齿动物等小动物。恐怖故事里常常出现吸血蝙蝠，实际上，一千多种蝙蝠中只有三种靠其他动物的血为生。"],"type":"paragraph"},{"n":3,"t":["Bats are useful creatures. They consume large quantities of insects every evening. A single common brown bat can eat as many as 2,000 insects a night. Imagine how many more mosquito bites you would have each summer if bats were not busy patrolling the night sky.","蝙蝠很有用，每天晚上都能吃掉大量昆虫。一只普通的棕蝠一晚可以吃多达2000只昆虫。要是少了蝙蝠在夜空忙着捕虫，想想你每年夏天得多挨多少蚊子叮咬。"],"type":"paragraph"},{"n":4,"t":["In addition, some bats pollinate plants and flowers. They suck the nectar from one plant and then transfer the plant’s pollen when they move on to feed from another plant. In rain forests, bats drop plant seeds as they move, which allows new plants to grow. In regions where the rain forests are in danger, bats perform a very important task, because they insure that new growth will replace plants and trees that have been cut down or destroyed.","有些蝙蝠还能帮植物传粉。它们吸食一种植物的花蜜，再去另一株植物上取食时，就把花粉带过去了。在雨林里，蝙蝠活动时会落下种子，让新植物长出来。在雨林受到威胁的地区，蝙蝠这项工作很重要，因为它们能让新长出的植物替代那些被砍伐或毁坏的树木和其他植物。"],"type":"paragraph"},{"n":5,"t":["Because bats are nocturnal creatures, they have the difficult task of flying and catching all their meals in total darkness. This does not present much of a problem for them, though, because they use a special technique called echolocation. Bats emit very high-pitched sounds that bounce off objects, no matter how small they are. Bats use the reflected sounds to form pictures in their brains of where things are located. It might not sound like a simple process, but it is obviously very effective. After all, they can find a mosquito flying through the air in complete darkness.","蝙蝠是夜行性动物，得在一片漆黑中飞行和捕食，这可不是件容易的事。不过，蝙蝠有一种叫作回声定位的特殊本领，所以黑暗对它们影响不大。蝙蝠发出频率很高的声音，无论物体有多小，声音撞上去都会反射回来。蝙蝠用回声在脑海中形成一幅图像，了解周围物体的位置。这过程听起来也许挺复杂，却显然很有效。毕竟，即使在一片漆黑中，它们也能找到一只正在空中飞行的蚊子。"],"type":"paragraph"},{"n":6,"t":["The next time you see the flutter of wings in the sky at dusk, there is no need to run for cover. Instead, think about the good deeds that bats perform for human beings and think about their incredible diversity. Maybe you’ll even decide to build a bat house in your backyard to encourage the furry flying creatures to take up residence nearby.","下次黄昏时看见空中有东西拍着翅膀飞过，你大可不必急着躲开。想想蝙蝠帮人类做了哪些好事，也想想它们的种类有多丰富吧。也许你甚至会决定在后院装一个蝙蝠箱，招引这些毛茸茸的小家伙来附近安家。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Explain how echolocation works.\n________","解释回声定位的原理。"],"ans":["Possible answer: Bats make a noise and then listen for its echo, forming a mental picture of their surroundings based on the way the echo sounds.","参考答案：蝙蝠发出声音后听回声，再根据回声在脑海中形成周围环境的图像。"]},{"n":2,"ask":["What is the author trying to persuade the reader of in this selection?\n________","作者试图让读者相信什么？"],"ans":["that bats are good creatures to have around","附近有蝙蝠是件好事。"]},{"n":3,"ask":["How can you encourage bats to live near your home?\n________","怎样吸引蝙蝠到你家附近生活？"],"ans":["by building a bat house","建一个蝙蝠箱。"]},{"n":4,"ask":["Why do you think some people are afraid of bats?\n________","你认为有些人为什么怕蝙蝠？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":5,"ask":["Write two ways in which species of bats may differ from one another.\n________","写出不同种类的蝙蝠可能存在的两个差异。"],"ans":["Possible answers: size, coloring, eating habits","参考答案：体型、体色、食性，任选两项。"]},{"n":6,"ask":["________ Some bats pollinate plants and flowers.","有些蝙蝠能给植物传粉。"],"ans":["T","正确（T）"],"dir":["Write T before the sentences that are true. Write F before the sentences that are false.","正确的句子在句前写 T，错误的句子在句前写 F。"]},{"n":7,"ask":["________ More than 3,000 species of bats exist.","现存的蝙蝠超过3000种。"],"ans":["F","错误（F）"]},{"n":8,"ask":["________ Bats are nocturnal creatures.","蝙蝠是夜行性动物。"],"ans":["T","正确（T）"]},{"n":9,"ask":["________ The smallest bat in the world weighs less than a penny.","世界上最小的蝙蝠比一枚一美分硬币还轻。"],"ans":["T","正确（T）"]},{"n":10,"ask":["________ Bats feed only on insects.","蝙蝠只吃昆虫。"],"ans":["F","错误（F）"]},{"n":11,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to instruct\n- ________ to inform\n- ________ to entertain","勾选最符合作者写作目的的一项。\nA. 指导读者\nB. 提供信息\nC. 娱乐读者"],"ans":["✓ to inform","B. 提供信息。"]},{"n":12,"ask":["In paragrah 6, the author mentions bats’ “incredible diversity.” What does this mean?\n________","第6段中，作者说蝙蝠有“incredible diversity”。这是什么意思？"],"ans":["Possible answers: There are many different bats with different types of characteristics.","参考答案：蝙蝠种类很多，各有不同的特征。"]},{"n":13,"ask":["After reading the article, has your opinion of bats changed? Explain.\n________","读完本文，你对蝙蝠的看法改变了吗？请说明。"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P074","title":["A Natural Bath","天然浴池"],"lead":["What surprise will Charley and Mattie find on the trail?","查利和马蒂会在徒步路上发现什么惊喜？"],"exercise":"P075","genre":"故事","family":"lit","parts":[{"n":1,"t":["The Rosens woke up early, even though they would have slept in at home if their alarm clocks weren’t set. There was something about camping that made them feel wide-awake and excited to start the day as soon as their eyes were open.","罗森一家很早就醒了。要是在家里，没设闹钟他们肯定会睡懒觉。露营有一种奇妙的魔力，让他们一睁眼就精神抖擞，迫不及待地想开始新的一天。"],"type":"paragraph"},{"n":2,"t":["They made breakfast over the propane stove. In just a few minutes, they sat down to a meal of coffee, hot cocoa, scrambled eggs, and granola with fresh blueberries.","他们用丙烷炉煮早餐。短短几分钟后，他们就坐下来享用咖啡、热可可、炒鸡蛋，还有拌了新鲜蓝莓的格兰诺拉麦片。"],"type":"paragraph"},{"n":3,"t":["As the Rosens ate, they discussed their plans for the day. “Dad and I looked at a map last night,” said Mrs. Rosen. “We found a nearby hiking trail that looks like it will be challenging but not too difficult. It has some beautiful scenic views, and best of all, there will be a surprise at the end of the trail.” She and Mr. Rosen exchanged secretive glances.","罗森一家边吃边聊当天的计划。“昨晚我和爸爸看过地图了，”罗森太太说，“附近有条徒步小径，走起来看样子有点挑战，但也不会太难。沿途有些地方景色很美，最好的是，小径尽头还有一个惊喜。”她和罗森先生神秘地交换了一下眼神。"],"type":"paragraph"},{"n":4,"t":["“What kind of surprise?” asked Mattie curiously.","“什么惊喜呀？”马蒂好奇地问。"],"type":"paragraph"},{"n":5,"t":["“It wouldn’t be a surprise if we told you,” laughed her mom. “But the sooner you two get ready to go, the sooner you’ll find out.”","“说出来就不算惊喜了，”妈妈笑着说，“你俩越快准备好出发，就能越快知道。”"],"type":"paragraph"},{"n":6,"t":["An hour later, everyone was ready to leave. They drove a short distance to the trailhead, gathered their hiking gear, and set out for the day. It was a good day for spotting wildlife. The trees were filled with birds, and dragonflies flitted along the path ahead of the Rosens. They stopped when they heard a rustle in the bushes and quietly watched as two deer delicately crossed the trail.","一小时后，大家都准备好了。他们开了一小段路，到达小径入口，拿上徒步装备，开始了这一天的行程。这天很适合观察野生动物。树上到处是鸟，蜻蜓在他们前面沿小径飞来飞去。听见灌木丛里窸窸窣窣作响，他们停下脚步，静静看着两只鹿轻轻走过小径。"],"type":"paragraph"},{"n":7,"t":["After they had been hiking for about an hour, the family stopped at a clearing and ate some dried apricots and almonds Mr. Rosen had packed. The snack gave them an energy boost, and just as they were about to get up, three quails wandered into sight. Charley reached for his camera and was able to snap a photo before the birds were startled and flew away.","走了大约一小时，一家人在一块空地停下，吃了些罗森先生带来的杏干和杏仁。吃了点心，他们恢复了体力。正要起身，三只鹌鹑溜达着进入了视野。查利伸手拿起相机，赶在那几只鸟受惊飞走前拍了一张照片。"],"type":"paragraph"},{"n":8,"t":["Feeling refreshed, the Rosens continued their hike. Mattie and Charley were in the midst of a heated discussion about what kind of snake they had just seen when they came to another clearing. Charley’s and Mattie’s eyes grew wide. They looked at their parents.","罗森一家恢复了精神，继续往前走。来到又一块空地时，马蒂和查利正在热烈地讨论刚才看到的是哪种蛇。两个孩子突然睁大了眼睛，转头看向父母。"],"type":"paragraph"},{"n":9,"t":["“Is this the surprise?” asked Mattie.","“这就是你们说的惊喜吗？”马蒂问。"],"type":"paragraph"},{"n":10,"t":["Mr. and Mrs. Rosen smiled as they walked over to one of the small pools. Wisps of steam rose into the air, and there was a damp, earthy smell around them. “They’re hot springs,” explained Mrs. Rosen, reaching down to untie her hiking boots. “The water is heated by geothermal heat, which means that the heat is produced from inside Earth.”","罗森夫妇笑着向其中一个小水池走去。一缕缕热气升到空中，四周闻得到湿润的泥土气息。“这是温泉，”罗森太太弯腰解开徒步靴的鞋带，解释道，“水是靠地热加热的，也就是说，热量来自地球内部。”"],"type":"paragraph"},{"n":11,"t":["“Places where there are hot springs are usually places where magma lies close to Earth’s surface,” added Mr. Rosen. “It heats the water, which creates the hot springs.”","“有温泉的地方，岩浆通常离地表很近，”罗森先生补充说，“岩浆把水加热，就形成了温泉。”"],"type":"paragraph"},{"n":12,"t":["“If we had our bathing suits, could we get in the water? asked Charley.","“要是我们带了泳衣，可以下水吗？”查利问。"],"type":"paragraph"},{"n":13,"t":["Mrs. Rosen nodded. “Your bathing suits are in my backpack,” she said, lowering her feet into the steaming water.","罗森太太点点头。“你们的泳衣就在我的背包里，”她一边说，一边把脚伸进热气腾腾的水里。"],"type":"paragraph"},{"n":14,"t":["Charley and Mattie rummaged through the backpack looking for their suits. “This is a great surprise, Mom and Dad!” exclaimed Mattie, as she headed behind a tree to change. “I never would have guessed in a million years!”","查利和马蒂在背包里翻找自己的泳衣。“爸爸妈妈，这惊喜太棒了！”马蒂一边叫着，一边走到树后换衣服。“我猜一百万年也猜不到！”"],"type":"paragraph"},{"n":"t1","t":["Healing Spring | 86 | Roanoke | Virginia","疗愈泉｜86｜罗阿诺克｜弗吉尼亚州"],"type":"row"},{"n":"t2","t":["Scenic Hot Springs | 122 | Seattle | Washington","风景温泉｜122｜西雅图｜华盛顿州"],"type":"row"},{"n":"t3","t":["Baker Hot Spring | 108 | Concrete | Washington","贝克温泉｜108｜康克里特｜华盛顿州"],"type":"row"},{"n":"t4","t":["Caddo Gap Springs | 95 | Little Rock | Arknasas","卡多峡谷泉｜95｜小石城｜阿肯色州"],"type":"row"},{"n":"t5","t":["Morning Mist Springs | 205 | Ashton | Wyoming","晨雾泉｜205｜阿什顿｜怀俄明州"],"type":"row"}],"original":[{"n":1,"ask":["Number the events below to show the order in which they happened.\n\n- ________ The Rosens drove to the trailhead.\n- ________ Mrs. Rosen lowered her feet into the water.\n- ________ Charley and Mattie looked for their bathing suits.\n- ________ The Rosens made scrambled eggs.\n- ________ Charley took a picture of the quails.","给下列事件编号，表示它们发生的先后顺序。\n罗森一家开车前往小径入口。\n罗森太太把脚伸进水里。\n查利和马蒂寻找自己的泳衣。\n罗森一家做了炒鸡蛋。\n查利给鹌鹑拍了照片。"],"ans":["- **2** The Rosens drove to the trailhead.\n- **4** Mrs. Rosen lowered her feet into the water.\n- **5** Charley and Mattie looked for their bathing suits.\n- **1** The Rosens made scrambled eggs.\n- **3** Charley took a picture of the quails.","2. 罗森一家开车前往小径入口。\n4. 罗森太太把脚伸进水里。\n5. 查利和马蒂寻找自己的泳衣。\n1. 罗森一家做了炒鸡蛋。\n3. 查利给鹌鹑拍了照片。"]},{"n":2,"ask":["Find the example of hyperbole in paragraph 14, and write it on the line below. Then, explain what you think it means.\n________","找出第14段中夸张修辞的例子，写在横线上。再解释你认为它是什么意思。"],"ans":["I never would have guessed in a million years; Answers will vary.","I never would have guessed in a million years（我猜一百万年也猜不到）。解释可以不同。"]},{"n":3,"ask":["**Dialogue** is what a character says. The words in dialogue are always in quotation marks. On the line below, write the words that are dialogue in paragraph 13.\n________","对话是人物说的话。英语里，对话总是用引号括起来。把第13段中的对话写在下面的横线上。"],"ans":["Your bathing suits are in my backpack.","Your bathing suits are in my backpack.（你们的泳衣就在我的背包里。）"]},{"n":4,"ask":["Why do you think “Charley’s and Mattie’s eyes grew wide” in paragraph 8?\n________","第8段里，查利和马蒂为什么会睁大眼睛？"],"ans":["They saw the surprise and were excited.","他们看到了惊喜，很兴奋。"]},{"n":5,"ask":["What is the setting for this story?\n________","故事发生在哪里？"],"ans":["a campsite and a hiking trail","露营地和徒步小径。"]},{"n":6,"ask":["Which hot spring has the hottest water?\n________","哪一处温泉的水最热？"],"ans":["Morning Mist Springs","晨雾泉。"],"fig":true,"dir":["Use the table below to answer the questions that follow.","根据下表回答接下来的问题。"]},{"n":7,"ask":["What is the name of the spring located near Seattle, Washington?\n________","华盛顿州西雅图附近的泉叫什么名字？"],"ans":["Scenic Hot Springs","风景温泉。"]},{"n":8,"ask":["Where is Caddo Gap Springs located?\n________","卡多峡谷泉在哪里？"],"ans":["Little Rock, AR","阿肯色州小石城。"]}],"note":"英文数据表保留原书州名拼写 Arknasas，对应 Arkansas（阿肯色州）。","fig":{"kind":"table","page":"P075","title":["Hot springs","温泉"],"headers":[["Spring","泉名"],["Temp (°F)","水温（°F）"],["Area","地区"],["State","州"]],"rows":[{"n":"t1","cells":[["Healing Spring","疗愈泉"],["86","86"],["Roanoke","罗阿诺克"],["Virginia","弗吉尼亚州"]]},{"n":"t2","cells":[["Scenic Hot Springs","风景温泉"],["122","122"],["Seattle","西雅图"],["Washington","华盛顿州"]]},{"n":"t3","cells":[["Baker Hot Spring","贝克温泉"],["108","108"],["Concrete","康克里特"],["Washington","华盛顿州"]]},{"n":"t4","cells":[["Caddo Gap Springs","卡多峡谷泉"],["95","95"],["Little Rock","小石城"],["Arknasas","阿肯色州"]]},{"n":"t5","cells":[["Morning Mist Springs","晨雾泉"],["205","205"],["Ashton","阿什顿"],["Wyoming","怀俄明州"]]}]}},{"id":"P076","title":["A Hot Topic","温泉这个热门话题"],"lead":["Have you ever visited a natural hot spring?","你去过天然温泉吗？"],"exercise":"P077","genre":"说明文","family":"info","parts":[{"n":1,"t":["People visiting Hot Springs, Arkansas, get to take part in a tradition that is thousands of years old. Many years before the arrival of Europeans, Native Americans used the clean, fresh, hot water that burbled to the surface of Earth. Stone artifacts found in the vicinity led archaeologists to conclude that the springs were a place for different Native American tribes to bathe, relax, trade, and hunt.","阿肯色州温泉城的游客可以体验一项已有数千年历史的传统。早在欧洲人到来前许多年，美洲原住民就开始使用从地下汩汩涌出的洁净温热淡水。考古学家从附近出土的石制器物推断，不同的原住民部落曾到泉边沐浴、放松、交易和狩猎。"],"type":"paragraph"},{"n":2,"t":["In 1803, the United States purchased the Hot Springs area from France as part of the Louisiana Territory. Congress wanted to preserve the 47 natural springs in the area, so in 1832, they established the Hot Springs Reservation. In 1921, the reservation was renamed Hot Springs National Park.","1803年，美国从法国购买路易斯安那领地，温泉城一带也在其中。为了保护当地的47处天然泉，国会于1832年设立了温泉保护区。1921年，保护区改名为温泉国家公园。"],"type":"paragraph"},{"n":3,"t":["People have long believed in the healing, therapeutic effects of hot springs. Temporary bathhouses were erected over individual hot springs so that people could soak in the warm waters. They even drank the water, hoping that it would heal their ailments. During the prosperous 1920s, bathhouses were built in Arkansas to draw wealthy tourists to visit the area. The bathhouses were beautiful, ornate structures, often having marble and tile walls and floors and decorative statues and fountains.","人们长期相信温泉能帮助治疗疾病和恢复健康。有人在各个泉眼上方搭起临时浴场，让人来泡温泉。人们甚至喝泉水，希望能治好身上的小病痛。20世纪20年代经济繁荣，阿肯色州修建了浴场来吸引富裕的游客。浴场建筑漂亮而华丽，墙壁和地板常用大理石和瓷砖装饰，还摆放雕像和喷泉。"],"type":"paragraph"},{"n":4,"t":["Visitors would come from near and far, hoping to benefit from the spas on Bathhouse Row. Today, it is not known whether the water can truly improve health. Any benefits it has are probably due to the high concentration of minerals and the high temperature—about 143 degrees Fahrenheit—at which the water rises to Earth’s surface.","远近各地的游客都来浴场街，希望能从这里的温泉浴受益。如今，泉水能否真正改善健康，仍无定论。如果泉水确实有益，可能是因为矿物质浓度高，而且涌出地表时水温高达约143华氏度。"],"type":"paragraph"},{"n":5,"t":["Although hot springs are commonly found in areas where magma, or molten rock, lies close to Earth’s surface, that is not the case at Hot Springs National Park. In this area of Arkansas, there are two types of porous, or absorbent, rock. The rainwater soaks into the rocks, and they slowly carry it far underground. Scientists believe that the water produced by the hot springs today is about 4,000 years old! That’s how long it takes for the rainwater to travel 2,000 to 8,000 feet into Earth and eventually rise again through underground cracks and faults.","温泉通常出现在岩浆（熔融的岩石）离地表很近的地方，温泉国家公园的情形却不同。阿肯色州这一带有两种多孔、能吸水的岩石。雨水渗进岩石，慢慢深入地下。科学家认为，现在从温泉涌出来的水大约已有4000年的历史！雨水要深入地下2000至8000英尺，最后再沿着地下的裂缝和断层上升，整段路程就得花上这么久。"],"type":"paragraph"},{"n":6,"t":["One of the most remarkable things about the water is that it is sterile. This characteristic is so unique that NASA scientists stored samples of moon rock in water from the hot springs while they looked for signs of life.","这些泉水最令人称奇的特点之一是无菌。这一特点相当罕见，以至于美国国家航空航天局的科学家在寻找生命迹象时，把月球岩石样本浸在这里的温泉水中保存。"],"type":"paragraph"},{"n":7,"t":["If you visit Hot Springs National Park today, you can still go to one of the original bathhouses on Bathhouse Row. There, you can bathe in the warm, odorless water and imagine people doing exactly the same thing hundreds of years ago. You can even bring a jug on your trip so that you can collect water during your stay and bring it home with you. There’s no need to worry about the springs running dry—they produce an average of about 850,000 gallons of water a day.","现在去温泉国家公园，你仍能走进浴场街上一座早期修建的浴场。你可以泡在温暖、没有气味的泉水里，想象几百年前人们也在做同样的事。你甚至可以带上一个大水壶，在旅行中装些泉水带回家。用不着担心泉眼会干涸，温泉平均每天能涌出约85万加仑的水。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What benefit do people expect to gain from drinking or bathing in the hot springs?\n________","人们希望从喝温泉水或泡温泉中得到什么好处？"],"ans":["They believe it can heal their ailments and improve their health.","他们相信温泉能治疗病痛，改善健康。"]},{"n":2,"ask":["When were most of the bathhouses on Bathhouse Row constructed?\n________","浴场街上的大部分浴场是什么时候建的？"],"ans":["during the 1920s","20世纪20年代。"]},{"n":3,"ask":["What is the average temperature of the water?\n________","泉水的平均温度是多少？"],"ans":["143 degrees Fahrenheit","143华氏度。"]},{"n":4,"ask":["How did NASA scientists use water from the hot springs?\n________","美国国家航空航天局的科学家如何使用温泉水？"],"ans":["to store samples of moon rock","用来保存月球岩石样本。"]},{"n":5,"ask":["Do you think the hot springs at Hot Springs National Park will ever run out of water? Explain your answer.\n________","你认为温泉国家公园的温泉有一天会干涸吗？请解释。"],"ans":["Possible answer: No, because the hot springs have existed for thousands of years and they produce about 850,000 gallons of water a day.","参考答案：不会，因为温泉已经存在了数千年，每天能产生约85万加仑的水。"]},{"n":6,"ask":["Number the events below to show the order in which they happened.\n\n- ________ Many bathhouses were built in Hot Springs, Arkansas.\n- ________ Hot Spring Reservation was renamed Hot Springs National Park.\n- ________ Native Americans used the hot springs for many years before Europeans discovered them.\n- ________ Hot Spring Reservation was established.\n- ________ The U.S. purchased the Louisiana Territory.","给下列事件编号，表示它们发生的先后顺序。\n阿肯色州温泉城修建了许多浴场。\n温泉保护区改名为温泉国家公园。\n在欧洲人发现温泉之前，美洲原住民已使用温泉多年。\n温泉保护区成立。\n美国购买路易斯安那领地。"],"ans":["- **5** Many bathhouses were built in Hot Springs, Arkansas.\n- **4** Hot Spring Reservation was renamed Hot Springs National Park.\n- **1** Native Americans used the hot springs for many years before Europeans discovered them.\n- **3** Hot Spring Reservation was established.\n- **2** The U.S. purchased the Louisiana Territory.","5. 阿肯色州温泉城修建了许多浴场。\n4. 温泉保护区改名为温泉国家公园。\n1. 在欧洲人发现温泉之前，美洲原住民已使用温泉多年。\n3. 温泉保护区成立。\n2. 美国购买路易斯安那领地。"]},{"n":7,"ask":["How is the way that Native Americans used the hot springs similar to the ways that the springs are used today?\n________","美洲原住民使用温泉的方式与今天有哪些相似之处？"],"ans":["They used them as a place to bathe and relax.","他们都把温泉作为沐浴和放松的地方。"]},{"n":8,"ask":["Which word in paragraph 3 means “relating to a treatment or cure”?\n________","第3段中，哪个词意为“与治疗或治愈有关的”？"],"ans":["therapeutic","therapeutic（有治疗作用的）"]}]},{"id":"P078","title":["The Little Giant","小巨人"],"lead":["Have you ever heard of the basketball player Yao Ming?","你听说过篮球运动员姚明吗？"],"exercise":"P079","genre":"传记","family":"info","parts":[{"n":1,"t":["There is no doubt that it is difficult to move to another country at any age. But imagine moving to a country where the language and customs are very different than those of your homeland. Now, imagine that you are the National Basketball Association’s first pick, and only the third player ever to make the NBA from your country.","无论什么年纪，移居另一个国家无疑都不容易。试想一下，新国家的语言和习俗都跟你的祖国很不一样。再想象一下，你是美国职业篮球联赛（NBA）的选秀状元，也是自己国家有史以来第三位进入NBA的球员。"],"type":"paragraph"},{"n":2,"t":["These were the expectations that Yao Ming, the Houston Rockets’ basketball star, faced when he moved to Texas from Shanghai, China, at the age of 22. The stress and pressure might have proven to be too much for many young athletes, but Yao Ming’s good nature and levelheaded attitude allowed him to quickly become one of the most popular and well-respected young basketball players today.","22岁那年，休斯敦火箭队的篮球明星姚明从中国上海来到得克萨斯州，面对的正是这样的期待。许多年轻运动员可能都承受不了这样的紧张和压力，可姚明待人和善，遇事沉着，很快成了当时最受欢迎、最受敬重的年轻篮球运动员之一。"],"type":"paragraph"},{"n":3,"t":["Yao Ming was born in China on September 12, 1980. Although he is often referred to in America by his full name, technically the order is reversed. Yao is his last name, or surname, and Ming is his first name.","姚明于1980年9月12日在中国出生。虽然在美国人们也常用他的全名来称呼他，但按英语习惯，名和姓的次序正好反过来。姚是他的姓，明是他的名。"],"type":"paragraph"},{"n":4,"t":["Both of Yao’s parents played basketball professionally in China. Yao’s father is 6 feet 7 inches tall, and his mother is 6 feet 3 inches tall. That is probably why it didn’t come as much of a surprise when Yao reached his present height of 7 feet 6 inches.","姚明的父母都曾在中国打过职业篮球。爸爸身高6英尺7英寸，妈妈身高6英尺3英寸。这可能就是为什么姚明成年后长到7英尺6英寸时，大家并不觉得太意外。"],"type":"paragraph"},{"n":5,"t":["In spite of his height and his parents’ background in professional sports, Yao was not destined to become a basketball player. His parents had hoped for a different life for their son, and Yao had not shown much interest in basketball as a small child. However, Yao was accepted into junior sports school in China. Yao’s parents allowed him to go because they knew his chances of eventually being accepted by a good university would increase.","尽管姚明长得高，父母又都是职业运动员，他却并非注定要成为篮球运动员。父母原本希望儿子走另一条路，他小时候也没有表现出太多对篮球的兴趣。不过，后来他被中国一所少年体育学校录取。父母同意他去读，因为他们知道，这样他将来更有机会进一所好大学。"],"type":"paragraph"},{"n":6,"t":["It turned out that Yao showed so much promise as a basketball player that he began to play professionally and put college on the back burner for awhile.","后来姚明表现出很强的篮球天赋，于是开始打职业篮球，暂时把上大学的事搁在一边。"],"type":"paragraph"},{"n":7,"t":["For years, Yao dazzled fans with his skills on the court. During his first year in the NBA, Yao scored an average of 13.5 points, 8.2 rebounds, and 1.74 blocks per game. He earned NBA All-Rookie First Team honors. He also made the cover of many magazines and appeared in television commercials for several different products.","多年来，姚明在球场上的技术让球迷赞叹不已。进入NBA的第一年，姚明场均得到13.5分、8.2个篮板和1.74次封盖，并入选NBA最佳新秀阵容第一队。他还登上多家杂志的封面，出演了几种不同产品的电视广告。"],"type":"paragraph"},{"n":8,"t":["Between 2005 and 2011, Yao was injured repeatedly on the court. In 2011, he finally decided to retire because of injuries to his foot and ankle. Although his basketball career was cut short, Yao is still the same generous, humble, and likable person he was before his basketball career took off and placed him in the spotlight. Yao is married and has a young daughter. He finally has the chance to go to college, where he is studying economics and management. Yao will be remembered for his success on the basketball court, but he hopes to someday make a difference in the world off the court, too.","2005年至2011年，姚明在球场上屡次受伤。2011年，他最终因为脚部和脚踝的伤而决定退役。虽然篮球生涯提前结束了，他仍像成名并受到公众关注前那样慷慨、谦逊、讨人喜欢。姚明已经结婚，有一个年幼的女儿。他终于有机会上大学，学习经济和管理。人们会记得他在篮球场上的成就，但他也希望有一天能在球场之外为世界带来一些改变。"],"type":"paragraph"}],"original":[{"n":1,"ask":["sensible; having good judgment\n________","头脑清醒、判断力强的"],"ans":["levelheaded","levelheaded（沉着理智的）"],"dir":["Write the words from the passage that have the meanings below.","从文章中找出与下列释义相符的词，写在横线上。"]},{"n":2,"ask":["changed the order of\n________","调换了……的顺序"],"ans":["reversed","reversed（颠倒的）"]},{"n":3,"ask":["meant to be\n________","注定会成为的"],"ans":["destined","destined（注定的）"]},{"n":4,"ask":["not speaking too highly about one’s abilities or accomplishments\n________","不会过分夸耀自己的能力或成就"],"ans":["humble","humble（谦逊的）"]},{"n":5,"ask":["Check the word that best describes what type of passage this is.\n\n- ________ autobiography\n- ________ biography\n- ________ fantasy","勾选最符合本文的体裁。\nA. 自传\nB. 传记\nC. 奇幻故事"],"ans":["✓ biography","B. 传记。"]},{"n":6,"ask":["Check the words that best describe Yao Ming.\n\n- ________ sensible\n- ________ rude\n- ________ creative\n- ________ hardworking\n- ________ athletic","勾选最符合姚明特点的词。\n明智的\n粗鲁的\n有创造力的\n勤奋的\n擅长运动的"],"ans":["✓ sensible\n✓ hardworking\n✓ athletic","明智的、勤奋的、擅长运动的。"]},{"n":7,"ask":["Why weren’t Yao’s parents surprised when he grew to be 7 feet 6 inches tall?\n________","为什么姚明长到7英尺6英寸时，他的父母并不意外？"],"ans":["His parents are both much taller than average.","他的父母都比一般人高得多。"]},{"n":8,"ask":["What persuaded Yao’s parents to allow him to attend the junior sports school?\n________","姚明的父母为什么同意他上少年体校？"],"ans":["They thought it would give him a better chance of attending a good college.","他们认为这样他更有机会上一所好大学。"]},{"n":9,"ask":["Why do you think Yao Ming gained fame and popularity so quickly?\n________","你认为姚明为什么能这么快成名并受到欢迎？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P080","title":["Rolling to Victory","滚向胜利"],"lead":["How did wheelchair basketball get its start?","轮椅篮球是怎样起源的？"],"exercise":"P081","genre":"说明文","family":"info","parts":[{"n":1,"t":["After World War II, many injured veterans returned home needing wheelchairs for mobility. These former soldiers tended to be young and mentally fit, so they were not about to let their physical disabilities make them idle. In Veteran’s Association hospitals across the country, vets needed an outlet for their energy and athleticism. It was this desire for activity that gave birth to wheelchair basketball.","二战结束后，许多受伤的退伍军人回到家乡，要借助轮椅才能行动。这些退伍军人大多很年轻，精神状态也好，不愿因为身体残障就无所事事。在美国各地的退伍军人医院里，他们需要一个释放精力、发挥运动才能的机会。正是这种运动的愿望催生了轮椅篮球。"],"type":"paragraph"},{"n":2,"t":["In 1946, two different chapters of the Paralyzed Veterans of America, one in California and one in New England, began hosting wheelchair basketball games in VA hospitals. Word spread about this new sport, and soon there were veterans’ teams forming all over the United States and Canada. The excitement even crossed the Atlantic Ocean, and a team was formed in England. At the first PVA wheelchair basketball tournament, the original California team, the Birmingham Flying Wheels, won the series.","1946年，美国瘫痪退伍军人协会的加利福尼亚和新英格兰两个分会开始在退伍军人医院举办轮椅篮球比赛。新运动的消息很快传开，美国和加拿大各地陆续组建了退伍军人球队。这股热潮甚至跨越大西洋，英格兰也组建了一支队伍。在美国瘫痪退伍军人协会举办的第一届轮椅篮球锦标赛上，最初那支加利福尼亚队伯明翰飞轮队赢得了系列赛冠军。"],"type":"paragraph"},{"n":3,"t":["In 1948, the Flying Wheels received sponsorship to travel the U.S. and play other VA teams. The popularity of these wheelchair basketball competitions inspired the first civilian, or nonmilitary, team to form in Kansas City. They were originally called the *Kansas City Wheelchair Bulldozers*, but today they are known as the *Rolling Pioneers*.","1948年，飞轮队获得赞助，可以到美国各地和其他退伍军人球队比赛。比赛广受欢迎，堪萨斯城因此组建了第一支由非军人组成的民间球队。他们原先叫堪萨斯城轮椅推土机队，如今叫滚动先锋队。"],"type":"paragraph"},{"n":4,"t":["The next year, a group of students at the University of Illinois, helped by the university’s director of rehabilitation, developed a more organized wheelchair basketball league. They held the first National Wheelchair Basketball Association tournament in 1949. Today, the NWBA has grown to include 22 conferences with 165 teams!","次年，伊利诺伊大学的一群学生在该校康复部主任的帮助下，创立了组织更完善的轮椅篮球联赛。他们于1949年举办了第一届全国轮椅篮球协会锦标赛。如今，全国轮椅篮球协会已发展到拥有22个赛区和165支球队！"],"type":"paragraph"},{"n":5,"t":["So, what makes wheelchair basketball different than the game you usually see on television or at the school gym? Aside from a few rules concerning the wheelchairs, it is mostly the same. The most obvious difference is that to be an eligible player you must have a physical disability that requires the use of a wheelchair.","轮椅篮球与平时在电视上或学校体育馆看到的篮球有什么不同呢？除了几条关于轮椅的规定，两种比赛基本一样。最明显的区别是，参赛者必须有需要使用轮椅的身体残障。"],"type":"paragraph"},{"n":6,"t":["However, even this requirement allows for a wide range of physical abilities with advantages and disadvantages for each player. To compensate, points are awarded to each player depending on how severe his or her disability is. Each team is allowed to have a maximum of twelve points, ensuring that teams are fairly matched.","即使满足这项要求，球员之间的身体活动能力仍可能相差很大，各有各的优势和劣势。为平衡这种差异，每位球员按残障程度获得不同的分级分值。每支球队的分值上限为12分，以确保两队实力相当。"],"type":"paragraph"},{"n":7,"t":["Another rule that helps keep the game fair is the *physical advantage foul*. Someone with a spinal cord injury might not be able to move his or her legs, but another player might still have use of part of his or her leg. This foul rule states that all players must remain firmly seated and may not use a physical advantage to raise themselves up in the wheelchair. Three physical advantage fouls will cause the offending player to be removed from the game.","另一条维持比赛公平的规则叫身体优势犯规。脊髓受伤的球员可能无法活动双腿，另一名球员的腿却可能还保有部分功能。这条规则规定，所有球员都必须稳坐在轮椅上，不能利用身体优势撑起身体、离开座位。身体优势犯规达到三次，球员便必须退场。"],"type":"paragraph"},{"n":8,"t":["There are also specific requirements for the shape and size of the wheelchair, including a roll bar that protects the player if the chair tips over. During intense moments of play, it is not unusual for a player to fall out of his or her wheelchair. As long as the fallen player is not hurt and the fall does not interfere with play, the game keeps rolling!","轮椅的形状和尺寸也有具体要求，比如必须装有能在轮椅倾翻时保护球员的防翻杆。激烈的比赛中，球员从轮椅上摔下来并不罕见。只要摔下来的球员没有受伤，摔倒也不妨碍比赛，比赛就会继续打下去！"],"type":"paragraph"}],"original":[{"n":1,"ask":["________ The first military wheelchair basketball team was called the Kansas City Wheelchair Bulldozers.","第一支军人轮椅篮球队叫堪萨斯城轮椅推土机队。"],"ans":["**F**","错误（F）"],"dir":["Write **T** before the sentences that are true. Write **F** before the sentences that are false.","正确的句子在句前写 T，错误的句子在句前写 F。"]},{"n":2,"ask":["________ Today, there are more than 160 NWBA teams.","如今，全国轮椅篮球协会有160多支球队。"],"ans":["**T**","正确（T）"]},{"n":3,"ask":["________ The first NWBA tournament was not held until the 1990s.","直到20世纪90年代，全国轮椅篮球协会才举办第一届锦标赛。"],"ans":["**F**","错误（F）"]},{"n":4,"ask":["How does the physical advantage foul rule help keep the game fair?\n\n________\n\n________","身体优势犯规规则如何帮助维持比赛公平？"],"ans":["All players must remain fully seated, so they remain equally matched in terms of physical ability","所有球员都必须完全坐在座位上，这样，参赛者便不会因身体活动能力有差异而处于不公平的地位。"]},{"n":5,"ask":["Why was wheelchair basketball first invented?\n\n________\n\n________","轮椅篮球最初为什么被发明出来？"],"ans":["as an outlet for the energy and athleticism of WWII vets who were in wheelchairs","为了给二战后使用轮椅的退伍军人一个释放精力、发挥运动才能的机会。"]},{"n":6,"ask":["What was the name of the original California wheelchair basketball team?\n\n________","最早的加利福尼亚轮椅篮球队叫什么？"],"ans":["Birmingham Flying Wheels","伯明翰飞轮队。"]},{"n":7,"ask":["Why are points awarded to each player depending on the severity of his or her disability?\n\n________","为什么要根据球员的残障程度给他们分配分值？"],"ans":["to make sure the teams are fairly matched","为了确保两队实力相当。"]},{"n":8,"ask":["Check the phrase that best describes the author’s purpose.\n\n- ________ to persuade the reader to attend a wheelchair basketball game\n- ________ to explain the origins and rules of wheelchair basketball\n- ________ to instruct the reader on how to join a wheelchair basketball league","勾选最符合作者写作目的的一项。\nA. 说服读者去看轮椅篮球比赛\nB. 介绍轮椅篮球的起源和规则\nC. 指导读者如何加入轮椅篮球联赛"],"ans":["✓ to explain the origins and rules of wheelchair basketball","B. 介绍轮椅篮球的起源和规则。"]},{"n":9,"ask":["The Latin root **mob** means *move*. Find a word in paragraph 1 with the root **mob**.\n\n________","拉丁语词根 mob 意为“移动”。从第1段找出一个带 mob 的词。"],"ans":["mobility","mobility（行动能力）"]},{"n":10,"ask":["The Latin root **act** means *do*. Find a word in paragraph 1 with the root **act**.\n\n________","拉丁语词根 act 意为“做”。从第1段找出一个带 act 的词。"],"ans":["activity","activity（活动）"]},{"n":11,"ask":["The Latin root **form** means *shape*. Find a word in paragraph 2 with the root **form**.\n\n________","拉丁语词根 form 意为“形状”。从第2段找出一个带 form 的词。"],"ans":["formed/forming","formed（组建了）或 forming（正在组建）。"]}]},{"id":"P082","title":["The Racing Gloves","竞速手套"],"lead":["What special equipment do you think a wheelchair athlete needs?","你认为轮椅运动员需要哪些特殊装备？"],"exercise":"P083","genre":"故事","family":"lit","parts":[{"n":1,"t":["Julio and Tasha sat on the porch drinking lemonade and eating pretzels that Julio’s Uncle Jorge had made earlier that morning. Tasha popped the last bite of pretzel in her mouth and dusted the salt from her hands. “Your pretzels are great,” Tasha told Uncle Jorge when she saw him wheel into the doorway. “I’ve never eaten homemade soft pretzels before.”","胡利奥和塔莎坐在门廊上喝柠檬水，吃胡利奥的豪尔赫叔叔当天早上做的椒盐卷饼。塔莎吃完最后一口卷饼，拍掉手上的盐粒。看到豪尔赫叔叔摇着轮椅来到门口，她说：“您做的卷饼真好吃。我还没吃过自家做的软椒盐卷饼呢。”"],"type":"paragraph"},{"n":2,"t":["“They’re easy to make,” said Uncle Jorge. “Next time you come over, I’ll show you and Julio how to make them,” he added, maneuvering his wheelchair down the ramp that led from the front door to the porch.","“做起来很简单，”豪尔赫叔叔一边沿着前门通往门廊的坡道摇下轮椅，一边说，“下次你过来，我教你和胡利奥怎么做。”"],"type":"paragraph"},{"n":3,"t":["A mail truck pulled up in front of the house, and a moment later, the postal carrier came up the front walk carrying a stack of mail and a small brown package.","一辆邮车在屋前停下。不一会儿，邮递员拿着一摞信和一个棕色的小包裹，从门前小路走了过来。"],"type":"paragraph"},{"n":4,"t":["“Who is the package from, Uncle Jorge?” asked Julio eagerly.","“豪尔赫叔叔，谁寄的包裹？”胡利奥急切地问。"],"type":"paragraph"},{"n":5,"t":["Uncle Jorge opened the box and removed a pair of odd-looking gloves from the crumpled brown wrapping paper. “I’ve been waiting for these,” he said, trying on the gloves. He flexed his fingers back and forth several times. “I’m going to be racing in the Boston Marathon this spring,” he told Tasha and Julio.","豪尔赫叔叔打开盒子，从皱巴巴的棕色包装纸里拿出一双样子奇特的手套。“我一直在等这双手套呢。”他一边说，一边试戴，来回屈伸了几下手指。“今年春天我要参加波士顿马拉松，”他告诉塔莎和胡利奥。"],"type":"paragraph"},{"n":6,"t":["“I don’t think I knew that the race in Boston was a marathon,” said Julio, inspecting one of his uncle’s gloves. “You haven’t raced in a marathon before, have you?”","“我好像都不知道波士顿的比赛是马拉松。”胡利奥仔细打量叔叔的一只手套。“您之前还没参加过马拉松吧？”"],"type":"paragraph"},{"n":7,"t":["“This will be my second,” said Uncle Jorge. “I’ve completed plenty of shorter races during the past ten years. Last year, I did my first marathon, and I qualified for the Boston Marathon. My best friend, who is a wheelchair racer too, placed third in his age group in last year’s Boston Marathon. We have a friendly competition going, so that’s given me incentive to stick to my training schedule.”","“这将是我第二次参赛。”豪尔赫叔叔说，“过去10年里，我跑过很多场距离较短的比赛。去年我完成了第一场马拉松，也取得了波士顿马拉松的参赛资格。我最好的朋友也是轮椅竞速选手，去年他在波士顿马拉松的同龄组拿了第三名。我们两个一直友好地较着劲，也给了我按训练计划坚持下去的动力。”"],"type":"paragraph"},{"n":8,"t":["“Is your racing chair very different from your everyday chair?” asked Tasha.","“您的竞速轮椅和日常用的轮椅差别很大吗？”塔莎问。"],"type":"paragraph"},{"n":9,"t":["Uncle Jorge nodded. “It has two large wheels like this chair does,” he said, gesturing to his wheelchair, “but it also has a third, smaller wheel in front. Sports tires are also different than my everyday tires.” He grinned. “It’s kind of like the difference between wearing running shoes and loafers.”","豪尔赫叔叔点点头。“和这辆轮椅一样，它也有两个大轮子，”他说着指了指自己的轮椅，“不过前面还有第三个轮子，小一些。运动轮胎和我平时用的也不一样。”他咧嘴一笑。“就有点像跑鞋跟便鞋的区别。”"],"type":"paragraph"},{"n":10,"t":["“Do a lot of wheelchair racers compete in the Boston Marathon?” asked Julio, dipping a piece of pretzel in some spicy mustard.","“报名波士顿马拉松的轮椅选手多吗？”胡利奥把一块椒盐卷饼蘸了点辣芥末，问道。"],"type":"paragraph"},{"n":11,"t":["“It’s considered one of the most prestigious races,” replied Uncle Jorge. “Other than the Olympic and Paralympic Games, the Boston Marathon is the only race in the world for which you have to meet a qualifying time in order to participate.”","“它被视为最负盛名的赛事之一，”豪尔赫叔叔回答，“除了奥运会和残奥会，波士顿马拉松是世界上唯一一项必须达到规定成绩才能参加的赛跑。”"],"type":"paragraph"},{"n":12,"t":["Tasha and Julio exchanged glances. “I wish it was closer to home so we could go along and cheer for you,” said Julio.","塔莎和胡利奥交换了一下眼神。“要是离家近一点就好了，我们就可以去给您加油了。”胡利奥说。"],"type":"paragraph"},{"n":13,"t":["Uncle Jorge looked at him thoughtfully. “Let me talk to your parents,” he said. “Maybe you can drive up with Aunt Amelia and me the night before the race.” He smiled at Julio and Tasha. “I’m going to need the biggest cheering section I can get!”","豪尔赫叔叔若有所思地看着他。“我去跟你爸妈说说吧，”他说，“说不定比赛前一晚，你们就能和阿梅莉娅婶婶还有我一起开车过去。”他朝胡利奥和塔莎笑了笑。“我可得找尽可能多的人给我加油！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["What analogy does Uncle Jorge make when he is talking about his everyday tires as compared to his racing tires?\n\n________\n\n________","豪尔赫叔叔用什么来类比日常轮胎和竞速轮胎的差别？"],"ans":["The difference between wearing running shoes and loafers.","穿跑鞋和穿便鞋的差别。"]},{"n":2,"ask":["How is a racing wheelchair different from a regular wheelchair? How are they similar?\n\n________\n\n________\n\n________","竞速轮椅和普通轮椅有什么不同？有什么相似之处？"],"ans":["Possible answer: They both have two large wheels, but the racing wheelchair has an additional small third wheel in front.","参考答案：两种轮椅都有两个大轮子，但竞速轮椅前面还多一个小轮子。"]},{"n":3,"ask":["________ Uncle Jorge has completed a marathon before.","豪尔赫叔叔以前完成过马拉松。"],"ans":["F","事实（F）"],"dir":["Write F before the sentences that are facts. Write O before the sentences that are opinions.","如果句子陈述的是事实，就在句前写 F。如果表达的是观点，就在句前写 O。"]},{"n":4,"ask":["________ Uncle Jorge will probably complete the marathon in less time than his friend.","豪尔赫叔叔完成马拉松用的时间可能比他朋友少。"],"ans":["O","观点（O）"]},{"n":5,"ask":["________ Tasha and Julio ate the pretzels Uncle Jorge baked.","塔莎和胡利奥吃了豪尔赫叔叔烤的椒盐卷饼。"],"ans":["F","事实（F）"]},{"n":6,"ask":["________ The package contained Uncle Jorge’s racing gloves.","包裹里装着豪尔赫叔叔的竞速手套。"],"ans":["F","事实（F）"]},{"n":7,"ask":["________ Uncle Jorge makes the best soft pretzels.","豪尔赫叔叔做的软椒盐卷饼最好吃。"],"ans":["O","观点（O）"]},{"n":8,"ask":["Check the words that best describe Uncle Jorge.\n\n- ________ impatient\n- ________ competitive\n- ________ determined\n- ________ lonely\n- ________ enthusiastic","勾选最符合豪尔赫叔叔特点的词。\n没耐心\n好胜\n有决心\n孤独\n热情"],"ans":["- ✓ competitive\n- ✓ determined\n- ✓ enthusiastic","好胜、有决心、热情。"]},{"n":9,"ask":["How is the Boston Marathon different from most other races?\n\n________\n\n________","波士顿马拉松与大多数其他比赛有什么不同？"],"ans":["It’s one of the few races in which you need to have a qualifying time to compete.","它是少数几项必须达到规定成绩才有资格参加的比赛之一。"]},{"n":10,"ask":["What kind of relationship do Uncle Jorge and his best friend have?\n\n________","豪尔赫叔叔和他最好的朋友关系怎么样？"],"ans":["They are close but very competitive.","他们关系密切，也总想在比赛中超过对方。"]}]},{"id":"P084","title":["A Reason to Run","为爱开跑"],"lead":["Have you ever participated in a charity event?","你参加过慈善活动吗？"],"exercise":"P085","genre":"故事","family":"lit","parts":[{"n":1,"t":["Julio and Tasha sat on the sun-warmed grass at the park. They were stretching before they set out on their afternoon run. As they stretched, they spoke about the upcoming race. Neither Julio nor Tasha had raced before, but they had been training together for nearly three months and felt prepared.","胡利奥和塔莎坐在公园里被阳光晒暖的草地上。他们准备下午去跑步，正在做拉伸，一边伸展一边聊即将到来的比赛。两人以前都没参加过赛跑，但他们已经一起训练了近三个月，觉得准备好了。"],"type":"paragraph"},{"n":2,"t":["“Do you have any sponsors yet?” asked Tasha. Her voice was a bit muffled as she bent over and gripped her ankles in a deep stretch.","“你找到赞助人了吗？”塔莎问。她弯腰抓住脚踝，深深地做了个拉伸，说话的声音有点闷。"],"type":"paragraph"},{"n":3,"t":["“Not really,” replied Julio. He stood up and leaned to one side, reaching as far as he could over his head with the opposite hand. “My parents and my grandma have both signed up. I know my aunts and uncles will help out, too, but I haven’t actually asked them yet. What about you?”","“还不算有吧，”胡利奥回答。他站起来向一侧倾，另一只手尽量越过头顶伸出去。“我爸妈和奶奶都已经答应了。我知道叔叔阿姨们也愿意帮忙，但我还没真去问他们。你呢？”"],"type":"paragraph"},{"n":4,"t":["Tasha took a quick drink from her water bottle and stood up. “I haven’t asked anyone but my parents yet,” she said. “I’m really nervous about asking other people to sponsor me for this race,” she confessed. “I really want to run, and I want to help support the Leukemia Society, but I’m dreading the whole process of asking for sponsors.”","塔莎从水瓶里喝了一口水，站起身来。“除了我爸妈，我还没问过别人，”她说，“开口请别人赞助我参赛，我真的很紧张。”她坦白道，“我特别想跑，也想支持白血病协会，可是一想到要到处找赞助人，我就发愁。”"],"type":"paragraph"},{"n":5,"t":["Tasha and Julio started down the bike path at a medium jog. “What are you worried about?” asked Julio. “I think that people will be willing to help out a good cause. We’re not asking them to buy anything. All we want is a donation to the Leukemia Society in exchange for the time and effort we put into training.”","塔莎和胡利奥沿着自行车道不紧不慢地跑起来。“你担心什么？”胡利奥问，“我觉得大家会愿意支持公益活动的。我们不用他们买东西，只是请他们为我们投入的训练时间和精力向白血病协会捐款。”"],"type":"paragraph"},{"n":6,"t":["“I know,” agreed Tasha. “It shouldn’t be a big deal, but I’m just afraid that no one will want to participate, or that they’ll pledge to support me and I won’t be able to finish the race for some reason.”","“我知道，”塔莎说，“这应该也不是什么大事，但我怕没人愿意参加。或者有人答应赞助我，我却因为某种原因跑不完全程。”"],"type":"paragraph"},{"n":7,"t":["Julio and Tasha ran single file for a few seconds as they passed a family on roller blades. When Julio caught up to Tasha, he said, “Listen, I completely understand why it’s hard for you to ask people you don’t know for donations. I can help you with that part. But you have to have a little more confidence in yourself about the race. We’ve both been able to run the entire three miles for the last month. You’re practically not even out of breath anymore when we finish. This race is going to be a piece of cake for you.”","经过一家穿着直排轮滑鞋的人时，胡利奥和塔莎排成一列跑了几秒。胡利奥追上塔莎，说：“听我说，我完全理解你为什么不好意思开口请陌生人捐款。这部分我可以帮你。但比赛的事，你得对自己多一点信心。我们过去一个月都能跑完3英里全程。跑完的时候你几乎都不喘了。这场比赛对你来说就是小菜一碟。”"],"type":"paragraph"},{"n":8,"t":["The two runners were quiet for a moment. The only sound was the gentle thudding of their shoes hitting the path. “You’re right,” said Tasha finally. “Running the race isn’t going to be the hard part for me. Do you have any ideas about whom we could ask for pledges?”","两人安静了一会儿，只有跑鞋轻轻踏在小路上的声响。“你说得对，”塔莎终于开口，“对我来说，跑完比赛其实不难。你想得到我们可以请谁答应捐款吗？”"],"type":"paragraph"},{"n":9,"t":["Julio, who was starting to become a bit short of breath, nodded. “Could you ask the parents of the players on your soccer team?” he asked. “Also, the neighborhood block party is going to be next weekend. That could be a great time to ask our neighbors. Everyone will be in a good mood, so they’ll probably be pretty receptive to helping us out.”","胡利奥有点喘了。他点点头。“你可以问问足球队队友的家长吗？”他问，“还有，下周末社区会办街坊聚会。那也许正好可以问问邻居。大家心情都会不错，可能比较愿意帮我们的忙。”"],"type":"paragraph"},{"n":10,"t":["Tasha smiled. “We make a good team, Julio,” she said. “I definitely feel like I can do this now.”","塔莎笑了。“胡利奥，我们俩配合得真好，”她说，“现在我真的觉得自己能做到了。”"],"type":"paragraph"},{"n":11,"t":["Julio smiled back. “Good,” he said, picking up the pace, “because the last one to make it to the finish today has to buy ice cream on the way home!” Tasha laughed as the two friends sprinted toward the park’s gates.","胡利奥也笑了。“那就好，”他加快脚步，说道，“因为今天最后一个到终点的人，回家路上得请客吃冰激凌！”塔莎笑出声来，两个朋友一起朝公园大门冲去。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What problem does Tasha have in the story?\n\n________","故事里，塔莎遇到了什么问题？"],"ans":["She is nervous about asking people to sponsor her for the race.","她一想到要请别人赞助她参加比赛，就感到紧张。"]},{"n":2,"ask":["How does Julio help her resolve the problem?\n\n________","胡利奥是怎么帮她解决这个问题的？"],"ans":["He gives her a pep talk and gives her suggestions of people to ask.","他鼓励她，还建议她可以去问哪些人。"]},{"n":3,"ask":["Name one way in which Tasha and Julio are similar.\n\n________","说出塔莎和胡利奥的一个相同点。"],"ans":["Answers will vary. Possible answer: Neither of them had raced before.","答案可以不同。参考答案：两人以前都没参加过赛跑。"]},{"n":4,"ask":["Name one way in which Tasha and Julio are different.\n\n________","说出塔莎和胡利奥的一个不同点。"],"ans":["Answers will vary. Possible answer: Tasha is nervous about asking people to be sponsors. Julia is not.","答案可以不同。参考答案：塔莎开口找赞助人时会紧张，胡利奥不会。"]},{"n":5,"ask":["What charitable organization will Julio and Tasha help by running the race?\n\n________","胡利奥和塔莎参加赛跑是为了帮助哪个慈善组织？"],"ans":["The Leukemia Society","白血病协会。"]},{"n":6,"ask":["Why does Julio think that it would be a good idea to ask their neighbors to pledge money during the block party?\n\n________","为什么胡利奥觉得街坊聚会时适合请邻居答应捐款？"],"ans":["He thinks that everyone will be in a good mood.","他觉得大家那时心情都会很好。"]},{"n":7,"ask":["The **theme** of a story is its subject. It tells what idea the story is mostly about. Check the word below that best describes the theme of “A Reason to Run.”\n\n- ___ fitness\n- ___ friendship\n- ___ loyalty","故事的主题是它表现的主要思想，也就是故事主要想说什么。勾选最符合《为爱开跑》主题的词。\nA. 健身\nB. 友谊\nC. 忠诚"],"ans":["friendship","B. 友谊。"]},{"n":8,"ask":["Tasha feels that she can ________ with Julio’s support.\n\n- win\n- succeed\n- apply","塔莎觉得，有了胡利奥的支持，她能够 _____。\nwin（获胜）\nsucceed（成功）\napply（申请）"],"ans":["succeed","succeed（成功）"],"dir":["Circle the word that best completes each sentence below.","圈出最适合填入下列各句的词。"]},{"n":9,"ask":["Julio ________ Tasha to have more confidence in herself.\n\n- encourages\n- discourages\n- requests","胡利奥 _____ 塔莎对自己更有信心。\nencourages（鼓励）\ndiscourages（劝阻）\nrequests（请求）"],"ans":["encourages","encourages（鼓励）"]},{"n":10,"ask":["easy; simple to do ________.","容易的、简单好做的"],"ans":["a piece of cake","a piece of cake（小菜一碟）"],"dir":["Write the idiom from paragraph 7 on the line next to its meaning.","找出第7段中的习语，写在相应释义旁的横线上。"]}]},{"id":"P086","title":["Getting Up to Speed","跑步入门"],"lead":["Where can you go running safely in your neighborhood?","你家附近哪里适合安全地跑步？"],"exercise":"P087","genre":"操作指南","family":"info","parts":[{"n":"u1","t":["Before you begin training:","开始训练之前"],"type":"note"},{"n":"u2","t":["• Find a running “buddy” to train with you. Ask a friend from school or from your neighborhood, your brother or sister, or a parent or other relative.\n• Make sure you have a good pair of running shoes that fit you properly.\n• Stay hydrated! Even if you aren’t perspiring visibly, exercise uses up a great deal of your body’s water. Be sure to drink water frequently to keep your energy level up and your body working.\n• Snack on healthful foods. Fruits and vegetables, whole grains, and low-fat dairy products all help maintain a healthy body. Have an apple and a piece of cheese, some yogurt sprinkled with granola, or an orange and a handful of whole-grain pretzels. You’ll find that you have plenty of energy to complete the goals you set for yourself.\n• Get in the habit of taking a few minutes to stretch before you begin running. Stretching helps you stay flexible. It can also help protect your body from injury.","• 找一个跑步伙伴一起训练。可以请学校或邻里的朋友、兄弟姐妹、父母或其他亲人陪你。\n• 确保自己有一双质量好、穿着合脚的跑鞋。\n• 记得补水！即使你看不出自己在出汗，运动也会消耗体内大量水分。一定要经常喝水，让你保持精力，也让身体正常运作。\n• 吃些健康的点心。水果、蔬菜、全谷物和低脂乳制品都有助于保持身体健康。可以吃一个苹果和一块奶酪、撒了格兰诺拉麦片的酸奶，或者一个橙子和一小把全麦椒盐卷饼。你会发现自己有充足的精力完成定下的目标。\n• 养成跑步前花几分钟做拉伸的习惯。拉伸有助于保持身体的柔韧性，也能帮助你避免受伤。"],"type":"list"},{"n":1,"t":["The best way to begin training is by alternately walking and running. This allows your body to become accustomed to the challenge of running without overdoing it. Begin your first week with running for two minutes and walking for four minutes. Do this sequence five times in a row, four times a week.","刚开始训练时，最好交替步行和跑步。这样你的身体可以逐渐适应跑步的强度，也不会练得过头。第一周先跑2分钟，再走4分钟，连续重复5次，每周练4次。"],"type":"paragraph"},{"n":2,"t":["If you feel comfortable doing this sequence after a week, you’re ready to progress to the next level. If it still feels challenging, continue with it for another week.","练了一周之后，如果你觉得这套动作很轻松，就可以进入下一阶段。如果还是觉得吃力，就再练一周。"],"type":"paragraph"},{"n":3,"t":["When you decide to move to the next level, you’ll run three minutes and walk for three minutes. Continue to progress each week, increasing the time you spend running and decreasing the time you spend walking, until you reach 30 minutes of continuous running.","决定进入下一阶段后，改为跑3分钟、走3分钟。每周逐渐增加跑步时间，减少步行时间，直到能连续跑30分钟。"],"type":"paragraph"},{"n":4,"t":["When you are running, you should be able to comfortably talk with your running buddy. If you are pushing yourself too hard, talking will be difficult because you’ll be short of breath.","跑步时，你应该能轻松地和跑步伙伴交谈。如果跑得太拼，你会喘不过气，跟人说话也会变得困难。"],"type":"paragraph"},{"n":5,"t":["The days of the week that you don’t run, try some different kinds of fitness activities, like hiking, ice skating, jumping rope, or playing basketball. You’ll find that these activities use different muscles than running does. This kind of cross-training can help you get into even better shape than only repeating a single activity. Don’t forget to schedule at least one day of rest every week. It’s always a good idea to give your body a chance to recover from your daily workouts.","一周之中不跑步的日子，可以试试别的健身活动，比如徒步、滑冰、跳绳或打篮球。你会发现，这些活动用到的肌肉和跑步时用到的不同。多种运动搭配起来做，也就是交叉训练，比只反复做一种活动更能帮你练出好体能。别忘了每周至少安排一天休息，让身体从平日的训练中恢复过来。"],"type":"paragraph"},{"n":6,"t":["Consider keeping a runner’s log or journal. You can record the weather, your route, the distance you ran, and how you felt. You might notice that you prefer running early in the day or that eating an orange before you go for a run gives you a good boost in energy.","你可以考虑写一本跑步日志。可以记下天气、跑步路线、跑了多远以及自己的感受。你可能会发现，你更喜欢早上跑，或者跑前吃一个橙子能让你精神不少。"],"type":"paragraph"},{"n":7,"t":["Most of all, remember to have fun. Running is just one of many different activities you can do to stay in shape. Vary your routine enough to keep it interesting, and bring along a friend to keep you company.","最重要的是，记得享受跑步的乐趣。跑步只是许多能让你保持好体能的活动之一。多变换一下训练安排，让它一直有意思。也可以叫个朋友陪你。"],"type":"paragraph"}],"original":[{"n":1,"ask":["What are some types of fitness activities mentioned in the selection besides running?\n\n________","除了跑步，文中还提到了哪些健身活动？"],"ans":["hiking, ice skating, jumping rope, and playing basketball","徒步、滑冰、跳绳和打篮球。"]},{"n":2,"ask":["What do you think cross-training is?\n\n________\n\n________","你认为什么是交叉训练？"],"ans":["exercising by participating in different types of activities that work different muscles","通过参与不同类型的活动，锻炼不同的肌肉。"]},{"n":3,"ask":["What is the best way to begin training?\n\n________\n\n________","开始训练的最佳方法是什么？"],"ans":["Answers will vary. Possible answer: Find a running buddy","答案可以不同。参考答案：找一个跑步伙伴。"]},{"n":4,"ask":["What purpose would a reader have for reading this selection?\n\n- ________ for pleasure or entertainment\n- ________ to learn how to become a runner\n- ________ to form an opinion about running","读者出于什么目的会阅读本文？\nA. 消遣或娱乐\nB. 学习怎样开始跑步\nC. 对跑步形成自己的看法"],"ans":["- ✓ to learn how to become a runner","B. 学习怎样开始跑步。"]},{"n":5,"ask":["Write a summary sentence for paragraph 5.\n\n________\n\n________","写一句话概括第5段。"],"ans":["Possible answer: It is a good idea to vary your activities and to rest at least one day a week.","参考答案：安排不同的活动，每周至少休息一天，是个好主意。"]},{"n":6,"ask":["What kind of information could you record in a runner’s log?\n\n________\n\n________","跑步日志里可以记录哪些信息？"],"ans":["the weather, your route, the distance you ran, and how you felt","天气、跑步路线、跑了多远以及自己的感受。"]},{"n":7,"ask":["Do you think the author is trying to persuade the reader of anything in this selection? Explain.\n\n________\n\n________","你觉得作者在文中试图说服读者做什么或相信什么吗？请解释。"],"ans":["Answers will vary.","答案可以不同。"]},{"n":8,"ask":["In bullet 3, what does *hydrated* mean?\n\n________","第3条准备事项中的 hydrated 是什么意思？"],"ans":["supplied with water","体内水分充足的。"]},{"n":9,"ask":["Are you a runner? If so, explain what you like about it. If not, would you like to take up running? Why or why not?\n\n________\n\n________","你跑步吗？如果跑步，说说你喜欢它的什么地方。如果不跑步，你想开始跑步吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]}]},{"id":"P088","title":["A Mysterious Glow","神秘的微光"],"lead":["Have you ever seen an organism that glows? Where were you?","你见过会发光的生物吗？你是在哪里看到的？"],"exercise":"P089","genre":"故事","family":"lit","parts":[{"n":1,"t":["It was the Taylors’ first night at the beach. Miles, Sophie, and their parents sat outside and enjoyed a big seafood dinner that included fresh fish, scallops, crab, coleslaw, and corn on the cob. The sun was a ball of fire as it slipped into the ocean and left a peach-colored glow in the sky. They played several board games, and by nine o’clock, everyone had caught their second wind.","这是泰勒一家在海边过的第一个晚上。迈尔斯、索菲和父母坐在户外，享用了一顿丰盛的海鲜晚餐，桌上有鲜鱼、扇贝、螃蟹、凉拌卷心菜和整根玉米棒。太阳是一团火球，缓缓滑进海里，在天空留下一抹淡桃红色的余晖。他们玩了几局桌游，到9点时，大家又都来了精神。"],"type":"paragraph"},{"n":2,"t":["“How does an evening stroll along the beach sound?” asked Mrs. Taylor, stretching as she stood up. “It’s a beautiful night, and I don’t think you kids have ever seen stars the way they look over the ocean at night.”","“晚上沿着海滩走走怎么样？”泰勒太太一边站起来伸懒腰，一边问，“今晚的天真美。我想你们俩还没见过夜里海上的星星是什么样的呢。”"],"type":"paragraph"},{"n":3,"t":["“Sounds good to me,” said Mr. Taylor, collecting the game pieces on the coffee table and putting them back in the box.","“我觉得不错。”泰勒先生把茶几上的棋子收起来放回盒子里。"],"type":"paragraph"},{"n":4,"t":["Sophie used a flashlight to guide the group down the sandy path in between the cottages, and in just a few minutes the Taylors found themselves on the beach. Miles and Sophie took off their flip-flops and let the sand squish between their toes.","索菲用手电筒照着小屋之间铺满沙子的路，领着一家人往前走。几分钟后，全家就到了海滩上。迈尔斯和索菲脱下人字拖，任由沙子从脚趾缝里挤出来。"],"type":"paragraph"},{"n":5,"t":["“The sand is so much cooler than it was earlier today!” exclaimed Sophie, remembering how she had danced across the beach to the water to keep from burning the soles of her feet.","“沙子比白天凉快多了！”索菲叫道，想起白天为了不烫着脚底，自己是怎样蹦跳着穿过沙滩跑进水里的。"],"type":"paragraph"},{"n":6,"t":["Mrs. Taylor nodded. “The sand absorbs the sun’s heat during the day, but it cools off quickly as soon as the sun goes down.”","泰勒太太点点头。“白天沙子会吸收太阳的热量，可太阳一下山，沙子很快就凉下来了。”"],"type":"paragraph"},{"n":7,"t":["Miles and Sophie walked ahead of their parents, wading in the gentle waves along the shore as they tried to pick out constellations in the cloudless sky. “Miles,” said Sophie after a few minutes, “do you notice anything weird about the water? Doesn’t it seem like it’s almost glowing?” She stopped walking and kicked her bare foot in the water. There was an explosion of milky-green light where Sophie kicked. Miles and Sophie looked at one another. “This is totally bizarre,” said Sophie.","迈尔斯和索菲走在父母前面，在岸边轻柔的海浪中蹚着水，试着辨认晴朗夜空中的星座。过了几分钟，索菲说：“迈尔斯，你有没有觉得水有点奇怪？好像在发光？”她停下脚步，光着脚往水里踢了一下。脚踢到的地方迸出一团乳绿色的光。兄妹俩互相看了一眼。“这也太奇怪了！”索菲说。"],"type":"paragraph"},{"n":8,"t":["She and Miles crouched at the water’s edge and ran their hands back and forth rapidly in the cool water. Swirls of light traced the pattern their hands had made.","她和迈尔斯蹲在水边，双手在凉凉的水里快速地来回划动。旋涡般的光沿着手划过的轨迹亮了起来。"],"type":"paragraph"},{"n":9,"t":["Their parents had finally caught up to Miles and Sophie. “Did you find something?” inquired Mrs. Taylor, kneeling beside Sophie. Before Sophie even had time to answer, Mrs. Taylor gasped. “This is incredible,” she said swirling her hands in the water. “I’ve read about it, but I’ve never seen it myself. Ian, did you see this?” she asked Mr. Taylor.","父母终于赶了上来。“你们发现什么了吗？”泰勒太太一边问，一边跪在索菲身旁。索菲还没来得及回答，泰勒太太就惊叹了一声。“太不可思议了！”她一边说，一边用双手拨动水面。“我读到过，可从没亲眼见过。伊恩，你看见了吗？”她问泰勒先生。"],"type":"paragraph"},{"n":10,"t":["He nodded, and even in the dim light Sophie and Miles could see the look of amazement on their dad’s face. “What is it, Mom?” asked Sophie. “Why is the water glowing?”","他点点头。即使光线昏暗，索菲和迈尔斯也能看出爸爸一脸惊奇。“妈妈，这是什么呀？”索菲问，“水为什么会发光？”"],"type":"paragraph"},{"n":11,"t":["“It’s called *bioluminescence*,” said Mrs. Taylor. “You’re not actually seeing the water itself glow. There’s just a high concentration of tiny organisms in it that create light. It’s similar to the type of light that fireflies produce.”","“这叫生物发光。”泰勒太太说，“你们看到的并不是水本身在发光，而是水中有大量能发光的微小生物。这种光和萤火虫发出的光类似。”"],"type":"paragraph"},{"n":12,"t":["“I think we were all too busy looking at the stars in the sky to see the ones in the ocean,” marveled Mr. Taylor.","“我想我们刚才都忙着看天上的星星，没留意到海里也有星星。”泰勒先生惊叹道。"],"type":"paragraph"}],"original":[{"n":1,"ask":["Write one sentence from the story that indicates how the Taylors felt about discovering the bioluminescence.\n\n________","从故事中抄写一句话，说明泰勒一家发现生物发光时有什么感受。"],"ans":["Possible answer: This is incredible.","参考答案：“太不可思议了！”"]},{"n":2,"ask":["What happened when Sophie kicked the water?\n\n________","索菲踢水时发生了什么？"],"ans":["There was an explosion of a milky-green light.","水里迸出一团乳绿色的光。"]},{"n":3,"ask":["What explanation does Mrs. Taylor have for why the water is glowing?\n\n________","泰勒太太如何解释水在发光的现象？"],"ans":["She says there is a high concentration of tiny organisms in the water that create light.","她说水里有大量能发光的微小生物。"]},{"n":4,"ask":["Why do you think the Taylors didn’t notice the glowing water right away?\n\n________","你认为泰勒一家为什么没有马上注意到水在发光？"],"ans":["They were looking at the stars in the sky.","他们在看天上的星星。"]},{"n":5,"ask":["Do you think that Sophie and Miles will try to learn more about bioluminescence when they get home? Why or why not?\n\n________","你认为索菲和迈尔斯回家后会设法多了解一些生物发光的知识吗？为什么？"],"ans":["Answers will vary.","答案可以不同。"]},{"n":6,"ask":["________ Mrs. Taylor swirled her hands in the water.","泰勒太太用双手拨动水面。"],"ans":["A","之后（A）"],"dir":["Read the sentences below. Write **B** next to the sentence if it tells about something that happened before Miles and Sophie noticed the water was glowing. Write **A** if it describes something that happened after.","读下列句子。如果句子写的是迈尔斯和索菲注意到水在发光之前发生的事，在旁边写 B。如果写的是之后发生的事，就写 A。"]},{"n":7,"ask":["________ Mr. Taylor collected the game pieces from the coffee table.","泰勒先生把茶几上的棋子收起来。"],"ans":["B","之前（B）"]},{"n":8,"ask":["________ Miles and Sophie picked out constellations in the night sky.","迈尔斯和索菲在夜空中辨认星座。"],"ans":["B","之前（B）"]},{"n":9,"ask":["________ Miles and Sophie took off their flip-flops.","迈尔斯和索菲脱下人字拖。"],"ans":["B","之前（B）"]},{"n":10,"ask":["________ Mrs. Taylor knelt beside Sophie.","泰勒太太跪在索菲身旁。"],"ans":["A","之后（A）"]},{"n":11,"ask":["felt refreshed ________","重新有了精神"],"ans":["caught their second wind","caught their second wind（恢复了精力）"],"dir":["Write the idiom from paragraph 1 on the line next to its meaning.","找出第1段中的习语，写在相应释义旁的横线上。"]},{"n":12,"ask":["________","写出第1段中的暗喻。"],"ans":["the sun was a ball of fire","the sun was a ball of fire（太阳是一团火球）"],"dir":["A metaphor is a comparison of two things without using the word *like* or *as*. For example, *Her fingers were icicles*. Find the metaphor in paragraph 1, and write it on the line.","暗喻把两种事物作比较，却不使用 like 或 as 等表示“像”的词。例如：Her fingers were icicles.（她的手指是冰棱。）找出第1段中的暗喻，把它写在横线上。"]}],"alias":"神秘的微光"},{"id":"P090","title":["Living Lights","会发光的生物"],"lead":["What would it be like to glow in the dark?","如果你能在黑暗中发光，会是什么感觉？"],"exercise":"P091","genre":"科普说明文","family":"info","parts":[{"n":1,"t":["Very few organisms that live on land have the ability to glow in the dark, but it is a surprisingly common characteristic among deep-sea marine creatures. In fact, about 90 percent of animals that live 200 to 1,000 meters below the surface of the ocean are bioluminescent.","生活在陆地上的生物很少能在黑暗中发光，但在深海生物中，这种特性却出人意料地常见。事实上，生活在海面以下200至1000米的动物中，约有90%能发光。"],"type":"paragraph"},{"n":2,"t":["The word *bioluminescence* (bahy-oh-loo-muh-nes-uhns) comes from the Greek word *bios*, which means *living*, and the Latin word *lumen*, which means *light*. It refers to organisms that produce light as a result of a chemical reaction. Bioluminescence is a cool light. In a lightbulb, about 97 percent of the energy is used to create heat, and only 3 percent is used to create light. When bioluminescence is produced, very little energy is used to create heat. This is one reason that scientists are so interested in learning about bioluminescence and how it might be used to create more efficient, less wasteful light sources.","bioluminescence（生物发光，读音 bahy-oh-loo-muh-nes-uhns）源于希腊语 bios（有生命的）和拉丁语 lumen（光）。它指生物通过化学反应产生光的现象。生物发光是一种冷光。灯泡大约用97%的能量产生热，只有3%的能量用来发光。生物发光时，用来产生热量的能量很少。因此，科学家很想研究生物发光，看看能否借此创造效率更高、浪费更少的光源。"],"type":"paragraph"},{"n":3,"t":["Ocean animals use bioluminescence in various ways. You might think that light would not be very effective as camouflage because it would draw attention to an animal instead of helping it hide. However, if you were a predator hunting a bobtail squid and you looked up at the squid’s belly, its bioluminescence would allow it to blend with the stars of the night sky.","海洋动物会以不同的方式利用生物发光。你可能觉得光不利于伪装，因为它会引起注意，没法帮动物藏起来。然而，如果你是正在猎捕耳乌贼的捕食者，抬头看乌贼的肚子，它发出的光会让它融入夜空的星光。"],"type":"paragraph"},{"n":4,"t":["Other animals use bioluminescence to attract mates. This is the case with fireflies on land, who use light signals to attract others of the same species. It is also true of ocean animals like the Bermuda fireworm.","还有一些动物靠发光吸引配偶。陆地上的萤火虫就是这样，它们发出光信号来吸引同类。百慕大火虫等海洋动物也这么做。"],"type":"paragraph"},{"n":5,"t":["One species of squid uses bioluminescence to confuse predators. If it feels threatened, it spews a cloud of bioluminescent chemicals. While the predator is surprised and confused, the squid has time to quickly escape.","有一种乌贼利用生物发光迷惑捕食者。如果感觉受到威胁，它就会喷出一团发光的化学物质。趁捕食者吃惊、迷惑时，乌贼迅速逃走。"],"type":"paragraph"},{"n":6,"t":["Another possible use of bioluminescence is to lure prey. The cookie cutter shark is one animal that uses its light in this way. Patterns of bioluminescence on the shark’s underside may resemble small fish to predators like tuna or mackerel. When they come closer to investigate, the shark attacks. The anglerfish uses a similar method to capture prey. It extends a glowing lure from an appendage on its head. Other fish mistake the glowing lure for a meal and venture closer. When they do, the anglerfish moves quickly and snaps them up.","生物发光的另一种用途可能是引诱猎物。达摩鲨就是这样用光的动物之一。金枪鱼、鲭鱼之类的捕食者，可能把鲨鱼腹部的发光图案当成小鱼。它们一游近查看，鲨鱼就发起攻击。鮟鱇鱼也通过类似的方法捕食。它头上的附肢能伸出一个发光的诱饵。其他鱼把诱饵错当成食物，冒险游近。它们一靠近，鮟鱇鱼就迅速出击，一口把它们吞掉。"],"type":"paragraph"},{"n":7,"t":["Because many bioluminescent animals live deep underwater, most people don’t have the opportunity to observe them. However, tiny one-celled creatures called *dinoflagellates* (din-uh-flaj-uh-leyt) live in the sea and produce much of the visible bioluminescence near the ocean’s surface. In areas that have large numbers of dinoflagellates, the motion of waves, a boat, a porpoise, or even a hand can easily disturb them and cause them to glow. On a dark night, this eerie but beautiful sight can create quite a light show in the ocean!","许多会发光的动物生活在深水中，大多数人没有机会看到它们。不过，海里有一种叫作甲藻（dinoflagellates，读音 din-uh-flaj-uh-leyt）的微小单细胞生物。海面附近能看见的生物光，有相当一部分是甲藻发出的。在甲藻大量聚集的水域，海浪、船、鼠海豚，甚至一只手的移动，都能轻易扰动它们，使它们发光。在漆黑的夜里，这奇异而美丽的景象能让海面呈现一场精彩的灯光秀！"],"type":"paragraph"}],"original":[{"n":1,"ask":["Write a sentence that tells the main idea of the passage.\n\n________","写一句话概括文章主旨。"],"ans":["Possible answer: Many sea animals have the ability to produce light.","参考答案：许多海洋动物能够发光。"]},{"n":2,"ask":["Explain one way in which an animal can use bioluminescence to lure prey.\n\n________","解释动物利用生物发光引诱猎物的一种方式。"],"ans":["Possible answer: Patterns of bioluminence on a shark’s belly may resemble small fish to predators like tuna or mackerel.","参考答案：金枪鱼或鲭鱼等捕食者可能把鲨鱼腹部发出的光形成的图案当成小鱼。"]},{"n":3,"ask":["What kind of creature produces much of the visible bioluminescence near the ocean’s surface?\n\n________","海面附近大部分可见的生物光来自哪种生物？"],"ans":["dinoflagellates","甲藻。"]},{"n":4,"ask":["How does bioluminescence help camouflage the bobtail squid?\n\n________","生物发光怎样帮耳乌贼伪装？"],"ans":["It spews a cloud of bioluminescent chemicals at its predator and allows the squid to escape.","原书参考答案：它朝捕食者喷出一团发光的化学物质，借机逃走。按第3段，应答：耳乌贼的腹部会发光，从下方看，它能融入夜空的星光。"]},{"n":5,"ask":["How is bioluminescence different from the light produced by a lightbulb?\n\n________","生物发光与灯泡发出的光有什么不同？"],"ans":["Most of its energy is used to create light instead of heat.","生物发光所用的能量大多变成了光，很少变成热。"]},{"n":6,"ask":["What can cause dinoflagellates to glow?\n\n________","什么会让甲藻发光？"],"ans":["any disturbance, including the motion of waves, a boat, a porpoise, or a hand.","任何扰动都会使它发光，比如海浪、船、鼠海豚，甚至手的移动。"]},{"n":7,"ask":["Check the line beside the word or words that best describe what type of selection this is.\n\n- ________ science fiction\n- ________ informative\n- ________ fantasy","勾选最符合本文体裁的一项。\nA. 科幻小说\nB. 说明文\nC. 奇幻故事"],"ans":["✓ informative","B. 说明文。"]},{"n":8,"ask":["The Latin root **mar** means sea. Find a word in paragraph 1 with the root **mar**.\n\n________","拉丁语词根 mar 意为“海”。从第1段找出一个含有 mar 的词。"],"ans":["marine","marine（海洋的）"]},{"n":9,"ask":["The Latin root **fic** means *make or do*. Find a word in paragraph 2 with the root **fic**.\n\n________","拉丁语词根 fic 意为“制造或做”。从第2段找出一个含有 fic 的词。"],"ans":["efficient","efficient（高效的）"]},{"n":10,"ask":["The Latin root **tract** means *pull or drag*. Find a word in paragraph 4 with the root **tract**.\n\n________","拉丁语词根 tract 意为“拉或拖”。从第4段找出一个含有 tract 的词。"],"ans":["attract","attract（吸引）"]}],"alias":"会发光的生物","note":"教材参考答案第 4 题提到另一种鱿鱼的逃生方式。本文第 3 段说明，发光的腹部让这种鱿鱼从下方看像夜空中的星光。"},{"id":"P092","title":["A Stinging Surprise","意外的一蜇"],"lead":["What happens when Miles has an unexpected encounter with a jellyfish?","迈尔斯意外碰到一只水母后，发生了什么？"],"exercise":"P093","genre":"故事","family":"lit","parts":[{"n":1,"t":["Sophie, Miles, and Mr. Taylor walked along the beach. The late afternoon sun reflected off the water and made it sparkle like a sea of diamonds.","索菲、迈尔斯和泰勒先生沿着海滩走。傍晚的阳光映在水面上，让海水像一片钻石的海洋那样闪闪发亮。"],"type":"paragraph"},{"n":2,"t":["“Quick, kids, look at the seagull!” exclaimed Mr. Taylor. He pointed toward a gull that had just swooped down and plucked a large fish from the water. The fish wriggled, and they could see that it was a struggle for the seagull to hold its catch firmly without dropping it.","“孩子们，快看那只海鸥！”泰勒先生叫道。他指着一只刚俯冲下去、从水里叼起一条大鱼的海鸥。鱼不停扭动，他们看得出海鸥得费好大的力气才能牢牢叼住它，不让鱼掉下去。"],"type":"paragraph"},{"n":3,"t":["“I can’t believe that a bird that size can carry such a...ouch! Dad, help! I think I stepped on something!” Miles hopped on one foot, trying to shake the stinging sensation from his other foot. Mr. Taylor reached him quickly and helped Miles take a seat on the warm sand.","“真不敢相信，那么大的鸟能叼起这么大一条……哎哟！爸爸，快来！我好像踩到什么了！”迈尔斯用一只脚跳来跳去，想甩掉另一只脚上的刺痛感。泰勒先生赶紧走到他身边，扶他坐在温暖的沙地上。"],"type":"paragraph"},{"n":4,"t":["“I think that’s what you stepped on,” said Sophie, pointing to a sand-covered, jelly-like blob on the beach. “Is it a jellyfish, Dad?”","“我想你踩到的就是这个，”索菲指着海滩上一团裹着沙子、像果冻一样的东西说，“爸爸，它是水母吗？”"],"type":"paragraph"},{"n":5,"t":["Mr. Taylor nodded. Then, he looked at Miles who was wincing in pain. “You’re all right, Miles,” he said, giving his son a gentle squeeze on the shoulder. He turned to Sophie. “Do you see that lifeguard tower down the beach?” he asked. Sophie nodded. “Can you run over there and tell the lifeguard that we think your brother was stung by a jellyfish?”","泰勒先生点点头。看到迈尔斯疼得直皱眉，他轻轻捏了捏儿子的肩膀，说：“你会没事的，迈尔斯。”他转向索菲问：“你看见海滩那头的救生塔了吗？”索菲点点头。“你能跑过去告诉救生员，我们觉得你弟弟被水母蜇了吗？”"],"type":"paragraph"},{"n":6,"t":["Sophie nodded and headed for the tower. Meanwhile, Mr. Taylor emptied the bucket of seashells and used it to gently rinse the sand from Miles’s foot with seawater.","索菲点点头，朝救生塔跑去。与此同时，泰勒先生把桶里的贝壳倒出来，用桶装了海水，轻轻冲掉迈尔斯脚上的沙子。"],"type":"paragraph"},{"n":7,"t":["“How does that feel?” he asked Miles.","“感觉怎么样？”他问迈尔斯。"],"type":"paragraph"},{"n":8,"t":["“About the same,” replied Miles. “It burns and stings.”","“还是差不多，”迈尔斯答道，“又烧又刺。”"],"type":"paragraph"},{"n":9,"t":["In just a few minutes, Sophie returned with the lifeguard, a friendly-looking man with deeply tanned skin and curly black hair.","短短几分钟后，索菲就带着救生员回来了。那人看起来很和善，皮肤晒得很黑，头发又黑又卷。"],"type":"paragraph"},{"n":10,"t":["He opened a small red and white box and removed some rubbing alcohol. “First, we’re going to clean the area with a bit of alcohol,” he began. “Vinegar works too, just in case you’re ever stung again.”","他打开一个红白相间的小盒子，拿出一些外用酒精。“我们先用一点酒精清洗被蜇的地方，”他说，“如果你以后又被蜇了，醋也可以用。”"],"type":"paragraph"},{"n":11,"t":["“Now what are you going to put on it?” asked Sophie curiously.","“现在您要往上面涂什么？”索菲好奇地问。"],"type":"paragraph"},{"n":12,"t":["“Well, it might sound funny, but I’m making a paste using meat tenderizer and water.” He smeared the paste on the heel of Miles’s foot, which had become red and slightly swollen. “Meat tenderizer is an enzyme that breaks down protein. Jellyfish poison is a protein, so it works on the poison the same way it does on meat.”","“嗯，听起来也许有点奇怪，但我在用嫩肉粉和水调糊。”他把糊涂在迈尔斯已经发红、微微肿起来的脚跟上。“嫩肉粉里有分解蛋白质的酶。水母毒液是蛋白质，所以这种酶作用在毒液上，就跟作用在肉上一样。”"],"type":"paragraph"},{"n":13,"t":["“It actually feels better already,” said Miles in surprise.","“现在已经好些了，”迈尔斯惊讶地说。"],"type":"paragraph"},{"n":14,"t":["The lifeguard smiled. “If you don’t have any meat tenderizer at home, a paste made of baking soda and water will also soothe it. If the area becomes any more irritated in the next couple of hours, I’d suggest seeing a doctor. Otherwise, you’ll probably be feeling much better by morning.”","救生员微微一笑。“要是家里没有嫩肉粉，用小苏打和水调成的糊也能缓解不适。如果接下来几个小时，被蜇的地方更疼痒或肿得更厉害，我建议去看医生。否则，你很可能到明早就会觉得好多了。”"],"type":"paragraph"},{"n":15,"t":["“Thank you for all your help,” said Mr. Taylor, shaking the lifeguard’s hand. “Come on, Miles. This is probably the last piggyback ride you’re going to get before you get taller than me!”","泰勒先生和救生员握了握手，说：“谢谢您的帮助。”然后他说：“来，迈尔斯。等你长得比我还高，我就背不动你啦，这大概是最后一次背你了！”"],"type":"paragraph"}],"original":[{"n":1,"ask":["Number the events below to show the order in which they happened.\n\n- ________ Mr. Taylor shook the lifeguard’s hand.\n- ________ The Taylors watched a seagull
