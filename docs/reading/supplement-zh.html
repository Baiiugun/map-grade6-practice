s is suddenly stung while the family watches a seagull.","一家人看海鸥时，迈尔斯突然被蜇了。"],["Sophie notices the late afternoon sunlight.","索菲注意到傍晚的阳光。"],["Mr. Taylor thanks the lifeguard.","泰勒先生向救生员道谢。"]],"key":1,"why":["The sting turns a relaxed walk into an urgent search for help. The rest of the story follows the family's response.","被蜇使情节从轻松散步转为紧急求助，产生故事的主要冲突，之后的行动都围绕它展开。"],"ev":[{"p":"P092","n":3,"quote":"ouch! Dad, help!"}]},{"id":"R6-P092-F6-01","skill":"F6","pages":["P092"],"src":8,"stem":["What is compared in the phrase “like a sea of diamonds”?","“like a sea of diamonds（像一片钻石的海洋）”把什么作了比较？"],"o":[["The sparkling water and shining diamonds","波光粼粼的海水和闪耀的钻石"],["Miles’s shoe and a seashell","迈尔斯的鞋和一枚贝壳"],["A seagull’s wings and a boat","海鸥的翅膀和一艘船"],["The lifeguard’s tower and a mountain.","救生塔和一座山"]],"key":0,"why":["The word 'like' introduces a simile comparing the sunlight sparkling on the water to the brilliance of diamonds.","like 引出明喻，以钻石的闪亮来描写阳光下的水面，突出视觉效果。"],"ev":[{"p":"P092","n":1,"quote":"The late afternoon sun reflected off the water and made it sparkle like a sea of diamonds."}]},{"id":"R6-P092-B2-01","skill":"B2","pages":["P092"],"src":1,"stem":["Which sequence follows the story?","哪项符合故事中事件的先后顺序？"],"o":[["Miles feels pain → Mr. Taylor thanks the lifeguard → Sophie gets help → watch a seagull","迈尔斯觉得痛 → 泰勒先生向救生员道谢 → 索菲求助 → 看海鸥"],["Mr. Taylor thanks the lifeguard → watch a seagull → Sophie gets help → Miles feels pain","泰勒先生向救生员道谢 → 看海鸥 → 索菲求助 → 迈尔斯觉得痛"],["Watch a seagull → Miles feels pain → Sophie gets the lifeguard → Mr. Taylor thanks him","看海鸥 → 迈尔斯觉得痛 → 索菲请来救生员 → 泰勒先生向救生员道谢"],["Sophie gets help → watch a seagull → Mr. Taylor thanks him → Miles feels pain","索菲求助 → 看海鸥 → 泰勒先生向救生员道谢 → 迈尔斯觉得痛"]],"key":2,"why":["The family watches the gull in paragraph 2, Miles feels pain in paragraph 3, Sophie gets help in paragraphs 5 through 9, and Mr. Taylor thanks the lifeguard in paragraph 15.","按情节时间核对第2、3、5—9、15段，即观察海鸥、突然疼痛、求助、道谢。"],"ev":[{"p":"P092","n":2,"quote":"“Quick, kids, look at the seagull!”"},{"p":"P092","n":3,"quote":"ouch! Dad, help!"},{"p":"P092","n":9,"quote":"In just a few minutes, Sophie returned with the lifeguard, a friendly-looking man with deeply tanned skin and curly black hair."},{"p":"P092","n":15,"quote":"“Thank you for all your help,” said Mr."}]},{"id":"R6-P094-D4-01","skill":"D4","pages":["P094"],"src":1,"stem":["Why does the author begin with a question that sounds like a riddle?","作者为什么用一个听起来像谜语的问题开头？"],"o":[["To ask readers to solve an unrelated math problem","请读者解一道无关的数学题"],["To prove that no such animal exists","证明这种动物不存在"],["To give all instructions for caring for a pet","给出饲养宠物的全部步骤"],["To arouse curiosity about an animal with surprising features","激起读者对这种特征出人意料的动物的好奇心"]],"key":3,"why":["The surprising features described in the opening invite readers to guess the animal and keep reading to learn how a jellyfish survives.","开头的无脑、无骨等特征令人意外，问题形式吸引读者继续寻找答案，随后才点明水母并解释。"],"ev":[{"p":"P094","n":1,"quote":"What kind of animal has no brain, no bones, and no circulatory system?"},{"p":"P094","n":1,"quote":"This might sound like a riddle, but it isn’t."}]},{"id":"R6-P094-C1-01","skill":"C1","pages":["P094"],"src":11,"stem":["What does “invertebrates” mean in this passage?","invertebrates 在本文中是什么意思？"],"o":[["Animals without backbones","没有脊椎的动物"],["Animals with no way to move at all","完全不能移动的动物"],["Animals that live only in freshwater","只生活在淡水中的动物"],["Animals made entirely of jelly","完全由果冻构成的动物"]],"key":0,"why":["The phrase 'which means' introduces a direct definition: invertebrates are animals without backbones.","which means 后面就是作者给出的直接释义：没有脊椎，不是没有任何组织或不能运动。"],"ev":[{"p":"P094","n":2,"quote":"They are invertebrates, which means that they do not have backbones."}]},{"id":"R6-P094-B1-01","skill":"B1","pages":["P094"],"src":12,"stem":["Which statement accurately describes jellyfish movement?","哪项准确描述了水母的移动方式？"],"o":[["They swim rapidly by moving a backbone from side to side.","它们左右摆动脊椎快速游泳。"],["They can never move except when humans carry them.","除非有人搬动它们，否则它们根本不能移动。"],["Currents and wind carry them, and muscle contractions can also move them slowly.","它们随洋流和风移动，也能收缩肌肉缓慢移动。"],["They can move only by walking along the ocean floor.","它们只能在海底行走。"]],"key":2,"why":["Paragraph 6 explains that wind and currents usually carry jellyfish, but muscle contractions also allow them to move slowly on their own.","第6段先说大多靠海流和风移动，再补充肌肉收缩也能缓慢推动。准确转述必须保留这项补充。"],"ev":[{"p":"P094","n":6,"quote":"For the most part, jellyfish are transported by ocean currents and the wind."},{"p":"P094","n":6,"quote":"They have some ability to move through the water by contracting muscles in the main part of the body."}]},{"id":"R6-P096-F2-01","skill":"F2","pages":["P096"],"src":3,"stem":["How are Sophie and Miles different when facing a new activity?","面对一项新的活动，索菲和迈尔斯有什么不同？"],"o":[["Sophie already teaches surfing professionally, while Miles does not.","索菲已经是专业冲浪教练，迈尔斯还不是。"],["Miles is completely fearless, while Sophie refuses to try.","迈尔斯一点也不害怕，索菲却拒绝尝试。"],["Neither of them has any interest in the ocean.","两人对大海都毫无兴趣。"],["Sophie is more ready to plunge in, while Miles is more cautious.","索菲更愿意立刻尝试，迈尔斯更谨慎。"]],"key":3,"why":["Miles is worried about looking silly, whereas Sophie learns quickly and readily tries something new. The narrator also says that Miles is less adventurous.","第3段写 Miles 担心出丑，第4段写 Sophie 学得快、敢尝试，并明确说 Miles 没她那么爱冒险。"],"ev":[{"p":"P096","n":3,"quote":"He was worried about looking silly in front of his cousins, but he had a feeling he was going to love surfing."},{"p":"P096","n":4,"quote":"Miles admired these characteristics in his sister, but knew he just wasn’t as adventurous as she was."}]},{"id":"R6-P096-C2-01","skill":"C2","pages":["P096"],"src":5,"stem":["Which meaning of “nose” is used in paragraph 7?","第7段中的 nose 用的是哪个意思？"],"o":[["The body part used for smelling","用来闻气味的身体部位"],["The loud sound of a wave.","海浪巨大的声响"],["The front end of a surfboard","冲浪板的前端"],["A person’s curiosity about private matters","对别人的私事感到好奇"]],"key":2,"why":["'Nose' is paired with 'tail' and refers to the part at the front of the board that rises above the water.","与 tail 并列、位置在冲浪板前方并高出水面，说明 nose 是板头，而不是人的鼻子。"],"ev":[{"p":"P096","n":7,"quote":"“You need to position yourself in the center of your board, between the nose and the tail."}]},{"id":"R6-P096-F6-01","skill":"F6","pages":["P096"],"src":11,"stem":["What does comparing Kerry’s hair to an otter’s fur emphasize?","把凯丽的头发比作水獭的皮毛，突出了什么？"],"o":[["Its bright red color","它鲜红的颜色"],["Its ability to float without water","它无需水就能漂浮的能力"],["Its smooth, shiny appearance","它光滑而有光泽的样子"],["Its weight compared with the surfboard","它与冲浪板相比的重量"]],"key":2,"why":["'As sleek and glossy as' identifies the relevant qualities shared by Kerry's hair and an otter's fur.","as sleek and glossy as 明确指出相似点是顺滑、有光泽；明喻不是说两者在所有方面都相同。"],"ev":[{"p":"P096","n":2,"quote":"Her dark hair, which was as sleek and glossy as an otter’s fur, was plastered against her head."}]},{"id":"R6-P098-B2-01","skill":"B2","pages":["P098"],"src":6,"stem":["Why did fiberglass and foam boards help surfing become more popular?","玻璃纤维泡沫板为什么使冲浪更受欢迎？"],"o":[["They cost less and were easier to use than wooden boards.","它比木板便宜，也更容易使用。"],["They were heavier and impossible to maneuver.","它更重，而且没法操控。"],["They were available only to professional judges.","只有专业裁判可以买到。"],["They made it possible to surf without any waves.","它能让人在没有浪时冲浪。"]],"key":0,"why":["The new materials made boards cheaper and easier to maneuver. Paragraph 2 connects those changes to surfing's surge in popularity.","第2段把材料变化与较低价格、较容易使用联系起来，随后写 surfing became enormously popular，形成因果链。"],"ev":[{"p":"P098","n":2,"quote":"This made them less expensive, as well as much easier to use and maneuver."},{"p":"P098","n":2,"quote":"Suddenly, surfing became enormously popular in the United States, and surfing culture was born."}]},{"id":"R6-P098-C1-01","skill":"C1","pages":["P098"],"src":9,"stem":["What does “wipeouts” most likely mean in paragraph 8?","第8段中的 wipeouts 最可能是什么意思？"],"o":[["Quiet walks along a beach.","沿着海滩安静地散步"],["Falls or crashes while surfing","冲浪时摔落或发生碰撞"],["Awards given after a competition","比赛结束后颁发的奖项"],["Journeys to buy a new surfboard","外出购买一块新冲浪板"]],"key":1,"why":["The phrase 'likely to be fatal' suggests a dangerous loss of control, such as a fall or crash while surfing.","附近说这种情况 likely to be fatal，语境强调巨浪挑战的危险，因此是摔落或失控，而不是奖项或出行。"],"ev":[{"p":"P098","n":8,"quote":"Wipeouts at Teahupoo are likely to be fatal, but Hamilton took the challenge and survived."}]},{"id":"R6-P098-A3-01","skill":"A3","pages":["P098"],"src":10,"stem":["Which sentence best summarizes paragraph 4?","哪句话最能概括第4段？"],"o":[["The paragraph lists the winners of surfing championships.","本段列出了冲浪锦标赛的获奖者。"],["Every surfer prefers competitions to the natural ocean.","每个冲浪者都更喜欢比赛，对天然海浪没兴趣。"],["Surfers enjoy the ocean, changing challenges, and the thrill of riding waves.","冲浪者喜欢大海、不断变化的挑战，以及乘浪的刺激。"],["Surfing is mainly popular because surfboards are colorful.","冲浪受欢迎主要是因为冲浪板的颜色丰富。"]],"key":2,"why":["Paragraph 4 describes the appeal of the ocean, the constantly changing challenges, and the adrenaline rush of riding waves.","第4段解释吸引人的几个原因：海洋、不断变化的挑战，以及肾上腺素带来的刺激。"],"ev":[{"p":"P098","n":4,"quote":"Surfing appeals to people for several reasons."},{"p":"P098","n":4,"quote":"Surfers also seek the adrenaline rush that comes with riding the waves."}]},{"id":"R6-P100-A1-01","skill":"A1","pages":["P100"],"src":4,"stem":["Why is Kahanamoku called the “father of modern surfing”?","卡哈纳莫库为什么被称为“现代冲浪之父”？"],"o":[["He invented every sport played in the ocean.","他发明了在海里进行的每一种运动。"],["He was the father of every Olympic swimmer.","他是所有奥运游泳运动员的父亲。"],["He built all the surfboards in the world.","他制作了世界上所有的冲浪板。"],["He helped introduce surfing to people outside Hawaii.","他帮助把冲浪介绍给夏威夷以外的人。"]],"key":3,"why":["The opening gives the reason for the title, and paragraph 4 shows how his travels and demonstrations introduced surfing to people worldwide.","第1段点题，第4段说明他通过旅行、介绍和示范推动冲浪走向世界。称号强调推广作用。"],"ev":[{"p":"P100","n":1,"quote":"But what Duke Paoa Kahinu Makoe Hulikohoa Kahanamoku will be most remembered for is bringing surfing to the world outside of Hawaii."},{"p":"P100","n":4,"quote":"As he traveled, Kahanamoku spoke about surfing and demonstrated the sport to audiences around the globe."}]},{"id":"R6-P100-B4-01","skill":"B4","pages":["P100"],"src":3,"stem":["Which detail best supports the claim that Kahanamoku was a successful competitive swimmer?","哪个细节最能说明卡哈纳莫库在游泳比赛中取得了成功？"],"o":[["He had a burial at sea.","他接受了海葬。"],["He liked eating traditional Hawaiian foods.","他喜欢吃夏威夷传统食物。"],["His favorite board was sixteen feet long.","他最喜欢的冲浪板有16英尺长。"],["He won three Olympic gold medals across the 1912 and 1920 Games.","他在1912年和1920年两届奥运会上共赢得三枚金牌。"]],"key":3,"why":["The three Olympic gold medals are direct evidence of his success in competitive swimming.","奥运金牌是竞技游泳成就的直接证据；生活习惯、冲浪板和葬礼不能同样直接证明游泳成绩。"],"ev":[{"p":"P100","n":3,"quote":"Kahanamoku went to the Olympics as a swimmer in 1912 and 1920, where he won a total of three gold medals for the United States."}]},{"id":"R6-P100-F6-01","skill":"F6","pages":["P100"],"src":null,"stem":["What effect does “the ocean was patiently waiting for him” create?","“大海在耐心等他”这句话有什么表达效果？"],"o":[["It reports that the ocean can literally make plans.","表明大海真的会制定计划。"],["It personifies the ocean and emphasizes his deep attachment to it.","把大海当作人来写，突出卡哈纳莫库对大海深厚的感情。"],["It explains why tides change during the day.","解释潮汐在一天内变化的原因。"],["It shows that he was afraid to go near water.","说明他害怕靠近水。"]],"key":1,"why":["The author gives the ocean the human ability to wait patiently. This underscores Kahanamoku's eagerness to return to the water after school and his deep attachment to it.","把“耐心等待”赋予海洋是拟人，写出他放学后急切回海边、与海洋亲近的感觉。"],"ev":[{"p":"P100","n":2,"quote":"He attended school but rushed home every afternoon, knowing that the ocean was patiently waiting for him."}]},{"id":"R6-P102-F2-01","skill":"F2","pages":["P102"],"src":2,"stem":["Which action best shows that Mr. Ishikawa is a supportive coach?","哪一项最能说明石川老师是一位会鼓励队员的教练？"],"o":[["He refuses to speak to anyone before the contest.","他在赛前拒绝和任何人说话。"],["He thanks the students and says he is proud regardless of whether they win.","他感谢学生们，并说无论输赢都为他们骄傲。"],["He threatens to punish the team if it loses.","他威胁说输了就处罚队员。"],["He tells the students their preparation was worthless.","他告诉学生，他们之前的准备毫无价值。"]],"key":1,"why":["In paragraphs 2 and 3, Mr. Ishikawa thanks the team for their hard work and stresses the honor of representing the school and doing their best, regardless of who wins.","第2—3段肯定努力，并把荣誉和尽力放在胜负之前，支持“鼓励队员”的判断。"],"ev":[{"p":"P102","n":2,"quote":"“I want to thank each one of you for your hard work."},{"p":"P102","n":3,"quote":"“Whether or not Schuyler Middle School wins today’s competition, I’m proud of you all,” Mr."}]},{"id":"R6-P102-C1-01","skill":"C1","pages":["P102"],"src":3,"stem":["What does “an infectious laugh” mean here?","这里的“an infectious laugh”是什么意思？"],"o":[["A laugh used only to interrupt the game.","一种专门用来打断比赛的笑声。"],["A laugh that makes other people want to laugh or relax too","一种让别人也想笑或跟着放松下来的笑声。"],["A laugh that no one else can hear","一种别人都听不见的笑声。"],["A laugh caused by a dangerous disease","一种由危险疾病引起的笑声。"]],"key":1,"why":["Paragraph 5 describes Ms. Cane as friendly and says she quickly puts the contestants at ease. Here, infectious has a positive meaning: her laughter makes others want to laugh or relax, too.","第5段说她友善并很快让参赛者放松，因此 infectious 在此指情绪会感染别人，是积极的语境含义。"],"ev":[{"p":"P102","n":5,"quote":"Cane was a tall, friendly woman with thick auburn hair and an infectious laugh."},{"p":"P102","n":5,"quote":"Within a few minutes, she had put all the contestants at ease."}]},{"id":"R6-P102-E4-01","skill":"E4","pages":["P102"],"src":null,"stem":["What atmosphere is established at the beginning?","文章开头营造了怎样的气氛？"],"o":[["Hopelessness after the final results.","结果揭晓后的绝望。"],["Complete boredom with no expectations","无聊透顶，毫无期待。"],["Anger about a canceled holiday","假期取消带来的愤怒。"],["Excitement mixed with nervous anticipation","既兴奋，又带着紧张的期待。"]],"key":3,"why":["The opening describes both excitement and nervous energy. The students are looking forward to a contest that has yet to begin.","开头直接并列 energy and excitement 与 nervous energy，说明既兴奋又紧张；此时比赛尚未开始。"],"ev":[{"p":"P102","n":1,"quote":"The bus was filled with energy and excitement."},{"p":"P102","n":1,"quote":"Students were talking and laughing, but there was also a bit of nervous energy in the air."}]},{"id":"R6-P104-C4-01","skill":"C4","pages":["P104"],"src":3,"stem":["How do the roots “tele” and “visio” help explain “television”?","tele 和 visio 这两个词根如何帮助我们理解 television 的含义？"],"o":[["They suggest seeing images transmitted from far away.","它们让人想到看见从远处传来的图像。"],["They mean writing a message by hand.","它们的意思是用手写一条信息。"],["They describe a machine that makes food.","它们形容一台制作食物的机器。"],["They mean hearing only nearby sounds.","它们的意思是只能听见近处的声音。"]],"key":0,"why":["Tele means “far” and visio means “sight,” so the roots fit a device that lets people see images sent from far away.","tele 是远，visio 是看，合起来与接收远处图像的设备相吻合。"],"ev":[{"p":"P104","n":1,"quote":"The word television comes from the Greek word tele, which means far, and the Latin word visio, which means sight."},{"p":"P104","n":1,"quote":"The word television comes from the Greek word tele, which means far, and the Latin word visio, which means sight."}]},{"id":"R6-P104-B2-01","skill":"B2","pages":["P104"],"src":null,"stem":["What problem led John Watson to put up a giant antenna?","什么问题促使约翰·沃森架设一根巨大的天线？"],"o":[["His town had no interest in any entertainment.","他所在的镇对任何娱乐活动都没兴趣。"],["Weak television signals made customers reluctant to buy TVs.","电视信号太弱，顾客不愿买电视机。"],["He wanted to stop customers from receiving programs.","他想阻止顾客接收节目。"],["All available television sets had screens that were too large.","市面上所有电视机的屏幕都太大。"]],"key":1,"why":["In paragraph 7, weak signals make TVs hard to sell. Watson puts up a giant antenna to improve reception and gives customers access to the stronger signal.","第7段按问题—解决写：信号弱导致销售困难，巨型天线改善接收，再把较强信号送给客户。"],"ev":[{"p":"P104","n":7,"quote":"Television signals were weak by the time they reached his town, and people did not think it was worthwhile to buy a TV."},{"p":"P104","n":7,"quote":"Watson put up a giant antenna to get better reception and offered his customers a free connection to the stronger signal."}]},{"id":"R6-P104-E2-01","skill":"E2","pages":["P104"],"src":null,"stem":["How does the author handle the question of who invented television?","对于谁发明了电视，作者是怎么说的？"],"o":[["The author claims no one ever contributed to television.","作者声称从来没人为电视作出过贡献。"],["The author acknowledges disagreement and describes contributions by more than one person.","作者承认存在分歧，并介绍了不止一人的贡献。"],["The author gives all credit to John Watson for the first electronic TV.","作者把发明第一台电子电视机的功劳全归给约翰·沃森。"],["The author says historians agree on every detail.","作者说历史学家在每个细节上意见都一致。"]],"key":1,"why":["Paragraph 2 acknowledges that many people contributed and that credit is hard to assign. Paragraph 3 describes two inventors’ contributions and notes that historians disagree about who deserves more credit.","第2段强调贡献者很多，难以归于一人；第3段列出两人的角色并提到 historians disagree，体现有保留的评价。"],"ev":[{"p":"P104","n":2,"quote":"Because there were so many contributors, it is hard to pinpoint exactly who gets credit as the inventor of TV."},{"p":"P104","n":3,"quote":"Historians disagree about which man deserves more credit, but today, Farnsworth’s contribution is seen as the crucial first step in the technological developments made by Zworykin."}]},{"id":"R6-P106-A2-01","skill":"A2","pages":["P106"],"src":null,"stem":["Which central claim is supported by the examples in the passage?","文中的例子支持哪一个中心观点？"],"o":[["Radio and television always produce identical impressions.","广播和电视给人的印象总是完全一样。"],["Television has never affected politics or popular culture.","电视从未影响过政治或流行文化。"],["Televised images can influence public opinion and the way people experience historical events.","电视画面能影响公众看法，也能影响人们感受历史事件的方式。"],["Only fictional programs can change how people feel.","只有虚构节目能改变人们的感受。"]],"key":2,"why":["The opening argues that television images shape how the public remembers and experiences history. The author develops the idea with examples from politics, national mourning, popular music, and the moon landing.","开头提出电视影像影响历史记忆与公众，后面用政治、全国哀悼、音乐和登月等例子展开论证。"],"ev":[{"p":"P106","n":1,"quote":"Some events were even shaped by the powerful influence these images have on the public."},{"p":"P106","n":4,"quote":"However, television viewers declared Kennedy the winner."},{"p":"P106","n":6,"quote":"Viewers across the nation saw their goofy grins and goofier haircuts, as well as the crowd’s frenzied cheering, and “Beatlemania” was born."}]},{"id":"R6-P106-B2-01","skill":"B2","pages":["P106"],"src":12,"stem":["According to the passage, why did radio listeners and TV viewers react differently to the debate?","根据文章，为什么广播听众和电视观众对这场辩论的反应不同？"],"o":[["Radio listeners heard an entirely different debate.","广播听众听到的是完全不同的一场辩论。"],["Television viewers could not hear any words.","电视观众听不到任何话。"],["The passage says both groups reacted identically.","文章说两组人的反应完全一样。"],["TV viewers also saw facial expressions and physical appearance.","电视观众还能看到辩论者的表情和外在形象。"]],"key":3,"why":["In paragraph 4, radio listeners hear the words and ideas, while television viewers also see Kennedy smile and Nixon scowl and look uncomfortable. These visual details help explain the different judgments described in the passage.","第4段把只听 words and ideas 与看见 smiling、scowling、uncomfortable 对照，说明视觉表现影响评价。题目以本文描述为依据。"],"ev":[{"p":"P106","n":4,"quote":"Radio listeners, who had heard only the words and ideas, thought that Nixon had won the debate."},{"p":"P106","n":4,"quote":"Viewers saw a younger, smiling Kennedy trading viewpoints with Nixon, who was scowling and looked uncomfortable."}]},{"id":"R6-P106-D4-01","skill":"D4","pages":["P106"],"src":null,"stem":["Why does the author include the Beatles’ television appearance?","作者为什么写到披头士乐队在电视上亮相？"],"o":[["To argue that all historical broadcasts were concerts","为了主张有历史意义的电视转播全都是音乐会。"],["To describe the construction of a television antenna.","为了说明电视天线的构造。"],["To explain how to play every Beatles song","为了讲解披头士乐队的每首歌怎么演奏。"],["To show that television’s influence extends beyond politics into popular culture","为了说明电视的影响从政治延伸到了流行文化。"]],"key":3,"why":["Paragraph 6 begins by noting that some historic television moments had nothing to do with politics. The Beatles example shows television’s influence on popular culture.","第6段开头说 Not all historical moments...involve politics，直接提示该例子的作用是扩大论述范围。"],"ev":[{"p":"P106","n":6,"quote":"Not all historical moments on television involve politics."},{"p":"P106","n":6,"quote":"For instance, the Beatles’ appearance on the Ed Sullivan Show on February 9, 1964, changed American pop culture."}]},{"id":"R6-P108-F3-01","skill":"F3","pages":["P108"],"src":6,"stem":["Why does Grandma think Grandpa asked for canoeing lessons?","奶奶觉得爷爷为什么请她教自己划独木舟？"],"o":[["He hoped to avoid ever seeing her again.","他希望从此再也不用见到她。"],["He needed lessons to build Dillon Dam.","他得学会划船才能修建迪伦大坝。"],["He wanted to become the camp director immediately.","他想立刻当上夏令营负责人。"],["He wanted an opportunity to get to know her.","他想找机会认识她。"]],"key":3,"why":["Grandpa asked for help learning to canoe, and in paragraph 7 Grandma says she thinks he really wanted a chance to get to know her.","虽然表面理由是学划船，奶奶在第7段明确认为更深层的动机是认识她。"],"ev":[{"p":"P108","n":7,"quote":"He asked me to give him canoeing lessons, but I think it was just because he wanted to get to know me.”"}]},{"id":"R6-P108-C5-01","skill":"C5","pages":["P108"],"src":1,"stem":["What does Grandma suggest by saying she learned to survive in the woods “at least in theory”?","奶奶说她“至少理论上”学会了在树林里生存，这句话暗示什么？"],"o":[["She learned what to do but may not have tested it by surviving alone.","她知道该怎么做，但可能从没试过独自在树林里生活。"],["She learned the names of trees only from a comedy show.","她只是从一档喜剧节目里知道了几种树的名字。"],["She never heard any information about survival.","她从没听说过任何野外生存知识。"],["She definitely spent every winter alone in the woods.","她肯定每年冬天都独自在树林里生活。"]],"key":0,"why":["In theory means she knew what to do. Her chuckle suggests she may never have put that knowledge to the test by spending a week alone in the woods.","in theory 区分“知道方法”和“亲自实践”。她的补充和轻笑表明不能把课程学习等同于确实独自在野外生活过。"],"ev":[{"p":"P108","n":5,"quote":"At least in theory,” she chuckled."}]},{"id":"R6-P108-B2-01","skill":"B2","pages":["P108"],"src":5,"stem":["How is a reservoir different from most natural lakes?","水库和大多数天然湖有什么不同？"],"o":[["It is always formed only by falling rain in a mountain hollow.","它总是单靠山间洼地里积下的雨水形成。"],["It cannot contain any water.","它不能蓄水。"],["It must be smaller than every river.","它一定比任何一条河都小。"],["It is created by humans, often by holding water behind a dam.","它由人修建，通常是在坝后蓄水形成的。"]],"key":3,"why":["Grandma explains that most lakes form naturally and reservoirs are made by people. She describes how a dam holds water back to create an artificial lake.","奶奶直接对比 naturally formed 与 made by humans，随后说明建坝蓄水的过程。"],"ev":[{"p":"P108","n":9,"quote":"“Most lakes are naturally formed, but reservoirs are made by humans."},{"p":"P108","n":9,"quote":"When a dam is built, an artificial lake is created by flooding the land behind the dam.”"}]},{"id":"R6-P110-B2-01","skill":"B2","pages":["P110"],"src":3,"stem":["Why can a dam create problems for migratory fish?","水坝为什么会给洄游鱼类带来麻烦？"],"o":[["It removes the need for fish to eat.","它使鱼类不必再进食。"],["It interferes with movement needed for feeding and reproduction.","它妨碍鱼类为觅食和繁殖而移动。"],["It makes all river water salty.","它让所有河水都变咸了。"],["It causes fish to lose every ability to swim.","它使鱼类完全失去游泳的能力。"]],"key":1,"why":["Paragraph 7 explains that migratory fish need to travel upstream and downstream to feed and reproduce. A dam can interrupt or block their route.","第7段说明鱼需要上下游移动以觅食和繁殖，而大坝改变或阻断这样的通路。"],"ev":[{"p":"P110","n":7,"quote":"Dams especially affect migratory fish, like salmon and trout, because they need to move upstream and downstream for feeding and reproduction."}]},{"id":"R6-P110-E2-01","skill":"E2","pages":["P110"],"src":8,"stem":["Which description best captures the author’s treatment of large dams?","哪一项最能概括作者介绍大型水坝的方式？"],"o":[["The author presents only benefits and no drawbacks.","作者只写了好处，没写坏处。"],["The author says dams have never served any purpose.","作者说水坝从来没有任何用处。"],["The author explains benefits and also describes serious environmental and social costs.","作者说明了水坝的好处，也写到严重的环境和社会代价。"],["The author discusses only beavers and no human structures.","作者只谈河狸，完全没谈人造建筑。"]],"key":2,"why":["Paragraphs 2–6 explain how dams support irrigation, water supplies, navigation, and power generation. Paragraph 7 discusses environmental damage and the displacement of communities.","第2—6段讲灌溉、供水、航运和发电；第7段补充环境与迁居问题。评价需同时考虑两面。"],"ev":[{"p":"P110","n":3,"quote":"Water that pools behind these structures can also supply drinking water to cities and towns."},{"p":"P110","n":6,"quote":"Many modern dams harness the power of flowing water, transforming its energy into electricity."},{"p":"P110","n":7,"quote":"Three Gorges Dam has created controversy, for many of the same reasons that other large dams have."}]},{"id":"R6-P110-C4-01","skill":"C4","pages":["P110"],"src":null,"stem":["The root “hydro-” refers to water. How does it help explain “hydroelectric”?","词根 hydro- 指水。这对理解 hydroelectric 有什么帮助？"],"o":[["It describes a dam with no water nearby.","它指附近没有水的水坝。"],["It means electricity is produced only by wind.","它表示只能靠风力发电。"],["It names a kind of dry farming without irrigation.","它指一种不用灌溉的旱作农业。"],["It identifies electricity generated using the energy of flowing water.","它指利用流动的水所产生的能量发电。"]],"key":3,"why":["The root hydro- means “water.” Paragraph 6 explains that a hydroelectric dam uses the energy of flowing water to generate electricity.","词根 hydro- 与 water 有关，结合第6段将 flowing water 的能量转成 electricity 的说明，可推知词义。"],"ev":[{"p":"P110","n":6,"quote":"Many modern dams harness the power of flowing water, transforming its energy into electricity."},{"p":"P110","n":6,"quote":"These dams are hydroelectric dams."}]},{"id":"R6-P110-H3-01","skill":"H3","pages":["P110","P112"],"src":null,"stem":["Which detail from P112 supports P110’s warning that large dams can harm communities and ecosystems?","P112 的哪个细节印证了 P110 所说的大型水坝可能伤害居民社区和生态系统？"],"o":[["The dam’s wall is used for a laser light show.","大坝的墙面用来做激光灯光表演。"],["The Grand Coulee Dam flooded tribal land and disrupted salmon migration.","大古力水坝淹没了部落土地，也阻断了鲑鱼的洄游路线。"],["The dam contains enough concrete for a long highway.","建造大坝用的混凝土足够铺一条很长的公路。"],["The Grand Coulee Dam can be visited by tourists.","游客可以参观大古力水坝。"]],"key":1,"why":["P110 says large dams can displace people and harm migratory fish. P112 gives a concrete example: the Grand Coulee Dam flooded tribal land and disrupted salmon migration.","P110 末段提出大坝会使人迁居并影响洄游鱼类；P112 第5段提供部族土地被淹和鲑鱼迁徙受阻的具体实例，能跨文本支持这一主张。"],"ev":[{"p":"P110","n":7,"quote":"Three Gorges Dam has also displaced millions of people because their homes have been destroyed to make space for the dam."},{"p":"P110","n":7,"quote":"Dams especially affect migratory fish, like salmon and trout, because they need to move upstream and downstream for feeding and reproduction."},{"p":"P112","n":5,"quote":"The land of Native American tribes who lived along the Columbia River was flooded after the construction of the dam, and they were forced to move to new areas."},{"p":"P112","n":5,"quote":"In addition, the dam disrupted the migration of salmon, a staple of their diet."}]},{"id":"R6-P112-E3-01","skill":"E3","pages":["P112"],"src":7,"stem":["What is the author’s overall tone toward the Grand Coulee Dam?","作者谈到大古力水坝时，总体语气如何？"],"o":[["Admiring, while acknowledging its costs","赞叹大坝，也承认它所带来的代价。"],["Completely indifferent to its size and power","对大坝的规模和发电能力完全无动于衷。"],["Entirely hostile, with no mention of achievements","完全反对，丝毫不提它的成就。"],["Humorous about a fictional structure.","用幽默的口吻谈论一座虚构的建筑。"]],"key":0,"why":["Words such as amazing, enormous, and incredible show the author’s admiration, as does the suggestion that readers visit. Paragraphs 5 and 6 also acknowledge harm to tribal communities and the environment.","amazing、enormous、incredible 等用词及建议参观显示赞叹；第5—6段又承认对部族和环境的损失，因此不能说只写赞美。"],"ev":[{"p":"P112","n":1,"quote":"The Grand Coulee Dam, on the Columbia River in Washington State, is one of humankind’s most amazing structures."},{"p":"P112","n":5,"quote":"Although the dam proved to be beneficial to the area and to the nation, there were also drawbacks to its existence."},{"p":"P112","n":8,"quote":"With its enormous size and incredible power, no wonder it is often considered to be the Eighth Wonder of the World."}]},{"id":"R6-P112-B3-01","skill":"B3","pages":["P112"],"src":2,"stem":["Why does the author say money could not buy back what the Colville tribe lost?","作者为什么说金钱买不回科尔维尔部落失去的一切？"],"o":[["The government paid the tribe in a currency no one used.","政府用了没人使用的货币来支付。"],["Land, ways of life, and disruption cannot all be restored by payment alone.","仅凭付款，无法归还土地、恢复原有的生活方式，也无法弥补所有扰乱造成的损失。"],["The author says the tribe did not actually have to move.","作者说该部落其实并不需要迁走。"],["The tribe lost only a small shop receipt.","部落只丢失了一张小小的购物收据。"]],"key":1,"why":["Paragraph 5 describes families losing their land and a staple food source. Paragraph 6 explains that financial compensation could not restore what the community had lost, including ties to its land and way of life.","第5段提到迁离原居地与主要食物来源受影响，第6段说补偿无法买回所失，暗示损失包括不可简单以金钱恢复的生活和文化联系。"],"ev":[{"p":"P112","n":5,"quote":"The land of Native American tribes who lived along the Columbia River was flooded after the construction of the dam, and they were forced to move to new areas."},{"p":"P112","n":5,"quote":"In addition, the dam disrupted the migration of salmon, a staple of their diet."},{"p":"P112","n":6,"quote":"Although the tribe received millions of dollars, the money could not buy back what its members and their relatives had lost."}]},{"id":"R6-P112-B1-01","skill":"B1","pages":["P112"],"src":3,"stem":["How long did construction take?","水坝的修建用了多久？"],"o":[["Nine years","9年。"],["Nineteen years","19年。"],["Three years","3年。"],["Forty-two years","42年。"]],"key":0,"why":["Paragraph 2 gives the years construction began and ended, 1933 and 1942, and directly states that it took nine years.","第2段明确给出1933年开工、1942年完成，并直接写 nine years。"],"ev":[{"p":"P112","n":2,"quote":"When the dam was finally completed in 1942, nine years after it was begun, it was the largest dam in the world."}]},{"id":"R6-P114-C4-01","skill":"C4","pages":["P114"],"src":2,"stem":["The root “graph” means “write.” Which word uses that root in paragraph 9?","词根 graph 意为“写”。第9段中，哪个词含有这个词根？"],"o":[["Authors","Authors（作家）"],["Autographed","Autographed（亲笔签名的）"],["Questions","Questions（问题）"],["Copies","Copies（册、本）"]],"key":1,"why":["Autographed contains graph. The context of authors selling signed books connects the root “write” to writing one’s signature.","autographed 含 graph，结合作者出售签名书的语境，可将词根“写”与亲笔签名联系起来。"],"ev":[{"p":"P114","n":9,"quote":"They could sell autographed copies of their books and answer questions students have about being a writer.”"}]},{"id":"R6-P114-F3-01","skill":"F3","pages":["P114"],"src":null,"stem":["How does Tanika’s attitude change?","塔妮卡的态度发生了怎样的变化？"],"o":[["She stays angry at Caleb throughout.","她从头到尾都对凯莱布很生气。"],["She forgets the event and becomes interested only in sports.","她忘了这次活动，只对体育感兴趣。"],["She changes from worried about planning to excited and optimistic.","她起初担心怎样策划，后来变得兴奋、乐观。"],["She changes from eager to completely unwilling to help.","她起初很积极，后来完全不愿意帮忙。"]],"key":2,"why":["At first, Tanika worries that her lack of experience will cause her to overlook something important. After she and Caleb come up with concrete plans, she can hardly wait for the fair and says his optimism has rubbed off on her.","开头她担心经验不足、遗漏细节；结尾在共同提出方案后，已迫不及待并受到 Caleb 乐观态度影响。"],"ev":[{"p":"P114","n":1,"quote":"Rutledge trusted us to work out all the details, but I’m still worried that we’ll forget something important.”"},{"p":"P114","n":12,"quote":"“Now I just can’t wait for it to get here,” she said."},{"p":"P114","n":12,"quote":"“I think a little of your optimism has started to rub off on me!”"}]},{"id":"R6-P114-D1-01","skill":"D1","pages":["P114"],"src":11,"stem":["How does the story mainly develop its problem and response?","这个故事主要是怎样交代问题和应对办法的？"],"o":[["The story begins after the results and moves backward to infancy.","故事从结果写起，然后倒叙到婴儿时期。"],["A narrator lists unrelated facts about every school library.","叙述者列举了有关各所学校图书馆的互不相关的事实。"],["The students solve the problem by canceling the fair.","学生通过取消书展解决了问题。"],["The students worry about planning, then brainstorm practical ways to improve the fair.","学生先为策划书展发愁，接着一起想出能把书展办好的具体办法。"]],"key":3,"why":["The story first introduces the planning challenge and the students’ concerns. They respond by brainstorming practical ideas such as themed displays and author visits.","情节由筹备任务和担忧，引出主题展区、作家活动等具体方案，体现问题—解决的组织。"],"ev":[{"p":"P114","n":1,"quote":"Rutledge trusted us to work out all the details, but I’m still worried that we’ll forget something important.”"},{"p":"P114","n":6,"quote":"“What if we set up areas with different themes?”"},{"p":"P114","n":9,"quote":"“What about trying to see if we could get a few writers to come in on the day of the book fair?"}]},{"id":"R6-P116-F5-01","skill":"F5","pages":["P116"],"src":6,"stem":["What type of selection is this?","这篇文章属于什么体裁？"],"o":[["Realistic fiction","写实小说。"],["An autobiography by a famous librarian.","一位著名图书管理员的自传。"],["A tall tale with impossible events","含有不可能发生的事件的夸张故事。"],["A science-fiction story about space travel","关于太空旅行的科幻故事。"]],"key":0,"why":["A school book fair and the characters’ conversations are events that could happen in real life. Those realistic details make the passage realistic fiction.","人物对话和学校书展的情节符合现实生活可能发生的故事；文章不是本人回忆录，也没有超自然事件。"],"ev":[{"p":"P116","n":1,"quote":"Tanika and Caleb sat at a large round table in the library with their teacher, Mr."},{"p":"P116","n":2,"quote":"“We have the totals from last weekend’s book fair, and we wanted to share them with you,” he continued."}]},{"id":"R6-P116-C1-01","skill":"C1","pages":["P116"],"src":7,"stem":["What does “allocating” mean in paragraph 6?","第6段的 allocating 是什么意思？"],"o":[["Counting how many students are absent","清点有多少学生缺席。"],["Deciding how to distribute or use the money","决定如何分配或使用这笔钱。"],["Returning all books to their shelves","把所有书放回书架。"],["Canceling a project before it begins.","在项目开始前取消它。"]],"key":1,"why":["The references to necessities, the remaining money, and how it will be used show that allocating means deciding how to distribute the funds.","紧随其后的 necessities、remaining money、how...will be used 说明讨论的是资金分配。"],"ev":[{"p":"P116","n":6,"quote":"Rutledge, “we’ve decided that we could use your help in allocating the money we raised."},{"p":"P116","n":6,"quote":"However, it has not yet been decided how the remaining money will be used."}]},{"id":"R6-P116-F2-01","skill":"F2","pages":["P116"],"src":1,"stem":["What does Caleb’s suggestion about letting students choose books reveal?","凯莱布提议让学生选书，这说明了什么？"],"o":[["He wants all credit and all decisions for himself.","他想独揽功劳，自己作所有决定。"],["He appreciates the contributions of others.","他感激别人的贡献。"],["He believes only adults helped with the fair.","他认为只有大人为书展出了力。"],["He dislikes the idea of adding books to the library.","他不喜欢给图书馆添新书的想法。"]],"key":1,"why":["Caleb points out that every class contributed and suggests letting students help choose the books. His idea gives them a voice and shows that he values their work.","他先说每个班都有贡献，再建议让大家参与选书，以此表达感谢和分享成果。"],"ev":[{"p":"P116","n":7,"quote":"Students from every class contributed, and it would be nice if there was a way we could show our appreciation."},{"p":"P116","n":7,"quote":"Could they help decide which books will be added to the library’s collection?”"}]},{"id":"R6-P118-A3-01","skill":"A3","pages":["P118"],"src":null,"stem":["Which title would best summarize the passage?","哪个标题最能概括本文？"],"o":[["Louis Sachar: His Path to Writing and His Creative Process","路易斯·萨奇尔：他的写作之路和创作方法"],["A Complete Guide to Learning Russian","学习俄语完全指南"],["The Rules of an Elementary School Playground","小学校园游乐场的规则"],["How Every Writer Must Become a Lawyer","为什么每个作家都必须成为律师"]],"key":0,"why":["The first half explains how Sachar became a full-time writer. The second describes where he gets ideas and how he drafts and revises, so the best title needs to cover both his career and his process.","前半篇写他如何成为全职作家，后半篇写灵感、写作和修改方式，标题需要概括两部分。"],"ev":[{"p":"P118","n":5,"quote":"In 1989, Sachar quit his job as an attorney and became a writer."},{"p":"P118","n":6,"quote":"Sachar spends about two hours writing each morning, when he feels most fresh and sharp."},{"p":"P118","n":8,"quote":"In fact, he may rewrite his story five or six times before he even sends it to his publisher."}]},{"id":"R6-P118-B2-01","skill":"B2","pages":["P118"],"src":5,"stem":["Why did Sachar not immediately become a full-time writer after his first book?","为什么萨奇尔没有在第一本书出版后立即成为全职作家？"],"o":[["He was not confident that writing would support him financially.","他没有把握靠写作养活自己。"],["He had already decided never to publish again.","他已经决定再也不出版作品了。"],["He disliked every experience working with children.","他讨厌和孩子相处的所有经历。"],["His publisher required him to study Russian for ten years.","出版社要求他学习十年俄语。"]],"key":0,"why":["Paragraph 4 says Sachar was unsure he could make a living as a writer. Publishing one book had yet to give him confidence in a steady income from writing.","第4段明确说不确定能否靠写作为生；出版第一本书不等于立刻具备稳定收入。"],"ev":[{"p":"P118","n":4,"quote":"By this time, Sachar had published his first children’s book, but he didn’t feel confident about making a living as a writer."}]},{"id":"R6-P118-F6-01","skill":"F6","pages":["P118"],"src":null,"stem":["What does the “seed of an idea” and its “branches” suggest?","“想法的种子”与“枝条”的比喻说明了什么？"],"o":[["A small starting idea can grow into many connected ideas.","最初的小点子可以生发出许多相互关联的新想法。"],["A book must be printed on wood from a particular tree.","一本书必须印在用某种树制成的纸上。"],["Ideas always appear as complete outlines before writing starts.","动笔之前，点子总是以完整提纲的形式出现。"],["Sachar writes only about gardening.","萨奇尔只写园艺。"]],"key":0,"why":["The plant metaphor shows how a small idea can branch into many related ideas as the writer works.","作者用植物从种子长出分枝的形象说明创意发展：先有一点想法，再在写作过程中生出更多联系。"],"ev":[{"p":"P118","n":7,"quote":"Instead, he begins with just a seed of an idea—maybe a character trait or a funny event."},{"p":"P118","n":7,"quote":"Those ideas branch out into other ideas, and before he knows it, a new book is well on its way."}]},{"id":"R6-P118-H1-01","skill":"H1","pages":["P118","P120"],"src":null,"stem":["Which idea is supported by both P118 and P120?","哪个观点同时得到 P118 和 P120 的支持？"],"o":[["A writer should never revise any sentence.","写作者绝不该修改任何一句话。"],["Writing develops through continued practice and effort, rather than a perfect first attempt.","写作靠持续练习和努力逐渐进步，一开始无需写得完美。"],["Success requires every writer to become an attorney.","每位作家都要当过律师才会成功。"],["Writers should avoid reading other people’s work.","写作者应该避免读别人的作品。"]],"key":1,"why":["P118 describes Sachar rewriting his work five or six times. P120 recommends writing every day and accepting imperfect first attempts, so both emphasize practice and revision.","P118 说 Sachar 一部作品会改五六遍；P120 说每天写、允许一开始写得不完美。合并两篇可见持续练习和改进的重要性。"],"ev":[{"p":"P118","n":8,"quote":"In fact, he may rewrite his story five or six times before he even sends it to his publisher."},{"p":"P120","n":3,"quote":"It doesn’t matter if you feel like you have nothing to say; the important thing is that you write every single day."},{"p":"P120","n":3,"quote":"Sometimes, you need to give yourself permission to write things you know won’t be your best work."}]},{"id":"R6-P120-D1-01","skill":"D1","pages":["P120"],"src":null,"stem":["How does the numbered format help the reader?","采用编号有什么作用？"],"o":[["It ranks six fictional characters by age.","按年龄给六个虚构人物排序。"],["It gives the dates of six historical events.","列出六个历史事件的日期。"],["It shows that every writer must follow a minute-by-minute schedule.","表明每位作家都得按细化到每一分钟的日程行动。"],["It separates major recommendations so they are easy to find and review.","把主要建议分开，方便查找和复习。"]],"key":3,"why":["Each number introduces a different recommendation, and the short heading tells readers what it covers. The format makes the advice easy to locate and review.","六个编号对应不同建议，标题概括各节重点；编号起导航和分组作用，不等同于严格的先后操作顺序。"],"ev":[{"p":"P120","n":1,"quote":"Read everything you can."},{"p":"P120","n":4,"quote":"Join or start a writing group."},{"p":"P120","n":6,"quote":"Stay positive."}]},{"id":"R6-P120-B5-01","skill":"B5","pages":["P120"],"src":3,"stem":["A writer wants to send a story to a magazine. Which action follows the passage’s advice?","一位写作者想给杂志投一篇故事。哪种做法符合文中的建议？"],"o":[["Read previous issues and follow that magazine’s submission guidelines.","翻阅往期杂志，并按照这家杂志的投稿要求投稿。"],["Copy an existing article word for word.","逐字照抄一篇已经发表的文章。"],["Send the story without checking anything about the magazine.","完全不了解杂志的情况就把故事寄过去。"],["Ignore the magazine’s interests and requested format.","不理会杂志关注的内容和规定的格式。"]],"key":0,"why":["Step 5 advises writers to check whether their work fits a magazine by reading previous issues. The next paragraph also tells them to follow the outlet’s submission guidelines.","第5项要求研究刊物内容是否适合，第5项后面的补充说明要求遵守格式。应同时满足内容匹配与投稿规范。"],"ev":[{"p":"P120","n":5,"quote":"If you are sending your writing to a magazine, look through old issues."},{"p":"P120","n":"u2","quote":"Also make sure that you pay attention to the guidelines."}]},{"id":"R6-P122-F4-01","skill":"F4","pages":["P122"],"src":null,"stem":["How does the narrative point of view change?","叙述视角是怎样变化的？"],"o":[["The first seven paragraphs use first person; the last shifts to third person about Tyler.","前七段用第一人称，最后一段改用第三人称讲述泰勒的情况。"],["The whole selection is told by Tyler’s teacher using “we.”","整篇都是泰勒的老师用“我们”来讲述的。"],["The first part is third person and the last becomes a ship’s diary.","开头用第三人称，最后变成了航海日志。"],["There is no narrator in either part.","两个部分都没有叙述者。"]],"key":0,"why":["For seven paragraphs, the narrator describes the island adventure using I and my. The last paragraph switches to Tyler and he as an outside narrator describes Tyler waking up.","前七段反复使用 I、my 讲述岛上经历；最后改用 Tyler、he 从外部叙述醒来的动作。"],"ev":[{"p":"P122","n":1,"quote":"When I woke up, my mouth was full of sand and the sun was glaring angrily at me from high in the cloudless sky."},{"p":"P122","n":8,"quote":"Tyler lay on his bed with his eyes open for a moment before he could identify the sound."}]},{"id":"R6-P122-D1-01","skill":"D1","pages":["P122"],"src":9,"stem":["What does the final paragraph reveal about the island adventure?","最后一段揭示了这场荒岛历险的什么真相？"],"o":[["It was a dream influenced by the book Tyler had been reading.","这是一场受泰勒正在读的书影响而做的梦。"],["The ship’s captain has moved into Tyler’s classroom.","船长已经搬进了泰勒的教室。"],["The whole story is a factual rescue report written at sea.","整个故事是在海上写的一份真实救援报告。"],["Tyler has actually lived alone on the island for twenty-eight years.","泰勒真的在岛上独自生活了二十八年。"]],"key":0,"why":["The rumble of the garbage truck picks up the sound of thunder in the dream. Tyler wakes and drops the book from his bed, revealing how the book inspired the adventure.","垃圾车的轰鸣接上梦中的雷声，随后写 Tyler 醒来、床上的书掉下。这一转折让读者重新理解前面的叙述。"],"ev":[{"p":"P122","n":7,"quote":"I raced after it as the first sounds of thunder rumbled around me."},{"p":"P122","n":8,"quote":"The garbage truck growled and rumbled as it chugged down the street."},{"p":"P122","n":8,"quote":"The bearded face of Robinson Crusoe stared up at Tyler from the cover of the book as he fumbled for his glasses."}]},{"id":"R6-P122-F6-01","skill":"F6","pages":["P122"],"src":3,"stem":["Which phrase is an example of personification?","哪句话用了拟人手法？"],"o":[["Tyler glanced at his bedside clock.","泰勒瞥了一眼床头的钟。"],["The sun was glaring angrily at me.","太阳怒气冲冲地瞪着我。"],["My mouth was full of sand.","我满嘴都是沙子。"],["I found a canvas bag.","我发现一个帆布袋。"]],"key":1,"why":["Glaring angrily is a human action and emotion. Attributing it to the sun is personification and emphasizes how uncomfortable the fierce sunlight makes the narrator.","把人会有的“愤怒瞪视”赋予太阳，是拟人，强化了主人公被烈日逼迫的不适感。"],"ev":[{"p":"P122","n":1,"quote":"When I woke up, my mouth was full of sand and the sun was glaring angrily at me from high in the cloudless sky."}]},{"id":"R6-P124-B2-01","skill":"B2","pages":["P124"],"src":null,"stem":["How did Selkirk reduce his problem with rats?","塞尔柯克是怎么缓解鼠患的？"],"o":[["He planted vegetables only on the beach.","他只在沙滩上种蔬菜。"],["He used meat to encourage cats to stay nearby.","他用肉把猫引来并留在附近。"],["He stopped building shelters.","他不再搭棚屋了。"],["He asked the ship’s crew to return every night.","他让船员每天晚上回来。"]],"key":1,"why":["In paragraph 7, rats gnaw at Selkirk while he sleeps. He solves the problem by using meat to keep cats nearby, which helps control the rats.","第7段先提出夜间被老鼠啃咬的问题，再说用肉吸引猫留在附近，以控制鼠群，构成问题—解决关系。"],"ev":[{"p":"P124","n":7,"quote":"At first, Selkirk had a serious problem with the island’s rats, which gnawed at him at night while he slept."},{"p":"P124","n":7,"quote":"Selkirk found that he could easily control the rat population by using meat to entice the cats to remain nearby."}]},{"id":"R6-P124-F3-01","skill":"F3","pages":["P124"],"src":null,"stem":["How did Selkirk feel after returning to society?","回到社会后，塞尔柯克有什么感受？"],"o":[["He had never learned to live alone at all.","他从未学会独自生活。"],["He had difficulty adjusting and still missed the island’s peace.","他很难重新适应，依旧怀念岛上的宁静。"],["He wanted to return because there was no food in society.","他想回岛上，因为在社会上找不到食物。"],["He instantly forgot every part of island life.","他马上忘了岛上的所有经历。"]],"key":1,"why":["Paragraph 9 describes his difficulty getting used to other people again and recovering his language skills. It also says he continued to miss the island’s peace.","第9段既写重新适应人群和语言的困难，又写始终有部分内心怀念岛上宁静，体现复杂感受。"],"ev":[{"p":"P124","n":9,"quote":"When he was finally rescued by a ship called the Duke, Selkirk found that it was difficult to adjust to being around people again and that he had lost some of his language skills."},{"p":"P124","n":9,"quote":"He became accustomed to living in society again, but a part of him always missed the peace of the island."}]},{"id":"R6-P124-B1-01","skill":"B1","pages":["P124"],"src":3,"stem":["Which source does the passage identify as an account of Selkirk’s experiences?","文章指出，哪一部作品记述了塞尔柯克的经历？"],"o":[["A collection of poems written before Selkirk was born","一部在塞尔柯克出生前写成的诗集。"],["A television interview with Robinson Crusoe.","对鲁滨逊·克鲁索的电视采访。"],["A Cruising Voyage Round the World by Woodes Rogers, captain of the rescue ship","救援船船长伍兹·罗杰斯所著的《环球巡航记》。"],["A gardening manual by Selkirk’s neighbor","塞尔柯克的邻居写的一本园艺手册。"]],"key":2,"why":["Paragraph 10 identifies A Cruising Voyage Round the World, by rescue ship captain Woodes Rogers, as an account of Selkirk’s experiences. Robinson Crusoe is a fictional story inspired by them.","第10段给出作者、书名及其与救援船的关系，让读者知道文中经历记载的来源。Robinson Crusoe 是受启发的虚构故事。"],"ev":[{"p":"P124","n":10,"quote":"In 1712, Woodes Rogers, captain of the Duke, published A Cruising Voyage Round the World, which included an account of Alexander Selkirk’s experiences in the Juan Fernández Islands."},{"p":"P124","n":10,"quote":"In 1712, Woodes Rogers, captain of the Duke, published A Cruising Voyage Round the World, which included an account of Alexander Selkirk’s experiences in the Juan Fernández Islands."}]},{"id":"R6-P126-F3-01","skill":"F3","pages":["P126"],"src":null,"stem":["How do Chiara and her mother feel by the end?","故事结尾，基娅拉和妈妈是什么心情？"],"o":[["Ready to move back before buying any plants.","还没买任何植物，就准备搬回去。"],["Excited by the possibility of creating a colorful desert garden","因为有望种出五彩缤纷的沙漠花园而兴奋。"],["Certain that no plants can grow in Arizona","认定亚利桑那州什么植物都长不出来。"],["Angry that Joseph refuses to help","因为约瑟夫不愿帮忙而生气。"]],"key":1,"why":["At first, Chiara and her mother miss their old yard and doubt much can grow in their new one. After seeing the possibilities, they smile and start putting plants in the cart, eager to begin.","起初想念原来的绿意、怀疑新地方能种什么；听到本地植物选择后，她们笑着装车并期待开始，说明态度转为积极。"],"ev":[{"p":"P126","n":4,"quote":"“It doesn’t look like we could grow much here, does it?”"},{"p":"P126","n":12,"quote":"“I don’t think we had any idea what a lush, colorful garden we could have in the desert!”"},{"p":"P126","n":13,"quote":"“I can’t wait to begin,” said Chiara, already loading plants into the cart."}]},{"id":"R6-P126-B2-01","skill":"B2","pages":["P126"],"src":8,"stem":["Why does Joseph recommend native plants?","约瑟夫为什么推荐种本地植物？"],"o":[["They can grow only in Massachusetts.","它们只能在马萨诸塞州生长。"],["They are the only plants whose flowers have any color.","只有这些植物才能开出有颜色的花。"],["They suit the local climate and need less extra watering.","它们适应当地气候，需要额外浇的水较少。"],["They must always be kept indoors without sunlight.","它们必须一直养在室内，不能见阳光。"]],"key":2,"why":["In paragraph 9, Joseph explains that native plants thrive in the local climate. Choosing them saves time watering plants adapted to another region.","第9段说明本地植物能适应该气候，因此不用花大量时间浇灌不适合此地的植物。"],"ev":[{"p":"P126","n":9,"quote":"They thrive in this climate for a reason, and you won’t have to spend all your time watering plants that were meant to live somewhere else.”"}]},{"id":"R6-P126-F6-01","skill":"F6","pages":["P126"],"src":5,"stem":["What does “Arizona and Massachusetts could be different planets” emphasize?","“亚利桑那州和马萨诸塞州简直像在两个星球上”强调了什么？"],"o":[["Both states have exactly the same weather.","两个州的天气一模一样。"],["Arizona has no connection to Earth’s natural processes.","亚利桑那州与地球的自然过程毫无联系。"],["The landscapes feel dramatically different to Mrs. Giardini.","贾尔迪尼夫人觉得两地的景色差别极大。"],["The family has literally traveled to another planet.","这家人真的去了另一颗星球。"]],"key":2,"why":["The comparison exaggerates the difference between the two landscapes to convey how unfamiliar Arizona feels to Mrs. Giardini.","这是夸张比较，用“不同星球”放大环境差异，表达刚搬来时的不熟悉感，不是天文事实。"],"ev":[{"p":"P126","n":3,"quote":"Arizona and Massachusetts could be different planets, as far as the landscape is concerned."},{"p":"P126","n":3,"quote":"Arizona and Massachusetts could be different planets, as far as the landscape is concerned."}]},{"id":"R6-P128-A1-01","skill":"A1","pages":["P128"],"src":null,"stem":["Which statement best summarizes the passage’s main idea?","哪句话最能概括文章的中心思想？"],"o":[["All deserts are hot sandy places with no variation.","所有沙漠都一样，是又热又满是沙子的地方。"],["The passage is mainly a biography of Marco Polo.","本文主要讲的是马可·波罗的生平。"],["Deserts are dry environments with varied temperatures, surfaces, and landscapes.","沙漠是干燥的环境，气温、地表和地貌各有不同。"],["Every desert receives heavy rain throughout the year.","每片沙漠一年到头都下大雨。"]],"key":2,"why":["The passage introduces the dry conditions that deserts share and then explores differences in temperature, surface, and landscape through several examples.","全文先界定干燥特点，再写冷热、沙地与石地以及不同沙漠实例，强调沙漠的共同点与多样性。"],"ev":[{"p":"P128","n":1,"quote":"Although lack of precipitation is the most obvious characteristic of desert regions—they receive less than ten inches per year—deserts also have high rates of evaporation."},{"p":"P128","n":3,"quote":"Some deserts are not hot, even during the day."},{"p":"P128","n":5,"quote":"However, only about 20 percent of Earth’s deserts are made of sand."}]},{"id":"R6-P128-B5-01","skill":"B5","pages":["P128"],"src":null,"stem":["According to the passage, could a very cold region with little precipitation be a type of desert?","根据文章，极冷又很少降水的地区可能属于沙漠吗？"],"o":[["Yes, but only if it receives daily heavy rain.","可能，但必须天天下大雨。"],["Yes; the passage describes frozen deserts called tundras.","可能。文章描述了一种叫苔原的冰冻沙漠。"],["No; only areas covered entirely in sand can qualify.","不可能，只有地表全被沙子覆盖的地区才算沙漠。"],["No; every desert must be hot all day and all year.","不可能，沙漠必须一年到头全天炎热。"]],"key":1,"why":["Paragraph 3 uses tundra as an example of a cold region with little precipitation. By the passage’s definition, a desert can be very cold.","把“缺少降水”这一标准应用到冷地区，再用第3段的冻原实例核对。炎热并不是本文所说所有沙漠都必须具有的条件。"],"ev":[{"p":"P128","n":1,"quote":"Although lack of precipitation is the most obvious characteristic of desert regions—they receive less than ten inches per year—deserts also have high rates of evaporation."},{"p":"P128","n":3,"quote":"Areas with low precipitation and high evaporation rates located in the extreme Northern Hemisphere are called tundras, a type of frozen desert."}]},{"id":"R6-P128-F6-01","skill":"F6","pages":["P128"],"src":8,"stem":["Why are sand dunes compared with ocean waves?","为什么把沙丘比作海浪？"],"o":[["Their curved forms resemble waves, and wind continually reshapes them.","它们弯曲的外形像波浪，风又会不断改变它们的形状。"],["Desert dunes are made of saltwater.","沙漠里的沙丘由咸水构成。"],["Every dune remains fixed forever.","每座沙丘永远固定在原处。"],["The ocean is the only place where wind occurs.","海上是唯一有风的地方。"]],"key":0,"why":["Paragraph 4 compares the shape of dunes to frozen waves. Paragraph 5 carries the comparison further by explaining that wind moves and reshapes the sand the way ocean waves shift.","第4段从外形比喻为凝固波浪，第5段又说明风使其不断改变形状；类比包括形状和变化，并非物质相同。"],"ev":[{"p":"P128","n":4,"quote":"Looking like giant, frozen ocean waves, sand dunes reach up to meet the brilliant blue sky."},{"p":"P128","n":5,"quote":"The sand gets pushed around, just like water in the sea, and shifted and shaped into constantly changing wave-like forms."}]},{"id":"R6-P130-A3-01","skill":"A3","pages":["P130"],"src":5,"stem":["Which sentence best summarizes paragraph 6?","哪句话最能概括第6段？"],"o":[["The unusual phone calls helped strangers feel connected across long distances.","这些非同寻常的电话让相隔很远的陌生人感到彼此有了联系。"],["The Internet made it impossible for strangers to talk.","互联网让陌生人之间无法交谈。"],["The paragraph explains how to repair a damaged phone line.","这一段解释了如何修理有故障的电话线。"],["Every caller discussed only the price of mining equipment.","每位来电者只谈采矿设备的价格。"]],"key":0,"why":["Paragraph 6 describes strangers introducing themselves, sharing where they were calling from, and explaining how they heard about the booth. Those conversations made the world seem smaller, much as the internet does.","第6段先讲陌生人交流身份、地点和如何听说电话亭，再概括它像互联网一样使世界显得更小。"],"ev":[{"p":"P130","n":6,"quote":"They usually identified themselves and discussed where they were calling from and how they had heard about the phone booth."},{"p":"P130","n":6,"quote":"One thing people love about the Internet is how it seems to make the world feel smaller."}]},{"id":"R6-P130-B2-01","skill":"B2","pages":["P130"],"src":null,"stem":["Why did officials decide to remove the phone booth?","为什么有关部门决定拆除电话亭？"],"o":[["They believed no person had ever used it.","他们认为从来没人用过。"],["The miners asked to replace every road with a river.","矿工们要求把所有公路换成河道。"],["They worried that increased visitor traffic could damage the desert environment.","他们担心来访人数增多会破坏沙漠环境。"],["They needed to move the booth onto a spacecraft.","他们需要把电话亭搬到飞船上。"]],"key":2,"why":["Paragraph 7 connects publicity about the booth to increased visitor traffic. Officials feared the traffic would damage the desert and felt responsible for protecting it.","第7段把宣传、访客增多、潜在环境损害与保护土地的责任联系起来，说明移除原因。"],"ev":[{"p":"P130","n":7,"quote":"The National Park Service felt that the area was receiving too much traffic as a result of all the publicity surrounding the booth."},{"p":"P130","n":7,"quote":"They were worried that it might somehow damage the environment, and they felt that it was their responsibility to protect the land of the Mojave Desert National Preserve."}]},{"id":"R6-P130-D1-01","skill":"D1","pages":["P130"],"src":null,"stem":["How does the passage mainly trace the phone booth’s story?","本文主要按什么顺序讲述电话亭的故事？"],"o":[["By ranking deserts according to their size.","按沙漠面积大小排名。"],["From its practical origin, through unexpected fame, to its removal","从最初的实际用途讲起，接着写它意外走红，最后写到它被拆除。"],["As a set of directions for installing a phone booth","以一套电话亭安装步骤来讲述。"],["From the removal backward to the invention of all telephones","从电话亭被拆除倒叙到所有电话的发明。"]],"key":1,"why":["The passage follows events in order: the booth was installed for miners, Daniels and the internet drew attention to it, and officials eventually removed it.","开头交代为矿工安装，接着 Daniels 和网络带来关注，末尾是移除和余波，主要按事件发展组织。"],"ev":[{"p":"P130","n":1,"quote":"It seems like an odd location for a phone booth, but there are two mines in the area, and the phone was originally installed for use by the miners and their families."},{"p":"P130","n":4,"quote":"He posted the phone's number on the Internet, and people began calling it."},{"p":"P130","n":7,"quote":"In May of 2000, the National Park Service and Pacific-Bell, the owner of the phone booth, made the decision to remove the booth."}]},{"id":"R6-P132-F2-01","skill":"F2","pages":["P132"],"src":6,"stem":["How is Aunt Suki related to the children’s mother?","苏琪姨妈和孩子们的妈妈是什么关系？"],"o":[["She is their mother’s daughter.","她是孩子们妈妈的女儿。"],["She has never met their mother.","她从没见过孩子们的妈妈。"],["She is their mother’s sister.","她是孩子们妈妈的姐妹。"],["She is their mother’s teacher.","她是孩子们妈妈的老师。"]],"key":2,"why":["In paragraph 8, Aunt Suki says she and the children’s mother pretended to be twins, and in paragraph 10 she says they grew up together in Japan. Those clues and the use of Aunt show that they are sisters.","第8段说两人小时候假装是双胞胎，第10段说一起在日本长大，结合 Aunt 与 your mother 的表达可确认是姐妹。"],"ev":[{"p":"P132","n":8,"quote":"“Your mother’s dimple is in her left cheek, and mine is in my right cheek."},{"p":"P132","n":8,"quote":"When we were little, we used to pretend it meant that we were twins.”"},{"p":"P132","n":10,"quote":"“Even though we grew up in Japan, I didn’t learn origami until I moved to the United States."}]},{"id":"R6-P132-F6-01","skill":"F6","pages":["P132"],"src":13,"stem":["Why does Aunt Suki compare origami with counting?","苏琪姨妈为什么把折纸和数数作比较？"],"o":[["Both are impossible without a computer.","两件事没有电脑都做不了。"],["Both can be simple once learned but still require concentration.","两件事学会以后都可以很简单，但还是得集中注意力。"],["Both always require scissors and glue.","两件事总是要用剪刀和胶水。"],["Both produce the same kind of paper animal.","两件事都能做出同一种纸动物。"]],"key":1,"why":["Aunt Suki uses the familiar activity of counting to explain origami. Once you learn either activity, it can be simple to do, but it still takes concentration.","她不是说两个活动结果相同，而是拿熟悉的数数说明折纸中“掌握后不复杂、仍需集中注意”的特点。"],"ev":[{"p":"P132","n":5,"quote":"You must concentrate when you do origami, but it doesn’t require a great deal of thought."},{"p":"P132","n":6,"quote":"But when you are counting a large number of things, you must concentrate or you will lose your place."}]},{"id":"R6-P132-B3-01","skill":"B3","pages":["P132"],"src":8,"stem":["What does Emi mean by passing the tradition “up instead of down”?","惠美说要把传统“传给长辈，而不是传给小辈”，是什么意思？"],"o":[["The children will help teach the older generation.","孩子们会帮忙教家里的长辈。"],["Aunt Suki will stop doing origami forever.","苏琪姨妈再也不折纸了。"],["The tradition will be kept secret from their mother.","一家人会对妈妈保守折纸的秘密。"],["The family will fold paper only upstairs.","全家只会在楼上折纸。"]],"key":0,"why":["Traditions are usually passed down from older people to younger people. Emi proposes that the children learn first and then help teach their mother, passing the tradition up to the older generation.","通常传统从长辈传给晚辈；Emi 提议自己先学，再帮教妈妈，所以“向上”指晚辈也能反过来传授。"],"ev":[{"p":"P132","n":15,"quote":"“You can teach us first,” suggested Emi, “and we’ll help you teach Mom."},{"p":"P132","n":15,"quote":"We’ll be passing the tradition up instead of down.”"}]},{"id":"R6-P134-A1-01","skill":"A1","pages":["P134"],"src":null,"stem":["Which statement best expresses the passage’s main idea?","哪句话最能表达本文的中心思想？"],"o":[["The passage is mainly a biography of a television actor.","本文主要是一位电视演员的传记。"],["Origami is simply cutting paper into identical strips.","折纸就是把纸剪成一模一样的长条。"],["Origami is a paper-folding art with a cultural history, basic techniques, and creative possibilities.","折纸是一门艺术，有自身的文化历史、基本技法和创作空间。"],["Every origami object can be made without learning any folds.","不学任何折法，就能折出所有造型。"]],"key":2,"why":["The passage covers what origami is, its possible origins, materials, basic folds, diagrams, and original work. The main idea needs to capture the art in its full scope.","全文涵盖定义、起源讨论、材料、基础折法、图示与创作，中心思想应覆盖这门艺术而非单一作品。"],"ev":[{"p":"P134","n":2,"quote":"Origami is the art of folding paper into three-dimensional figures of people, animals, and objects."},{"p":"P134","n":5,"quote":"Beginners are often taught several folds and bases which are the starting shapes for other, more complicated figures."},{"p":"P134","n":7,"quote":"Others view it as an art form and a means of creative expression."}]},{"id":"R6-P134-E2-01","skill":"E2","pages":["P134"],"src":null,"stem":["What distinction does the author make about origami’s history?","作者介绍折纸的历史时，区分了哪两件事？"],"o":[["All historians agree it was invented by Yoshizawa in the 1950s.","所有历史学家都认为吉泽章在20世纪50年代发明了折纸。"],["The author claims that no one has ever studied its origin.","作者宣称从来没有人研究过折纸的起源。"],["Its exact origin is disputed, but its development in Japan is clear.","折纸究竟起源于哪里尚有争议，但它在日本得到发展是明确的。"],["There is no evidence that anyone in Japan practiced origami.","没有证据表明日本曾有人做折纸。"]],"key":2,"why":["In paragraph 2, Some historians and Others introduce competing ideas about origami’s origin. What we do know introduces the more certain point that it developed in Japan.","第2段分别用 Some historians、Others、What we do know 区分有争议的起源与较确定的发展事实。"],"ev":[{"p":"P134","n":2,"quote":"The origin of origami itself, however, is unclear."},{"p":"P134","n":2,"quote":"What we do know is that origami was clearly developed in Japan, where it is considered a part of the culture and lifestyle of the people."}]},{"id":"R6-P134-A3-01","skill":"A3","pages":["P134"],"src":10,"stem":["Which sentence best summarizes paragraph 6?","哪句话最能概括第6段？"],"o":[["Every origami design was created by Yoshizawa.","每一种折纸造型都是吉泽章设计的。"],["Diagrams are used only to measure the weight of paper.","人们只用图解来称纸的重量。"],["Origami diagrams and symbols help people share and recreate designs.","折纸图解和符号有助于人们分享设计并照样折出造型。"],["Paper folding became impossible after the 1950s.","过了20世纪50年代，人们就没办法折纸了。"]],"key":2,"why":["The paragraph explains how diagrams record folds and help people recreate a design. Yoshizawa’s books and diagram symbols illustrate how people share designs.","该段主旨是图示如何记录折法、帮助别人再现作品；Yoshizawa 的出版与符号是支持这一点的实例。"],"ev":[{"p":"P134","n":6,"quote":"Diagrams are important to people who take origami seriously because they show the folds needed to make a particular figure."},{"p":"P134","n":6,"quote":"He also created a set of diagram symbols that could be used when someone wanted to share with others a figure he or she had created."}]},{"id":"R6-P136-B2-01","skill":"B2","pages":["P136"],"src":4,"stem":["Why does Grandpa prefer audio books?","爷爷为什么更喜欢有声书？"],"o":[["He wants to avoid all stories and news.","他想避开所有的故事和新闻。"],["He has never heard of Braille.","他从来没听说过盲文。"],["Audio books require him to see every printed word.","听有声书要求他看清印出来的每一个词。"],["Braille books can be bulky, and he enjoys the readers’ varied voices.","盲文书可能很笨重，而且他喜欢听朗读者变换各种声音。"]],"key":3,"why":["Paragraph 12 explains that Braille books can be large and awkward to handle. In paragraph 13, Grandpa says he enjoys the variety of voices audiobook readers can perform.","第12段交代盲文书体积大、使用不便，第13段补充有声书朗读者的多样声音；需合并两个原因。"],"ev":[{"p":"P136","n":12,"quote":"Books in Braille can be very large and awkward to use because spelling out words in Braille takes up more space than using the Roman alphabet."},{"p":"P136","n":13,"quote":"The range of voices a single reader can do is quite impressive.\""}]},{"id":"R6-P136-F3-01","skill":"F3","pages":["P136"],"src":null,"stem":["What motivates Carson to hug Grandpa near the end?","临近结尾，是什么让卡森抱住爷爷？"],"o":[["He is angry that Grandpa used the computer.","他生爷爷的气，因为爷爷用了电脑。"],["He is frightened by the breakfast food.","他被早餐的食物吓到了。"],["He wants Grandpa to stop reading entirely.","他想让爷爷彻底停止阅读。"],["He feels affection and admiration for how Grandpa has adapted.","他爱爷爷，也佩服爷爷适应变化的方式。"]],"key":3,"why":["Right after the hug, Carson says he is glad Grandpa is there and that he has adapted so well. This shows both affection and admiration.","紧接拥抱后的话“高兴你在这里”“适应得很好”直接解释了亲近和钦佩的情绪。"],"ev":[{"p":"P136","n":13,"quote":"He looked surprised when Carson grabbed him in a bear hug."},{"p":"P136","n":14,"quote":"\"And I'm glad that you've adjusted to the changes in your eyesight so well.\""}]},{"id":"R6-P136-C5-01","skill":"C5","pages":["P136"],"src":null,"stem":["What does having the keys “committed to memory” mean?","把按键位置 committed to memory 是什么意思？"],"o":[["Having replaced every key with a speaker","把每个按键都换成扬声器。"],["Having memorized their positions","记住每个按键的位置。"],["Having forgotten how the keyboard works.","忘了键盘是怎么用的。"],["Having written their names on a paper receipt","把按键的名字写在一张纸质收据上。"]],"key":1,"why":["Grandpa says he has typed for 60 years, so he knows where the keys are without seeing them. Committed to memory means memorized.","上文问看不见怎样打字，他回答有60年经验，说明键位已记熟。commit to memory 是“记住、熟记”。"],"ev":[{"p":"P136","n":10,"quote":"\"After 60 years of typing, I think I have the location of the keys committed to memory."},{"p":"P136","n":10,"quote":"\"After 60 years of typing, I think I have the location of the keys committed to memory."}]},{"id":"R6-P138-C2-01","skill":"C2","pages":["P138"],"src":9,"stem":["Which sentence uses “pupil” with the meaning found in paragraph 3?","哪句话中的 pupil 与第3段的含义相同？"],"o":[["The new pupil joined the class on Monday.","The new pupil joined the class on Monday.（新学生星期一加入了班级。）"],["The doctor checked how the pupil changed size in the light.","The doctor checked how the pupil changed size in the light.（医生检查瞳孔在光线下怎样改变大小。）"],["The pupil handed her homework to the teacher.","The pupil handed her homework to the teacher.（学生把作业交给老师。）"],["Each pupil chose a library book.","Each pupil chose a library book.（每位学生都选了一本图书馆的书。）"]],"key":1,"why":["In paragraph 3, pupil means the opening in the eye that controls how much light enters. The other three examples use pupil to mean a student.","本文 pupil 指眼睛中控制进光量的瞳孔；另外三个选项都指学生。"],"ev":[{"p":"P138","n":3,"quote":"The black dot in the middle of your iris is an opening called the pupil, and it controls the amount of light entering the eye."}]},{"id":"R6-P138-B2-01","skill":"B2","pages":["P138"],"src":6,"stem":["Which comparison of rods and cones matches the passage?","哪一项对视杆细胞和视锥细胞的比较符合文意？"],"o":[["Rods and cones are both described as parts of the iris.","两种细胞都属于虹膜。"],["Cones only produce black-and-white images; rods detect all colors.","视锥细胞只能产生黑白图像，视杆细胞能感知所有颜色。"],["Neither kind of cell responds to light.","两种细胞都对光没有反应。"],["Rods are more light-sensitive; cones support color vision.","视杆细胞对光更敏感，视锥细胞支持色觉。"]],"key":3,"why":["Paragraphs 6 and 7 describe cones as helping us see color and rods as more sensitive to light, producing black-and-white images.","第6—7段对照两类细胞：cones 参与辨色，rods 对光更敏感、产生黑白图像。"],"ev":[{"p":"P138","n":6,"quote":"Six million of them are cones, the cells that read color."},{"p":"P138","n":7,"quote":"These rod-shaped cells are much more sensitive to light than the cones, but they only produce black and white imagery."}]},{"id":"R6-P138-B5-01","skill":"B5","pages":["P138"],"src":3,"stem":["Based on the passage, what would pupils do when someone moves from darkness into bright light?","根据文章，一个人从黑暗处走进强光下时，瞳孔会怎么变？"],"o":[["Become smaller to reduce the amount of light entering","缩小，以减少进入眼睛的光量。"],["Change into rod cells.","变成视杆细胞。"],["Disappear because the iris has no muscles","消失，因为虹膜没有肌肉。"],["Become larger to admit even more light","扩大，让更多光线进入眼睛。"]],"key":0,"why":["The passage explains that pupils open wider in darkness to let in more light. The reverse happens in bright light: they get smaller to let in less.","原文说明瞳孔调节进光量，并举暗处需要张大的例子；反向应用到亮处，就应缩小以减少进光。"],"ev":[{"p":"P138","n":3,"quote":"The black dot in the middle of your iris is an opening called the pupil, and it controls the amount of light entering the eye."},{"p":"P138","n":3,"quote":"When you walk indoors on a sunny day and notice that it takes time for your eyes to adjust, it is because you are waiting for your pupils to open wide enough to make up for the reduced light."}]},{"id":"R6-P140-D4-01","skill":"D4","pages":["P140"],"src":null,"stem":["What is the function of the everyday reading examples in paragraph 1?","第1段列举日常阅读的例子有什么作用？"],"o":[["They give a complete list of books written by Louis Braille.","列全路易·布拉耶写过的书。"],["They help readers recognize how important access to written information is.","帮助读者意识到，能获取书面信息有多重要。"],["They explain how to construct an elevator.","说明怎样建造电梯。"],["They show that reading happens only in school.","表明阅读只在学校里发生。"]],"key":1,"why":["Cereal boxes, street signs, and menus show how often people rely on written information. That prepares readers to understand the value of Braille in paragraph 2.","食品标签、路牌、菜单等例子让读者意识到文字遍布日常生活，为第2段说明盲文的价值做铺垫。"],"ev":[{"p":"P140","n":1,"quote":"Even when you are not in school, doing homework, or reading a book for fun, you read almost constantly."},{"p":"P140","n":2,"quote":"Even though Braille translations are not provided everywhere, the availability of the Braille system in many public places opens up a new world for people who cannot see."}]},{"id":"R6-P140-B2-01","skill":"B2","pages":["P140"],"src":2,"stem":["How did Braille change Barbier’s system?","布拉耶怎样改进了巴比耶的系统？"],"o":[["He changed six dots into a system of one hundred dots.","他把6个点改成了100个点。"],["He replaced all raised dots with ordinary pictures.","他把所有凸点都换成了普通图片。"],["He reduced the pattern from twelve dots to six dots.","他把一组的点数从12个减少到6个。"],["He removed the possibility of reading by touch.","他使人无法再用触摸来阅读。"]],"key":2,"why":["Paragraph 4 says Barbier used twelve dots. Paragraph 5 explains that Braille reduced the number to six.","第4段说 Barbier 用12点，第5段用 Instead of 对比 Braille 的6点安排。"],"ev":[{"p":"P140","n":4,"quote":"Barbier had devised a system based on the arrangement of dots in groups of 12."},{"p":"P140","n":5,"quote":"Instead of 12 dots, Braille’s system used only six dots, arranged in three rows of two dots each."}]},{"id":"R6-P140-C1-01","skill":"C1","pages":["P140"],"src":9,"stem":["What does “tedious” most likely mean in paragraph 7?","第7段的 tedious 最可能是什么意思？"],"o":[["Slow, tiresome, and requiring repetitive effort","缓慢、乏味，需要重复劳作。"],["Impossible to read because it is fictional.","由于是虚构的，所以读不懂。"],["Brightly colored and decorative","色彩鲜艳且有装饰性。"],["Instant and effortless","一下子就能完成，毫不费力。"]],"key":0,"why":["Early printing was slow and required punching individual dots into thick paper. The contrast with later, faster methods shows that tedious means time-consuming and tiresome.","前文说发展 slow，接着描写用尖工具逐点打孔，再与后来的 quicker、more efficient 对比，可推知费时乏味。"],"ev":[{"p":"P140","n":7,"quote":"Even as the Braille system gained acceptance around the world, the development of a good printing process was slow and often tedious."},{"p":"P140","n":7,"quote":"The process became quicker and more efficient."}]},{"id":"R6-P142-A4-01","skill":"A4","pages":["P142"],"src":null,"stem":["Which lesson does the story develop?","这个故事表达了什么道理？"],"o":[["Cooperation requires everyone to become identical.","合作要求每个人都变得一模一样。"],["Different individuals each have value and can contribute to a peaceful whole.","不同的人都有自己的价值，能一起为和睦的集体作出贡献。"],["Only the loudest individual deserves recognition.","只有声音最大的人值得被承认。"],["Being important means defeating every other person.","要成为重要的人，就得打败其他所有人。"]],"key":1,"why":["The colors go from arguing about superiority to creating a rainbow together. Rain says that each is unique and essential, showing that everyone can contribute while keeping their differences.","颜色从争高下到共同组成彩虹，Rain 明确说每一种都独特且必要，主题指向尊重差异、共同贡献。"],"ev":[{"p":"P142","n":10,"quote":"“Each one of you is unique and essential."},{"p":"P142","n":11,"quote":"You will be a reminder to us all of how to live with one another in peace—a reminder of how each individual contributes something to the whole.”"}]},{"id":"R6-P142-F7-01","skill":"F7","pages":["P142"],"src":5,"stem":["What does the rainbow most strongly symbolize in the story?","故事中的彩虹最能象征什么？"],"o":[["One color proving that all others are useless","一种颜色证明其他颜色都没用。"],["A warning that the colors will never meet again.","一条警告，表示这些颜色再也不会相见。"],["Different individuals joining together in harmony","不同的个体和谐地聚在一起。"],["The disappearance of every individual difference","所有个体差异都消失了。"]],"key":2,"why":["In paragraph 11, Rain says the rainbow should remind people to live peacefully together and remember what each individual adds to the whole.","第11段直接把共同的彩虹解释为和平相处、个体贡献整体的提醒，因此象征多样个体的和谐共存。"],"ev":[{"p":"P142","n":11,"quote":"You will be a reminder to us all of how to live with one another in peace—a reminder of how each individual contributes something to the whole.”"},{"p":"P142","n":11,"quote":"You will be a reminder to us all of how to live with one another in peace—a reminder of how each individual contributes something to the whole.”"}]},{"id":"R6-P142-F6-01","skill":"F6","pages":["P142"],"src":7,"stem":["How does the author personify the colors?","作者怎样把颜色拟人化？"],"o":[["They speak, argue, and show distinct personalities.","它们说话、争吵，还表现出不同的性格。"],["They become ordinary paint in a laboratory test.","它们变成了实验室测试中的普通颜料。"],["They are listed only as wavelengths in a chart.","它们只作为不同波长列在图表里。"],["They are described without actions or feelings.","描写中，它们没有动作或感受。"]],"key":0,"why":["The colors speak and argue like people and show individual traits, such as Violet’s pride and Indigo’s quietness. Giving them these human qualities is personification.","赋予颜色语言、争论、骄傲和安静等人的行为与性格，即拟人化。"],"ev":[{"p":"P142","n":1,"quote":"Each believed he or she was superior to all other colors, and no color was willing to admit defeat."},{"p":"P142","n":7,"quote":"Violet stood up, proud and tall."},{"p":"P142","n":8,"quote":"she asked quietly."}]},{"id":"R6-P142-H1-01","skill":"H1","pages":["P142","P144"],"src":null,"stem":["Read both “The Quarreling Colors” (P142) and “An Arc of Light” (P144). How do they explain a rainbow differently?","读一读《争吵的颜色》（P142）和《一道光弧》（P144）。它们解释彩虹的方式有何不同？"],"o":[["Both give only instructions for drawing seven straight lines.","两篇文章都只提供了画七根直线的步骤。"],["One presents a lesson about cooperation; the other explains light and raindrops.","一篇用故事讲合作的道理，另一篇说明光和雨滴的作用。"],["One describes sea fishing, while the other describes baseball.","一篇写海上捕鱼，另一篇写棒球。"],["Both claim rainbows are made from colored paint.","两篇都说彩虹是用彩色颜料做出来的。"]],"key":1,"why":["P142 uses the colors joining together in a rainbow to teach a lesson about living in harmony. P144 explains how sunlight bends when it enters raindrops.","P142 用颜色共同组成彩虹传达共处的寓意；P144 第3段解释阳光进入雨滴后的折射。两文对象相同，但主要内容与解释层次不同。"],"ev":[{"p":"P142","n":11,"quote":"You will be a reminder to us all of how to live with one another in peace—a reminder of how each individual contributes something to the whole.”"},{"p":"P144","n":3,"quote":"When sunlight enters a raindrop, it is bent, or refracted, and the light’s individual strands of color become visible."}]},{"id":"R6-P142-H2-01","skill":"H2","pages":["P142","P144"],"src":null,"stem":["Which comparison best describes the two authors’ methods?","哪一项最准确地比较了两位作者的写法？"],"o":[["P142 presents a laboratory report; P144 uses only arguments between colors.","P142 是实验报告，P144 只写几种颜色在争论。"],["Both authors use only a personal diary.","两位作者都只用了私人日记的形式。"],["P142 uses speaking characters and a legend; P144 uses explanations of physical processes.","P142 以会说话的角色讲一个传说，P144 则解释物理过程。"],["Neither text provides any explanation of a rainbow.","两篇都没有解释彩虹。"]],"key":2,"why":["P142 personifies colors and builds a conflict between them in a legend. P144 explains physical processes involving wavelengths, refraction, and bands of color.","比较写法而非只找共同话题：P142 将颜色拟人并发展冲突，P144 解释波长、折射和色带等物理过程。"],"ev":[{"p":"P142","n":1,"quote":"Long, long ago, when Earth was young, there was a terrible quarrel among the colors."},{"p":"P144","n":3,"quote":"The wavelengths of different colors vary, which is why each color bends slightly differently to produce the bands of color known as a rainbow."}]},{"id":"R6-P144-B2-01","skill":"B2","pages":["P144"],"src":4,"stem":["Why do the colors of a rainbow bend by different amounts?","为什么彩虹中各种颜色偏折的程度不同？"],"o":[["Raindrops contain seven kinds of colored paint.","雨滴里有七种颜色的颜料。"],["Each color is produced by a separate moon.","每种颜色都由一个不同的月亮产生。"],["Their wavelengths differ.","各种颜色的波长不同。"],["The colors follow different rules chosen by people.","各种颜色遵循人选定的不同规则。"]],"key":2,"why":["Paragraph 3 directly links differences in wavelength to differences in how much each color bends, creating visible bands.","第3段用 which is why 明确说明不同波长导致折射程度不同，由此形成色带。"],"ev":[{"p":"P144","n":3,"quote":"The wavelengths of different colors vary, which is why each color bends slightly differently to produce the bands of color known as a rainbow."}]},{"id":"R6-P144-C1-01","skill":"C1","pages":["P144"],"src":null,"stem":["What does “fleeting” mean in paragraph 2?","第2段中的 fleeting 是什么意思？"],"o":[["Always visible in the same place","总能在同一个地方看见。"],["Too ordinary to attract attention.","太普通，引不起注意。"],["Lasting only a short time","只持续很短时间。"],["Solid enough to hold in your hands","结实得可以拿在手里。"]],"key":2,"why":["Rainbows require the right weather and often appear as a rain shower ends. Beautiful but fleeting means that they look beautiful and last only a short time.","彩虹要在恰当的天气条件下出现，常在阵雨结束时看到；beautiful but fleeting 强调美丽却短暂。"],"ev":[{"p":"P144","n":2,"quote":"Rainbows enchant and mystify people because they are beautiful but fleeting."},{"p":"P144","n":2,"quote":"Conditions must be exactly right in order for rainbows to form."}]},{"id":"R6-P144-B1-01","skill":"B1","pages":["P144"],"src":7,"stem":["Which materials does the passage list for making a rainbow indoors?","文中说在室内制作彩虹需要什么材料？"],"o":[["A camera, a telescope, and dry paper","照相机、望远镜和干纸。"],["Paint, glue, and a dark cloth.","颜料、胶水和深色布。"],["A metal pot, sand, and a radio","金属锅、沙子和收音机。"],["A clear glass or jar of water, a small mirror, and a flashlight","一个盛水的透明玻璃杯或玻璃罐、一面小镜子和一支手电筒。"]],"key":3,"why":["Paragraph 7 lists the materials after the phrase “You’ll just need”: a clear glass or jar of water, a small mirror, and a flashlight.","第7段的 You’ll just need 后集中列出材料，作答时应准确对应，不能凭日常印象增减。"],"ev":[{"p":"P144","n":7,"quote":"You’ll just need a large, clear, circular glass or jar of water, a small mirror, and a flashlight."}]},{"id":"R6-P146-F3-01","skill":"F3","pages":["P146"],"src":2,"stem":["Why does Will think his genealogy project matters?","威尔为什么认为家谱研究作业很重要？"],"o":[["He plans to sell all the letters before reading them.","他打算在读信之前把信全部卖掉。"],["He wants to avoid learning anything about his relatives.","他想避免了解亲戚的任何事情。"],["He wants to prove that family memories have no value.","他想证明家族记忆没有价值。"],["He wants to preserve family history for future generations.","他想为后代保存家族历史。"]],"key":3,"why":["Will says he wants to keep his family history from being lost so that future generations can see what he records. This explains why he researches records and interviews relatives.","Will 直接说不希望家族历史丢失，希望后代也能看到记录，这是他研究和访谈的核心动机。"],"ev":[{"p":"P146","n":6,"quote":"\"I don't want our family's history to get lost."},{"p":"P146","n":6,"quote":"If I record it, it will exist for our great-great-grandkids.\""}]},{"id":"R6-P146-C1-01","skill":"C1","pages":["P146"],"src":null,"stem":["What does “genealogy” mean in this story?","genealogy 在这个故事里是什么意思？"],"o":[["The design of modern computer games","现代电脑游戏设计。"],["The practice of repairing bicycles.","修自行车的做法。"],["The study of family history and ancestry","对家族历史和祖先的研究。"],["The study of weather patterns","对天气变化规律的研究。"]],"key":2,"why":["When Calvin asks, Will directly defines genealogy as the study of family history and roots.","Calvin 提问后，Will 用 It’s the study of... 直接定义为研究家族历史和根源。"],"ev":[{"p":"P146","n":6,"quote":"\"It's the study of your family's history and roots,\" explained Will."}]},{
