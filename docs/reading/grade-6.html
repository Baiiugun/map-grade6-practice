"],"enabled":true},{"id":"F2","module":"F","title":"分析人物身份、性格与关系","en":"Characterization / Traits / Relationships","goal":"从言行和叙述中建立人物形象，理解人物之间及其在故事中的关系。","questionCount":13,"pages":["P006","P010","P028","P030","P034","P040","P060","P078","P082","P096","P102","P116","P132"],"enabled":true},{"id":"F3","module":"F","title":"理解人物动机与情感","en":"Character Motivation / Feelings","goal":"结合人物处境解释为什么行动，以及当时的真实感受。","questionCount":16,"pages":["P006","P016","P028","P030","P050","P054","P062","P070","P078","P084","P108","P114","P124","P126","P136","P146"],"enabled":true},{"id":"F4","module":"F","title":"辨认叙述者与叙述视角","en":"Narrator / Point of View","goal":"判断是谁在讲述、从哪里观察，以及叙述者能够知道多少。","questionCount":4,"pages":["P012","P024","P050","P122"],"enabled":true},{"id":"F5","module":"F","title":"识别文类并说明依据","en":"Genre / Literary Form","goal":"根据作品特征判断文本类型及具体文学类别。","questionCount":5,"pages":["P006","P046","P056","P116","P150"],"enabled":true},{"id":"F6","module":"F","title":"理解比喻、拟人与意象","en":"Figurative Language / Imagery","goal":"把文学性表达还原成具体画面或深层含义，并解释表达效果。","questionCount":16,"pages":["P024","P038","P042","P048","P074","P082","P088","P092","P096","P100","P118","P122","P126","P128","P132","P142"],"enabled":true},{"id":"F7","module":"F","title":"理解象征、反讽与悖论","en":"Symbolism / Irony / Paradox","goal":"识别表层事件与深层意义之间的特殊关系。","questionCount":1,"pages":["P142"],"enabled":true},{"id":"F8","module":"F","title":"分析诗歌声音与戏剧表现","en":"Poetic Devices / Staging / Style","goal":"理解声音、句式和表演安排怎样产生文学效果。","questionCount":0,"pages":[],"enabled":false,"unavailableReason":"本册以故事和说明文为主，本版没有诗歌声音或舞台表现专项。"},{"id":"G1","module":"G","title":"读取图表与图示信息","en":"Read Tables / Graphs / Maps / Diagrams","goal":"先准确读懂视觉材料展示的对象、数值和关系。","questionCount":2,"pages":["P074"],"enabled":true},{"id":"G2","module":"G","title":"整合文字、图表与插图","en":"Integrate Text & Visuals","goal":"判断文字中的说法与视觉证据是否真正对应。","questionCount":1,"pages":["P074"],"enabled":true},{"id":"G3","module":"G","title":"依据条件处理数据","en":"Order / Count / Percentages / Ratios","goal":"在读懂表格或图形后，用必要的基础运算回答阅读问题。","questionCount":1,"pages":["P074"],"enabled":true},{"id":"G4","module":"G","title":"根据数据推断趋势与估算","en":"Inference from Data / Trends / Extrapolation","goal":"从图表关系中作有根据的解释，并分清观察值与估计值。","questionCount":0,"pages":[],"enabled":false,"unavailableReason":"现有表格可做读取与运算；本版没有足以支撑趋势估算的连续数据任务。"},{"id":"H1","module":"H","title":"整合跨文本内容与主题","en":"Synthesize Texts / Compare Themes","goal":"分别读懂文本，再找共同内容、差异或需要合并的信息。","questionCount":2,"pages":["P118","P142"],"enabled":true},{"id":"H2","module":"H","title":"比较写法、语气与证据类型","en":"Compare Craft / Tone / Evidence","goal":"用一致的维度比较多篇作品的表达方式。","questionCount":2,"pages":["P088","P142"],"enabled":true},{"id":"H3","module":"H","title":"比较论证关系并跨文取证","en":"Relationship Between Arguments / Cross-Text Support","goal":"读出两篇议论或说明材料在论点和理由上的关系。","questionCount":2,"pages":["P042","P110"],"enabled":true}],"passages":[{"id":"P002","page":"P002","title":"JBall","exercisePage":"P003","pdfPage":6,"pdfExercisePage":7,"lead":"Have you ever been to a baseball game in another country or watched one on television?","paragraphs":[{"n":1,"text":"Alex and Emily Godfrey had been in Japan with their parents for nearly a week. They were there to visit their mother’s old college roommate, who had moved to Japan after college to teach English. She had planned to come home after a few years, but she had fallen in love with the country and with the man who would eventually be her husband."},{"n":2,"text":"“What’s our plan for the afternoon?” asked Alex after lunch one day."},{"n":3,"text":"“Well,” said Mr. Ito, “we have tickets for a 4:00 baseball game. How does that sound?”"},{"n":4,"text":"“I had no idea baseball was popular in Japan,” replied Alex."},{"n":5,"text":"“Dad takes us to professional games a few times a year at home,” said Emily. “Alex and I keep a list of cities we’ve visited where we have had a chance to go to a game. I had no idea that Tokyo would ever be on our list!”"},{"n":6,"text":"The Itos and the Godfreys prepared for the afternoon’s events. Just a few hours later, they found themselves standing inside the stadium among a crowd of excited fans."},{"n":7,"text":"“What are the names of the teams that are playing today?” asked Alex, looking around curiously."},{"n":8,"text":"“The home team is the Yakult Swallows. They will be playing the Hiroshima Toyo Carp,” said Mrs. Ito. “Baseball isn’t my cup of tea, but this promises to be a good game.”"},{"n":9,"text":"The two families found their seats in the bleachers. Alex and Emily grinned as they listened to all the noisemakers around them. Some people were hitting together plastic bats, and others were yelling through megaphones that looked as though they had been hinged together."},{"n":10,"text":"“Are those cheerleaders?” asked Emily. She was referring to a group of men on the ball field who led the crowd in chants and cheers."},{"n":11,"text":"Mrs. Ito nodded. “I forget that Americans don’t have cheerleaders for baseball games. It also probably seems unusual that they’re all men. That’s just one of the differences between American and Japanese baseball culture.”"},{"n":12,"text":"Once the game began, Emily and Alex became quickly engrossed. The game itself didn’t seem much different at all from the American baseball games they had attended. They were surprised, though, to see people waving American flags from time to time."},{"n":13,"text":"Mr. Ito explained, “Japanese teams are each allowed to have three foreign players. When American players come up to bat, their fans show support by waving your country’s flag.”"},{"n":14,"text":"In between innings, Mrs. Ito bought Alex and Emily a snack. Some vendors sold pretzels, popcorn, and hot dogs, but Alex and Emily decided to try one of the Japanese alternatives. With Mrs. Ito’s help, they selected yakisoba, noodles flavored with ginger and soy sauce."},{"n":15,"text":"At the end of the game, the Godfreys and the Itos piled back into the car to head home. Alex and Emily were tired, but their minds were racing with all they had seen that day."},{"n":16,"text":"“Did you have a good day, kids?” asked Mrs. Godfrey, turning to Alex and Emily."},{"n":17,"text":"They nodded. “I wish we could go to JBall games at home, too,” said Emily. “After today, I have a feeling that American baseball may never be quite as interesting again.”"}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15},{"type":"paragraph","n":16},{"type":"paragraph","n":17}],"kind":"故事 · Fiction"},{"id":"P004","page":"P004","title":"Yakyuu","exercisePage":"P005","pdfPage":8,"pdfExercisePage":9,"lead":"Who is Sadahara Oh, and why is he so famous in the world of baseball?","paragraphs":[{"n":1,"text":"What could be more American than baseball? It was one of the earliest sports played in America, created during the mid-1800s. But the Japanese have been playing for nearly as long. In fact, baseball’s popularity in Japan rivals its popularity here in the United States."},{"n":2,"text":"In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students. They loved it, calling the game Yakyuu, which means field ball. It quickly caught on with students all over the country. Japanese leaders also embraced baseball because they thought that it contained elements that were already part of Japanese culture. For instance, baseball’s focus on the mental competition between pitcher and hitter was similar to the one-on-one competitions of martial arts."},{"n":3,"text":"By the early 1900s, amateur baseball leagues had been established in secondary schools and colleges throughout Japan. To this day, the enthusiasm for college baseball in Japan is equivalent to the excitement people have for college football or college basketball’s March Madness in the United States."},{"n":4,"text":"To make baseball even more popular, American teams regularly toured Japan in the early 1900s and played exhibition games against the local amateurs. Top American baseball stars like Babe Ruth and Lou Gehrig came to Japan in the 1930s and played against the top Japanese college teams. The Americans won all 17 games they played, but baseball fever swept the whole country. A professional Japanese baseball league was formed in 1936. The Great Tokyo baseball club—known today as the Yomiuri Giants—was the first team, but it was soon joined by six others."},{"n":5,"text":"Like so many other things around the world, World War II interrupted Japanese baseball when almost all of the players became soldiers. Because baseball had become an important part of Japanese culture, professional teams reformed after the war. By 1955, with the help of television, professional baseball in Japan became bigger than ever."},{"n":6,"text":"The Yomiuri Giants are not just the oldest pro team in Japan; they may also be the greatest. From 1965 through 1973, the Giants won nine consecutive national championships, partly because of the legendary player Sadahara Oh. The surname Oh means king, and he certainly was the king of baseball in Japan. Among his many incredible statistics, Oh holds the world record for career home runs—868! That is more than Hank Aaron, Babe Ruth, Mark McGuire, Barry Bonds, and Sammy Sosa."},{"n":7,"text":"Japanese professional players have also come to the United States and played in Major League Baseball, setting records here as well. Current players include the New York Yankees’ Ichiro Suzuki. In 2004, Suzuki broke a baseball record for hitting that had stood for more than 80 years! Kazuhiro Sasaki, who played for the Seattle Mariners, was named the American League Rookie of the Year in 2000, and Hideo Nomo of the Los Angeles Dodgers was MLB’s 1995 Rookie of the Year."}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":"说明文 · Informational Text"},{"id":"P006","page":"P006","title":"Experimental Appetites","exercisePage":"P007","pdfPage":10,"pdfExercisePage":11,"lead":"What kinds of foods from other cultures have you tried?","paragraphs":[{"n":1,"text":"Alex and Emily sat at a table with their parents and Mr. and Mrs. Ito. Alex loved to try new foods. Alex had eaten at Asian restaurants at home several times, but he was sure that the meals he’d eat in Japan would be much more authentic."},{"n":2,"text":"Emily wasn’t as confident as Alex was about trying new foods. Alex would eat practically anything and not think twice about it. Emily liked to be able to identify everything on her plate. She was willing to try new things, but she lacked Alex’s enthusiasm for experimenting with new foods."},{"n":3,"text":"“Have you looked at the menu yet?” asked Alex and Emily’s dad."},{"n":4,"text":"“Dad, it’s in Japanese,” said Alex."},{"n":5,"text":"Mr. Godfrey grinned. “That shouldn’t stop you from looking at it,” he said. “Maybe Mrs. Ito can give us some suggestions.”"},{"n":6,"text":"“Of course I can,” she said, scanning the menu. “I thought we could start off with some sushi. Do you like fish?” she asked Alex and Emily."},{"n":7,"text":"“I do,” replied Alex promptly."},{"n":8,"text":"Emily looked uncertainly at her parents. “I like some kinds of fish,” she said."},{"n":9,"text":"“She likes fish that doesn’t have a strong fishy taste to it,” added her mom helpfully."},{"n":10,"text":"“We’ll order several different kinds,” decided Mrs. Ito. “Then, you’ll have a chance to sample them and decide what you like.” Mrs. Ito gave their order to the waiter. Then, she turned back to Alex and Emily."},{"n":11,"text":"“Do you know how sushi is made?” Mrs. Ito asked Alex and Emily. They shook their heads. “Well, the sushi chef begins with a very thin sheet of seaweed.”"},{"n":12,"text":"“We’re going to eat seaweed?” asked Alex excitedly."},{"n":13,"text":"Mr. Ito smiled. “You wouldn’t even know it was seaweed if we didn’t tell you,” he said."},{"n":14,"text":"Mrs. Ito continued, “The chef spreads a layer of sticky rice over the seaweed. Then, they add different vegetables and fish. They roll everything up inside the seaweed and slices it into little disks.”"},{"n":15,"text":"A few minutes later, the waiter returned with a wooden board that held several different types of sushi."},{"n":16,"text":"“You might want to try this kind first,” Mr. Ito told Emily. “It has cucumber and avocado in it but no fish.” The Itos showed the Godfreys how to pick up the sushi using chopsticks."},{"n":17,"text":"“What’s this?” asked Alex, pointing to a small mound of something green."},{"n":18,"text":"“Sushi is often served with pickled ginger and a very spicy condiment called wasabi. The green stuff you were asking about is the wasabi. If you decide to try some, you’ll probably want to use a very small amount at first.”"},{"n":19,"text":"No one at the table was surprised to learn that Alex loved the sushi. He even found that he liked wasabi, as long as he was careful to use only a small speck of it on each bite."},{"n":20,"text":"“What do you think, Emily?” asked Mrs. Godfrey after a few moments."},{"n":21,"text":"Emily picked up another piece of sushi with her chopsticks. “I love it,” she said. “I think we’re going to need to find a restaurant at home that serves sushi,” she added."},{"n":22,"text":"Mr. and Mrs. Godfrey laughed. “Our kids are turning into very well-seasoned eaters!” said Mr. Godrey."}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15},{"type":"paragraph","n":16},{"type":"paragraph","n":17},{"type":"paragraph","n":18},{"type":"paragraph","n":19},{"type":"paragraph","n":20},{"type":"paragraph","n":21},{"type":"paragraph","n":22}],"kind":"故事 · Fiction"},{"id":"P008","page":"P008","title":"Bonsai","exercisePage":"P009","pdfPage":12,"pdfExercisePage":13,"lead":"Have you ever seen miniature trees, or bonsai, at a nursery or a botanic garden?","paragraphs":[{"n":1,"text":"In Japan, the word bonsai means tray plant. It refers to the interesting combination of art and cultivation of miniature trees and plants. Bonsai originated in China more than 2,000 years ago. The tradition spread to Japan about 700 years ago, and it is still popular there today."},{"n":2,"text":"Some people believe that small, or dwarf, plants must be used in bonsai, but this is not true. Nearly any type of tree or plant can be used, as long as it is grown from a seed or small cutting. The owner must then prune, trim, and shape the plant as it grows so that it resembles, in miniature, a much larger tree. He or she must do this skillfully, however, because the plant must appear to have grown naturally, untouched by humans. It takes a great deal of care and patience to achieve this balance."},{"n":3,"text":"A bonsai is more than just a plant. It holds a special and significant place in Japanese culture. According to Japanese tradition, three elements are necessary to create a successful bonsai: truth, goodness, and beauty. When these three elements come together, a bonsai can live for hundreds of years! It may be passed down from one generation of a family to the next as a prized possession."},{"n":4,"text":"In Japan, bonsais are grown in containers outdoors but are brought into the home for special occasions. Inside, they are often placed in the tokonoma. This is a small area in traditional Japanese rooms intended for the display of artistic objects. In a Japanese garden, other items may be added to the bonsai. The addition of rocks, small buildings, and miniature people is called bon-kei. Sai-kei is a related art form in which entire landscapes are reproduced in miniature."},{"n":5,"text":"There are five basic styles of bonsai: the formal upright, informal upright, slanting, cascade, and semi-cascade. In the formal upright, the trunk of the tree should be perfectly straight, and the branches should be balanced. In the informal upright, the trunk should bend slightly to one side, but never toward the viewer. The trunk of a slanting tree leans to one side and may look similar to the informal upright."},{"n":6,"text":"Cascade and semi-cascade are similar because in both styles the leaves and the branches cascade down toward the base of the plant. The main difference is that in the cascade style, the leaves actually extend below the bottom of the container."},{"n":7,"text":"If you are interested in raising a bonsai of your own, there is no need to go all the way to Japan to find one. Today, bonsais are available in nurseries all over the United States. You will have to do a little research to make sure that you know how to properly care for your plant. You will also need to be prepared to spend time caring for your plant. But as any bonsai owner will tell you, your efforts are well worth the reward of being a part of this time-honored Asian tradition."}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":"说明文 · Informational Text"},{"id":"P010","page":"P010","title":"A Schoolyard Garden","exercisePage":"P011","pdfPage":14,"pdfExercisePage":15,"lead":"What are your favorite fruits and vegetables?","paragraphs":[{"n":1,"text":"Have you ever eaten something that you grew in your own garden? Many people have not had the pleasure of this experience. Alice Waters, the owner of Chez Panisse Restaurant, set out to change all that for a special group of students at Martin Luther King Junior Middle School in Berkeley, California.","heading":""},{"n":2,"text":"Waters worked with the school's principal, Neil Smith, to create a cooking and gardening program at the school. Waters believes in the importance of people knowing where their food comes from. She also believes that there is a strong relationship between food, health, and the environment. Her goal at the middle school was to show children the pleasure in gardening and in preparing the foods that they cultivated. She wanted to teach them that a healthy body and a healthy environment go hand in hand.","heading":""},{"n":3,"text":"The project that Waters began took a lot of time and patience. She relied on the help of teachers, students, and community volunteers to turn an asphalt parking lot into a garden. At the same time, renovation was begun to turn an old, unused cafeteria into a kitchen where students could prepare foods and share meals with their teachers.","heading":""},{"n":4,"text":"In the 1995–1996 school year, the first usable crops were planted. They included greens such as arugula and mustard, as well as lettuce, kale, bok choy, carrots, turnips, beets, and potatoes. The following year brought the addition of plants such as citrus trees, apples, plums, black currants, hazelnuts, figs, raspberries, runner beans, and hibiscus. Every year since then, new crops are added and old crops are evaluated to make sure that they are best suited for the environment and the needs of the school.","heading":""},{"n":5,"text":"Students have found that they look forward to the time they spend in the garden each week. They have learned how to weed, prune, and harvest. They have learned about the life cycles of various plants. They also know how to enrich the soil through composting, a process in which leftover scraps of fruits and vegetables are used as fertilizer. Many have discovered that they like fruits and vegetables that they had never before been willing to try.","heading":""},{"n":6,"text":"Alice Waters dreams that one day there will be a garden in every school in the United States. She hopes that school lunches can be prepared using the produce from the gardens and other locally-grown organic produce. If you are interested in learning more about Martin Luther King Junior Middle School's Edible Schoolyard, seeing pictures of the students and their garden, and finding out about how to start a garden at your school, visit www.edibleschoolyard.org.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""},{"id":"P012","page":"P012","title":"A Growing Plan","exercisePage":"P013","pdfPage":16,"pdfExercisePage":17,"lead":"Does your school have a garden?","paragraphs":[{"n":1,"text":"Drew, Emilio, and Michi sat at a picnic table in the park on a beautiful, crisp fall afternoon. The air around them was filled with the sounds of children playing, dogs barking, and people laughing or calling to one another. But Drew, Emilio, and Michi ignored the sounds around them and focused on the task they had set out to complete.","heading":""},{"n":2,"text":"They wanted to start a school garden at Jefferson Middle School. Initially, it had been Drew’s idea. He had first seen a school garden when he went to visit his cousin P.J. in Washington. He was amazed at the variety of fruits and vegetables the students at P.J.’s school grew. “It’s a lot of work,” P.J. had warned. “But it’s also my favorite part of the week. I love putting on my boots, getting outside, and seeing all the new things that have happened since I was last out there.”","heading":""},{"n":3,"text":"When Drew returned from his trip to Washington, he told Emilio and Michi all about what he had seen. Now the three of them were determined to come up with a plan to bring a school garden to Jefferson.","heading":""},{"n":4,"text":"Drew opened his notebook and prepared to record any ideas they had for convincing Ms. Milano, the school principal, that the garden was a good idea.","heading":""},{"n":5,"text":"“We’re going to need an adult to supervise the whole operation,” said Drew thoughtfully. “I know that Mr. Hasselbach gardens at home. Just last week he brought in a whole basket of tomatoes and zucchini from his garden. He might be willing to help.” Drew jotted down Mr. Hasselbach’s name in his notebook.","heading":""},{"n":6,"text":"“We might need donations to get this project up and running,” added Michi. “We could tell Ms. Milano that we would be willing to organize a bake sale or yard sale to raise funds.”","heading":""},{"n":7,"text":"“That’s a great idea,” said Emilio. “I think we need to be able to present her with a realistic plan. My aunt is the co-owner of a nursery. She could help us design the garden, select plants, and create a budget. That way, Ms. Milano wouldn’t feel as though she were committing to something unknown.”","heading":""},{"n":8,"text":"Drew nodded and made some more notes. “P.J. mentioned that the students at his school cook meals with the produce from their garden. If we do something like that too, think of all the lessons we’d learn. We’d have to measure and weigh things and follow a recipe. Combine that with the science lessons we’d get from working in the garden, and there’s no way Ms. Milano could turn us down!”","heading":""},{"n":9,"text":"Michi and Emilio grinned. “If everything goes as planned, we’ll be digging in the dirt in no time at all!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9}],"kind":""},{"id":"P014","page":"P014","title":"What’s Cooking?","exercisePage":"P015","pdfPage":18,"pdfExercisePage":19,"lead":"What are some other meals you could make using the fresh vegetables from your garden or from a farmer’s market?","paragraphs":[{"n":"u1","text":"Before you begin:","label":"小标题","raw":"Before you begin:"},{"n":"u2","text":"- Never use the stove or a knife without an adult’s supervision. - Always remember to keep the handle of the skillet turned in so you cannot accidentally bump into it.","label":"说明 / 列表","raw":"- Never use the stove or a knife without an adult’s supervision.\r\n- Always remember to keep the handle of the skillet turned in so you cannot accidentally bump into it."},{"n":"u3","text":"## Garden Lasagna","label":"未编号材料","raw":"## Garden Lasagna"},{"n":"u4","text":"1 16-ounce package lasagna noodles 2 teaspoons olive oil 1 1/2 cups diced red bell pepper 1 cup diced green bell pepper 1 small yellow onion, diced 2 cups diced tomatoes 1 large zucchini, thinly sliced 1 16-ounce can tomato sauce 1/2 cup grated Parmesan cheese 1 15-ounce container part-skim ricotta cheese 1 8-ounce package part-skim shredded mozzarella cheese 2 eggs 1/4 teaspoon black pepper 1/4 teaspoon dried oregano","label":"未编号材料","raw":"1 16-ounce package lasagna noodles\r\n2 teaspoons olive oil\r\n1 1/2 cups diced red bell pepper\r\n1 cup diced green bell pepper\r\n1 small yellow onion, diced\r\n2 cups diced tomatoes\r\n1 large zucchini, thinly sliced\r\n1 16-ounce can tomato sauce\r\n1/2 cup grated Parmesan cheese\r\n1 15-ounce container part-skim ricotta cheese\r\n1 8-ounce package part-skim shredded mozzarella cheese\r\n2 eggs\r\n1/4 teaspoon black pepper\r\n1/4 teaspoon dried oregano"},{"n":1,"text":"Here are some other things you will need: a measuring cup, a teaspoon, a cutting knife, a colander, a wooden spoon, wax paper, a large pot, a bowl, aluminum foil, a saucepan, a spatula, and a 9-inch by 13-inch baking dish.","heading":""},{"n":2,"text":"Bring a large pot of lightly salted water to a boil. Cook the noodles in boiling water for 8 to 10 minutes, stirring occasionally. Have an adult pour the noodles into a colander in the sink. Rinse the noodles with cold water and place them in a single layer on wax paper to cool.","heading":""},{"n":3,"text":"Cook the diced bell peppers and onion in olive oil in a large saucepan until the onions are translucent. Stir in the tomatoes, zucchini, and tomato sauce. Simmer for 10 minutes.","heading":""},{"n":4,"text":"Preheat the oven to 375°F. In a medium bowl, combine 1/4 cup of the Parmesan cheese with the ricotta cheese, mozzarella cheese, eggs, black pepper, and oregano. Remember to wash your hands after handling the eggs.","heading":""},{"n":5,"text":"Reserve 1/2 cup of the mixture. Then, place a small amount of the vegetable mixture in the bottom of the baking dish. Place three lasagna noodles lengthwise in the dish. Layer some of the cheese mixture and the vegetable sauce on top of the noodles. Continue to layer the remaining ingredients, ending with noodles.","heading":""},{"n":6,"text":"Spread the reserved cheese mixture on top of the noodles. Sprinkle with the remaining half of the Parmesan cheese.","heading":""},{"n":7,"text":"Cover the dish with foil, and bake for 20 minutes. Remove the foil, and bake for 10 more minutes so the cheese can brown.","heading":""},{"n":8,"text":"Allow the lasagna to cool for about 10 minutes before serving. Then, invite your friends and family to the table to sample this tasty dish. It serves 8, so there is a good chance that you won’t finish it all. Just freeze the leftovers, and enjoy them on another day.","heading":""}],"blocks":[{"type":"note","n":"u1"},{"type":"list","n":"u2"},{"type":"note","n":"u3"},{"type":"note","n":"u4"},{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P016","page":"P016","title":"Garden Gourmet","exercisePage":"P017","pdfPage":20,"pdfExercisePage":21,"lead":"Have you ever helped to prepare a meal for a large group of people?","paragraphs":[{"n":1,"text":"Emilio and Michi spread the colorful tablecloth on the table. They made room for Drew, who was carrying a covered casserole dish with potholders. Small beads of water had condensed on the inside of the lid. “Watch out,” Drew warned. “This is pretty hot.”","heading":""},{"n":2,"text":"A moment later, Kent and Alyssa added another steaming dish to the table. “That smells so good!” exclaimed Michi. “Are most of the parents here yet? I’m famished.”","heading":""},{"n":3,"text":"Kent peeked through the doors that led into the hallway. “I think Ms. Milano and Mr. Hasselbach just finished giving them the garden tour. They should be heading into the cafeteria next.”","heading":""},{"n":4,"text":"The students of Jefferson Middle School had spent all afternoon preparing for the evening meal. They did their best to transform the lunchroom into an elegant and beautiful dining area for their families. The gray metal tables were hidden beneath brightly-colored cotton tablecloths. Each table held a small glass vase with fresh flowers from the school’s garden.","heading":""},{"n":5,"text":"Only about half of the overhead lights were on. The rest of the lighting was provided by the small white lights that Michi and Alyssa had carefully wrapped around the columns that were scattered throughout the cafeteria. They thought that candles would do an excellent job of creating an elegant mood, but Ms. Milano would not be swayed from her conviction that candles were too risky to use in a school.","heading":""},{"n":6,"text":"As the families found their seats, Ms. Milano motioned to Drew, Emilio, and Michi to join her at the front of the room. “Could I have everyone’s attention?” asked Ms. Milano. “I know you can smell all the wonderful foods our students prepared, so I won’t keep you from your dinners for long. I just wanted to take a moment to congratulate Drew, Emilio, and Michi for their wonderful idea.”","heading":""},{"n":7,"text":"Mrs. Milano continued, “A year ago, they first came to me with the plan for starting a garden at Jefferson. I was a bit skeptical at first, but they had thought through everything. Anytime I had a question about how we would make this work, they had an answer prepared. As you can see, they were absolutely correct. About three-quarters of the food you’ll be enjoying tonight came from the school garden. The students prepared the entire meal themselves, with some guidance from Mr. Hasselbach.”","heading":""},{"n":8,"text":"Ms. Milano handed Drew, Michi, and Emilio each a tissue-wrapped package. They unwrapped their packages as Ms. Milano addressed the room. “As a thank-you to these students for their creative idea, hard work, and perseverance, they have each received a stepping stone for the garden. Their names and the date are engraved on the stones.”","heading":""},{"n":9,"text":"She turned to them. “Students for years to come will be enjoying the garden that you helped create,” she said. “We thought it would be appropriate for them to have a reminder of our garden’s ambitious founders.”","heading":""},{"n":10,"text":"Drew, Emilio, and Michi held up their stepping stones and grinned as the crowd clapped. “And now,” said Ms. Milano, “please help yourselves to some of the mouthwatering food our young chefs have prepared. Dinner is served!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10}],"kind":""},{"id":"P018","page":"P018","title":"A Shriek in the Night","exercisePage":"P019","pdfPage":22,"pdfExercisePage":23,"lead":"Have you ever been frightened by a sound in the night?","paragraphs":[{"n":1,"text":"Savannah read under her covers with a flashlight until her eyes were closing. She switched off the flashlight and let her book drop to the rug beside her bed. She turned over and snuggled deeper into the soft flannel sheets.","heading":""},{"n":2,"text":"It felt as though Savannah had been sleeping for only a few minutes when she awoke with a start to a terrible, bloodcurdling scream. She lay stiffly and silently in her bed waiting to see what would happen. Her clenched muscles had just begun to relax when she heard another scream coming from outside her bedroom window. This scream was followed by a series of wails and shrieks.","heading":""},{"n":3,"text":"Savannah slipped from her bed and ran as quickly as she could to her parents’ bedroom. “Mom,” she whispered urgently. “Did you hear that screaming?”","heading":""},{"n":4,"text":"Savannah’s mom was already awake, sitting up and hunting for her slippers. Savannah’s dad continued to snore. Neither Savannah nor her mother were surprised. Savannah’s dad was notorious for being able to sleep through anything. When he lived alone before he got married, he had to set three alarm clocks every night. He positioned them in various places around his bedroom to make sure that he would get up in time for work.","heading":""},{"n":5,"text":"Savannah’s mom finally found her slippers and motioned Savannah toward the bedroom door. She shut the door behind them. “What do you think it is, Mom?” asked Savannah.","heading":""},{"n":6,"text":"Before Mom could answer, she and Savannah heard the terrible shrieks again. They waited until it was over to speak. “I’m pretty sure it’s an animal,” said Mom. “Let’s see if we can spot anything through the kitchen window.”","heading":""},{"n":7,"text":"Savannah and her mom scanned the dark backyard but couldn’t see anything. They were getting ready to head back to bed when the noises began again. This time they both looked up into the large old oak trees that towered over the backyard. They could see two small eyes gleaming in the moonlight from one of the highest branches.","heading":""},{"n":8,"text":"“I think it’s an owl,” said Mom, craning her neck to get a better look. “All I can see are its eyes, though.”","heading":""},{"n":9,"text":"“I feel so much better,” said Savannah with relief in her voice. “Maybe we can look online in the morning and see if we can figure out what kind of owl it is,” she suggested. “My teacher showed us a great website for wild animal identification.”","heading":""},{"n":10,"text":"Savannah and her mom both returned to bed. They heard the owl’s cries one more time before they drifted back to sleep, but it didn’t sound nearly as frightening anymore.","heading":""},{"n":11,"text":"In the morning, Savannah and her mom were able to identify the owl from the night before as a barn owl. They used the website that Ms. Petrovic had recommended to listen to sound bytes of different types of animals.","heading":""},{"n":12,"text":"As they were listening, Savannah’s dad came downstairs for breakfast. “What’s all that racket?” he asked cheerfully, pouring himself a glass of orange juice.","heading":""},{"n":13,"text":"“Doesn’t that sound at all familiar, Dad?” asked Savannah, replaying the barn owl’s call.","heading":""},{"n":14,"text":"“Nope,” said Dad. “Should it?”","heading":""},{"n":15,"text":"Savannah and her mom just laughed.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15}],"kind":""},{"id":"P020","page":"P020","title":"Night Flyers","exercisePage":"P021","pdfPage":24,"pdfExercisePage":25,"lead":"What other creatures are associated with the night?","paragraphs":[{"n":1,"text":"Have you ever heard a hooting or screeching sound in the night and wondered if you were hearing an owl? It’s more likely that you have heard an owl in the wild rather than seen one. Owls are nocturnal, which means that they are active mostly at night. Owls feed on live prey, and the darkness makes it harder for them to be seen by the small animals they hunt.","heading":""},{"n":2,"text":"There are more than 175 species of owls, but they are generally divided into two categories—common owls and barn owls. Barn owls have a light-colored, heart-shaped face. Common owls are a diverse group with many different patterns and colorings, but all have a round face. The largest owls are as big as eagles. The smallest is the elf owl, which lives in Mexico and the southwestern United States. It measures only five inches and makes its home in the holes woodpeckers create in large cacti.","heading":""},{"n":3,"text":"One attribute that is common to all owls is their sharp sense of hearing. Because they hunt at night, hearing is especially important to their survival. Owls have the ability to hear a rodent’s movements from hundreds of feet away. In many species, the ear openings are positioned asymmetrically, or unevenly, on the owl’s head. This is important to the owl’s keen sense of hearing because it allows the owl to more accurately locate the source of the sounds.","heading":""},{"n":4,"text":"Owls are farsighted, meaning they cannot see well at close distances. However, they can see well in dim light, which enhances their hunting skills. Unlike most animals, an owl’s eyes do not move. Instead, the owl must turn its entire head to see anything that is not directly in front of it. For this reason, the owl has an extremely flexible neck. It is able to turn its head about 270 degrees. That is three quarters of a circle!","heading":""},{"n":5,"text":"Another common attribute to all owls is their nearly silent flight. This keeps the owl’s prey from hearing it approach, but it also permits the owl to use its hearing to locate the exact position of the animal. Owls’ wings are a very soft, downy type of feather that muffles the sound in flight. A fringe of feathers along the edges of the wings is also thought to quiet the flapping sound of the owls’ wings.","heading":""},{"n":6,"text":"Owls are found in the myths, folklore, and legends of many cultures. In France, archaeologists discovered cave paintings between 15,000 and 20,000 years old that contain images of owls. Mummified owls have also been found in Egyptian tombs, which indicates they were respected in ancient Egyptian culture.","heading":""},{"n":7,"text":"Owls symbolize wisdom in some cultures. In others, they are feared and thought to bring bad luck. It is likely that the negative associations with owls came about because they are nocturnal creatures. Things associated with night and darkness have often been feared throughout history.","heading":""},{"n":8,"text":"The next time you are out at night, listen quietly for the sounds of an owl. You may be lucky enough to catch a glimpse of an owl’s gleaming eyes or watch an owl soar across a field in nearly silent flight.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P022","page":"P022","title":"A Beacon of Light","exercisePage":"P023","pdfPage":26,"pdfExercisePage":27,"lead":"Have you ever had the opportunity to visit a lighthouse?","paragraphs":[{"n":1,"text":"Lighthouses can symbolize many different things. For tourists, they can be an interesting place to visit, explore, and photograph. For historians, they are a window to the past and a reminder of a different way of life. For sailors and ship captains, they are a sign of safety.","heading":""},{"n":2,"text":"Lighthouses are structures located along the shorelines of large bodies of water. They project a strong beam of light that alerts sailors of their location. They can protect a boat from running aground at night or other times when visibility is poor because of fog or a storm. Lighthouses alert sailors that land is near and warn them of potential dangers, such as reefs or rocky harbors.","heading":""},{"n":3,"text":"Originally, lighthouses were constructed with living quarters for the lighthouse keeper. It was the job of the keeper to maintain the lighthouse and make sure that it was always working properly. Although it could be lonely at times, it was an important job. Today, almost all lighthouses are automated, which means that there is no longer a need for lighthouse keepers.","heading":""},{"n":4,"text":"No one is certain when lighthouses first came into existence. We do know that the concept of lighthouses is more than 3,000 years old. An epic Greek poem titled The Iliad was written by a man named Homer around 1200 B.C. In the poem, Homer refers to a lighthouse, giving modern scholars an idea of how long lighthouses have been a part of human life.","heading":""},{"n":5,"text":"Early versions of lighthouses were quite different from today’s lighthouses. They were usually made of iron baskets that were suspended from long poles. The baskets contained burning coal or wood. In the 1700s, these baskets were replaced with oil or gas lanterns. When electricity was invented, the lanterns were replaced with electric beacons.","heading":""},{"n":6,"text":"In 1822, a French physicist named Augustin Fresnel invented a lens that would prove to be very important in lighthouse technology. The Fresnel lens uses glass prisms to concentrate light and send it through a very powerful magnifying lens. With the invention of the Fresnel lens, it became possible to project a beam of light as far as 28 miles from shore!","heading":""},{"n":7,"text":"Lighthouse beams can be used in a variety of ways to help sailors identify the lighthouse and their own location. Different patterns and lengths of flashes are unique to a specific lighthouse. Sailors can observe a sequence and then look it up in a reference book that will tell them which lighthouse they have spotted.","heading":""},{"n":8,"text":"During the day, sailors can identify lighthouses simply by their appearance. Some are short and fat, while others are tall and thin. They can be constructed of many different materials, such as wood, stone, brick, steel, and aluminum. The patterns also differ greatly. Some lighthouses are painted with stripes or a series of diamond shapes that distinguish them. Others are distinguished by their shape—round, square, rectangular, or conical (shaped like a cone).","heading":""},{"n":9,"text":"Many lighthouses along America’s coastlines are no longer functioning. Historical societies, concerned community members, and even the National Park Service have preserved them. They are sometimes converted into museums, inns, educational centers, or even private homes. If you ever have a chance to visit one, getting a glimpse of history is worth the trip.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9}],"kind":""},{"id":"P024","page":"P024","title":"Lighthouse Life","exercisePage":"P025","pdfPage":28,"pdfExercisePage":29,"lead":"Where will Paloma’s imagination take her?","paragraphs":[{"n":1,"text":"Paloma sat at a computer in the school library. She stared at the blank screen and the blinking cursor. She rummaged around in her backpack for a rubber band, and then she pulled her hair into a thick ponytail. Paloma looked at the computer screen. It was still blank. She sighed and flipped through her notebook to reread Mr. Molina’s assignment. It was due in just two days, and Paloma knew that she couldn’t procrastinate any longer.","heading":""},{"n":2,"text":"Write a creative short story using an experience that you have had recently, Paloma read. Your story should include two examples of figurative language. The finished story should be three to four pages long. Your first draft is due on Friday. Be prepared to share your story with the class and make notes for a revision, which you will have an additional week to complete.","heading":""},{"n":3,"text":"Paloma and her family had taken a trip to North Carolina’s Outer Banks just before school began. They had visited four different lighthouses, and Paloma had wondered what it would be like to live in a lighthouse. She knew that before lighthouses were automated, they were run and maintained by a lighthouse keeper who lived on the premises. Paloma thought that would have been an interesting job to have, but she wanted to actually live in a lighthouse. Without thinking about it any longer, Paloma began to write the story.","heading":""},{"n":4,"text":"I sat with Sadie curled on my lap and looked out the window at the crashing waves. The heavy rain beat against my lighthouse like a thousand footsteps racing up and down the walls. I held Sadie closer, and she let out a small meow of displeasure. I knew that the coming storm could not be too dangerous if Sadie was still acting normally. I have read that animals can sense changes in weather and will seek shelter from a tornado or hurricane. I was relying on Sadie’s calmness to get me through my first hurricane on the island.","heading":""},{"n":5,"text":"I knew that my lighthouse was sturdily built. It had survived more than one hundred years’ worth of hurricanes and tropical storms. There was no reason to believe that the bricks and wood could not survive another. I looked up at the staircase that spiraled above me and shuddered as I felt the tower sway slightly in a gust of wind.","heading":""},{"n":6,"text":"Paloma stopped and reread what she had just written. She smiled to herself, saved her story, and then settled into her chair to continue writing. She wasn’t sure what was going to happen next, but she knew that if she just kept going, the story would continue to tell itself. Paloma couldn’t wait to find out where it would take her.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""},{"id":"P026","page":"P026","title":"Lighthouse on the Move","exercisePage":"P027","pdfPage":30,"pdfExercisePage":31,"lead":"How would you move a building that is 193 feet tall?","paragraphs":[{"n":1,"text":"There are certain things that people just don’t expect to see move. We expect structures like houses, schools, and office buildings to be stationary objects. That is why many people were surprised to learn that the tallest lighthouse in the United States, the Cape Hatteras Lighthouse in Buxton, North Carolina, was going to be moved in June of 1999.","heading":""},{"n":2,"text":"Why would anyone want to move a lighthouse? The 193-foot-tall lighthouse was built between 1868 and 1870. It weathered countless storms, as well as many hurricanes. It guided sailors away from the Diamond Shoals, a dangerous, shallow area about 14 miles off the coast of Cape Hatteras.","heading":""},{"n":3,"text":"The coastline around the Outer Banks is known as the Graveyard of the Atlantic. It is estimated that more than 230 ships sank there between 1866 and 1945. The Cape Hatteras Lighthouse faithfully did its duty in protecting sailors from harm. This is exactly why it was determined that the lighthouse would have to be preserved. Experts were worried that continued erosion by the pounding waves of the ocean would destroy the lighthouse. They wanted to move it before it collapsed and was swept out to sea.","heading":""},{"n":4,"text":"Moving the 4,800-ton lighthouse was no small project. Many people protested the move. They believed that the lighthouse was not strong enough to withstand it. They felt that it should be allowed to remain in the place it had always been. Others thought that moving the lighthouse was not important enough to justify spending the 9.8 million dollars the move would cost. After much debate, it was decided that the project could proceed as planned.","heading":""},{"n":5,"text":"The new location for the lighthouse was chosen. It would move a total of about 2,900 feet. In the new location, the Cape Hatteras Lighthouse would stand 1,600 feet from the ocean that threatened to destroy it. The planners estimated that it would take between four and six weeks to move the lighthouse. In reality, it took only about three weeks to complete the job.","heading":""},{"n":6,"text":"The lighthouse was moved using the power of seven hydraulic jacks. It sat on pads of rollers that rested on a set of rails, similar to train tracks. After the lighthouse had moved from one set of tracks to the next, the first set of tracks was moved in front of the lighthouse so that it could pass over them again. The process was extremely slow. Many people came to watch what they figured would be a dramatic moment in North Carolina history. But the lighthouse only moved an average of about two inches per minute, which wasn’t all that exciting to watch.","heading":""},{"n":7,"text":"The Cape Hatteras Lighthouse survived the move and has settled into its new home. Some people still look at the vacant spot on the beach where it stood for so many years and feel a sense of sadness. Others are just relieved that the lighthouse was saved so that future generations could appreciate its bold, spiral stripes and proud history.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P028","page":"P028","title":"Keeping the Light","exercisePage":"P029","pdfPage":32,"pdfExercisePage":33,"lead":"What would it be like to live in a lighthouse?","paragraphs":[{"n":1,"text":"Imagine living in an isolated place where bad weather was not uncommon and people’s lives depended on you doing your job. This was the life of a lighthouse keeper before lighthouses became automated. Lights that had mirrors and lenses had to be cleaned and polished regularly. The keepers had to be watchful at night to make sure that the lamps stayed lit and there was enough fuel to last the night. When ships wrecked in nearby areas, lighthouse keepers were expected to help with the rescue effort.","heading":""},{"n":2,"text":"Because the work was physically demanding and women rarely worked outside the home, the job of lighthouse keeper was most often given to men. However, the job often fell to the daughters or wives of lighthouse keepers when the men were called to war, became ill, or died. Women proved themselves to be equally capable of holding this difficult job that was as much a way of life as it was a career.","heading":""},{"n":3,"text":"One of the most famous female lighthouse keepers was Ida Lewis of Newport, Rhode Island. Her father was the keeper of Lime Rock Lighthouse, but after only a few months at the job he had a stroke. Because Hosea Lewis was no longer able to perform his duties as keeper, 15-year-old Ida and her mother took over in 1853. Captain Lewis lived about 20 years longer, but Ida and her mother performed all the required duties of a keeper.","heading":""},{"n":4,"text":"Ida was known as the best swimmer in Newport. She was also skilled at handling a rowboat, something that was not seen as particularly appropriate for a woman of that time. However, during her 39 years keeping the light at Lime Rock, Ida rescued between 18 and 25 people. That certainly made it seem less important whether or not Ida’s behaviors were appropriate!","heading":""},{"n":5,"text":"People were intrigued by this woman who appeared to make her own rules for living. Thousands of visitors came to Lime Rock in hope of seeing Ida Lewis in person. Ida was used to the quiet solitude of a lighthouse keeper’s life, and she was uncomfortable with all the attention. Even so, she couldn’t help being honored by the awards she received for her service. President Ulysses S. Grant made a trip to Rhode Island to visit Ida and to commend her on her heroism.","heading":""},{"n":6,"text":"In 1924, Lime Rock was renamed Ida Lewis Rock in honor of the keeper who had died in 1911. The lighthouse service of Rhode Island also renamed Lime Rock Lighthouse the Ida Lewis Lighthouse. It is the only lighthouse to be named for its keeper.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""},{"id":"P030","page":"P030","title":"A Picture Perfect Day","exercisePage":"P031","pdfPage":34,"pdfExercisePage":35,"lead":"Have you ever taken any photographs?","paragraphs":[{"n":1,"text":"“Hold that pose!” said Dante, snapping a photo of his mother.","heading":""},{"n":2,"text":"Dante’s mom looked up in surprise and spilled some of the orange juice she was pouring. “Dante, what are you doing?” she asked, setting the carton of juice on the counter.","heading":""},{"n":3,"text":"“It’s a project I’m doing for school,” Dante explained, sitting down at the table. “For the next two days, I’m going to keep a photo diary of my life.”","heading":""},{"n":4,"text":"Mrs. Carter smiled at her son. “It sounds interesting,” she said. “I’m just not sure that a picture of me in my pajamas pouring orange juice at 7 o’clock in the morning is the most interesting part of your day.”","heading":""},{"n":5,"text":"“I’m not supposed to leave anything out,” replied Dante. “It doesn’t really matter if it’s interesting. This diary should be a realistic narrative of my day. You and breakfast are both a part of my day, so I wanted to make sure they were captured on film.”","heading":""},{"n":6,"text":"Mrs. Carter nodded and bit into a slice of toast. “What will you do with your photographs when you’re done? Do you have to present them to your class?”","heading":""},{"n":7,"text":"“I’m going to mount the photos on a piece of posterboard in chronological order,” Dante said. “Then, the class will try to write a brief summary of my day based on the pictures I took.”","heading":""},{"n":8,"text":"“Do your dad and brother know about your photo diary project?” asked Mrs. Carter. “You might want to give them a bit of advance warning if they’re going to be part of it.”","heading":""},{"n":9,"text":"Just then, Wesley came pounding down the stairs into the kitchen. He was carrying a basketball under one arm and grabbed a piece of toast as he sat down at the table.","heading":""},{"n":10,"text":"“Wesley,” said Dante, peering through the camera lens at his brother, “I’m doing a photo diary for school.”","heading":""},{"n":11,"text":"Wesley grinned directly at the camera as Dante snapped the photo. Mrs. Carter laughed. “I forgot who I was talking about here,” she said, giving Wesley a quick squeeze on the shoulder. “I guess no explanation is necessary for your brother, Dante,” she said.","heading":""},{"n":12,"text":"“I don’t blame him for wanting to get a picture of me,” said Wesley. “When I make it into the NBA, those pictures will probably be pretty valuable,” he joked.","heading":""},{"n":13,"text":"Dante laughed as he got up from the breakfast table. “There are some things you just can’t capture in pictures,” he said, shaking his head. He took his dishes to the sink and then managed to get a picture of his dad adjusting his tie as he walked into the kitchen with the newspaper tucked under his arm.","heading":""},{"n":14,"text":"He grabbed Mrs. Carter around the waist as she got up to get another cup of coffee. He waltzed her across the kitchen and then dipped her deeply as she laughed. “Isn’t this going to make it into your diary?” he asked Dante.","heading":""},{"n":15,"text":"Dante grinned. “I’m just not sure that my class would be able to work it into the narrative of my day. Like I said, there are some things you just can’t capture in pictures.”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15}],"kind":""},{"id":"P032","page":"P032","title":"Point and Click","exercisePage":"P033","pdfPage":36,"pdfExercisePage":37,"lead":"Do you know how a camera works?","paragraphs":[{"n":1,"text":"Cameras might seem almost unbelievable if you do not know how they work. Point a camera at something, push a button, and you end up with a realistic image of what you saw. How does that happen? The camera’s ability to reproduce what you see is not actually all that complicated, once you understand a few basic elements. In fact, the camera itself is just a box that controls how much light reaches the film inside. The original Latin term camera obscura means dark chamber, and it is a perfect description.","heading":""},{"n":2,"text":"Traditional film is a plastic strip that has been coated with light-sensitive chemicals. Like the rods and cones in our eyes, these chemicals change according to how much light enters the camera. The image that enters through the camera’s lens creates a unique pattern in the chemicals that will be used when the photograph is developed in a lab. Instead of chemical film, a digital camera contains a light-sensitive electrical device that records the image.","heading":""},{"n":3,"text":"Having just the right amount of light reach the film is crucial to taking a good picture. The two main devices that control light are the shutter and the aperture. The shutter is a small door inside the camera that opens and closes when you take a picture. It affects how long the film is exposed to light.","heading":""},{"n":4,"text":"On a typical sunny day, the shutter speed might be as fast as 1/125 of a second to keep too much light from getting in. A quick shutter speed is also needed when you want to capture something that is moving. If the film is exposed too long, the moving object will be a blur in the developed photo.","heading":""},{"n":5,"text":"Sometimes, slow shutter speeds are needed. For example, if you want to take a picture at night or in low light, you need to leave the shutter open longer so that enough light can reach the film and create an image. To take photographs of stars or the moon, you would need to have the shutter open for a very long time.","heading":""},{"n":6,"text":"The aperture is a circular opening behind the lens that can be adjusted to let in more or less light, similar to the iris in an eye. The aperture also determines the depth of field, or how much of the photo will appear to be in focus. When the aperture is open widely, the focus will only be on a narrow range of objects, but when the aperture is small, things both near and faraway will look sharp.","heading":""},{"n":7,"text":"The aperture and shutter speed work together to get just the right amount of light to the film. For instance, if you want to photograph a fast moving object, you need a fast shutter speed, but that may not let in enough light. To compensate, you need to open the aperture wider so that the proper amount of light reaches the film. Of course, a camera with an automatic setting will do all of the adjustments for you, so all you have to do is just “point and click.”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P034","page":"P034","title":"Talking Photos","exercisePage":"P035","pdfPage":38,"pdfExercisePage":39,"lead":"What will Dante learn in his interview with Mr. Salinas?","paragraphs":[{"n":1,"text":"“Thanks for taking the time to meet with me, Mr. Salinas,” said Dante, reaching out to shake the photographer’s hand.","heading":""},{"n":2,"text":"“I’m happy to do it,” replied Mr. Salinas. “I love to talk about my work, and as patient as my family is, I’m sure they still get a little tired of hearing about it all of the time.”","heading":""},{"n":3,"text":"“I brought a voice recorder with me,” said Dante, holding up the small black box. “Would it be all right with you if I recorded our conversation?” he asked. “That way, I won’t be distracted by taking notes, and I can transcribe it later.”","heading":""},{"n":4,"text":"“That sounds good to me,” said Mr. Salinas. He settled into his chair and took a sip of bottled water. “I’m ready when you are,” he said.","heading":""},{"n":5,"text":"Dante Carter: When did you first know that you wanted to be a photographer?","heading":""},{"n":6,"text":"Edward Salinas: It wasn’t until I had already graduated from college. I was teaching high school English, and I decided to take a photography class just for fun. The class was at a community arts center in downtown Seattle, Washington. It completely changed my life. I went back to school a year later to begin working on a degree in photography.","heading":""},{"n":7,"text":"DC: Who has been your greatest influence?","heading":""},{"n":8,"text":"ES: Well, I have been lucky to have had several wonderful mentors who encouraged and inspired me. After I completed my photography degree, I had a year-long internship with a very talented photographer named Elizabeth Chu. For the most part, she documented people’s lives through photography. She had an amazing ability to capture so much character and personality in a single image.","heading":""},{"n":9,"text":"DC: What other photographers do you admire?","heading":""},{"n":10,"text":"ES: There are so many, I’m not even sure where to begin. The work of Walker Evans is extraordinary. He is probably best known for his photographs showing the poverty of life in the South during the 1930s. There is a very timeless and human aspect to his work. Alfred Stieglitz was influential in promoting the work of photographers as artists. His images of New York during the first part of the 20th century are stunning.","heading":""},{"n":11,"text":"DC: What do you find most rewarding about your job?","heading":""},{"n":12,"text":"ES: I suppose I’m most grateful that it doesn’t feel like a job to me, even though it can often be hard work. There are plenty of frustrations when photos don’t turn out the way I had anticipated. But documenting life and nature and beauty is very gratifying. I can’t imagine anything else I’d rather do.","heading":""},{"n":13,"text":"DC: Mr. Salinas, this has been really helpful. Thank you for meeting with me and sharing so much about your experiences. I’d like to be a photographer one day myself. Your comments were inspiring.","heading":""},{"n":14,"text":"ES: I wish you the best of luck, Dante. From what I’ve seen, you have the motivation and ability to succeed at just about anything you put your mind to.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14}],"kind":""},{"id":"P036","page":"P036","title":"The World of Ansel Adams","exercisePage":"P037","pdfPage":40,"pdfExercisePage":41,"lead":"How did Ansel Adams become one of the most well-known nature photographers?","paragraphs":[{"n":1,"text":"The name Ansel Adams may not ring a bell with you, but there is a good chance that you would recognize his photographs. Adams’s work includes some of the most beautiful and famous black-and-white nature photographs ever taken.","heading":""},{"n":2,"text":"Ansel Adams was born in 1902 near San Francisco, California. Adams’s interest in photography began on a trip to Yosemite National Park when he was 14 years old. His parents had given him a camera as a gift. Adams found that he was mesmerized by the scenery at Yosemite and fascinated by his ability to capture it on film.","heading":""},{"n":3,"text":"Although Adams had already shown much promise as a pianist, photography became a hobby that was just as fulfilling for him. It turned out that his talent for photography was perhaps even greater than that for music.","heading":""},{"n":4,"text":"The photographs for which Adams is best known are those that depict the beauty of wild areas. Many of his photos were taken in Yosemite National Park, the site of his first experience with a camera. Others captured images of wild places in the American West, as well as the California coast, near the area where Adams was raised.","heading":""},{"n":5,"text":"One of the things that makes Adams’s work so distinctive is the contrast that is present in so many of his photographs. Although Adams worked in black and white, there is an amazing amount of variety in tone. The darker shades are deep and rich, while the whites are crisp and bright.","heading":""},{"n":6,"text":"Adams was able to achieve this through a system he developed called zone exposure. He divided the light in an image into ten different zones. This allowed him to accurately predict what the different shades of gray would look like in a photograph.","heading":""},{"n":7,"text":"Through his photographs and the time that he spent in nature, Adams became an avid environmentalist. He became involved with the Sierra Club, a conservation group. The photography he did for them brought publicity to many issues they believed were important. His photographs serve as a record of wild areas of the American West—such as Sequoia, Mount Rainier, and Glacier National Parks—before humans had done much to disturb them.","heading":""},{"n":8,"text":"Although his prints were often sold to collectors for large sums of money, Adams wanted to make sure that his photographs were available to everyone. Posters were created of several of his best-loved images. They are still available today, in addition to many books on Adams’s work and even calendars that feature his photography. Ansel Adams died in 1984, but his photographs will continue to bring the joy and wonder of the natural world to people for many years to come.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P038","page":"P038","title":"Photographing History","exercisePage":"P039","pdfPage":42,"pdfExercisePage":43,"lead":"Who was Margaret Bourke-White, and why was her work still so respected today?","paragraphs":[{"n":1,"text":"What do the following people and places have in common—the Indian leader Gandhi, the survivors of the World War II concentration camps, the Great Depression, the steel mills of Cleveland, Ohio, and the Arctic Circle? Margaret Bourke-White photographed them all during her career as a photojournalist. She was present for many monumental events of the 20th century, and she recorded them with courage and sensitivity.","heading":""},{"n":2,"text":"Margaret Bourke-White was born in New York in 1904. In college, she studied biology and planned to be a herpetologist, a scientist who studies reptiles and amphibians. Then, she took a class in photography and discovered a new passion.","heading":""},{"n":3,"text":"After graduating from college, Bourke-White headed to Cleveland, where she photographed the steel mills that were so prevalent in that city. In the 1920s, American industry was booming and the country was growing. Bourke-White documented much of this growth and the factories where it was taking place. Although the material she was covering was cold and industrial, Bourke-White managed to make the photographs of machinery and factories both artistic and beautiful.","heading":""},{"n":4,"text":"A publisher named Henry Luce was very impressed with Bourke-White's photographs of American industry and hired her to work at his magazine, Fortune. When he began a new magazine called LIFE in 1936, Bourke-White was one of Luce's first four photographers. In fact, her picture of a Montana dam was featured on the cover of the magazine's first issue.","heading":""},{"n":5,"text":"Bourke-White's work with LIFE magazine led her on adventures all across the globe. She was the first foreign photographer to be allowed to take pictures in the Soviet Union in 1930. She took photos of the German siege on Moscow in 1941. As the first female war correspondent of World War II, Bourke-White faced danger on a regular basis. This was at a time when it was still customary for women to work mostly in the home, taking care of a family and a household.","heading":""},{"n":6,"text":"One of Bourke-White's closest brushes with danger occurred when she was assigned to cover the U.S. armed forces at the start of the war. On her way to North Africa, the ship she was traveling in was struck by a torpedo and sank. Bourke-White survived the attack and went on to follow and photograph the action of the war. When the concentration camps were liberated several years later at the end of World War II, Bourke-White was there. With her camera, she captured some of the most disturbing and moving images ever recorded.","heading":""},{"n":7,"text":"As stressful and difficult as her work must have been, Margaret Bourke-White loved what she did. She was the eyes and ears of the world in places most Americans had never visited and never would. Although Bourke-White died at the relatively early age of 67, she had traveled the world and photographed much of what she saw. Her pictures are a permanent record of both her life and the world during the 20th century.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P040","page":"P040","title":"Reality Check","exercisePage":"P041","pdfPage":44,"pdfExercisePage":45,"lead":"What will Ari and his mom find out about owning an exotic pet?","paragraphs":[{"n":1,"text":"Through the kitchen’s glass doors, Ari could see his mom sitting on the back deck. The pale green baby blanket she was knitting was pooled at her side, and she held it up every once in a while to check on her progress.","heading":""},{"n":2,"text":"Ari slid open the door and pulled up a chair across from his mom. “Well, hi there,” said Mrs. Stein, smiling at Ari. “What have you been up to this afternoon?”","heading":""},{"n":3,"text":"Ari took a sip of his mom’s iced tea. “I was watching this amazing animal show,” he said. “It was about people who have all kinds of exotic pets. Did you know that you can buy Bengal tiger cubs and raise them yourself?” asked Ari excitedly.","heading":""},{"n":4,"text":"“I’m not sure that’s such a good idea,” said Mrs. Stein, her knitting needles clicking along busily. “Tigers are beautiful, wild creatures,” she added. “I hate to see people trying to domesticate animals that are meant to live in the wild.”","heading":""},{"n":5,"text":"Ari nodded. “A tiger would be a lot of responsibility. It would be almost impossible to give it the space it would need to feel free.","heading":""},{"n":6,"text":"“There are other exotic animals that wouldn’t be so dangerous or need a lot of space, though,” said Ari. “I wrote down a few websites where we could find some more information. Could we go look at them?” Ari looked hopefully at his mother.","heading":""},{"n":7,"text":"Mrs. Stein sighed and grinned at Ari. “Let me finish this row, and I’ll come inside and take a look at the sites with you. I’m not promising anything, though.”","heading":""},{"n":8,"text":"A few minutes later, Ari and his mom sat side by side in the glow of the computer screen. They saw pictures of miniature foxes with enormous ears, bristly hedgehogs, and boa constrictors. They read advertisements for lion cubs, piranhas, and warthogs.","heading":""},{"n":9,"text":"Then, they found a website that discussed some of the problems with importing exotic pets. “They didn’t talk about any of this on the show I watched,” said Ari, looking confused. “I had no idea that there were so many abandoned or mistreated exotic pets in this country.”","heading":""},{"n":10,"text":"Ari’s mom shook her head. “I didn’t know either,” she said. “It sounds like the show you saw only presented one side of the story. That’s too bad, isn’t it? I’m sure lots of people see advertisements or shows like the one you saw and don’t really know what they are getting into.”","heading":""},{"n":11,"text":"Ari looked thoughtful, “Mom, do you think I could write a letter to the show I watched? Now that we’ve done some more research, I’ve changed my mind about owning an exotic pet. They should have explained both sides of the story.”","heading":""},{"n":12,"text":"Mrs. Stein patted Ari on the shoulder. “That’s a wonderful idea,” she said. “You’ve made a really mature decision. Someone that responsible could probably handle taking care of a dog or a cat. Do you want to check out a few of the local animal shelters while we’re online?”","heading":""},{"n":13,"text":"Ari couldn’t think of what to say. He hugged his mom hard and turned back to the computer to begin searching for a cat or a dog that needed a good home.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13}],"kind":""},{"id":"P042","page":"P042","title":"An Exotic Dilemma","exercisePage":"P043","pdfPage":46,"pdfExercisePage":47,"lead":"Learn how exotic pets are turning up in unexpected places in Florida.","paragraphs":[{"n":1,"text":"Would you know what to do if you saw a python slithering across your backyard? What about an anteater looking for dinner in your bushes or a seven-foot-long African monitor lizard running across your patio? People who live in most areas of the United States do not have encounters like these. But if you happened to live in southern Florida, there is a chance that you could run into a number of nonnative species that have settled in your hometown.","heading":""},{"n":2,"text":"Exotic pets have become more and more popular in recent years. People often purchase an animal as a baby without realizing how difficult it may be to care for that animal when it is fully-grown.","heading":""},{"n":3,"text":"For example, Burmese pythons are easy to buy at exotic pet stores or online. When the snake is young, it does not require much more work than any other pet reptile. But Burmese pythons can grow to be more than 20 feet long and can weigh about 250 pounds. There is not much space in the average American home or yard to care for such a creature! When the snake outgrows its cage and its owner tires of caring for and feeding such a large animal, the snake may be abandoned in a wild area.","heading":""},{"n":4,"text":"In other parts of the country, it is likely that many of these exotic creatures would not be able to survive long in the wild. But the climate in southern Florida is wet and warm—not unlike the tropical areas where many of the animals are naturally found. Not only can many exotic pets adjust to living in Florida’s natural areas, but if enough of them are released, they can start breeding.","heading":""},{"n":5,"text":"The problem with invasive species is that scientists don’t always know in advance which ones will alter the environment or harm native populations. In the last few years, people visiting Florida’s Everglades National Park have watched fights between alligators and pythons.","heading":""},{"n":6,"text":"It is not hard to imagine the impact of aggressive creatures. But even animals like vervet monkeys or Cuban tree frogs, which seem harmless, can change the delicate balance of the environment. They may compete with other animals that eat the same plants or insects. If their presence or behavior causes a change in the habits of other animals, the overall changes could be far-reaching.","heading":""},{"n":7,"text":"Think about dominos lined up next to one another. None of them may be touching, but as soon as you tip one over, the whole row will tumble. This is not unlike the way plants and animals in the environment react to one another. One small change can set off a whole series of changes that not even scientists can predict.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P044","page":"P044","title":"The Everlasting Beauty of the Everglades","exercisePage":"P045","pdfPage":48,"pdfExercisePage":49,"lead":"Why is the Everglades considered to be such a unique area of the country?","paragraphs":[{"n":1,"text":"The Florida Everglades is one of the most diverse areas of the country. Within the Everglades you can find swamps, marshes, grasslands, and dense forests. Hundreds of species of plants and animals make their homes in the Everglades. Some are found in few other places in the world. About 1.5 million acres of the Everglades are National Park land. Within the park, there are more than 350 species of birds, 40 species of mammals, and 50 species of reptiles!","heading":""},{"n":2,"text":"Scientists believe that the Everglades formed about eight to ten thousand years ago at the end of the last ice age. When the glaciers began to melt, they caused the sea level to rise and turned the low-lying area of the Everglades into swampland. When nearby Lake Okeechobee floods after heavy rains, the water level in the Everglades rises as well.","heading":""},{"n":3,"text":"The weather is characterized by hot, wet summers and warm but dry winters. The temperature in the Everglades rarely drops below 60 degrees, and the average rainfall is often more than 50 inches per year. This wet, mild weather is the primary reason that plant and animal life is so abundant there.","heading":""},{"n":4,"text":"As prevalent as living creatures appear to be in this lush landscape, the ecosystem of the Everglades must maintain its delicate balance. During the 20th century, canals were built which lowered the level of Lake Okeechobee. The lake overflowed much less frequently, which affected the water levels in the Everglades.","heading":""},{"n":5,"text":"People also began looking for ways to farm the land surrounding the Everglades. This required using much of the Everglades’ water supply. In addition, the pollution from fertilizers and pesticides used in farming began to run off into the water.","heading":""},{"n":6,"text":"New types of flora were introduced, which also affected the balance of the ecosystem. The tiny seeds of the melaleuca tree were sprinkled from salt shakers into the Everglades from low-flying airplanes because melaleuca trees consume a great deal of water. People hoped that the trees would dry up the land and make the E
