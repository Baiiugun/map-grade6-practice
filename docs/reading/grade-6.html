,"paragraph":7,"quote":"Instead, he begins with just a seed of an idea—maybe a character trait or a funny event.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P118","paragraph":7,"quote":"Those ideas branch out into other ideas, and before he knows it, a new book is well on its way.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P120-E1-01","page":"P120","skill":"E1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P120","exercisePage":"P121","section":"Reading / Questions","originalNumber":1,"originalStem":"Check the phrase that best describes the author’s purpose. - ____ to instruct - ____ to entertain - ____ to inform","kind":"adapted"},"stem":"What is the main purpose of this selection?","options":[{"id":"A","text":"To persuade readers to stop reading books","why":""},{"id":"B","text":"To list the winners of a writing award.","why":""},{"id":"C","text":"To tell a fictional story about a shipwreck","why":""},{"id":"D","text":"To give aspiring writers practical advice","why":"各节以 Read、Keep、Write、Join 等建议开头，并解释如何实践，目的是指导有志写作的人。"}],"answer":"D","explanation":"各节以 Read、Keep、Write、Join 等建议开头，并解释如何实践，目的是指导有志写作的人。","evidence":[{"page":"P120","paragraph":1,"quote":"Read everything you can.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P120","paragraph":2,"quote":"Keep a notebook.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P120","paragraph":3,"quote":"Write every day.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P120-D1-01","page":"P120","skill":"D1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P120","exercisePage":"P121","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How does the numbered format help the reader?","options":[{"id":"A","text":"It ranks six fictional characters by age.","why":""},{"id":"B","text":"It gives the dates of six historical events.","why":""},{"id":"C","text":"It shows that every writer must follow a minute-by-minute schedule.","why":""},{"id":"D","text":"It separates major recommendations so they are easy to find and review.","why":"六个编号对应不同建议，标题概括各节重点；编号起导航和分组作用，不等同于严格的先后操作顺序。"}],"answer":"D","explanation":"六个编号对应不同建议，标题概括各节重点；编号起导航和分组作用，不等同于严格的先后操作顺序。","evidence":[{"page":"P120","paragraph":1,"quote":"Read everything you can.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P120","paragraph":4,"quote":"Join or start a writing group.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P120","paragraph":6,"quote":"Stay positive.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P120-B5-01","page":"P120","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P120","exercisePage":"P121","section":"Reading / Questions","originalNumber":3,"originalStem":"What does the author mean by “Do your homework”? ________________________________________ ________________________________________","kind":"adapted"},"stem":"A writer wants to send a story to a magazine. Which action follows the passage’s advice?","options":[{"id":"A","text":"Read previous issues and follow that magazine’s submission guidelines.","why":"第5项要求研究刊物内容是否适合，第5项后面的补充说明要求遵守格式。应同时满足内容匹配与投稿规范。"},{"id":"B","text":"Copy an existing article word for word.","why":""},{"id":"C","text":"Send the story without checking anything about the magazine.","why":""},{"id":"D","text":"Ignore the magazine’s interests and requested format.","why":""}],"answer":"A","explanation":"第5项要求研究刊物内容是否适合，第5项后面的补充说明要求遵守格式。应同时满足内容匹配与投稿规范。","evidence":[{"page":"P120","paragraph":5,"quote":"If you are sending your writing to a magazine, look through old issues.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P120","paragraph":"u2","quote":"Also make sure that you pay attention to the guidelines.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P122-F4-01","page":"P122","skill":"F4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P122","exercisePage":"P123","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How does the narrative point of view change?","options":[{"id":"A","text":"The first seven paragraphs use first person; the last shifts to third person about Tyler.","why":"前七段反复使用 I、my 讲述岛上经历；最后改用 Tyler、he 从外部叙述醒来的动作。"},{"id":"B","text":"The whole selection is told by Tyler’s teacher using “we.”","why":""},{"id":"C","text":"The first part is third person and the last becomes a ship’s diary.","why":""},{"id":"D","text":"There is no narrator in either part.","why":""}],"answer":"A","explanation":"前七段反复使用 I、my 讲述岛上经历；最后改用 Tyler、he 从外部叙述醒来的动作。","evidence":[{"page":"P122","paragraph":1,"quote":"When I woke up, my mouth was full of sand and the sun was glaring angrily at me from high in the cloudless sky.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P122","paragraph":8,"quote":"Tyler lay on his bed with his eyes open for a moment before he could identify the sound.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P122-D1-01","page":"P122","skill":"D1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P122","exercisePage":"P123","section":"Reading / Questions","originalNumber":9,"originalStem":"Why is most of this selection in italics? ________________________________________","kind":"adapted"},"stem":"What does the final paragraph reveal about the island adventure?","options":[{"id":"A","text":"It was a dream influenced by the book Tyler had been reading.","why":"垃圾车的轰鸣接上梦中的雷声，随后写 Tyler 醒来、床上的书掉下。这一转折让读者重新理解前面的叙述。"},{"id":"B","text":"The ship’s captain has moved into Tyler’s classroom.","why":""},{"id":"C","text":"The whole story is a factual rescue report written at sea.","why":""},{"id":"D","text":"Tyler has actually lived alone on the island for twenty-eight years.","why":""}],"answer":"A","explanation":"垃圾车的轰鸣接上梦中的雷声，随后写 Tyler 醒来、床上的书掉下。这一转折让读者重新理解前面的叙述。","evidence":[{"page":"P122","paragraph":7,"quote":"I raced after it as the first sounds of thunder rumbled around me.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P122","paragraph":8,"quote":"The garbage truck growled and rumbled as it chugged down the street.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P122","paragraph":8,"quote":"The bearded face of Robinson Crusoe stared up at Tyler from the cover of the book as he fumbled for his glasses.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P122-F6-01","page":"P122","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P122","exercisePage":"P123","section":"Reading / Questions","originalNumber":3,"originalStem":"Personification is a literary device in which human characteristics are given to inanimate objects. In the sentence Sam’s bed beckoned to him invitingly, Sam’s bed is personified. Find an example of personification in the story, and write it on the line below. ________________________________________","kind":"adapted"},"stem":"Which phrase is an example of personification?","options":[{"id":"A","text":"Tyler glanced at his bedside clock.","why":""},{"id":"B","text":"The sun was glaring angrily at me.","why":"把人会有的“愤怒瞪视”赋予太阳，是拟人，强化了主人公被烈日逼迫的不适感。"},{"id":"C","text":"My mouth was full of sand.","why":""},{"id":"D","text":"I found a canvas bag.","why":""}],"answer":"B","explanation":"把人会有的“愤怒瞪视”赋予太阳，是拟人，强化了主人公被烈日逼迫的不适感。","evidence":[{"page":"P122","paragraph":1,"quote":"When I woke up, my mouth was full of sand and the sun was glaring angrily at me from high in the cloudless sky.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P124-B2-01","page":"P124","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P124","exercisePage":"P125","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How did Selkirk reduce his problem with rats?","options":[{"id":"A","text":"He planted vegetables only on the beach.","why":""},{"id":"B","text":"He used meat to encourage cats to stay nearby.","why":"第7段先提出夜间被老鼠啃咬的问题，再说用肉吸引猫留在附近，以控制鼠群，构成问题—解决关系。"},{"id":"C","text":"He stopped building shelters.","why":""},{"id":"D","text":"He asked the ship’s crew to return every night.","why":""}],"answer":"B","explanation":"第7段先提出夜间被老鼠啃咬的问题，再说用肉吸引猫留在附近，以控制鼠群，构成问题—解决关系。","evidence":[{"page":"P124","paragraph":7,"quote":"At first, Selkirk had a serious problem with the island’s rats, which gnawed at him at night while he slept.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P124","paragraph":7,"quote":"Selkirk found that he could easily control the rat population by using meat to entice the cats to remain nearby.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P124-F3-01","page":"P124","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P124","exercisePage":"P125","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How did Selkirk feel after returning to society?","options":[{"id":"A","text":"He had never learned to live alone at all.","why":""},{"id":"B","text":"He had difficulty adjusting and still missed the island’s peace.","why":"第9段既写重新适应人群和语言的困难，又写始终有部分内心怀念岛上宁静，体现复杂感受。"},{"id":"C","text":"He wanted to return because there was no food in society.","why":""},{"id":"D","text":"He instantly forgot every part of island life.","why":""}],"answer":"B","explanation":"第9段既写重新适应人群和语言的困难，又写始终有部分内心怀念岛上宁静，体现复杂感受。","evidence":[{"page":"P124","paragraph":9,"quote":"When he was finally rescued by a ship called the Duke, Selkirk found that it was difficult to adjust to being around people again and that he had lost some of his language skills.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P124","paragraph":9,"quote":"He became accustomed to living in society again, but a part of him always missed the peace of the island.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P124-B1-01","page":"P124","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P124","exercisePage":"P125","section":"Reading / Questions","originalNumber":3,"originalStem":"How do we know so many details about Selkirk’s experiences on the island? ______________________________________________________________________ ______________________________________________________________________","kind":"adapted"},"stem":"Which source does the passage identify as an account of Selkirk’s experiences?","options":[{"id":"A","text":"A collection of poems written before Selkirk was born","why":""},{"id":"B","text":"A television interview with Robinson Crusoe.","why":""},{"id":"C","text":"A Cruising Voyage Round the World by Woodes Rogers, captain of the rescue ship","why":"第10段给出作者、书名及其与救援船的关系，让读者知道文中经历记载的来源。Robinson Crusoe 是受启发的虚构故事。"},{"id":"D","text":"A gardening manual by Selkirk’s neighbor","why":""}],"answer":"C","explanation":"第10段给出作者、书名及其与救援船的关系，让读者知道文中经历记载的来源。Robinson Crusoe 是受启发的虚构故事。","evidence":[{"page":"P124","paragraph":10,"quote":"In 1712, Woodes Rogers, captain of the Duke, published A Cruising Voyage Round the World, which included an account of Alexander Selkirk’s experiences in the Juan Fernández Islands.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P124","paragraph":10,"quote":"In 1712, Woodes Rogers, captain of the Duke, published A Cruising Voyage Round the World, which included an account of Alexander Selkirk’s experiences in the Juan Fernández Islands.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P126-F3-01","page":"P126","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P126","exercisePage":"P127","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How do Chiara and her mother feel by the end?","options":[{"id":"A","text":"Ready to move back before buying any plants.","why":""},{"id":"B","text":"Excited by the possibility of creating a colorful desert garden","why":"起初想念原来的绿意、怀疑新地方能种什么；听到本地植物选择后，她们笑着装车并期待开始，说明态度转为积极。"},{"id":"C","text":"Certain that no plants can grow in Arizona","why":""},{"id":"D","text":"Angry that Joseph refuses to help","why":""}],"answer":"B","explanation":"起初想念原来的绿意、怀疑新地方能种什么；听到本地植物选择后，她们笑着装车并期待开始，说明态度转为积极。","evidence":[{"page":"P126","paragraph":4,"quote":"“It doesn’t look like we could grow much here, does it?”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P126","paragraph":12,"quote":"“I don’t think we had any idea what a lush, colorful garden we could have in the desert!”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P126","paragraph":13,"quote":"“I can’t wait to begin,” said Chiara, already loading plants into the cart.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P126-B2-01","page":"P126","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P126","exercisePage":"P127","section":"Reading / Questions","originalNumber":8,"originalStem":"Why does Joseph recommend that Chiara and her mom plant native plants? ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"Why does Joseph recommend native plants?","options":[{"id":"A","text":"They can grow only in Massachusetts.","why":""},{"id":"B","text":"They are the only plants whose flowers have any color.","why":""},{"id":"C","text":"They suit the local climate and need less extra watering.","why":"第9段说明本地植物能适应该气候，因此不用花大量时间浇灌不适合此地的植物。"},{"id":"D","text":"They must always be kept indoors without sunlight.","why":""}],"answer":"C","explanation":"第9段说明本地植物能适应该气候，因此不用花大量时间浇灌不适合此地的植物。","evidence":[{"page":"P126","paragraph":9,"quote":"They thrive in this climate for a reason, and you won’t have to spend all your time watering plants that were meant to live somewhere else.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P126-F6-01","page":"P126","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P126","exercisePage":"P127","section":"Reading / Questions","originalNumber":5,"originalStem":"What does Mrs. Giardini mean when she says, “Arizona and Massachusetts could be different planets”? ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"What does “Arizona and Massachusetts could be different planets” emphasize?","options":[{"id":"A","text":"Both states have exactly the same weather.","why":""},{"id":"B","text":"Arizona has no connection to Earth’s natural processes.","why":""},{"id":"C","text":"The landscapes feel dramatically different to Mrs. Giardini.","why":"这是夸张比较，用“不同星球”放大环境差异，表达刚搬来时的不熟悉感，不是天文事实。"},{"id":"D","text":"The family has literally traveled to another planet.","why":""}],"answer":"C","explanation":"这是夸张比较，用“不同星球”放大环境差异，表达刚搬来时的不熟悉感，不是天文事实。","evidence":[{"page":"P126","paragraph":3,"quote":"Arizona and Massachusetts could be different planets, as far as the landscape is concerned.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P126","paragraph":3,"quote":"Arizona and Massachusetts could be different planets, as far as the landscape is concerned.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P128-A1-01","page":"P128","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P128","exercisePage":"P129","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which statement best summarizes the passage’s main idea?","options":[{"id":"A","text":"All deserts are hot sandy places with no variation.","why":""},{"id":"B","text":"The passage is mainly a biography of Marco Polo.","why":""},{"id":"C","text":"Deserts are dry environments with varied temperatures, surfaces, and landscapes.","why":"全文先界定干燥特点，再写冷热、沙地与石地以及不同沙漠实例，强调沙漠的共同点与多样性。"},{"id":"D","text":"Every desert receives heavy rain throughout the year.","why":""}],"answer":"C","explanation":"全文先界定干燥特点，再写冷热、沙地与石地以及不同沙漠实例，强调沙漠的共同点与多样性。","evidence":[{"page":"P128","paragraph":1,"quote":"Although lack of precipitation is the most obvious characteristic of desert regions—they receive less than ten inches per year—deserts also have high rates of evaporation.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P128","paragraph":3,"quote":"Some deserts are not hot, even during the day.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P128","paragraph":5,"quote":"However, only about 20 percent of Earth’s deserts are made of sand.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P128-B5-01","page":"P128","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P128","exercisePage":"P129","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"According to the passage, could a very cold region with little precipitation be a type of desert?","options":[{"id":"A","text":"Yes, but only if it receives daily heavy rain.","why":""},{"id":"B","text":"Yes; the passage describes frozen deserts called tundras.","why":"把“缺少降水”这一标准应用到冷地区，再用第3段的冻原实例核对。炎热并不是本文所说所有沙漠都必须具有的条件。"},{"id":"C","text":"No; only areas covered entirely in sand can qualify.","why":""},{"id":"D","text":"No; every desert must be hot all day and all year.","why":""}],"answer":"B","explanation":"把“缺少降水”这一标准应用到冷地区，再用第3段的冻原实例核对。炎热并不是本文所说所有沙漠都必须具有的条件。","evidence":[{"page":"P128","paragraph":1,"quote":"Although lack of precipitation is the most obvious characteristic of desert regions—they receive less than ten inches per year—deserts also have high rates of evaporation.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P128","paragraph":3,"quote":"Areas with low precipitation and high evaporation rates located in the extreme Northern Hemisphere are called tundras, a type of frozen desert.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P128-F6-01","page":"P128","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P128","exercisePage":"P129","section":"Reading / Questions","originalNumber":8,"originalStem":"Why do some people compare sand dunes to ocean waves? ________________________________________ ________________________________________","kind":"adapted"},"stem":"Why are sand dunes compared with ocean waves?","options":[{"id":"A","text":"Their curved forms resemble waves, and wind continually reshapes them.","why":"第4段从外形比喻为凝固波浪，第5段又说明风使其不断改变形状；类比包括形状和变化，并非物质相同。"},{"id":"B","text":"Desert dunes are made of saltwater.","why":""},{"id":"C","text":"Every dune remains fixed forever.","why":""},{"id":"D","text":"The ocean is the only place where wind occurs.","why":""}],"answer":"A","explanation":"第4段从外形比喻为凝固波浪，第5段又说明风使其不断改变形状；类比包括形状和变化，并非物质相同。","evidence":[{"page":"P128","paragraph":4,"quote":"Looking like giant, frozen ocean waves, sand dunes reach up to meet the brilliant blue sky.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P128","paragraph":5,"quote":"The sand gets pushed around, just like water in the sea, and shifted and shaped into constantly changing wave-like forms.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P130-A3-01","page":"P130","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P130","exercisePage":"P131","section":"Reading / Questions","originalNumber":5,"originalStem":"On the lines below, write the main idea of paragraph 6. ____________________________________________________________ ____________________________________________________________","kind":"adapted"},"stem":"Which sentence best summarizes paragraph 6?","options":[{"id":"A","text":"The unusual phone calls helped strangers feel connected across long distances.","why":"第6段先讲陌生人交流身份、地点和如何听说电话亭，再概括它像互联网一样使世界显得更小。"},{"id":"B","text":"The Internet made it impossible for strangers to talk.","why":""},{"id":"C","text":"The paragraph explains how to repair a damaged phone line.","why":""},{"id":"D","text":"Every caller discussed only the price of mining equipment.","why":""}],"answer":"A","explanation":"第6段先讲陌生人交流身份、地点和如何听说电话亭，再概括它像互联网一样使世界显得更小。","evidence":[{"page":"P130","paragraph":6,"quote":"They usually identified themselves and discussed where they were calling from and how they had heard about the phone booth.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P130","paragraph":6,"quote":"One thing people love about the Internet is how it seems to make the world feel smaller.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P130-B2-01","page":"P130","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P130","exercisePage":"P131","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Why did officials decide to remove the phone booth?","options":[{"id":"A","text":"They believed no person had ever used it.","why":""},{"id":"B","text":"The miners asked to replace every road with a river.","why":""},{"id":"C","text":"They worried that increased visitor traffic could damage the desert environment.","why":"第7段把宣传、访客增多、潜在环境损害与保护土地的责任联系起来，说明移除原因。"},{"id":"D","text":"They needed to move the booth onto a spacecraft.","why":""}],"answer":"C","explanation":"第7段把宣传、访客增多、潜在环境损害与保护土地的责任联系起来，说明移除原因。","evidence":[{"page":"P130","paragraph":7,"quote":"The National Park Service felt that the area was receiving too much traffic as a result of all the publicity surrounding the booth.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P130","paragraph":7,"quote":"They were worried that it might somehow damage the environment, and they felt that it was their responsibility to protect the land of the Mojave Desert National Preserve.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P130-D1-01","page":"P130","skill":"D1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P130","exercisePage":"P131","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How does the passage mainly trace the phone booth’s story?","options":[{"id":"A","text":"By ranking deserts according to their size.","why":""},{"id":"B","text":"From its practical origin, through unexpected fame, to its removal","why":"开头交代为矿工安装，接着 Daniels 和网络带来关注，末尾是移除和余波，主要按事件发展组织。"},{"id":"C","text":"As a set of directions for installing a phone booth","why":""},{"id":"D","text":"From the removal backward to the invention of all telephones","why":""}],"answer":"B","explanation":"开头交代为矿工安装，接着 Daniels 和网络带来关注，末尾是移除和余波，主要按事件发展组织。","evidence":[{"page":"P130","paragraph":1,"quote":"It seems like an odd location for a phone booth, but there are two mines in the area, and the phone was originally installed for use by the miners and their families.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P130","paragraph":4,"quote":"He posted the phone's number on the Internet, and people began calling it.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P130","paragraph":7,"quote":"In May of 2000, the National Park Service and Pacific-Bell, the owner of the phone booth, made the decision to remove the booth.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P132-F2-01","page":"P132","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P132","exercisePage":"P133","section":"Reading / Questions","originalNumber":6,"originalStem":"How is Aunt Suki related to Emi and Ken’s mother? ________________________________________________________________________ ________________________________________________________________________","kind":"adapted"},"stem":"How is Aunt Suki related to the children’s mother?","options":[{"id":"A","text":"She is their mother’s daughter.","why":""},{"id":"B","text":"She has never met their mother.","why":""},{"id":"C","text":"She is their mother’s sister.","why":"第8段说两人小时候假装是双胞胎，第10段说一起在日本长大，结合 Aunt 与 your mother 的表达可确认是姐妹。"},{"id":"D","text":"She is their mother’s teacher.","why":""}],"answer":"C","explanation":"第8段说两人小时候假装是双胞胎，第10段说一起在日本长大，结合 Aunt 与 your mother 的表达可确认是姐妹。","evidence":[{"page":"P132","paragraph":8,"quote":"“Your mother’s dimple is in her left cheek, and mine is in my right cheek.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P132","paragraph":8,"quote":"When we were little, we used to pretend it meant that we were twins.”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P132","paragraph":10,"quote":"“Even though we grew up in Japan, I didn’t learn origami until I moved to the United States.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P132-F6-01","page":"P132","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P132","exercisePage":"P133","section":"Reading / Questions","originalNumber":13,"originalStem":"How are counting and origami similar? ________________________________________________________________________ ________________________________________________________________________","kind":"adapted"},"stem":"Why does Aunt Suki compare origami with counting?","options":[{"id":"A","text":"Both are impossible without a computer.","why":""},{"id":"B","text":"Both can be simple once learned but still require concentration.","why":"她不是说两个活动结果相同，而是拿熟悉的数数说明折纸中“掌握后不复杂、仍需集中注意”的特点。"},{"id":"C","text":"Both always require scissors and glue.","why":""},{"id":"D","text":"Both produce the same kind of paper animal.","why":""}],"answer":"B","explanation":"她不是说两个活动结果相同，而是拿熟悉的数数说明折纸中“掌握后不复杂、仍需集中注意”的特点。","evidence":[{"page":"P132","paragraph":5,"quote":"You must concentrate when you do origami, but it doesn’t require a great deal of thought.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P132","paragraph":6,"quote":"But when you are counting a large number of things, you must concentrate or you will lose your place.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P132-B3-01","page":"P132","skill":"B3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P132","exercisePage":"P133","section":"Reading / Questions","originalNumber":8,"originalStem":"What does Emi mean when she says they’ll pass the tradition “up instead of down”? ________________________________________________________________________ ________________________________________________________________________","kind":"adapted"},"stem":"What does Emi mean by passing the tradition “up instead of down”?","options":[{"id":"A","text":"The children will help teach the older generation.","why":"通常传统从长辈传给晚辈；Emi 提议自己先学，再帮教妈妈，所以“向上”指晚辈也能反过来传授。"},{"id":"B","text":"Aunt Suki will stop doing origami forever.","why":""},{"id":"C","text":"The tradition will be kept secret from their mother.","why":""},{"id":"D","text":"The family will fold paper only upstairs.","why":""}],"answer":"A","explanation":"通常传统从长辈传给晚辈；Emi 提议自己先学，再帮教妈妈，所以“向上”指晚辈也能反过来传授。","evidence":[{"page":"P132","paragraph":15,"quote":"“You can teach us first,” suggested Emi, “and we’ll help you teach Mom.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P132","paragraph":15,"quote":"We’ll be passing the tradition up instead of down.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P134-A1-01","page":"P134","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P134","exercisePage":"P135","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which statement best expresses the passage’s main idea?","options":[{"id":"A","text":"The passage is mainly a biography of a television actor.","why":""},{"id":"B","text":"Origami is simply cutting paper into identical strips.","why":""},{"id":"C","text":"Origami is a paper-folding art with a cultural history, basic techniques, and creative possibilities.","why":"全文涵盖定义、起源讨论、材料、基础折法、图示与创作，中心思想应覆盖这门艺术而非单一作品。"},{"id":"D","text":"Every origami object can be made without learning any folds.","why":""}],"answer":"C","explanation":"全文涵盖定义、起源讨论、材料、基础折法、图示与创作，中心思想应覆盖这门艺术而非单一作品。","evidence":[{"page":"P134","paragraph":2,"quote":"Origami is the art of folding paper into three-dimensional figures of people, animals, and objects.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P134","paragraph":5,"quote":"Beginners are often taught several folds and bases which are the starting shapes for other, more complicated figures.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P134","paragraph":7,"quote":"Others view it as an art form and a means of creative expression.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P134-E2-01","page":"P134","skill":"E2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P134","exercisePage":"P135","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What distinction does the author make about origami’s history?","options":[{"id":"A","text":"All historians agree it was invented by Yoshizawa in the 1950s.","why":""},{"id":"B","text":"The author claims that no one has ever studied its origin.","why":""},{"id":"C","text":"Its exact origin is disputed, but its development in Japan is clear.","why":"第2段分别用 Some historians、Others、What we do know 区分有争议的起源与较确定的发展事实。"},{"id":"D","text":"There is no evidence that anyone in Japan practiced origami.","why":""}],"answer":"C","explanation":"第2段分别用 Some historians、Others、What we do know 区分有争议的起源与较确定的发展事实。","evidence":[{"page":"P134","paragraph":2,"quote":"The origin of origami itself, however, is unclear.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P134","paragraph":2,"quote":"What we do know is that origami was clearly developed in Japan, where it is considered a part of the culture and lifestyle of the people.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P134-A3-01","page":"P134","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P134","exercisePage":"P135","section":"Reading / Questions","originalNumber":10,"originalStem":"Check the sentence below that is the best summary for paragraph 6. - ____ Yoshizawa published origami books during the 1950s. - ____ Origami diagrams are important because they allow people to share their designs for particular figures. - ____ Diagrams show the folds needed to make origami figures.","kind":"adapted"},"stem":"Which sentence best summarizes paragraph 6?","options":[{"id":"A","text":"Every origami design was created by Yoshizawa.","why":""},{"id":"B","text":"Diagrams are used only to measure the weight of paper.","why":""},{"id":"C","text":"Origami diagrams and symbols help people share and recreate designs.","why":"该段主旨是图示如何记录折法、帮助别人再现作品；Yoshizawa 的出版与符号是支持这一点的实例。"},{"id":"D","text":"Paper folding became impossible after the 1950s.","why":""}],"answer":"C","explanation":"该段主旨是图示如何记录折法、帮助别人再现作品；Yoshizawa 的出版与符号是支持这一点的实例。","evidence":[{"page":"P134","paragraph":6,"quote":"Diagrams are important to people who take origami seriously because they show the folds needed to make a particular figure.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P134","paragraph":6,"quote":"He also created a set of diagram symbols that could be used when someone wanted to share with others a figure he or she had created.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P136-B2-01","page":"P136","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P136","exercisePage":"P137","section":"Reading / Questions","originalNumber":4,"originalStem":"Name two reasons that Grandpa prefers audio books to Braille books. ________________________________________________________________ ________________________________________________________________","kind":"adapted"},"stem":"Why does Grandpa prefer audio books?","options":[{"id":"A","text":"He wants to avoid all stories and news.","why":""},{"id":"B","text":"He has never heard of Braille.","why":""},{"id":"C","text":"Audio books require him to see every printed word.","why":""},{"id":"D","text":"Braille books can be bulky, and he enjoys the readers’ varied voices.","why":"第12段交代盲文书体积大、使用不便，第13段补充有声书朗读者的多样声音；需合并两个原因。"}],"answer":"D","explanation":"第12段交代盲文书体积大、使用不便，第13段补充有声书朗读者的多样声音；需合并两个原因。","evidence":[{"page":"P136","paragraph":12,"quote":"Books in Braille can be very large and awkward to use because spelling out words in Braille takes up more space than using the Roman alphabet.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P136","paragraph":13,"quote":"The range of voices a single reader can do is quite impressive.\"","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P136-F3-01","page":"P136","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P136","exercisePage":"P137","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What motivates Carson to hug Grandpa near the end?","options":[{"id":"A","text":"He is angry that Grandpa used the computer.","why":""},{"id":"B","text":"He is frightened by the breakfast food.","why":""},{"id":"C","text":"He wants Grandpa to stop reading entirely.","why":""},{"id":"D","text":"He feels affection and admiration for how Grandpa has adapted.","why":"紧接拥抱后的话“高兴你在这里”“适应得很好”直接解释了亲近和钦佩的情绪。"}],"answer":"D","explanation":"紧接拥抱后的话“高兴你在这里”“适应得很好”直接解释了亲近和钦佩的情绪。","evidence":[{"page":"P136","paragraph":13,"quote":"He looked surprised when Carson grabbed him in a bear hug.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P136","paragraph":14,"quote":"\"And I'm glad that you've adjusted to the changes in your eyesight so well.\"","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P136-C5-01","page":"P136","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P136","exercisePage":"P137","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What does having the keys “committed to memory” mean?","options":[{"id":"A","text":"Having replaced every key with a speaker","why":""},{"id":"B","text":"Having memorized their positions","why":"上文问看不见怎样打字，他回答有60年经验，说明键位已记熟。commit to memory 是“记住、熟记”。"},{"id":"C","text":"Having forgotten how the keyboard works.","why":""},{"id":"D","text":"Having written their names on a paper receipt","why":""}],"answer":"B","explanation":"上文问看不见怎样打字，他回答有60年经验，说明键位已记熟。commit to memory 是“记住、熟记”。","evidence":[{"page":"P136","paragraph":10,"quote":"\"After 60 years of typing, I think I have the location of the keys committed to memory.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P136","paragraph":10,"quote":"\"After 60 years of typing, I think I have the location of the keys committed to memory.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P138-C2-01","page":"P138","skill":"C2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P138","exercisePage":"P139","section":"Reading / Questions","originalNumber":9,"originalStem":"Check the sentence in which pupil has the same meaning as it does in paragraph 3. - ____ The pupil determines how much light is allowed into the eye. - ____ The best pupil in the class received a perfect grade on her spelling test.","kind":"adapted"},"stem":"Which sentence uses “pupil” with the meaning found in paragraph 3?","options":[{"id":"A","text":"The new pupil joined the class on Monday.","why":""},{"id":"B","text":"The doctor checked how the pupil changed size in the light.","why":"本文 pupil 指眼睛中控制进光量的瞳孔；另外三个选项都指学生。"},{"id":"C","text":"The pupil handed her homework to the teacher.","why":""},{"id":"D","text":"Each pupil chose a library book.","why":""}],"answer":"B","explanation":"本文 pupil 指眼睛中控制进光量的瞳孔；另外三个选项都指学生。","evidence":[{"page":"P138","paragraph":3,"quote":"The black dot in the middle of your iris is an opening called the pupil, and it controls the amount of light entering the eye.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P138-B2-01","page":"P138","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P138","exercisePage":"P139","section":"Reading / Questions","originalNumber":6,"originalStem":"Name two ways in which cone-shaped cells and rod-shaped cells are different from one another. ________________________________________________ ________________________________________________","kind":"adapted"},"stem":"Which comparison of rods and cones matches the passage?","options":[{"id":"A","text":"Rods and cones are both described as parts of the iris.","why":""},{"id":"B","text":"Cones only produce black-and-white images; rods detect all colors.","why":""},{"id":"C","text":"Neither kind of cell responds to light.","why":""},{"id":"D","text":"Rods are more light-sensitive; cones support color vision.","why":"第6—7段对照两类细胞：cones 参与辨色，rods 对光更敏感、产生黑白图像。"}],"answer":"D","explanation":"第6—7段对照两类细胞：cones 参与辨色，rods 对光更敏感、产生黑白图像。","evidence":[{"page":"P138","paragraph":6,"quote":"Six million of them are cones, the cells that read color.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P138","paragraph":7,"quote":"These rod-shaped cells a :"supplement"},"stem":"What does “fleeting” mean in paragraph 2?","options":[{"id":"A","text":"Always visible in the same place","why":""},{"id":"B","text":"Too ordinary to attract attention.","why":""},{"id":"C","text":"Lasting only a short time","why":"彩虹要在恰当的天气条件下出现，常在阵雨结束时看到；beautiful but fleeting 强调美丽却短暂。"},{"id":"D","text":"Solid enough to hold in your hands","why":""}],"answer":"C","explanation":"彩虹要在恰当的天气条件下出现，常在阵雨结束时看到；beautiful but fleeting 强调美丽却短暂。","evidence":[{"page":"P144","paragraph":2,"quote":"Rainbows enchant and mystify people because they are beautiful but fleeting.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P144","paragraph":2,"quote":"Conditions must be exactly right in order for rainbows to form.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P144-B1-01","page":"P144","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P144","exercisePage":"P145","section":"Reading / Questions","originalNumber":7,"originalStem":"What materials do you need to create your own rainbow? ________________________________________","kind":"adapted"},"stem":"Which materials does the passage list for making a rainbow indoors?","options":[{"id":"A","text":"A camera, a telescope, and dry paper","why":""},{"id":"B","text":"Paint, glue, and a dark cloth.","why":""},{"id":"C","text":"A metal pot, sand, and a radio","why":""},{"id":"D","text":"A clear glass or jar of water, a small mirror, and a flashlight","why":"第7段的 You’ll just need 后集中列出材料，作答时应准确对应，不能凭日常印象增减。"}],"answer":"D","explanation":"第7段的 You’ll just need 后集中列出材料，作答时应准确对应，不能凭日常印象增减。","evidence":[{"page":"P144","paragraph":7,"quote":"You’ll just need a large, clear, circular glass or jar of water, a small mirror, and a flashlight.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P146-F3-01","page":"P146","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P146","exercisePage":"P147","section":"Reading / Questions","originalNumber":2,"originalStem":"Why does Will feel that researching his family’s history is important? ________________________________________________","kind":"adapted"},"stem":"Why does Will think his genealogy project matters?","options":[{"id":"A","text":"He plans to sell all the letters before reading them.","why":""},{"id":"B","text":"He wants to avoid learning anything about his relatives.","why":""},{"id":"C","text":"He wants to prove that family memories have no value.","why":""},{"id":"D","text":"He wants to preserve family history for future generations.","why":"Will 直接说不希望家族历史丢失，希望后代也能看到记录，这是他研究和访谈的核心动机。"}],"answer":"D","explanation":"Will 直接说不希望家族历史丢失，希望后代也能看到记录，这是他研究和访谈的核心动机。","evidence":[{"page":"P146","paragraph":6,"quote":"\"I don't want our family's history to get lost.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P146","paragraph":6,"quote":"If I record it, it will exist for our great-great-grandkids.\"","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P146-C1-01","page":"P146","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P146","exercisePage":"P147","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What does “genealogy” mean in this story?","options":[{"id":"A","text":"The design of modern computer games","why":""},{"id":"B","text":"The practice of repairing bicycles.","why":""},{"id":"C","text":"The study of family history and ancestry","why":"Calvin 提问后，Will 用 It’s the study of... 直接定义为研究家族历史和根源。"},{"id":"D","text":"The study of weather patterns","why":""}],"answer":"C","explanation":"Calvin 提问后，Will 用 It’s the study of... 直接定义为研究家族历史和根源。","evidence":[{"page":"P146","paragraph":6,"quote":"\"It's the study of your family's history and roots,\" explained Will.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P146-B4-01","page":"P146","skill":"B4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P146","exercisePage":"P147","section":"Reading / Questions","originalNumber":1,"originalStem":"Where did Will get the information for his research? ________________________________________________","kind":"adapted"},"stem":"Why are interviews with older relatives useful alongside Internet research?","options":[{"id":"A","text":"They can preserve memories that may not appear in online records.","why":"Will 区分网上的姓名、生卒资料与长辈记忆，并说有些事在别处找不到。这体现根据目的结合不同信息来源，而非认定一种来源绝对可靠。"},{"id":"B","text":"Relatives always know every official date without error.","why":""},{"id":"C","text":"Online records contain no names or birth information.","why":""},{"id":"D","text":"Interviews make it unnecessary to record any sources.","why":""}],"answer":"A","explanation":"Will 区分网上的姓名、生卒资料与长辈记忆，并说有些事在别处找不到。这体现根据目的结合不同信息来源，而非认定一种来源绝对可靠。","evidence":[{"page":"P146","paragraph":6,"quote":"The Internet has been pretty helpful in finding names, birth records, and obituaries.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P146","paragraph":6,"quote":"There are things that they remember that I wouldn't have been able to find anywhere else.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P148-A1-01","page":"P148","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P148","exercisePage":"P149","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which statement best states the main idea?","options":[{"id":"A","text":"The Sea Islands are important only because of new shopping malls.","why":""},{"id":"B","text":"The passage is mainly instructions for building a fishing boat.","why":""},{"id":"C","text":"Gullah refers only to the name of one island.","why":""},{"id":"D","text":"The Sea Islands preserve distinctive Gullah language and traditions, with efforts to pass them on.","why":"全文从文化和语言的形成写到篮编、渔网等传统，再谈保存与传承，中心思想应覆盖这些方面。"}],"answer":"D","explanation":"全文从文化和语言的形成写到篮编、渔网等传统，再谈保存与传承，中心思想应覆盖这些方面。","evidence":[{"page":"P148","paragraph":1,"quote":"But if you were to visit the islands, you would discover a unique culture and way of life that have been preserved for more than a century.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P148","paragraph":5,"quote":"They are doing their best to insure that the language is preserved for future generations.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P148","paragraph":6,"quote":"They have many traditions that are an important part of their culture.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P148-B2-01","page":"P148","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P148","exercisePage":"P149","section":"Reading / Questions","originalNumber":4,"originalStem":"What is one reason the African customs of the Gullah people remained unchanged for so long? ________________________________________ ________________________________________","kind":"adapted"},"stem":"Why did many African customs remain relatively unchanged on the Sea Islands?","options":[{"id":"A","text":"The islands’ isolation limited contact with mainstream culture.","why":"第3段明确写只能坐船到达，使居民相对隔离，因此保留了许多传统。"},{"id":"B","text":"Every family was required to speak only one European language.","why":""},{"id":"C","text":"The islands were located far inside a desert.","why":""},{"id":"D","text":"No one on the islands ever worked or traveled.","why":""}],"answer":"A","explanation":"第3段明确写只能坐船到达，使居民相对隔离，因此保留了许多传统。","evidence":[{"page":"P148","paragraph":3,"quote":"Because the islands were accessible only by boat, the people were isolated from mainstream culture.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P148","paragraph":3,"quote":"Because the islands were accessible only by boat, the people were isolated from mainstream culture.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P148-A3-01","page":"P148","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P148","exercisePage":"P149","section":"Reading / Questions","originalNumber":9,"originalStem":"On the lines below, write a summary for paragraph 5. ________________________________________ ________________________________________ ________________________________________","kind":"adapted"},"stem":"Which sentence best summarizes paragraph 5?","options":[{"id":"A","text":"The Gullah language has never faced any pressure to change.","why":""},{"id":"B","text":"The paragraph describes how to weave a basket from sweetgrass.","why":""},{"id":"C","text":"Dictionaries were created to replace every living speaker.","why":""},{"id":"D","text":"Although Gullah seemed at risk of disappearing, people are recording and documenting it to preserve it.","why":"该段由语言可能消失转到录音、编词典等保护行动；概括应包括威胁与应对，而不只说“语言很特别”。"}],"answer":"D","explanation":"该段由语言可能消失转到录音、编词典等保护行动；概括应包括威胁与应对，而不只说“语言很特别”。","evidence":[{"page":"P148","paragraph":5,"quote":"For many years, it seemed as though the Gullah language was in danger of dying out, as the culture became more influenced by the culture of the rest of the United States.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P148","paragraph":5,"quote":"However, historical preservationists have been recently recording people speaking the language, as well as compiling dictionaries of various words and their meanings and pronunciation.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P148","paragraph":5,"quote":"However, historical preservationists have been recently recording people speaking the language, as well as compiling dictionaries of various words and their meanings and pronunciation.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P150-B5-01","page":"P150","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P150","exercisePage":"P151","section":"Reading / Questions","originalNumber":5,"originalStem":"Which of the following would be the most likely subject of one of Green’s paintings? - ____ a realistic portrait of a mother and child - ____ the skyline of a city at night - ____ fishermen hauling in their nets","kind":"adapted"},"stem":"Which subject would most likely appear in a painting like those described?","options":[{"id":"A","text":"A diagram of an airplane engine","why":""},{"id":"B","text":"A product chart for factory machinery.","why":""},{"id":"C","text":"Sea Island fishermen bringing in their nets","why":"根据第4段“日常 Gullah 生活”和海岛环境判断新例子，渔民收网最符合这一题材范围。"},{"id":"D","text":"An invented city on another planet","why":""}],"answer":"C","explanation":"根据第4段“日常 Gullah 生活”和海岛环境判断新例子，渔民收网最符合这一题材范围。","evidence":[{"page":"P150","paragraph":4,"quote":"Jonathan Green’s artwork is filled with everyday images of Gullah life as he remembered it growing up.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P150","paragraph":4,"quote":"Water is found in many of his paintings because it plays an important role in the lives of people who live along the coast and on the islands.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P150-E3-01","page":"P150","skill":"E3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P150","exercisePage":"P151","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which description best matches the author’s tone?","options":[{"id":"A","text":"Uninterested in both the paintings and the islands","why":""},{"id":"B","text":"Appreciative of the art and concerned about cultural loss","why":"第1段赞美画作鲜活明亮，第6段关注文化流失及绘画保留记忆的价值，因此同时有赞赏与关切。"},{"id":"C","text":"Mocking the artist and dismissing his memories","why":""},{"id":"D","text":"Celebrating the complete disappearance of local traditions.","why":""}],"answer":"B","explanation":"第1段赞美画作鲜活明亮，第6段关注文化流失及绘画保留记忆的价值，因此同时有赞赏与关切。","evidence":[{"page":"P150","paragraph":1,"quote":"His paintings are bold and colorful, lively and cheerful.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P150","paragraph":6,"quote":"But his paintings can raise awareness of what is in danger of being lost and preserve the memories of a rich and colorful way of life.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P150-F5-01","page":"P150","skill":"F5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P150","exercisePage":"P151","section":"Reading / Questions","originalNumber":2,"originalStem":"Check the word that best describes what type of selection this is. - ____ autobiography - ____ fiction - ____ biography","kind":"adapted"},"stem":"What type of passage is this?","options":[{"id":"A","text":"A step-by-step painting manual.","why":""},{"id":"B","text":"A fictional legend about talking colors","why":""},{"id":"C","text":"A biography focused on an artist’s background and work","why":"文章用第三人称介绍 Green 的成长、教育、创作题材和影响，符合传记；并非艺术家本人第一人称讲述。"},{"id":"D","text":"An autobiography written in Green’s own voice","why":""}],"answer":"C","explanation":"文章用第三人称介绍 Green 的成长、教育、创作题材和影响，符合传记；并非艺术家本人第一人称讲述。","evidence":[{"page":"P150","paragraph":2,"quote":"Jonathan Green was born in 1955 in Gardens Corner, South Carolina, a region of the state known as the Low Country.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P150","paragraph":3,"quote":"When he completed his military service, Green attended the Art Institute of Chicago.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P074-G1-01","page":"P074","skill":"G1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P074","exercisePage":"P075","section":"Reading / Questions","originalNumber":6,"originalStem":"Which hot spring has the hottest water? ____________________________________________________________","kind":"adapted"},"stem":"According to the table, which spring has the hottest water?","options":[{"id":"A","text":"Healing Spring","why":""},{"id":"B","text":"Scenic Hot Springs","why":""},{"id":"C","text":"Morning Mist Springs","why":"比较温度列的86、122、108、95和205；最大值205°F对应 Morning Mist Springs。表中温度与文章中的情节需分别定位。"},{"id":"D","text":"Baker Hot Spring","why":""}],"answer":"C","explanation":"比较温度列的86、122、108、95和205；最大值205°F对应 Morning Mist Springs。表中温度与文章中的情节需分别定位。","evidence":[{"page":"P074","paragraph":"t5","quote":"Morning Mist Springs | 205 | Ashton | Wyoming","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P074-G1-02","page":"P074","skill":"G1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P074","exercisePage":"P075","section":"Reading / Questions","originalNumber":7,"originalStem":"What is the name of the spring located near Seattle, Washington? ____________________________________________________________","kind":"adapted"},"stem":"Which spring is listed near Seattle, Washington?","options":[{"id":"A","text":"Caddo Gap Springs","why":""},{"id":"B","text":"Scenic Hot Springs","why":"先在 Area 列定位 Seattle，再沿同一行读取 Spring 名称，得到 Scenic Hot Springs。"},{"id":"C","text":"Morning Mist Springs","why":""},{"id":"D","text":"Healing Spring","why":""}],"answer":"B","explanation":"先在 Area 列定位 Seattle，再沿同一行读取 Spring 名称，得到 Scenic Hot Springs。","evidence":[{"page":"P074","paragraph":"t2","quote":"Scenic Hot Springs | 122 | Seattle | Washington","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P074-G2-01","page":"P074","skill":"G2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P074","exercisePage":"P075","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which statement correctly combines the story’s explanation with the table’s hottest spring?","options":[{"id":"A","text":"Heat from inside Earth warms the water; Morning Mist Springs in Wyoming has the highest listed temperature.","why":"正文第10段解释 geothermal heat 来自地球内部；表格再给出最高温205°F及其州 Wyoming。正确选项必须同时符合文字与表格。"},{"id":"B","text":"Ice heats the pools; Baker Hot Spring is listed in Virginia.","why":""},{"id":"C","text":"Ocean currents heat the water; Scenic Hot Springs is listed in Wyoming.","why":""},{"id":"D","text":"The Sun heats the pools; Healing Spring in Virginia has the highest listed temperature.","why":""}],"answer":"A","explanation":"正文第10段解释 geothermal heat 来自地球内部；表格再给出最高温205°F及其州 Wyoming。正确选项必须同时符合文字与表格。","evidence":[{"page":"P074","paragraph":10,"quote":"“The water is heated by geothermal heat, which means that the heat is produced from inside Earth.”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P074","paragraph":"t5","quote":"Morning Mist Springs | 205 | Ashton | Wyoming","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P074-G3-01","page":"P074","skill":"G3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P074","exercisePage":"P075","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How much higher is Morning Mist Springs’ listed temperature than Healing Spring’s?","options":[{"id":"A","text":"291°F","why":""},{"id":"B","text":"36°F","why":""},{"id":"C","text":"119°F","why":"从表格读取205°F和86°F，做差205−86＝119°F。不要相加，也不要误用另一行的122°F。"},{"id":"D","text":"83°F","why":""}],"answer":"C","explanation":"从表格读取205°F和86°F，做差205−86＝119°F。不要相加，也不要误用另一行的122°F。","evidence":[{"page":"P074","paragraph":"t5","quote":"Morning Mist Springs | 205 | Ashton | Wyoming","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P074","paragraph":"t1","quote":"Healing Spring | 86 | Roanoke | Virginia","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P142-H1-01","page":"P142","skill":"H1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P142","exercisePage":"P143","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Read both “The Quarreling Colors” (P142) and “An Arc of Light” (P144). How do they explain a rainbow differently?","options":[{"id":"A","text":"Both give only instructions for drawing seven straight lines.","why":""},{"id":"B","text":"One presents a lesson about cooperation; the other explains light and raindrops.","why":"P142 用颜色共同组成彩虹传达共处的寓意；P144 第3段解释阳光进入雨滴后的折射。两文对象相同，但主要内容与解释层次不同。"},{"id":"C","text":"One describes sea fishing, while the other describes baseball.","why":""},{"id":"D","text":"Both claim rainbows are made from colored paint.","why":""}],"answer":"B","explanation":"P142 用颜色共同组成彩虹传达共处的寓意；P144 第3段解释阳光进入雨滴后的折射。两文对象相同，但主要内容与解释层次不同。","evidence":[{"page":"P142","paragraph":11,"quote":"You will be a reminder to us all of how to live with one another in peace—a reminder of how each individual contributes something to the whole.”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P144","paragraph":3,"quote":"When sunlight enters a raindrop, it is bent, or refracted, and the light’s individual strands of color become visible.","why":"结合这处原文核对题干中的限定与结论。"}],"readingPages":["P142","P144"]},{"id":"R6-P142-H2-01","page":"P142","skill":"H2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P142","exercisePage":"P143","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which comparison best describes the two authors’ methods?","options":[{"id":"A","text":"P142 presents a laboratory report; P144 uses only arguments between colors.","why":""},{"id":"B","text":"Both authors use only a personal diary.","why":""},{"id":"C","text":"P142 uses speaking characters and a legend; P144 uses explanations of physical processes.","why":"比较写法而非只找共同话题：P142 将颜色拟人并发展冲突，P144 解释波长、折射和色带等物理过程。"},{"id":"D","text":"Neither text provides any explanation of a rainbow.","why":""}],"answer":"C","explanation":"比较写法而非只找共同话题：P142 将颜色拟人并发展冲突，P144 解释波长、折射和色带等物理过程。","evidence":[{"page":"P142","paragraph":1,"quote":"Long, long ago, when Earth was young, there was a terrible quarrel among the colors.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P144","paragraph":3,"quote":"The wavelengths of different colors vary, which is why each color bends slightly differently to produce the bands of color known as a rainbow.","why":"结合这处原文核对题干中的限定与结论。"}],"readingPages":["P142","P144"]},{"id":"R6-P110-H3-01","page":"P110","skill":"H3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P110","exercisePage":"P111","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which detail from P112 supports P110’s warning that large dams can harm communities and ecosystems?","options":[{"id":"A","text":"The dam’s wall is used for a laser light show.","why":""},{"id":"B","text":"The Grand Coulee Dam flooded tribal land and disrupted salmon migration.","why":"P110 末段提出大坝会使人迁居并影响洄游鱼类；P112 第5段提供部族土地被淹和鲑鱼迁徙受阻的具体实例，能跨文本支持这一主张。"},{"id":"C","text":"The dam contains enough concrete for a long highway.","why":""},{"id":"D","text":"The Grand Coulee Dam can be visited by tourists.","why":""}],"answer":"B","explanation":"P110 末段提出大坝会使人迁居并影响洄游鱼类；P112 第5段提供部族土地被淹和鲑鱼迁徙受阻的具体实例，能跨文本支持这一主张。","evidence":[{"page":"P110","paragraph":7,"quote":"Three Gorges Dam has also displaced millions of people because their homes have been destroyed to make space for the dam.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P110","paragraph":7,"quote":"Dams especially affect migratory fish, like salmon and trout, because they need to move upstream and downstream for feeding and reproduction.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P112","paragraph":5,"quote":"The land of Native American tribes who lived along the Columbia River was flooded after the construction of the dam, and they were forced to move to new areas.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P112","paragraph":5,"quote":"In addition, the dam disrupted the migration of salmon, a staple of their diet.","why":"结合这处原文核对题干中的限定与结论。"}],"readingPages":["P110","P112"]},{"id":"R6-P118-H1-01","page":"P118","skill":"H1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P118","exercisePage":"P119","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which idea is supported by both P118 and P120?","options":[{"id":"A","text":"A writer should never revise any sentence.","why":""},{"id":"B","text":"Writing develops through continued practice and effort, rather than a perfect first attempt.","why":"P118 说 Sachar 一部作品会改五六遍；P120 说每天写、允许一开始写得不完美。合并两篇可见持续练习和改进的重要性。"},{"id":"C","text":"Success requires every writer to become an attorney.","why":""},{"id":"D","text":"Writers should avoid reading other people’s work.","why":""}],"answer":"B","explanation":"P118 说 Sachar 一部作品会改五六遍；P120 说每天写、允许一开始写得不完美。合并两篇可见持续练习和改进的重要性。","evidence":[{"page":"P118","paragraph":8,"quote":"In fact, he may rewrite his story five or six times before he even sends it to his publisher.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P120","paragraph":3,"quote":"It doesn’t matter if you feel like you have nothing to say; the important thing is that you write every single day.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P120","paragraph":3,"quote":"Sometimes, you need to give yourself permission to write things you know won’t be your best work.","why":"结合这处原文核对题干中的限定与结论。"}],"readingPages":["P118","P120"]},{"id":"R6-P088-H2-01","page":"P088","skill":"H2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P088","exercisePage":"P089","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How does P088 present bioluminescence differently from P090?","options":[{"id":"A","text":"P088 follows a family’s discovery through dialogue; P090 explains the phenomenon and its uses.","why":"P088 通过海边情节、人物惊叹和对话引出知识；P090 按定义及不同用途展开说明，比较的是呈现方式与组织。"},{"id":"B","text":"Both are first-person diaries written by the same child.","why":""},{"id":"C","text":"P088 lists only definitions; P090 is told entirely as a family conversation.","why":""},{"id":"D","text":"P088 is a poem, while P090 gives only a shopping list.","why":""}],"answer":"A","explanation":"P088 通过海边情节、人物惊叹和对话引出知识；P090 按定义及不同用途展开说明，比较的是呈现方式与组织。","evidence":[{"page":"P088","paragraph":7,"quote":"“Miles,” said Sophie after a few minutes, “do you notice anything weird about the water?","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P090","paragraph":2,"quote":"It refers to organisms that produce light as a result of a chemical reaction.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P090","paragraph":3,"quote":"Ocean animals use bioluminescence in various ways.","why":"结合这处原文核对题干中的限定与结论。"}],"readingPages":["P088","P090"]},{"id":"R6-P042-H3-01","page":"P042","skill":"H3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P042","exercisePage":"P043","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which detail from P044 best supports the idea in P042 that nonnative species can upset an ecosystem’s balance?","options":[{"id":"A","text":"Introduced melaleuca trees kept growing and crowded out native species.","why":"P042 讨论外来物种对环境连锁关系的影响；P044 第6段的白千层挤占原生物种，是另一篇中可验证这一机制的实例。"},{"id":"B","text":"The Everglades contains forests and grasslands.","why":""},{"id":"C","text":"Crocodiles and alligators can coexist there.","why":""},{"id":"D","text":"The park was founded in 1947.","why":""}],"answer":"A","explanation":"P042 讨论外来物种对环境连锁关系的影响；P044 第6段的白千层挤占原生物种，是另一篇中可验证这一机制的实例。","evidence":[{"page":"P042","paragraph":6,"quote":"But even animals like vervet monkeys or Cuban tree frogs, which seem harmless, can change the delicate balance of the environment.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P044","paragraph":6,"quote":"The wood turned out to be difficult to harvest, so the trees just continued to grow, crowding out other species that are indigenous to the Everglades.","why":"结合这处原文核对题干中的限定与结论。"}],"readingPages":["P042","P044"]}]}</script>
