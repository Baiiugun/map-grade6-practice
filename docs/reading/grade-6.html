const pagesFor=id=>DATA.passages.filter(p=>poolFor(id).some(q=>q.page===p.id));
const done=q=>state.responses[q.id]?.answered===true;
const correct=q=>done(q)&&state.responses[q.id].selected===q.answer;
const visibleAnswer=q=>state.mode==='answers'||done(q);
const sourceDescription=q=>q.source.kind==='adapted'?'原书 '+q.source.exercisePage+' · 第 '+q.source.originalNumber+' 题改编':'教学补充题 · 原书无同题';
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(message){const n=document.getElementById('toast');n.textContent=message;n.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.hidden=true,2600);}
function navigate(hash){if(location.hash===hash)render();else location.hash=hash;}
function currentRoute(){if(!location.hash)return {view:'map'};const a=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);if(a[0]==='grade'&&a[1]==='6'&&a[2]==='skills')return {view:'map'};if((a[0]==='practice'||a[0]==='summary')&&a[1]==='6'&&skills[a[2]]?.enabled){const sid=a[2];const list=pagesFor(sid);return {view:a[0],skill:sid,page:list.some(p=>p.id===a[3])?a[3]:list[0].id};}return {view:'levels'};}
function practiceLink(sid,page){return '#/practice/6/'+sid+'/'+page;}
function header(view){const active=view==='levels'?'levels':view==='map'?'map':'practice';document.querySelectorAll('[data-step]').forEach(b=>{const selected=b.dataset.step===active;b.classList.toggle('active',selected);if(selected)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));}
function footer(){return '<footer class="footer"><span>Reading 补充阅读及练习 · Spectrum Reading Grade 6</span><span><a href="skills.html">能力知识图谱</a></span></footer>';}
function levelView(){const count=DATA.passages.length,total=DATA.questions.length,ready=DATA.skills.filter(s=>s.enabled).length;return '<div class="shell"><section class="levels-hero"><div><p class="eyebrow">FOCUS ON ONE SKILL AT A TIME</p><h1>从一种能力开始，<br><em>读懂一篇文章。</em></h1><p class="intro">先选择 Reading 级别，再从能力图谱进入专项练习。阅读在左，题目在右；点击答案立即显示结果、解析和原文依据。</p></div><div class="reading-visual" aria-hidden="true"><div class="visual-paper"><small>READ → THINK → FIND EVIDENCE</small><b>Read with a purpose.</b><div class="visual-line"></div><div class="visual-line"></div><div class="visual-line"></div><div class="visual-line"></div></div></div></section><div class="section-heading"><strong>01　选择 Reading 级别</strong><span>从 Reading 4 开始</span></div><div class="level-grid">'+DATA.grades.map(g=>'<button type="button" class="level-card'+(g.ready?' ready':'')+'" '+(g.ready?'data-grade="'+g.grade+'"':'disabled aria-disabled="true"')+'><span class="eyebrow level-top" style="margin:0">READING</span><span class="level-number">'+g.grade+'</span><span class="level-status">'+(g.ready?'整本已开放':'建设中 · 未完成')+'</span><span class="level-bottom">'+(g.ready?count+' 篇文章 · '+total+' 道题<br>'+ready+' 项可练能力':'内容尚未开放')+'</span>'+(g.ready?'<span class="level-arrow" aria-hidden="true">↗</span>':'')+'</button>').join('')+'</div><div class="scope-strip"><p><strong>Reading 6 · 全书专项练习</strong><br>正文 P002–P150 · 原配套题页 P003–P151<br>页码均为书内页码。原题改编和教学补充均标明来源。</p><div class="scope-numbers"><div><b>'+count+'</b><span>篇文章</span></div><div><b>'+total+'</b><span>道练习</span></div><div><b>'+ready+'</b><span>项能力</span></div></div></div><div class="flow-notes"><div class="flow-note"><b>01　先选能力</b>点亮的能力可以进入；灰色能力暂未收录合适的专项题。</div><div class="flow-note"><b>02　读文作答</b>每篇标注文章页、配套题页和题目来源，便于回查教材。</div><div class="flow-note"><b>03　对照原文</b>选择后立即显示对错和解析，点击依据句即可定位原文。</div></div>'+footer()+'</div>';}
function mapView(){return '<div class="shell"><section class="page-heading"><div><a class="back-link" href="../">← 返回 MAP 在线练习</a><p class="eyebrow">READING 6 · SKILL MAP</p><h1>选择一项能力，开始专项练习</h1></div><div class="small-stats"><span><b>'+DATA.passages.length+'</b> 篇文章</span><span><b>'+DATA.questions.length+'</b> 道题</span><span><b>'+DATA.skills.filter(s=>s.enabled).length+' / '+DATA.skills.length+'</b> 项可练</span></div></section><div class="map-filters"><div class="map-search"><label class="sr-only" for="map-search">搜索能力名称或英文术语</label><input type="search" id="map-search" placeholder="搜索：中心思想 / Main Idea / 推断" value="'+esc(state.mapSearch)+'" autocomplete="off"></div><label class="map-toggle"><input id="ready-filter" type="checkbox" '+(state.onlyReady?'checked':'')+'>只看可练能力</label></div><p class="map-scope">已收录全书 P002–P150。灰色能力暂未编入合适的专项题；点亮能力按当前题库计算，不表示已经穷尽该能力。</p><div class="module-grid" id="module-grid">'+DATA.modules.map(m=>{const list=DATA.skills.filter(s=>s.module===m.id);return '<section class="module-card" style="--module:'+m.color+'" data-module="'+m.id+'"><div class="module-head"><div class="module-title"><span class="module-letter">'+m.id+'</span>'+esc(m.title)+'</div><small>'+list.filter(s=>s.enabled).length+' / '+list.length+' 可练</small></div>'+list.map(s=>{const pool=poolFor(s.id);const completed=pool.filter(done).length;return '<button type="button" class="skill-row" data-skill-row="'+s.id+'" '+(s.enabled?'data-start-skill="'+s.id+'"':'disabled aria-disabled="true" title="'+esc(s.unavailableReason||'暂未收录合适的专项题')+'"')+'><span class="skill-code">'+s.id+'</span><span class="skill-name">'+esc(s.title)+'<small>'+esc(s.en)+'</small></span><span class="skill-meta">'+(s.enabled?'<b>'+s.pages.length+' 篇 · '+s.questionCount+' 题 <span class="skill-go" aria-hidden="true">→</span></b>'+(completed?'已完成 '+completed+' / '+pool.length:'点击开始专项'):'暂未收录专项')+'</span></button>';}).join('')+'</section>';}).join('')+'</div><p id="map-empty" class="map-empty" hidden>没有匹配的能力，请调整搜索或筛选条件。</p>'+footer()+'</div>';}
function filterMap(){let shown=0;document.querySelectorAll('[data-module]').forEach(module=>{let visible=0;module.querySelectorAll('[data-skill-row]').forEach(row=>{const s=skills[row.dataset.skillRow];const query=state.mapSearch.toLowerCase().trim();row.hidden=(state.onlyReady&&!s.enabled)||(query&&!((s.id+' '+s.title+' '+s.en).toLowerCase().includes(query)));if(!row.hidden)visible++;});module.hidden=visible===0;shown+=visible;});const n=document.getElementById('map-empty');if(n)n.hidden=shown>0;}
function highlightedText(text,ranges){if(!ranges.length)return esc(text);ranges.sort((a,b)=>a.start-b.start);const merged=[];for(const r of ranges){const last=merged.at(-1);if(last&&r.start<=last.end)last.end=Math.max(last.end,r.end);else merged.push({...r});}let out='',end=0;for(const r of merged){out+=esc(text.slice(end,r.start))+'<mark class="evidence-mark">'+esc(text.slice(r.start,r.end))+'</mark>';end=r.end;}return out+esc(text.slice(end));}
function evidenceLocation(q,e){const p=passages[e.page||q.page],par=p.paragraphs.find(x=>x.n===e.paragraph);return (par?.sourcePage||p.page)+' · '+(typeof e.paragraph==='number'?'¶'+e.paragraph:(par?.label||'补充材料'));}
function evidenceTarget(q,e){return 'para-'+(e.page||q.page)+'-'+e.paragraph;}
function plainMarkdown(value){return String(value||'').replace(/^\s*#{1,6}\s+/,'').replace(/\*\*|__/g,'').replace(/\r/g,'').trim();}
function evidenceRanges(par,p,evidence){return evidence.filter(e=>(e.page||e._primary)===p.id&&e.paragraph===par.n).map(e=>({start:par.text.indexOf(e.quote),end:par.text.indexOf(e.quote)+e.quote.length})).filter(r=>r.start>=0);}
function segmentMarkup(text,par,ranges){const offset=par.text.indexOf(text);return highlightedText(text,offset<0?[]:ranges.map(r=>({start:Math.max(0,r.start-offset),end:Math.min(text.length,r.end-offset)})).filter(r=>r.end>r.start));}
function readingSection(p,evidence){
 const paraMap=Object.fromEntries(p.paragraphs.map(par=>[par.n,par]));
 const paragraph=par=>{const ranges=evidenceRanges(par,p,evidence),id='para-'+p.id+'-'+par.n;
  if(typeof par.n==='number'){return '<p class="passage-paragraph'+(ranges.length?' evidence-focus':'')+'" id="'+id+'"><span class="paragraph-number" aria-label="原文第 '+par.n+' 段">'+par.n+'</span><span class="paragraph-text">'+(par.heading?'<strong>'+segmentMarkup(par.heading,par,ranges)+'</strong> '+segmentMarkup(par.text.slice(par.heading.length).trim(),par,ranges):highlightedText(par.text,ranges))+'</span></p>';}
  const lines=(par.raw||par.text).split(/\n/).map(plainMarkdown).filter(Boolean);
  let content='';if(par.label==='小标题'||/^\s*#/.test(par.raw||'')){content='<h3 class="reading-subheading">'+segmentMarkup(plainMarkdown(lines.join(' ')),par,ranges)+'</h3>';}
  else if(lines.length>1||lines.some(x=>x.startsWith('- '))){content='<ul class="reading-list paragraph-text">'+lines.map(line=>'<li>'+segmentMarkup(line.replace(/^-\s+/,''),par,ranges)+'</li>').join('')+'</ul>';}
  else content='<p class="paragraph-text">'+segmentMarkup(plainMarkdown(lines.join(' ')),par,ranges)+'</p>';
  return '<section class="reading-note'+(ranges.length?' evidence-focus':'')+'" id="'+id+'">'+content+'</section>';
 };
 const table=id=>{const visual=(p.visuals||[]).find(v=>v.id===id);if(!visual)return '';return '<figure class="reading-table"><figcaption>'+esc(visual.title)+' <span>· 原书 '+visual.sourcePage+'</span></figcaption><div class="table-scroll"><table><thead><tr>'+visual.headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+visual.rows.map(row=>{const selected=evidenceRanges(paraMap[row.n],p,evidence).length>0;return '<tr id="para-'+p.id+'-'+row.n+'"'+(selected?' class="table-evidence"':'')+'>'+row.cells.map((cell,i)=>(i===0?'<th scope="row">':'<td>')+(selected?'<mark class="evidence-mark">'+esc(cell)+'</mark>':esc(cell))+(i===0?'</th>':'</td>')).join('')+'</tr>';}).join('')+'</tbody></table></div><p class="table-note">'+esc(visual.sourceNote)+'</p></figure>';};
 const blocks=p.blocks||p.paragraphs.map(par=>({type:'paragraph',n:par.n}));
 return '<article class="reading-section" id="reading-'+p.id+'"><p class="pane-kicker">READING PASSAGE · '+p.page+'</p><div class="source-trail"><strong>Spectrum Reading · Grade 6</strong><br>书内 '+p.page+' · '+esc(p.title)+' · Reading 正文<br>原配套练习：'+p.exercisePage+' · Questions</div><h2 class="passage-title">'+esc(p.title)+'</h2>'+(p.lead?'<p class="passage-lead">'+esc(p.lead)+'</p>':'')+blocks.map(b=>b.type==='table'?table(b.visualId):paragraph(paraMap[b.n])).join('')+'<div class="passage-end">文章结束 · '+p.page+' · 数字段落号沿用原书；列表与表格另标来源。</div></article>';
}
function passageMarkup(p,active){const evidence=active&&visibleAnswer(active)&&state.showEvidence?active.evidence.map(e=>({...e,_primary:active.page})):[],readingPages=active?.readingPages||[p.id];return '<div class="passage-content">'+(readingPages.length>1?'<nav class="related-readings" aria-label="本题关联篇章"><strong>跨篇阅读 · '+readingPages.length+' 篇</strong>'+readingPages.map(page=>'<button type="button" data-reading-target="'+page+'">'+page+' '+esc(passages[page].title)+' ↓</button>').join('')+'</nav>':'')+(evidence.length?'<div class="evidence-context-note">黄色为当前题目的原文依据；点击右侧依据卡片可定位。</div>':'')+readingPages.map(page=>readingSection(passages[page],evidence)).join('')+'</div>';}
function questionMarkup(q,number){const response=state.responses[q.id];const revealed=visibleAnswer(q);const reference=state.mode==='answers';const chosen=reference?q.answer:response?.selected;const isCorrect=response?.selected===q.answer;return '<article class="question-card'+(state.focusQ===q.id?' active-review':'')+'" id="question-'+q.id+'"><div class="question-top"><span>QUESTION '+String(number).padStart(2,'0')+'</span><span class="question-type">'+(q.source.kind==='adapted'?'原题改编':'教学补充')+'</span></div><h3 class="question-stem" id="stem-'+q.id+'">'+esc(q.stem)+'</h3><fieldset class="question-options" aria-labelledby="stem-'+q.id+'"><legend class="sr-only">选择一个答案</legend>'+q.options.map(o=>{let classes='option'+(chosen===o.id?' selected':'')+(reference?' locked':'');if(revealed&&o.id===q.answer)classes+=' correct';if(!reference&&done(q)&&response.selected===o.id&&o.id!==q.answer)classes+=' wrong';return '<label class="'+classes+'"><input type="radio" name="'+q.id+'" value="'+o.id+'" data-question="'+q.id+'" '+(chosen===o.id?'checked':'')+' '+(reference?'disabled':'')+'><span class="option-letter">'+o.id+'</span><span>'+esc(o.text)+(revealed&&o.id===q.answer?'<span class="option-result">✓ 正确答案</span>':!reference&&done(q)&&chosen===o.id?'<span class="option-result">× 你的选择</span>':'')+'</span></label>';}).join('')+'</fieldset><p class="source-question">原文：Reading 6 · '+q.page+' · '+esc(passages[q.page].title)+'<br>题目来源：'+esc(sourceDescription(q))+'</p>'+(revealed?'<section class="feedback" id="feedback-'+q.id+'" tabindex="-1" aria-label="答案与解析"><div class="feedback-heading '+(reference?'reference':isCorrect?'':'incorrect')+'"><span>'+(reference?'参考答案 · '+q.answer:isCorrect?'✓ 回答正确':'× 回答错误')+'</span><small>正确答案 '+q.answer+'</small></div><p class="explanation">'+esc(q.explanation)+'</p><div class="evidence-heading"><span>回到原文 · 依据句</span><label class="evidence-switch"><input type="checkbox" class="evidence-toggle" '+(state.showEvidence?'checked':'')+'>高亮依据</label></div>'+q.evidence.map((e,i)=>'<button type="button" class="evidence-button" data-evidence="'+q.id+'" data-evidence-index="'+i+'"><span class="evidence-meta"><span>'+esc(evidenceLocation(q,e))+'</span><span>定位原文 ↖</span></span><blockquote>'+esc(e.quote)+'</blockquote><p>'+esc(e.why)+'</p></button>').join('')+(q.options.every(o=>o.why)?'<details class="option-analysis"><summary>查看逐项解析</summary>'+q.options.map(o=>'<p><b>'+o.id+(o.id===q.answer?' · 正确':'')+'</b>　'+esc(o.why)+'</p>').join('')+'</details>':'')+(q.sourceKeyNote?'<p class="source-key-note">校勘说明：'+esc(q.sourceKeyNote)+'</p>':'')+'</section>':'')+'</article>';}
function practiceView(route){const s=skills[route.skill],p=passages[route.page],pool=poolFor(s.id),pageList=pagesFor(s.id),index=pageList.findIndex(x=>x.id===p.id);const list=pool.filter(q=>q.page===p.id);if(!list.some(q=>q.id===state.focusQ))state.focusQ=list[0].id;const active=list.find(q=>q.id===state.focusQ);const answered=list.every(done);const totalRight=list.filter(correct).length;return '<section class="practice-bar"><div class="practice-bar-left"><button type="button" class="practice-back" data-action="map">← 能力图谱</button><div class="practice-label"><h1>'+s.id+' '+esc(s.title)+'</h1><small>Reading 6 · '+esc(s.en)+' · 专项练习</small></div></div><nav class="article-nav" aria-label="专项文章导航"><button class="nav-arrow" type="button" data-article-direction="-1" aria-label="上一篇文章" '+(index===0?'disabled':'')+'>‹</button><label class="sr-only" for="article-select">选择本专项的文章</label><select id="article-select">'+pageList.map((x,i)=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+(i+1)+' / '+pageList.length+' · '+x.page+' '+esc(x.title)+'</option>').join('')+'</select><button class="nav-arrow" type="button" data-article-direction="1" aria-label="下一篇文章" '+(index===pageList.length-1?'disabled':'')+'>›</button><span class="article-progress">本组已完成 '+pool.filter(done).length+' / '+pool.length+' 题</span></nav></section><nav class="mobile-pane-switch" aria-label="阅读与作答切换"><button type="button" data-mobile="passage" class="'+(state.mobilePane==='passage'?'active':'')+'">阅读文章</button><button type="button" data-mobile="question" class="'+(state.mobilePane==='question'?'active':'')+'">题目与解析</button></nav><section class="workspace mobile-'+state.mobilePane+'"><section class="passage-pane" aria-label="左侧阅读文章" tabindex="0">'+passageMarkup(p,active)+'</section><section class="question-pane" aria-label="右侧专项题目"><div class="question-intro"><div><h2>点击答案，立即查看结果</h2><p>'+esc(s.goal)+'</p></div><span class="exercise-chip">本篇 '+list.length+' 题</span></div>'+(state.mode==='answers'?'<div class="answer-banner">答案版 · 已显示参考答案、解析和原文依据。</div>':answered?'<div class="score-banner '+(totalRight===list.length?'':'wrong')+'" role="status"><span>'+(list.length===1?(totalRight?'✓ 回答正确':'× 回答错误 · 正确答案 '+list[0].answer):'本篇已完成')+'</span><b>'+totalRight+' / '+list.length+'</b></div>':'')+list.map((q,i)=>questionMarkup(q,i+1)).join('')+'<div class="question-actions"><span class="action-hint">'+(state.mode==='answers'?'点击依据卡片，可定位左侧原文。':answered?'已立即判分，可直接改选答案。':'点选答案后，立即显示对错和解析。')+'</span><div class="actions-right"><button type="button" class="primary" data-action="next">'+(index<pageList.length-1?'下一篇 →':'查看本组结果 →')+'</button></div></div></section></section>';}
function summaryView(route){const s=skills[route.skill],pool=poolFor(s.id),answered=pool.filter(done).length,right=pool.filter(correct).length;return '<div class="shell"><section class="summary-hero"><button class="back-link" type="button" data-action="map">← 返回能力图谱</button><p class="eyebrow">READING 6 · PRACTICE REVIEW</p><h1>'+esc(s.title)+' · '+(state.mode==='answers'?'参考答案目录':'本组练习结果')+'</h1><p class="intro">'+(state.mode==='answers'?'按文章回看本组题目的参考答案和原文依据。':'把结论和原文连接起来，检查每个答案的依据。')+'</p></section><div class="summary-card"><div><span class="summary-score">'+(state.mode==='answers'?pool.length:right)+'<small> / '+pool.length+(state.mode==='answers'?' 道参考题':' 题答对')+'</small></span><p>'+answered+' / '+pool.length+' 题已完成 · '+pagesFor(s.id).length+' 篇文章</p></div><button type="button" class="primary" data-summary-continue="'+s.id+'">'+(state.mode==='answers'?'回看答案':answered===pool.length?'回看本组':'继续未完成的题目')+' →</button></div><div class="summary-list">'+pagesFor(s.id).map(p=>{const list=pool.filter(q=>q.page===p.id),doneCount=list.filter(done).length,rightCount=list.filter(correct).length;return '<article class="summary-item"><div><h2>'+esc(p.title)+'</h2><p>Reading 6 · '+p.page+' · '+list.length+' 题</p></div><div><span class="summary-status '+(doneCount<list.length?'pending':rightCount===list.length?'':'incorrect')+'">'+(state.mode==='answers'?'查看参考答案':doneCount<list.length?'未完成':rightCount===list.length?'✓ 正确':'× 需要复习')+'</span><button type="button" class="quiet" data-review-page="'+p.id+'">'+(doneCount<list.length&&state.mode==='student'?'继续练习':'回看')+'</button></div></article>';}).join('')+'</div><div class="summary-footer"><button type="button" class="quiet" data-action="map">选择其他能力</button><button type="button" class="primary" data-review-page="'+pagesFor(s.id)[0].id+'">回到第一篇</button></div>'+footer()+'</div>';}


function render(){const route=currentRoute();header(route.view);document.body.classList.toggle('practice-view',route.view==='practice');app.innerHTML=route.view==='levels'?levelView():route.view==='map'?mapView():route.view==='practice'?practiceView(route):summaryView(route);if(route.view==='map')filterMap();if(route.view!=='practice')window.scrollTo(0,0);}
function renderPassageOnly(){const route=currentRoute();if(route.view!=='practice')return;const pane=app.querySelector('.passage-pane'),scroll=pane.scrollTop;const q=questionMap[state.focusQ];pane.innerHTML=passageMarkup(passages[route.page],q);pane.scrollTop=scroll;}
function focusEvidence(id,index,shouldScroll=true){const q=questionMap[id];if(!q||!visibleAnswer(q))return;state.focusQ=id;state.showEvidence=true;document.querySelectorAll('.evidence-toggle').forEach(n=>n.checked=true);renderPassageOnly();document.querySelectorAll('.question-card').forEach(n=>n.classList.toggle('active-review',n.id==='question-'+id));if(shouldScroll){state.mobilePane='passage';app.querySelector('.workspace').className='workspace mobile-passage';document.querySelectorAll('[data-mobile]').forEach(b=>b.classList.toggle('active',b.dataset.mobile==='passage'));const e=q.evidence[index]||q.evidence[0],target=document.getElementById(evidenceTarget(q,e));if(target){target.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'});target.classList.add('pulse');setTimeout(()=>target.classList.remove('pulse'),1600);}}}
function answerNow(id,value){const route=currentRoute(),q=questionMap[id];if(route.view!=='practice'||state.mode!=='student'||!q||q.page!==route.page||q.skill!==route.skill||!q.options.some(o=>o.id===value))return;const pane=app.querySelector('.passage-pane'),oldScroll=pane?.scrollTop||0;state.responses[id]={selected:value,answered:true};state.focusQ=id;state.showEvidence=true;persist();render();const newPane=app.querySelector('.passage-pane');newPane.scrollTop=oldScroll;const first=q.evidence[0],target=first?document.getElementById(evidenceTarget(q,first)):null;if(target){const paneRect=newPane.getBoundingClientRect(),targetRect=target.getBoundingClientRect();newPane.scrollTop=Math.max(0,newPane.scrollTop+targetRect.top-paneRect.top-45);}const selected=app.querySelector('input[data-question="'+id+'"][value="'+value+'"]');selected?.focus({preventScroll:true});const feedback=document.getElementById('feedback-'+id);if(feedback)feedback.scrollIntoView({block:'start',behavior:'auto'});}
function nextArticle(delta){const r=currentRoute();if(r.view!=='practice')return;const list=pagesFor(r.skill),i=list.findIndex(p=>p.id===r.page),next=list[i+delta];if(next){state.mobilePane='passage';navigate(practiceLink(r.skill,next.id));}}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.readingTarget){document.getElementById('reading-'+b.dataset.readingTarget)?.scrollIntoView({block:'start',behavior:reduced()?'auto':'smooth'});return;}if(b.dataset.mode){state.mode=b.dataset.mode;const url=new URL(location.href);if(state.mode==='answers')url.searchParams.set('mode','answers');else url.searchParams.delete('mode');try{history.replaceState(null,'',url);}catch(_){}render();return;}if(b.dataset.grade==='6'){navigate('#/grade/6/skills');return;}if(b.dataset.startSkill){const sid=b.dataset.startSkill;if(skills[sid]?.enabled){state.mobilePane='passage';navigate(practiceLink(sid,pagesFor(sid)[0].id));}return;}if(b.dataset.articleDirection){nextArticle(Number(b.dataset.articleDirection));return;}if(b.dataset.evidence){focusEvidence(b.dataset.evidence,Number(b.dataset.evidenceIndex));return;}if(b.dataset.mobile){state.mobilePane=b.dataset.mobile;app.querySelector('.workspace').className='workspace mobile-'+state.mobilePane;document.querySelectorAll('[data-mobile]').forEach(n=>n.classList.toggle('active',n===b));return;}if(b.dataset.reviewPage){const r=currentRoute();navigate(practiceLink(r.skill,b.dataset.reviewPage));return;}if(b.dataset.summaryContinue){const sid=b.dataset.summaryContinue;const list=pagesFor(sid);const next=state.mode==='student'?list.find(p=>poolFor(sid).some(q=>q.page===p.id&&!done(q)))||list[0]:list[0];navigate(practiceLink(sid,next.id));return;}const action=b.dataset.action;if(action==='levels')navigate('#/levels');else if(action==='map')navigate('#/grade/6/skills');else if(action==='retry'){const r=currentRoute();poolFor(r.skill).filter(q=>q.page===r.page).forEach(q=>delete state.responses[q.id]);persist();state.focusQ=null;render();}else if(action==='next'){const r=currentRoute(),list=pagesFor(r.skill),i=list.findIndex(p=>p.id===r.page);if(i<list.length-1)nextArticle(1);else navigate('#/summary/6/'+r.skill);}});
document.addEventListener('change',event=>{const t=event.target;if(t.matches('input[data-question]')){answerNow(t.dataset.question,t.value);}else if(t.id==='article-select'){const r=currentRoute();state.mobilePane='passage';navigate(practiceLink(r.skill,t.value));}else if(t.id==='ready-filter'){state.onlyReady=t.checked;filterMap();}else if(t.classList.contains('evidence-toggle')){state.showEvidence=t.checked;document.querySelectorAll('.evidence-toggle').forEach(n=>n.checked=state.showEvidence);renderPassageOnly();}});
document.addEventListener('input',event=>{if(event.target.id==='map-search'){state.mapSearch=event.target.value;filterMap();}});
window.addEventListener('hashchange',()=>{state.focusQ=null;render();});
render();
})();
</script>
</body>
</html>
