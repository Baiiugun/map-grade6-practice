night, I couldn’t sleep, probably because I was still adjusting to the time difference between California and New Jersey,” replied Aunt Suki. “I was rummaging through my suitcase, looking for a book or a crossword puzzle, when I found my origami papers.”","heading":""},{"n":4,"text":"“Origami is paper folding, right?” asked Ken.","heading":""},{"n":5,"text":"Aunt Suki nodded. “There is more to it than that, though. The nature of origami appeals to many people. You must concentrate when you do origami, but it doesn’t require a great deal of thought.","heading":""},{"n":6,"text":"“In a way, it reminds me of counting. Once you know your numbers, counting is a simple task. But when you are counting a large number of things, you must concentrate or you will lose your place. Counting isn’t as productive, or nearly as enjoyable, as origami, though,” Aunt Suki added, smiling and showing the dimple in her right cheek.","heading":""},{"n":7,"text":"Emi reached up and touched the small indentation on her aunt’s face. “Mom has one just like it,” she said.","heading":""},{"n":8,"text":"“I know,” said Aunt Suki. “Your mother’s dimple is in her left cheek, and mine is in my right cheek. When we were little, we used to pretend it meant that we were twins.”","heading":""},{"n":9,"text":"Emi and Ken grinned. They liked the idea of their mother and Aunt Suki as little girls, pretending to be twins. “Does Mom know how to do origami?” asked Ken.","heading":""},{"n":10,"text":"Aunt Suki shook her head. “Even though we grew up in Japan, I didn’t learn origami until I moved to the United States. Your mother has mentioned that it is a tradition she would like to learn one day, so I thought I might give her a few lessons while I’m here.”","heading":""},{"n":11,"text":"“Can you give us a few lessons, too?” asked Emi. She cupped the delicate origami bird gently in her hand. “I can’t believe you made this just by folding paper.”","heading":""},{"n":12,"text":"“Of course,” said Aunt Suki. “I’d love to.” She gestured to the bird in Emi’s hands. “Pull his tail gently.” When Emi did, the bird’s wings flapped up and down. Emi looked amazed.","heading":""},{"n":13,"text":"“When can we start?” asked Ken, pulling the origami frog from the dresser to examine it more closely.","heading":""},{"n":14,"text":"Aunt Suki shrugged. “Whenever you’d like.”","heading":""},{"n":15,"text":"“You can teach us first,” suggested Emi, “and we’ll help you teach Mom. We’ll be passing the tradition up instead of down.”","heading":""},{"n":16,"text":"Aunt Suki smiled again, showing her dimple. “I think your mom will love the surprise,” she said.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15},{"type":"paragraph","n":16}],"kind":""},{"id":"P134","page":"P134","title":"Fascinating Folders","exercisePage":"P135","pdfPage":138,"pdfExercisePage":139,"lead":"Have you ever tried folding paper into interesting shapes?","paragraphs":[{"n":1,"text":"What can you do with a simple sheet of paper? You could write a note to a friend, type a story, or make a paper airplane. But if you learn a few basic folding techniques, you could be making a variety of interesting objects, such as a grasshopper, a stegosaurus, a giraffe, a pick-up truck, or even the White House. There's a good chance that an expert folder somewhere in the world has made an origami version of almost anything you can imagine.","heading":""},{"n":2,"text":"Origami is the art of folding paper into three-dimensional figures of people, animals, and objects. The word origami is Japanese. It comes from the word oru, meaning to fold, and kami, meaning paper. The origin of origami itself, however, is unclear. Some historians believe that it was first practiced in China around the second century A.D. Others think that there is not enough evidence to support this theory and that the practice of origami was begun in Japan several hundred years later. What we do know is that origami was clearly developed in Japan, where it is considered a part of the culture and lifestyle of the people.","heading":""},{"n":3,"text":"One of the most fascinating aspects of origami is the way in which something as simple as a sheet of paper can be transformed into something beautiful and complex. Origami begins with sheets of special paper that are usually six inches on each side. The paper is generally white on one side and colored or marked with a decorative pattern on the other side. It is thin, which allows it to be folded many times, and creases easily.","heading":""},{"n":4,"text":"Although origami paper is traditionally used in this ancient craft, modern-day folders have experimented with many other materials, such as tissue paper, silk, foil, and even bubblegum wrappers. Folders usually avoid scissors and glue, two taboos in the world of paper folding.","heading":""},{"n":5,"text":"Beginners are often taught several folds and bases which are the starting shapes for other, more complicated figures. Some basic folds are the valley fold, mountain fold, petal fold, rabbit ear, squash fold, and reverse fold. These folds are used to create bases, such as the kite, fish, bird, and frog. Once a folder has learned these basic elements, he or she can progress to more elaborate figures.","heading":""},{"n":6,"text":"Diagrams are important to people who take origami seriously because they show the folds needed to make a particular figure. In the early 1950s, Akira Yoshizawa, a Japanese origami master, began publishing books that provided illustrations showing others how to re-create the designs he had invented. He also created a set of diagram symbols that could be used when someone wanted to share with others a figure he or she had created.","heading":""},{"n":7,"text":"For some people, origami is a hobby. Others view it as an art form and a means of creative expression. It is not uncommon for people to spend a great deal of time creating original pieces of origami in designs they have invented themselves. For example, one man created an origami model of the Starship Enterprise from the popular television show Star Trek. It took him a month to design the piece. If someone else wishes to duplicate it, they can use the 72 diagrams and 11 pages of directions the designer created to explain the process.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P136","page":"P136","title":"Seeing Differently","exercisePage":"P137","pdfPage":140,"pdfExercisePage":141,"lead":"Do you think you would have a hard time coping with losing your eyesight?","paragraphs":[{"n":1,"text":"\"Hi, Grandpa,\" said Carson, taking a seat across from his grandfather at the breakfast table. Carson knew that his grandfather's eyesight had been going downhill for the past year. Still, it was a shock to realize that his grandfather could now see only occasional shadows and changes in light.","heading":""},{"n":2,"text":"\"Morning, Carson,\" said Grandpa, with the same old grin he had always had. \"Here, try a bite of this.\" Grandpa neatly scooped up a piece of omelet from his plate and offered it to Carson.","heading":""},{"n":3,"text":"Carson ate the piece of omelet and made a face. \"The eggs aren't too bad, Grandpa,\" he said, \"but I don't know how you can eat all that hot sauce for breakfast.\"","heading":""},{"n":4,"text":"Grandpa laughed. \"It keeps me young!\" he said.","heading":""},{"n":5,"text":"Carson was surprised to see Grandpa walk over to the computer a few minutes later and flip it on. \"Do you need some help, Grandpa?\" asked Carson.","heading":""},{"n":6,"text":"\"I don't think so,\" replied Grandpa. \"I just wanted to get a little dose of morning news,\" he said.","heading":""},{"n":7,"text":"\"How will you do that?\" asked Carson curiously, pulling up a chair next to his grandfather.","heading":""},{"n":8,"text":"\"Well, I'm going to go to a special website where I can hear an audio clip of the news. I listen to the headlines and then choose a story I want to hear more about.\" Carson's grandfather began typing at the keyboard.","heading":""},{"n":9,"text":"\"How do you know where all the letters are?\" asked Carson.","heading":""},{"n":10,"text":"\"I've been typing for a long time,\" answered Grandpa. \"After 60 years of typing, I think I have the location of the keys committed to memory. But if I didn't, I could use a Braille keyboard to guide me.\"","heading":""},{"n":11,"text":"\"Do you use Braille to read books?\" asked Carson.","heading":""},{"n":12,"text":"\"Sometimes,\" replied Grandpa. \"Usually, I just do it to stay in practice though. Books in Braille can be very large and awkward to use because spelling out words in Braille takes up more space than using the Roman alphabet. That's why a type of Braille called Grade 2 Braille is used in almost all books. In Grade 2 Braille, contractions are used to represent frequently used words. For example, b stands for but, c stands for can, and d stands for do. Using contractions makes a Braille book easier to read and hold.\"","heading":""},{"n":13,"text":"\"I prefer listening to audio recordings of books. There are some marvelous readers. The range of voices a single reader can do is quite impressive.\" Grandpa paused to adjust the volume on the computer's speakers. He looked surprised when Carson grabbed him in a bear hug.","heading":""},{"n":14,"text":"\"I'm glad you're here, Grandpa,\" said Carson. \"And I'm glad that you've adjusted to the changes in your eyesight so well.\"","heading":""},{"n":15,"text":"\"Losing my eyesight just made all my other senses sharper,\" said Grandpa. \"It sounds like a cliché, but it's true.\" He smiled at his grandson. \"I'm happy to be here, too,\" he added. \"I can never get enough time with my grandkids.\"","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15}],"kind":""},{"id":"P138","page":"P138","title":"Looking Into the Eye","exercisePage":"P139","pdfPage":142,"pdfExercisePage":143,"lead":"Do you know how the human eye functions?","paragraphs":[{"n":1,"text":"As you begin reading this, you probably aren’t thinking about how your eyes allow you to see the letters, the book, and everything else in the room. But your eyes are the complex organs that perform this very specific function, and without them you would not see. Your eyes change the light patterns surrounding you into information the brain can use to form a visual image.","heading":""},{"n":2,"text":"Light is the key to vision. Light waves coming from the sun or a lightbulb bounce off objects and surfaces, creating unique patterns and colors for your eyes to detect. Light enters the eye first through the cornea, the tough, clear outer layer of your eyeball. The cornea protects the fragile parts located inside the eyeball. It is also the first place where light is refracted so that the image you see is in focus. When someone has laser eye-surgery, it is a defective cornea that is cut and reshaped so that the person can see clearly without glasses.","heading":""},{"n":3,"text":"Directly behind the cornea is a watery fluid, called the aqueous humor, that keeps the moving parts of the eye flexible and hydrated. The iris, the colored part of your eye, is the first of these moving parts. The black dot in the middle of your iris is an opening called the pupil, and it controls the amount of light entering the eye. Muscles in the iris contract and relax to change the size of the pupil. When you walk indoors on a sunny day and notice that it takes time for your eyes to adjust, it is because you are waiting for your pupils to open wide enough to make up for the reduced light.","heading":""},{"n":4,"text":"Human beings have round pupils, but many animals have pupils of different shapes. Cats and snakes, for instance, have slit-shaped openings in their irises, allowing them to see in a wider range of light and dark circumstances. No matter what their shape, pupils appear black because they are the hole leading into the dark interior of the eyeball where light is absorbed.","heading":""},{"n":5,"text":"Sitting right inside the pupil’s opening is the lens, the other moving part of the eye. The lens is a flattened, transparent disc that works with the cornea to focus images onto the back of your eyeball. Although the shape of the cornea is fixed, the lens is attached to muscles that make it rounder or flatter, depending on what is needed for focusing.","heading":""},{"n":6,"text":"Inside the eyeball is a clear, jelly-like substance that keeps it round, like air filling a balloon. The back wall of the eyeball contains a very important area called the retina. The retina is covered with two kinds of light-sensitive nerve cells. Six million of them are cones, the cells that read color. Cone-shaped cells are divided into three types that detect only specific colors—yellow, green, or blue—but combine to let you see an incredible array of different colors. Color blindness is caused by a lack of one or more of these specific cone cells.","heading":""},{"n":7,"text":"The most abundant cells in the retina, nearly 120 million of them, are the rods. These rod-shaped cells are much more sensitive to light than the cones, but they only produce black and white imagery. Most of the cones are located in the center of the retina, where you have the sharpest focus and sight. The edges of the retina, however, contain more rods that can detect very subtle amounts of light.","heading":""},{"n":8,"text":"If you go out on a clear night, you might notice that the faintest stars are very hard to see when you look directly at them. Try looking slightly to the side of the star. The light-sensitive rods on the edges of your retinas will allow you to see the star more clearly!","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P140","page":"P140","title":"Eyes on the Ends of Your Fingers","exercisePage":"P141","pdfPage":144,"pdfExercisePage":145,"lead":"Have you ever seen anything written in Braille?","paragraphs":[{"n":1,"text":"Think about how many things you read every day. Even when you are not in school, doing homework, or reading a book for fun, you read almost constantly. You read the writing on a cereal box to decide what to have for breakfast. You read the label on a bottle of shampoo, the newspaper headlines, billboards, street signs, and the sides of buses. You read menus, e-mails, and the weather report. Everywhere you go, words surround you.","heading":""},{"n":2,"text":"Going about the tasks of daily life would be much more difficult for some people if it weren’t for the creative thinking of a man named Louis Braille. Even though Braille translations are not provided everywhere, the availability of the Braille system in many public places opens up a new world for people who cannot see.","heading":""},{"n":3,"text":"Louis Braille was born in France in 1809 and became blind in an accident when he was three years old. When Braille was ten, he was sent to a school for the blind in Paris. At that time, the only material that was available for blind students to read was carved in wood, cut in cardboard, or made from lead, a heavy metal. This severely limited what students could read. In addition, there was no way for them to write using this system.","heading":""},{"n":4,"text":"Braille became aware of a system of military communication that was invented by Charles Barbier, a French cavalry officer. Barbier had devised a system based on the arrangement of dots in groups of 12. He wanted military personnel to be able to communicate with one another at night when vision was limited. In Barbier’s system, the dots were punched into cardboard, which could be read by touch.","heading":""},{"n":5,"text":"Braille modified this system for use by the blind when he was only 15 years old. Instead of 12 dots, Braille’s system used only six dots, arranged in three rows of two dots each. The presence or absence of dots, and the way in which they were arranged, was used to symbolize specific letters and numbers.","heading":""},{"n":6,"text":"During the next 20 years, similar systems of reading, using dots arranged in different patterns, were developed in the United States. In 1916, Louis Braille’s system was officially accepted in the United States. Sixteen years later, English Braille became the universal system for the English-speaking world.","heading":""},{"n":7,"text":"Even as the Braille system gained acceptance around the world, the development of a good printing process was slow and often tedious. The first books in Braille were printed using a sharp instrument that punched holes in thick paper to form the patterns of dots. Over time, progress was made with the presses that printed Braille materials. The process became quicker and more efficient. Today, computer programs translate written words into Braille code, which is then sent to machines that electronically make the printing plates that are used to produce the books.","heading":""},{"n":8,"text":"Once you start paying attention, you’ll notice Braille in places you’ve never seen it before—in elevators, on doors to public restrooms, on keypads of automated banking machines. It’s impressive to see how far the idea of a 15-year-old boy from France has spread since 1824.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P142","page":"P142","title":"The Quarreling Colors","exercisePage":"P143","pdfPage":146,"pdfExercisePage":147,"lead":"Do you have a favorite color? Why do you like that color?","paragraphs":[{"n":1,"text":"Long, long ago, when Earth was young, there was a terrible quarrel among the colors. Each believed he or she was superior to all other colors, and no color was willing to admit defeat.","heading":""},{"n":2,"text":"Red claimed to be the most important of all because she was the color of life. “Red is the color of blood,” she proclaimed, “and what life is possible without blood? Red is the color of love, of anger, and of heat. What would life be without me?” She did not believe that any other color could make so strong an argument.","heading":""},{"n":3,"text":"Orange stood up. “It is thoughtless to state that red is the most important color. Have you never tasted the juice of an orange or the flesh of a pumpkin? And what color are the most breathtaking sunrises and sunsets? They are orange, of course! There is no question that orange is the most important color.”","heading":""},{"n":4,"text":"“I suppose you have all dismissed the importance of yellow.” Yellow smiled, content with her place in the world. “Can you imagine Earth without the yellow sun? The sun is as responsible for life as blood is,” she reminded the others. “Without the sun, nothing could grow. You would all live in a world of darkness. It is folly to suggest that any color but yellow is most needed and most beloved.”","heading":""},{"n":5,"text":"“Look around you,” said Green. “Do you see anything at all that has not been touched by my hand? Green is truly the color of life. It is grass and trees, toads and salamanders, beans and spinach. The survival of any living creature on Earth would be brief were it not for me. I see no reason to dispute my importance.”","heading":""},{"n":6,"text":"Then, there came the cry of a high-pitched voice. “If you think that I am not needed, all you must do is point your face to the sky. In any direction you look, you will see a brilliant blue. Turn your gaze to the water, the root of all life, and you will see me. Without my wide-open spaces, you would be lost.” Having said his piece, Blue settled back to listen to the others.","heading":""},{"n":7,"text":"Violet stood up, proud and tall. “I am the color of royalty,” he said. “I am the color of power and authority. No one questions my wisdom or superiority.” With confidence he nodded and turned to Indigo, who had remained quiet until it was her turn to speak.","heading":""},{"n":8,"text":"“Have you forgotten me?” she asked quietly. “Indigo is the color of twilight. It is the color of the mountains at night and of the sky just before a storm. Indigo is the color of peace and of quiet times. You would not want to live in a world without me.”","heading":""},{"n":9,"text":"As the colors argued, a jagged streak of lightning lit the sky. A moment later, there was a giant clap of thunder and a steady rain began to fall. The colors drew closer together, sheltering one another from the storm. They could hear the voice of Rain over the thunder’s rumblings.","heading":""},{"n":10,"text":"“You are all so foolish,” Rain scoffed. “Why would you think that one of you is superior to another? Look around,” she said. “Each one of you is unique and essential. Aside from your quarreling, I would not want to live in a place that even one of you didn’t inhabit.”","heading":""},{"n":11,"text":"The colors were silent as they listened to the wise words. “Each time it rains,” added Rain, “I would like you all to come together and stretch across the sky in a giant bow of color. You will be a reminder to us all of how to live with one another in peace—a reminder of how each individual contributes something to the whole.”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11}],"kind":""},{"id":"P144","page":"P144","title":"An Arc of Light","exercisePage":"P145","pdfPage":148,"pdfExercisePage":149,"lead":"What causes rainbows?","paragraphs":[{"n":1,"text":"Almost every culture has stories and legends about the large arcs of color that stretch across the sky when weather conditions are right. Irish folklore tells of leprechauns hiding pots of gold at the end of the rainbow. Chinese mythology explains rainbows as openings in the sky that have been sealed by a goddess using stones of seven different colors. In Hindu mythology, a rainbow is viewed as the bow of the god of thunder and lightning. Rainbows even appear in popular modern culture. Remember Dorothy singing “Somewhere Over the Rainbow” in The Wizard of Oz?","heading":""},{"n":2,"text":"Rainbows enchant and mystify people because they are beautiful but fleeting. Conditions must be exactly right in order for rainbows to form. They are usually seen at the end of a rain shower, on the opposite side of the sky from the sun.","heading":""},{"n":3,"text":"Although sunlight appears to be white, it is actually made up of all the colors in the spectrum. When sunlight enters a raindrop, it is bent, or refracted, and the light’s individual strands of color become visible. The wavelengths of different colors vary, which is why each color bends slightly differently to produce the bands of color known as a rainbow.","heading":""},{"n":4,"text":"Rainbows are usually described as comprising seven colors: red, orange, yellow, green, blue, indigo, and violet. An acronym for remembering the order of the colors is the name ROY G. BIV, in which each letter stands for a color in the spectrum.","heading":""},{"n":5,"text":"Several people may see a rainbow at the same time, but they are not all seeing the same rainbow. Rainbows don’t exist at an exact location in the sky, and the way they appear is dependent upon a specific point. Each of your eyes even perceives a rainbow slightly differently. This means that you’ll never see the exact same rainbow as someone else, unless you are looking at a photograph!","heading":""},{"n":6,"text":"Rainbows are always seen during the day because they require sunlight to form. However, it is possible to see a moonbow, or a nighttime rainbow, on nights when the moon shines particularly brightly. A moonbow is formed in the same way a rainbow is, but it is not nearly as bright. In fact, it appears to be whitish in color because the human eye cannot discern bright colors in dim light.","heading":""},{"n":7,"text":"If weather conditions have not been right for you to spot a rainbow in the sky, you can make your own at home or at school. You’ll just need a large, clear, circular glass or jar of water, a small mirror, and a flashlight. Place the mirror in the water and tilt it slightly upward. Go into a completely dark room that has white walls, and shine the flashlight on the mirror. You’ll be able to see a colorful rainbow you created yourself.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P146","page":"P146","title":"Island Roots","exercisePage":"P147","pdfPage":150,"pdfExercisePage":151,"lead":"Have you ever traced your family tree?","paragraphs":[{"n":1,"text":"Calvin walked into the dining room carrying his backpack and several books. \"This table is a disaster area,\" he told Will, pushing some papers and books aside to clear a small space.","heading":""},{"n":2,"text":"\"Be careful,\" Will cautioned his little brother. \"Everything is in chronological order, and I don't want to have to reorganize it.\"","heading":""},{"n":3,"text":"Calvin raised his eyebrows. As far as he could tell, there was no order at all to the papers on the table, but he decided not to mention it to his brother. \"I'm going to ride my bike to the library,\" said Calvin. \"I was going to ask you if you wanted to come along, but it looks like you have your hands full right now.\"","heading":""},{"n":4,"text":"Will nodded. \"I have a genealogy project due next week. I think I have most of the information I need, but I have to pull it all into some kind of cohesive story.\"","heading":""},{"n":5,"text":"\"What's genealogy?\" asked Calvin, sliding his backpack onto his shoulders.","heading":""},{"n":6,"text":"\"It's the study of your family's history and roots,\" explained Will. \"Haven't you noticed how busy I've been for the last couple of weeks? I've been researching this project for days. The Internet has been pretty helpful in finding names, birth records, and obituaries. I've also interviewed a lot of our older relatives over the phone. There are things that they remember that I wouldn't have been able to find anywhere else. That's part of the reason this project is so important,\" he said. \"I don't want our family's history to get lost. If I record it, it will exist for our great-great-grandkids.\"","heading":""},{"n":7,"text":"Calvin peered over his brother's shoulder and pointed to the family tree that Will had sketched on an oversized piece of paper. \"Is this mom's side of the family?\" he asked.","heading":""},{"n":8,"text":"Will nodded. \"I don't have as much information about her side as I do about Dad's. The interesting thing is that I can't read some of the letters I found.\"","heading":""},{"n":9,"text":"Calvin looked confused. \"Is the handwriting really bad, or are they written in another language?\"","heading":""},{"n":10,"text":"\"Mom and I looked at them together, and as far as we can tell, they are written in Gullah. Mom's family was originally from Africa, but for the last 200 years, they have lived on the islands off the coast of South Carolina. Some people there still speak Gullah, which is a mix of English and different African languages. Mom even thinks that a couple of our distant relations might still live there.\"","heading":""},{"n":11,"text":"\"Wow,\" said Calvin, pulling up a chair next to his brother. \"How are you going to find out what the letters say?\"","heading":""},{"n":12,"text":"\"I don't think I'll have time to do it before this project is due,\" said Will, \"but I've found a few online Gullah dictionaries that will help me translate them. Mom also said we might be able to take a family trip to South Carolina this summer.\"","heading":""},{"n":13,"text":"\"Genealogy is a lot more interesting than it sounds,\" said Calvin. \"Can I help you with this?\"","heading":""},{"n":14,"text":"Will laughed. \"I thought you'd never ask!\"","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14}],"kind":""},{"id":"P148","page":"P148","title":"A Slice of Sea Island Life","exercisePage":"P149","pdfPage":152,"pdfExercisePage":153,"lead":"Have you ever heard of the Gullah people of the southeastern United States?","paragraphs":[{"n":1,"text":"If you look at a map of the southeastern United States, you will see a string of islands that runs along the coast of South Carolina, Georgia, and northern Florida. These islands are often called the Sea Islands. On the map, they probably appear no different than anywhere else in the country. But if you were to visit the islands, you would discover a unique culture and way of life that have been preserved for more than a century.","heading":""},{"n":2,"text":"The name Gullah refers to both a group of people and a language. Many Africans were brought to America against their will to work on southern plantations. They harvested cotton and rice, among many other crops, as well as cared for the families of the plantation owners.","heading":""},{"n":3,"text":"When the Civil War ended in 1865, the slaves were freed or abandoned. Many stayed to live and work in the area. Because the islands were accessible only by boat, the people were isolated from mainstream culture. The customs and traditions they brought with them from Africa remained largely unchanged for many years.","heading":""},{"n":4,"text":"The Gullah language evolved as a way for people who didn’t speak the same language to communicate with one another. It is a combination of many West African languages mixed with English. An English speaker would be able to pick out familiar words here and there, but you probably would not understand most of what was being said.","heading":""},{"n":5,"text":"For many years, it seemed as though the Gullah language was in danger of dying out, as the culture became more influenced by the culture of the rest of the United States. However, historical preservationists have been recently recording people speaking the language, as well as compiling dictionaries of various words and their meanings and pronunciation. They are doing their best to insure that the language is preserved for future generations.","heading":""},{"n":6,"text":"The Gullah language isn’t the only unique aspect of the native Sea Islanders. They have many traditions that are an important part of their culture. For example, the art of basket weaving has been passed down for many generations. A native grass that grows near the ocean, called sweetgrass, is used by the Gullah to create beautiful handmade baskets. The grass is coiled and then sewn together using a needle made from a spoon handle, bone, or nail.","heading":""},{"n":7,"text":"Fish nets are also traditionally handmade in the Gullah culture. Fishing has been an essential part of life in the Sea Islands for many years. Fishermen knitted their own nets by hand using a needle made of palmetto wood, in a tradition carried over from West Africa. It is less common to see these handmade nets today, but some fishermen preserve the craft so that it remains a part of life on the islands.","heading":""},{"n":8,"text":"Today, you can still see the influence of the past in the South Carolina Sea Islands. The beauty of the Gullah people’s way of life still exists, and it brings a wonderful local flavor and color to the area. As interest and awareness in this historical culture grows, so does the chance that it will survive for future generations to appreciate.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P150","page":"P150","title":"The Art of the Islands","exercisePage":"P151","pdfPage":154,"pdfExercisePage":155,"lead":"What inspires Gullah artist Jonathan Green?","paragraphs":[{"n":1,"text":"If you have ever seen the art of Jonathan Green, it is not likely that you will soon forget it. His paintings are bold and colorful, lively and cheerful. Green depicts a way of life that is rapidly disappearing. It is a way of life that he remembers with fondness from his childhood in the South Carolina Sea Islands.","heading":""},{"n":2,"text":"Jonathan Green was born in 1955 in Gardens Corner, South Carolina, a region of the state known as the Low Country. The second of seven children, Green was raised by his maternal grandmother, Eloise Stewart Johnson. As he grew up, he was immersed in Gullah culture—a culture that placed great value on tradition, family, and community. Although Green had to travel to other parts of the world before he could fully appreciate his rich heritage, the basic elements of his culture eventually found their way into his unique form of artistic expression.","heading":""},{"n":3,"text":"After Green graduated from high school, he joined the military. It seemed like a good opportunity for him to see the world and to receive an education. When he completed his military service, Green attended the Art Institute of Chicago. While he was in school, he worked part-time as a security guard at an art museum. This allowed him to study the work of the masters. He imitated their work at first, learning what made them so well respected. Then, Green found his own style and direction and began painting South Carolina’s Gullah Islands, the world he knew best.","heading":""},{"n":4,"text":"Jonathan Green’s artwork is filled with everyday images of Gullah life as he remembered it growing up. His paintings show people hanging laundry out to dry, picking oysters, telling stories, and attending weddings and funerals. Water is found in many of his paintings because it plays an important role in the lives of people who live along the coast and on the islands.","heading":""},{"n":5,"text":"Human beings are also found in nearly all of Green’s work, indicating the importance of family and community to the culture. The faces of the people in his paintings are usually without features. This can be interpreted as Green’s way of showing how the everyday lives and experiences of people are universal.","heading":""},{"n":6,"text":"The Gullah way of life is changing as children grow up and move away to larger towns and cities. The Gullah dialect is disappearing with the older generations. Even the landscape of the islands is changing, as condominiums, malls, and fast-food restaurants begin to take over. Jonathan Green knows that his artwork cannot change what is happening to the area where he grew up. But his paintings can raise awareness of what is in danger of being lost and preserve the memories of a rich and colorful way of life.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""}],"questions":[{"id":"R6-P002-A1-01","page":"P002","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P002","exercisePage":"P003","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What is the main idea of this story?","options":[{"id":"A","text":"Mrs. Ito explains the rule about foreign players in Japan.","why":"这只概括第 13 段的一条规则，覆盖不了整篇经历。"},{"id":"B","text":"Alex and Emily discover familiar and different parts of Japanese baseball and enjoy the experience.","why":"既包含两国棒球的相似与不同，也包含兄妹参观后的感受，能覆盖全文。"},{"id":"C","text":"Emily decides to become a professional baseball player in Tokyo.","why":"原文没有说 Emily 要成为职业球员。"},{"id":"D","text":"Baseball in Japan is completely different from baseball in the United States.","why":"completely different 过于绝对；第 12 段明确说比赛本身差别不大。"}],"answer":"B","explanation":"文章围绕兄妹第一次观看日本棒球比赛展开，介绍熟悉的比赛、不同的助威和食物，以及两人的喜爱。中心思想应同时覆盖经历与感受。","evidence":[{"paragraph":11,"quote":"That’s just one of the differences between American and Japanese baseball culture.","why":"日本棒球文化有不同之处。"},{"paragraph":12,"quote":"The game itself didn’t seem much different at all from the American baseball games they had attended.","why":"比赛本身又与美国棒球相似。"},{"paragraph":17,"quote":"I wish we could go to JBall games at home, too,","why":"Emily 希望以后在家也能看，说明这次体验很受欢迎。"}]},{"id":"R6-P002-B1-01","page":"P002","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P002","exercisePage":"P003","section":"Reading / Questions","originalNumber":1,"originalStem":"Why were the Godfreys in Japan? [blank]","kind":"adapted"},"stem":"Why were the Godfreys in Japan?","options":[{"id":"A","text":"To compete in a baseball tournament.","why":"一家人是观众，原文没有参加比赛的安排。"},{"id":"B","text":"To work at a Japanese baseball stadium.","why":"没有人在球场工作的线索。"},{"id":"C","text":"To buy a professional baseball team.","why":"这是原文没有交代的新信息。"},{"id":"D","text":"To visit Mrs. Godfrey’s old college roommate.","why":"第 1 段直接交代了旅行的主要原因。"}],"answer":"D","explanation":"定位第 1 段的 They were there to visit…，college roommate 是到访原因；看棒球是旅行期间的一项活动。","evidence":[{"paragraph":1,"quote":"They were there to visit their mother’s old college roommate, who had moved to Japan after college to teach English.","why":"这句话直接回答 why they were in Japan。"}]},{"id":"R6-P002-B2-01","page":"P002","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P002","exercisePage":"P003","section":"Reading / Questions","originalNumber":3,"originalStem":"What is one way American and Japanese baseball are similar? What is one way they are different? [blank] [blank]","kind":"adapted"},"stem":"Which statement correctly compares American and Japanese baseball in the story?","options":[{"id":"A","text":"The game itself is similar, but Japanese games have male cheerleaders.","why":"第 12 段说比赛本身相似，第 11 段指出男性拉拉队的文化差异。"},{"id":"B","text":"The rules are completely different, but the cheerleaders are the same.","why":"两处比较都与原文相反。"},{"id":"C","text":"Only American games allow any foreign players.","why":"日本球队允许外国球员；only 也没有依据。"},{"id":"D","text":"Japanese games never sell snacks that Americans know.","why":"第 14 段列出 pretzels、popcorn、hot dogs，否定 never。"}],"answer":"A","explanation":"比较需要同时核对“相同”和“不同”两边。原文说比赛本身差别不大，而日本球场有男性拉拉队。","evidence":[{"paragraph":11,"quote":"I forget that Americans don’t have cheerleaders for baseball games.","why":"Mrs. Ito 指出美国棒球场没有文中这种拉拉队安排。"},{"paragraph":11,"quote":"It also probably seems unusual that they’re all men.","why":"男性拉拉队是这篇文章强调的文化差异。"},{"paragraph":12,"quote":"The game itself didn’t seem much different at all from the American baseball games they had attended.","why":"这句话支持比赛本身相似。"}]},{"id":"R6-P002-B3-01","page":"P002","skill":"B3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P002","exercisePage":"P003","section":"Reading / Questions","originalNumber":4,"originalStem":"Do you think that Alex and Emily will go to another JBall game if they have a chance? Why or why not? [blank] [blank]","kind":"adapted"},"stem":"What can you reasonably predict about Alex and Emily?","options":[{"id":"A","text":"They will avoid baseball games from now on.","why":"结尾表达的是喜爱和期待，不是回避。"},{"id":"B","text":"They will immediately join a Japanese professional team.","why":"想再看比赛不能推出会加入职业球队。"},{"id":"C","text":"They would probably enjoy another JBall game if they had a chance.","why":"他们投入地观看，并希望在家也能看日本棒球，支持再次观看的预测。"},{"id":"D","text":"They will move permanently to Japan because of baseball.","why":"原文没有支持永久移居的线索。"}],"answer":"C","explanation":"合理预测要接续人物已经表现出的兴趣。两人很投入，Emily 还希望在家也能观看，所以“愿意再看”比搬家或参赛更有依据。","evidence":[{"paragraph":12,"quote":"Once the game began, Emily and Alex became quickly engrossed.","why":"观看时两人很投入。"},{"paragraph":17,"quote":"I wish we could go to JBall games at home, too,","why":"这句愿望直接支持以后愿意继续观看。"}]},{"id":"R6-P002-C5-01","page":"P002","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P002","exercisePage":"P003","section":"Reading / Questions","originalNumber":8,"originalStem":"something of interest; something a person enjoys [blank]","kind":"adapted"},"stem":"In paragraph 8, what does “Baseball isn’t my cup of tea” mean?","options":[{"id":"A","text":"Mrs. Ito cannot buy tea at the baseball stadium.","why":"cup of tea 在这里是习语，不是在说饮料。"},{"id":"B","text":"Baseball is not an activity Mrs. Ito particularly enjoys.","why":"not my cup of tea 表示“不是我特别感兴趣或喜欢的事”。"},{"id":"C","text":"Mrs. Ito has never heard of baseball before.","why":"不特别喜欢一项活动，不等于从未听说过。"},{"id":"D","text":"The baseball game will definitely be terrible.","why":"她紧接着说比赛有望很精彩，不能推出 terrible。"}],"answer":"B","explanation":"cup of tea 是习语，表示某人喜欢或感兴趣的事。isn’t my cup of tea 说明棒球不合她的兴趣；后面的 but this promises to be a good game 表明她仍认可这场比赛。","evidence":[{"paragraph":8,"quote":"Baseball isn’t my cup of tea, but this promises to be a good game.","why":"将固定搭配整体理解，并结合 but 后的转折核对。"}]},{"id":"R6-P002-C1-01","page":"P002","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P002","exercisePage":"P003","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"As used in paragraph 12, “engrossed” most nearly means:","options":[{"id":"A","text":"deeply interested and absorbed","why":"比赛开始后两人全神贯注，结尾还希望继续看，支持“入迷、投入”。"},{"id":"B","text":"confused about where they were","why":"他们知道自己在球场，原文没有迷路或地点混乱。"},{"id":"C","text":"angry with the players","why":"没有生气的线索。"},{"id":"D","text":"too tired to watch the game","why":"疲惫出现在赛后，不能替代观看时的 engrossed。"}],"answer":"A","explanation":"把词放回比赛开始后的情境，并联系结尾的喜爱，engrossed 表示注意力被吸引、看得很投入。不要把赛后 tired 当成观看时的状态。","evidence":[{"paragraph":12,"quote":"Once the game began, Emily and Alex became quickly engrossed.","why":"目标词出现的位置。"},{"paragraph":17,"quote":"I wish we could go to JBall games at home, too,","why":"后文的愿望支持“感兴趣、投入”的理解。"}]},{"id":"R6-P004-A1-01","page":"P004","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P004","exercisePage":"P005","section":"Reading / Questions","originalNumber":1,"originalStem":"Check the sentence that best states the main idea of the passage. - [blank] Although baseball is thought of as an American sport, there are many fans and talented players of Japanese baseball, or yakyuu. - [blank] American teams toured Japan in the early 1900s and played exhibition games against the local amateurs. - [blank] Horace Wilson brought baseball to Japan in the 1870s.","kind":"adapted"},"stem":"Which sentence best states the main idea of the passage?","options":[{"id":"A","text":"Although baseball is thought of as an American sport, there are many fans and talented players of Japanese baseball, or yakyuu.","why":"这能统摄日本棒球的发展、球迷和优秀球员。"},{"id":"B","text":"American teams toured Japan in the early 1900s and played exhibition games against local amateurs.","why":"这是第 4 段的一个发展细节。"},{"id":"C","text":"Horace Wilson brought baseball to Japan in the 1870s.","why":"这是起源信息，只覆盖文章的一部分。"},{"id":"D","text":"Japanese baseball players win every game against American teams.","why":"every game 没有依据；文中还提到美国队赢了 17 场。"}],"answer":"A","explanation":"全文介绍棒球在日本的发展、受欢迎的程度及球员成就。正确概括应覆盖多段，不能只选引入棒球或巡回比赛的一个细节。","evidence":[{"paragraph":1,"quote":"In fact, baseball’s popularity in Japan rivals its popularity here in the United States.","why":"开头点明在日本同样受欢迎。"},{"paragraph":6,"quote":"From 1965 through 1973, the Giants won nine consecutive national championships, partly because of the legendary player Sadahara Oh.","why":"优秀球队和球员的成就是主旨的支持细节。"},{"paragraph":7,"quote":"Japanese professional players have also come to the United States and played in Major League Baseball, setting records here as well.","why":"结尾补充日本优秀球员的表现。"}]},{"id":"R6-P004-E1-01","page":"P004","skill":"E1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P004","exercisePage":"P005","section":"Reading / Questions","originalNumber":3,"originalStem":"Check the phrase that best describes the author’s purpose. - [blank] to inform - [blank] to entertain - [blank] to persuade","kind":"adapted"},"stem":"What is the author’s main purpose in writing “Yakyuu”?","options":[{"id":"A","text":"To entertain readers with an imaginary baseball adventure.","why":"文章介绍历史和球员，不是虚构冒险。"},{"id":"B","text":"To persuade Americans to stop watching baseball.","why":"原文没有要求美国人停止看棒球。"},{"id":"C","text":"To inform readers about the development and popularity of baseball in Japan.","why":"年代、球队和球员的资料共同服务于介绍日本棒球。"},{"id":"D","text":"To give step-by-step instructions for playing baseball.","why":"文章没有依次教授比赛操作或完整规则。"}],"answer":"C","explanation":"作者按历史进程介绍日本棒球，并用球队和球员成就补充说明，主要目的是 inform。注意“介绍发展”不同于“逐步教人怎么玩”。","evidence":[{"paragraph":2,"quote":"In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students.","why":"提供起源信息。"},{"paragraph":5,"quote":"Because baseball had become an important part of Japanese culture, professional teams reformed after the war.","why":"接续介绍战后的发展。"},{"paragraph":7,"quote":"Japanese professional players have also come to the United States and played in Major League Baseball, setting records here as well.","why":"补充球员资料，延续介绍性目的。"}]},{"id":"R6-P004-B2-01","page":"P004","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P004","exercisePage":"P005","section":"Reading / Questions","originalNumber":2,"originalStem":"Number the events below to show the order in which they happened. - [blank] Horace Wilson introduced baseball to his students. - [blank] World War II interrupted Japanese baseball. - [blank] The Giants won nine consecutive national championships. - [blank] Babe Ruth and Lou Gehrig played baseball in Japan.","kind":"adapted"},"stem":"Which sequence puts these events in the correct order?","options":[{"id":"A","text":"Wilson introduces baseball → World War II interrupts games → Ruth and Gehrig visit → the Giants win nine championships","why":"Ruth 和 Gehrig 的访问在 1930 年代，早于文中所说的战时中断。"},{"id":"B","text":"Ruth and Gehrig visit → Wilson introduces baseball → World War II interrupts games → the Giants win nine championships","why":"Wilson 在 1870 年代引入，早于 1930 年代的访问。"},{"id":"C","text":"Wilson introduces baseball → Ruth and Gehrig visit → the Giants win nine championships → World War II interrupts games","why":"九连冠发生在 1965–1973 年，晚于第二次世界大战。"},{"id":"D","text":"Wilson introduces baseball → Ruth and Gehrig visit → World War II interrupts games → the Giants win nine championships","why":"依次对应 1870 年代、1930 年代、二战、1965–1973 年。"}],"answer":"D","explanation":"把事件与原文时间对应，再排序：1870s 引入 → 1930s 美国球星来访 → 二战中断 → 1965–1973 年九连冠。","evidence":[{"paragraph":2,"quote":"In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students.","why":"最早的引入事件。"},{"paragraph":4,"quote":"Top American baseball stars like Babe Ruth and Lou Gehrig came to Japan in the 1930s and played against the top Japanese college teams.","why":"美国球星在 1930 年代来访。"},{"paragraph":5,"quote":"Like so many other things around the world, World War II interrupted Japanese baseball when almost all of the players became soldiers.","why":"随后是战争带来的中断。"},{"paragraph":6,"quote":"From 1965 through 1973, the Giants won nine consecutive national championships, partly because of the legendary player Sadahara Oh.","why":"九连冠在四件事中最晚。"}]},{"id":"R6-P004-B1-01","page":"P004","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P004","exercisePage":"P005","section":"Reading / Questions","originalNumber":5,"originalStem":"Why did Japan’s leaders like baseball? [blank] [blank]","kind":"adapted"},"stem":"Why did Japanese leaders embrace baseball?","options":[{"id":"A","text":"It required no mental competition.","why":"原文恰恰提到投手和打者之间的心理较量。"},{"id":"B","text":"It included elements that were already part of Japanese culture.","why":"第 2 段直接给出这个原因，并举武术的例子。"},{"id":"C","text":"They wanted all students to move to America.","why":"原文没有这个目标。"},{"id":"D","text":"Every Japanese team had already won an international championship.","why":"引入棒球时并不存在这样的前提，every 也没有依据。"}],"answer":"B","explanation":"回到第 2 段的 because，作者直接说明棒球包含日本文化中已有的要素；后面的武术比较是在解释这个原因。","evidence":[{"paragraph":2,"quote":"Japanese leaders also embraced baseball because they thought that it contained elements that were already part of Japanese culture.","why":"because 从句直接回答原因。"},{"paragraph":2,"quote":"For instance, baseball’s focus on the mental competition between pitcher and hitter was similar to the one-on-one competitions of martial arts.","why":"武术的例子具体解释文化上的契合。"}]},{"id":"R6-P004-B4-01","page":"P004","skill":"B4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P004","exercisePage":"P005","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which sentence most directly supports the statement “Baseball is widely popular in Japan”?","options":[{"id":"A","text":"In the early 1870s, Horace Wilson, an American professor living in Tokyo, introduced baseball to his students.","why":"说明谁在何时引入棒球，没有直接说明普及程度。"},{"id":"B","text":"The surname Oh means king, and he certainly was the king of baseball in Japan.","why":"主要评价一位球员，支持范围不如直接比较普及程度的句子。"},{"id":"C","text":"In fact, baseball’s popularity in Japan rivals its popularity here in the United States.","why":"直接用 popularity 对比，最明确地支持棒球在日本广受欢迎。"},{"id":"D","text":"Like so many other things around the world, World War II interrupted Japanese baseball when almost all of the players became soldiers.","why":"主要说明战争造成中断，不是最直接的普及程度证据。"}],"answer":"C","explanation":"先明确要证明的是“广受欢迎”，再找直接表达 popularity 的句子。相关的历史细节也谈棒球，但与目标结论的连接不如这句直接。","evidence":[{"paragraph":1,"quote":"In fact, baseball’s popularity in Japan rivals its popularity here in the United States.","why":"这句话直接谈受欢迎程度，与要证明的结论对应。"}]},{"id":"R6-P004-C1-01","page":"P004","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P004","exercisePage":"P005","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"In paragraph 3, “equivalent to” most nearly means:","options":[{"id":"A","text":"completely unrelated to","why":"作者是在建立比较，不是说两者毫无关联。"},{"id":"B","text":"always less exciting than","why":"原文没有说日本大学棒球总是更不受关注。"},{"id":"C","text":"the opposite of","why":"这两种球迷热情不是对立关系。"},{"id":"D","text":"similar in degree to","why":"作者用美国大学体育的热情帮助读者理解日本大学棒球的热情。"}],"answer":"D","explanation":"句子把两国大学体育的热情并列比较，equivalent to 表示程度相当。这里比较的是 enthusiasm / excitement，而不是声称两种运动的规则相同。","evidence":[{"paragraph":3,"quote":"To this day, the enthusiasm for college baseball in Japan is equivalent to the excitement people have for college football or college basketball’s March Madness in the United States.","why":"前后对应的 enthusiasm 与 excitement 帮助确定“程度相当”。"}]},{"id":"R6-P006-A1-01","page":"P006","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P006","exercisePage":"P007","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What is this story mainly about?","options":[{"id":"A","text":"The family learns every rule of a professional baseball game.","why":"这是另一篇棒球文章的话题，本篇没有学习棒球规则。"},{"id":"B","text":"Emily teaches the chef a new way to prepare sushi.","why":"Emily 是尝试食物的客人，没有教厨师。"},{"id":"C","text":"Alex and Emily try Japanese food, and both discover that they enjoy sushi.","why":"概括了餐厅经历、最初差异和最后两人都喜欢寿司的结果。"},{"id":"D","text":"Alex refuses to eat anything unfamiliar.","why":"与第 1 段 Alex loved to try new foods 相反。"}],"answer":"C","explanation":"故事以兄妹对新食物的不同态度开始，以两人都喜欢寿司结束。正确主旨需要覆盖人物、主要经历和结果。","evidence":[{"paragraph":1,"quote":"Alex loved to try new foods.","why":"Alex 最初很愿意尝试。"},{"paragraph":2,"quote":"Emily wasn’t as confident as Alex was about trying new foods.","why":"Emily 最初较为谨慎。"},{"paragraph":19,"quote":"No one at the table was surprised to learn that Alex loved the sushi.","why":"Alex 喜欢寿司。"},{"paragraph":21,"quote":"I love it,","why":"Emily 也明确表达了喜爱。"}]},{"id":"R6-P006-F2-01","page":"P006","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P006","exercisePage":"P007","section":"Reading / Questions","originalNumber":6,"originalStem":"How are Alex and Emily different? [blank] [blank]","kind":"adapted"},"stem":"How are Alex and Emily different at the beginning of the story?","options":[{"id":"A","text":"Alex is eager to try unfamiliar food, while Emily is more cautious.","why":"第 1、2 段直接对照两人的食物偏好与态度。"},{"id":"B","text":"Emily will eat anything, while Alex refuses all new foods.","why":"把两人的特点颠倒了。"},{"id":"C","text":"Alex knows Japanese, while Emily does not.","why":"原文没有说 Alex 会日语；他说菜单是日文。"},{"id":"D","text":"Emily has tried every Japanese dish, while Alex has tried none.","why":"every 和 none 都超过了原文信息。"}],"answer":"A","explanation":"人物比较要回到同一维度。第 1 段说 Alex 喜欢尝试新食物，第 2 段说 Emily 希望辨认盘中的东西，表现得更谨慎。","evidence":[{"paragraph":1,"quote":"Alex loved to try new foods.","why":"支持 Alex 乐于尝试。"},{"paragraph":2,"quote":"Emily liked to be able to identify everything on her plate.","why":"支持 Emily 对陌生食物更谨慎。"}]},{"id":"R6-P006-B3-01","page":"P006","skill":"B3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P006","exercisePage":"P007","section":"Reading / Questions","originalNumber":10,"originalStem":"Why does Mr. Godfrey say, “Our kids are turning into some very well-seasoned eaters”? [blank] [blank]","kind":"adapted"},"stem":"What does Mr. Godfrey mean by “very well-seasoned eaters”?","options":[{"id":"A","text":"His children now need large amounts of salt on every meal.","why":"这里不是字面上的“调味很多”；原文没有每天加盐的意思。"},{"id":"B","text":"His children have become professional sushi chefs.","why":"尝试并喜欢食物不等于会制作，更不等于成为职业厨师。"},{"id":"C","text":"His children refuse to eat food from other cultures.","why":"两人都在尝试并喜欢日本食物，方向相反。"},{"id":"D","text":"His children are gaining experience with food from different cultures.","why":"结合餐厅经历和两人喜欢寿司的结果，seasoned 在这里强调经验增加。"}],"answer":"D","explanation":"父亲在两人尝试寿司后开玩笑。well-seasoned 既让人想到食物调味，也可表示经验丰富；此处结合全篇，应理解为兄妹越来越有尝试不同食物的经验。","evidence":[{"paragraph":19,"quote":"No one at the table was surprised to learn that Alex loved the sushi.","why":"Alex 尝试后喜欢寿司。"},{"paragraph":21,"quote":"I think we’re going to need to find a restaurant at home that serves sushi,","why":"Emily 也希望回家以后继续吃。"},{"paragraph":22,"quote":"Our kids are turning into very well-seasoned eaters!","why":"父亲在这段经历之后总结两人的变化。"}]},{"id":"R6-P006-B1-01","page":"P006","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P006","exercisePage":"P007","section":"Reading / Questions","originalNumber":8,"originalStem":"What holds everything together in a roll of sushi? [blank]","kind":"adapted"},"stem":"What holds the ingredients together in a roll of sushi?","options":[{"id":"A","text":"A wooden serving board.","why":"木板用来盛寿司，不负责把寿司卷起来。"},{"id":"B","text":"A thin sheet of seaweed.","why":"第 14 段说所有食材都被卷在海苔里面。"},{"id":"C","text":"A pair of chopsticks.","why":"筷子用于夹取寿司。"},{"id":"D","text":"A mound of wasabi.","why":"wasabi 是辛辣调味品，不是包裹寿司的材料。"}],"answer":"B","explanation":"定位制作过程。海苔上放米饭和配料，随后把所有东西卷在海苔里面，所以海苔起包裹作用。","evidence":[{"paragraph":14,"quote":"They roll everything up inside the seaweed and slices it into little disks.","why":"inside the seaweed 直接说明包裹食材的材料。"}]},{"id":"R6-P006-F3-01","page":"P006","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P006","exercisePage":"P007","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How do Emily’s feelings about sushi change during the story?","options":[{"id":"A","text":"She begins enthusiastic and becomes angry.","why":"开头是不太确定，结尾也没有生气。"},{"id":"B","text":"She remains unwilling to taste any sushi.","why":"结尾她已经在吃，还说很喜欢。"},{"id":"C","text":"She begins unsure but ends up enjoying it and wanting to eat it again.","why":"uncertainly 与结尾的 I love it / 回家找餐厅形成清楚的情绪变化。"},{"id":"D","text":"She dislikes sushi at first and then becomes the chef.","why":"原文没有说她尝前就讨厌寿司，更没有成为厨师。"}],"answer":"C","explanation":"追踪同一个人物前后的表现。开头的 uncertainly 表明拿不准；结尾她再夹寿司，并提出回家找餐厅，说明从不确定转为喜爱。","evidence":[{"paragraph":8,"quote":"Emily looked uncertainly at her parents.","why":"开头的神态显示不确定。"},{"paragraph":21,"quote":"I love it,","why":"结尾直接表达喜爱。"},{"paragraph":21,"quote":"I think we’re going to need to find a restaurant at home that serves sushi,","why":"希望再次吃寿司，进一步支持积极变化。"}]},{"id":"R6-P006-F5-01","page":"P006","skill":"F5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P006","exercisePage":"P007","section":"Reading / Questions","originalNumber":5,"originalStem":"Check the line beside the word or words that best describe what type of passage this is. - [blank] informational text - [blank] fiction - [blank] tall tale","kind":"adapted"},"stem":"Which type of passage is “Experimental Appetites”?","options":[{"id":"A","text":"A scientific report presenting experimental data.","why":"文章没有实验设计、数据和科学结论。"},{"id":"B","text":"A tall tale with impossible, exaggerated events.","why":"故事没有不可能发生的夸张事件。"},{"id":"C","text":"A recipe giving complete, numbered cooking instructions.","why":"虽包含寿司制作的介绍，但全文围绕人物在餐厅的经历展开。"},{"id":"D","text":"A realistic fiction story about a family trying unfamiliar food.","why":"按原书答案归类为 fiction；人物、对话、事件与感受共同构成一个现实情境故事。"}],"answer":"D","explanation":"原书把本篇归为 fiction。整篇的组织中心是人物在餐厅的经历，而不是实验报告或操作指南。人物对话是叙事线索，但“有对话”本身并不能单独证明一篇文章必然是虚构。","evidence":[{"paragraph":1,"quote":"Alex and Emily sat at a table with their parents and Mr. and Mrs. Ito.","why":"人物和场景开启故事。"},{"paragraph":21,"quote":"Emily picked up another piece of sushi with her chopsticks.","why":"人物行动推动餐厅经历。"},{"paragraph":22,"quote":"Our kids are turning into very well-seasoned eaters!","why":"人物台词构成故事结尾；文类答案另与原书 P007 第 5 题核对。"}]},{"id":"R6-P008-A1-01","page":"P008","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P008","exercisePage":"P009","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which sentence best summarizes the main idea of “Bonsai”?","options":[{"id":"A","text":"Bonsai trees must always come from naturally tiny plants.","why":"第 2 段明确否定了必须使用矮小品种的误解。"},{"id":"B","text":"Every bonsai must stay indoors throughout the year.","why":"第 4 段说通常在户外，只在特殊场合搬进室内。"},{"id":"C","text":"All bonsai styles have branches that extend below the pot.","why":"只有 cascade 的说明包含伸到容器底部以下，不能推广到全部样式。"},{"id":"D","text":"Bonsai is a traditional art of growing and shaping miniature trees that requires care and has cultural importance.","why":"涵盖盆栽的艺术、养护与文化价值，能覆盖多段内容。"}],"answer":"D","explanation":"文章介绍盆栽是什么、怎样养护、文化意义以及基本样式。中心思想应把这些内容联系起来，不能只抓一个样式或把常见误解当结论。","evidence":[{"paragraph":1,"quote":"It refers to the interesting combination of art and cultivation of miniature trees and plants.","why":"开头界定盆栽是艺术与栽培的结合。"},{"paragraph":2,"quote":"It takes a great deal of care and patience to achieve this balance.","why":"养护需要耐心和投入。"},{"paragraph":3,"quote":"It holds a special and significant place in Japanese culture.","why":"文章也强调文化意义。"}]},{"id":"R6-P008-C1-01","page":"P008","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P008","exercisePage":"P009","section":"Reading / Questions","originalNumber":1,"originalStem":"the process of growing and caring for something [blank]","kind":"adapted"},"stem":"As used in paragraph 1, what does “cultivation” mean?","options":[{"id":"A","text":"The process of making plastic models of trees.","why":"文中讨论有生命的植物及其养护，不是塑料模型。"},{"id":"B","text":"The process of growing and caring for plants.","why":"后文的修剪、塑形和养护提供语境支持。"},{"id":"C","text":"The process of buying paintings for a room.","why":"第 4 段虽提到艺术品展示，但不是 cultivation 的意思。"},{"id":"D","text":"The process of moving a family to a new country.","why":"与植物栽培的上下文无关。"}],"answer":"B","explanation":"第 1 段把 cultivation 与 miniature trees and plants 联系起来；第 2 段进一步说明主人要修剪、塑形和照料。词义是“栽培、培育”。","evidence":[{"paragraph":1,"quote":"It refers to the interesting combination of art and cultivation of miniature trees and plants.","why":"目标词与植物相连。"},{"paragraph":2,"quote":"The owner must then prune, trim, and shape the plant as it grows so that it resembles, in miniature, a much larger tree.","why":"后文具体说明培育过程，帮助确定词义。"}]},{"id":"R6-P008-B2-01","page":"P008","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P008","exercisePage":"P009","section":"Reading / Questions","originalNumber":10,"originalStem":"How are the cascade and semi-cascade styles of bonsai similar? [blank] [blank]","kind":"adapted"},"stem":"How are cascade and semi-cascade bonsai styles similar?","options":[{"id":"A","text":"Both have leaves and branches that grow downward toward the base of the plant.","why":"第 6 段先明确交代两种样式的共同点。"},{"id":"B","text":"Both must have perfectly straight trunks.","why":"这是 formal upright 的特点。"},{"id":"C","text":"Both must extend their leaves below the bottom of the container.","why":"伸到容器底部以下是文中所说的差别，不能当共同点。"},{"id":"D","text":"Both are made only by adding tiny buildings around the tree.","why":"添加小建筑是 bon-kei，不是这两种样式的定义。"}],"answer":"A","explanation":"先读第 6 段的 similar because，提取共同点；再读 main difference，防止把某一类特有的特征当作共有特征。","evidence":[{"paragraph":6,"quote":"Cascade and semi-cascade are similar because in both styles the leaves and the branches cascade down toward the base of the plant.","why":"这句话直接说明共同点。"},{"paragraph":6,"quote":"The main difference is that in the cascade style, the leaves actually extend below the bottom of the container.","why":"这句话说明区别，用来排除选项 C。"}]},{"id":"R6-P008-B1-01","page":"P008","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P008","exercisePage":"P009","section":"Reading / Questions","originalNumber":9,"originalStem":"What are the three elements needed to create a successful bonsai? [blank]","kind":"adapted"},"stem":"According to Japanese tradition in the passage, which three elements create a successful bonsai?","options":[{"id":"A","text":"Speed, size, and price.","why":"这三个条件没有在目标句中出现。"},{"id":"B","text":"Sunlight, buildings, and rocks.","why":"岩石和小建筑出现在另一种艺术形式的介绍中，不是原文的三个要素。"},{"id":"C","text":"Truth, goodness, and beauty.","why":"与第 3 段列出的三个要素完全对应。"},{"id":"D","text":"Age, height, and color.","why":"这些不是文中给出的三个传统要素。"}],"answer":"C","explanation":"According to… 是定位细节的提示。第 3 段冒号后直接列出 truth, goodness, and beauty，无需用自己的植物常识替换原文。","evidence":[{"paragraph":3,"quote":"According to Japanese tradition, three elements are necessary to create a successful bonsai: truth, goodness, and beauty.","why":"冒号后是本题要求的完整信息。"}]},{"id":"R6-P008-E1-01","page":"P008","skill":"E1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P008","exercisePage":"P009","section":"Reading / Questions","originalNumber":11,"originalStem":"What purpose would a reader have for reading this selection? - [blank] for pleasure or entertainment - [blank] for information - [blank] to form an opinion about bonsais","kind":"adapted"},"stem":"What would be a reader’s main purpose for reading this selection?","options":[{"id":"A","text":"To learn information about bonsai and its traditions.","why":"全文解释定义、养护、文化意义与样式，主要提供信息。"},{"id":"B","text":"To enjoy a fictional adventure about a talking tree.","why":"文章没有以虚构人物和冒险情节组织。"},{"id":"C","text":"To follow a complete, numbered guide to building a wooden tray.","why":"没有木托盘的材料清单或完整操作步骤。"},{"id":"D","text":"To decide which Japanese baseball team to support.","why":"棒球不是本篇话题。"}],"answer":"A","explanation":"本题沿用原书“读者为什么阅读这篇文章”的问法。文章主要提供关于盆栽的知识，属于获取信息的阅读目的。结尾鼓励有兴趣的人尝试，仍不改变全文的介绍重点。","evidence":[{"paragraph":1,"quote":"Bonsai originated in China more than 2,000 years ago.","why":"提供历史知识。"},{"paragraph":5,"quote":"There are five basic styles of bonsai: the formal upright, informal upright, slanting, cascade, and semi-cascade.","why":"提供样式分类信息。"},{"paragraph":7,"quote":"You will have to do a little research to make sure that you know how to properly care for your plant.","why":"提供养护方面的提示。"}]},{"id":"R6-P008-B5-01","page":"P008","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P008","exercisePage":"P009","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"A bonsai has downward-growing branches, and its leaves extend below the bottom of the container. Which style best matches the description?","options":[{"id":"A","text":"Formal upright.","why":"formal upright 的说明重点是笔直的树干和均衡的枝条。"},{"id":"B","text":"Cascade.","why":"第 6 段给出的区分条件正是 leaves extend below the bottom of the container。"},{"id":"C","text":"Semi-cascade.","why":"两者都向下生长，但题目额外给出伸到容器底部以下，应选 cascade。"},{"id":"D","text":"Bon-kei.","why":"bon-kei 是添加岩石、小建筑和小人物的布景形式。"}],"answer":"B","explanation":"把文中的分类定义用于新描述。只看“向下生长”还不能在 cascade 和 semi-cascade 中确定；“低于容器底部”才是本题的关键限定。","evidence":[{"paragraph":6,"quote":"Cascade and semi-cascade are similar because in both styles the leaves and the branches cascade down toward the base of the plant.","why":"先识别两类共有的特征。"},{"paragraph":6,"quote":"The main difference is that in the cascade style, the leaves actually extend below the bottom of the container.","why":"再用区别条件把新例子归为 cascade。"}]},{"id":"R6-P010-A1-01","page":"P010","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P010","exercisePage":"P011","section":"Reading / Questions","originalNumber":4,"originalStem":"Check the sentence that best states the main idea of the selection, or tells what the passage is mostly about. - _____ Alice Waters owns Chez Panisse Restaurant in California. - _____ Students look forward to the time they spend gardening each week. - _____ Alice Waters founded the Edible Schoolyard, a program in which students learn to grow and prepare their own foods.","kind":"adapted"},"stem":"Which sentence best states the main idea of the passage?","options":[{"id":"A","text":"Students should replace all classroom lessons with gardening.","why":""},{"id":"B","text":"All school gardens must grow exactly the same crops.","why":""},{"id":"C","text":"Chez Panisse is a restaurant that serves only middle school students.","why":""},{"id":"D","text":"Alice Waters created a school program in which students grow food and learn to prepare it.","why":"主旨要同时覆盖种植、烹饪和教育目标。作物名单和餐馆只是细节，原文也没有主张取消课堂。"}],"answer":"D","explanation":"主旨要同时覆盖种植、烹饪和教育目标。作物名单和餐馆只是细节，原文也没有主张取消课堂。","evidence":[{"page":"P010","paragraph":2,"quote":"Waters worked with the school's principal, Neil Smith, to create a cooking and gardening program at the school.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P010","paragraph":5,"quote":"They have learned how to weed, prune, and harvest.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P010-C5-01","page":"P010","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P010","exercisePage":"P011","section":"Reading / Questions","originalNumber":6,"originalStem":"goes together _________________________________________________","kind":"adapted"},"stem":"In paragraph 2, what does “go hand in hand” mean?","options":[{"id":"A","text":"Must be carried by hand.","why":""},{"id":"B","text":"Cannot exist at the same time.","why":""},{"id":"C","text":"Have exactly the same meaning.","why":""},{"id":"D","text":"Are closely connected and work together.","why":"这句把健康的身体与健康的环境联系起来。hand in hand 表示密切相关，不是在描述手的动作。"}],"answer":"D","explanation":"这句把健康的身体与健康的环境联系起来。hand in hand 表示密切相关，不是在描述手的动作。","evidence":[{"page":"P010","paragraph":2,"quote":"She wanted to teach them that a healthy body and a healthy environment go hand in hand.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P010-F2-01","page":"P010","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P010","exercisePage":"P011","section":"Reading / Questions","originalNumber":5,"originalStem":"Check the words that describe Alice Waters. - _____ generous - _____ unfriendly - _____ talented - _____ ambitious - _____ stingy","kind":"adapted"},"stem":"Which description best fits Alice Waters?","options":[{"id":"A","text":"Stingy and interested only in making money.","why":""},{"id":"B","text":"Unfriendly, careless, and unwilling to help.","why":""},{"id":"C","text":"Indifferent to students and their health.","why":""},{"id":"D","text":"Generous, talented, and ambitious.","why":"她投入时间、组织各方帮助并希望每所学校都拥有花园，支持慷慨、有能力、有抱负的评价。"}],"answer":"D","explanation":"她投入时间、组织各方帮助并希望每所学校都拥有花园，支持慷慨、有能力、有抱负的评价。","evidence":[{"page":"P010","paragraph":3,"quote":"The project that Waters began took a lot of time and patience.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P010","paragraph":6,"quote":"Alice Waters dreams that one day there will be a garden in every school in the United States.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P012-F1-01","page":"P012","skill":"F1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P012","exercisePage":"P013","section":"Reading / Questions","originalNumber":10,"originalStem":"What is the setting for this story? ____________________________________________________________","kind":"adapted"},"stem":"Where and when are the students planning their garden?","options":[{"id":"A","text":"In a classroom during a winter morning.","why":""},{"id":"B","text":"In a cafeteria during a spring lunch.","why":""},{"id":"C","text":"At a picnic table in a park on a fall afternoon.","why":"第1段直接交代地点、季节和时段。不要把他们希望建花园的学校误当成此刻讨论计划的地点。"},{"id":"D","text":"At a nursery on a summer evening.","why":""}],"answer":"C","explanation":"第1段直接交代地点、季节和时段。不要把他们希望建花园的学校误当成此刻讨论计划的地点。","evidence":[{"page":"P012","paragraph":1,"quote":"Drew, Emilio, and Michi sat at a picnic table in the park on a beautiful, crisp fall afternoon.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P012-F4-01","page":"P012","skill":"F4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P012","exercisePage":"P013","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which description identifies the story’s narrator?","options":[{"id":"A","text":"The school principal writes a letter about her memories.","why":""},{"id":"B","text":"An outside narrator tells what Drew, Emilio, and Michi do.","why":"叙述使用人物姓名和 they，从故事外讲述三人的行动；对话中的 I 属于说话人物，不能据此把整篇判为第一人称。"},{"id":"C","text":"Emilio’s aunt describes her own gardening business.","why":""},{"id":"D","text":"Drew tells the whole story using “I.”","why":""}],"answer":"B","explanation":"叙述使用人物姓名和 they，从故事外讲述三人的行动；对话中的 I 属于说话人物，不能据此把整篇判为第一人称。","evidence":[{"page":"P012","paragraph":1,"quote":"Drew, Emilio, and Michi sat at a picnic table in the park on a beautiful, crisp fall afternoon.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P012","paragraph":4,"quote":"Drew opened his notebook and prepared to record any ideas they had for convincing Ms.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P012-C5-01","page":"P012","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P012","exercisePage":"P013","section":"Reading / Questions","originalNumber":9,"originalStem":"to start something____________________________________________________________","kind":"adapted"},"stem":"What does “get this project up and running” mean?","options":[{"id":"A","text":"Get the project started and working.","why":"这里讨论筹款启动花园项目，up and running 表示开始运作，不是字面上的跑步。"},{"id":"B","text":"Stop the project before it begins.","why":""},{"id":"C","text":"Move the garden onto the roof.","why":""},{"id":"D","text":"Make the students compete in a race.","why":""}],"answer":"A","explanation":"这里讨论筹款启动花园项目，up and running 表示开始运作，不是字面上的跑步。","evidence":[{"page":"P012","paragraph":6,"quote":"“We might need donations to get this project up and running,” added Michi.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P014-E1-01","page":"P014","skill":"E1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P014","exercisePage":"P015","section":"Reading / Questions","originalNumber":7,"originalStem":"Check the phrase that best describes the author’s purpose. - ____ to tell a story about a family who makes a lasagna - ____ to explain how to make lasagna - ____ to persuade the reader to make lasagna for dinner","kind":"adapted"},"stem":"What is the main purpose of this selection?","options":[{"id":"A","text":"To persuade readers never to eat vegetables.","why":""},{"id":"B","text":"To describe the history of Italian restaurants.","why":""},{"id":"C","text":"To tell a fictional adventure about a chef.","why":""},{"id":"D","text":"To explain how to prepare garden lasagna.","why":"材料、器具和按顺序排列的操作步骤共同服务于制作一道菜，属于指导性实用文本。"}],"answer":"D","explanation":"材料、器具和按顺序排列的操作步骤共同服务于制作一道菜，属于指导性实用文本。","evidence":[{"page":"P014","paragraph":2,"quote":"Cook the noodles in boiling water for 8 to 10 minutes, stirring occasionally.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P014","paragraph":7,"quote":"Cover the dish with foil, and bake for 20 minutes.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P014-B2-01","page":"P014","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P014","exercisePage":"P015","section":"Reading / Questions","originalNumber":2,"originalStem":"Number the tasks below to show the order in which they should be done. - ____ Combine the cheeses, eggs, and spices. - ____ Ask an adult to drain the lasagna noodles. - ____ Boil a pot of water. - ____ Simmer the vegetable mixture. - ____ Allow the lasagna to cool.","kind":"adapted"},"stem":"Which sequence follows the recipe?","options":[{"id":"A","text":"Prepare the vegetables → serve the lasagna → boil the noodles → bake it.","why":""},{"id":"B","text":"Bake the lasagna → boil the noodles → prepare the vegetables → combine the cheeses.","why":""},{"id":"C","text":"Combine the cheeses → bake the lasagna → boil the noodles → prepare the vegetables.","why":""},{"id":"D","text":"Boil the noodles → prepare the vegetable mixture → combine cheeses and spices → bake the lasagna.","why":"按第2、3、4、7步的先后排序。最后烘烤和冷却不能提前到煮面之前。"}],"answer":"D","explanation":"按第2、3、4、7步的先后排序。最后烘烤和冷却不能提前到煮面之前。","evidence":[{"page":"P014","paragraph":2,"quote":"Cook the noodles in boiling water for 8 to 10 minutes, stirring occasionally.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P014","paragraph":3,"quote":"Cook the diced bell peppers and onion in olive oil in a large saucepan until the onions are translucent.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P014","paragraph":4,"quote":"In a medium bowl, combine 1/4 cup of the Parmesan cheese with the ricotta cheese, mozzarella cheese, eggs, black pepper, and oregano.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P014","paragraph":7,"quote":"Cover the dish with foil, and bake for 20 minutes.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P014-B1-01","page":"P014","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P014","exercisePage":"P015","section":"Reading / Questions","originalNumber":5,"originalStem":"What is the total amount of time the lasagna will bake? ________________________________________","kind":"adapted"},"stem":"How long does the lasagna bake in total?","options":[{"id":"A","text":"10 minutes.","why":""},{"id":"B","text":"20 minutes.","why":""},{"id":"C","text":"30 minutes.","why":"第7步先盖锡纸烤20分钟，再去掉锡纸烤10分钟，总计30分钟；冷却时间不属于烘烤时间。"},{"id":"D","text":"40 minutes.","why":""}],"answer":"C","explanation":"第7步先盖锡纸烤20分钟，再去掉锡纸烤10分钟，总计30分钟；冷却时间不属于烘烤时间。","evidence":[{"page":"P014","paragraph":7,"quote":"Cover the dish with foil, and bake for 20 minutes.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P014","paragraph":7,"quote":"Remove the foil, and bake for 10 more minutes so the cheese can brown.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P014-E5-01","page":"P014","skill":"E5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P014","exercisePage":"P015","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Who is the recipe especially suited for, based on its safety instructions?","options":[{"id":"A","text":"People who want only the history of farming.","why":""},{"id":"B","text":"Young cooks working with adult supervision.","why":"安全提示明确要求使用炉灶和刀具时有成人监督，步骤中也要求成人帮助倒面条，支持“有成人陪同的年轻厨师”。"},{"id":"C","text":"Professional pilots planning a flight.","why":""},{"id":"D","text":"Children who must use knives and the stove alone.","why":""}],"answer":"B","explanation":"安全提示明确要求使用炉灶和刀具时有成人监督，步骤中也要求成人帮助倒面条，支持“有成人陪同的年轻厨师”。","evidence":[{"page":"P014","paragraph":"u2","quote":"- Never use the stove or a knife without an adult’s supervision. - Always remember to keep the handle of the skillet turned in so you cannot accidentally bump into it.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P014","paragraph":2,"quote":"Have an adult pour the noodles into a colander in the sink.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P016-F3-01","page":"P016","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P016","exercisePage":"P017","section":"Reading / Questions","originalNumber":9,"originalStem":"List three adjectives that describe how you think Drew, Emilio, and Michi feel at the end of the story. ________________","kind":"adapted"},"stem":"How do Drew, Emilio, and Michi most likely feel at the end?","options":[{"id":"A","text":"Proud and happy about their successful work.","why":"三人展示纪念石并笑着接受掌声，说明他们为成功和认可感到自豪、开心。"},{"id":"B","text":"Relieved that nobody noticed their efforts.","why":""},{"id":"C","text":"Ashamed that their garden failed.","why":""},{"id":"D","text":"Angry that their families refused to attend.","why":""}],"answer":"A","explanation":"三人展示纪念石并笑着接受掌声，说明他们为成功和认可感到自豪、开心。","evidence":[{"page":"P016","paragraph":8,"quote":"“As a thank-you to these students for their creative idea, hard work, and perseverance, they have each received a stepping stone for the garden.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P016","paragraph":10,"quote":"Drew, Emilio, and Michi held up their stepping stones and grinned as the crowd clapped.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P016-C1-01","page":"P016","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P016","exercisePage":"P017","section":"Reading / Questions","originalNumber":8,"originalStem":"In paragraph 8, what does perseverance mean? ________________","kind":"adapted"},"stem":"In paragraph 8, what does “perseverance” mean?","
