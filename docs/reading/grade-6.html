options":[{"id":"A","text":"Doing a task only when nobody is watching.","why":""},{"id":"B","text":"Giving up as soon as a task becomes hard.","why":""},{"id":"C","text":"Being able to cook without any ingredients.","why":""},{"id":"D","text":"Continuing to work toward a goal despite difficulty.","why":"筹备花园经历了长期努力，校长表扬的是坚持完成项目的品质。perseverance 不是一次碰巧成功。"}],"answer":"D","explanation":"筹备花园经历了长期努力，校长表扬的是坚持完成项目的品质。perseverance 不是一次碰巧成功。","evidence":[{"page":"P016","paragraph":7,"quote":"I was a bit skeptical at first, but they had thought through everything.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P016","paragraph":8,"quote":"“As a thank-you to these students for their creative idea, hard work, and perseverance, they have each received a stepping stone for the garden.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P016-B1-01","page":"P016","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P016","exercisePage":"P017","section":"Reading / Questions","originalNumber":7,"originalStem":"About how much of the food the students served did they grow themselves? ________________ ________________","kind":"adapted"},"stem":"About how much of the food at the meal came from the school garden?","options":[{"id":"A","text":"About three-quarters.","why":"校长在第7段直接给出 about three-quarters。about 表示大约，不能改成全部。"},{"id":"B","text":"All of it, with no exceptions.","why":""},{"id":"C","text":"Exactly one-half.","why":""},{"id":"D","text":"About one-quarter.","why":""}],"answer":"A","explanation":"校长在第7段直接给出 about three-quarters。about 表示大约，不能改成全部。","evidence":[{"page":"P016","paragraph":7,"quote":"About three-quarters of the food you’ll be enjoying tonight came from the school garden.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P018-B4-01","page":"P018","skill":"B4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P018","exercisePage":"P019","section":"Reading / Questions","originalNumber":7,"originalStem":"Find one sentence that shows Savannah was frightened by the screaming she heard. ________________________________","kind":"adapted"},"stem":"Which sentence best shows that Savannah was frightened?","options":[{"id":"A","text":"She lay stiffly and silently in her bed waiting to see what would happen.","why":"身体僵住并安静等待直接表现恐惧。父亲打鼾、母亲找鞋和后来的笑都不能同样直接证明 Savannah 当时害怕。"},{"id":"B","text":"Savannah and her mom just laughed.","why":""},{"id":"C","text":"Savannah’s dad continued to snore.","why":""},{"id":"D","text":"Savannah’s mom finally found her slippers and motioned Savannah toward the bedroom door.","why":""}],"answer":"A","explanation":"身体僵住并安静等待直接表现恐惧。父亲打鼾、母亲找鞋和后来的笑都不能同样直接证明 Savannah 当时害怕。","evidence":[{"page":"P018","paragraph":2,"quote":"She lay stiffly and silently in her bed waiting to see what would happen.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P018-E4-01","page":"P018","skill":"E4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P018","exercisePage":"P019","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What atmosphere is created near the beginning of the story?","options":[{"id":"A","text":"Festive and cheerful.","why":""},{"id":"B","text":"Tense and frightening.","why":"bloodcurdling scream、stiffly 和反复出现的尖叫共同营造紧张可怕的氛围。这是在分析描写的整体效果。"},{"id":"C","text":"Boring and routine.","why":""},{"id":"D","text":"Proud and triumphant.","why":""}],"answer":"B","explanation":"bloodcurdling scream、stiffly 和反复出现的尖叫共同营造紧张可怕的氛围。这是在分析描写的整体效果。","evidence":[{"page":"P018","paragraph":2,"quote":"It felt as though Savannah had been sleeping for only a few minutes when she awoke with a start to a terrible, bloodcurdling scream.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P018","paragraph":2,"quote":"This scream was followed by a series of wails and shrieks.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P018-B3-01","page":"P018","skill":"B3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P018","exercisePage":"P019","section":"Reading / Questions","originalNumber":8,"originalStem":"If Savannah hears a barn owl again someday, do you think she will be frightened? Why or why not? ________________________________ ________________________________","kind":"adapted"},"stem":"How would Savannah probably react if she heard the same owl again?","options":[{"id":"A","text":"She would be certain the sound came from a human.","why":""},{"id":"B","text":"She would know that her father was making the sound.","why":""},{"id":"C","text":"She would probably be less frightened because she now recognizes the sound.","why":"辨认声音后，尖叫已经不再那么吓人；这个变化支持以后更镇定的预测，不能扩大为永远不会害怕任何声音。"},{"id":"D","text":"She would have no way to connect it with an owl.","why":""}],"answer":"C","explanation":"辨认声音后，尖叫已经不再那么吓人；这个变化支持以后更镇定的预测，不能扩大为永远不会害怕任何声音。","evidence":[{"page":"P018","paragraph":9,"quote":"“I feel so much better,” said Savannah with relief in her voice.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P018","paragraph":10,"quote":"They heard the owl’s cries one more time before they drifted back to sleep, but it didn’t sound nearly as frightening anymore.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P018","paragraph":11,"quote":"In the morning, Savannah and her mom were able to identify the owl from the night before as a barn owl.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P020-A3-01","page":"P020","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P020","exercisePage":"P021","section":"Reading / Questions","originalNumber":7,"originalStem":"A summary is a short sentence that tells the most important facts about a topic. Check the sentence below that is the best summary for paragraph 3. - ____ Owls hunt at night. - ____ Owls have a sharp sense of hearing, which helps them to be strong night hunters. - ____ Some owls’ ear openings are positioned asymmetrically.","kind":"adapted"},"stem":"Which sentence best summarizes paragraph 3?","options":[{"id":"A","text":"Ancient paintings always show owls hunting.","why":""},{"id":"B","text":"All owls have heart-shaped faces.","why":""},{"id":"C","text":"Owls can turn their heads exactly one full circle.","why":""},{"id":"D","text":"Owls have a sharp sense of hearing that helps them hunt at night.","why":"第3段的多个听觉细节共同说明听力怎样帮助夜间捕猎。脸形、转头和古代绘画属于其他段落。"}],"answer":"D","explanation":"第3段的多个听觉细节共同说明听力怎样帮助夜间捕猎。脸形、转头和古代绘画属于其他段落。","evidence":[{"page":"P020","paragraph":3,"quote":"One attribute that is common to all owls is their sharp sense of hearing.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P020","paragraph":3,"quote":"This is important to the owl’s keen sense of hearing because it allows the owl to more accurately locate the source of the sounds.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P020-B2-01","page":"P020","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P020","exercisePage":"P021","section":"Reading / Questions","originalNumber":2,"originalStem":"Why is the owl’s sense of hearing important to its survival? ________________________________________","kind":"adapted"},"stem":"Why is hearing especially important to an owl’s survival?","options":[{"id":"A","text":"It lets the owl see clearly at every distance.","why":""},{"id":"B","text":"It changes the owl’s face from round to heart-shaped.","why":""},{"id":"C","text":"It prevents the owl from ever needing food.","why":""},{"id":"D","text":"It helps an owl locate prey while hunting at night.","why":"夜间视觉条件受限，听力让猫头鹰定位猎物；要把“夜间捕食”这个条件和听觉作用连接起来。"}],"answer":"D","explanation":"夜间视觉条件受限，听力让猫头鹰定位猎物；要把“夜间捕食”这个条件和听觉作用连接起来。","evidence":[{"page":"P020","paragraph":3,"quote":"Because they hunt at night, hearing is especially important to their survival.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P020","paragraph":3,"quote":"This is important to the owl’s keen sense of hearing because it allows the owl to more accurately locate the source of the sounds.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P020-C1-01","page":"P020","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P020","exercisePage":"P021","section":"Reading / Questions","originalNumber":9,"originalStem":"In paragraph 4, enhances means - ____ makes weaker - ____ makes better or stronger - ____ changes","kind":"adapted"},"stem":"In paragraph 4, “enhances” most nearly means:","options":[{"id":"A","text":"Makes impossible.","why":""},{"id":"B","text":"Completely removes.","why":""},{"id":"C","text":"Makes better or stronger.","why":"在昏暗光线中看得好，有助于捕猎，所以 enhances 是“提升、加强”，不是削弱。"},{"id":"D","text":"Makes weaker.","why":""}],"answer":"C","explanation":"在昏暗光线中看得好，有助于捕猎，所以 enhances 是“提升、加强”，不是削弱。","evidence":[{"page":"P020","paragraph":4,"quote":"However, they can see well in dim light, which enhances their hunting skills.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P022-A1-01","page":"P022","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P022","exercisePage":"P023","section":"Reading / Questions","originalNumber":9,"originalStem":"What is the main idea of this selection? ________________________________________ ________________________________________","kind":"adapted"},"stem":"Which sentence best states the main idea?","options":[{"id":"A","text":"Lighthouses have long helped sailors stay safe and remain important parts of coastal history.","why":"全文从航海安全、技术发展讲到历史保护，主旨应覆盖主要功能和历史价值，不能只抓游客或材料等一个细节。"},{"id":"B","text":"Every lighthouse is built from the same material.","why":""},{"id":"C","text":"Lighthouses are useful only as private homes.","why":""},{"id":"D","text":"The only purpose of a lighthouse is to attract photographers.","why":""}],"answer":"A","explanation":"全文从航海安全、技术发展讲到历史保护，主旨应覆盖主要功能和历史价值，不能只抓游客或材料等一个细节。","evidence":[{"page":"P022","paragraph":2,"quote":"They project a strong beam of light that alerts sailors of their location.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P022","paragraph":9,"quote":"If you ever have a chance to visit one, getting a glimpse of history is worth the trip.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P022-C1-01","page":"P022","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P022","exercisePage":"P023","section":"Reading / Questions","originalNumber":8,"originalStem":"In paragraph 3, what does the word automated mean? ________________________________________","kind":"adapted"},"stem":"In paragraph 3, what does “automated” mean?","options":[{"id":"A","text":"Abandoned and no longer usable.","why":""},{"id":"B","text":"Able to operate automatically rather than needing a keeper to run it.","why":"which means 后的说明直接解释 automated：不再需要灯塔守护人，是自动运行而不是废弃。"},{"id":"C","text":"Made entirely of wood.","why":""},{"id":"D","text":"Moved to a different coastline.","why":""}],"answer":"B","explanation":"which means 后的说明直接解释 automated：不再需要灯塔守护人，是自动运行而不是废弃。","evidence":[{"page":"P022","paragraph":3,"quote":"Today, almost all lighthouses are automated, which means that there is no longer a need for lighthouse keepers.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P022-D4-01","page":"P022","skill":"D4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P022","exercisePage":"P023","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Why does the author mention Homer’s The Iliad?","options":[{"id":"A","text":"To teach readers how to write an epic poem.","why":""},{"id":"B","text":"To provide evidence that the idea of a lighthouse is very old.","why":"作者用古代作品中出现灯塔的记载说明其悠久历史。问的是这一资料的作用，不是诗本身写了什么。"},{"id":"C","text":"To prove that all early lighthouses used electricity.","why":""},{"id":"D","text":"To show that every lighthouse was built by Homer.","why":""}],"answer":"B","explanation":"作者用古代作品中出现灯塔的记载说明其悠久历史。问的是这一资料的作用，不是诗本身写了什么。","evidence":[{"page":"P022","paragraph":4,"quote":"In the poem, Homer refers to a lighthouse, giving modern scholars an idea of how long lighthouses have been a part of human life.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P024-F4-01","page":"P024","skill":"F4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P024","exercisePage":"P025","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How does the point of view change in paragraphs 4–5?","options":[{"id":"A","text":"The cat becomes the narrator of the entire passage.","why":""},{"id":"B","text":"An outside account of Paloma changes to the first-person voice inside the story she is writing.","why":"第3段说她开始写故事，第4、5段用 I 进入她创作的灯塔情境，第6段再回到 Paloma。区分外层叙述和内层故事。"},{"id":"C","text":"Paloma begins quoting her teacher’s autobiography.","why":""},{"id":"D","text":"The whole passage changes into a letter written by her parents.","why":""}],"answer":"B","explanation":"第3段说她开始写故事，第4、5段用 I 进入她创作的灯塔情境，第6段再回到 Paloma。区分外层叙述和内层故事。","evidence":[{"page":"P024","paragraph":3,"quote":"Without thinking about it any longer, Paloma began to write the story.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P024","paragraph":4,"quote":"I sat with Sadie curled on my lap and looked out the window at the crashing waves.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P024","paragraph":6,"quote":"Paloma stopped and reread what she had just written.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P024-F6-01","page":"P024","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P024","exercisePage":"P025","section":"Reading / Questions","originalNumber":9,"originalStem":"________________________________________ ________________________________________","kind":"adapted"},"stem":"In “The heavy rain beat against my lighthouse like a thousand footsteps,” what is compared?","options":[{"id":"A","text":"The sunlight and a warm blanket.","why":""},{"id":"B","text":"The cat and a lighthouse keeper.","why":""},{"id":"C","text":"A computer and an island.","why":""},{"id":"D","text":"The sound of rain and the sound of many running footsteps.","why":"like 把雨拍打灯塔的声音比作大量脚步声，突出风雨的强烈和紧张感；不是说真有人在墙上跑。"}],"answer":"D","explanation":"like 把雨拍打灯塔的声音比作大量脚步声，突出风雨的强烈和紧张感；不是说真有人在墙上跑。","evidence":[{"page":"P024","paragraph":4,"quote":"The heavy rain beat against my lighthouse like a thousand footsteps racing up and down the walls.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P024-D1-01","page":"P024","skill":"D1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P024","exercisePage":"P025","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What happens to the focus of the passage in paragraph 6?","options":[{"id":"A","text":"It changes from Paloma to the life of a real lighthouse inventor.","why":""},{"id":"B","text":"It continues only as the cat’s account of the hurricane.","why":""},{"id":"C","text":"It begins giving instructions for building a lighthouse.","why":""},{"id":"D","text":"It returns from the imagined lighthouse scene to Paloma writing at the computer.","why":"前两段内层故事用 I，到了第6段 Paloma 停下来重读，关注点回到写作现场。焦点变化不只是代词换了。"}],"answer":"D","explanation":"前两段内层故事用 I，到了第6段 Paloma 停下来重读，关注点回到写作现场。焦点变化不只是代词换了。","evidence":[{"page":"P024","paragraph":5,"quote":"I knew that my lighthouse was sturdily built.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P024","paragraph":6,"quote":"Paloma stopped and reread what she had just written.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P026-A1-01","page":"P026","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P026","exercisePage":"P027","section":"Reading / Questions","originalNumber":3,"originalStem":"Check the sentence that best states the main idea of the passage. - _____ The Cape Hatteras Lighthouse in Buxton, North Carolina, is the tallest lighthouse in the United States. - _____ The process used to move the Cape Hatteras Lighthouse was very slow. - _____ In 1999, the Cape Hatteras Lighthouse was moved further inland to prevent its destruction due to erosion.","kind":"adapted"},"stem":"What is the main idea of the passage?","options":[{"id":"A","text":"Cape Hatteras Lighthouse was built as a train station.","why":""},{"id":"B","text":"Every American lighthouse must be moved each year.","why":""},{"id":"C","text":"Cape Hatteras Lighthouse was moved inland in 1999 to save it from coastal erosion.","why":"搬迁的原因、争论、过程和结果都围绕拯救灯塔这一主线，不是单讲高度或铁路。"},{"id":"D","text":"The move was stopped because nobody wanted to preserve the lighthouse.","why":""}],"answer":"C","explanation":"搬迁的原因、争论、过程和结果都围绕拯救灯塔这一主线，不是单讲高度或铁路。","evidence":[{"page":"P026","paragraph":3,"quote":"Experts were worried that continued erosion by the pounding waves of the ocean would destroy the lighthouse.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P026","paragraph":7,"quote":"The Cape Hatteras Lighthouse survived the move and has settled into its new home.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P026-B1-01","page":"P026","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P026","exercisePage":"P027","section":"Reading / Questions","originalNumber":5,"originalStem":"What is one reason that some people protested moving the lighthouse? ________________________________________________________________________ ________________________________________________________________________","kind":"adapted"},"stem":"Which reason did some people give for opposing the move?","options":[{"id":"A","text":"They believed the lighthouse had never helped sailors.","why":""},{"id":"B","text":"They thought the cost was not justified.","why":"第4段明确说，有人认为搬迁不值得花980万美元；这与是否重要的价值判断有关。"},{"id":"C","text":"They thought it would move too quickly for anyone to see.","why":""},{"id":"D","text":"They wanted the lighthouse to become a professional stadium.","why":""}],"answer":"B","explanation":"第4段明确说，有人认为搬迁不值得花980万美元；这与是否重要的价值判断有关。","evidence":[{"page":"P026","paragraph":4,"quote":"Others thought that moving the lighthouse was not important enough to justify spending the 9.8 million dollars the move would cost.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P026-D2-01","page":"P026","skill":"D2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P026","exercisePage":"P027","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"In paragraph 3, “This is exactly why” points back mainly to what idea?","options":[{"id":"A","text":"The lighthouse had never survived a storm.","why":""},{"id":"B","text":"Every visitor preferred a slow journey.","why":""},{"id":"C","text":"The lighthouse was already a private house.","why":""},{"id":"D","text":"The lighthouse had faithfully protected sailors from harm.","why":"This 指向紧前一句灯塔保护航海者的作用，用来解释为什么值得保存；侵蚀则是需要搬迁的直接威胁。"}],"answer":"D","explanation":"This 指向紧前一句灯塔保护航海者的作用，用来解释为什么值得保存；侵蚀则是需要搬迁的直接威胁。","evidence":[{"page":"P026","paragraph":3,"quote":"The Cape Hatteras Lighthouse faithfully did its duty in protecting sailors from harm.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P026","paragraph":3,"quote":"This is exactly why it was determined that the lighthouse would have to be preserved.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P028-F2-01","page":"P028","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P028","exercisePage":"P029","section":"Reading / Questions","originalNumber":1,"originalStem":"Check the words that best describe Ida Lewis. - ____ hardworking - ____ strong-willed - ____ determined - ____ unpredictable - ____ nosy","kind":"adapted"},"stem":"Which traits are best supported for Ida Lewis?","options":[{"id":"A","text":"Hardworking, determined, and strong-willed.","why":"长期承担守塔职责并多次救人，支持勤劳坚定；她对公众关注不适应，不能说她只追求名气。"},{"id":"B","text":"Careless about the people near the lighthouse.","why":""},{"id":"C","text":"Interested only in becoming famous.","why":""},{"id":"D","text":"Lazy, unreliable, and afraid to help.","why":""}],"answer":"A","explanation":"长期承担守塔职责并多次救人，支持勤劳坚定；她对公众关注不适应，不能说她只追求名气。","evidence":[{"page":"P028","paragraph":3,"quote":"Captain Lewis lived about 20 years longer, but Ida and her mother performed all the required duties of a keeper.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P028","paragraph":4,"quote":"However, during her 39 years keeping the light at Lime Rock, Ida rescued between 18 and 25 people.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P028-F3-01","page":"P028","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P028","exercisePage":"P029","section":"Reading / Questions","originalNumber":7,"originalStem":"Why did all the attention make Ida uncomfortable? ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"Why did so much attention make Ida uncomfortable?","options":[{"id":"A","text":"She believed rescuing people was unimportant.","why":""},{"id":"B","text":"She wanted visitors to pay a larger admission fee.","why":""},{"id":"C","text":"She had never worked at Lime Rock.","why":""},{"id":"D","text":"She was used to the quiet solitude of lighthouse life.","why":"第5段把原来的安静独处生活与大量来访者对照，直接解释她的不适。"}],"answer":"D","explanation":"第5段把原来的安静独处生活与大量来访者对照，直接解释她的不适。","evidence":[{"page":"P028","paragraph":5,"quote":"Ida was used to the quiet solitude of a lighthouse keeper’s life, and she was uncomfortable with all the attention.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P028-A3-01","page":"P028","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P028","exercisePage":"P029","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which summary best covers the selection?","options":[{"id":"A","text":"Lighthouse keepers spent their days welcoming crowds of tourists.","why":""},{"id":"B","text":"Ida Lewis designed the first automated lighthouse lens.","why":""},{"id":"C","text":"Lime Rock was a famous place to buy boats.","why":""},{"id":"D","text":"Women, including Ida Lewis, performed demanding lighthouse work, saved lives, and earned recognition.","why":"前两段交代女性守塔人的背景，后文用 Ida 的职责、救援和表彰展开；概括要把背景与核心人物连接起来。"}],"answer":"D","explanation":"前两段交代女性守塔人的背景，后文用 Ida 的职责、救援和表彰展开；概括要把背景与核心人物连接起来。","evidence":[{"page":"P028","paragraph":2,"quote":"Women proved themselves to be equally capable of holding this difficult job that was as much a way of life as it was a career.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P028","paragraph":4,"quote":"However, during her 39 years keeping the light at Lime Rock, Ida rescued between 18 and 25 people.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P028","paragraph":6,"quote":"In 1924, Lime Rock was renamed Ida Lewis Rock in honor of the keeper who had died in 1911.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P030-F1-01","page":"P030","skill":"F1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P030","exercisePage":"P031","section":"Reading / Questions","originalNumber":9,"originalStem":"During what time of day does the story take place? How can you tell? ________________________________________ ________________________________________","kind":"adapted"},"stem":"When does the scene take place?","options":[{"id":"A","text":"At midnight while everyone is asleep.","why":""},{"id":"B","text":"In the afternoon after a basketball match.","why":""},{"id":"C","text":"During an evening meal in a restaurant.","why":""},{"id":"D","text":"In the morning during the family’s breakfast.","why":"母亲明确说早上七点，家人吃早餐和看报等细节也一致支持这一时段。"}],"answer":"D","explanation":"母亲明确说早上七点，家人吃早餐和看报等细节也一致支持这一时段。","evidence":[{"page":"P030","paragraph":4,"quote":"“I’m just not sure that a picture of me in my pajamas pouring orange juice at 7 o’clock in the morning is the most interesting part of your day.”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P030","paragraph":13,"quote":"Dante laughed as he got up from the breakfast table.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P030-F2-01","page":"P030","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P030","exercisePage":"P031","section":"Reading / Questions","originalNumber":6,"originalStem":"The protagonist is the main character in a story, or the person the story is mostly about. Who is the protagonist in this story? ________________________________________ ________________________________________","kind":"adapted"},"stem":"Who is the protagonist of this story?","options":[{"id":"A","text":"The teacher who invented the camera.","why":""},{"id":"B","text":"A stranger at a photography museum.","why":""},{"id":"C","text":"Dante.","why":"主要事件围绕 Dante 完成照片日记的作业展开，母亲、弟弟和父亲都参与了他的经历。"},{"id":"D","text":"A professional basketball coach.","why":""}],"answer":"C","explanation":"主要事件围绕 Dante 完成照片日记的作业展开，母亲、弟弟和父亲都参与了他的经历。","evidence":[{"page":"P030","paragraph":3,"quote":"“For the next two days, I’m going to keep a photo diary of my life.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P030-F3-01","page":"P030","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P030","exercisePage":"P031","section":"Reading / Questions","originalNumber":8,"originalStem":"Why does Wesley joke that photos of him will be valuable one day? ________________________________________ ________________________________________","kind":"adapted"},"stem":"Why does Wesley joke that his pictures may become valuable?","options":[{"id":"A","text":"He wants Dante to stop taking photographs forever.","why":""},{"id":"B","text":"He plans to sell the family’s camera that morning.","why":""},{"id":"C","text":"He knows the photographs are made of gold.","why":""},{"id":"D","text":"He imagines becoming a famous professional basketball player.","why":"When I make it into the NBA 表明他在想象未来成名，是开玩笑式的自信，不能当成已经进入 NBA 的事实。"}],"answer":"D","explanation":"When I make it into the NBA 表明他在想象未来成名，是开玩笑式的自信，不能当成已经进入 NBA 的事实。","evidence":[{"page":"P030","paragraph":12,"quote":"“When I make it into the NBA, those pictures will probably be pretty valuable,” he joked.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P032-B5-01","page":"P032","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P032","exercisePage":"P033","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"To photograph a fast-running animal when a fast shutter lets in too little light, what adjustment follows the passage?","options":[{"id":"A","text":"Leave the shutter open for a very long time and narrow the aperture.","why":""},{"id":"B","text":"Close the aperture completely.","why":""},{"id":"C","text":"Remove all light-sensitive parts of the camera.","why":""},{"id":"D","text":"Keep the shutter fast and open the aperture wider.","why":"先用快门速度避免运动模糊，再加大光圈补足光线。两项设置需要配合，不能只看其中一个条件。"}],"answer":"D","explanation":"先用快门速度避免运动模糊，再加大光圈补足光线。两项设置需要配合，不能只看其中一个条件。","evidence":[{"page":"P032","paragraph":4,"quote":"A quick shutter speed is also needed when you want to capture something that is moving.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P032","paragraph":7,"quote":"To compensate, you need to open the aperture wider so that the proper amount of light reaches the film.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P032-C1-01","page":"P032","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P032","exercisePage":"P033","section":"Reading / Questions","originalNumber":4,"originalStem":"to make up for something ________________________________________ Par. 7","kind":"adapted"},"stem":"In paragraph 7, “compensate” most nearly means:","options":[{"id":"A","text":"Cause the subject to move faster.","why":""},{"id":"B","text":"Make a copy of a photograph.","why":""},{"id":"C","text":"Make up for a shortage or disadvantage.","why":"快门快导致进光不足，开大光圈是弥补不足。compensate 在这里不是复制或加速。"},{"id":"D","text":"Ignore a problem completely.","why":""}],"answer":"C","explanation":"快门快导致进光不足，开大光圈是弥补不足。compensate 在这里不是复制或加速。","evidence":[{"page":"P032","paragraph":7,"quote":"For instance, if you want to photograph a fast moving object, you need a fast shutter speed, but that may not let in enough light.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P032","paragraph":7,"quote":"To compensate, you need to open the aperture wider so that the proper amount of light reaches the film.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P032-B2-01","page":"P032","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P032","exercisePage":"P033","section":"Reading / Questions","originalNumber":8,"originalStem":"How are digital cameras different from traditional cameras? ________________________________________","kind":"adapted"},"stem":"How is a digital camera different from a traditional film camera in the passage?","options":[{"id":"A","text":"It must keep its shutter permanently open.","why":""},{"id":"B","text":"It uses a light-sensitive electrical device instead of chemical film.","why":"第2段用 Instead of 对比记录图像的介质；两者都仍然需要光。"},{"id":"C","text":"It never uses light to form an image.","why":""},{"id":"D","text":"It works only when a photograph is printed first.","why":""}],"answer":"B","explanation":"第2段用 Instead of 对比记录图像的介质；两者都仍然需要光。","evidence":[{"page":"P032","paragraph":2,"quote":"Instead of chemical film, a digital camera contains a light-sensitive electrical device that records the image.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P034-F2-01","page":"P034","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P034","exercisePage":"P035","section":"Reading / Questions","originalNumber":9,"originalStem":"List three adjectives you could use to describe Dante in this story. ________________________________________________________________________________ ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"Which description best fits Dante during the interview?","options":[{"id":"A","text":"Careless about the photographer’s work.","why":""},{"id":"B","text":"Certain that he already knows every answer.","why":""},{"id":"C","text":"Curious, prepared, and polite.","why":"Dante 先致谢、征求录音同意并提出具体问题，支持有礼貌、认真准备和好奇的判断。"},{"id":"D","text":"Hostile and unwilling to listen.","why":""}],"answer":"C","explanation":"Dante 先致谢、征求录音同意并提出具体问题，支持有礼貌、认真准备和好奇的判断。","evidence":[{"page":"P034","paragraph":1,"quote":"“Thanks for taking the time to meet with me, Mr.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P034","paragraph":3,"quote":"“Would it be all right with you if I recorded our conversation?”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P034-B3-01","page":"P034","skill":"B3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P034","exercisePage":"P035","section":"Reading / Questions","originalNumber":8,"originalStem":"After his interview with Mr. Salinas, do you think that Dante will still want to become a photographer? Explain your answer. ________________________________________________________________________________ ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"What is most likely after Dante’s interview?","options":[{"id":"A","text":"He will become Mr. Salinas’s college teacher.","why":""},{"id":"B","text":"He will refuse to learn anything more about photography.","why":""},{"id":"C","text":"He will decide photography has no value.","why":""},{"id":"D","text":"He will remain interested in becoming a photographer.","why":"结尾 Dante 直接说想成为摄影师并受到鼓舞，支持继续追求这一兴趣，不能推出他已经成为专业人士。"}],"answer":"D","explanation":"结尾 Dante 直接说想成为摄影师并受到鼓舞，支持继续追求这一兴趣，不能推出他已经成为专业人士。","evidence":[{"page":"P034","paragraph":13,"quote":"I’d like to be a photographer one day myself.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P034","paragraph":13,"quote":"Your comments were inspiring.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P034-D1-01","page":"P034","skill":"D1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P034","exercisePage":"P035","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How is most of “Talking Photos” organized?","options":[{"id":"A","text":"As a recipe with numbered cooking steps.","why":""},{"id":"B","text":"As a debate between two authors who never meet.","why":""},{"id":"C","text":"As an interview in which Dante’s questions are followed by Salinas’s answers.","why":"DC 和 ES 的交替发言围绕职业经历、影响和收获展开。识别问答结构可以追踪每段在回答哪个问题。"},{"id":"D","text":"As a chronological list of camera parts.","why":""}],"answer":"C","explanation":"DC 和 ES 的交替发言围绕职业经历、影响和收获展开。识别问答结构可以追踪每段在回答哪个问题。","evidence":[{"page":"P034","paragraph":5,"quote":"Dante Carter: When did you first know that you wanted to be a photographer?","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P034","paragraph":6,"quote":"Edward Salinas: It wasn’t until I had already graduated from college.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P034","paragraph":11,"quote":"DC: What do you find most rewarding about your job?","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P036-A3-01","page":"P036","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P036","exercisePage":"P037","section":"Reading / Questions","originalNumber":2,"originalStem":"Check the sentence below that is the best summary for paragraph 7. - ______ Adams was an environmentalist who was able to help the cause he believed in through his photographs of natural places. - ______ Adams visited Sequoia, Mount Rainier, and Glacier National Parks. - ______ The Sierra Club is a conservation group.","kind":"adapted"},"stem":"Which sentence best summarizes paragraph 7?","options":[{"id":"A","text":"Adams photographed only musical performances.","why":""},{"id":"B","text":"Adams believed wild places should never be recorded.","why":""},{"id":"C","text":"Adams stopped taking nature photographs when he joined the Sierra Club.","why":""},{"id":"D","text":"Adams used photography to support conservation and record wild places.","why":"段落把环保行动、宣传以及保存自然影像联系起来。具体公园名称是支持细节，不是完整概括。"}],"answer":"D","explanation":"段落把环保行动、宣传以及保存自然影像联系起来。具体公园名称是支持细节，不是完整概括。","evidence":[{"page":"P036","paragraph":7,"quote":"Through his photographs and the time that he spent in nature, Adams became an avid environmentalist.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P036","paragraph":7,"quote":"His photographs serve as a record of wild areas of the American West—such as Sequoia, Mount Rainier, and Glacier National Parks—before humans had done much to disturb them.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P036-C5-01","page":"P036","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P036","exercisePage":"P037","section":"Reading / Questions","originalNumber":9,"originalStem":"to sound familiar ____________________________________________________","kind":"adapted"},"stem":"What does “may not ring a bell with you” mean?","options":[{"id":"A","text":"May not ask you to answer a telephone.","why":""},{"id":"B","text":"May not make a loud musical noise.","why":""},{"id":"C","text":"May not allow you to take a photograph.","why":""},{"id":"D","text":"May not sound familiar to you.","why":"这里把名字是否熟悉与照片是否认得作对照，ring a bell 是“听起来熟悉”的习语。"}],"answer":"D","explanation":"这里把名字是否熟悉与照片是否认得作对照，ring a bell 是“听起来熟悉”的习语。","evidence":[{"page":"P036","paragraph":1,"quote":"The name Ansel Adams may not ring a bell with you, but there is a good chance that you would recognize his photographs.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P036","paragraph":1,"quote":"The name Ansel Adams may not ring a bell with you, but there is a good chance that you would recognize his photographs.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P036-E3-01","page":"P036","skill":"E3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P036","exercisePage":"P037","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which word best describes the author’s tone toward Adams’s work?","options":[{"id":"A","text":"Admiring.","why":"beautiful、famous、amazing 以及 joy and wonder 等词构成持续赞赏的语气，不是冷漠或嘲笑。"},{"id":"B","text":"Angry.","why":""},{"id":"C","text":"Dismissive.","why":""},{"id":"D","text":"Mocking.","why":""}],"answer":"A","explanation":"beautiful、famous、amazing 以及 joy and wonder 等词构成持续赞赏的语气，不是冷漠或嘲笑。","evidence":[{"page":"P036","paragraph":1,"quote":"Adams’s work includes some of the most beautiful and famous black-and-white nature photographs ever taken.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P036","paragraph":5,"quote":"Although Adams worked in black and white, there is an amazing amount of variety in tone.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P036","paragraph":8,"quote":"Ansel Adams died in 1984, but his photographs will continue to bring the joy and wonder of the natural world to people for many years to come.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P038-A1-01","page":"P038","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P038","exercisePage":"P039","section":"Reading / Questions","originalNumber":1,"originalStem":"Check the sentence that best states the main idea of the selection. - ____ Margaret Bourke-White photographed Cleveland's steel mills in the 1920s. - ____ Margaret Bourke-White was a talented photojournalist who traveled the world and broke new ground for women. - ____ Margaret Bourke-White was one of LIFE magazine's first four photographers.","kind":"adapted"},"stem":"What is the main idea of this selection?","options":[{"id":"A","text":"Margaret Bourke-White documented major events around the world and broke new ground for women.","why":"全文的钢厂、战争、国际旅行和职业突破都服务于这位摄影记者的贡献；只说一个地点或原先专业太窄。"},{"id":"B","text":"Bourke-White photographed only one steel mill.","why":""},{"id":"C","text":"Bourke-White avoided traveling and photographing danger.","why":""},{"id":"D","text":"Bourke-White spent her entire career studying reptiles.","why":""}],"answer":"A","explanation":"全文的钢厂、战争、国际旅行和职业突破都服务于这位摄影记者的贡献；只说一个地点或原先专业太窄。","evidence":[{"page":"P038","paragraph":1,"quote":"She was present for many monumental events of the 20th century, and she recorded them with courage and sensitivity.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P038","paragraph":5,"quote":"As the first female war correspondent of World War II, Bourke-White faced danger on a regular basis.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P038","paragraph":7,"quote":"Her pictures are a permanent record of both her life and the world during the 20th century.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P038-F1-01","page":"P038","skill":"F1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P038","exercisePage":"P039","section":"Reading / Questions","originalNumber":3,"originalStem":"Why was Bourke-White's job unusual for a woman? __________________________________________________ __________________________________________________","kind":"adapted"},"stem":"Why was her job unusual for a woman in the period described?","options":[{"id":"A","text":"No women were allowed to live in cities.","why":""},{"id":"B","text":"The story takes place before cameras were invented.","why":""},{"id":"C","text":"Women were commonly expected to work in the home rather than as war correspondents.","why":"第5段交代当时的社会背景，对照她进入战地工作的突破。这是时代习俗，不是说所有女性都绝对不能工作。"},{"id":"D","text":"Women had not yet learned to read photographs.","why":""}],"answer":"C","explanation":"第5段交代当时的社会背景，对照她进入战地工作的突破。这是时代习俗，不是说所有女性都绝对不能工作。","evidence":[{"page":"P038","paragraph":5,"quote":"This was at a time when it was still customary for women to work mostly in the home, taking care of a family and a household.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P038-F6-01","page":"P038","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P038","exercisePage":"P039","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What does calling Bourke-White “the eyes and ears of the world” suggest?","options":[{"id":"A","text":"She literally had more eyes and ears than other people.","why":""},{"id":"B","text":"She photographed only people’s faces.","why":""},{"id":"C","text":"She stopped recording world events.","why":""},{"id":"D","text":"Her reporting helped people learn about places and events they could not experience themselves.","why":"这个比喻强调记者替读者观察和记录世界。紧接着的 most Americans had never visited 说明这种传递信息的作用。"}],"answer":"D","explanation":"这个比喻强调记者替读者观察和记录世界。紧接着的 most Americans had never visited 说明这种传递信息的作用。","evidence":[{"page":"P038","paragraph":7,"quote":"She was the eyes and ears of the world in places most Americans had never visited and never would.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P040-E2-01","page":"P040","skill":"E2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P040","exercisePage":"P041","section":"Reading / Questions","originalNumber":2,"originalStem":"Why did Ari decide to write a letter to the television show he watched? ________________________ ________________________","kind":"adapted"},"stem":"What problem do Ari and his mother find with the television show?","options":[{"id":"A","text":"It presented only the appealing side of owning exotic pets.","why":"他们通过其他资料发现遗弃和虐待问题，认为节目只呈现一面。评价的是信息是否完整，而非证明所有电视节目都不可靠。"},{"id":"B","text":"It explained too many opposing views in equal detail.","why":""},{"id":"C","text":"It proved that all exotic animals are easy to care for.","why":""},{"id":"D","text":"It showed only ordinary dogs and cats.","why":""}],"answer":"A","explanation":"他们通过其他资料发现遗弃和虐待问题，认为节目只呈现一面。评价的是信息是否完整，而非证明所有电视节目都不可靠。","evidence":[{"page":"P040","paragraph":9,"quote":"“They didn’t talk about any of this on the show I watched,” said Ari, looking confused.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P040","paragraph":10,"quote":"“It sounds like the show you saw only presented one side of the story.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P040-F2-01","page":"P040","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P040","exercisePage":"P041","section":"Reading / Questions","originalNumber":3,"originalStem":"Why did Mrs. Stein say that Ari was mature and responsible? ________________________ ________________________","kind":"adapted"},"stem":"Why does Mrs. Stein call Ari mature and responsible?","options":[{"id":"A","text":"He insists on buying a tiger without doing research.","why":""},{"id":"B","text":"He wants a pet only because it is dangerous.","why":""},{"id":"C","text":"He refuses to listen to any concerns.","why":""},{"id":"D","text":"He changes his decision after considering the animals’ welfare and more information.","why":"Ari 补充研究后改变主意，还希望节目说明两面，表现出考虑后果和动物福祉的责任感。"}],"answer":"D","explanation":"Ari 补充研究后改变主意，还希望节目说明两面，表现出考虑后果和动物福祉的责任感。","evidence":[{"page":"P040","paragraph":11,"quote":"Now that we’ve done some more research, I’ve changed my mind about owning an exotic pet.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P040","paragraph":12,"quote":"“You’ve made a really mature decision.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P040-A4-01","page":"P040","skill":"A4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P040","exercisePage":"P041","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which theme is best supported by the story?","options":[{"id":"A","text":"Research is unnecessary when a television program is exciting.","why":""},{"id":"B","text":"Responsible decisions require considering more than an attractive first impression.","why":"Ari 从节目吸引转向查证问题，最后作出更成熟的选择，体现全面了解信息再决定的主题。"},{"id":"C","text":"Parents should never discuss decisions with children.","why":""},{"id":"D","text":"The most unusual choice is always the best choice.","why":""}],"answer":"B","explanation":"Ari 从节目吸引转向查证问题，最后作出更成熟的选择，体现全面了解信息再决定的主题。","evidence":[{"page":"P040","paragraph":3,"quote":"“I was watching this amazing animal show,” he said.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P040","paragraph":11,"quote":"They should have explained both sides of the story.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P042-F6-01","page":"P042","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P042","exercisePage":"P043","section":"Reading / Questions","originalNumber":2,"originalStem":"An analogy is a comparison between two things that may seem to be unalike but that have at least one similarity. An analogy is used to compare two things in paragraph 7. What are they? ____________________","kind":"adapted"},"stem":"Why does the author compare environmental changes to falling dominoes?","options":[{"id":"A","text":"Every animal lives inside a wooden game piece.","why":""},{"id":"B","text":"Scientists can always predict every environmental result.","why":""},{"id":"C","text":"The environment remains unchanged when one species is added.","why":""},{"id":"D","text":"A small change can trigger a connected series of effects.","why":"多米诺强调连锁影响。最后一句点明，一个变化会引发难以完全预测的一系列变化。"}],"answer":"D","explanation":"多米诺强调连锁影响。最后一句点明，一个变化会引发难以完全预测的一系列变化。","evidence":[{"page":"P042","paragraph":7,"quote":"One small change can set off a whole series of changes that not even scientists can predict.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P042-C1-01","page":"P042","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P042","exercisePage":"P043","section":"Reading / Questions","originalNumber":8,"originalStem":"In paragraph 2, exotic means ____________________","kind":"adapted"},"stem":"In this passage, “exotic” most nearly means:","options":[{"id":"A","text":"Native to every local environment.","why":""},{"id":"B","text":"Unusual and coming from another part of the world.","why":"文中把外来宠物与 nonnative species、原生热带地区联系起来，说明来自其他地区而非本地常见。"},{"id":"C","text":"Artificial rather than alive.","why":""},{"id":"D","text":"Always domesticated and harmless.","why":""}],"answer":"B","explanation":"文中把外来宠物与 nonnative species、原生热带地区联系起来，说明来自其他地区而非本地常见。","evidence":[{"page":"P042","paragraph":1,"quote":"But if you happened to live in southern Florida, there is a chance that you could run into a number of nonnative species that have settled in your hometown.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P042","paragraph":4,"quote":"But the climate in southern Florida is wet and warm—not unlike the tropical areas where many of the animals are naturally found.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P042-B2-01","page":"P042","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P042","exercisePage":"P043","section":"Reading / Questions","originalNumber":5,"originalStem":"Why are exotic pets more likely to survive in the wild in a state like Florida than they are in a state like Ohio or Montana? ____________________ ____________________","kind":"adapted"},"stem":"Why can many released exotic pets survive in southern Florida?","options":[{"id":"A","text":"Its warm, wet climate resembles their natural tropical habitats.","why":"第4段用 wet and warm 与原生热带环境相似建立原因；不能自行补出总有人喂食。"},{"id":"B","text":"Every released pet receives food from a keeper.","why":""},{"id":"C","text":"Its climate is permanently frozen.","why":""},{"id":"D","text":"There are no other animals living in Florida.","why":""}],"answer":"A","explanation":"第4段用 wet and warm 与原生热带环境相似建立原因；不能自行补出总有人喂食。","evidence":[{"page":"P042","paragraph":4,"quote":"But the climate in southern Florida is wet and warm—not unlike the tropical areas where many of the animals are naturally found.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P044-A2-01","page":"P044","skill":"A2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P044","exercisePage":"P045","section":"Reading / Questions","originalNumber":6,"originalStem":"What is the author trying to persuade the reader of in this passage? ________________________________________________________________________","kind":"adapted"},"stem":"Which claim does the author most want readers to accept?","options":[{"id":"A","text":"The Everglades should be drained for more development.","why":""},{"id":"B","text":"Protecting only one species makes the ecosystem unimportant.","why":""},{"id":"C","text":"The Everglades are worth saving and preserving.","why":"结尾明确表态，前文的多样性、威胁和保护措施都是支持理由。中心论点应是作者希望读者接受的判断。"},{"id":"D","text":"All species in the Everglades should be replaced with foreign trees.","why":""}],"answer":"C","explanation":"结尾明确表态，前文的多样性、威胁和保护措施都是支持理由。中心论点应是作者希望读者接受的判断。","evidence":[{"page":"P044","paragraph":8,"quote":"Without a doubt, the Everglades are worth saving and preserving.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P044-B2-01","page":"P044","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P044","exercisePage":"P045","section":"Reading / Questions","originalNumber":9,"originalStem":"Why were melaleuca trees planted in the Everglades? ________________________________________________________________________","kind":"adapted"},"stem":"Why were melaleuca trees originally planted in the Everglades?","options":[{"id":"A","text":"To make the area colder and wetter.","why":""},{"id":"B","text":"To consume water and help dry land for development.","why":"第6段交代引入树木的原先目的；后来挤占本地物种是结果，不能与最初意图混淆。"},{"id":"C","text":"To stop every human activity in the region.","why":""},{"id":"D","text":"To feed alligators during the winter.","why":""}],"answer":"B","explanation":"第6段交代引入树木的原先目的；后来挤占本地物种是结果，不能与最初意图混淆。","evidence":[{"page":"P044","paragraph":6,"quote":"The tiny seeds of the melaleuca tree were sprinkled from salt shakers into the Everglades from low-flying airplanes because melaleuca trees consume a great deal of water.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P044","paragraph":6,"quote":"People hoped that the trees would dry up the land and make the Everglades suitable for development.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P044-B5-01","page":"P044","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P044","exercisePage":"P045","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which action best follows the conservation approach described in paragraph 7?","options":[{"id":"A","text":"Plant more water-consuming nonnative trees.","why":""},{"id":"B","text":"Restore unused farmland to natural wetland.","why":"文中的保护方案包括购买农地并恢复自然湿地。把这一方案应用到新情境，要选择有利于恢复生态的行动。"},{"id":"C","text":"Increase fertilizer runoff into the park.","why":""},{"id":"D","text":"Drain more marshland with canals.","why":""}],"answer":"B","explanation":"文中的保护方案包括购买农地并恢复自然湿地。把这一方案应用到新情境，要选择有利于恢复生态的行动。","evidence":[{"page":"P044","paragraph":7,"quote":"In 1996, an act was passed allowing the government to purchase farmland, which could then be returned to natural swampy marshland.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P046-A1-01","page":"P046","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P046","exercisePage":"P047","section":"Reading / Questions","originalNumber":2,"originalStem":"Check the sentence that best states the main idea of the selection. - ____ Audubon was born in Haiti but moved to the United States as a teenager. - ____ The National Audubon Society was founded to honor John James Audubon. - ____ Audubon was a painter and ornithologist who created one of the most compre-hensive catalogs of birds in America.","kind":"adapted"},"stem":"Which statement best expresses the main idea?","options":[{"id":"A","text":"Audubon spent his whole life farming near Philadelphia.","why":""},{"id":"B","text":"The Audubon Society mainly teaches people to hunt birds.","why":""},{"id":"C","text":"American publishers immediately accepted every painting Audubon made.","why":""},{"id":"D","text":"Audubon studied and painted birds, creating a remarkable catalog of American species.","why":"全文围绕 Audubon 研究鸟类、绘制鸟类图谱及其影响展开。出生地和出版地点是细节，不能概括整篇。"}],"answer":"D","explanation":"全文围绕 Audubon 研究鸟类、绘制鸟类图谱及其影响展开。出生地和出版地点是细节，不能概括整篇。","evidence":[{"page":"P046","paragraph":3,"quote":"Over the years, Audubon spent more and more time creating realistic drawings and paintings of birds.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P046","paragraph":5,"quote":"It contained 435 hand-colored plates that showed 1,065 life-sized birds.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P046-F5-01","page":"P046","skill":"F5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P046","exercisePage":"P047","section":"Reading / Questions","originalNumber":1,"originalStem":"Check the line beside the word or words that best describe what type of passage this is. - ____ biography - ____ historical fiction - ____ myth","kind":"adapted"},"stem":"What type of text is this selection?","options":[{"id":"A","text":"A biography of a naturalist and artist","why":"文章按人物经历介绍 Audubon 的出生、研究、作品和影响，属于传记。"},{"id":"B","text":"A fictional diary written by a bird","why":""},{"id":"C","text":"A myth explaining how birds first appeared","why":""},{"id":"D","text":"A set of instructions for building a birdhouse","why":""}],"answer":"A","explanation":"文章按人物经历介绍 Audubon 的出生、研究、作品和影响，属于传记。","evidence":[{"page":"P046","paragraph":2,"quote":"Audubon was born in the Caribbean country of Haiti in 1785.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P046","paragraph":6,"quote":"It honored a man whose lifework had been to study birds and to begin to educate the public about the importance of protecting them and their environment.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P046-B2-01","page":"P046","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P046","exercisePage":"P047","section":"Reading / Questions","originalNumber":4,"originalStem":"Explain how Audubon’s bird-banding experiment worked. ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"Why did Audubon tie yarn to the birds’ legs?","options":[{"id":"A","text":"To teach the birds to build different nests","why":""},{"id":"B","text":"To keep every bird from flying away","why":""},{"id":"C","text":"To recognize them and find out whether they returned to the same nesting places","why":"给鸟腿系线是做标记；再次认出同一只鸟，才能判断它是否返回原来的筑巢地。"},{"id":"D","text":"To measure the colors in their feathers","why":""}],"answer":"C","explanation":"给鸟腿系线是做标记；再次认出同一只鸟，才能判断它是否返回原来的筑巢地。","evidence":[{"page":"P046","paragraph":2,"quote":"By marking the birds in this way, Audubon was able to conclude that the birds nested in the same places every year.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P048-F6-01","page":"P048","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P048","exercisePage":"P049","section":"Reading / Questions","originalNumber":1,"originalStem":"Hyperbole is an exaggerated statement that is used to make a point. For example, the sentence I am so hungry, I could eat a horse means that the speaker is extremely hungry, not that she could actually eat a horse. Find the hyperbole in paragraph 3, and write it on the line below. Then, explain what you think it means. _____ _____","kind":"adapted"},"stem":"What does “We don’t want to be eaten alive out there” suggest?","options":[{"id":"A","text":"They expect large animals to eat them.","why":""},{"id":"B","text":"They plan to feed insects during the walk.","why":""},{"id":"C","text":"They want to avoid getting many insect bites.","why":"这是夸张表达。前文提到 bug spray，说明他们担心的是蚊虫叮咬，而不是被真的吃掉。"},{"id":"D","text":"They think the birds will steal their food.","why":""}],"answer":"C","explanation":"这是夸张表达。前文提到 bug spray，说明他们担心的是蚊虫叮咬，而不是被真的吃掉。","evidence":[{"page":"P048","paragraph":2,"quote":"“Should I grab some bug spray?”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P048","paragraph":3,"quote":"“We don’t want to be eaten alive out there.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P048-C2-01","page":"P048","skill":"C2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P048","exercisePage":"P049","section":"Reading / Questions","originalN ":11,"quote":"“I’m going to start a list of plants that hummingbirds like,” said Olivia.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P050-F4-01","page":"P050","skill":"F4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P050","exercisePage":"P051","section":"Reading / Questions","originalNumber":8,"originalStem":"From whose point of view is this story told? ________________________________________","kind":"adapted"},"stem":"Who tells the story?","options":[{"id":"A","text":"Olivia speaking about herself throughout","why":""},{"id":"B","text":"A third-person narrator who describes the girls and their conversation","why":"叙述部分用 Olivia、Jaya、they 描写人物；人物说话时的 I 不代表整篇改为第一人称。"},{"id":"C","text":"Jaya writing a first-person diary","why":""},{"id":"D","text":"A hummingbird explaining its own thoughts","why":""}],"answer":"B","explanation":"叙述部分用 Olivia、Jaya、they 描写人物；人物说话时的 I 不代表整篇改为第一人称。","evidence":[{"page":"P050","paragraph":1,"quote":"Olivia and Jaya sat at a table in the library with books spread out around them.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P052-A1-01","page":"P052","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P052","exercisePage":"P053","section":"Reading / Questions","originalNumber":5,"originalStem":"Check the sentence that best states the main idea of the passage. - _____ Every spring, thousands of sandhill cranes stop at Nebraska’s Platte River during their northern migration. - _____ The most distinctive features of sandhill cranes are their long necks and legs. - _____ Rowe Sanctuary in Gibbon, Nebraska, is one of the best places for viewing sandhill cranes.","kind":"adapted"},"stem":"Which statement best states the main idea?","options":[{"id":"A","text":"Each spring, huge numbers of sandhill cranes stop along the Platte River during migration.","why":"首段提出每年春季的大规模停歇，后面介绍鹤的特征、迁徙路线及河流适用条件。出生或单个外形细节不能概括全文。"},{"id":"B","text":"The Platte River was created by migrating birds.","why":""},{"id":"C","t :"B","text":"A recipe for making museum exhibits","why":""},{"id":"C","text":"A first-person autobiography by James Smithson","why":""},{"id":"D","text":"An informational text about the Smithsonian’s history and collections","why":"文章介绍机构的由来、资金和各类馆藏，以说明信息为主；虽然写到 Smithson，但并非只讲他的完整生平。"}],"answer":"D","explanation":"文章介绍机构的由来、资金和各类馆藏，以说明信息为主；虽然写到 Smithson，但并非只讲他的完整生平。","evidence":[{"page":"P056","paragraph":1,"quote":"The Smithsonian Institution in Washington, D.C., covers so many subjects and contains so many objects that you would have to call it a super-museum.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P056","paragraph":3,"quote":"Congress debated for many years about how exactly the money should be used, but in 1846, President James Polk signed a bill into law that founded the institution.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P056","paragraph":7,"quote":"One of the most popular Smithsonian sites is the National Air and Space Museum.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P056-D4-01","page":"P056","skill":"D4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P056","exercisePage":"P057","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Why does the author include paragraphs 2 and 3?","options":[{"id":"A","text":"To explain how Smithson’s gift led to the founding of the institution","why":"首段提到英国人的慷慨，接着第2—3段交代遗嘱、捐款和建馆过程，为这一说法提供背景解释。"},{"id":"B","text":"To explain how to pilot the Spirit of St. Louis","why":""},{"id":"C","text":"To describe every animal in the National Zoo","why":""},{"id":"D","text":"To argue that museums should charge higher prices","why":""}],"answer":"A","explanation":"首段提到英国人的慷慨，接着第2—3段交代遗嘱、捐款和建馆过程，为这一说法提供背景解释。","evidence":[{"page":"P056","paragraph":2,"quote":"However, Smithson stated in his will that if Henry died without having any children, all the money would be donated to the U.S. government.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P056","paragraph":3,"quote":"Congress deba ""},{"id":"D","text":"It doubles in weight.","why":""}],"answer":"B","explanation":"第7段直接说明短暂红色发光的现象；不要把它原本的蓝色与紫外线下的表现混淆。","evidence":[{"page":"P058","paragraph":7,"quote":"When the Hope diamond is exposed to ultraviolet light, it will glow red for a few seconds.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P058-D1-01","page":"P058","skill":"D1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P058","exercisePage":"P059","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How is most of the diamond’s history organized?","options":[{"id":"A","text":"In time order, following changes in ownership","why":"第2—6段依次介绍早期购买、失窃、后来的持有人和捐赠，日期与所有权变化构成时间线。"},{"id":"B","text":"By comparing diamonds from largest to smallest","why":""},{"id":"C","text":"As instructions for cutting a diamond","why":""},{"id":"D","text":"As an argument against all museum collections","why":""}],"answer":"A","explanation":"第2—6段依次介绍早期购买、失窃、后来的持有人和捐赠，日期与所有权变化构成时间线。","evidence":[{"page":"P058","paragraph":2,"quote":"Historians believe that King Louis XIV purchased the diamond in 1668 as part of the French crown jewels.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P058","paragraph":5,"quote":"In 1912, the Hope diamond finally found a semi-permanent home with a woman by the name of Evalyn Walsh McLean.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P058","paragraph":6,"quote":"In 1949, after Mrs.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P058-E2-01","page":"P058","skill":"E2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P058","exercisePage":"P059","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which detail does the author present as uncertain rather than as an established record?","options":[{"id":"A","text":"The path the diamond took after the robbery","why":"第3段用 No one knows for certain 和 No record exists 明确标示证据缺口。不能把推测与有记录的事件放在同一确定程度上。"},{"id":"B","text":"Mrs. McLean had the stone reset.","why":""},{"id":"C","text":"The diamond is part of a Smithsonian collection.","why":""},{"id":"D","text":"Winston donated the diamond in 1958.","why":""}],"answer":"A","explanation":"第3段用 No one knows for certain 和 No record exists 明确标示证据缺口。不能把推测与有记录的事件放在同一确定程度上。","evidence":[{"page":"P058","paragraph":3,"quote":"No one knows for certain the path of the diamond after its theft.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P058","paragraph":3,"quote":"No record exists to verify where Hope got the diamond or how much he paid for it.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P060-A1-01","page":"P060","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P060","exercisePage":"P061","section":"Reading / Questions","originalNumber":7,"originalStem":"Check the sentence that best states the main idea of the passage. - ____ The dance called the Lindy Hop was named for Charles Lindbergh. - ____ Lindbergh graduated first in his military pilot class. - ____ Lindbergh, one of America’s first celebrities, flew nonstop from New York City to Paris.","kind":"adapted"},"stem":"Which statement best expresses the main idea?","options":[{"id":"A","text":"The Smithsonian was built to house one airplane.","why":""},{"id":"B","text":"Lindbergh became a major celebrity after flying nonstop from New York to Paris.","why":"文章围绕他的飞行准备、1927年的跨洋飞行及成名展开。舞蹈和收藏地点是成就带来的后续细节。"},{"id":"C","text":"The Lindy Hop was the only reason Lindbergh became famous.","why":""},{"id":"D","text":"Lindbergh spent his whole career designing cars.","why":""}],"answer":"B","explanation":"文章围绕他的飞行准备、1927年的跨洋飞行及成名展开。舞蹈和收藏地点是成就带来的后续细节。","evidence":[{"page":"P060","paragraph":1,"quote":"Many historians agree that Charles Lindbergh was one of the first major celebrities, or superstars.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P060","paragraph":6,"quote":"He became a national hero and a huge celebrity.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P060-C1-01","page":"P060","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P060","exercisePage":"P061","section":"Reading / Questions","originalNumber":8,"originalStem":"In paragraph 5, what does customized mean? ________________________________________ ________________________________________","kind":"adapted"},"stem":"What does “customized” mean in paragraph 5?","options":[{"id":"A","text":"Built or changed to meet a particular need","why":"前一句说普通飞机无法飞那么远、那么久，后一句说新飞机能完成旅程，因此是为特定需求定制。"},{"id":"B","text":"Damaged during a training flight","why":""},{"id":"C","text":"Borrowed only for a public display","why":""},{"id":"D","text":"Chosen without considering the journey","why":""}],"answer":"A","explanation":"前一句说普通飞机无法飞那么远、那么久，后一句说新飞机能完成旅程，因此是为特定需求定制。","evidence":[{"page":"P060","paragraph":5,"quote":"Lindbergh knew he had the skills to complete the flight, but not just any plane was capable of flying that far for that long.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P060","paragraph":5,"quote":"Louis, Lindbergh got a customized airplane that could make the journey.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P060-F2-01","page":"P060","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P060","exercisePage":"P061","section":"Reading / Questions","originalNumber":2,"originalStem":"Check the words that best describe Charles Lindbergh. - ____ adventurous - ____ quiet - ____ determined - ____ kind - ____ daring","kind":"adapted"},"stem":"Which pair of traits is best supported by Lindbergh’s actions?","options":[{"id":"A","text":"Careless about flying and opposed to learning","why":""},{"id":"B","text":"Uninterested and easily discouraged","why":""},{"id":"C","text":"Adventurous and determined","why":"他学习飞行、表演特技、接受训练并为远程飞行筹备专用飞机，支持“敢于冒险且有决心”。"},{"id":"D","text":"Fearful of all travel and unwilling to train","why":""}],"answer":"C","explanation":"他学习飞行、表演特技、接受训练并为远程飞行筹备专用飞机，支持“敢于冒险且有决心”。","evidence":[{"page":"P060","paragraph":2,"quote":"Soon after, Lindbergh bought his own period of time by a fresh lava flow.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P064","paragraph":5,"quote":"When he left his home to get supplies, he had to be sure to purchase all the essentials because he never knew when he might be trapped for a period of time by a fresh lava flow.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P064-B4-01","page":"P064","skill":"B4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P064","exercisePage":"P065","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which detail best supports the claim that Thompson’s route out was dangerous?","options":[{"id":"A","text":"The subdivision was named Royal Gardens.","why":""},{"id":"B","text":"He loved the natural beauty of his home.","why":""},{"id":"C","text":"He sometimes bought supplies away from home.","why":""},{"id":"D","text":"A crack could suddenly open and expose hot lava beneath the rock.","why":"要支持“路线危险”，应找直接描写路面风险的细节。突然裂开的岩面与下面的熔岩比住处名称、个人偏好更有证明力。"}],"answer":"D","explanation":"要支持“路线危险”，应找直接描写路面风险的细节。突然裂开的岩面与下面的熔岩比住处名称、个人偏好更有证明力。","evidence":[{"page":"P064","paragraph":4,"quote":"At any time, a sudden crack could open up, revealing the red-hot dangerous liquid.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P066-D4-01","page":"P066","skill":"D4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P066","exercisePage":"P067","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Why does the author describe opening a shaken bottle of soda?","options":[{"id":"A","text":"To show that all volcanoes contain soda","why":""},{"id":"B","text":"To give instructions for measuring plate movement","why":""},{"id":"C","text":"To help readers understand how trapped gases can make an eruption explosive","why":"熟悉的汽水喷出类比不熟悉的火山喷发，突出气体在其中产生的作用。两者在机制的这一点上相似，不表示物质相同。"},{"id":"D","text":"To explain why people drink soda near volcanoes","why":""}],"answer":"C","explanation":"熟悉的汽水喷出类 e world’s 1,900 active and dormant, or inactive, volcanoes are located there.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P068-A1-01","page":"P068","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P068","exercisePage":"P069","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which statement best captures the passage as a whole?","options":[{"id":"A","text":"Tsunamis are powerful ocean waves, and warning systems can reduce the harm they cause.","why":"全文先解释海啸的成因和特征，再用灾害实例引出预警系统；中心思想应覆盖自然现象和防护这两部分。"},{"id":"B","text":"Every tsunami consists of exactly one wave.","why":""},{"id":"C","text":"Tsunamis are ordinary small waves caused only by wind.","why":""},{"id":"D","text":"The passage is mainly a travel guide to Hawaiian beaches.","why":""}],"answer":"A","explanation":"全文先解释海啸的成因和特征，再用灾害实例引出预警系统；中心思想应覆盖自然现象和防护这两部分。","evidence":[{"page":"P068","paragraph":2,"quote":"Tsunamis are caused by a disturbance in the ocean, such as an earthquake or undersea volcanic eruption.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P068","paragraph":7,"quote":"The devastation of the 1946 tsunami led a team of scientists and government officials to create the Pacific Tsunami Warning System.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P068-B2-01","page":"P068","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P068","exercisePage":"P069","section":"Reading / Questions","originalNumber":5,"originalStem":"What is one positive effect of the 1946 tsunamis? ________________________________________________________________________________","kind":"adapted"},"stem":"What positive development followed the 1946 disaster?","options":[{"id":"A","text":"The ocean permanently stopped producing waves.","why":""},{"id":"B","text":"All earthquakes around the world ended.","why":""},{"id":"C","text":"Scientists and officials created the Pacific Tsunami Warning System.","why":"第7段用 led...to create 清楚建立因果关系：1946年的灾害推动了太平洋海啸预警系统的建立。"},{"id":"D","text":"Hawaii no longer needed evacuation plans.","why":""}],"answer":"C","explanation":"第7段用 led...to create 清楚建立因果关系：1946年的灾害推动了太平洋海啸预警系统的建立。","evidence":[{"page":"P068","paragraph":7,"quote":"The devastation of the 1946 tsunami led a team of scientists and government officials to create the Pacific Tsunami Warning System.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P068-D2-01","page":"P068","skill":"D2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P068","exercisePage":"P069","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"In paragraph 7, who does “They” refer to in “They hoped”?","options":[{"id":"A","text":"The meteorites that entered the ocean.","why":""},{"id":"B","text":"The towns destroyed by the tsunami","why":""},{"id":"C","text":"The team of scientists and government officials","why":"代词应与前句中能执行 hoped、set up、determined 的复数主体对应，即科学家和政府官员组成的团队。"},{"id":"D","text":"The waves that reached Hawaii","why":""}],"answer":"C","explanation":"代词应与前句中能执行 hoped、set up、determined 的复数主体对应，即科学家和政府官员组成的团队。","evidence":[{"page":"P068","paragraph":7,"quote":"The devastation of the 1946 tsunami led a team of scientists and government officials to create the Pacific Tsunami Warning System.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P068","paragraph":7,"quote":"They hoped that people would never again suffer such great losses because they were unaware of a tsunami’s approach.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P070-B4-01","page":"P070","skill":"B4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P070","exercisePage":"P071","section":"Reading / Questions","originalNumber":11,"originalStem":"Find one sentence that shows that Mattie enjoys camping. Write it on the lines below. ________________________________________ ________________________________________ ________________________________________ ________________________________________","kind":"adapte d university would increase.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P078-F2-01","page":"P078","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P078","exercisePage":"P079","section":"Reading / Questions","originalNumber":6,"originalStem":"Check the words that best describe Yao Ming. - ____ sensible - ____ rude - ____ creative - ____ hardworking - ____ athletic","kind":"adapted"},"stem":"Which description best matches Yao as presented in the passage?","options":[{"id":"A","text":"Levelheaded, hardworking, and humble","why":"第2段强调沉着的态度，第7段展示专业成就，第8段强调谦逊和希望在球场外有所贡献。"},{"id":"B","text":"Rude and unwilling to adapt","why":""},{"id":"C","text":"Interested only in fame and nothing else","why":""},{"id":"D","text":"Unfriendly toward his teammates and fans","why":""}],"answer":"A","explanation":"第2段强调沉着的态度，第7段展示专业成就，第8段强调谦逊和希望在球场外有所贡献。","evidence":[{"page":"P078","paragraph":2,"quote":"The stress and pressure might have proven to be too much for many young athletes, but Yao Ming’s good nature and levelheaded attitude allowed him to quickly become one of the most popular and well-respected young basketball players today.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P078","paragraph":8,"quote":"Although his basketball career was cut short, Yao is still the same generous, humble, and likable person he was before his basketball career took off and placed him in the spotlight.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P080-E1-01","page":"P080","skill":"E1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P080","exercisePage":"P081","section":"Reading / Questions","originalNumber":8,"originalStem":"Check the phrase that best describes the author’s purpose. - _____ to persuade the reader to attend a wheelchair basketball game - _____ to explain the origins and rules of wheelchair basketball - _____ to instruct the reader on how to join a wheelchair basketball league","kind":"adapted"},"stem":"What is the main purpose of this passage?","options":[{"id":"A","text":"To persuade readers to buy a particular wheelchair","why":""},{"id":"B","text":"To explain the origins and some rules of wheelchair basketball","why":"前四段追溯这项运动的起源，后四段介绍规则，整体目的是说明。"},{"id":"C","text":"To narrate one imaginary player’s dream","why":""},{"id":"D","text":"To teach the steps for treating an injury","why":""}],"answer":"B","explanation":"前四段追溯这项运动的起源，后四段介绍规则，整体目的是说明。","evidence":[{"page":"P080","paragraph":1,"quote":"It was this desire for activity that gave birth to wheelchair basketball.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P080","paragraph":5,"quote":"So, what makes wheelchair basketball different than the game you usually see on television or at the school gym?","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P080-C4-01","page":"P080","skill":"C4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P080","exercisePage":"P081","section":"Reading / Questions","originalNumber":9,"originalStem":"The Latin root mob means move. Find a word in paragraph 1 with the root mob. ________________________________________________________________________","kind":"adapted"},"stem":"The Latin root “mob” means “move.” Which word in paragraph 1 contains this root?","options":[{"id":"A","text":"Hospitals","why":""},{"id":"B","text":"Veterans","why":""},{"id":"C","text":"Mobility","why":"mobility 含有与 move 有关的词根 mob，句中 needing wheelchairs for mobility 指依靠轮椅移动。"},{"id":"D","text":"Energy","why":""}],"answer":"C","explanation":"mobility 含有与 move 有关的词根 mob，句中 needing wheelchairs for mobility 指依靠轮椅移动。","evidence":[{"page":"P080","paragraph":1,"quote":"After World War II, many injured veterans returned home needing wheelchairs for mobility.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P080-B5-01","page":"P080","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P080","exercisePage":"P081","section":"Reading / Questions","originalNumber":4,"originalStem":"How does the physical advantage foul rule help keep the game
