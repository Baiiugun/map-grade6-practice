nodded. “The sand absorbs the sun’s heat during the day, but it cools off quickly as soon as the sun goes down.”","heading":""},{"n":7,"text":"Miles and Sophie walked ahead of their parents, wading in the gentle waves along the shore as they tried to pick out constellations in the cloudless sky. “Miles,” said Sophie after a few minutes, “do you notice anything weird about the water? Doesn’t it seem like it’s almost glowing?” She stopped walking and kicked her bare foot in the water. There was an explosion of milky-green light where Sophie kicked. Miles and Sophie looked at one another. “This is totally bizarre,” said Sophie.","heading":""},{"n":8,"text":"She and Miles crouched at the water’s edge and ran their hands back and forth rapidly in the cool water. Swirls of light traced the pattern their hands had made.","heading":""},{"n":9,"text":"Their parents had finally caught up to Miles and Sophie. “Did you find something?” inquired Mrs. Taylor, kneeling beside Sophie. Before Sophie even had time to answer, Mrs. Taylor gasped. “This is incredible,” she said swirling her hands in the water. “I’ve read about it, but I’ve never seen it myself. Ian, did you see this?” she asked Mr. Taylor.","heading":""},{"n":10,"text":"He nodded, and even in the dim light Sophie and Miles could see the look of amazement on their dad’s face. “What is it, Mom?” asked Sophie. “Why is the water glowing?”","heading":""},{"n":11,"text":"“It’s called bioluminescence,” said Mrs. Taylor. “You’re not actually seeing the water itself glow. There’s just a high concentration of tiny organisms in it that create light. It’s similar to the type of light that fireflies produce.”","heading":""},{"n":12,"text":"“I think we were all too busy looking at the stars in the sky to see the ones in the ocean,” marveled Mr. Taylor.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12}],"kind":""},{"id":"P090","page":"P090","title":"Living Lights","exercisePage":"P091","pdfPage":94,"pdfExercisePage":95,"lead":"What would it be like to glow in the dark?","paragraphs":[{"n":1,"text":"Very few organisms that live on land have the ability to glow in the dark, but it is a surprisingly common characteristic among deep-sea marine creatures. In fact, about 90 percent of animals that live 200 to 1,000 meters below the surface of the ocean are bioluminescent.","heading":""},{"n":2,"text":"The word bioluminescence (bahy-oh-loo-muh-nes-uhns) comes from the Greek word bios, which means living, and the Latin word lumen, which means light. It refers to organisms that produce light as a result of a chemical reaction. Bioluminescence is a cool light. In a lightbulb, about 97 percent of the energy is used to create heat, and only 3 percent is used to create light. When bioluminescence is produced, very little energy is used to create heat. This is one reason that scientists are so interested in learning about bioluminescence and how it might be used to create more efficient, less wasteful light sources.","heading":""},{"n":3,"text":"Ocean animals use bioluminescence in various ways. You might think that light would not be very effective as camouflage because it would draw attention to an animal instead of helping it hide. However, if you were a predator hunting a bobtail squid and you looked up at the squid’s belly, its bioluminescence would allow it to blend with the stars of the night sky.","heading":""},{"n":4,"text":"Other animals use bioluminescence to attract mates. This is the case with fireflies on land, who use light signals to attract others of the same species. It is also true of ocean animals like the Bermuda fireworm.","heading":""},{"n":5,"text":"One species of squid uses bioluminescence to confuse predators. If it feels threatened, it spews a cloud of bioluminescent chemicals. While the predator is surprised and confused, the squid has time to quickly escape.","heading":""},{"n":6,"text":"Another possible use of bioluminescence is to lure prey. The cookie cutter shark is one animal that uses its light in this way. Patterns of bioluminescence on the shark’s underside may resemble small fish to predators like tuna or mackerel. When they come closer to investigate, the shark attacks. The anglerfish uses a similar method to capture prey. It extends a glowing lure from an appendage on its head. Other fish mistake the glowing lure for a meal and venture closer. When they do, the anglerfish moves quickly and snaps them up.","heading":""},{"n":7,"text":"Because many bioluminescent animals live deep underwater, most people don’t have the opportunity to observe them. However, tiny one-celled creatures called dinoflagellates (din-uh-flaj-uh-leyt) live in the sea and produce much of the visible bioluminescence near the ocean’s surface. In areas that have large numbers of dinoflagellates, the motion of waves, a boat, a porpoise, or even a hand can easily disturb them and cause them to glow. On a dark night, this eerie but beautiful sight can create quite a light show in the ocean!","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P092","page":"P092","title":"A Stinging Surprise","exercisePage":"P093","pdfPage":96,"pdfExercisePage":97,"lead":"What happens when Miles has an unexpected encounter with a jellyfish?","paragraphs":[{"n":1,"text":"Sophie, Miles, and Mr. Taylor walked along the beach. The late afternoon sun reflected off the water and made it sparkle like a sea of diamonds.","heading":""},{"n":2,"text":"“Quick, kids, look at the seagull!” exclaimed Mr. Taylor. He pointed toward a gull that had just swooped down and plucked a large fish from the water. The fish wriggled, and they could see that it was a struggle for the seagull to hold its catch firmly without dropping it.","heading":""},{"n":3,"text":"“I can’t believe that a bird that size can carry such a...ouch! Dad, help! I think I stepped on something!” Miles hopped on one foot, trying to shake the stinging sensation from his other foot. Mr. Taylor reached him quickly and helped Miles take a seat on the warm sand.","heading":""},{"n":4,"text":"“I think that’s what you stepped on,” said Sophie, pointing to a sand-covered, jelly-like blob on the beach. “Is it a jellyfish, Dad?”","heading":""},{"n":5,"text":"Mr. Taylor nodded. Then, he looked at Miles who was wincing in pain. “You’re all right, Miles,” he said, giving his son a gentle squeeze on the shoulder. He turned to Sophie. “Do you see that lifeguard tower down the beach?” he asked. Sophie nodded. “Can you run over there and tell the lifeguard that we think your brother was stung by a jellyfish?”","heading":""},{"n":6,"text":"Sophie nodded and headed for the tower. Meanwhile, Mr. Taylor emptied the bucket of seashells and used it to gently rinse the sand from Miles’s foot with seawater.","heading":""},{"n":7,"text":"“How does that feel?” he asked Miles.","heading":""},{"n":8,"text":"“About the same,” replied Miles. “It burns and stings.”","heading":""},{"n":9,"text":"In just a few minutes, Sophie returned with the lifeguard, a friendly-looking man with deeply tanned skin and curly black hair.","heading":""},{"n":10,"text":"He opened a small red and white box and removed some rubbing alcohol. “First, we’re going to clean the area with a bit of alcohol,” he began. “Vinegar works too, just in case you’re ever stung again.”","heading":""},{"n":11,"text":"“Now what are you going to put on it?” asked Sophie curiously.","heading":""},{"n":12,"text":"“Well, it might sound funny, but I’m making a paste using meat tenderizer and water.” He smeared the paste on the heel of Miles’s foot, which had become red and slightly swollen. “Meat tenderizer is an enzyme that breaks down protein. Jellyfish poison is a protein, so it works on the poison the same way it does on meat.”","heading":""},{"n":13,"text":"“It actually feels better already,” said Miles in surprise.","heading":""},{"n":14,"text":"The lifeguard smiled. “If you don’t have any meat tenderizer at home, a paste made of baking soda and water will also soothe it. If the area becomes any more irritated in the next couple of hours, I’d suggest seeing a doctor. Otherwise, you’ll probably be feeling much better by morning.”","heading":""},{"n":15,"text":"“Thank you for all your help,” said Mr. Taylor, shaking the lifeguard’s hand. “Come on, Miles. This is probably the last piggyback ride you’re going to get before you get taller than me!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15}],"kind":""},{"id":"P094","page":"P094","title":"Curious Creatures","exercisePage":"P095","pdfPage":98,"pdfExercisePage":99,"lead":"Have you ever seen a jellyfish in the wild or at a zoo or an aquarium?","paragraphs":[{"n":1,"text":"What kind of animal has no brain, no bones, and no circulatory system? This might sound like a riddle, but it isn’t. The jellyfish is one of the ocean’s most unusual creatures. Instead of having all the organs that are typical of most animals, jellyfish have specialized tissues that carry out the various functions they need to survive.","heading":""},{"n":2,"text":"The term jellyfish is inaccurate because these animals are neither fish nor made of jelly. They are invertebrates, which means that they do not have backbones. They are also relatives of corals and sea anemones. Scientists believe that there may be as many as 2,000 types of jellyfish in the world’s oceans. Most species are found in saltwater, though a few freshwater varieties do exist.","heading":""},{"n":3,"text":"Because there are so many different species of jellyfish, it is not surprising that there is such variety in their appearance. The smallest jellyfish are less than an inch in length, while the largest may grow to be 200 feet long! Shape and color are two more ways in which jellyfish differ. Typically, jellyfish have little color because their bodies are composed of 95 to 99 percent water. Some species are more colorful and may be brown, pink, white, or blue.","heading":""},{"n":4,"text":"Most jellyfish have the same basic shape. From the top, they look similar to an umbrella or a mushroom, with long thin tentacles that extend below their “heads.” The tentacles are lined with stinging cells called nematocysts that the jellyfish uses to capture food such as small fish, plankton, and other small sea creatures.","heading":""},{"n":5,"text":"These same stinging cells are what cause people such pain if they accidentally step on a jellyfish that has washed up on shore or brush against a tentacle as they swim in the ocean. The sting from most species of jellyfish is relatively harmless, though it can be painful. However, there are several species of jellyfish whose sting can be fatal.","heading":""},{"n":6,"text":"For the most part, jellyfish are transported by ocean currents and the wind. They have some ability to move through the water by contracting muscles in the main part of the body. These contractions can push the jellyfish vertically through the water at a slow pace. For the most part, though, jellyfish are content to float through the waves, waiting for the next potential food source to become tangled in their tentacles.","heading":""},{"n":7,"text":"The next time you go to the beach, keep your eyes open for a colorless blob gently floating on the water’s surface. If you’re lucky, you’ll get a close-up view of one of the ocean’s strangest creatures.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P096","page":"P096","title":"Catching a Wave","exercisePage":"P097","pdfPage":100,"pdfExercisePage":101,"lead":"What kind of surfing tips will Kerry and Dylan give their cousins?","paragraphs":[{"n":1,"text":"Sophie and Miles sat on the shore and let the waves wash over their toes. They were watching their cousins surf. Dylan and Kerry were a few years older than Sophie and Miles, and they had started surfing almost before they were able to walk.","heading":""},{"n":2,"text":"Kerry rode a wave into shore, and then hopped off her board and jogged over to where Sophie and Miles were sitting. Her dark hair, which was as sleek and glossy as an otter’s fur, was plastered against her head. “Are you two ready to give it a try?” she asked, squinting through the sun at her cousins.","heading":""},{"n":3,"text":"Miles took a deep breath and nodded. He was worried about looking silly in front of his cousins, but he had a feeling he was going to love surfing. He expected it to feel like flying through the water or riding his bike down a steep hill without using the brakes.","heading":""},{"n":4,"text":"“Don’t go out too far!” shouted Mrs. Taylor into the wind, and Sophie cheerfully waved back to her parents. Sophie was usually good at the things she tried. She learned quickly and wasn’t afraid to plunge right in, even if she had never done something before. Miles admired these characteristics in his sister, but knew he just wasn’t as adventurous as she was.","heading":""},{"n":5,"text":"“Okay,” Kerry began, “we’re going to start you two out on longboards. They are easier to paddle, and they catch waves more easily, which is good when you are a beginner because it gives you more time to stand up.","heading":""},{"n":6,"text":"“There are a few surfing fundamentals that are pretty important. First, never paddle your surfboard out farther than you can swim back in without it. Know the beach you’re surfing, and know what weather conditions to expect. Never surf alone, and always remember your limitations. Don’t forget that as much fun as you have surfing, the ocean isn’t something to take lightly.” Kerry paused for a moment and looked at the serious expressions on her cousins’ faces.","heading":""},{"n":7,"text":"“Now for the fun part,” Kerry said. She waved her arms at Dylan, who waved back and began to paddle into shore. “You need to position yourself in the center of your board, between the nose and the tail. When you’re positioned the right way, the nose should be a couple of inches above the water’s surface. When a wave catches the tail of the board, start paddling. Try to remember the sweet spot on your board, because you’ll want to position yourself the same way each time you go out, no matter what kind of wave you’re trying to catch.”","heading":""},{"n":8,"text":"Sophie grinned at Kerry. “I had no idea that surfing was so technical. I thought you just catch a big wave and try to ride it without falling off.”","heading":""},{"n":9,"text":"Just then, Dylan walked up, shaking himself the same way the Taylors’ dog did after she had had a bath. “Is she still explaining things?” he asked Sophie and Miles, winking at Kerry.","heading":""},{"n":10,"text":"Kerry swatted at her brother. “They’re almost ready to get started,” she said, turning back to Sophie and Miles. “We’re just going to practice standing up a few times on the sand where the board will be on a stable surface. Then, you can try to paddle out and catch a wave.”","heading":""},{"n":11,"text":"“Who wants to go first?” she asked.","heading":""},{"n":12,"text":"Miles put up one hand. “This is the easy part,” he said. “Sand surfing doesn’t worry me a bit. Besides, I think I’m going to need all the practice I can get!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12}],"kind":""},{"id":"P098","page":"P098","title":"Wave-Sliding","exercisePage":"P099","pdfPage":102,"pdfExercisePage":103,"lead":"How did surfing become the popular sport it is today?","paragraphs":[{"n":1,"text":"Who first had the idea of shaping a piece of wood into a long narrow board and using it to ride ocean waves? No one knows for sure, but we do know that Hawaiians have been surfing since the 1400s. The Hawaiian word for surfing translates to wave-sliding, a fairly accurate description of this sport in which a surfer stands on a board and gets propelled across the water by the energy of the waves.","heading":""},{"n":2,"text":"Surfers are fond of saying that surfing isn’t a sport, it’s a lifestyle. This was true for the relatively small numbers of surfers who participated in the sport before the 1950s. Then, new types of surfboards became available. They were made of fiberglass and foam instead of wood. This made them less expensive, as well as much easier to use and maneuver. Suddenly, surfing became enormously popular in the United States, and surfing culture was born.","heading":""},{"n":3,"text":"Movies and magazines that featured surfing became trendy, as did beach music and surfing fashion. But nothing changed what was most important to serious surfers—enjoying the beach and the ocean as they went on a quest for the perfect wave.","heading":""},{"n":4,"text":"Surfing appeals to people for several reasons. Surfers have an inherent love and respect for the ocean. They like participating in a sport in which the challenges constantly change and the environment is somewhat unpredictable. Surfers also seek the adrenaline rush that comes with riding the waves. It is the same feeling that draws people to other high-speed activities, like downhill skiing, hang-gliding, or car racing.","heading":""},{"n":5,"text":"In 1953, the Waikiki Surf Club hosted the first international surfing championships. This competition led surfing to be regarded as a sport. Judges based their decisions on elements such as the length of ride, the number of waves a surfer caught, skill, sportsmanship, and grace. Today, the Association of Surfing Professionals, or ASP, holds annual world championship series at different beaches around the country. Some surfers participate happily in such competitions, but others feel that this goes against the true nature and “soul” of surfing.","heading":""},{"n":6,"text":"Other than Duke Kahanamoku, the Hawaiian surfer who is thought to have introduced the sport to the rest of the world, Laird Hamilton is probably the most well known and respected surfer today. Large waves are his specialty, and Hamilton has been known to surf 70-foot-tall waves at speeds of approximately 50 miles per hour.","heading":""},{"n":7,"text":"Hamilton also popularized a form of the sport called tow-in surfing. He wanted to have access to some of the oceans’ largest waves, but he knew surfers could not reach those waves just by paddling their boards. The solution was to use jet skis to tow surfers to areas that were farther from shore, where they could wait for enormous waves to crest nearby.","heading":""},{"n":8,"text":"The tow-in method is controversial among serious surfers, but most people couldn’t help being impressed when Hamilton used it to surf a well-known Tahitian surf spot called Teahupoo. Wipeouts at Teahupoo are likely to be fatal, but Hamilton took the challenge and survived.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P100","page":"P100","title":"The Father of Modern Surfing","exercisePage":"P101","pdfPage":104,"pdfExercisePage":105,"lead":"Who was Duke Kahanamoku, and how did he change the world of surfing?","paragraphs":[{"n":1,"text":"The word Duke brings to mind royalty. Duke Kahanamoku was not royalty, but he might as well have been a king in Hawaii. He was a talented swimmer, an actor, and even the mayor of Honolulu, Hawaii, for nearly 30 years. But what Duke Paoa Kahinu Makoe Hulikohoa Kahanamoku will be most remembered for is bringing surfing to the world outside of Hawaii.","heading":""},{"n":2,"text":"Kahanamoku was a native Hawaiian, born in 1890 in Honolulu. From an early age, he felt most at home at the beach and in the ocean. He attended school but rushed home every afternoon, knowing that the ocean was patiently waiting for him.","heading":""},{"n":3,"text":"Kahanamoku went to the Olympics as a swimmer in 1912 and 1920, where he won a total of three gold medals for the United States. He also traveled around the world as a water safety instructor for the Red Cross in between Olympics.","heading":""},{"n":4,"text":"Kahanamoku was so enthusiastic about the water that he was able to successfully encourage others to take an interest in water sports. As he traveled, Kahanamoku spoke about surfing and demonstrated the sport to audiences around the globe. Surfing, which had had little publicity outside of Hawaii, started gaining in popularity.","heading":""},{"n":5,"text":"Kahanamoku’s favorite type of board was made from a koa tree. It was quite long by today’s standards—16 feet in length—and it weighed 114 pounds. As a point of comparison, boards today are only 6 to 9 feet long and weigh between 6 and 15 pounds. Kahanamoku’s preferred board was fashioned after the ancient Hawaiian olo boards. Kahanamoku was convinced that it was the best because he believed that big boards were for big waves. One of Kahanamoku’s early boards can be viewed today in Honolulu’s Bishop Museum.","heading":""},{"n":6,"text":"Duke Kahanamoku was the first person to be inducted into both the Swimming Hall of Fame and the Surfing Hall of Fame. Yet all the celebrity surrounding his achievements seemed to have little effect on Kahanamoku’s personality. The ocean remained his first love, and he stayed true to the roots of his Hawaiian culture, speaking the language, following the customs, and eating the foods as often as possible.","heading":""},{"n":7,"text":"Kahanamoku died in 1968 at the age of 77. He had a burial at sea, accompanied by a 30-person police escort. Kahanamoku’s ashes were scattered in the water off Waikiki Beach, the place he had felt most at home in the world, while a group of beach boys sang traditional Hawaiian songs. The world would never forget the man who shared his love of the ocean and surfing with people all around the globe.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P102","page":"P102","title":"It’s All Academic","exercisePage":"P103","pdfPage":106,"pdfExercisePage":107,"lead":"Keep reading to find out more about the experiences of the Schuyler Middle School students who appear on an academic quiz show.","paragraphs":[{"n":1,"text":"The bus was filled with energy and excitement. Students were talking and laughing, but there was also a bit of nervous energy in the air. As the bus rounded the corner and pulled into the parking lot at the television studio, Mr. Ishikawa cleared his throat.","heading":""},{"n":2,"text":"“I want to thank each one of you for your hard work. I know that many of you have had to put other activities on hold for the intensive training we’ve done in the past weeks.","heading":""},{"n":3,"text":"“Whether or not Schuyler Middle School wins today’s competition, I’m proud of you all,” Mr. Ishikawa continued. “It’s a great honor just to have qualified to be on Quiz Power. Schuyler is proud to have you represent our school. Just do your best, and enjoy yourselves today.”","heading":""},{"n":4,"text":"The members of the team cheered as Mr. Ishikawa finished his speech. The students knew they were ready for almost any question the quizmaster might pose. They couldn’t wait to get started.","heading":""},{"n":5,"text":"Inside the studio, the students were met by Annette Cane, the show’s executive producer. Ms. Cane was a tall, friendly woman with thick auburn hair and an infectious laugh. Within a few minutes, she had put all the contestants at ease. When the competing team from Brighton Park arrived, Ms. Cane made quick introductions and passed out drinks.","heading":""},{"n":6,"text":"“I’m sure you’ve already heard this a hundred times today,” she told the room of expectant students, “but the most important thing you can do during the competition is to relax and have fun. Do your best to ignore the cameras and the microphones. Once the announcer has finished asking a question, you will want to ring your buzzer as soon as you think you have the answer.","heading":""},{"n":7,"text":"“People tend to speak more quickly when they are nervous, so just try to answer slowly and calmly when it’s your turn.” She smiled sympathetically at the students who were beginning to look tense. “Do you have any questions before we begin taping?”","heading":""},{"n":8,"text":"Gabriel, a seventh-grader from Schuyler, waved his hand. “Will the winning team come back to compete for the championship?” he asked.","heading":""},{"n":9,"text":"Ms. Cane nodded. “The championships are held in the spring. The winning teams from the rest of the year will participate in playoffs to determine the final four teams. Each member of the winning team will receive a $1,000 college savings bond. The winning school will also receive two brand-new, fully-equipped computers.”","heading":""},{"n":10,"text":"“Who chooses the questions that are used during the show?” asked Monique, an eighth-grader from Brighton Park.","heading":""},{"n":11,"text":"“We have a panel of researchers who compile a list of questions. They come together to narrow down the list of questions and determine which ones will actually be used in the show. Each question is given a rating to ensure that the level of difficulty progresses as the game goes on.” Ms. Cane glanced at the platform where there were places for each team and a podium for the announcer.","heading":""},{"n":12,"text":"“Any more questions?” she asked. The students were silent, focused on the task ahead of them. “Then, let the game begin!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12}],"kind":""},{"id":"P104","page":"P104","title":"Tune in to History","exercisePage":"P105","pdfPage":108,"pdfExercisePage":109,"lead":"Do you know who invented television?","paragraphs":[{"n":1,"text":"Television is such a familiar part of our daily lives that you probably never think about its history or the fact that as recently as 70 years ago many people had never even heard of it. The word television comes from the Greek word tele, which means far, and the Latin word visio, which means sight. It’s the perfect description for this electronic device that receives images and sound transmitted from another place.","heading":""},{"n":2,"text":"Early in the 20th century, many experiments were attempted to transmit moving images from one place to another. Because there were so many contributors, it is hard to pinpoint exactly who gets credit as the inventor of TV. However, television as we know it today was developed in the 1920s by two men working separately.","heading":""},{"n":3,"text":"Philo Taylor Farnsworth, a farm boy from Idaho, demonstrated the first electronic television in 1927. It was a prototype of the TVs we use today. During the late 1920s, a Russian-born scientist named Vladimir Zworykin worked with the electronics company RCA to develop the first marketable televisions. Because of this pivotal role in bringing TV to the public, he was regarded for many years as the “inventor” of television. Historians disagree about which man deserves more credit, but today, Farnsworth’s contribution is seen as the crucial first step in the technological developments made by Zworykin.","heading":""},{"n":4,"text":"The first TVs were not too impressive by our standards. In fact, they were actually radios with an extremely small television device attached. The screen was lit by a reddish neon light, and the image was only the size of a postage stamp.","heading":""},{"n":5,"text":"By the 1930s, TVs became available to the public, but they were very expensive—about $7,000 each in today’s money. After World War II, however, the price dropped significantly and televisions became a much more common sight. By the late 1950s, color televisions became available, and the Western series Bonanza became the first TV show to be regularly shown in color.","heading":""},{"n":6,"text":"Television is similar to radio in the way that it uses an antenna to pick up signals sent over the airwaves. Local TV stations still send signals that can be picked up by your TV’s antenna, but increasing numbers of people use cable to receive their television broadcasts.","heading":""},{"n":7,"text":"In 1949, John Watson, a television salesman in rural Pennsylvania, was having a hard time selling his TVs. Television signals were weak by the time they reached his town, and people did not think it was worthwhile to buy a TV. Watson put up a giant antenna to get better reception and offered his customers a free connection to the stronger signal. Eventually, he started to charge for the service, and cable TV was born.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P106","page":"P106","title":"Moving Images","exercisePage":"P107","pdfPage":110,"pdfExercisePage":111,"lead":"What is the most important event you have seen on TV?","paragraphs":[{"n":1,"text":"With at least one television in nearly every home in the United States, TV has become the major source for news. In recent memory, September 11, 2001, and the days that followed kept people glued to their television sets for information and comfort. During the more recent war in Iraq, Americans turned on their TVs for similar reasons. Many historical events from the past 50 years would not be remembered the same way without the televised images. Some events were even shaped by the powerful influence these images have on the public.","heading":""},{"n":2,"text":"The “Checker’s Speech” by vice-presidential candidate Richard Nixon was an early example of how television can change the public’s perception of someone. Nixon had been accused of accepting gifts for his campaign and was viewed negatively by the public.","heading":""},{"n":3,"text":"On September 9, 1952, Nixon went on TV to defend himself. He claimed that the only questionable gift he had received was the family dog, Checkers, and he was not about to give the pet back. The public was moved to tears by Nixon’s speech, and he redeemed himself. However, television would not be so kind to Nixon in the future.","heading":""},{"n":4,"text":"In 1959, television played an important role in the presidential debate between Richard Nixon and John F. Kennedy. Viewers saw a younger, smiling Kennedy trading viewpoints with Nixon, who was scowling and looked uncomfortable. Radio listeners, who had heard only the words and ideas, thought that Nixon had won the debate. However, television viewers declared Kennedy the winner. The power of televised images in politics was never underestimated again.","heading":""},{"n":5,"text":"During the tragedy of JFK’s assassination, television allowed the citizens of our nation to grieve together. People across the country saw Kennedy’s coffin as it was loaded onto Air Force One while Jackie Kennedy, the First Lady, stood by watching. Millions who were still in shock over these unbelievable events viewed JFK’s funeral procession. Many citizens were also reassured about the power of our democracy as they watched Vice-President Lyndon Johnson quickly sworn in as the new president.","heading":""},{"n":6,"text":"Not all historical moments on television involve politics. For instance, the Beatles’ appearance on the Ed Sullivan Show on February 9, 1964, changed American pop culture. Viewers across the nation saw their goofy grins and goofier haircuts, as well as the crowd’s frenzied cheering, and “Beatlemania” was born.","heading":""},{"n":7,"text":"In July of 1969, 94 percent of Americans who owned televisions watched a live broadcast and saw Neil Armstrong and Buzz Aldrin become the first humans on the moon. Around the world, nearly one billion people watched this event on TV.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P108","page":"P108","title":"A Reservoir of Memories","exercisePage":"P109","pdfPage":112,"pdfExercisePage":113,"lead":"Have you ever gone canoeing?","paragraphs":[{"n":1,"text":"Meghan sat in the canoe, patiently waiting for her sister and grandma to join her. She watched Becca cautiously step into the canoe as her grandma coached her.","heading":""},{"n":2,"text":"“Remember not to stand up all the way or make any abrupt movements,” said Grandma, holding the canoe steady.","heading":""},{"n":3,"text":"Once Becca was safely in the canoe, Grandma passed the girls the camera, which was sealed in a waterproof bag. She confirmed that both paddles were in the canoe, and then she deftly climbed in and settled herself at the head of the small craft.","heading":""},{"n":4,"text":"“How did you learn to canoe, Grandma?” asked Becca, once Meghan and their grandmother had established a rhythm for paddling.","heading":""},{"n":5,"text":"“It was such a long time ago,” she said thoughtfully, “in a reservoir much like this one. When I was 18 years old, I worked as a camp counselor at a girls’ summer camp in Vermont. I learned how to canoe that summer, but I also learned how to build a fire, treat snake bites, and survive in the woods for a week on my own. At least in theory,” she chuckled.","heading":""},{"n":6,"text":"“There was a boys’ camp nearby, and we scheduled activities or events with them several times during the summer. That’s actually how I met your grandfather,” she said, smiling fondly.","heading":""},{"n":7,"text":"“I love him dearly, but your grandpa is one of the most uncoordinated people I’ve ever known.” Grandma continued. “The day we met, he was paddling a canoe across the reservoir, and he kept overturning it. He’d reach for something in the canoe, or stand up when he got excited and lose his balance. He asked me to give him canoeing lessons, but I think it was just because he wanted to get to know me.” Grandma smiled at the memory.","heading":""},{"n":8,"text":"“How is a reservoir different than a lake?” asked Meghan.","heading":""},{"n":9,"text":"“It is a type of lake,” said Grandma, resting her paddle across her knees. “Most lakes are naturally formed, but reservoirs are made by humans. I’ve brought you to see Dillon Dam before, haven’t I?” she asked. The girls nodded. “Dillon Dam was built about 30 years ago to control the flooding in this area. When a dam is built, an artificial lake is created by flooding the land behind the dam.”","heading":""},{"n":10,"text":"Becca furrowed her eyebrows. “I still don’t understand how that controls flooding,” she said.","heading":""},{"n":11,"text":"“The dam can be emptied when flooding is expected,” said Grandma. “Making space for flood waters helps, because the water can be held in the reservoir and gradually released later. The reservoir is also hundreds of times wider than the river, so water that would flood the banks of a river only causes the water level in the reservoir to rise a small amount.” Grandma picked up her paddle, and she and Meghan began paddling again.","heading":""},{"n":12,"text":"Becca looked around at the high valley walls surrounding the reservoir and the serene water that stretched as far as she could see. “I’m glad that reservoirs aren’t only used for controlling floods,” she said.","heading":""},{"n":13,"text":"Grandma laughed. “Me, too,” she said. “I might never have met your grandpa otherwise!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13}],"kind":""},{"id":"P110","page":"P110","title":"Blocking Water","exercisePage":"P111","pdfPage":114,"pdfExercisePage":115,"lead":"Is there a dam located near you?","paragraphs":[{"n":1,"text":"If you are hiking through the woods and notice a pile of timber, mud, and stone blocking a stream, you just might have stumbled upon a beaver dam. Beavers build dams so they can construct their lodges in the middle of the pond that forms as a result of the blocked water. The entrance to the lodge is located under the surface of the water, allowing the pond to function as a natural defense against predators. The pond also allows the beavers to live right on top of water lilies, their favorite meal.","heading":""},{"n":2,"text":"However, the biggest builders of dams are humans, and they have been doing it for a long time. Some of the earliest structures built by humans are dams dating back nearly 5,000 years. At the beginning of civilization, dams were built in the Middle East so that people could stay in one place and farm. The water captured by dams enabled the first farmers to irrigate crops in areas that were otherwise too dry. The Ma’rib Dam in Yemen, originally built 2,700 years ago, is still in use today, although many parts of it have been rebuilt during that time.","heading":""},{"n":3,"text":"Irrigation is just one reason people build dams. Water that pools behind these structures can also supply drinking water to cities and towns. Dams allow large populations to live in places where water is scarce. Lake Mead is a reservoir, or artificial lake, created by Hoover Dam. It provides water for more than 16 million people in Nevada, Arizona, and California. The Colorado River feeds Lake Mead, which holds enough water to cover the entire state of Pennsylvania!","heading":""},{"n":4,"text":"Dams are also used to help ships and barges navigate rivers that would otherwise be too shallow. Canals are built alongside the dam so that boats can travel around it. In addition, the canals usually contain locks because the area around the dam is higher than the river, meaning the boat needs to travel up and over the surrounding area.","heading":""},{"n":5,"text":"A lock is part of the canal that can be blocked off and filled with water. Each lock is flooded or drained, depending on whether the boat needs to be raised or lowered. The front of the lock is then opened, allowing the boat to float into the next lock. The process is repeated until the boat has traveled up or down the area needed to pass the dam.","heading":""},{"n":6,"text":"Many modern dams harness the power of flowing water, transforming its energy into electricity. These dams are hydroelectric dams. The largest hydroelectric dam in the world is under construction right now in China. It is expected to have a reservoir 370 miles long. The Three Gorges Dam on the Yangtze River is designed to control flooding but will also produce enough energy to fill a good deal of China’s electrical needs.","heading":""},{"n":7,"text":"Three Gorges Dam has created controversy, for many of the same reasons that other large dams have. Land that has always been dry will now be underwater, altering the environment drastically. Dams especially affect migratory fish, like salmon and trout, because they need to move upstream and downstream for feeding and reproduction. Three Gorges Dam has also displaced millions of people because their homes have been destroyed to make space for the dam.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P112","page":"P112","title":"The Eighth Wonder of the World","exercisePage":"P113","pdfPage":116,"pdfExercisePage":117,"lead":"Why is Washington’s Grand Coulee Dam considered to be such an impressive structure?","paragraphs":[{"n":1,"text":"The Grand Coulee Dam, on the Columbia River in Washington State, is one of humankind’s most amazing structures. There is enough concrete in the dam to build a four-lane highway between Los Angeles and New York City. The dam is more than a mile long, and at 550 feet tall, it is about twice as tall as the Statue of Liberty or Niagara Falls!","heading":""},{"n":2,"text":"If you are thinking that it must have been a time-consuming project to build the dam, you are correct. Work on the Grand Coulee Dam was begun in 1933 during Franklin D. Roosevelt’s administration. When the dam was finally completed in 1942, nine years after it was begun, it was the largest dam in the world.","heading":""},{"n":3,"text":"Initially, the Grand Coulee Dam was built as part of an irrigation system for desert areas in the Pacific Northwest. However, World War II was beginning just as the dam was completed, and it became necessary to use the energy created by the flow of water.","heading":""},{"n":4,"text":"Hydroelectric power uses the energy created by falling water to produce electricity. The type of energy produced by falling water is called mechanical energy. It is converted into electrical energy by a generator and a water turbine. As the country’s need for electricity increased during the war, the Grand Coulee Dam was able to fill some of that need with the massive amounts of energy it produced.","heading":""},{"n":5,"text":"Although the dam proved to be beneficial to the area and to the nation, there were also drawbacks to its existence. The land of Native American tribes who lived along the Columbia River was flooded after the construction of the dam, and they were forced to move to new areas. In addition, the dam disrupted the migration of salmon, a staple of their diet.","heading":""},{"n":6,"text":"In the 1990s, the government was required to offer a large sum of money to the Colville tribe in payment for the disturbances and suffering the dam had caused. Although the tribe received millions of dollars, the money could not buy back what its members and their relatives had lost.","heading":""},{"n":7,"text":"Today, the dam is a popular tourist attraction. It continues to function as a source of irrigation and as a powerful electrical generator. Franklin Delano Roosevelt Lake, the reservoir created by the dam, has more than 500 miles of shoreline. Residents and visitors enjoy a variety of recreational activities there, including fishing, swimming, hiking, and boating. The public can tour the inside of the dam. During the summer months, they can watch a laser light show on the dam’s wall.","heading":""},{"n":8,"text":"If you ever happen to visit Washington, put the Grand Coulee Dam on your list of places to see. With its enormous size and incredible power, no wonder it is often considered to be the Eighth Wonder of the World.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P114","page":"P114","title":"Book Fair Brainstorming","exercisePage":"P115","pdfPage":118,"pdfExercisePage":119,"lead":"Does your school hold an annual book fair?","paragraphs":[{"n":1,"text":"“This is a lot of responsibility, Caleb,” said Tanika, twirling her pen. “I don’t have much experience planning an event like this. I’m glad Mr. Rutledge trusted us to work out all the details, but I’m still worried that we’ll forget something important.”","heading":""},{"n":2,"text":"Caleb leaned back in his chair. “I’m not worried, Tanika,” he said. “We just have to be organized. I have no doubt that this will be the best annual book fair George Washington Middle School has ever seen. We’ll raise so much money for the library that they’ll have to build a new room to accommodate all the books they’ll be able to buy,” he joked.","heading":""},{"n":3,"text":"Tanika grinned at Caleb. “You might be just a bit too optimistic, but I agree with you that somehow we’ll manage to make this book fair a success.”","heading":""},{"n":4,"text":"Caleb took out a pad of paper. “Do we have the list of books the librarians ordered?” he asked.","heading":""},{"n":5,"text":"Tanika handed Caleb some papers that he quickly leafed through. “We should think of some interesting display ideas,” he said thoughtfully. “The book fairs that we’ve had in the last few years have been kind of dull. I want this one to make everyone feel excited about reading.”","heading":""},{"n":6,"text":"“What if we set up areas with different themes?” suggested Tanika. “We can borrow different kinds of sports equipment from Ms. Spisak and make a display near the sports books.”","heading":""},{"n":7,"text":"Caleb was sitting up in his chair writing furiously. “That is a fantastic idea, Tanika!” he said excitedly. “We can have a different exhibit for each area. My class has a turtle and some fish that we could display in the area with books about animals.”","heading":""},{"n":8,"text":"“The librarians ordered quite a few winter and holiday books, as well,” said Tanika, consulting the list again. “We could make a festive winter scene in one area. I know where there are some little white lights from the school play. I can bring in my ice skates and a few pairs of mittens for the display.”","heading":""},{"n":9,"text":"“What about trying to see if we could get a few writers to come in on the day of the book fair? They could sell autographed copies of their books and answer questions students have about being a writer.”","heading":""},{"n":10,"text":"“Rachael Weinstock’s mom wrote a picture book a few years ago,” said Tanika. “She’s done several author events around town, and there’s a good chance she’d be willing to help us.”","heading":""},{"n":11,"text":"“And Carson Davies’s dad used to be an editor for a children’s book publisher. He might know some local authors, too,” added Caleb. He made a few more notes on his pad of paper. “Are you still worried about being able to pull off this book fair, Tanika?” he asked.","heading":""},{"n":12,"text":"Tanika shook her head. “Now I just can’t wait for it to get here,” she said. “I think a little of your optimism has started to rub off on me!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12}],"kind":""},{"id":"P116","page":"P116","title":"Book Fair Funds","exercisePage":"P117","pdfPage":120,"pdfExercisePage":121,"lead":"How will Tanika and Caleb decide to spend the proceeds from the book fair?","paragraphs":[{"n":1,"text":"Tanika and Caleb sat at a large round table in the library with their teacher, Mr. Rutledge, and one of the school librarians, Mrs. Angley. The adults were grinning widely at Tanika and Caleb, who smiled back uncertainly.","heading":""},{"n":2,"text":"“You are probably wondering why we asked you both to stay a few minutes after school today,” began Mr. Rutledge. “We have the totals from last weekend’s book fair, and we wanted to share them with you,” he continued. “Mrs. Angley, will you do the honors?” he asked, turning to the librarian.","heading":""},{"n":3,"text":"Mrs. Angley nodded. “This has been the most successful book fair in the nine years that Washington has held book fairs,” she said, passing out a sheet of paper that showed the results of previous book fairs. “Much of the credit goes to you two,” she added, gesturing to Tanika and Caleb, who still had expressions of awe on their faces. “Mr. Rutledge is also deserving of some credit since it was his idea to involve such creative and motivated students in planning the fair.”","heading":""},{"n":4,"text":"“This is great news,” said Caleb. “We could see that people were enjoying themselves at the fair, but we had no idea how that would translate into profits.”","heading":""},{"n":5,"text":"“The planning required a lot of work,” added Tanika, “but we had so much help. It really was a team effort.”","heading":""},{"n":6,"text":"“Because you both put so much energy and enthusiasm into this event,” said Mr. Rutledge, “we’ve decided that we could use your help in allocating the money we raised. The principal and the library staff have already set aside funds for items that are necessities. However, it has not yet been decided how the remaining money will be used. Do you have any ideas?”","heading":""},{"n":7,"text":"Caleb and Tanika were quiet for a moment as they thought about the possibilities. Then, Caleb spoke up. “I agree with what Tanika said about the fair being a team effort. Students from every class contributed, and it would be nice if there was a way we could show our appreciation. Could they help decide which books will be added to the library’s collection?” he asked.","heading":""},{"n":8,"text":"“That’s an excellent idea,” agreed Mr. Rutledge.","heading":""},{"n":9,"text":"“If there’s any money leftover,” said Tanika, “do you think we could use it to bring authors and illustrators to the school more often? Everyone I talked to seemed to think that was the best part of the fair.”","heading":""},{"n":10,"text":"Mrs. Angley nodded. “We’ve already put some money aside for that,” she said. “The school received several donations from parents during the fair, and the principal thinks that the money would be well spent just as you’ve suggested.”","heading":""},{"n":11,"text":"“There’s just one more thing,” said Mr. Rutledge, turning to Tanika and Caleb. “Would you consider helping to plan next year’s book fair? We could use your expertise.”","heading":""},{"n":12,"text":"Tanika and Caleb exchanged glances. “With an invitation like that, how could we resist?” said Caleb.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12}],"kind":""},{"id":"P118","page":"P118","title":"A Writer’s Life","exercisePage":"P119","pdfPage":122,"pdfExercisePage":123,"lead":"Who are your favorite authors? Do you know how they became writers?","paragraphs":[{"n":1,"text":"Louis Sachar is one of the most well-known writers of children’s books today. He is the author of more than 20 books that are loved by children, parents, teachers, and critics alike. You might recognize Sachar’s name from the series of Wayside School books or Marvin Redpost books. You might also know him as the author of the Newbery Award-winning book Holes.","heading":""},{"n":2,"text":"As successful as Louis Sachar is at writing funny, touching books that kids can relate to, he didn’t always know he wanted to be a writer. Sachar remembers enjoying his writing assignments in school, but writing wasn’t something he did on his own. When he was in college, he studied economics, and even briefly studied Russian language and literature.","heading":""},{"n":3,"text":"Sachar spent time as a teacher’s aide when he was in college because he thought it would be an easy way to earn class credit. Although the work was not as easy as he thought it would be, Sachar found that he really enjoyed working with young people. In fact, Hillside Elementary, where Sachar worked as an aide, eventually became the inspiration for his popular Wayside School books. The kids in the books are even named after students that Sachar worked with in real life!","heading":""},{"n":4,"text":"Even after his experiences teaching and working with children, Sachar still hadn’t made a decision about what career path to follow. After college, he decided to go to law school. He graduated several years later with a law degree. By this time, Sachar had published his first children’s book, but he didn’t feel confident about making a living as a writer.","heading":""},{"n":5,"text":"About ten years later, after the publication of several more books, Sachar finally felt that his books were successful enough for him to devote himself to writing full time. In 1989, Sachar quit his job as an attorney and became a writer.","heading":""},{"n":6,"text":"Sachar spends about two hours writing each morning, when he feels most fresh and sharp. He likes to be alone when he writes, except for the company of his two dogs, Tippy and Lucky. Some writers base their stories closely around the people and events in their lives, and others create characters and places that are entirely fictional. Sachar uses a combination of the two. He tries to remember what it was like to be a child and to use those memories and feelings in his novels. He also uses his teaching experiences, as well as moments from his daughter’s life.","heading":""},{"n":7,"text":"Sachar doesn’t sit down with an organized plan or outline when he starts a new book. Instead, he begins with just a seed of an idea—maybe a character trait or a funny event. He starts writing and finds that the act of writing produces more ideas. Those ideas branch out into other ideas, and before he knows it, a new book is well on its way.","heading":""},{"n":8,"text":"Sachar doesn’t worry too much about perfecting his story, plot, characters, and setting the first time around. In fact, he may rewrite his story five or six times before he even sends it to his publisher. That might seem like a lot of work, but one thing is for sure—Louis Sachar seems to have hit on a winning formula for writing!","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P120","page":"P120","title":"So, You Want to Be a Writer?","exercisePage":"P121","pdfPage":124,"pdfExercisePage":125,"lead":"What are some tips on becoming a writer?","paragraphs":[{"n":1,"text":"Read everything you can. Most writers are voracious readers. They read because they love to lose themselves in books. They like the sounds of language and the way that reading a good description can feel as satisfying as winning a baseball game or eating a banana split.","heading":"Read everything you can."},{"n":"u1","text":"As you read, pay attention to what speaks to you. Do you like stories that are fast-paced and full of unexpected twists? Do you prefer to read books with characters who seem like someone you might know? Do you like tales that take you on faraway adventures, or ones that explain the mysteries of the natural world? Do you like to feel scared when you read under the covers, or do you like a story that makes you laugh until you cry? Think about the types of writing you like best, and try to identify the qualities that appeal to you.","label":"未编号材料","raw":"As you read, pay attention to what speaks to you. Do you like stories that are fast-paced and full of unexpected twists? Do you prefer to read books with characters who seem like someone you might know? Do you like tales that take you on faraway adventures, or ones that explain the mysteries of the natural world? Do you like to feel scared when you read under the covers, or do you like a story that makes you laugh until you cry? Think about the types of writing you like best, and try to identify the qualities that appeal to you."},{"n":2,"text":"Keep a notebook. It’s easy to forget a good idea if you do not record it immediately. If you get in the habit of carrying a notebook or journal with you everywhere you go, you can write down anything you want to remember. When you are talking to friends in the cafeteria or waiting for the bus, something might spark an idea for a character or a scene in a story. You might have a dream you don’t want to forget, or you might just write down the lyrics of a song you love. These everyday thoughts and observations can be material for a story, poem, or essay that you write one day.","heading":"Keep a notebook."},{"n":3,"text":"Write every day. One piece of advice that nearly all writers agree on is that writers must write. It doesn’t matter if you feel like you have nothing to say; the important thing is that you write every single day. Sometimes, you need to give yourself permission to write things you know won’t be your best work. Once you start writing, you’ll see that this is a good way to clear your mind and make room for more of the “good stuff.”","heading":"Write every day."},{"n":4,"text":"Join or start a writing group. Do you have any friends who enjoy writing? Think about starting a writing group with other people who have similar interests. It helps to have the support of other writers. You will also receive valuable feedback, or suggestions, about how to make your work better.","heading":"Join or start a writing group."},{"n":5,"text":"Do your homework. If you decide that you would like to submit your work for publication, make sure to do your research. If you are sending your writing to a magazine, look through old issues. Does it seem like your writing fits in with the other stories or articles? If you are submitting to a book publisher, explore their website to make sure your material is similar to (but not exactly the same as) other books they publish.","heading":"Do your homework."},{"n":"u2","text":"Also make sure that you pay attention to the guidelines. Present your work to them exactly the way they have requested it. If your work doesn’t conform to their guidelines, the publisher may not even look at it.","label":"未编号材料","raw":"Also make sure that you pay attention to the guidelines. Present your work to them exactly the way they have requested it. If your work doesn’t conform to their guidelines, the publisher may not even look at it."},{"n":6,"text":"Stay positive. A writer’s life can be frustrating. Sometimes it’s hard to sit down and write. You may get many rejections before you receive a single acceptance. This is why perseverance is an important quality for a writer to have.","heading":"Stay positive."},{"n":"u3","text":"Writing can also be one of the most satisfying jobs in the world. Most writers feel lucky to do what they do and wouldn’t trade their career for any other. You could be one of them someday.","label":"未编号材料","raw":"Writing can also be one of the most satisfying jobs in the world. Most writers feel lucky to do what they do and wouldn’t trade their career for any other. You could be one of them someday."}],"blocks":[{"type":"paragraph","n":1},{"type":"note","n":"u1"},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"note","n":"u2"},{"type":"paragraph","n":6},{"type":"note","n":"u3"}],"kind":""},{"id":"P122","page":"P122","title":"A Lone Adventure","exercisePage":"P123","pdfPage":126,"pdfExercisePage":127,"lead":"Will Tyler be able to survive all alone on a faraway island?","paragraphs":[{"n":1,"text":"When I woke up, my mouth was full of sand and the sun was glaring angrily at me from high in the cloudless sky. I sat up and spit the sand from my mouth. I could feel every sore muscle as I walked the few feet to the water. The salt stung my dry, cracked lips, but the water helped remove the last bits of sand that lay gritty and unpleasant below my tongue and in my teeth.","heading":""},{"n":2,"text":"As I stood in the water to soothe my sunburned skin, I tried to piece together the events of the past few days. Try as I might, I could remember very little. I knew that my ship had capsized because I could see its remains lying not far down the beach. I knew that the crew had escaped in the lifeboats when they became sure the ship was sinking. They had begged me to come with them, but I insisted that a captain must always remain with his ship.","heading":""},{"n":3,"text":"A few minutes later, I decided to walk down the beach and see what remained of my beloved vessel. My stomach was an animal, growling and rumbling hungrily. As bright as the day was, I knew that night would fall quickly. I needed to build a shelter for myself before dark, and I would need a source of fresh water and food.","heading":""},{"n":4,"text":"It would be hard to call the bits of wood that were strewn about the beach a boat. Luckily, I found a canvas bag that was tied to a large, flat piece of wood that I must have used as a makeshift raft. I worked at the knot for a few minutes before I was able to loosen it enough to untie the bag.","heading":""},{"n":5,"text":"Inside, I was pleased to find a knife, a wool blanket, a small bottle of water, and four cans of food—fish, beans, corn, and stewed tomatoes. There was also a box of matches, but my heart sank when I saw how soggy they were. I would place them on the beach to dry in the sun, but I was skeptical that they would be of much help in producing fire.","heading":""},{"n":6,"text":"I chose a spot just off the beach to make my shelter. The sandy ground would provide a bit more comfort than the land farther up in the wooded area, which was knotted with the roots of trees and covered with twigs and branches. I used my knife to split pieces of bamboo that I planned to use as the walls and roof of my hut.","heading":""},{"n":7,"text":"I was sweating with the effort of my work when I felt a cool breeze that chilled my damp skin. I stood quietly, enjoying a moment of relief from the sun’s glare, when I noticed dark clouds gathering in the sky. I quickly resumed my task, hoping that the storm would not move in too rapidly. Another gust of wind caught the edge of my blanket and carried it down the beach. I raced after it as the first sounds of thunder rumbled around me.","heading":""},{"n":8,"text":"The garbage truck growled and rumbled as it chugged down the street. Tyler lay on his bed with his eyes open for a moment before he could identify the sound. He sat up quickly, and the book that had been resting on his covers dropped to the floor with a thud. The bearded face of Robinson Crusoe stared up at Tyler from the cover of the book as he fumbled for his glasses. He glanced at his bedside clock. Eight o’clock! He had overslept again. Tyler jumped out of bed and headed for the bathroom.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P124","page":"P124","title":"The Real Crusoe","exercisePage":"P125","pdfPage":128,"pdfExercisePage":129,"lead":"How long do you think you could go without human company?","paragraphs":[{"n":1,"text":"Robinson Crusoe by Daniel Defoe is one of the most well-known and widely-read books ever written. It was published in 1719, and by the end of the next century, more than 700 versions, translations, sequels, and imitations had been published.","heading":""},{"n":2,"text":"Robinson Crusoe is a fascinating adventure tale of a man who is shipwrecked on an island and survives until his rescue 28 years later. There is no doubt that Defoe was an imaginative and gifted storyteller, but the idea for the fictional character of Crusoe didn’t come solely from Defoe’s imagination. That is why it is believed that the story of Robinson Crusoe was actually based on the real life adventures of Alexander Selkirk.","heading":""},{"n":3,"text":"Selkirk was a Scottish sailor on a ship called the Cinque Ports. He had had frequent disagreements with the ship’s captain, William Dampier, about the safety of the craft and the decisions the captain had made during the expedition. Selkirk demanded to be left ashore at the Juan Fernández Islands (about 400 miles off the coast of Chile) when he became convinced that the Cinque Ports was no longer seaworthy.","heading":""},{"n":4,"text":"Captain Dampier was not sorry to see Selkirk go and happily left him on one of the islands. Selkirk seemed to have had a moment of regret as the ship left, but it was too late; no one heard his cries for the ship to return.","heading":""},{"n":5,"text":"Selkirk quickly learned what he needed to do to survive on the uninhabited island. He had brought several items with him from the ship, including a musket, gunpowder, a knife, carpenter’s tools, clothing, and a few books.","heading":""},{"n":6,"text":"Selkirk used native trees and his tools to construct two huts for shelter, which he then covered with long grasses. There were plenty of goats on the island, so he was assured a steady supply of milk and meat. There were even vegetables that had been planted by Spanish sailors who had stopped at the island in years past.","heading":""},{"n":7,"text":"At first, Selkirk had a serious problem with the island’s rats, which gnawed at him at night while he slept. However, sailors had also left cats on the island. Selkirk found that he could easily control the rat population by using meat to entice the cats to remain nearby.","heading":""},{"n":8,"text":"Selkirk managed to survive on the island for four years. Loneliness and depression were as much a problem for him as food and shelter. Eventually, though, Selkirk came to enjoy living alone with only his books, cats, and goats for company.","heading":""},{"n":9,"text":"When he was finally rescued by a ship called the Duke, Selkirk found that it was difficult to adjust to being around people again and that he had lost some of his language skills. He became accustomed to living in society again, but a part of him always missed the peace of the island.","heading":""},{"n":10,"text":"In 1712, Woodes Rogers, captain of the Duke, published A Cruising Voyage Round the World, which included an account of Alexander Selkirk’s experiences in the Juan Fernández Islands. This book, as well as Defoe’s Robinson Crusoe, has given readers a chance to experience the life and adventures of an island castaway—adventures they could otherwise only imagine.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10}],"kind":""},{"id":"P126","page":"P126","title":"A Desert in Bloom","exercisePage":"P127","pdfPage":130,"pdfExercisePage":131,"lead":"Will Chiara and her mom be able to make themselves feel at home in their new house?","paragraphs":[{"n":1,"text":"Chiara made her way down the hallway, past the neatly stacked cardboard boxes, and into the kitchen, where the early morning sunlight streamed through the windows. She stepped over another stack of boxes and slid open the glass door that led to a small deck. Chiara’s mom was sipping a cup of coffee, wisps of steam drifting into the air.","heading":""},{"n":2,"text":"“What are you doing, Mom?” asked Chiara, staring out at the turquoise sky and clumps of plants that dotted the backyard.","heading":""},{"n":3,"text":"“Well,” began Mrs. Giardini, “I was just noticing how strange and unfamiliar the landscape is here. Arizona and Massachusetts could be different planets, as far as the landscape is concerned. I was missing all the greenery in our backyard at home, but I was also appreciating how blue the sky is here. It really contrasts with the red earth, doesn’t it?” she asked, taking a sip of coffee.","heading":""},{"n":4,"text":"Chiara nodded. “I see what you mean,” she said. “It doesn’t look like we could grow much here, does it?” she said gesturing to the few dusty looking plants in the yard.","heading":""},{"n":5,"text":"“I have an idea,” said Mrs. Giardini suddenly. “Have you had your breakfast yet?” she asked. Chiara shook her head. “Grab a muffin and some fruit, and come with me.”","heading":""},{"n":6,"text":"Half an hour later, Chiara and her mom pulled into a nursery on the outskirts of town. As they entered the greenhouse, both Chiara and her mother took a deep breath, inhaling the familiar green, damp scent of growing plants. “Can I help you?” asked a man wearing a tag with the nursery’s logo and the name Joseph printed on it.","heading":""},{"n":7,"text":"Mrs. Giardini smiled. “We’ve just moved here from Massachusetts,” she began. “We need some help starting a desert garden.”","heading":""},{"n":8,"text":"“Welcome to Arizona!” said Joseph. “The weather and the landscape here might take a little getting used to, but once you fall in love with it, you won’t want to live anywhere else.","heading":""},{"n":9,"text":"“My first recommendation is that you primarily plant native plants. They thrive in this climate for a reason, and you won’t have to spend all your time watering plants that were meant to live somewhere else.”","heading":""},{"n":10,"text":"“That makes sense,” said Mrs. Giardini. “I’ve never grown cacti or other succulents before, but I think that it could be fun to experiment with them.”","heading":""},{"n":11,"text":"Joseph nodded in agreement. “You can create some beautiful cacti gardens, but you aren’t limited to planting only succulents in the desert.” He pointed to several nearby pots. “I’ll show you a few of my favorites. The desert willow has beautiful blooms that some people think resemble orchids. Indian paintbrush can provide bright bursts of color in your garden.”","heading":""},{"n":12,"text":"Chiara and her mom grinned at each other. “I don’t think we had any idea what a lush, colorful garden we could have in the desert!” exclaimed Mrs. Giardini. “I’m not even going to worry about our stacks of boxes until we get a good start on the garden.”","heading":""},{"n":13,"text":"“I can’t wait to begin,” said Chiara, already loading plants into the cart.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13}],"kind":""},{"id":"P128","page":"P128","title":"A Dry, Hot Land","exercisePage":"P129","pdfPage":132,"pdfExercisePage":133,"lead":"Where is the world’s largest desert?","paragraphs":[{"n":1,"text":"Unless you live in the western part of the United States, you may consider deserts to be exotic, rare places. Actually, deserts are very common, covering nearly one-third of Earth’s land surface. Although lack of precipitation is the most obvious characteristic of desert regions—they receive less than ten inches per year—deserts also have high rates of evaporation. What little precipitation does fall is quickly absorbed back into the atmosphere.","heading":""},{"n":2,"text":"Because of this lack of moisture, deserts can be very hot during the day. Water has a natural cooling effect, but without it, the sun cooks the land. In some deserts, temperatures are regularly as high as 130 degrees Fahrenheit. However, after the sun goes down, all that heat escapes from the desert ground and the temperatures drop quickly, sometimes all the way to freezing!","heading":""},{"n":3,"text":"Some deserts are not hot, even during the day. Areas with low precipitation and high evaporation rates located in the extreme Northern Hemisphere are called tundras, a type of frozen desert. Because of the tundra’s extremely low temperature, any moisture that is present remains frozen.","heading":""},{"n":4,"text":"Sandy deserts are the most familiar, probably because they are filmed and photographed so often for their natural beauty. Looking like giant, frozen ocean waves, sand dunes reach up to meet the brilliant blue sky. In fact, the dunes are not frozen at all. They are constantly moving and act more like the ocean than you might think.","heading":""},{"n":5,"text":"Winds in the desert are very powerful because there is so little in the landscape to slow them down. The sand gets pushed around, just like water in the sea, and shifted and shaped into constantly changing wave-like forms. However, only about 20 percent of Earth’s deserts are made of sand. Most deserts consist of larger rocks like pebbles and stones.","heading":""},{"n":6,"text":"The largest desert on Earth is the Sahara in northern Africa. Covering more than three-and-a-half million square miles, the whole United States could fit within this arid region. The Sahara is one of the driest places on Earth. It receives almost no rainfall during the year and has basically no surface water. However, there is water flowing underground that occasionally reaches the desert surface. An area of moisture and plant life within a dry desert is called an oasis. Although there are some natural oases, most of them are artificially created by irrigation or wells.","heading":""},{"n":7,"text":"The Gobi is a major desert found in Asia. It sits on a plateau that stretches between two higher mountains. Even though part of the Gobi is as harsh as any desert, most of it is covered in a thin layer of bushes and grass that allows people to live there. The famous Venetian (vē′nē′shən) traveler Marco Polo made his way across the Gobi in 1275, becoming the first explorer to describe this arid region to Europeans.","heading":""},{"n":8,"text":"The largest desert in the United States is the Mojave Desert, which covers parts of California, Utah, Nevada, and Arizona. An area of the Mojave, called Death Valley, is the lowest and hottest point in North America. Despite its reputation for hot temperatures, the Mojave does get quite cold during the winter, regularly dropping to 20 to 30 degrees Fahrenheit, and it sometimes even snows there.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P130","page":"P130","title":"Calling Nowhere","exercisePage":"P131","pdfPage":134,"pdfExercisePage":135,"lead":"Why would there be a phone booth in the middle of the desert?","paragraphs":[{"n":1,"text":"At some point following World War II, a phone booth was installed in the Mojave Desert, 12 miles from the nearest interstate. It seems like an odd location for a phone booth, but there are two mines in the area, and the phone was originally installed for use by the miners and their families.","heading":""},{"n":2,"text":"Godfrey Daniels, a computer programmer from Arizona, heard about the phone from a friend. He had the number and decided to call it one day, just to see if anyone might answer. He didn't really expect a response, and sure enough, there was no answer when he called.","heading":""},{"n":3,"text":"After dialing the number periodically, he was shocked to hear a busy signal one day. He assumed that there was a problem with the line, but he kept calling anyway. After several tries, someone actually answered the phone. Daniels spoke with a woman who worked at one of the mines. She lived in a remote area without phone service and used the phone for making calls.","heading":""},{"n":4,"text":"Daniels loved the idea of a phone in the middle of nowhere. He was even more fascinated with the idea that someone might actually be available to answer the phone in such a remote place. He posted the phone's number on the Internet, and people began calling it. Just as Daniels was intrigued by the idea of the phone booth in the middle of the desert, so were the callers who had visited his website.","heading":""},{"n":5,"text":"Daniels eventually traveled to Southern California to visit the booth himself. Evidently, he wasn't the only person to have that idea. As more people heard about the Mojave Desert phone booth, tourists decided to visit the secluded location. People who called the phone began to frequently hear a busy signal. When someone answered the phone, he or she had the opportunity to speak with callers from all around the United States, as well as Germany, England, Italy, France, Australia, and South Africa.","heading":""},{"n":6,"text":"What did strangers find to talk about during these unusual calls? They usually identified themselves and discussed where they were calling from and how they had heard about the phone booth. One thing people love about the Internet is how it seems to make the world feel smaller. Maybe in some small way, the Mojave Desert phone booth accomplished the same thing.","heading":""},{"n":7,"text":"In May of 2000, the National Park Service and Pacific-Bell, the owner of the phone booth, made the decision to remove the booth. The National Park Service felt that the area was receiving too much traffic as a result of all the publicity surrounding the booth. They were worried that it might somehow damage the environment, and they felt that it was their responsibility to protect the land of the Mojave Desert National Preserve.","heading":""},{"n":8,"text":"Today, the place where the booth once stood is marked by a simple tombstone. People who don't know that it was removed still call the number. There is no disconnect message on the line. The number just rings and rings, as the caller waits patiently for someone to answer.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P132","page":"P132","title":"A Paper Surprise","exercisePage":"P133","pdfPage":136,"pdfExercisePage":137,"lead":"Keep reading to learn more about Aunt Suki’s interesting hobby.","paragraphs":[{"n":1,"text":"Emi and Ken were sitting on the floor of the guest bedroom talking to their aunt. Their parents had gone out for the evening, and they were trying to decide if they should rent a movie, play a game, or make Aunt Suki’s special chocolate-chunk oatmeal cookies.","heading":""},{"n":2,"text":"“What are those, Aunt Suki?” asked Emi, pointing to two brightly-colored paper animals sitting on top of the dresser.","heading":""},{"n":3,"text":"“Last
