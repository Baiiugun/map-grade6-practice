verglades suitable for development. They also planned to use the trees for timber. The wood turned out to be difficult to harvest, so the trees just continued to grow, crowding out other species that are indigenous to the Everglades.","heading":""},{"n":7,"text":"The Everglades National Park was founded in 1947 in an attempt to preserve the land and the plant and animal life. The area was not large enough to make a significant impact, so in 1989, the government expanded the park. In 1996, an act was passed allowing the government to purchase farmland, which could then be returned to natural swampy marshland.","heading":""},{"n":8,"text":"These efforts are important because there are so many species to protect within the Everglades. It is the only place in the world where crocodiles and alligators coexist. It is also the home of the endangered Florida panther, as well as many other endangered species. Black bears, otters, pelicans, turtles, bats, deer, and manatees all make their home in the Everglades. Without a doubt, the Everglades are worth saving and preserving. Where else in the world can you find such lush diversity?","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P046","page":"P046","title":"It’s a Bird’s Life","exercisePage":"P047","pdfPage":50,"pdfExercisePage":51,"lead":"What kinds of birds can you identify in your own neighborhood?","paragraphs":[{"n":1,"text":"Have you ever heard of the National Audubon Society? It is probably the most well-known environmental organization for the protection and conservation of birds and their habitats. It was founded in honor of John James Audubon, who was a naturalist, ornithologist, and painter.","heading":""},{"n":2,"text":"Audubon was born in the Caribbean country of Haiti in 1785. When he was 18 years old, he was sent to live in the United States at a family farm near Philadelphia, Pennsylvania. He showed a great deal of interest in natural history and conducted the first bird-banding experiment in the country. He captured eastern phoebes and tied small pieces of yarn to their legs. By marking the birds in this way, Audubon was able to conclude that the birds nested in the same places every year.","heading":""},{"n":3,"text":"Over the years, Audubon spent more and more time creating realistic drawings and paintings of birds. He began to catalog the birds he drew, venturing farther and farther to locate new species. Although today’s conservation groups would not approve of his methods, Audubon used the only technique he knew to create his paintings. He shot and stuffed birds to use as models for his artwork. He posed the birds in their natural habitats so that he would have the appropriate settings for his paintings.","heading":""},{"n":4,"text":"Some of Audubon’s explorations led him on bird-watching excursions down the Mississippi River. He became a talented outdoorsman as he followed his subjects through the South. By the late 1820s, Audubon began looking for a publisher for his catalog of American birds, but American publishers were not interested. Instead, Audubon found an audience in England and Scotland where people were fascinated by the concept of the American wilderness.","heading":""},{"n":5,"text":"There, Birds of America was finally printed with great success. It contained 435 hand-colored plates that showed 1,065 life-sized birds. Nothing so detailed had ever been created to document the variety of birds in America. Today, a complete set of the original prints is very valuable. There are thought to be fewer than 200 copies in existence in the world!","heading":""},{"n":6,"text":"The Audubon Society was founded in 1886, several decades after John James Audubon’s death. It honored a man whose lifework had been to study birds and to begin to educate the public about the importance of protecting them and their environment. The National Audubon Society still exists and continues to grow today. If you are interested in learning more about it or how you can become a junior member, visit www.audubon.org.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""},{"id":"P048","page":"P048","title":"A Bird Excursion","exercisePage":"P049","pdfPage":52,"pdfExercisePage":53,"lead":"What birds can you identify by sight?","paragraphs":[{"n":1,"text":"“Are you ready to go, girls?” asked Mr. Vasquez. He stood near the front door wearing a backpack.","heading":""},{"n":2,"text":"“Ready, Dad,” said Olivia. “Should I grab some bug spray?”","heading":""},{"n":3,"text":"“Good thinking,” said Mr. Vasquez. “We don’t want to be eaten alive out there.” Olivia grabbed the bug spray from the closet. Then, Jaya, Olivia, and Olivia’s dad set out on their first joint bird watching expedition.","heading":""},{"n":4,"text":"“How long have you been birding, Mr. Vasquez?” asked Jaya.","heading":""},{"n":5,"text":"“I’ve only been doing it for about a year, Jaya,” replied Mr. Vasquez. “Olivia’s mom gave me a backyard birdfeeder for my birthday a couple of years ago. I found out that I really enjoyed watching the birds and identifying them with the field guide I bought.”","heading":""},{"n":6,"text":"Jaya, Olivia, and Mr. Vasquez crossed the street to the park’s entrance. They picked up a map of the trails. “We should look for a trail that isn’t too wooded,” said Mr. Vasquez. “If we can find a trail that has an open area, like a field or meadow, and some water, we’ll probably have the best chance of making a number of sightings.”","heading":""},{"n":7,"text":"After careful deliberation, the group agreed on a trail and set off. As the sun rose higher in the sky, they grew warm and took off the long-sleeved shirts they wore over their T-shirts. Within the first half-hour, they were able to identify a blue jay, cardinal, chickadee, house sparrow, northern flicker, house finch, northern oriole, and red-winged blackbird.","heading":""},{"n":8,"text":"“This is great!” exclaimed Jaya. “Do you usually spot so many birds this quickly?”","heading":""},{"n":9,"text":"Mr. Vasquez grinned. “It seems like we’re having an especially good day today.”","heading":""},{"n":10,"text":"“We haven’t really seen any birds yet that are difficult to identify,” said Olivia thoughtfully. “They can move so quickly, how can you identify them if you need to check the field guide?” she asked.","heading":""},{"n":11,"text":"“Well,” began Mr. Vasquez, “the bird’s size is usually a good place to start. Is it bigger or smaller than a sparrow? What about a robin? Color is not always a reliable identifier because it can change in different types of light. Also, male and female birds frequently have different coloring, which can change by season.”","heading":""},{"n":12,"text":"“What about a bird’s shape?” asked Jaya. “It seems like that would remain constant.”","heading":""},{"n":13,"text":"“You’re right, Jaya,” said Mr. Vasquez. “The shape of a bird’s body, its tail, its wings, and its bill can all be excellent clues. Bird calls can also be helpful. Field guides often describe what a typical bird call sounds like. You can even go online and listen to a sample of most common calls.”","heading":""},{"n":14,"text":"“That’s where your birding notebook can come in handy, Olivia,” continued Mr. Vasquez. “If the bird flies away before you can identify it, your notes can help you do more research later.”","heading":""},{"n":15,"text":"“Look!” said Olivia, pointing to a pond that was visible in the distance. Several Canada geese took flight, their powerful wings lifting them quickly into the clear blue sky. Jaya, Olivia, and Mr. Vasquez stood quietly watching the geese soar overhead in a perfect V formation. They knew they wouldn’t forget the image of the geese in the clear sky anytime soon.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"paragraph","n":15}],"kind":""},{"id":"P050","page":"P050","title":"Bird Garden","exercisePage":"P051","pdfPage":54,"pdfExercisePage":55,"lead":"What other living creatures might be attracted to a garden?","paragraphs":[{"n":1,"text":"Olivia and Jaya sat at a table in the library with books spread out around them. They each had a notebook and a pen for recording interesting information about hummingbirds. Jaya’s mom had allotted a portion of her garden for the girls to use as a hummingbird garden that summer. They couldn’t wait to start planting, but they wanted to make sure they knew as much as possible about the tiny creatures before they began.","heading":""},{"n":2,"text":"“Have you found anything yet that says how many species of hummingbirds there are?” asked Jaya.","heading":""},{"n":3,"text":"Olivia nodded. “There are more than 300 species,” she marveled. “The smallest one is the bee hummingbird, which lives in Cuba. It’s just a little over two inches long and weighs only about a tenth of an ounce!”","heading":""},{"n":4,"text":"“I’d love to see one,” replied Jaya, “but I don’t think there is much chance of us attracting one here in Colorado. How big are the ones that we might see in this area?”","heading":""},{"n":5,"text":"“They’re actually not too much bigger,” said Olivia, turning the page in her book. “They only measure about four inches long. Their wings beat about 80 times per minute. The beating of their wings makes a humming noise, which is how they got their name. Their hearts beat more than 1,200 times per minute. Do you have any idea how that compares to the human heartbeat?” asked Olivia.","heading":""},{"n":6,"text":"“Well, we took our heart rates in gym a few weeks ago. I think mine was about 65 beats per minute,” said Jaya.","heading":""},{"n":7,"text":"“Unbelievable,” said Olivia shaking her head. “Okay, have we figured out how to attract these little hummers to our garden?”","heading":""},{"n":8,"text":"It took Jaya a moment to locate the book she was searching for. “This one seems to have the most detailed information,” she said, picking up a colorful paperback book. “It’s called Planting Your Hummingbird Garden.”","heading":""},{"n":9,"text":"“I think I saw somewhere that hummingbirds are attracted to red flowers. Is that right?” asked Olivia.","heading":""},{"n":10,"text":"Jaya nodded. “That’s why hummingbird feeders are usually red. We should be able to find a simple, inexpensive one at a garden center. We just fill it with a mixture of four parts water to one part sugar. The book says that it’s easiest to dissolve the sugar in hot or boiling water.”","heading":""},{"n":11,"text":"“I’m going to start a list of plants that hummingbirds like,” said Olivia. “We know that red flowers appeal to them, and I remember reading that they like long, tube-shaped flowers too,” she added. “I wonder if that’s because of how long and thin their beaks are.”","heading":""},{"n":12,"text":"“You’re right,” said Jaya. “Other birds can’t reach the sweet nectar in long, thin flowers. Neither can bees. That means that hummingbirds don’t have much competition for the meals they get from those flowers. That’s pretty important because they need to eat about every 10 minutes or so. They use up a lot of energy hovering over flowers, so they need to replenish it often.”","heading":""},{"n":13,"text":"“Do you think we’re ready to ask my dad to take us to the nursery?” asked Olivia, beginning to gather up the books on the table.","heading":""},{"n":14,"text":"“I think we’re as ready as we’re going to be,” replied Jaya, her eyes dancing with excitement. “We’ll just have to learn the rest from experience!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14}],"kind":""},{"id":"P052","page":"P052","title":"An Ancient Migration","exercisePage":"P053","pdfPage":56,"pdfExercisePage":57,"lead":"Why do thousands of cranes stop at Nebraska’s Platte River every spring?","paragraphs":[{"n":1,"text":"A large flock of birds rising up to fill the sky can be a breathtaking sight, but imagine a place where you might see hundreds of thousands of birds all at once. For six weeks each spring, nearly 500,000 sandhill cranes stop along the Platte River in Nebraska as they make their annual northern migration. This unique, natural occurrence has happened for thousands of years and attracts large crowds of people each year to witness its beauty.","heading":""},{"n":2,"text":"The sandhill crane has been in existence longer than any other crane. Fossil records show that they have been around for ten million years! Sandhill cranes stand nearly four feet tall and are mostly gray except for a bit of red on top of their heads. They also have a long, pointed bill and white feathers on the sides of their faces.","heading":""},{"n":3,"text":"The most distinctive features of the sandhill crane can be seen when they fly. With long legs and a long neck extending out from their bodies, cranes create a graceful sight as they glide across the sky.","heading":""},{"n":4,"text":"During the winter, sandhill cranes live in the wetter parts of Texas, New Mexico, and northern Mexico. Marshes and bogs provide the perfect habitat because the shallowness allows cranes to stand right in the middle of the water. This way they can easily forage for plants, insects, and fish. Because they eat both plants and animals, cranes are considered omnivorous. When sandhill cranes stop along the Platte River, their main food source is corn that can be found in the surrounding fields. Farmers benefit from the cranes because the birds help clean the fields for the next round of crops.","heading":""},{"n":5,"text":"With the arrival of spring, cranes begin migrating north to their summer homes in Canada, Alaska, and even Siberia. Their flight pattern takes them across the central plains of the United States. For the most part, these are arid states, but the Platte River provides a large area of shallow water that is perfect for the cranes. In addition, the Platte is located approximately at the midpoint in the cranes’ journey. Thousands and thousands of cranes land to take a break and socialize at this ideal resting place.","heading":""},{"n":6,"text":"Originally called Nebraskier, an Oto word meaning flat water, the Platte was renamed by a French explorer because platte means flat in French. Its significance is not only for the birds. As Europeans traveled westward across the country, the Platte River was an important landmark. Both the Oregon Trail and the Mormon Trail ran alongside it.","heading":""},{"n":7,"text":"If you are interested in traveling to see the cranes, Rowe Sanctuary in Gibbon, Nebraska, is one of the best places for viewing them. Run by the National Audubon Society, Rowe Sanctuary works for the conservation of the cranes and other migratory birds that stop along the Platte. They also provide blinds so visitors can watch the hundreds of thousands of sandhill cranes that land there without disturbing them.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P054","page":"P054","title":"A Trip to the Smithsonian","exercisePage":"P055","pdfPage":58,"pdfExercisePage":59,"lead":"How will Ms. DeJohn’s class decide which museums to visit during a class trip to the Smithsonian?","paragraphs":[{"n":1,"text":"Ms. DeJohn stood at the front of the room. “Okay, everyone,” she began, “as you all know, we’ll be leaving for Washington, D.C. on Monday. We are going to spend some time this morning discussing what you would like to see when we visit the Smithsonian Institution. It will be possible for us to see only a fraction of all the Smithsonian has to offer, so we need to make some decisions about our priorities.","heading":""},{"n":2,"text":"“We’ve done a little research as a class about the wide array of topics that the Smithsonian addresses in their museums. I know that during your free time many of you have also done some additional research on the Smithsonian’s website.”","heading":""},{"n":3,"text":"Ty raised his hand. “How many museums are we going to have time to see?” he asked.","heading":""},{"n":4,"text":"“That’s a good question, Ty,” replied Ms. DeJohn. “We’re going to choose four museums. I’d like to hear some of your suggestions. What interests you most at the Smithsonian?”","heading":""},{"n":5,"text":"“Can we go to the National Museum of Natural History?” asked Emma, consulting her notebook. “I’d like to see the dinosaur skeletons there.”","heading":""},{"n":6,"text":"“I want to see Anita and Arabella,” said Calvin.","heading":""},{"n":"u1","text":"SMITHSONIAN","label":"未编号材料","raw":"SMITHSONIAN"},{"n":7,"text":"“Who?” asked Emma, turning around to look at Calvin.","heading":""},{"n":8,"text":"“Anita and Arabella,” he repeated. “They’re the space spiders. A student wanted to know if spiders could spin webs in space, so NASA sent two spiders into space on Skylab II. Anita’s and Arabella’s bodies are housed at the National Air and Space Museum.”","heading":""},{"n":9,"text":"Ms. DeJohn began to list the students’ suggestions on the board.","heading":""},{"n":10,"text":"“If we go to the National Zoo,” said Deepak, “we can see the Sumatran tigers. Only a few hundred of these tigers still in exist in the wild, and they all live in Indonesia. Also the giant pandas, Mei Xiang and Tian Tian, are on loan from the China Wildlife Conservation Association. I think that getting to see them in person would be really amazing.”","heading":""},{"n":11,"text":"“I’d like to go to the Museum of African Art,” said Imani. “My parents emigrated from Kenya when they were children, but I’ve never been there to visit. My family collects African art, so I’d like to learn more about it.”","heading":""},{"n":12,"text":"“I think we should go to the National Museum of American History,” said Chris. “They have all kinds of cool computer artifacts. They have examples of really early computers and computer games. You can even see the computer that defeated chess champion Garry Kasparov!”","heading":""},{"n":13,"text":"“I like the idea of the American History Museum, too,” agreed Emma. “They have these interactive carts around the museum, where you can actually try things out yourself.”","heading":""},{"n":14,"text":"Ms. DeJohn smiled at the class. “I must say that I am extremely impressed by how knowledgeable you all are. You’ve done your research. Now, all we have to do is take a vote, and we’ll be on our way to the Smithsonian!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"note","n":"u1"},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14}],"kind":""},{"id":"P056","page":"P056","title":"The Mega-Museum","exercisePage":"P057","pdfPage":60,"pdfExercisePage":61,"lead":"What are some different types of museums you have visited?","paragraphs":[{"n":1,"text":"The Smithsonian Institution in Washington, D.C., covers so many subjects and contains so many objects that you would have to call it a super-museum. In fact, its collection of artifacts and memorabilia is so vast—more than 143 million items—the Smithsonian needs 17 separate museums to hold everything! Even more incredible is that the museums are free to the public because the institute is funded and managed by the Unites States government. Even though the Smithsonian is an American institution, it was because of an Englishman’s generosity that it exists today.","heading":""},{"n":2,"text":"In 1829, wealthy British scientist James Smithson died and passed his enormous fortune on to his nephew Henry Hungerford. However, Smithson stated in his will that if Henry died without having any children, all the money would be donated to the U.S. government. He wanted the government to establish an institution “for the increase and diffusion of knowledge.”","heading":""},{"n":3,"text":"As it turned out, Hungerford did not have any heirs, so the money—$500,000 in 1835, which would be equal to nearly $9,000,000 today—came overseas to America. Congress debated for many years about how exactly the money should be used, but in 1846, President James Polk signed a bill into law that founded the institution.","heading":""},{"n":4,"text":"Today, almost 24 million people visit the Smithsonian museums each year, including the National Museum of Natural History, the National Portrait Gallery, the National Museum of American Indians, and the Anacostia Museum for African American History and Culture. The Smithsonian also runs the National Zoological Park. Among the zoo’s 3,600 animals are two giant pandas, an endangered species that is rarely exhibited anywhere outside of China.","heading":""},{"n":5,"text":"Another part of the Smithsonian Institution is the National Museum of American History, which covers all aspects of our history and culture. The museum displays fun artifacts, including sports memorabilia like Michael Jordan’s basketball jersey, Muhammad Ali’s boxing robe, and the goggles Gertrude Ederle wore when she swam across the English Channel.","heading":""},{"n":6,"text":"There are also serious exhibits, like “The Price of Freedom,” which shows objects from the wars in which the United States was involved. Among the many important artifacts you can see at this museum is the original Star Spangled Banner. This unique flag is the one that flew above Fort McHenry and inspired Francis Scott Key to write our national anthem.","heading":""},{"n":7,"text":"One of the most popular Smithsonian sites is the National Air and Space Museum. This is where you can see the Spirit of St. Louis, the plane Charles Lindbergh flew across the Atlantic Ocean. The museum also houses the Wright brothers’ airplane from 1903, as well as the Columbia space module, which landed on the moon carrying Neil Armstrong and Buzz Aldrin. You can even see a rock that was brought back from the moon!","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P058","page":"P058","title":"Always Have Hope","exercisePage":"P059","pdfPage":62,"pdfExercisePage":63,"lead":"What are some precious stones besides diamonds?","paragraphs":[{"n":1,"text":"What do you think is the most valuable piece of jewelry in the world? It depends on what standards the jewelry is judged by, but if you guessed the Hope diamond, there is a good chance you would be right.","heading":""},{"n":2,"text":"The Hope diamond is an unusual blue-gray gem that is believed to have been mined in Golconda, India. The French jeweler Jean-Baptiste Tavernier bought a 112-carat stone, which he brought home to France. (A carat is a unit of weight for measuring the size of precious stones. It is equivalent to 200 milligrams.) Historians believe that King Louis XIV purchased the diamond in 1668 as part of the French crown jewels. The diamond was eventually recut, and a large portion of it, called the French Blue, disappeared in a robbery in 1792.","heading":""},{"n":3,"text":"No one knows for certain the path of the diamond after its theft. However, a similar but smaller diamond was recorded as being part of the collection of a man named Henry Philip Hope. No record exists to verify where Hope got the diamond or how much he paid for it.","heading":""},{"n":4,"text":"Relatives inherited the diamond after Hope's death. It was passed along through several generations when Lord Francis Hope decided to sell the diamond to pay off his debts. Subsequent owners also were driven to sell the diamond at times when they were in need of the money it would bring.","heading":""},{"n":5,"text":"In 1912, the Hope diamond finally found a semi-permanent home with a woman by the name of Evalyn Walsh McLean. She had the stone reset among 16 pear-shaped white diamonds. Then, it was placed on a necklace that was strung with 45 smaller diamonds.","heading":""},{"n":6,"text":"In 1949, after Mrs. McLean's death, the Hope diamond was sold to a well-known jeweler and diamond dealer named Harry Winston, in order to settle Mrs. McLean's debts. Winston exhibited the famous diamond at many events, but he never sold it. Instead, he decided to donate it to the Smithsonian Institution in 1958. How did Winston transport the fine piece of jewelry? By armored truck? Via special delivery, with the assistance of many security officers? No, Winston just chose to send it through the United States Postal Service!","heading":""},{"n":7,"text":"Ever since then, the Hope diamond has been part of the Smithsonian Institution's National Museum of Natural History. Because of its size, 45.52 carats, and its unusual blue coloring, it is breathtaking to see in person. It also contains a phosphorescence that is uncommon in gemstones. When the Hope diamond is exposed to ultraviolet light, it will glow red for a few seconds.","heading":""},{"n":8,"text":"It is no surprise that the Hope Diamond is the most popular exhibit in the museum. It has been seen by millions of visitors who are intrigued by the stone's mysterious history and the legends that the owners will be the victim of great misfortune. Everyone seems to want to catch a glimpse of this mysterious, sparkling beauty.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P060","page":"P060","title":"Flying into History","exercisePage":"P061","pdfPage":64,"pdfExercisePage":65,"lead":"Have you ever flown in a plane?","paragraphs":[{"n":1,"text":"When you turn on the television or read a magazine, celebrities are everywhere. Although fame and the media play such major roles in our lives today, it has not always been that way. Eighty years ago, radio and movies were just beginning to have that kind of effect on Americans. Many historians agree that Charles Lindbergh was one of the first major celebrities, or superstars.","heading":""},{"n":2,"text":"Lindbergh was born in Detroit, Michigan, in 1902, but he grew up in Little Falls, Minnesota. As a child, he was very interested in how things worked, so when he reached college, he pursued a degree in engineering. At the age of 20, however, the allure of flying captured Lindbergh's imagination. He quit school and moved to Nebraska where he learned to be a pilot. Soon after, Lindbergh bought his own plane and traveled the nation performing aerial stunts.","heading":""},{"n":3,"text":"In 1924, Lindbergh became more serious about flying. He joined the United States military and graduated first in his pilot class. Lindbergh used this additional training to get a job as an airmail pilot, flying out of St. Louis, Missouri.","heading":""},{"n":4,"text":"During the same time, a wealthy hotel owner named Raymond Orteig was offering a generous award to the first pilot who could fly nonstop from New York City to Paris, France. The Orteig Prize was worth $25,000—a large amount even by today's standards.","heading":""},{"n":5,"text":"Lindbergh knew he had the skills to complete the flight, but not just any plane was capable of flying that far for that long. Working with an aviation company from San Diego, California, and with financial help from the city of St. Louis, Lindbergh got a customized airplane that could make the journey.","heading":""},{"n":6,"text":"On May 20, 1927, Charles Lindbergh took off from Roosevelt Field in New York City and arrived the next day at an airfield outside Paris. Named in honor of his sponsor, The Spirit of St. Louis carried Lindbergh across the Atlantic Ocean and into the record books. He became a national hero and a huge celebrity.","heading":""},{"n":7,"text":"When he returned to the United States, Lindbergh rode in a ticker-tape parade held to celebrate his accomplishment. He also received a Medal of Honor, the highest United States military decoration. A very popular dance was even named for Charles Lindbergh—the Lindy Hop. Today, The Spirit of St. Louis is kept at the Smithsonian Institute's National Air and Space Museum in Washington, D.C.","heading":""},{"n":"u1","text":"Spirit of St. Louis","label":"未编号材料","raw":"*Spirit of St. Louis*"}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"note","n":"u1"}],"kind":""},{"id":"P062","page":"P062","title":"A Move to Safety","exercisePage":"P063","pdfPage":66,"pdfExercisePage":67,"lead":"Will the Mahaulu have to move to stay out of the path of the Kilauea Volcano?","paragraphs":[{"n":1,"text":"The Mahaulus sat at the kitchen table. The curtains fluttered in the gentle, fragrant breeze. The sun was shining and filled the kitchen with a warm, buttery light. It was a perfect day for having a picnic or going surfing. But in the Mahaulus’ kitchen, no one seemed to be paying attention to the weather.","heading":""},{"n":2,"text":"Leilani and Kala dejectedly picked at a bowl of pretzels. “Okay, girls,” said Mrs. Mahaulu. “I can tell by the expressions on your faces that you have a pretty good idea of why we needed to have this family meeting.” Leilani and Kala exchanged looks and slowly nodded.","heading":""},{"n":3,"text":"“Your mom and I have been having many conversations lately about the possibility of moving,” said Mr. Mahaulu. “We were hoping that it wouldn’t come to this, but we don’t see any alternative.”","heading":""},{"n":4,"text":"“But Dad,” protested Kala, “Kilauea has been an active volcano since 1983! Nothing has happened to us or to our house yet. I know we’ll be safe here.”","heading":""},{"n":5,"text":"“You’re right in saying that Kilauea has been active for a long time, Kala,” said Mrs. Mahaulu. “But your dad and I are concerned about all the recent evacuations. Even though we’ve been safe up to this point, there is no way to guarantee that a larger eruption isn’t imminent.”","heading":""},{"n":6,"text":"“Mom, you’ve said yourself that the government’s warning systems are efficient and effective. Doesn’t that count for anything?” asked Leilani. “This is our home. I can’t even remember living anywhere else!” she added, fighting back tears.","heading":""},{"n":7,"text":"Leilani’s mom put an arm around her daughter’s shoulder. “This isn’t going to be easy on any of us,” she said. “Dad and I love this house, too. We have so many happy memories here. But we’re tired of living with such uncertainty. The most important thing in the world to us is that our family stays safe.”","heading":""},{"n":8,"text":"Mr. Mahaulu nodded. “Volcanoes are a fact of life in Hawaii,” he said. “I’m willing to accept that. I’ve never wanted to live anywhere else. But there are places in Hawaii where we’ll feel safer. We’ll have to give up our house, but you know as well as I do that home is wherever we go as a family. We’ll make new memories, and we’ll find things to love about our new home.”","heading":""},{"n":9,"text":"The girls were quiet for a moment as they considered what it would mean to move. “There are so many things I’ll miss here,” said Kala quietly.","heading":""},{"n":10,"text":"“We all will,” said Mrs. Mahaulu. “But one of the places that your dad and I have looked at has much more room for a garden than we have here. Another place is only a few minutes walk to the beach.”","heading":""},{"n":11,"text":"Kala and Leilani couldn’t help smiling when they heard that. They both spent every spare minute they had surfing. If their parents told them that they could actually live in the water, they would have been perfectly happy.","heading":""},{"n":12,"text":"Mr. Mahaulu walked around to the other side of the table. He put one large hand on each of his daughter’s shoulders. “I’m proud of you two,” he said. “Thank you for trying to understand why this is so important to your mom and me.”","heading":""},{"n":13,"text":"Leilani and Kala smiled and leaned back against their dad. He was right; home was wherever the family was.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13}],"kind":""},{"id":"P064","page":"P064","title":"Home, Sweet Home","exercisePage":"P065","pdfPage":68,"pdfExercisePage":69,"lead":"What is the strangest place you can think of to live?","paragraphs":[{"n":1,"text":"Most people feel a strong attachment to their homes. It is not uncommon for people to do everything they can to protect their belongings and the place they call home from danger. But how far would you be willing to go? Would you choose to live in a place that was in a constant state of danger?","heading":""},{"n":2,"text":"For years, it wasn’t a hard question for Jack Thompson to answer. He lived in one of the most dangerous places on Earth, but it was just home to him. Thompson lived in Hawaii near Kilauea, one of the most active volcanoes in the world. He owned a home in a subdivision called Royal Gardens. It was different than subdivisions that might be familiar to you. Thompson was the only resident. Everyone else evacuated when Kilauea began erupting in 1983.","heading":""},{"n":3,"text":"Thompson became accustomed to living in close quarters with the volcano. The flow of the 2,000-degree lava that eventually consumed many of the homes in Thompson’s neighborhood no longer astonished him. He still had a healthy respect for the power of Kilauea, but he did not live every day in fear. After all, it was Thompson’s choice to stay in his home, even though the environment he was used to changed so drastically.","heading":""},{"n":4,"text":"Thompson’s home was completely encompassed by the products of lava flow. Portions of it cooled enough to allow Thompson a way out, either on foot or by motorcycle. However, his path was unreliable. Bubbling lava lay just below the surface of rock that Thompson crossed. Sometimes, it was hot enough to melt the rubber on his shoes. At any time, a sudden crack could open up, revealing the red-hot dangerous liquid. Thompson knew that he needed to keep moving because it was unsafe to linger for long on the quickly changing surface.","heading":""},{"n":5,"text":"It took an hour for Thompson to travel three miles over the unsteady rock. When he left his home to get supplies, he had to be sure to purchase all the essentials because he never knew when he might be trapped for a period of time by a fresh lava flow. Thompson did not have a telephone line or electricity, so he learned how to function using solar power, gas appliances, and rainwater that he collected and stored.","heading":""},{"n":6,"text":"There is no doubt that the life Thompson lead isn’t for everyone. But he loved the natural beauty of his home, and he even liked the isolation that comes with living in such an inaccessible location. Unfortunately, in 2012, the inevitable happened. There had been many close calls over the years. Thompson was used to that. But in 2012, the lava got too close, and Thompson had to evacuate. The lava took over the last remaining house in Royal Gardens. It was time for Jack Thompson to find a new home in Hawaii’s tropical paradise.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""},{"id":"P066","page":"P066","title":"Moving Mountains","exercisePage":"P067","pdfPage":70,"pdfExercisePage":71,"lead":"Where are most of the world’s volcanoes located?","paragraphs":[{"n":1,"text":"Have you ever heard of the Ring of Fire? It might sound like something straight out of science fiction, but it is a real place. The Ring of Fire is the name used by scientists to describe an area where frequent volcanic eruptions and earthquakes take place. In fact, about 75 percent of the world’s 1,900 active and dormant, or inactive, volcanoes are located there.","heading":""},{"n":2,"text":"In some parts of the world, giant pieces of Earth’s crust, called plates, are constantly in motion. They collide and slowly slide over, under, and past one another. The Ring of Fire is located at the juncture of the Pacific plate with several other plates. The Ring of Fire is an arc-shaped region that runs along the coast of North and South America, along the eastern edge of Asia, across Alaska’s Aleutian Islands, and along the coast of New Zealand in the South Pacific.","heading":""},{"n":3,"text":"Sometimes, plates move past one another without creating much of a disturbance. Other times, when two plates collide, an earthquake occurs. This is exactly what happens at the well-known San Andreas Fault in California, and it is why earthquakes are so common in that part of the country.","heading":""},{"n":4,"text":"Even though the plates move relatively slowly, at about the same rate that human fingernails grow, the friction they create as they slide into one another produces a great deal of energy. The heat from inside Earth is strong enough to melt rock and turn it into magma, or molten rock. Eventually, the magma rises because it is lighter, or less dense, than the rocky material that surrounds it. When it reaches the surface, it becomes known as lava and forms volcanoes.","heading":""},{"n":5,"text":"The presence of dissolved gases in the magma determines whether or not the eruption will be explosive. Picture a bottle of soda that has been shaken. When the bottle is opened, the gases cause the liquid to explode from the bottle with force. In the same way, volcanoes that have a high concentration of gases will also explode with greater force.","heading":""},{"n":6,"text":"Although most people view volcanoes as enormous and potentially dangerous mountains, scientists see them as temporary structures on Earth’s surface. They may not change much over the course of a lifetime, or even several lifetimes. Still, scientists know that over time volcanoes will move and shift, rise and fall with the movement of Earth’s plates.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""},{"id":"P068","page":"P068","title":"Watery Giants","exercisePage":"P069","pdfPage":72,"pdfExercisePage":73,"lead":"What are the oceans’ most destructive waves, and what causes them?","paragraphs":[{"n":1,"text":"If you have ever gone swimming in an ocean or in one of the Great Lakes, you may have some idea how powerful waves can be. Waves that are only a few feet tall hold enough energy to knock you off your feet. Now, try to imagine the power of a wave that is 50 feet tall and more than 100 miles wide, traveling at speeds of as much as 500 miles per hour. It’s easy to see how such a wave could devastate an entire town.","heading":""},{"n":2,"text":"The name for these enormous waves is tsunami, which means harbor wave in Japanese. Tsunamis are caused by a disturbance in the ocean, such as an earthquake or undersea volcanic eruption. Although underwater disturbances are the most common cause of tsunamis, they can also occur if a large meteorite crashes into the ocean.","heading":""},{"n":3,"text":"Tsunamis may be relatively small when they are far out at sea. However, as they draw closer and closer to shore, they gather power. One sign of an approaching tsunami is water that recedes at the shore. This occurs because so much of the ocean water is sucked into the wave as it gathers strength.","heading":""},{"n":4,"text":"Tsunamis do not consist of a single wave. One wave follows another in a series that may last several hours. A period is the length of time in between waves. For average wind-powered waves, a period may be about ten seconds long. Because a tsunami is so much larger, its period may be as long as an hour.","heading":""},{"n":5,"text":"Tsunamis have destroyed homes, schools, and entire coastal towns in minutes. The force of a wave as it breaks can be strong enough to travel several hundred feet inland. That is exactly what happened to Hilo, a town on the island of Hawaii, in 1946. At that time, there was not yet an accurate warning system in place.","heading":""},{"n":6,"text":"An earthquake registering 7.1 on the Richter scale occurred in Alaska’s Aleutian Islands on April 1. About four hours later, Hawaii was struck with the first of seven waves. The waves measured between 24 and 32 feet in height and arrived at 15 to 20 minute intervals. By the time the tsunami had run its course, 159 lives had been taken.","heading":""},{"n":7,"text":"The devastation of the 1946 tsunami led a team of scientists and government officials to create the Pacific Tsunami Warning System. They hoped that people would never again suffer such great losses because they were unaware of a tsunami’s approach. They set up a system to monitor earthquakes that could cause tsunami. They also determined ways to predict the time of arrival of tsunamis so that people would have a chance to evacuate.","heading":""},{"n":8,"text":"Unfortunately, there was no such warning system covering the Indian Ocean on December 26, 2004. An enormous earthquake took place and triggered the deadliest tsunami in history. Countries like Thailand, India, and Indonesia were especially hard hit. The loss of life was devastating, and people all around the world reached out to help the victims.","heading":""},{"n":9,"text":"Plans are being made to create a global tsunami monitoring system. No system is perfect, but as technology advances, humans will learn better ways to protect themselves against some of the most incredible and powerful forces of nature.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9}],"kind":""},{"id":"P070","page":"P070","title":"Creatures of the Night","exercisePage":"P071","pdfPage":74,"pdfExercisePage":75,"lead":"Do you have bats in your neighborhood? If you do, at what times of day have you seen them?","paragraphs":[{"n":1,"text":"Charley and Mattie Rosen helped their parents clean up after dinner. Charley rinsed the dishes in a tub of clean water and then handed them to his mom to be dried. Mattie gathered firewood so that they could make s’mores and tell scary stories. Mattie loved the smell of wood smoke and the taste of gooey marshmallows melting the chocolate between crisp graham crackers.","heading":""},{"n":2,"text":"“How much more wood do we need, Dad?” asked Mattie, setting a small stack beside her father.","heading":""},{"n":3,"text":"“I think that should last us for a while, Mattie,” replied Mr. Rosen. Mattie brushed her hands on her jeans and crouched beside her dad to watch as the fire grew larger and hotter.","heading":""},{"n":4,"text":"“Look at those birds!” exclaimed Charley, pointing a soapy finger at the sky. His parents and Mattie followed his finger and saw what appeared to be a flock of birds swooping out of a tree into the deep blue sky of twilight.","heading":""},{"n":5,"text":"“I don’t think those are birds, Charley,” said Mrs. Rosen, drying her hands on a dishtowel. “I’m pretty sure they’re bats. You can tell by the way they fly. See how jerky their movements are? Birds seem to fly more gracefully than bats do.”","heading":""},{"n":6,"text":"“Shouldn’t we get into the tent?” asked Charley nervously. “Vampire bats can suck your blood, can’t they?”","heading":""},{"n":7,"text":"Mr. Rosen chuckled. “I don’t think we have to worry too much about that. There are only a few species of vampire bats in the world, and none of them live in North America. Besides, even vampire bats don’t feed on human blood.”","heading":""},{"n":8,"text":"“What about rabies?” asked Mattie, leaning in closer to her dad.","heading":""},{"n":9,"text":"“Bats can carry rabies, but it’s quite unusual,” said Mrs. Rosen. “We’re not going to have close contact with the bats, so it’s not anything we need to worry about.”","heading":""},{"n":10,"text":"“Didn’t I ever tell you kids about my trip to Bracken Cave when I was in college?” Mrs. Rosen asked. Mattie and Charley shook their heads, but they kept an eye on the sky.","heading":""},{"n":11,"text":"“Well,” said Mrs. Rosen, “I was visiting a classmate from school who lived in San Antonio, Texas. She had told me all about a place called Bracken Cave. About 20 million Mexican free-tailed bats go there every year to give birth and raise their young.”","heading":""},{"n":12,"text":"“Twenty million bats?” said Mattie and Charley incredulously.","heading":""},{"n":13,"text":"Mrs. Rosen nodded. “Watching them come out of the cave at night was one of the most remarkable things I have ever seen. The entire sky seemed to fill with them. Conservationists say that the bats from Bracken Cave eat about 200 tons of insects each summer evening.”","heading":""},{"n":14,"text":"The Rosens sat quietly, looking up at the sky as it darkened. The fire gave off a gentle glow as they patiently waited, hoping to catch another glimpse of the bats as they set out on their evening’s activities.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14}],"kind":""},{"id":"P072","page":"P072","title":"Going Batty","exercisePage":"P073","pdfPage":76,"pdfExercisePage":77,"lead":"Keep reading to learn why many people try to attract bats to their yards and neighborhoods.","paragraphs":[{"n":1,"text":"Some animals have good reputations. Most people think of dogs as being friendly and reliable. Kittens are sweet and cuddly. Everyone loves dolphins, seals, and chimpanzees. Other animals, such as bats, do not have nearly as positive a reputation. Many people are frightened of bats and believe that the small flying creatures will become tangled in their hair or give them rabies. There are many myths and superstitions surrounding bats. All of this makes it difficult for educators to get out the word that bats are actually wonderful, useful, and amazing creatures.","heading":""},{"n":2,"text":"More than 1,100 species of bats can be found in almost every region of the world, except for the extreme polar and desert regions. Bats, the only flying mammals in the world, vary in size, coloring, and habits. The smallest bat in the world has a wingspan of only two inches and weighs less than a penny. The largest bat has a wingspan of about six feet. Most bats eat insects, but some species feed on fruit, pollen, and nectar, and others eat small animals like fish, frogs, and rodents. Although many scary stories tell of vampire bats, in reality, only three species out of more than one thousand survive on the blood of other animals.","heading":""},{"n":3,"text":"Bats are useful creatures. They consume large quantities of insects every evening. A single common brown bat can eat as many as 2,000 insects a night. Imagine how many more mosquito bites you would have each summer if bats were not busy patrolling the night sky.","heading":""},{"n":4,"text":"In addition, some bats pollinate plants and flowers. They suck the nectar from one plant and then transfer the plant’s pollen when they move on to feed from another plant. In rain forests, bats drop plant seeds as they move, which allows new plants to grow. In regions where the rain forests are in danger, bats perform a very important task, because they insure that new growth will replace plants and trees that have been cut down or destroyed.","heading":""},{"n":5,"text":"Because bats are nocturnal creatures, they have the difficult task of flying and catching all their meals in total darkness. This does not present much of a problem for them, though, because they use a special technique called echolocation. Bats emit very high-pitched sounds that bounce off objects, no matter how small they are. Bats use the reflected sounds to form pictures in their brains of where things are located. It might not sound like a simple process, but it is obviously very effective. After all, they can find a mosquito flying through the air in complete darkness.","heading":""},{"n":6,"text":"The next time you see the flutter of wings in the sky at dusk, there is no need to run for cover. Instead, think about the good deeds that bats perform for human beings and think about their incredible diversity. Maybe you’ll even decide to build a bat house in your backyard to encourage the furry flying creatures to take up residence nearby.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6}],"kind":""},{"id":"P074","page":"P074","title":"A Natural Bath","exercisePage":"P075","pdfPage":78,"pdfExercisePage":79,"lead":"What surprise will Charley and Mattie find on the trail?","paragraphs":[{"n":1,"text":"The Rosens woke up early, even though they would have slept in at home if their alarm clocks weren’t set. There was something about camping that made them feel wide-awake and excited to start the day as soon as their eyes were open.","heading":""},{"n":2,"text":"They made breakfast over the propane stove. In just a few minutes, they sat down to a meal of coffee, hot cocoa, scrambled eggs, and granola with fresh blueberries.","heading":""},{"n":3,"text":"As the Rosens ate, they discussed their plans for the day. “Dad and I looked at a map last night,” said Mrs. Rosen. “We found a nearby hiking trail that looks like it will be challenging but not too difficult. It has some beautiful scenic views, and best of all, there will be a surprise at the end of the trail.” She and Mr. Rosen exchanged secretive glances.","heading":""},{"n":4,"text":"“What kind of surprise?” asked Mattie curiously.","heading":""},{"n":5,"text":"“It wouldn’t be a surprise if we told you,” laughed her mom. “But the sooner you two get ready to go, the sooner you’ll find out.”","heading":""},{"n":6,"text":"An hour later, everyone was ready to leave. They drove a short distance to the trailhead, gathered their hiking gear, and set out for the day. It was a good day for spotting wildlife. The trees were filled with birds, and dragonflies flitted along the path ahead of the Rosens. They stopped when they heard a rustle in the bushes and quietly watched as two deer delicately crossed the trail.","heading":""},{"n":7,"text":"After they had been hiking for about an hour, the family stopped at a clearing and ate some dried apricots and almonds Mr. Rosen had packed. The snack gave them an energy boost, and just as they were about to get up, three quails wandered into sight. Charley reached for his camera and was able to snap a photo before the birds were startled and flew away.","heading":""},{"n":8,"text":"Feeling refreshed, the Rosens continued their hike. Mattie and Charley were in the midst of a heated discussion about what kind of snake they had just seen when they came to another clearing. Charley’s and Mattie’s eyes grew wide. They looked at their parents.","heading":""},{"n":9,"text":"“Is this the surprise?” asked Mattie.","heading":""},{"n":10,"text":"Mr. and Mrs. Rosen smiled as they walked over to one of the small pools. Wisps of steam rose into the air, and there was a damp, earthy smell around them. “They’re hot springs,” explained Mrs. Rosen, reaching down to untie her hiking boots. “The water is heated by geothermal heat, which means that the heat is produced from inside Earth.”","heading":""},{"n":11,"text":"“Places where there are hot springs are usually places where magma lies close to Earth’s surface,” added Mr. Rosen. “It heats the water, which creates the hot springs.”","heading":""},{"n":12,"text":"“If we had our bathing suits, could we get in the water? asked Charley.","heading":""},{"n":13,"text":"Mrs. Rosen nodded. “Your bathing suits are in my backpack,” she said, lowering her feet into the steaming water.","heading":""},{"n":14,"text":"Charley and Mattie rummaged through the backpack looking for their suits. “This is a great surprise, Mom and Dad!” exclaimed Mattie, as she headed behind a tree to change. “I never would have guessed in a million years!”","heading":""},{"n":"t1","text":"Healing Spring | 86 | Roanoke | Virginia","label":"温泉数据表第1行","sourcePage":"P075","visualId":"hot-springs"},{"n":"t2","text":"Scenic Hot Springs | 122 | Seattle | Washington","label":"温泉数据表第2行","sourcePage":"P075","visualId":"hot-springs"},{"n":"t3","text":"Baker Hot Spring | 108 | Concrete | Washington","label":"温泉数据表第3行","sourcePage":"P075","visualId":"hot-springs"},{"n":"t4","text":"Caddo Gap Springs | 95 | Little Rock | Arknasas","label":"温泉数据表第4行","sourcePage":"P075","visualId":"hot-springs"},{"n":"t5","text":"Morning Mist Springs | 205 | Ashton | Wyoming","label":"温泉数据表第5行","sourcePage":"P075","visualId":"hot-springs"}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13},{"type":"paragraph","n":14},{"type":"table","visualId":"hot-springs"}],"kind":"","visuals":[{"id":"hot-springs","type":"table","title":"Hot Springs — 原书数据表","sourcePage":"P075","headers":["Spring","Temp (°F)","Area","State"],"rows":[{"n":"t1","cells":["Healing Spring","86","Roanoke","Virginia"]},{"n":"t2","cells":["Scenic Hot Springs","122","Seattle","Washington"]},{"n":"t3","cells":["Baker Hot Spring","108","Concrete","Washington"]},{"n":"t4","cells":["Caddo Gap Springs","95","Little Rock","Arknasas"]},{"n":"t5","cells":["Morning Mist Springs","205","Ashton","Wyoming"]}],"sourceNote":"数值及地名按原书表格转录；Arknasas 为原书拼写。"}]},{"id":"P076","page":"P076","title":"A Hot Topic","exercisePage":"P077","pdfPage":80,"pdfExercisePage":81,"lead":"Have you ever visited a natural hot spring?","paragraphs":[{"n":1,"text":"People visiting Hot Springs, Arkansas, get to take part in a tradition that is thousands of years old. Many years before the arrival of Europeans, Native Americans used the clean, fresh, hot water that burbled to the surface of Earth. Stone artifacts found in the vicinity led archaeologists to conclude that the springs were a place for different Native American tribes to bathe, relax, trade, and hunt.","heading":""},{"n":2,"text":"In 1803, the United States purchased the Hot Springs area from France as part of the Louisiana Territory. Congress wanted to preserve the 47 natural springs in the area, so in 1832, they established the Hot Springs Reservation. In 1921, the reservation was renamed Hot Springs National Park.","heading":""},{"n":3,"text":"People have long believed in the healing, therapeutic effects of hot springs. Temporary bathhouses were erected over individual hot springs so that people could soak in the warm waters. They even drank the water, hoping that it would heal their ailments. During the prosperous 1920s, bathhouses were built in Arkansas to draw wealthy tourists to visit the area. The bathhouses were beautiful, ornate structures, often having marble and tile walls and floors and decorative statues and fountains.","heading":""},{"n":4,"text":"Visitors would come from near and far, hoping to benefit from the spas on Bathhouse Row. Today, it is not known whether the water can truly improve health. Any benefits it has are probably due to the high concentration of minerals and the high temperature—about 143 degrees Fahrenheit—at which the water rises to Earth’s surface.","heading":""},{"n":5,"text":"Although hot springs are commonly found in areas where magma, or molten rock, lies close to Earth’s surface, that is not the case at Hot Springs National Park. In this area of Arkansas, there are two types of porous, or absorbent, rock. The rainwater soaks into the rocks, and they slowly carry it far underground. Scientists believe that the water produced by the hot springs today is about 4,000 years old! That’s how long it takes for the rainwater to travel 2,000 to 8,000 feet into Earth and eventually rise again through underground cracks and faults.","heading":""},{"n":6,"text":"One of the most remarkable things about the water is that it is sterile. This characteristic is so unique that NASA scientists stored samples of moon rock in water from the hot springs while they looked for signs of life.","heading":""},{"n":7,"text":"If you visit Hot Springs National Park today, you can still go to one of the original bathhouses on Bathhouse Row. There, you can bathe in the warm, odorless water and imagine people doing exactly the same thing hundreds of years ago. You can even bring a jug on your trip so that you can collect water during your stay and bring it home with you. There’s no need to worry about the springs running dry—they produce an average of about 850,000 gallons of water a day.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P078","page":"P078","title":"The Little Giant","exercisePage":"P079","pdfPage":82,"pdfExercisePage":83,"lead":"Have you ever heard of the basketball player Yao Ming?","paragraphs":[{"n":1,"text":"There is no doubt that it is difficult to move to another country at any age. But imagine moving to a country where the language and customs are very different than those of your homeland. Now, imagine that you are the National Basketball Association’s first pick, and only the third player ever to make the NBA from your country.","heading":""},{"n":2,"text":"These were the expectations that Yao Ming, the Houston Rockets’ basketball star, faced when he moved to Texas from Shanghai, China, at the age of 22. The stress and pressure might have proven to be too much for many young athletes, but Yao Ming’s good nature and levelheaded attitude allowed him to quickly become one of the most popular and well-respected young basketball players today.","heading":""},{"n":3,"text":"Yao Ming was born in China on September 12, 1980. Although he is often referred to in America by his full name, technically the order is reversed. Yao is his last name, or surname, and Ming is his first name.","heading":""},{"n":4,"text":"Both of Yao’s parents played basketball professionally in China. Yao’s father is 6 feet 7 inches tall, and his mother is 6 feet 3 inches tall. That is probably why it didn’t come as much of a surprise when Yao reached his present height of 7 feet 6 inches.","heading":""},{"n":5,"text":"In spite of his height and his parents’ background in professional sports, Yao was not destined to become a basketball player. His parents had hoped for a different life for their son, and Yao had not shown much interest in basketball as a small child. However, Yao was accepted into junior sports school in China. Yao’s parents allowed him to go because they knew his chances of eventually being accepted by a good university would increase.","heading":""},{"n":6,"text":"It turned out that Yao showed so much promise as a basketball player that he began to play professionally and put college on the back burner for awhile.","heading":""},{"n":7,"text":"For years, Yao dazzled fans with his skills on the court. During his first year in the NBA, Yao scored an average of 13.5 points, 8.2 rebounds, and 1.74 blocks per game. He earned NBA All-Rookie First Team honors. He also made the cover of many magazines and appeared in television commercials for several different products.","heading":""},{"n":8,"text":"Between 2005 and 2011, Yao was injured repeatedly on the court. In 2011, he finally decided to retire because of injuries to his foot and ankle. Although his basketball career was cut short, Yao is still the same generous, humble, and likable person he was before his basketball career took off and placed him in the spotlight. Yao is married and has a young daughter. He finally has the chance to go to college, where he is studying economics and management. Yao will be remembered for his success on the basketball court, but he hopes to someday make a difference in the world off the court, too.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P080","page":"P080","title":"Rolling to Victory","exercisePage":"P081","pdfPage":84,"pdfExercisePage":85,"lead":"How did wheelchair basketball get its start?","paragraphs":[{"n":1,"text":"After World War II, many injured veterans returned home needing wheelchairs for mobility. These former soldiers tended to be young and mentally fit, so they were not about to let their physical disabilities make them idle. In Veteran’s Association hospitals across the country, vets needed an outlet for their energy and athleticism. It was this desire for activity that gave birth to wheelchair basketball.","heading":""},{"n":2,"text":"In 1946, two different chapters of the Paralyzed Veterans of America, one in California and one in New England, began hosting wheelchair basketball games in VA hospitals. Word spread about this new sport, and soon there were veterans’ teams forming all over the United States and Canada. The excitement even crossed the Atlantic Ocean, and a team was formed in England. At the first PVA wheelchair basketball tournament, the original California team, the Birmingham Flying Wheels, won the series.","heading":""},{"n":3,"text":"In 1948, the Flying Wheels received sponsorship to travel the U.S. and play other VA teams. The popularity of these wheelchair basketball competitions inspired the first civilian, or nonmilitary, team to form in Kansas City. They were originally called the Kansas City Wheelchair Bulldozers, but today they are known as the Rolling Pioneers.","heading":""},{"n":4,"text":"The next year, a group of students at the University of Illinois, helped by the university’s director of rehabilitation, developed a more organized wheelchair basketball league. They held the first National Wheelchair Basketball Association tournament in 1949. Today, the NWBA has grown to include 22 conferences with 165 teams!","heading":""},{"n":5,"text":"So, what makes wheelchair basketball different than the game you usually see on television or at the school gym? Aside from a few rules concerning the wheelchairs, it is mostly the same. The most obvious difference is that to be an eligible player you must have a physical disability that requires the use of a wheelchair.","heading":""},{"n":6,"text":"However, even this requirement allows for a wide range of physical abilities with advantages and disadvantages for each player. To compensate, points are awarded to each player depending on how severe his or her disability is. Each team is allowed to have a maximum of twelve points, ensuring that teams are fairly matched.","heading":""},{"n":7,"text":"Another rule that helps keep the game fair is the physical advantage foul. Someone with a spinal cord injury might not be able to move his or her legs, but another player might still have use of part of his or her leg. This foul rule states that all players must remain firmly seated and may not use a physical advantage to raise themselves up in the wheelchair. Three physical advantage fouls will cause the offending player to be removed from the game.","heading":""},{"n":8,"text":"There are also specific requirements for the shape and size of the wheelchair, including a roll bar that protects the player if the chair tips over. During intense moments of play, it is not unusual for a player to fall out of his or her wheelchair. As long as the fallen player is not hurt and the fall does not interfere with play, the game keeps rolling!","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8}],"kind":""},{"id":"P082","page":"P082","title":"The Racing Gloves","exercisePage":"P083","pdfPage":86,"pdfExercisePage":87,"lead":"What special equipment do you think a wheelchair athlete needs?","paragraphs":[{"n":1,"text":"Julio and Tasha sat on the porch drinking lemonade and eating pretzels that Julio’s Uncle Jorge had made earlier that morning. Tasha popped the last bite of pretzel in her mouth and dusted the salt from her hands. “Your pretzels are great,” Tasha told Uncle Jorge when she saw him wheel into the doorway. “I’ve never eaten homemade soft pretzels before.”","heading":""},{"n":2,"text":"“They’re easy to make,” said Uncle Jorge. “Next time you come over, I’ll show you and Julio how to make them,” he added, maneuvering his wheelchair down the ramp that led from the front door to the porch.","heading":""},{"n":3,"text":"A mail truck pulled up in front of the house, and a moment later, the postal carrier came up the front walk carrying a stack of mail and a small brown package.","heading":""},{"n":4,"text":"“Who is the package from, Uncle Jorge?” asked Julio eagerly.","heading":""},{"n":5,"text":"Uncle Jorge opened the box and removed a pair of odd-looking gloves from the crumpled brown wrapping paper. “I’ve been waiting for these,” he said, trying on the gloves. He flexed his fingers back and forth several times. “I’m going to be racing in the Boston Marathon this spring,” he told Tasha and Julio.","heading":""},{"n":6,"text":"“I don’t think I knew that the race in Boston was a marathon,” said Julio, inspecting one of his uncle’s gloves. “You haven’t raced in a marathon before, have you?”","heading":""},{"n":7,"text":"“This will be my second,” said Uncle Jorge. “I’ve completed plenty of shorter races during the past ten years. Last year, I did my first marathon, and I qualified for the Boston Marathon. My best friend, who is a wheelchair racer too, placed third in his age group in last year’s Boston Marathon. We have a friendly competition going, so that’s given me incentive to stick to my training schedule.”","heading":""},{"n":8,"text":"“Is your racing chair very different from your everyday chair?” asked Tasha.","heading":""},{"n":9,"text":"Uncle Jorge nodded. “It has two large wheels like this chair does,” he said, gesturing to his wheelchair, “but it also has a third, smaller wheel in front. Sports tires are also different than my everyday tires.” He grinned. “It’s kind of like the difference between wearing running shoes and loafers.”","heading":""},{"n":10,"text":"“Do a lot of wheelchair racers compete in the Boston Marathon?” asked Julio, dipping a piece of pretzel in some spicy mustard.","heading":""},{"n":11,"text":"“It’s considered one of the most prestigious races,” replied Uncle Jorge. “Other than the Olympic and Paralympic Games, the Boston Marathon is the only race in the world for which you have to meet a qualifying time in order to participate.”","heading":""},{"n":12,"text":"Tasha and Julio exchanged glances. “I wish it was closer to home so we could go along and cheer for you,” said Julio.","heading":""},{"n":13,"text":"Uncle Jorge looked at him thoughtfully. “Let me talk to your parents,” he said. “Maybe you can drive up with Aunt Amelia and me the night before the race.” He smiled at Julio and Tasha. “I’m going to need the biggest cheering section I can get!”","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11},{"type":"paragraph","n":12},{"type":"paragraph","n":13}],"kind":""},{"id":"P084","page":"P084","title":"A Reason to Run","exercisePage":"P085","pdfPage":88,"pdfExercisePage":89,"lead":"Have you ever participated in a charity event?","paragraphs":[{"n":1,"text":"Julio and Tasha sat on the sun-warmed grass at the park. They were stretching before they set out on their afternoon run. As they stretched, they spoke about the upcoming race. Neither Julio nor Tasha had raced before, but they had been training together for nearly three months and felt prepared.","heading":""},{"n":2,"text":"“Do you have any sponsors yet?” asked Tasha. Her voice was a bit muffled as she bent over and gripped her ankles in a deep stretch.","heading":""},{"n":3,"text":"“Not really,” replied Julio. He stood up and leaned to one side, reaching as far as he could over his head with the opposite hand. “My parents and my grandma have both signed up. I know my aunts and uncles will help out, too, but I haven’t actually asked them yet. What about you?”","heading":""},{"n":4,"text":"Tasha took a quick drink from her water bottle and stood up. “I haven’t asked anyone but my parents yet,” she said. “I’m really nervous about asking other people to sponsor me for this race,” she confessed. “I really want to run, and I want to help support the Leukemia Society, but I’m dreading the whole process of asking for sponsors.”","heading":""},{"n":5,"text":"Tasha and Julio started down the bike path at a medium jog. “What are you worried about?” asked Julio. “I think that people will be willing to help out a good cause. We’re not asking them to buy anything. All we want is a donation to the Leukemia Society in exchange for the time and effort we put into training.”","heading":""},{"n":6,"text":"“I know,” agreed Tasha. “It shouldn’t be a big deal, but I’m just afraid that no one will want to participate, or that they’ll pledge to support me and I won’t be able to finish the race for some reason.”","heading":""},{"n":7,"text":"Julio and Tasha ran single file for a few seconds as they passed a family on roller blades. When Julio caught up to Tasha, he said, “Listen, I completely understand why it’s hard for you to ask people you don’t know for donations. I can help you with that part. But you have to have a little more confidence in yourself about the race. We’ve both been able to run the entire three miles for the last month. You’re practically not even out of breath anymore when we finish. This race is going to be a piece of cake for you.”","heading":""},{"n":8,"text":"The two runners were quiet for a moment. The only sound was the gentle thudding of their shoes hitting the path. “You’re right,” said Tasha finally. “Running the race isn’t going to be the hard part for me. Do you have any ideas about whom we could ask for pledges?”","heading":""},{"n":9,"text":"Julio, who was starting to become a bit short of breath, nodded. “Could you ask the parents of the players on your soccer team?” he asked. “Also, the neighborhood block party is going to be next weekend. That could be a great time to ask our neighbors. Everyone will be in a good mood, so they’ll probably be pretty receptive to helping us out.”","heading":""},{"n":10,"text":"Tasha smiled. “We make a good team, Julio,” she said. “I definitely feel like I can do this now.”","heading":""},{"n":11,"text":"Julio smiled back. “Good,” he said, picking up the pace, “because the last one to make it to the finish today has to buy ice cream on the way home!” Tasha laughed as the two friends sprinted toward the park’s gates.","heading":""}],"blocks":[{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7},{"type":"paragraph","n":8},{"type":"paragraph","n":9},{"type":"paragraph","n":10},{"type":"paragraph","n":11}],"kind":""},{"id":"P086","page":"P086","title":"Getting Up to Speed","exercisePage":"P087","pdfPage":90,"pdfExercisePage":91,"lead":"Where can you go running safely in your neighborhood?","paragraphs":[{"n":"u1","text":"Before you begin training:","label":"小标题","raw":"Before you begin training:"},{"n":"u2","text":"- Find a running “buddy” to train with you. Ask a friend from school or from your neighborhood, your brother or sister, or a parent or other relative. - Make sure you have a good pair of running shoes that fit you properly. - Stay hydrated! Even if you aren’t perspiring visibly, exercise uses up a great deal of your body’s water. Be sure to drink water frequently to keep your energy level up and your body working. - Snack on healthful foods. Fruits and vegetables, whole grains, and low-fat dairy products all help maintain a healthy body. Have an apple and a piece of cheese, some yogurt sprinkled with granola, or an orange and a handful of whole-grain pretzels. You’ll find that you have plenty of energy to complete the goals you set for yourself. - Get in the habit of taking a few minutes to stretch before you begin running. Stretching helps you stay flexible. It can also help protect your body from injury.","label":"说明 / 列表","raw":"- Find a running “buddy” to train with you. Ask a friend from school or from your neighborhood, your brother or sister, or a parent or other relative.\r\n- Make sure you have a good pair of running shoes that fit you properly.\r\n- Stay hydrated! Even if you aren’t perspiring visibly, exercise uses up a great deal of your body’s water. Be sure to drink water frequently to keep your energy level up and your body working.\r\n- Snack on healthful foods. Fruits and vegetables, whole grains, and low-fat dairy products all help maintain a healthy body. Have an apple and a piece of cheese, some yogurt sprinkled with granola, or an orange and a handful of whole-grain pretzels. You’ll find that you have plenty of energy to complete the goals you set for yourself.\r\n- Get in the habit of taking a few minutes to stretch before you begin running. Stretching helps you stay flexible. It can also help protect your body from injury."},{"n":1,"text":"The best way to begin training is by alternately walking and running. This allows your body to become accustomed to the challenge of running without overdoing it. Begin your first week with running for two minutes and walking for four minutes. Do this sequence five times in a row, four times a week.","heading":""},{"n":2,"text":"If you feel comfortable doing this sequence after a week, you’re ready to progress to the next level. If it still feels challenging, continue with it for another week.","heading":""},{"n":3,"text":"When you decide to move to the next level, you’ll run three minutes and walk for three minutes. Continue to progress each week, increasing the time you spend running and decreasing the time you spend walking, until you reach 30 minutes of continuous running.","heading":""},{"n":4,"text":"When you are running, you should be able to comfortably talk with your running buddy. If you are pushing yourself too hard, talking will be difficult because you’ll be short of breath.","heading":""},{"n":5,"text":"The days of the week that you don’t run, try some different kinds of fitness activities, like hiking, ice skating, jumping rope, or playing basketball. You’ll find that these activities use different muscles than running does. This kind of cross-training can help you get into even better shape than only repeating a single activity. Don’t forget to schedule at least one day of rest every week. It’s always a good idea to give your body a chance to recover from your daily workouts.","heading":""},{"n":6,"text":"Consider keeping a runner’s log or journal. You can record the weather, your route, the distance you ran, and how you felt. You might notice that you prefer running early in the day or that eating an orange before you go for a run gives you a good boost in energy.","heading":""},{"n":7,"text":"Most of all, remember to have fun. Running is just one of many different activities you can do to stay in shape. Vary your routine enough to keep it interesting, and bring along a friend to keep you company.","heading":""}],"blocks":[{"type":"note","n":"u1"},{"type":"list","n":"u2"},{"type":"paragraph","n":1},{"type":"paragraph","n":2},{"type":"paragraph","n":3},{"type":"paragraph","n":4},{"type":"paragraph","n":5},{"type":"paragraph","n":6},{"type":"paragraph","n":7}],"kind":""},{"id":"P088","page":"P088","title":"A Mysterious Glow","exercisePage":"P089","pdfPage":92,"pdfExercisePage":93,"lead":"Have you ever seen an organism that glows? Where were you?","paragraphs":[{"n":1,"text":"It was the Taylors’ first night at the beach. Miles, Sophie, and their parents sat outside and enjoyed a big seafood dinner that included fresh fish, scallops, crab, coleslaw, and corn on the cob. The sun was a ball of fire as it slipped into the ocean and left a peach-colored glow in the sky. They played several board games, and by nine o’clock, everyone had caught their second wind.","heading":""},{"n":2,"text":"“How does an evening stroll along the beach sound?” asked Mrs. Taylor, stretching as she stood up. “It’s a beautiful night, and I don’t think you kids have ever seen stars the way they look over the ocean at night.”","heading":""},{"n":3,"text":"“Sounds good to me,” said Mr. Taylor, collecting the game pieces on the coffee table and putting them back in the box.","heading":""},{"n":4,"text":"Sophie used a flashlight to guide the group down the sandy path in between the cottages, and in just a few minutes the Taylors found themselves on the beach. Miles and Sophie took off their flip-flops and let the sand squish between their toes.","heading":""},{"n":5,"text":"“The sand is so much cooler than it was earlier today!” exclaimed Sophie, remembering how she had danced across the beach to the water to keep from burning the soles of her feet.","heading":""},{"n":6,"text":"Mrs. Taylor
