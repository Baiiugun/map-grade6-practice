res are always faster than racing tires.","why":""}],"answer":"C","explanation":"跑鞋适合运动、便鞋适合日常穿着；这个类比帮助说明比赛轮胎和日常轮胎的用途差异。","evidence":[{"page":"P082","paragraph":9,"quote":"“It’s kind of like the difference between wearing running shoes and loafers.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P082-F2-01","page":"P082","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P082","exercisePage":"P083","section":"Reading / Questions","originalNumber":8,"originalStem":"Check the words that best describe Uncle Jorge. - ____ impatient - ____ competitive - ____ determined - ____ lonely - ____ enthusiastic","kind":"adapted"},"stem":"Which traits best describe Uncle Jorge?","options":[{"id":"A","text":"Competitive, determined, and enthusiastic","why":"他坚持训练、与朋友友好竞争，还期待亲友助威，支持这些特点。不能仅因坐轮椅就推断性格或能力。"},{"id":"B","text":"Lonely, uninterested, and unwilling to train","why":""},{"id":"C","text":"Careless about preparation and opposed to competition","why":""},{"id":"D","text":"Impatient with every visitor and afraid of races","why":""}],"answer":"A","explanation":"他坚持训练、与朋友友好竞争，还期待亲友助威，支持这些特点。不能仅因坐轮椅就推断性格或能力。","evidence":[{"page":"P082","paragraph":7,"quote":"We have a friendly competition going, so that’s given me incentive to stick to my training schedule.”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P082","paragraph":13,"quote":"“I’m going to need the biggest cheering section I can get!”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P082-B2-01","page":"P082","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P082","exercisePage":"P083","section":"Reading / Questions","originalNumber":2,"originalStem":"How is a racing wheelchair different from a regular wheelchair? How are they similar? ____________________________________________________________ ____________________________________________________________ ____________________________________________________________","kind":"adapted"},"stem":"How is the racing chair different from Uncle Jorge’s everyday chair?","options":[{"id":"A","text":"It is described as identical in every way.","why":""},{"id":"B","text":"It must be carried rather than rolled.","why":""},{"id":"C","text":"It has no large wheels at all.","why":""},{"id":"D","text":"It has an additional smaller wheel in front.","why":"第9段先说两种椅子都有两个大轮子，再用 but 引出比赛轮椅前面多一个小轮子。"}],"answer":"D","explanation":"第9段先说两种椅子都有两个大轮子，再用 but 引出比赛轮椅前面多一个小轮子。","evidence":[{"page":"P082","paragraph":9,"quote":"“It has two large wheels like this chair does,” he said, gesturing to his wheelchair, “but it also has a third, smaller wheel in front.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P084-A4-01","page":"P084","skill":"A4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P084","exercisePage":"P085","section":"Reading / Questions","originalNumber":7,"originalStem":"The theme of a story is its subject. It tells what idea the story is mostly about. Check the word below that best describes the theme of “A Reason to Run.” - ___ fitness - ___ friendship - ___ loyalty","kind":"adapted"},"stem":"Which theme is best supported by the story?","options":[{"id":"A","text":"Preparation cannot affect how a person feels.","why":""},{"id":"B","text":"Winning matters more than helping other people.","why":""},{"id":"C","text":"It is always better to avoid asking for help.","why":""},{"id":"D","text":"Friends can help one another gain confidence and face challenges.","why":"Julio 听取 Tasha 的担忧，提醒她的训练成果并提出募款建议，最终她更有信心；主题需概括这一发展。"}],"answer":"D","explanation":"Julio 听取 Tasha 的担忧，提醒她的训练成果并提出募款建议，最终她更有信心；主题需概括这一发展。","evidence":[{"page":"P084","paragraph":7,"quote":"I can help you with that part.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P084","paragraph":10,"quote":"“I definitely feel like I can do this now.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P084-F3-01","page":"P084","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P084","exercisePage":"P085","section":"Reading / Questions","originalNumber":1,"originalStem":"What problem does Tasha have in the story? ________________________________________ ________________________________________","kind":"adapted"},"stem":"What is Tasha’s main concern at the beginning?","options":[{"id":"A","text":"Asking people to sponsor her and possibly disappointing them","why":"第4段明确说她害怕开口找赞助，第6段补充担心没人参加或自己完不成比赛。"},{"id":"B","text":"Finding someone to bake pretzels","why":""},{"id":"C","text":"Choosing a new pair of roller blades","why":""},{"id":"D","text":"Traveling to another country for the race","why":""}],"answer":"A","explanation":"第4段明确说她害怕开口找赞助，第6段补充担心没人参加或自己完不成比赛。","evidence":[{"page":"P084","paragraph":4,"quote":"“I’m really nervous about asking other people to sponsor me for this race,” she confessed.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P084","paragraph":6,"quote":"“It shouldn’t be a big deal, but I’m just afraid that no one will want to participate, or that they’ll pledge to support me and I won’t be able to finish the race for some reason.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P084-C5-01","page":"P084","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P084","exercisePage":"P085","section":"Reading / Questions","originalNumber":10,"originalStem":"easy; simple to do ________________________________________.","kind":"adapted"},"stem":"What does Julio mean by “a piece of cake”?","options":[{"id":"A","text":"The race should be manageable for Tasha after her preparation.","why":"这个习语表示“轻而易举的事”。Julio 根据她已能跑完三英里的训练情况鼓励她。"},{"id":"B","text":"The race will require carrying a dessert.","why":""},{"id":"C","text":"The course has been replaced by a bakery.","why":""},{"id":"D","text":"Tasha must eat cake before she can run.","why":""}],"answer":"A","explanation":"这个习语表示“轻而易举的事”。Julio 根据她已能跑完三英里的训练情况鼓励她。","evidence":[{"page":"P084","paragraph":7,"quote":"We’ve both been able to run the entire three miles for the last month.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P084","paragraph":7,"quote":"This race is going to be a piece of cake for you.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P086-E5-01","page":"P086","skill":"E5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P086","exercisePage":"P087","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Who is the most likely intended audience?","options":[{"id":"A","text":"Experienced airplane engineers","why":""},{"id":"B","text":"People beginning a running routine","why":"标题、训练前准备、跑走交替和循序渐进的建议都面向初学跑步的人。"},{"id":"C","text":"Readers looking only for fictional ghost stories","why":""},{"id":"D","text":"Museum staff cataloging diamonds","why":""}],"answer":"B","explanation":"标题、训练前准备、跑走交替和循序渐进的建议都面向初学跑步的人。","evidence":[{"page":"P086","paragraph":1,"quote":"The best way to begin training is by alternately walking and running.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P086","paragraph":"u1","quote":"Before you begin training:","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P086-B5-01","page":"P086","skill":"B5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P086","exercisePage":"P087","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"According to the passage, what should a beginner do if the first week’s sequence still feels challenging?","options":[{"id":"A","text":"Immediately run continuously for thirty minutes.","why":""},{"id":"B","text":"Increase the running time every day regardless of comfort.","why":""},{"id":"C","text":"Stop taking rest days.","why":""},{"id":"D","text":"Repeat that sequence for another week.","why":"把第2段的条件建议应用到具体情况：仍有挑战时继续原方案一周，而非强行升级。此题考查对本文建议的理解。"}],"answer":"D","explanation":"把第2段的条件建议应用到具体情况：仍有挑战时继续原方案一周，而非强行升级。此题考查对本文建议的理解。","evidence":[{"page":"P086","paragraph":2,"quote":"If it still feels challenging, continue with it for another week.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P086-A3-01","page":"P086","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P086","exercisePage":"P087","section":"Reading / Questions","originalNumber":5,"originalStem":"Write a summary sentence for paragraph 5. ________________________________________ ________________________________________","kind":"adapted"},"stem":"Which sentence best summarizes paragraph 5?","options":[{"id":"A","text":"Running is the only useful kind of exercise.","why":""},{"id":"B","text":"Rest days should always be avoided.","why":""},{"id":"C","text":"Keep a journal only about the weather.","why":""},{"id":"D","text":"Vary exercise activities and include regular rest to support recovery.","why":"第5段主要有两项建议：用其他活动进行交叉训练，以及每周至少休息一天。总结应同时覆盖两点。"}],"answer":"D","explanation":"第5段主要有两项建议：用其他活动进行交叉训练，以及每周至少休息一天。总结应同时覆盖两点。","evidence":[{"page":"P086","paragraph":5,"quote":"The days of the week that you don’t run, try some different kinds of fitness activities, like hiking, ice skating, jumping rope, or playing basketball.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P086","paragraph":5,"quote":"Don’t forget to schedule at least one day of rest every week.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P088-F6-01","page":"P088","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P088","exercisePage":"P089","section":"Reading / Questions","originalNumber":12,"originalStem":"____________________________________________________________","kind":"adapted"},"stem":"What effect does describing the sun as “a ball of fire” create?","options":[{"id":"A","text":"It gives a vivid image of the sun’s bright, warm appearance at sunset.","why":"直接把太阳写成火球是比喻，突出了日落的明亮与色彩；不是说明海面发光成因的科学解释。"},{"id":"B","text":"It proves the sun has fallen into the ocean.","why":""},{"id":"C","text":"It explains the chemical cause of bioluminescence.","why":""},{"id":"D","text":"It shows that the family is standing beside an actual fireball.","why":""}],"answer":"A","explanation":"直接把太阳写成火球是比喻，突出了日落的明亮与色彩；不是说明海面发光成因的科学解释。","evidence":[{"page":"P088","paragraph":1,"quote":"The sun was a ball of fire as it slipped into the ocean and left a peach-colored glow in the sky.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P088-C5-01","page":"P088","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P088","exercisePage":"P089","section":"Reading / Questions","originalNumber":11,"originalStem":"felt refreshed ____________________________________________________________","kind":"adapted"},"stem":"What does “caught their second wind” mean?","options":[{"id":"A","text":"Stopped breathing for a short time","why":""},{"id":"B","text":"Found another sailboat on the shore","why":""},{"id":"C","text":"Felt renewed energy after being tired","why":"这是表示重新恢复精力的习语；后面全家愿意继续去海边散步，与精力回升相吻合。"},{"id":"D","text":"Learned to predict a second storm","why":""}],"answer":"C","explanation":"这是表示重新恢复精力的习语；后面全家愿意继续去海边散步，与精力回升相吻合。","evidence":[{"page":"P088","paragraph":1,"quote":"They played several board games, and by nine o’clock, everyone had caught their second wind.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P088","paragraph":2,"quote":"“How does an evening stroll along the beach sound?”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P088-E4-01","page":"P088","skill":"E4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P088","exercisePage":"P089","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which mood is created by the discovery of the glowing water?","options":[{"id":"A","text":"Wonder and excitement","why":"爆发的绿光、惊叹 incredible 和 amazement 等描写营造了惊奇与兴奋的氛围。"},{"id":"B","text":"Bitterness and resentment","why":""},{"id":"C","text":"Despair about an unavoidable disaster","why":""},{"id":"D","text":"Boredom and indifference","why":""}],"answer":"A","explanation":"爆发的绿光、惊叹 incredible 和 amazement 等描写营造了惊奇与兴奋的氛围。","evidence":[{"page":"P088","paragraph":7,"quote":"There was an explosion of milky-green light where Sophie kicked.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P088","paragraph":9,"quote":"“This is incredible,” she said swirling her hands in the water.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P088","paragraph":10,"quote":"He nodded, and even in the dim light Sophie and Miles could see the look of amazement on their dad’s face.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P090-A1-01","page":"P090","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P090","exercisePage":"P091","section":"Reading / Questions","originalNumber":1,"originalStem":"Write a sentence that tells the main idea of the passage. ________________________________________________________________________ ________________________________________________________________________","kind":"adapted"},"stem":"Which statement best expresses the main idea?","options":[{"id":"A","text":"Only land animals can make their own light.","why":""},{"id":"B","text":"Bioluminescence is a kind of underwater lightbulb made by humans.","why":""},{"id":"C","text":"Many organisms produce their own light and use it in several different ways.","why":"文章解释生物发光的含义，并分别介绍伪装、吸引配偶、迷惑捕食者、诱捕猎物等用途，中心思想要覆盖这些内容。"},{"id":"D","text":"All glowing animals use light for exactly the same purpose.","why":""}],"answer":"C","explanation":"文章解释生物发光的含义，并分别介绍伪装、吸引配偶、迷惑捕食者、诱捕猎物等用途，中心思想要覆盖这些内容。","evidence":[{"page":"P090","paragraph":2,"quote":"It refers to organisms that produce light as a result of a chemical reaction.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P090","paragraph":3,"quote":"Ocean animals use bioluminescence in various ways.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P090-B4-01","page":"P090","skill":"B4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P090","exercisePage":"P091","section":"Reading / Questions","originalNumber":4,"originalStem":"How does bioluminescence help camouflage the bobtail squid? ________________________________________________________________________ ________________________________________________________________________","kind":"adapted"},"stem":"Which detail explains how the bobtail squid uses light as camouflage?","options":[{"id":"A","text":"It grows wings so it can leave the water.","why":""},{"id":"B","text":"It imitates the sound of a much larger animal.","why":""},{"id":"C","text":"Its glowing underside can blend with the stars when viewed from below.","why":"第3段专门解释 bobtail squid 的隐蔽方式：从下方看，腹部光与星光混合。第5段的发光化学云属于另一种鱿鱼的脱逃方式，不能混为一谈。"},{"id":"D","text":"It always hides inside a discarded lightbulb.","why":""}],"answer":"C","explanation":"第3段专门解释 bobtail squid 的隐蔽方式：从下方看，腹部光与星光混合。第5段的发光化学云属于另一种鱿鱼的脱逃方式，不能混为一谈。","evidence":[{"page":"P090","paragraph":3,"quote":"However, if you were a predator hunting a bobtail squid and you looked up at the squid’s belly, its bioluminescence would allow it to blend with the stars of the night sky.","why":"结合这处原文核对题干中的限定与结论。"}],"sourceKeyNote":"原书答案页把第5段另一种鱿鱼的方式答在此题；本项目按第3段正文校正。"},{"id":"R6-P090-C4-01","page":"P090","skill":"C4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P090","exercisePage":"P091","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"The passage explains “bios” as “living” and “lumen” as “light.” What does “bioluminescence” refer to?","options":[{"id":"A","text":"Any sound made by a sea animal","why":""},{"id":"B","text":"Light produced by living organisms","why":"将两个词源含义组合为“生命＋光”，再与后面的定义核对，即生物体产生的光。"},{"id":"C","text":"A measurement of ocean depth","why":""},{"id":"D","text":"Heat made only by electric lamps","why":""}],"answer":"B","explanation":"将两个词源含义组合为“生命＋光”，再与后面的定义核对，即生物体产生的光。","evidence":[{"page":"P090","paragraph":2,"quote":"The word bioluminescence (bahy-oh-loo-muh-nes-uhns) comes from the Greek word bios, which means living, and the Latin word lumen, which means light.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P090","paragraph":2,"quote":"It refers to organisms that produce light as a result of a chemical reaction.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P092-D1-01","page":"P092","skill":"D1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P092","exercisePage":"P093","section":"Reading / Questions","originalNumber":7,"originalStem":"The climax of a story is the point of highest excitement. What is the climax in “A Stinging Surprise”? ________________________________________________________________________","kind":"adapted"},"stem":"Which event is the story’s main turning point or climax?","options":[{"id":"A","text":"The family begins walking along the beach.","why":""},{"id":"B","text":"Miles is suddenly stung while the family watches a seagull.","why":"被蜇使情节从轻松散步转为紧急求助，产生故事的主要冲突，之后的行动都围绕它展开。"},{"id":"C","text":"Sophie notices the late afternoon sunlight.","why":""},{"id":"D","text":"Mr. Taylor thanks the lifeguard.","why":""}],"answer":"B","explanation":"被蜇使情节从轻松散步转为紧急求助，产生故事的主要冲突，之后的行动都围绕它展开。","evidence":[{"page":"P092","paragraph":3,"quote":"ouch! Dad, help!","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P092-F6-01","page":"P092","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P092","exercisePage":"P093","section":"Reading / Questions","originalNumber":8,"originalStem":"________________________________________________________________________","kind":"adapted"},"stem":"What is compared in the phrase “like a sea of diamonds”?","options":[{"id":"A","text":"The sparkling water and shining diamonds","why":"like 引出明喻，以钻石的闪亮来描写阳光下的水面，突出视觉效果。"},{"id":"B","text":"Miles’s shoe and a seashell","why":""},{"id":"C","text":"A seagull’s wings and a boat","why":""},{"id":"D","text":"The lifeguard’s tower and a mountain.","why":""}],"answer":"A","explanation":"like 引出明喻，以钻石的闪亮来描写阳光下的水面，突出视觉效果。","evidence":[{"page":"P092","paragraph":1,"quote":"The late afternoon sun reflected off the water and made it sparkle like a sea of diamonds.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P092-B2-01","page":"P092","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P092","exercisePage":"P093","section":"Reading / Questions","originalNumber":1,"originalStem":"Number the events below to show the order in which they happened. - _____ Mr. Taylor shook the lifeguard’s hand. - _____ The Taylors watched a seagull catch a fish. - _____ The lifeguard cleaned the sting with alcohol. - _____ Sophie pointed to the sand-covered jellyfish. - _____ The lifeguard smeared meat tenderizer on Miles’ foot.","kind":"adapted"},"stem":"Which sequence follows the story?","options":[{"id":"A","text":"Miles feels pain → Mr. Taylor thanks the lifeguard → Sophie gets help → watch a seagull","why":""},{"id":"B","text":"Mr. Taylor thanks the lifeguard → watch a seagull → Sophie gets help → Miles feels pain","why":""},{"id":"C","text":"Watch a seagull → Miles feels pain → Sophie gets the lifeguard → Mr. Taylor thanks him","why":"按情节时间核对第2、3、5—9、15段，即观察海鸥、突然疼痛、求助、道谢。"},{"id":"D","text":"Sophie gets help → watch a seagull → Mr. Taylor thanks him → Miles feels pain","why":""}],"answer":"C","explanation":"按情节时间核对第2、3、5—9、15段，即观察海鸥、突然疼痛、求助、道谢。","evidence":[{"page":"P092","paragraph":2,"quote":"“Quick, kids, look at the seagull!”","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P092","paragraph":3,"quote":"ouch! Dad, help!","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P092","paragraph":9,"quote":"In just a few minutes, Sophie returned with the lifeguard, a friendly-looking man with deeply tanned skin and curly black hair.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P092","paragraph":15,"quote":"“Thank you for all your help,” said Mr.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P094-D4-01","page":"P094","skill":"D4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P094","exercisePage":"P095","section":"Reading / Questions","originalNumber":1,"originalStem":"Why does the author say that the description of a jellyfish might sound like a riddle? ________________________________________________________________________","kind":"adapted"},"stem":"Why does the author begin with a question that sounds like a riddle?","options":[{"id":"A","text":"To ask readers to solve an unrelated math problem","why":""},{"id":"B","text":"To prove that no such animal exists","why":""},{"id":"C","text":"To give all instructions for caring for a pet","why":""},{"id":"D","text":"To arouse curiosity about an animal with surprising features","why":"开头的无脑、无骨等特征令人意外，问题形式吸引读者继续寻找答案，随后才点明水母并解释。"}],"answer":"D","explanation":"开头的无脑、无骨等特征令人意外，问题形式吸引读者继续寻找答案，随后才点明水母并解释。","evidence":[{"page":"P094","paragraph":1,"quote":"What kind of animal has no brain, no bones, and no circulatory system?","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P094","paragraph":1,"quote":"This might sound like a riddle, but it isn’t.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P094-C1-01","page":"P094","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P094","exercisePage":"P095","section":"Reading / Questions","originalNumber":11,"originalStem":"An invertebrate has no ____________________.","kind":"adapted"},"stem":"What does “invertebrates” mean in this passage?","options":[{"id":"A","text":"Animals without backbones","why":"which means 后面就是作者给出的直接释义：没有脊椎，不是没有任何组织或不能运动。"},{"id":"B","text":"Animals with no way to move at all","why":""},{"id":"C","text":"Animals that live only in freshwater","why":""},{"id":"D","text":"Animals made entirely of jelly","why":""}],"answer":"A","explanation":"which means 后面就是作者给出的直接释义：没有脊椎，不是没有任何组织或不能运动。","evidence":[{"page":"P094","paragraph":2,"quote":"They are invertebrates, which means that they do not have backbones.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P094-B1-01","page":"P094","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P094","exercisePage":"P095","section":"Reading / Questions","originalNumber":12,"originalStem":"How do jellyfish move? ________________________________________________________________________ ________________________________________________________________________","kind":"adapted"},"stem":"Which statement accurately describes jellyfish movement?","options":[{"id":"A","text":"They swim rapidly by moving a backbone from side to side.","why":""},{"id":"B","text":"They can never move except when humans carry them.","why":""},{"id":"C","text":"Currents and wind carry them, and muscle contractions can also move them slowly.","why":"第6段先说大多靠海流和风移动，再补充肌肉收缩也能缓慢推动。准确转述必须保留这项补充。"},{"id":"D","text":"They can move only by walking along the ocean floor.","why":""}],"answer":"C","explanation":"第6段先说大多靠海流和风移动，再补充肌肉收缩也能缓慢推动。准确转述必须保留这项补充。","evidence":[{"page":"P094","paragraph":6,"quote":"For the most part, jellyfish are transported by ocean currents and the wind.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P094","paragraph":6,"quote":"They have some ability to move through the water by contracting muscles in the main part of the body.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P096-F2-01","page":"P096","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P096","exercisePage":"P097","section":"Reading / Questions","originalNumber":3,"originalStem":"What is one way in which Miles and Sophie are different? _________________________________________________","kind":"adapted"},"stem":"How are Sophie and Miles different when facing a new activity?","options":[{"id":"A","text":"Sophie already teaches surfing professionally, while Miles does not.","why":""},{"id":"B","text":"Miles is completely fearless, while Sophie refuses to try.","why":""},{"id":"C","text":"Neither of them has any interest in the ocean.","why":""},{"id":"D","text":"Sophie is more ready to plunge in, while Miles is more cautious.","why":"第3段写 Miles 担心出丑，第4段写 Sophie 学得快、敢尝试，并明确说 Miles 没她那么爱冒险。"}],"answer":"D","explanation":"第3段写 Miles 担心出丑，第4段写 Sophie 学得快、敢尝试，并明确说 Miles 没她那么爱冒险。","evidence":[{"page":"P096","paragraph":3,"quote":"He was worried about looking silly in front of his cousins, but he had a feeling he was going to love surfing.","why":"结合这处原文核对题干中的限定与结论。"},{"page": was as sleek and glossy as an otter’s fur, was plastered against her head.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P098-B2-01","page":"P098","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P098","exercisePage":"P099","section":"Reading / Questions","originalNumber":6,"originalStem":"Why did the new fiberglass and foam surfboards cause a rise in surfing’s popularity? ________________________________________","kind":"adapted"},"stem":"Why did fiberglass and foam boards help surfing become more popular?","options":[{"id":"A","text":"They cost less and were easier to use than wooden boards.","why":"第2段把材料变化与较低价格、较容易使用联系起来，随后写 surfing became enormously popular，形成因果链。"},{"id":"B","text":"They were heavier and impossible to maneuver.","why":""},{"id":"C","text":"They were available only to professional judges.","why":""},{"id":"D","text":"They made it possible to surf without any waves.","why":""}],"answer":"A","explanation":"第2段把材料变化与较低价格、较容易使用联系起来，随后写 surfing became enormously popular，形成因果链。","evidence":[{"page":"P098","paragraph":2,"quote":"This made them less expensive, as well as much easier to use and maneuver.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P098","paragraph":2,"quote":"Suddenly, surfing became enormously popular in the United States, and surfing culture was born.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P098-C1-01","page":"P098","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P098","exercisePage":"P099","section":"Reading / Questions","originalNumber":9,"originalStem":"What do you think the surfing term wipeout means? ________________________________________","kind":"adapted"},"stem":"What does “wipeouts” most likely mean in paragraph 8?","options":[{"id":"A","text":"Quiet walks along a beach.","why":""},{"id":"B","text":"Falls or crashes while surfing","why":"附近说这种情况 likely to be fatal，语境强调巨浪挑战的危险，因此是摔落或失控，而不是奖项或出行。"},{"id":"C","text":"Awards given after a competition","why":""},{"id":"D","text":"Journeys to buy a new surfboard","why":""}],"answer":"B","explanation":"附近说这种情况 likely to be fatal，语境强调巨浪挑战的危险，因此是摔落或失控，而不是奖项或出行。","evidence":[{"page":"P098","paragraph":8,"quote":"Wipeouts at Teahupoo are likely to be fatal, but Hamilton took the challenge and survived.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P098-A3-01","page":"P098","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P098","exercisePage":"P099","section":"Reading / Questions","originalNumber":10,"originalStem":"Write a summary sentence for paragraph 4. ________________________________________","kind":"adapted"},"stem":"Which sentence best summarizes paragraph 4?","options":[{"id":"A","text":"The paragraph lists the winners of surfing championships.","why":""},{"id":"B","text":"Every surfer prefers competitions to the natural ocean.","why":""},{"id":"C","text":"Surfers enjoy the ocean, changing challenges, and the thrill of riding waves.","why":"第4段解释吸引人的几个原因：海洋、不断变化的挑战，以及肾上腺素带来的刺激。"},{"id":"D","text":"Surfing is mainly popular because surfboards are colorful.","why":""}],"answer":"C","explanation":"第4段解释吸引人的几个原因：海洋、不断变化的挑战，以及肾上腺素带来的刺激。","evidence":[{"page":"P098","paragraph":4,"quote":"Surfing appeals to people for several reasons.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P098","paragraph":4,"quote":"Surfers also seek the adrenaline rush that comes with riding the waves.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P100-A1-01","page":"P100","skill":"A1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P100","exercisePage":"P101","section":"Reading / Questions","originalNumber":4,"originalStem":"Check the sentence that best states the main idea of the selection. - ______ Duke Kahanamoku’s full name was Duke Paoa Kahinu Makoe Hulikohoa Kahanamoku. - ______ Duke Kahanamoku was the first person to be inducted into both the Swimming Hall of Fame and the Surfing Hall of Fame. - ______ Duke Kahanamoku was known as the “father of modern surfing” because :[{"page":"P100","paragraph":3,"quote":"Kahanamoku went to the Olympics as a swimmer in 1912 and 1920, where he won a total of three gold medals for the United States.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P100-F6-01","page":"P100","skill":"F6","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P100","exercisePage":"P101","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What effect does “the ocean was patiently waiting for him” create?","options":[{"id":"A","text":"It reports that the ocean can literally make plans.","why":""},{"id":"B","text":"It personifies the ocean and emphasizes his deep attachment to it.","why":"把“耐心等待”赋予海洋是拟人，写出他放学后急切回海边、与海洋亲近的感觉。"},{"id":"C","text":"It explains why tides change during the day.","why":""},{"id":"D","text":"It shows that he was afraid to go near water.","why":""}],"answer":"B","explanation":"把“耐心等待”赋予海洋是拟人，写出他放学后急切回海边、与海洋亲近的感觉。","evidence":[{"page":"P100","paragraph":2,"quote":"He attended school but rushed home every afternoon, knowing that the ocean was patiently waiting for him.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P102-F2-01","page":"P102","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P102","exercisePage":"P103","section":"Reading / Questions","originalNumber":2,"originalStem":"Do you think that Mr. Ishikawa is a good coach? Why or why not? ________________________________________ ________________________________________","kind":"adapted"},"stem":"Which action best shows that Mr. Ishikawa is a supportive coach?","options":[{"id":"A","text":"He refuses to speak to anyone before the contest.","why":""},{"id":"B","text":"He thanks the students and says he is proud regardless of whether they win.","why":"第2—3段肯定努力，并把荣誉和尽力放在胜负之前，支持“鼓励队员”的判断。"},{"id":"C","text":"He threatens to punish the team if it loses.","why":""},{"id":"D","text":"He tells the students their preparation was worthless.","why":""}],"answer":"B","explanation":"第2—3段肯定努力，并把荣誉和尽力放在胜负之前，支持“鼓励队员”的判断。","evidence":[{"page":"P102","paragraph":2,"quote":"“I want to thank each one of you for your hard work.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P102","paragraph":3,"quote":"“Whether or not Schuyler Middle School wins today’s competition, I’m proud of you all,” Mr.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P102-C1-01","page":"P102","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P102","exercisePage":"P103","section":"Reading / Questions","originalNumber":3,"originalStem":"In paragraph 5, the author describes Ms. Cane as having “an infectious laugh.” What do you think this means? ________________________________________ ________________________________________","kind":"adapted"},"stem":"What does “an infectious laugh” mean here?","options":[{"id":"A","text":"A laugh used only to interrupt the game.","why":""},{"id":"B","text":"A laugh that makes other people want to laugh or relax too","why":"第5段说她友善并很快让参赛者放松，因此 infectious 在此指情绪会感染别人，是积极的语境含义。"},{"id":"C","text":"A laugh that no one else can hear","why":""},{"id":"D","text":"A laugh caused by a dangerous disease","why":""}],"answer":"B","explanation":"第5段说她友善并很快让参赛者放松，因此 infectious 在此指情绪会感染别人，是积极的语境含义。","evidence":[{"page":"P102","paragraph":5,"quote":"Cane was a tall, friendly woman with thick auburn hair and an infectious laugh.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P102","paragraph":5,"quote":"Within a few minutes, she had put all the contestants at ease.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P102-E4-01","page":"P102","skill":"E4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P102","exercisePage":"P103","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What atmosphere is established at the beginning?","options":[{"id":"A","text":"Hopelessness after the final results.","why":""},{"id":"B","text":"Complete boredom with no expectations","why":""},{"id":"C","text":"Anger about a canceled holiday","why":""},{"id":"D","text":"Excitement mixed with nervous anticipation","why":"开头直接并列 energy and excitement 与 nervous energy，说明既兴奋又紧张；此时比赛尚未开始。"}],"answer":"D","explanation":"开头直接并列 energy and excitement 与 nervous energy，说明既兴奋又紧张；此时比赛尚未开始。","evidence":[{"page":"P102","paragraph":1,"quote":"The bus was filled with energy and excitement.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P102","paragraph":1,"quote":"Students were talking and laughing, but there was also a bit of nervous energy in the air.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P104-C4-01","page":"P104","skill":"C4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P104","exercisePage":"P105","section":"Reading / Questions","originalNumber":3,"originalStem":"What Latin and Greek roots are found in the word television? What do they mean? __________________________________________________","kind":"adapted"},"stem":"How do the roots “tele” and “visio” help explain “television”?","options":[{"id":"A","text":"They suggest seeing images transmitted from far away.","why":"tele 是远，visio 是看，合起来与接收远处图像的设备相吻合。"},{"id":"B","text":"They mean writing a message by hand.","why":""},{"id":"C","text":"They describe a machine that makes food.","why":""},{"id":"D","text":"They mean hearing only nearby sounds.","why":""}],"answer":"A","explanation":"tele 是远，visio 是看，合起来与接收远处图像的设备相吻合。","evidence":[{"page":"P104","paragraph":1,"quote":"The word television comes from the Greek word tele, which means far, and the Latin word visio, which means sight.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P104","paragraph":1,"quote":"The word television comes from the Greek word tele, which means far, and the Latin word visio, which means sight.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P104-B2-01","page":"P104","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P104","exercisePage":"P105","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"What problem led John Watson to put up a giant antenna?","options":[{"id":"A","text":"His town had no interest in any entertainment.","why":""},{"id":"B","text":"Weak television signals made customers reluctant to buy TVs.","why":"第7段按问题—解决写：信号弱导致销售困难，巨型天线改善接收，再把较强信号送给客户。"},{"id":"C","text":"He wanted to stop customers from receiving programs.","why":""},{"id":"D","text":"All available television sets had screens that were too large.","why":""}],"answer":"B","explanation":"第7段按问题—解决写：信号弱导致销售困难，巨型天线改善接收，再把较强信号送给客户。","evidence":[{"page":"P104","paragraph":7,"quote":"Television signals were weak by the time they reached his town, and people did not think it was worthwhile to buy a TV.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P104","paragraph":7,"quote":"Watson put up a giant antenna to get better reception and offered his customers a free connection to the stronger signal.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P104-E2-01","page":"P104","skill":"E2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P104","exercisePage":"P105","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"How does the author handle the question of who invented television?","options":[{"id":"A","text":"The author claims no one ever contributed to television.","why":""},{"id":"B","text":"The author acknowledges disagreement and describes contributions by more than one person.","why":"第2段强调贡献者很多，难以归于一人；第3段列出两人的角色并提到 historians disagree，体现有保留的评价。"},{"id":"C","text":"The author gives all credit to John Watson for the first electronic TV.","why":""},{"id":"D","text":"The author says historians agree on every detail.","why":""}],"answer":"B","explanation":"第2段强调贡献者很多，难以归于一人；第3段列出两人的角色并提到 historians disagree，体现有保留的评价。","evidence":[{"page":"P104","paragraph":2,"quote":"Because there were so many contributors, it is hard to pinpoint exactly who gets credit as the inventor of TV.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P104","paragraph":3,"quote":"Historians disagree about which man deserves more credit, but today, Farnsworth’s contribution is seen as the crucial first step in the technological developments made by Zworykin.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P106-A2-01","page":"P106","skill":"A2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P106","exercisePage":"P107","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which central claim is supported by the examples in the passage?","options":[{"id":"A","text":"Radio and television always produce identical impressions.","why":""},{"id":"B","text":"Television has never affected politics or popular culture.","why":""},{"id":"C","text":"Televised images can influence public opinion and the way people experience historical events.","why":"开头提出电视影像影响历史记忆与公众，后面用政治、全国哀悼、音乐和登月等例子展开论证。"},{"id":"D","text":"Only fictional programs can change how people feel.","why":""}],"answer":"C","explanation":"开头提出电视影像影响历史记忆与公众，后面用政治、全国哀悼、音乐和登月等例子展开论证。","evidence":[{"page":"P106","paragraph":1,"quote":"Some events were even shaped by the powerful influence these images have on the public.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P106","paragraph":4,"quote":"However, television viewers declared Kennedy the winner.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P106","paragraph":6,"quote":"Viewers across the nation saw their goofy grins and goofier haircuts, as well as the crowd’s frenzied cheering, and “Beatlemania” was born.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P106-B2-01","page":"P106","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P106","exercisePage":"P107","section":"Reading / Questions","originalNumber":12,"originalStem":"How did Kennedy and Nixon appear to be different from one another during their televised debate? ________________________________________ ________________________________________","kind":"adapted"},"stem":"According to the passage, why did radio listeners and TV viewers react differently to the debate?","options":[{"id":"A","text":"Radio listeners heard an entirely different debate.","why":""},{"id":"B","text":"Television viewers could not hear any words.","why":""},{"id":"C","text":"The passage says both groups reacted identically.","why":""},{"id":"D","text":"TV viewers also saw facial expressions and physical appearance.","why":"第4段把只听 words and ideas 与看见 smiling、scowling、uncomfortable 对照，说明视觉表现影响评价。题目以本文描述为依据。"}],"answer":"D","explanation":"第4段把只听 words and ideas 与看见 smiling、scowling、uncomfortable 对照，说明视觉表现影响评价。题目以本文描述为依据。","evidence":[{"page":"P106","paragraph":4,"quote":"Radio listeners, who had heard only the words and ideas, thought that Nixon had won the debate.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P106","paragraph":4,"quote":"Viewers saw a younger, smiling Kennedy trading viewpoints with Nixon, who was scowling and looked uncomfortable.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P106-D4-01","page":"P106","skill":"D4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P106","exercisePage":"P107","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Why does the author include the Beatles’ television appearance?","options":[{"id":"A","text":"To argue that all historical broadcasts were concerts","why":""},{"id":"B","text":"To describe the construction of a television antenna.","why":""},{"id":"C","text":"To explain how to play every Beatles song","why":""},{"id":"D","text":"To show that television’s influence extends beyond politics into popular culture","why":"第6段开头说 Not all historical moments...involve politics，直接提示该例子的作用是扩大论述范围。"}],"answer":"D","explanation":"第6段开头说 Not all historical moments...involve politics，直接提示该例子的作用是扩大论述范围。","evidence":[{"page":"P106","paragraph":6,"quote":"Not all historical moments on television involve politics.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P106","paragraph":6,"quote":"For instance, the Beatles’ appearance on the Ed Sullivan Show on February 9, 1964, changed American pop culture.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P108-F3-01","page":"P108","skill":"F3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P108","exercisePage":"P109","section":"Reading / Questions","originalNumber":6,"originalStem":"Why does Grandma think that Grandpa wanted canoeing lessons? __________________________________________________ __________________________________________________","kind":"adapted"},"stem":"Why does Grandma think Grandpa asked for canoeing lessons?","options":[{"id":"A","text":"He hoped to avoid ever seeing her again.","why":""},{"id":"B","text":"He needed lessons to build Dillon Dam.","why":""},{"id":"C","text":"He wanted to become the camp director immediately.","why":""},{"id":"D","text":"He wanted an opportunity to get to know her.","why":"虽然表面理由是学划船，奶奶在第7段明确认为更深层的动机是认识她。"}],"answer":"D","explanation":"虽然表面理由是学划船，奶奶在第7段明确认为更深层的动机是认识她。","evidence":[{"page":"P108","paragraph":7,"quote":"He asked me to give him canoeing lessons, but I think it was just because he wanted to get to know me.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P108-C5-01","page":"P108","skill":"C5","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P108","exercisePage":"P109","section":"Reading / Questions","originalNumber":1,"originalStem":"What do you think Grandma means when she says she learned to survive in the woods, “at least in theory”? __________________________________________________ __________________________________________________ __________________________________________________","kind":"adapted"},"stem":"What does Grandma suggest by saying she learned to survive in the woods “at least in theory”?","options":[{"id":"A","text":"She learned what to do but may not have tested it by surviving alone.","why":"in theory 区分“知道方法”和“亲自实践”。她的补充和轻笑表明不能把课程学习等同于确实独自在野外生活过。"},{"id":"B","text":"She learned the names of trees only from a comedy show.","why":""},{"id":"C","text":"She never heard any information about survival.","why":""},{"id":"D","text":"She definitely spent every winter alone in the woods.","why":""}],"answer":"A","explanation":"in theory 区分“知道方法”和“亲自实践”。她的补充和轻笑表明不能把课程学习等同于确实独自在野外生活过。","evidence":[{"page":"P108","paragraph":5,"quote":"At least in theory,” she chuckled.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P108-B2-01","page":"P108","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P108","exercisePage":"P109","section":"Reading / Questions","originalNumber":5,"originalStem":"What is one difference between a natural lake and a reservoir? __________________________________________________ __________________________________________________","kind":"adapted"},"stem":"How is a reservoir different from most natural lakes?","options":[{"id":"A","text":"It is always formed only by falling rain in a mountain hollow.","why":""},{"id":"B","text":"It cannot contain any water.","why":""},{"id":"C","text":"It must be smaller than every river.","why":""},{"id":"D","text":"It is created by humans, often by holding water behind a dam.","why":"奶奶直接对比 naturally formed 与 made by humans，随后说明建坝蓄水的过程。"}],"answer":"D","explanation":"奶奶直接对比 naturally formed 与 made by humans，随后说明建坝蓄水的过程。","evidence":[{"page":"P108","paragraph":9,"quote":"“Most lakes are naturally formed, but reservoirs are made by humans.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P108","paragraph":9,"quote":"When a dam is built, an artificial lake is created by flooding the land behind the dam.”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P110-B2-01","page":"P110","skill":"B2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P110","exercisePage":"P111","section":"Reading / Questions","originalNumber":3,"originalStem":"Why do dams cause problems for migrating fish? ____________________________________________________________________________________________________ ____________________________________________________________________________________________________","kind":"adapted"},"stem":"Why can a dam create problems for migratory fish?","options":[{"id":"A","text":"It removes the need for fish to eat.","why":""},{"id":"B","text":"It interferes with movement needed for feeding and reproduction.","why":"第7段说明鱼需要上下游移动以觅食和繁殖，而大坝改变或阻断这样的通路。"},{"id":"C","text":"It makes all river water salty.","why":""},{"id":"D","text":"It causes fish to lose every ability to swim.","why":""}],"answer":"B","explanation":"第7段说明鱼需要上下游移动以觅食和繁殖，而大坝改变或阻断这样的通路。","evidence":[{"page":"P110","paragraph":7,"quote":"Dams especially affect migratory fish, like salmon and trout, because they need to move upstream and downstream for feeding and reproduction.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P110-E2-01","page":"P110","skill":"E2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P110","exercisePage":"P111","section":"Reading / Questions","originalNumber":8,"originalStem":"Name one benefit and one drawback of the construction of Three Gorges Dam. ____________________________________________________________________________________________________ ____________________________________________________________________________________________________","kind":"adapted"},"stem":"Which description best captures the author’s treatment of large dams?","options":[{"id":"A","text":"The author presents only benefits and no drawbacks.","why":""},{"id":"B","text":"The author says dams have never served any purpose.","why":""},{"id":"C","text":"The author explains benefits and also describes serious environmental and social costs.","why":"第2—6段讲灌溉、供水、航运和发电；第7段补充环境与迁居问题。评价需同时考虑两面。"},{"id":"D","text":"The author discusses only beavers and no human structures.","why":""}],"answer":"C","explanation":"第2—6段讲灌溉、供水、航运和发电；第7段补充环境与迁居问题。评价需同时考虑两面。","evidence":[{"page":"P110","paragraph":3,"quote":"Water that pools behind these structures can also supply drinking water to cities and towns.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P110","paragraph":6,"quote":"Many modern dams harness the power of flowing water, transforming its energy into electricity.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P110","paragraph":7,"quote":"Three Gorges Dam has created controversy, for many of the same reasons that other large dams have.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P110-C4-01","page":"P110","skill":"C4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P110","exercisePage":"P111","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"The root “hydro-” refers to water. How does it help explain “hydroelectric”?","options":[{"id":"A","text":"It describes a dam with no water nearby.","why":""},{"id":"B","text":"It means electricity is produced only by wind.","why":""},{"id":"C","text":"It names a kind of dry farming without irrigation.","why":""},{"id":"D","text":"It identifies electricity generated using the energy of flowing water.","why":"词根 hydro- 与 water 有关，结合第6段将 flowing water 的能量转成 electricity 的说明，可推知词义。"}],"answer":"D","explanation":"词根 hydro- 与 water 有关，结合第6段将 flowing water 的能量转成 electricity 的说明，可推知词义。","evidence":[{"page":"P110","paragraph":6,"quote":"Many modern dams harness the power of flowing water, transforming its energy into electricity.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P110","paragraph":6,"quote":"These dams are hydroelectric dams.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P112-E3-01","page":"P112","skill":"E3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P112","exercisePage":"P113","section":"Reading / Questions","originalNumber":7,"originalStem":"Based on the selection, what is the author’s opinion of the Grand Coulee Dam? How do you know? ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"What is the author’s overall tone toward the Grand Coulee Dam?","options":[{"id":"A","text":"Admiring, while acknowledging its costs","why":"amazing、enormous、incredible 等用词及建议参观显示赞叹；第5—6段又承认对部族和环境的损失，因此不能说只写赞美。"},{"id":"B","text":"Completely indifferent to its size and power","why":""},{"id":"C","text":"Entirely hostile, with no mention of achievements","why":""},{"id":"D","text":"Humorous about a fictional structure.","why":""}],"answer":"A","explanation":"amazing、enormous、incredible 等用词及建议参观显示赞叹；第5—6段又承认对部族和环境的损失，因此不能说只写赞美。","evidence":[{"page":"P112","paragraph":1,"quote":"The Grand Coulee Dam, on the Columbia River in Washington State, is one of humankind’s most amazing structures.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P112","paragraph":5,"quote":"Although the dam proved to be beneficial to the area and to the nation, there were also drawbacks to its existence.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P112","paragraph":8,"quote":"With its enormous size and incredible power, no wonder it is often considered to be the Eighth Wonder of the World.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P112-B3-01","page":"P112","skill":"B3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P112","exercisePage":"P113","section":"Reading / Questions","originalNumber":2,"originalStem":"Why does the author say that the money the government paid could not buy back what the Colville tribe had lost? ________________________________________________________________________________ ________________________________________________________________________________","kind":"adapted"},"stem":"Why does the author say money could not buy back what the Colville tribe lost?","options":[{"id":"A","text":"The government paid the tribe in a currency no one used.","why":""},{"id":"B","text":"Land, ways of life, and disruption cannot all be restored by payment alone.","why":"第5段提到迁离原居地与主要食物来源受影响，第6段说补偿无法买回所失，暗示损失包括不可简单以金钱恢复的生活和文化联系。"},{"id":"C","text":"The author says the tribe did not actually have to move.","why":""},{"id":"D","text":"The tribe lost only a small shop receipt.","why":""}],"answer":"B","explanation":"第5段提到迁离原居地与主要食物来源受影响，第6段说补偿无法买回所失，暗示损失包括不可简单以金钱恢复的生活和文化联系。","evidence":[{"page":"P112","paragraph":5,"quote":"The land of Native American tribes who lived along the Columbia River was flooded after the construction of the dam, and they were forced to move to new areas.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P112","paragraph":5,"quote":"In addition, the dam disrupted the migration of salmon, a staple of their diet.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P112","paragraph":6,"quote":"Although the tribe received millions of dollars, the money could not buy back what its members and their relatives had lost.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P112-B1-01","page":"P112","skill":"B1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P112","exercisePage":"P113","section":"Reading / Questions","originalNumber":3,"originalStem":"How long did it take to complete construction on the Grand Coulee Dam? ________________________________________________________________________________","kind":"adapted"},"stem":"How long did construction take?","options":[{"id":"A","text":"Nine years","why":"第2段明确给出1933年开工、1942年完成，并直接写 nine years。"},{"id":"B","text":"Nineteen years","why":""},{"id":"C","text":"Three years","why":""},{"id":"D","text":"Forty-two years","why":""}],"answer":"A","explanation":"第2段明确给出1933年开工、1942年完成，并直接写 nine years。","evidence":[{"page":"P112","paragraph":2,"quote":"When the dam was finally completed in 1942, nine years after it was begun, it was the largest dam in the world.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P114-C4-01","page":"P114","skill":"C4","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P114","exercisePage":"P115","section":"Reading / Questions","originalNumber":2,"originalStem":"The Greek root graph means write. Find a word in paragraph 9 with the root graph. _____________________________________________________________________" -fiction story about space travel","why":""}],"answer":"A","explanation":"人物对话和学校书展的情节符合现实生活可能发生的故事；文章不是本人回忆录，也没有超自然事件。","evidence":[{"page":"P116","paragraph":1,"quote":"Tanika and Caleb sat at a large round table in the library with their teacher, Mr.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P116","paragraph":2,"quote":"“We have the totals from last weekend’s book fair, and we wanted to share them with you,” he continued.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P116-C1-01","page":"P116","skill":"C1","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P116","exercisePage":"P117","section":"Reading / Questions","originalNumber":7,"originalStem":"In paragraph 6, what does allocating mean? ________________________________________","kind":"adapted"},"stem":"What does “allocating” mean in paragraph 6?","options":[{"id":"A","text":"Counting how many students are absent","why":""},{"id":"B","text":"Deciding how to distribute or use the money","why":"紧随其后的 necessities、remaining money、how...will be used 说明讨论的是资金分配。"},{"id":"C","text":"Returning all books to their shelves","why":""},{"id":"D","text":"Canceling a project before it begins.","why":""}],"answer":"B","explanation":"紧随其后的 necessities、remaining money、how...will be used 说明讨论的是资金分配。","evidence":[{"page":"P116","paragraph":6,"quote":"Rutledge, “we’ve decided that we could use your help in allocating the money we raised.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P116","paragraph":6,"quote":"However, it has not yet been decided how the remaining money will be used.","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P116-F2-01","page":"P116","skill":"F2","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P116","exercisePage":"P117","section":"Reading / Questions","originalNumber":1,"originalStem":"Why do Caleb and Tanika think that the students should be able to vote on the books that will be added to the library? ________________________________________ ________________________________________","kind":"adapted"},"stem":"What does Caleb’s suggestion about letting students choose books reveal?","options":[{"id":"A","text":"He wants all credit and all decisions for himself.","why":""},{"id":"B","text":"He appreciates the contributions of others.","why":"他先说每个班都有贡献，再建议让大家参与选书，以此表达感谢和分享成果。"},{"id":"C","text":"He believes only adults helped with the fair.","why":""},{"id":"D","text":"He dislikes the idea of adding books to the library.","why":""}],"answer":"B","explanation":"他先说每个班都有贡献，再建议让大家参与选书，以此表达感谢和分享成果。","evidence":[{"page":"P116","paragraph":7,"quote":"Students from every class contributed, and it would be nice if there was a way we could show our appreciation.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P116","paragraph":7,"quote":"Could they help decide which books will be added to the library’s collection?”","why":"结合这处原文核对题干中的限定与结论。"}]},{"id":"R6-P118-A3-01","page":"P118","skill":"A3","source":{"grade":6,"book":"Spectrum Reading Grade 6","passagePage":"P118","exercisePage":"P119","section":"Reading / Questions","originalNumber":null,"originalStem":"","kind":"supplement"},"stem":"Which title would best summarize the passage?","options":[{"id":"A","text":"Louis Sachar: His Path to Writing and His Creative Process","why":"前半篇写他如何成为全职作家，后半篇写灵感、写作和修改方式，标题需要概括两部分。"},{"id":"B","text":"A Complete Guide to Learning Russian","why":""},{"id":"C","text":"The Rules of an Elementary School Playground","why":""},{"id":"D","text":"How Every Writer Must Become a Lawyer","why":""}],"answer":"A","explanation":"前半篇写他如何成为全职作家，后半篇写灵感、写作和修改方式，标题需要概括两部分。","evidence":[{"page":"P118","paragraph":5,"quote":"In 1989, Sachar quit his job as an attorney and became a writer.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P118","paragraph":6,"quote":"Sachar spends about two hours writing each morning, when he feels most fresh and sharp.","why":"结合这处原文核对题干中的限定与结论。"},{"page":"P118","paragraph":8,"quote":"In fact, he may rewrite his story five or six times before he even sends it to his publisher.","why":"
